}

function renderXGBChart(cs,hA,aA){
  var snaps=cs._allSnapshots;
  if(!snaps||snaps.length<2)return'<div class="wp-canvas" style="height:40px;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:var(--fg-dim)">XGB data available after tonight\'s games</span></div>';
  var pts=snaps.filter(function(s){return s.xgb_win_prob!=null&&s.period&&s.period<=4;});
  if(pts.length<2)return'<div class="wp-canvas" style="height:40px;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:var(--fg-dim)">No XGB data yet</span></div>';
  var W=600,H=80;
  // XGB is ctrl-team-relative. We need to plot from HOME perspective for consistency with ESPN WP.
  // When ctrl=home, xgb_win_prob IS home WP. When ctrl=away, home WP = 1 - xgb_win_prob.
  var pathD='',fillD='M0,'+H/2,fillDownD='M0,'+H/2;
  for(var i=0;i<pts.length;i++){
    var px=(i/(pts.length-1))*W;
    var xVal=Number(pts[i].xgb_win_prob);
    var homeWP=(pts[i].floor_team===hA)?xVal:(1-xVal);
    var py=(1-homeWP)*H;
    if(i===0)pathD+='M'+px.toFixed(1)+','+py.toFixed(1);
    else pathD+='L'+px.toFixed(1)+','+py.toFixed(1);
    fillD+='L'+px.toFixed(1)+','+Math.min(py,H/2).toFixed(1);
    fillDownD+='L'+px.toFixed(1)+','+Math.max(py,H/2).toFixed(1);
  }
  fillD+='L'+W+','+H/2+'Z';
  fillDownD+='L'+W+','+H/2+'Z';
  var lastPt=pts[pts.length-1];
  var lastXVal=Number(lastPt.xgb_win_prob);
  var lastHomeWP=(lastPt.floor_team===hA)?lastXVal:(1-lastXVal);
  var lastX=W,lastY=(1-lastHomeWP)*H;
  // Also overlay floor score as a faint line for comparison
  var floorPath='';
  for(var j=0;j<pts.length;j++){
    var fpx=(j/(pts.length-1))*W;
    var fVal=Number(pts[j].floor_score||0.5);
    var fHome=(pts[j].floor_team===hA)?fVal:(1-fVal);
    var fpy=(1-fHome)*H;
    if(j===0)floorPath+='M'+fpx.toFixed(1)+','+fpy.toFixed(1);
    else floorPath+='L'+fpx.toFixed(1)+','+fpy.toFixed(1);
  }
  var html='<div class="wp-canvas"><svg class="wp-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  html+='<defs><linearGradient id="xgbFill-'+esc(hA)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#67e8f9" stop-opacity="0.3"/><stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/></linearGradient>';
  html+='<linearGradient id="xgbFillDown-'+esc(hA)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F87171" stop-opacity="0"/><stop offset="100%" stop-color="#F87171" stop-opacity="0.3"/></linearGradient></defs>';
  html+='<line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 4"/>';
  for(var q=1;q<=3;q++)html+='<line x1="'+(q/4*W)+'" y1="0" x2="'+(q/4*W)+'" y2="'+H+'" stroke="rgba(255,255,255,0.04)"/>';
  html+='<path d="'+fillD+'" fill="url(#xgbFill-'+esc(hA)+')"/>';
  html+='<path d="'+fillDownD+'" fill="url(#xgbFillDown-'+esc(hA)+')"/>';
  // Floor score as faint orange reference line
  html+='<path d="'+floorPath+'" fill="none" stroke="#ff6b35" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 2"/>';
  // XGB main line in cyan
  html+='<path d="'+pathD+'" fill="none" stroke="#67e8f9" stroke-opacity="0.85" stroke-width="1.5" stroke-linejoin="round"/>';
  html+='<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="3.5" fill="#67e8f9" opacity="0.3"/>';
  html+='<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="2" fill="#67e8f9"/>';
  html+='<text x="6" y="12" font-size="8" fill="rgba(255,255,255,0.25)" font-family="var(--mono)">'+esc(hA)+'</text>';
  html+='<text x="6" y="'+(H-4)+'" font-size="8" fill="rgba(255,255,255,0.25)" font-family="var(--mono)">'+esc(aA)+'</text>';
  // Legend
  html+='<text x="'+(W-90)+'" y="12" font-size="7" fill="#67e8f9" fill-opacity="0.6" font-family="var(--mono)">XGB</text>';
  html+='<text x="'+(W-50)+'" y="12" font-size="7" fill="#ff6b35" fill-opacity="0.4" font-family="var(--mono)">Floor</text>';
  html+='</svg></div>';
  return html;
}

// ── ESPN WP FETCH ──
async function fetchEspnWP(gameId){
  var espnId=espnGameMap[gameId];if(!espnId)return;
  var cs=cardState[gameId];if(!cs)return;
  try{
    var r=await fetch(FN+'espn-data?type=winprob&league=nba&event_id='+espnId);
    if(!r.ok)return;var data=await r.json();
    if(data.current&&data.current.homeWinPct!=null){
      var g=games.find(function(x){return x.id===gameId;});
      var homeWP=Math.round(data.current.homeWinPct*100);
      cs.espnWP={home:homeWP,away:100-homeWP,opening:data.opening?Math.round(data.opening.homeWinPct*100):null};
      if(data.wpHistory&&data.wpHistory.length>0){
        cs.espnWPHistory=data.wpHistory;
        // Persist for FINAL games so chart survives page reloads
        if(g&&getState(g)==='FINAL'){
          try{localStorage.setItem('nba4:wpHist:'+gameId,JSON.stringify(cs.espnWPHistory));}catch(e){}
        }
      }
      renderCard(gameId);
    }
  }catch(e){console.warn('[ESPN WP]',e.message);}
}

// Shared parser for v2 fields from raw_text (used by both sync paths)
function parseRawTextV2(rawText){
  if(!rawText)return{};
  var t=rawText.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var out={};
  var riskLine=t.match(/RISK:\s*(.+?)(?:\n|$)/);if(riskLine){out.risk=riskLine[1].trim();if(out.risk.toUpperCase().startsWith('NONE'))out.risk=null;}
  var closLine=t.match(/CLOSING:\s*(.+?)(?:\n|$)/);if(closLine)out.closing=closLine[1].trim();
  var narLine=t.match(/NARRATIVE:\s*([\s\S]*?)(?:\n(?:Sustainability|Lead Source|DISAGREEMENT|RISK|CLOSING|FWP|EDGE):|$)/);
  if(narLine)out.narrative=narLine[1].trim();
  if(!out.narrative){var narSimple=t.match(/NARRATIVE:\s*(.+)/);if(narSimple)out.narrative=narSimple[1].trim();}
  var disLine=t.match(/DISAGREEMENT:\s*(.+?)(?:\n|$)/);
  if(disLine){out.disagreement=disLine[1].trim();if(out.disagreement.toUpperCase()==='NONE')out.disagreement=null;}
  return out;
}

function buildIndEvidence(id,cs,hA,aA,indKey,indName,floor){
  var ind=floor[indKey];if(!ind)return'';
  var ctrlIsHome2=!floor.controlTeam||hA.toUpperCase().substring(0,3)===floor.controlTeam.toUpperCase().substring(0,3);
  var ctrlScore2=ind.score!=null?(ctrlIsHome2?ind.score:1-ind.score):0.5;
  var isWon=ctrlScore2>=0.6;
  var isEven=ctrlScore2>=0.4&&ctrlScore2<0.6;
  var ldr=isEven?'EVEN':(isWon?(floor.controlTeam||ind.leader||'?'):(ind.leader||'?'));
  var ldrColor=isEven?'var(--fg-dim)':tc(ldr);

  // Gather stats from box score rollup + PBP
  var box=cs._lastBoxScore;
  var pbp=cs.pbpAudit;
  var html='<div class="ind-evidence">';
  html+='<div class="ind-ev-head"><span class="ind-ev-name">'+indKey+' '+esc(indName)+'</span>';
  html+='<span class="ind-ev-leader" style="color:'+ldrColor+'">'+esc(ldr)+'</span></div>';

  function evRow(label,hVal,aVal,opts){
    opts=opts||{};var inv=opts.invert;
    var hCmp=opts.cmpH!=null?opts.cmpH:parseFloat(String(hVal).replace(/[%]/g,''));
    var aCmp=opts.cmpA!=null?opts.cmpA:parseFloat(String(aVal).replace(/[%]/g,''));
    var hCol='var(--fg-primary)',aCol='var(--fg-primary)';
    if(!isNaN(hCmp)&&!isNaN(aCmp)&&hCmp!==aCmp){
      if(inv){hCol=hCmp<aCmp?'var(--green)':'var(--coral)';aCol=aCmp<hCmp?'var(--green)':'var(--coral)';}
      else{hCol=hCmp>aCmp?'var(--green)':'var(--coral)';aCol=aCmp>hCmp?'var(--green)':'var(--coral)';}
    }
    return'<div class="ind-ev-row"><span class="ind-ev-label">'+label+'</span><div class="ind-ev-vals"><span class="ind-ev-val" style="color:'+hCol+'">'+hA+'</span><span class="ind-ev-val" style="color:'+hCol+'">'+hVal+'</span><span style="color:var(--fg-dim)">-</span><span class="ind-ev-val" style="color:'+aCol+'">'+aVal+'</span><span class="ind-ev-val" style="color:'+aCol+'">'+aA+'</span></div></div>';
  }
  if(box){
    var hPl=box.home_team?.players||[],aPl=box.visitor_team?.players||[];
    function sum(pl,f){var t=0;pl.forEach(function(p){t+=p[f]||0;});return t;}
    if(indKey==='I1'){
      html+=evRow('Steals',sum(hPl,'stl'),sum(aPl,'stl'));
      html+=evRow('Blocks',sum(hPl,'blk'),sum(aPl,'blk'));
      html+=evRow('Turnovers',sum(hPl,'turnover'),sum(aPl,'turnover'),{invert:true});
      if(pbp){
        var hF=pbp.home&&pbp.home.tos?pbp.home.tos.forced||0:0,aF=pbp.away&&pbp.away.tos?pbp.away.tos.forced||0:0;
        html+=evRow('Forced TO',aF,hF);
        var hUF=pbp.home&&pbp.home.tos?pbp.home.tos.unforced||0:0,aUF=pbp.away&&pbp.away.tos?pbp.away.tos.unforced||0:0;
        html+=evRow('Unforced TO',hUF,aUF,{invert:true});
      }
    } else if(indKey==='I2'){
      if(pbp){
        var hRimM=pbp.home.rim?pbp.home.rim.made:0,hRimA2=pbp.home.rim?pbp.home.rim.att:0;
        var aRimM=pbp.away.rim?pbp.away.rim.made:0,aRimA2=pbp.away.rim?pbp.away.rim.att:0;
        html+=evRow('Rim FG',hRimM+'/'+hRimA2,aRimM+'/'+aRimA2,{cmpH:hRimA2>0?hRimM/hRimA2:0,cmpA:aRimA2>0?aRimM/aRimA2:0});
        var hPntM=pbp.home.paint?pbp.home.paint.made:0,hPntA2=pbp.home.paint?pbp.home.paint.att:0;
        var aPntM=pbp.away.paint?pbp.away.paint.made:0,aPntA2=pbp.away.paint?pbp.away.paint.att:0;
        html+=evRow('Paint FG',hPntM+'/'+hPntA2,aPntM+'/'+aPntA2,{cmpH:hPntA2>0?hPntM/hPntA2:0,cmpA:aPntA2>0?aPntM/aPntA2:0});
      }
      html+=evRow('FTA',sum(hPl,'fta'),sum(aPl,'fta'));
      html+=evRow('FTM',sum(hPl,'ftm'),sum(aPl,'ftm'));
    } else if(indKey==='I3'){
      var hFGM=sum(hPl,'fgm'),hFGA=sum(hPl,'fga'),h3M=sum(hPl,'fg3m'),h3A=sum(hPl,'fg3a');
      var aFGM=sum(aPl,'fgm'),aFGA=sum(aPl,'fga'),a3M=sum(aPl,'fg3m'),a3A=sum(aPl,'fg3a');
      var hEFG=hFGA>0?((hFGM+0.5*h3M)/hFGA*100).toFixed(1):'--';
      var aEFG=aFGA>0?((aFGM+0.5*a3M)/aFGA*100).toFixed(1):'--';
      html+=evRow('eFG%',hEFG+'%',aEFG+'%');
      html+=evRow('3PT',h3M+'/'+h3A,a3M+'/'+a3A,{cmpH:h3A>0?h3M/h3A:0,cmpA:a3A>0?a3M/a3A:0});
      html+=evRow('Assists',sum(hPl,'ast'),sum(aPl,'ast'));
      var hAR=hFGM>0?Math.round(sum(hPl,'ast')/hFGM*100):0;
      var aAR=aFGM>0?Math.round(sum(aPl,'ast')/aFGM*100):0;
      html+=evRow('Ast Ratio',hAR+'%',aAR+'%');
    } else if(indKey==='I4'){
      // Biggest lead from PBP if available
      if(pbp&&pbp._bdl){
        html+=evRow('Big Lead',pbp._bdl.biggestLeadHome||0,pbp._bdl.biggestLeadAway||0);
      }
      // Per-quarter margins — fallback to boundaries if line_score empty (FINAL from DB)
      var hLine=box.home_team?.line_score||[],aLine=box.visitor_team?.line_score||[];
      if(hLine.length===0&&cs._serverQDBoundaries){
        var bKeys=Object.keys(cs._serverQDBoundaries).map(Number).filter(function(n){return n>0&&!isNaN(n);}).sort(function(a,b){return a-b;});
        hLine=[];aLine=[];
        for(var bi=0;bi<bKeys.length;bi++){
          var b=cs._serverQDBoundaries[bKeys[bi]];
          var prevB=bi>0?cs._serverQDBoundaries[bKeys[bi-1]]:null;
          hLine.push((b.home?.points||0)-(prevB?prevB.home?.points||0:0));
          aLine.push((b.away?.points||0)-(prevB?prevB.away?.points||0:0));
        }
      }
      for(var qi=0;qi<Math.max(hLine.length,aLine.length);qi++){
        var hQ=hLine[qi]||0,aQ=aLine[qi]||0;
        var diff=hQ-aQ;
        html+=evRow('Q'+(qi+1),hQ+' ('+(diff>=0?'+':'')+diff+')',aQ+' ('+((-diff)>=0?'+':'')+(-diff)+')');
      }
      // SubA verdict: biggest lead comparison (75% threshold, >=2 gap)
      var evBLH=pbp&&pbp._bdl?pbp._bdl.biggestLeadHome||0:0;
      var evBLA=pbp&&pbp._bdl?pbp._bdl.biggestLeadAway||0:0;
      var subAWin='EVEN';
      if(evBLH>=evBLA+2&&evBLA<0.75*evBLH)subAWin=hA;
      else if(evBLA>=evBLH+2&&evBLH<0.75*evBLA)subAWin=aA;
      var pctNote=evBLH>evBLA?(evBLH>0?Math.round(evBLA/evBLH*100):0):(evBLA>0?Math.round(evBLH/evBLA*100):0);
      html+='<div class="ind-ev-row"><span class="ind-ev-label">SubA: Big Lead</span><div class="ind-ev-vals" style="color:var(--fg-secondary)">'+(subAWin!=='EVEN'?'<span style="color:var(--green)">'+esc(subAWin)+'</span> ('+pctNote+'% of leader)':'EVEN ('+pctNote+'%)')+'</div></div>';
      // SubB verdict: Q4 quarter delta vs ±2 threshold / season prior pre-Q4
      var per=box.period||hLine.length||0;
      if(per>=4&&hLine.length>=per&&aLine.length>=per){
        var lastH=hLine[hLine.length-1]||0,lastA=aLine[aLine.length-1]||0;
        var qDelta=lastH-lastA;
        var subBWin=qDelta>2?hA:qDelta<-2?aA:'EVEN';
        var subBDisplay=subBWin===aA?-qDelta:qDelta;
        html+='<div class="ind-ev-row"><span class="ind-ev-label">SubB: Q'+per+' (\u00b12)</span><div class="ind-ev-vals" style="color:var(--fg-secondary)">'+(subBWin!=='EVEN'?'<span style="color:var(--green)">'+esc(subBWin)+'</span> ('+(subBDisplay>=0?'+':'')+subBDisplay+')':'EVEN ('+(qDelta>=0?'+':'')+qDelta+')')+'</div></div>';
      } else {
        html+='<div class="ind-ev-row"><span class="ind-ev-label">SubB: Qtr \u0394</span><div class="ind-ev-vals" style="color:var(--fg-dim)">season Q4 prior (server)</div></div>';
      }
      // Lead changes + ties from scoring events
      if(pbp&&pbp.scoringEvents){
        var lc=0,tt=0,prevLead=0;
        pbp.scoringEvents.forEach(function(e){
          if(e.m===0)tt++;
          if((prevLead>0&&e.m<0)||(prevLead<0&&e.m>0))lc++;
          prevLead=e.m;
        });
        html+='<div class="ind-ev-row"><span class="ind-ev-label">Lead Chg / Ties</span><div class="ind-ev-vals" style="color:var(--fg-secondary)">'+lc+' lead changes \u00b7 '+tt+' ties</div></div>';
      }
    } else if(indKey==='I5'){
      // Compute runs6 from scoreLog if missing (backward compat for DB entries without runs6)
      var r6=pbp?pbp.runs6:null;
      if(!r6&&pbp&&pbp._bdl&&pbp._bdl.scoreLog){
        r6=[];var r6T=null,r6P=0;
        pbp._bdl.scoreLog.forEach(function(sl){if(sl.team===r6T){r6P+=sl.pts;}else{if(r6P>=6&&r6T)r6.push({team:r6T,pts:r6P});r6T=sl.team;r6P=sl.pts;}});
        if(r6P>=6&&r6T)r6.push({team:r6T,pts:r6P});
      }
      if(r6&&r6.length>0){
        var hR6=0,aR6=0,hRuns6=[],aRuns6=[];
        r6.forEach(function(r){if(r.team===hA){hR6++;hRuns6.push(r.pts);}else{aR6++;aRuns6.push(r.pts);}});
        html+=evRow('Runs (6+)',hR6,aR6);
        var share=hR6+aR6>0?Math.round(hR6/(hR6+aR6)*100):50;
        html+=evRow('Run Share',share+'%',(100-share)+'%');
        var hRunCol=hR6>aR6?'var(--green)':hR6<aR6?'var(--coral)':'var(--fg-secondary)';
        var aRunCol=aR6>hR6?'var(--green)':aR6<hR6?'var(--coral)':'var(--fg-secondary)';
        html+='<div class="ind-ev-row" style="border-bottom:none"><span class="ind-ev-label">'+esc(hA)+' runs</span><div class="ind-ev-vals" style="color:'+hRunCol+'">'+(hRuns6.length>0?hRuns6.join(', ')+' pts':'none')+'</div></div>';
        html+='<div class="ind-ev-row" style="border-bottom:none"><span class="ind-ev-label">'+esc(aA)+' runs</span><div class="ind-ev-vals" style="color:'+aRunCol+'">'+(aRuns6.length>0?aRuns6.join(', ')+' pts':'none')+'</div></div>';
      }
      var hFGM2=sum(hPl,'fgm'),hFGA2=sum(hPl,'fga'),aFGM2=sum(aPl,'fgm'),aFGA2=sum(aPl,'fga');
      html+=evRow('FG%',hFGA2>0?(hFGM2/hFGA2*100).toFixed(1)+'%':'--',aFGA2>0?(aFGM2/aFGA2*100).toFixed(1)+'%':'--');
    }
  } else {
    html+='<div style="color:var(--fg-dim);font-size:10px">Box score data not loaded</div>';
  }
  html+='</div>';
  return html;
}

function getFloor(cs){
  if(!cs)return null;
  if(cs.sonnetIndicators&&cs.sonnetIndicators.score!=null)return cs.sonnetIndicators;
  if(cs._serverFloor&&cs._serverFloor.score!=null)return cs._serverFloor;
  if(cs.clientInd&&cs.clientInd.score!=null)return cs.clientInd;
  if(cs.rollingWindow&&cs.rollingWindow.available&&cs.rollingWindow.score!=null)return{score:cs.rollingWindow.score,controlTeam:cs.rollingWindow.controlTeam,I1:cs.rollingWindow.I1,I2:cs.rollingWindow.I2,I3:cs.rollingWindow.I3,I4:cs.rollingWindow.I4,I5:cs.rollingWindow.I5,source:cs.rollingWindow.source||'window'};
  return null;
}

async function hydrateFromServerSnapshots(gameId){

  // Quarter data
  try{
    var qdResp=await fetch(FN+'db-api?action=get_quarter_data&game_id='+encodeURIComponent(gameId));

      var qdData=await qdResp.json();

      if(qd&&qd.diffs){cs._serverQuarterDiffs=qd.diffs;}

// ── APPLY AUTO ANALYSES TO CARDS ──
function applyAutoAnalysesToCards(){
  var applied=0;
  Object.keys(autoAnalysisCache).forEach(function(gid){
    var cs=cardState[gid];if(!cs)return;
    var autos=autoAnalysisCache[gid];if(!autos||autos.length===0)return;
    autos.sort(function(a,b){return new Date(a.ts)-new Date(b.ts);});
    var latest=autos[autos.length-1];
    var latestTime=new Date(latest.ts).getTime();
    var localTime=cs.analysisTime?cs.analysisTime.getTime():0;

    // Always build analysisHistory from auto analyses (even if prediction is up to date)
    if(!cs.analysisHistory)cs.analysisHistory=[];
    var existingTriggers={};cs.analysisHistory.forEach(function(h){if(h.source)existingTriggers[h.source]=true;});
    var newEntries=0;
    autos.forEach(function(a){
      var src='auto_'+(a.trigger||'q?');
      if(existingTriggers[src])return;
      var scoreStr='';
      if(a.home_pts!=null&&a.away_pts!=null)scoreStr=a.away_pts+'-'+a.home_pts;
      else if(a.raw_text){var sm=a.raw_text.match(/(\d+)\s*[-\u2013]\s*(\d+)/);if(sm)scoreStr=sm[0];}
      cs.analysisHistory.push({
        time:a.ts?new Date(a.ts).toLocaleTimeString():'?',
        period:a.period||'?',clock:a.clock||'',
        controlTeam:a.control_team||'?',controlScore:a.control_score||null,
        conviction:a.conviction||null,convictionTier:a.conviction_tier||null,
        convictionCombo:a.conviction_combo||null,entry:a.entry||null,
        signal:a.signal||null,score:scoreStr,source:src,
        sustainability:a.sustainability||null
      });
      newEntries++;
    });
    if(newEntries>0)cs.analysisHistory.sort(function(a,b){return(a.time||'').localeCompare(b.time||'');});

    if(latestTime<=localTime&&cs.prediction){
      // Still merge v2 narrative fields from auto analyses (client analyses lack these)
      if(latest.raw_text&&cs.prediction){
        var _v2=parseRawTextV2(latest.raw_text);
        if(_v2.narrative&&!cs.prediction.narrative)cs.prediction.narrative=_v2.narrative;
        if(_v2.risk&&!cs.prediction.risk)cs.prediction.risk=_v2.risk;
        if(_v2.closing&&!cs.prediction.closing)cs.prediction.closing=_v2.closing;
        if(_v2.disagreement&&!cs.prediction.disagreement)cs.prediction.disagreement=_v2.disagreement;
      }
      if(newEntries>0)applied++;return;
    }

    var pred=null,ind=null;
    if(latest.prediction_json){try{pred=typeof latest.prediction_json==='string'?JSON.parse(latest.prediction_json):latest.prediction_json;}catch(e){}}
    if(latest.indicators_json){try{ind=typeof latest.indicators_json==='string'?JSON.parse(latest.indicators_json):latest.indicators_json;}catch(e){}}

    var d={
      entry:latest.entry||null,conviction:latest.conviction||null,
      convictionTier:latest.conviction_tier||null,convictionCombo:latest.conviction_combo||null,
      signal:latest.signal||null,signalType:latest.signal||null,
      sustainability:latest.sustainability||null,leadSource:latest.lead_source||null,
      fwp:latest.fwp||null,edge:latest.edge||null,edgeNum:null,
      narrative:null,risk:null,closing:null,disagreement:null,
      homeValue:pred?pred.homeValue:null,awayValue:pred?pred.awayValue:null,
      source:'auto'
    };
    if(latest.edge){var _enM=String(latest.edge).match(/([+-]?\d+\.?\d*)/);if(_enM)d.edgeNum=parseFloat(_enM[1]);}

    // Extract v2 fields from raw text
    if(latest.raw_text){
      var t=latest.raw_text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      var predLine=t.match(/Prediction:\s*(.+)/i);if(predLine)d.prediction=predLine[1].trim();
      var sigLine=t.match(/SIGNAL:\s*(BUY\s+\w+|NO VALUE|PASS)\s*(?:[---]\s*(.+))?/i);
      if(sigLine){d.signalType=sigLine[1].trim().toUpperCase();d.signalNote=sigLine[2]?sigLine[2].trim():'';}
      var v2f=parseRawTextV2(latest.raw_text);
      d.narrative=v2f.narrative||null;d.risk=v2f.risk||null;
      d.closing=v2f.closing||null;d.disagreement=v2f.disagreement||null;
    }

    if(d.conviction||d.prediction||d.fwp||(d.homeValue&&d.awayValue)){
      cs.prediction=d;cs.analysisTime=new Date(latestTime);
      if(latest.raw_text&&latest.raw_text.length>20)cs.analysis=latest.raw_text;
      if(ind)cs.sonnetIndicators=ind;

      // Sustainability from auto analysis
      if(latest.sustainability){
        var _sp=latest.sustainability.split('|').map(function(s){return s.trim();});
        var _g=games.find(function(x){return x.id===gid;});
        var _hA=_g?.home?.alias||'',_aA=_g?.away?.alias||'';
        var _as={home:{tier:null},away:{tier:null}};
        var _vt=['LOCKED IN','LOCKED','STALLED','DURABLE','MIXED','FRAGILE','UNSUSTAINABLE','COLD','TOO EARLY'];
        _sp.forEach(function(part){var m=part.match(/^(\w+)\s*:\s*(.+)/);if(!m)return;var team=m[1].trim().toUpperCase();var tier=m[2].trim().toUpperCase();var matched=_vt.find(function(t){return tier.includes(t);});if(!matched)return;if(team===_hA)_as.home.tier=matched;else if(team===_aA)_as.away.tier=matched;});
        if(_as.home.tier||_as.away.tier)cs.clientSustainability=_as;
      }
      persistAnalysis(gid,cs);applied++;
    }
  });
  if(applied>0){games.forEach(function(g){renderCard(g.id);});}
}

// ── PARSE SONNET DECISION ──
function parseSonnetDecision(text){
  if(!text)return null;
  try{
    var d={};
    var fwpLine=(text.match(/^FWP:\s*(.+)/im)||[])[1]||'';
    if(fwpLine)d.fwpRaw=fwpLine.trim().replace(/\|.*$/,'').trim();
    var edgeLine=(text.match(/EDGE:\s*(.+)/i)||[])[1]||'';
    if(edgeLine){
      if(!d.fwpRaw){var fwpM=edgeLine.match(/FWP:\s*([^|]+)/i);if(fwpM)d.fwpRaw=fwpM[1].trim().replace(/\|.*$/,'').trim();}
      var edgeVal=edgeLine.replace(/\|?\s*(FWP|MIP):.*/i,'').replace(/\|.*$/,'').trim();
      if(edgeVal){d.edge=edgeVal;var en=parseFloat(edgeVal.replace(/[+%]/g,''));d.edgeNum=isNaN(en)?null:en;}
    }
    if(d.fwpRaw){
      var tsm=d.fwpRaw.match(/([A-Z]{2,4})\s+([\d.]+)%?\s*\/\s*([A-Z]{2,4})\s+([\d.]+)%?/i);
      if(tsm){d.fwpTeam1=tsm[1].toUpperCase();d.fwpVal1=parseFloat(tsm[2]);d.fwpTeam2=tsm[3].toUpperCase();d.fwpVal2=parseFloat(tsm[4]);d.fwp=d.fwpRaw;d.fwpLabeled=true;}
      else{d.fwp=d.fwpRaw;d.fwpLabeled=false;}
    }
    var entryM=text.match(/ENTRY:\s*(OPTIMAL WINDOW|WINDOW OPEN|WINDOW CLOSING|NO WINDOW|FADE)/i);d.entry=entryM?entryM[1]:null;
    var convM=text.match(/CONVICTION:\s*(DOMINANT|STRONG|EARNED|CONDITIONAL|NO ENTRY)/i);d.conviction=convM?convM[1]:null;
    var sustM=text.match(/Sustainability:\s*(.+)/i);d.sustainability=sustM?sustM[1].trim():null;
    var sigM=text.match(/SIGNAL:\s*(BUY\s+\w+|NO VALUE|PASS)\s*(?:[---]\s*(.+))?/i);
    if(sigM){d.signalType=sigM[1].trim().toUpperCase();d.signalNote=sigM[2]?sigM[2].trim():'';}
    var riskM=text.match(/RISK:\s*(.+?)(?:\n|$)/);d.risk=riskM?riskM[1].trim():null;
    if(d.risk&&d.risk.toUpperCase().startsWith('NONE'))d.risk=null;
    var closM=text.match(/CLOSING:\s*(.+?)(?:\n|$)/);d.closing=closM?closM[1].trim():null;
    var narM=text.match(/NARRATIVE:\s*([\s\S]*?)(?:\n(?:Sustainability|Lead Source|DISAGREEMENT|RISK|CLOSING|FWP|EDGE):|$)/);d.narrative=narM?narM[1].trim():null;
    var disM=text.match(/DISAGREEMENT:\s*(.+?)(?:\n|$)/);d.disagreement=disM?disM[1].trim():null;
    if(d.disagreement&&d.disagreement.toUpperCase()==='NONE')d.disagreement=null;
    var predM=text.match(/Prediction:\s*(.+)/i);d.prediction=predM?predM[1].trim():null;
    if(!d.prediction&&!d.conviction&&!d.fwp&&!d.closing)return null;
    return d;
  }catch(e){return null;}
}

// Build minimal SR-shaped summary from BDL box score for analyze.js
function buildV3Summary(boxScore){
  var hTeam=boxScore.home_team?.team||boxScore.home_team||{};
  var aTeam=boxScore.visitor_team?.team||boxScore.visitor_team||{};
  var hA=hTeam.abbreviation||'HOME',aA=aTeam.abbreviation||'AWAY';
  var hPlayers=boxScore.home_team?.players||[];
  var aPlayers=boxScore.visitor_team?.players||[];

  function rollup(players){
    var s={field_goals_made:0,field_goals_att:0,three_points_made:0,three_points_att:0,two_points_made:0,two_points_att:0,free_throws_made:0,free_throws_att:0,assists:0,steals:0,blocks:0,offensive_rebounds:0,defensive_rebounds:0,rebounds:0,turnovers:0,total_turnovers:0,personal_fouls:0,points:0,bench_points:0};
    players.forEach(function(p){s.field_goals_made+=p.fgm||0;s.field_goals_att+=p.fga||0;s.three_points_made+=p.fg3m||0;s.three_points_att+=p.fg3a||0;s.free_throws_made+=p.ftm||0;s.free_throws_att+=p.fta||0;s.assists+=p.ast||0;s.steals+=p.stl||0;s.blocks+=p.blk||0;s.offensive_rebounds+=p.oreb||0;s.defensive_rebounds+=p.dreb||0;s.rebounds+=p.reb||0;s.turnovers+=p.turnover||0;s.personal_fouls+=p.pf||0;s.points+=p.pts||0;});
    s.total_turnovers=s.turnovers;s.two_points_made=s.field_goals_made-s.three_points_made;s.two_points_att=s.field_goals_att-s.three_points_att;
    var fga=s.field_goals_att||1;
    s.field_goals_pct=+(s.field_goals_made/fga*100).toFixed(1);
    s.three_points_pct=s.three_points_att>0?+(s.three_points_made/s.three_points_att*100).toFixed(1):0;
    s.two_points_pct=s.two_points_att>0?+(s.two_points_made/s.two_points_att*100).toFixed(1):0;
    s.free_throws_pct=s.free_throws_att>0?+(s.free_throws_made/s.free_throws_att*100).toFixed(1):0;
    s.effective_fg_pct=+((s.field_goals_made+0.5*s.three_points_made)/fga*100).toFixed(1);
    s.possessions=+(fga-s.offensive_rebounds+s.turnovers+0.4*s.free_throws_att).toFixed(1);
    s.offensive_points_per_possession=s.possessions>0?+(s.points/s.possessions).toFixed(2):0;
    s.points_in_paint=0;s.points_in_the_paint=0;s.points_off_turnovers=0;s.second_chance_pts=0;s.fast_break_pts=0;s.biggest_lead=0;
    return s;
  }
  function mapPlayers(pArr){return pArr.map(function(p){var pl=p.player||{};return{full_name:((pl.first_name||'')+' '+(pl.last_name||'')).trim(),position:pl.position||'',played:(p.min&&p.min!=='0')||(p.pts>0),active:true,starter:p.starter||false,statistics:{minutes:p.min||'0',field_goals_made:p.fgm||0,field_goals_att:p.fga||0,three_points_made:p.fg3m||0,three_points_att:p.fg3a||0,three_points_pct:p.fg3_pct||0,free_throws_made:p.ftm||0,free_throws_att:p.fta||0,assists:p.ast||0,steals:p.stl||0,blocks:p.blk||0,turnovers:p.turnover||0,personal_fouls:p.pf||0,points:p.pts||0}};});}
  var hStats=rollup(hPlayers),aStats=rollup(aPlayers);
  hStats.defensive_points_per_possession=hStats.possessions>0?+(aStats.points/hStats.possessions).toFixed(2):0;
  aStats.defensive_points_per_possession=aStats.possessions>0?+(hStats.points/aStats.possessions).toFixed(2):0;
  return{
    _dataSource:'BDL',status:'inprogress',quarter:boxScore.period||0,clock:normalizeBdlClock(boxScore.time,boxScore.status),
    home:{name:hTeam.name||'',alias:hA,points:boxScore.home_team_score||hStats.points,statistics:hStats,players:mapPlayers(hPlayers),bonus:boxScore.home_in_bonus||false},
    away:{name:aTeam.name||'',alias:aA,points:boxScore.visitor_team_score||aStats.points,statistics:aStats,players:mapPlayers(aPlayers),bonus:boxScore.visitor_in_bonus||false}
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// CLIENT-SIDE BDL INDICATOR COMPUTE — real-time I1-I5 from box score data
// Thresholds match server computeServer() exactly
// ══════════════════════════════════════════════════════════════════════════════

function computeClientIndicators(boxScore, gameId){
  var g=games.find(function(x){return x.id===gameId;});if(!g)return null;
  var cs=cardState[gameId];if(!cs)return null;
  var gs=getState(g);if(gs==='PRE')return null;

  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var hS=boxScore.home_team_score||0,aS=boxScore.visitor_team_score||0;
  if(hS===0&&aS===0)return null;

  // Roll up player stats to team totals
  var hPlayers=boxScore.home_team?.players||[];
  var aPlayers=boxScore.visitor_team?.players||[];
  function rollup(players){
    var s={fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,ast:0,stl:0,blk:0,oreb:0,dreb:0,to:0,pf:0,pts:0};
    players.forEach(function(p){
      s.fgm+=p.fgm||0;s.fga+=p.fga||0;s.tpm+=p.fg3m||0;s.tpa+=p.fg3a||0;
      s.ftm+=p.ftm||0;s.fta+=p.fta||0;s.ast+=p.ast||0;s.stl+=p.stl||0;
      s.blk+=p.blk||0;s.oreb+=p.oreb||0;s.dreb+=p.dreb||0;
      s.to+=p.turnover||0;s.pf+=p.pf||0;s.pts+=p.pts||0;
    });
    s.poss=+(s.fga-s.oreb+s.to+0.4*s.fta).toFixed(1);
    return s;
  }
  var hs=rollup(hPlayers),as=rollup(aPlayers);
  var pbp=cs.pbpAudit||null;

  // ── I1: Disruption & Conversion ──

  return{home:home,away:away,homeAlias:hA,awayAlias:aA,totalShots:shots.length,totalTOs:turnovers.length,runs:runs,runs6:runs6,raw:{shots:shots,turnovers:turnovers},scoringEvents:scoringEvents,_bdl:{potHome:potH,potAway:potA,scpHome:scpH,scpAway:scpA,biggestLeadHome:bigH,biggestLeadAway:bigA,scoreLog:scoreLog}};
}

async function triggerAnalysis(gameId){
  var cs=cardState[gameId];if(!cs)return;
  if(cs.analyzing&&cs._analyzeStart&&(Date.now()-cs._analyzeStart>60000))cs.analyzing=false;
  if(cs.analyzing)return;
  cs.analyzing=true;cs._analyzeStart=Date.now();
  renderCard(gameId);

  var g=games.find(function(x){return x.id===gameId;});
  var hA=g?.home?.alias||'HOME',aA=g?.away?.alias||'AWAY';

  try{
    // 1. Fetch BDL box score for summaryData
    var bdlId=bdlGameMap[gameId];
    var summaryData=null;
    if(bdlId){
      try{
        var d=getSlateDate(dateOffset);
        var boxRes=await bdl('box_scores',{date:d.str});
        var boxArr=boxRes.data||[];
        var match=boxArr.find(function(b){return b.id===bdlId;});
        if(match)summaryData=buildV3Summary(match);
      }catch(e){console.warn('[ANALYZE] BDL box score fetch failed:',e.message);}
    }
    if(!summaryData){cs.analyzing=false;renderCard(gameId);console.error('[ANALYZE] No summary data available');return;}

    // 2. Build payload from cardState
    var period=g?.period?'Q'+g.period:'';
    var score=aA+' '+(g?.awayPoints||0)+' - '+hA+' '+(g?.homePoints||0);
    var payload={
      summaryData:summaryData,
      thesis:theses[gameId]||'',
      homeTeam:hA,awayTeam:aA,
      period:period,score:score,
      gameClock:g?.clock||null,gamePeriod:g?.period||0,
      bonusStatus:{home:summaryData.home.bonus||false,away:summaryData.away.bonus||false,homeDouble:false,awayDouble:false},
      oddsData:cs.oddsData||null,
      analysisHistory:cs.analysisHistory&&cs.analysisHistory.length>0?cs.analysisHistory:null,
      trackingData:cs.trackingData||null,
      pbpAudit:cs.pbpAudit?{home:cs.pbpAudit.home,away:cs.pbpAudit.away,homeAlias:cs.pbpAudit.homeAlias,awayAlias:cs.pbpAudit.awayAlias,runs:cs.pbpAudit.runs}:null,
      rollingWindow:cs.rollingWindow||null,
      quarterDiffs:cs._serverQuarterDiffs||null,
      combinedRead:cs.combinedRead||null,
      throughput:cs.throughput?{classification:cs.throughput.classification,deficit:cs.throughput.deficit,remainingPoss:cs.throughput.remainingPoss,fTeam:cs.throughput.fTeam}:null,
      leadSafety:cs.leadSafety?{classification:cs.leadSafety.classification,lead:cs.leadSafety.lead,fTeam:cs.leadSafety.fTeam}:null,
      volumeThreat:cs.volumeThreat||null,
      espnWP:cs.espnWP?{home:cs.espnWP.home,away:cs.espnWP.away,homeAlias:cs.espnWP.homeAlias,awayAlias:cs.espnWP.awayAlias}:null,
    };

    // 3. Call analyze.js
    var ac=new AbortController();var acTimer=setTimeout(function(){ac.abort();},40000);
    var resp=await fetch(FN+'analyze',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    clearTimeout(acTimer);
    if(!resp.ok){var errD=await resp.json().catch(function(){return{error:'HTTP '+resp.status};});throw new Error(errD.error||'Analysis failed');}
    var data=await resp.json();

    // 4. Parse response
    var decision=parseSonnetDecision(data.analysis);
    if(decision){
      cs.prediction=cs.prediction||{};
      if(decision.fwpLabeled&&decision.fwpTeam1&&decision.fwpTeam2){
        var hUp=hA.toUpperCase(),aUp=aA.toUpperCase();
        cs.prediction.fwpLabeled=true;cs.prediction.fwpTeam1=decision.fwpTeam1;cs.prediction.fwpVal1=decision.fwpVal1;cs.prediction.fwpTeam2=decision.fwpTeam2;cs.prediction.fwpVal2=decision.fwpVal2;
        if(decision.fwpTeam1===hUp){cs.prediction.homeFWP=decision.fwpVal1;cs.prediction.awayFWP=decision.fwpVal2;}
        else if(decision.fwpTeam1===aUp){cs.prediction.awayFWP=decision.fwpVal1;cs.prediction.homeFWP=decision.fwpVal2;}
        cs.prediction.homeValue=cs.prediction.homeValue||{};cs.prediction.awayValue=cs.prediction.awayValue||{};
        cs.prediction.homeValue.fwp=cs.prediction.homeFWP;cs.prediction.awayValue.fwp=cs.prediction.awayFWP;
        if(decision.edgeNum!=null){
          var winTeam=cs.prediction.homeFWP>cs.prediction.awayFWP?'home':'away';
          var loseTeam=winTeam==='home'?'away':'home';
          cs.prediction[winTeam+'Value'].edge=decision.edgeNum;
          cs.prediction[loseTeam+'Value']=cs.prediction[loseTeam+'Value']||{};
          cs.prediction[loseTeam+'Value'].edge=-decision.edgeNum;
        }
      }
      if(decision.narrative)cs.prediction.narrative=decision.narrative;
      if(decision.risk)cs.prediction.risk=decision.risk;
      if(decision.closing)cs.prediction.closing=decision.closing;
      if(decision.disagreement)cs.prediction.disagreement=decision.disagreement;
      if(decision.conviction)cs.prediction.convictionTier=decision.conviction;
      if(decision.edgeNum!=null)cs.prediction.edgeNum=decision.edgeNum;
      if(decision.edge)cs.prediction.edge=decision.edge;
      cs.prediction.fwpRaw=decision.fwp||cs.prediction.fwpRaw;
    }
    cs.analysis=data.analysis;
    cs.sustainabilityAudit=data.sustainabilityAudit||null;
    console.log('[ANALYZE] Complete for',hA,'@',aA);
  }catch(e){
    console.error('[ANALYZE] Failed:',e.message);
  }finally{
    cs.analyzing=false;
    renderCard(gameId);
  }
}

async function fetchOddsHistory(gameId){

// ── SWIPE-DOWN-TO-DISMISS ──
(function(){
  var drawer,startY,dy,dragging;
  document.addEventListener('DOMContentLoaded',function(){
    drawer=document.getElementById('drawer');
    drawer.addEventListener('touchstart',function(e){
      startY=e.touches[0].clientY;dy=0;dragging=false;
    },{passive:true});
    drawer.addEventListener('touchmove',function(e){
      var curY=e.touches[0].clientY;dy=curY-startY;
      if(drawer.scrollTop<=0&&dy>0){
        if(!dragging){dragging=true;drawer.style.transition='none';}
        drawer.style.transform='translateY('+dy+'px)';
        e.preventDefault();
      } else if(dragging&&dy<=0){
        // scrolled back up — cancel drag
        dragging=false;drawer.style.transition='';drawer.style.transform='';
      }
    },{passive:false});
    drawer.addEventListener('touchend',function(){
      if(!dragging){return;}
      if(dy>120){
        // Animate to bottom then clean up
        drawer.style.transition='transform .25s ease';
        drawer.style.transform='translateY(100%)';
        setTimeout(function(){
          drawer.style.transition='';drawer.style.transform='';
          drawer.classList.remove('open');
          document.getElementById('drawer-scrim').classList.remove('open');
          document.body.classList.remove('is-locked');
          _drawerGameId=null;
        },260);
      } else {
        // Snap back
        drawer.style.transition='transform .2s ease';
        drawer.style.transform='translateY(0)';
        setTimeout(function(){drawer.style.transition='';drawer.style.transform='';},210);
      }
      dragging=false;dy=0;
    },{passive:true});
  });
})();

async function fetchAlerts(){

function renderDrawer(gameId){
  var el=document.getElementById('drawer-content');if(!el)return;
  var g=games.find(function(x){return x.id===gameId;});if(!g)return;
  var cs=cardState[gameId]||{};
  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var floor=getFloor(cs);var ctrlTeam=floor?floor.controlTeam:hA;
  var html='';

  // ═══ 1. GAME NARRATIVE (horizontal scroll) ═══
  var history=cs.analysisHistory||[];
  if(history.length>0){
    html+='<div class="drawer-section">';
    html+='<div style="display:flex;align-items:center;justify-content:space-between"><div class="drawer-section-title">Game Narrative \u00b7 '+history.length+' reads</div>';
    html+='<span style="font-family:var(--mono);font-size:10px;color:var(--fg-dim)">Q'+(history[0].period||'?')+' \u2192 Q'+(history[history.length-1].period||'?')+'</span></div>';
    html+='<div class="narr-scroll">';
    history.forEach(function(h,i){
      var isLatest=i===history.length-1;
      html+='<div class="narr-card" style="'+(isLatest?'border-color:var(--green-border)':'')+'">';
      html+='<div class="narr-top"><span class="narr-time">Q'+(h.period||'?')+' '+(h.clock||'')+'</span></div>';
      if(h.score)html+='<span class="narr-score">'+esc(h.score)+'</span>';
      if(h.controlTeam&&h.controlScore!=null)html+='<span class="narr-floor" style="color:var(--green)">'+esc(h.controlTeam)+' '+Number(h.controlScore).toFixed(2)+'</span>';
      var detail='';
      if(h.conviction)detail+=h.conviction;
      if(h.convictionCombo)detail+=' \u00b7 '+h.convictionCombo;
      if(h.entry)detail+=(detail?' \u00b7 ':'')+h.entry;
      if(detail)html+='<span class="narr-detail">'+esc(detail)+'</span>';
      if(h.conviction){
        var pCol=h.conviction==='DOMINANT'?'var(--green)':h.conviction==='STRONG'?'var(--green)':h.conviction==='EARNED'?'var(--amber)':'var(--fg-dim)';
        html+='<span class="narr-pill" style="color:'+pCol+';background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2)">'+esc(h.conviction)+'</span>';
      }
      // Sustainability badges
      if(h.sustainability){
        var sp=h.sustainability.split('|').map(function(s){return s.trim();});
        html+='<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:1px">';
        sp.forEach(function(part){
          var m=part.match(/^(\w+)\s*:\s*(.+)/);if(!m)return;
          var tm=m[1].trim(),tier=m[2].trim().toUpperCase();
          var sc=tier.includes('LOCKED')||tier.includes('DURABLE')?'locked':tier.includes('MIXED')||tier.includes('STALLED')?'mixed':tier.includes('FRAGILE')||tier.includes('UNSUSTAINABLE')?'fragile':'mixed';
          html+='<span class="sust-tier '+sc+'" style="font-size:8px;padding:1px 5px">'+esc(tm)+' '+esc(tier.substring(0,4))+'</span>';
        });
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div></div>';
  }

  // ═══ 2. QUARTER DOMINANCE GRID ═══
  html+='<div class="drawer-section">';
  html+='<div class="drawer-section-title">Quarter Dominance</div>';
  var diffs=cs._serverQuarterDiffs;
  if(diffs){
    var ctrlIsHome=ctrlTeam===hA;
    html+='<div style="font-family:var(--mono);font-size:9px;color:var(--fg-dim);margin-bottom:6px">\u2190 from <span style="color:'+tc(ctrlTeam)+'">'+esc(ctrlTeam)+'</span> perspective</div>';
    var statDefs=[
      {label:'PNT',get:function(d){return d.points_in_the_paint||d.points_in_paint||0;}},
      {label:'FTA',get:function(d){return d.free_throws_att||0;}},
      {label:'3PM',get:function(d){return d.three_points_made||0;}},
      {label:'TO',get:function(d){return d.turnovers||d.total_turnovers||0;},invert:true},
      {label:'STL',get:function(d){return d.steals||0;}},
      {label:'AST',get:function(d){return d.assists||0;}}
    ];
    var keys=Object.keys(diffs).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b;});
    html+='<table class="qd-grid"><thead><tr><th></th>';
    statDefs.forEach(function(s){html+='<th>'+s.label+'</th>';});
    html+='</tr></thead><tbody>';
    var deltas={};statDefs.forEach(function(s){deltas[s.label]=[];});
    keys.forEach(function(qk){
      var d=diffs[qk];if(!d||!d.home||!d.away)return;
      var rw=cs.rollingWindow;var isPartial=(rw&&rw.partial_quarter===qk);
      html+='<tr><td>Q'+qk+(isPartial?'*':'')+'</td>';
      statDefs.forEach(function(s){
        var hVal=s.get(d.home);var aVal=s.get(d.away);
        // Delta from control team perspective (raw — no sign inversion)
        var delta=ctrlIsHome?hVal-aVal:aVal-hVal;
        deltas[s.label].push(delta);
        // For TO: negative = fewer TOs = good (green), positive = more TOs = bad (red)
        var cls=s.invert?(delta<0?'pos':delta>0?'neg':'even'):(delta>0?'pos':delta<0?'neg':'even');
        var txt=delta>0?'+'+delta:delta===0?'\u00b7':''+delta;
        html+='<td class="qd-cell '+cls+'">'+txt+'</td>';
      });
      html+='</tr>';
    });
    // ── LIVE QUARTER PARTIAL ──
    var g2=games.find(function(x){return x.id===gameId;});
    var isLive=g2&&getState(g2)==='LIVE';
    if(isLive&&cs._lastBoxScore&&cs._serverQDBoundaries){
      var lastBK=Math.max.apply(null,keys);
      var lastBound=cs._serverQDBoundaries[String(lastBK)];
      if(lastBound&&lastBound.home&&lastBound.away){
        var hPl=cs._lastBoxScore.home_team?.players||[];
        var aPl=cs._lastBoxScore.visitor_team?.players||[];
        function qdRollup(players){var s={steals:0,turnovers:0,total_turnovers:0,free_throws_att:0,three_points_made:0,assists:0,points_in_the_paint:0};players.forEach(function(p){s.steals+=p.stl||0;s.turnovers+=p.turnover||0;s.free_throws_att+=p.fta||0;s.three_points_made+=p.fg3m||0;s.assists+=p.ast||0;});s.total_turnovers=s.turnovers;return s;}
        var hCum=qdRollup(hPl),aCum=qdRollup(aPl);
        // BDL players don't have paint — inject from PBP shot zones if available
        var _noPaint=(hCum.points_in_the_paint===0&&aCum.points_in_the_paint===0);
        if(_noPaint&&cs.pbpAudit&&cs.pbpAudit.home&&cs.pbpAudit.away){
          var _hp=cs.pbpAudit.home,_ap=cs.pbpAudit.away;
          hCum.points_in_the_paint=((_hp.rim?_hp.rim.made:0)+(_hp.paint?_hp.paint.made:0))*2;
          aCum.points_in_the_paint=((_ap.rim?_ap.rim.made:0)+(_ap.paint?_ap.paint.made:0))*2;
          _noPaint=(hCum.points_in_the_paint===0&&aCum.points_in_the_paint===0);
        }
        function qdDiff(cum,bound){var d={};['steals','turnovers','total_turnovers','free_throws_att','three_points_made','assists','points_in_the_paint'].forEach(function(k){d[k]=(cum[k]||0)-(bound[k]||0);});return d;}
        var liveHome=qdDiff(hCum,lastBound.home);
        var liveAway=qdDiff(aCum,lastBound.away);
        var curQ=g2.period||lastBK+1;
        html+='<tr style="border-top:2px solid var(--green-border);background:rgba(52,211,153,0.04)">';
        html+='<td style="white-space:nowrap"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin-right:4px;animation:pulse 1.8s ease-in-out infinite"></span>Q'+curQ+'</td>';
        statDefs.forEach(function(s){
          var hVal=s.get(liveHome);var aVal=s.get(liveAway);
          var delta=ctrlIsHome?hVal-aVal:aVal-hVal;
          deltas[s.label].push(delta);
          var cls=s.invert?(delta<0?'pos':delta>0?'neg':'even'):(delta>0?'pos':delta<0?'neg':'even');
          var txt=delta>0?'+'+delta:delta===0?'\u00b7':''+delta;
          if(s.label==='PNT'&&_noPaint){txt='\u00b7';cls='even';deltas[s.label].pop();}
          html+='<td class="qd-cell '+cls+'">'+txt+'</td>';
        });
        html+='</tr>';
      }
    }
    var hasTrend=deltas[statDefs[0].label].length>=2;
    if(hasTrend){
      html+='<tr><td class="qd-trend" style="color:var(--fg-dim)">TREND</td>';
      statDefs.forEach(function(s){
        var arr=deltas[s.label];if(arr.length<2){html+='<td class="qd-trend qd-cell even">\u25ac</td>';return;}
        var cumSum=arr.reduce(function(a,b){return a+b;},0);
        var lastQ=arr[arr.length-1];
        // For inverted stats (TO): negative = good (green)
        var cumEff=s.invert?-cumSum:cumSum;
        var lastEff=s.invert?-lastQ:lastQ;
        var cumCls=cumEff>0?'pos':cumEff<0?'neg':'even';
        var arrow=lastEff>0.5?'\u25b2':lastEff<-0.5?'\u25bc':'';
        var arrowCls=lastEff>0.5?'pos':lastEff<-0.5?'neg':'';
        var txt=(cumSum>0?'+':'')+cumSum;
        if(cumSum===0)txt='\u00b7';
        html+='<td class="qd-trend qd-cell '+cumCls+'">'+txt+(arrow?'<span style="font-size:7px;margin-left:1px" class="'+arrowCls+'">'+arrow+'</span>':'')+'</td>';
      });
      html+='</tr>';
    }
    html+='</tbody></table>';
  } else {
    html+='<div style="text-align:center;font-family:var(--sans);font-size:12px;color:var(--fg-dim);padding:16px 0">Quarter data not available</div>';
  }
  html+='</div>';

  // ═══ 3. SNAPSHOT HISTORY (from DB snapshots) ═══
  html+='<div class="drawer-section">';
  html+='<div class="drawer-section-title">Snapshot History</div>';
  var allSnaps=cs._allSnapshots;
  if(allSnaps&&allSnaps.length>0){
    // Sample every 3rd + first + last, then REVERSE (most recent first)
    var sampled=[];
    allSnaps.forEach(function(s,i){
      if(i===0||i===allSnaps.length-1||i%3===0)sampled.push(s);
    });
    // Precompute cumulative MF and peak for each sampled snapshot (per-team)
    var mfMap={},pkMap={},teamMF={};
    allSnaps.forEach(function(s,i){
      var team=s.floor_team||'?';
      if(!teamMF[team])teamMF[team]={sum:0,count:0,peak:0};
      teamMF[team].sum+=(s.floor_score||0);
      teamMF[team].count++;
      teamMF[team].peak=Math.max(teamMF[team].peak,s.floor_score||0);
      var idx=sampled.indexOf(s);if(idx>=0){mfMap[idx]=teamMF[team].count>=1?(teamMF[team].sum/teamMF[team].count):null;pkMap[idx]=teamMF[team].peak;}
    });
    sampled.reverse(); // most recent first
    // Build alert lookup by period+clock for cross-reference
    var alertLookup={};((_alertCache[gameId]||[])).forEach(function(a){
      var key='Q'+(a.period||'')+'_'+(a.clock||'');
      if(!alertLookup[key])alertLookup[key]=a;
    });

    // Column toggle state
    if(!cs._snapCols)cs._snapCols={time:true,score:true,margin:true,floor:true,mf:true,xgb:true,peak:false,eros:false,ind:true,conv:true,state:true,tp:false,ls:false,sust:false,grad:true,ml:true,alert:true,dec:true};
    var sc2=cs._snapCols;
    html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;align-items:center">';
    var colDefs=[{k:'time',l:'Time'},{k:'score',l:'Score'},{k:'margin',l:'Margin'},{k:'floor',l:'Floor'},{k:'mf',l:'MF'},{k:'xgb',l:'XGB'},{k:'peak',l:'Peak'},{k:'eros',l:'Eros'},{k:'ind',l:'I1-I5'},{k:'conv',l:'Conv'},{k:'state',l:'State'},{k:'tp',l:'TP'},{k:'ls',l:'LS'},{k:'sust',l:'Sust'},{k:'grad',l:'Grad'},{k:'ml',l:'ML'},{k:'alert',l:'Alert'},{k:'dec',l:'Dec'}];

      if(count>=4||hasI4I5)return'DOM';

      if(sc2.conv){var cv=snapConviction(s,flipInd);var cvColor=cv==='DOM'?'var(--green)':cv==='STR'?'var(--green)':cv==='MOD'?'var(--fg-secondary)':cv==='COND'?'var(--coral)':'var(--fg-dim)';html+='<td style="font-size:9px;color:'+cvColor+'">'+cv+'</td>';}

      if(sc2.ml){

          if(bestOdds.home_ml!=null&&bestOdds.away_ml!=null)mlText=bestOdds.away_ml+'/'+bestOdds.home_ml;
          else if(bestOdds.home_ml!=null)mlText='H:'+bestOdds.home_ml;

      if(sc2.dec)html+='<td style="font-size:9px" class="'+(matchAlert?(matchAlert.agent_decision==='SEND'?'qd-cell pos':'qd-cell neg'):'')+'\">'+(matchAlert?esc(matchAlert.agent_decision||''):'--')+'</td>';
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  } else {

  // ═══ 4. GAME LOG (bottom) ═══

// ── SNAPSHOT COLUMN TOGGLE ──

function snapColsMinimal(gameId){

}

// ── CONFIDENCE TABLE ──
var _confVisible=false;
function toggleConfTable(){
  _confVisible=!_confVisible;
  var el=document.getElementById('conf-table');
  if(_confVisible){renderConfTable();el.style.display='block';}
  else{el.style.display='none';}
}
function renderConfTable(){
  var el=document.getElementById('conf-table');if(!el)return;
  var rows=[];
  games.forEach(function(g){
    var cs=cardState[g.id]||{};
    var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
    var state=getState(g);
    // Floor
    var floor=getFloor(cs);
    var floorTeam=floor?floor.controlTeam:'?';
    var floorScore=floor?floor.score:0;
    var verdict=getVerdict(floorScore);
    // Prediction
    var pred=cs.prediction||{};
    var fwpTeam=null,fwpVal=null,edgeNum=null;
    if(pred.fwpTeam1){
      var v1=pred.fwpVal1||0,v2=pred.fwpVal2||0;
      if(v1>=v2){fwpTeam=pred.fwpTeam1;fwpVal=v1;}else{fwpTeam=pred.fwpTeam2||pred.fwpTeam1;fwpVal=v2;}
    }
    if(pred.homeValue&&pred.awayValue){
      if(pred.homeValue.fwp>=pred.awayValue.fwp){fwpTeam=pred.homeValue.team||hA;fwpVal=pred.homeValue.fwp;edgeNum=pred.homeValue.edge;}
      else{fwpTeam=pred.awayValue.team||aA;fwpVal=pred.awayValue.fwp;edgeNum=pred.awayValue.edge;}
    }
    var conv=pred.convictionTier||pred.conviction||null;
    // Sust
    var sustTier='--';
    var sa=cs.sustainabilityAudit||cs.clientSustainability;
    if(sa){
      var ctrlSide=floorTeam===hA?'home':'away';
      var st=sa[ctrlSide]&&sa[ctrlSide].tier?sa[ctrlSide].tier:sa[ctrlSide]&&sa[ctrlSide].overall?sa[ctrlSide].overall:null;
      if(st)sustTier=st;
    }
    // TP/LS from latest snapshot
    var tpCls='--',lsCls='--';
    var snaps=cs._allSnapshots;
    if(snaps&&snaps.length>0){var ls=snaps[snaps.length-1];tpCls=ls.tp_class||'--';lsCls=ls.ls_class||'--';}
    // ML
    var ml='--';
    if(cs.oddsData){
      var isFloorHome=floorTeam===hA;
      var mlVal=isFloorHome?cs.oddsData.homeML:cs.oddsData.awayML;
      if(mlVal!=null)ml=Number(mlVal)>0?'+'+mlVal:String(mlVal);
    }
    rows.push({gameId:g.id,hA:hA,aA:aA,state:state,hPts:g.homePoints,aPts:g.awayPoints,period:g.period,clock:g.clock,floorTeam:floorTeam,floorScore:floorScore,verdict:verdict,fwpTeam:fwpTeam,fwpVal:fwpVal,edgeNum:edgeNum,conv:conv,sustTier:sustTier,tpCls:tpCls,lsCls:lsCls,ml:ml});
  });
  // Sort: LIVE first, then PRE, then FINAL; within each by floor desc
  var so={LIVE:0,PRE:1,FINAL:2};
  rows.sort(function(a,b){var sa2=so[a.state]??1,sb2=so[b.state]??1;if(sa2!==sb2)return sa2-sb2;return b.floorScore-a.floorScore;});
  var liveN=rows.filter(function(r){return r.state==='LIVE';}).length;
  var html='<div class="ct-head"><span class="ct-title">Confidence Table</span><span class="ct-meta">'+rows.length+' games'+(liveN?' \u00b7 '+liveN+' live':'')+'</span></div>';
  html+='<div class="ct-scroll"><table class="ct-grid"><thead><tr>';
  html+='<th>Game</th><th>Floor</th><th>FWP</th><th>Edge</th><th>Conv</th><th>TP</th><th>LS</th><th>Sust</th><th>ML</th>';
  html+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var badge=r.state==='LIVE'?'<span class="ct-badge live">Q'+(r.period||'?')+'</span> ':r.state==='FINAL'?'<span class="ct-badge fin">F</span> ':'';
    var scoreStr=r.hPts!=null?r.aPts+'\u2013'+r.hPts:'';
    var vColor=r.verdict?r.verdict.label==='DOMINANT'?'var(--green)':r.verdict.label==='STRONG'?'var(--green)':r.verdict.label==='EARNED'?'var(--amber)':'var(--fg-dim)':'var(--fg-dim)';
    var fwpStr=r.fwpVal!=null?'<span style="color:'+tc(r.fwpTeam)+'">'+esc(r.fwpTeam)+'</span> '+r.fwpVal+'%':'--';
    var edgeStr='--';if(r.edgeNum!=null){var ec=r.edgeNum>=5?'var(--green)':r.edgeNum>=1?'var(--amber)':'var(--fg-dim)';edgeStr='<span style="color:'+ec+'">'+(r.edgeNum>=0?'+':'')+r.edgeNum.toFixed(1)+'%</span>';}
    var convColor=r.conv==='DOMINANT'?'var(--green)':r.conv==='STRONG'?'var(--green)':r.conv==='MODEST'||r.conv==='EARNED'?'var(--amber)':'var(--fg-dim)';
    var tpShort=r.tpCls!=='--'?r.tpCls.substring(0,4):r.tpCls;var tpColor=r.tpCls.includes('STRONG')?'var(--green)':r.tpCls.includes('PROB')?'var(--green)':r.tpCls.includes('CONTEST')?'var(--amber)':'var(--fg-dim)';
    var lsShort=r.lsCls!=='--'?r.lsCls.substring(0,4):r.lsCls;var lsColor=r.lsCls.includes('SAFE')?'var(--green)':r.lsCls.includes('CUSH')?'var(--green)':r.lsCls.includes('RISK')?'var(--amber)':r.lsCls.includes('CRIT')?'var(--coral)':'var(--fg-dim)';
    var sustShort=r.sustTier!=='--'?r.sustTier.substring(0,4):r.sustTier;var sustColor=r.sustTier.includes('LOCK')?'var(--green)':r.sustTier.includes('DUR')?'var(--green)':r.sustTier.includes('MIX')?'var(--fg-secondary)':r.sustTier.includes('FRAG')||r.sustTier.includes('UNS')?'var(--coral)':'var(--fg-dim)';
    html+='<tr class="'+(r.state==='FINAL'?'ct-final':'')+'" onclick="toggleConfTable();scrollToGame(\''+r.gameId+'\')">';
    html+='<td>'+badge+'<span style="color:'+tc(r.aA)+'">'+esc(r.aA)+'</span><span style="color:var(--fg-dim)">@</span><span style="color:'+tc(r.hA)+'">'+esc(r.hA)+'</span>'+(scoreStr?' <span style="color:var(--fg-tertiary);font-size:9px">'+scoreStr+'</span>':'')+'</td>';
    html+='<td><span style="color:'+tc(r.floorTeam)+'">'+esc(r.floorTeam)+'</span> <span style="color:'+vColor+'">'+r.floorScore.toFixed(2)+'</span></td>';
    html+='<td>'+fwpStr+'</td>';
    html+='<td>'+edgeStr+'</td>';
    html+='<td style="color:'+convColor+'">'+esc(r.conv||'--')+'</td>';
    html+='<td style="color:'+tpColor+'">'+esc(tpShort)+'</td>';
    html+='<td style="color:'+lsColor+'">'+esc(lsShort)+'</td>';
    html+='<td style="color:'+sustColor+'">'+esc(sustShort)+'</td>';
    html+='<td>'+esc(r.ml)+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
}

// ── DEPTH AUDIT · SHOT ZONES ──
// Efficiency color from made/att
function _dEc(m,a){if(a===0)return'rgba(100,100,120,0.3)';var p=m/a;return p>=0.6?'#00ff88':p>=0.45?'#a8ff78':p>=0.33?'#ffd166':p>=0.2?'#ff9800':'#ff5252';}
function _dEa(m,a,al){if(a===0)return'rgba(100,100,120,'+(al*0.3)+')';var p=m/a;return p>=0.6?'rgba(0,255,136,'+al+')':p>=0.45?'rgba(168,255,120,'+al+')':p>=0.33?'rgba(255,209,102,'+al+')':p>=0.2?'rgba(255,152,0,'+al+')':'rgba(255,82,82,'+al+')';}
// Build zone data from raw shots with per-player breakdowns
function _dZones(rawShots,tm){
  var z={rim:{m:0,a:0,pl:{}},paint:{m:0,a:0,pl:{}},mid:{m:0,a:0,pl:{}},corner3:{m:0,a:0,pl:{}},above3:{m:0,a:0,pl:{}}};
  (rawShots||[]).filter(function(s){return s.tm===tm;}).forEach(function(s){
    var zn=z[s.z];if(!zn)return;zn.a++;if(s.m)zn.m++;
    if(!zn.pl[s.p])zn.pl[s.p]={n:s.p,m:0,a:0};zn.pl[s.p].a++;if(s.m)zn.pl[s.p].m++;
  });
  Object.keys(z).forEach(function(k){z[k].players=Object.values(z[k].pl).sort(function(a,b){return b.a-a.a;});delete z[k].pl;});
  return z;
}

};

// ── SCORING COMPOSITION (from PBP audit zone data) ──
function computeScoringComp(pbp,hA,aA,hPts,aPts){
  if(!pbp||!pbp.home||!pbp.away)return null;
  function breakdown(side,total){
    var rimM=side.rim?side.rim.made||0:0,rimA=side.rim?side.rim.att||0:0;
    var pntM=side.paint?side.paint.made||0:0,pntA=side.paint?side.paint.att||0:0;
    var midM=side.mid?side.mid.made||0:0,midA=side.mid?side.mid.att||0:0;
    var threeM=side.threes?side.threes.made||0:0,threeA=side.threes?side.threes.att||0:0;
    // Combine rim+paint into "paint" category
    var allPaintM=rimM+pntM,allPaintA=rimA+pntA;
    var paintPts=allPaintM*2;
    var threePts=threeM*3;
    var midPts=midM*2;
    var ftPts=Math.max(0,total-paintPts-threePts-midPts);
    // FT made/att not available from PBP zones — estimate made from pts
    var ftM=ftPts,ftA=ftPts>0?Math.round(ftPts/0.78):ftPts; // rough estimate
    var structural=paintPts+ftPts;
    var variance=threePts+midPts;
    var sPct=total>0?Math.round(structural/total*100):0;
    var paintPct=allPaintA>0?Math.round(allPaintM/allPaintA*100):0;
    var threePct=threeA>0?Math.round(threeM/threeA*100):0;
    var midPct=midA>0?Math.round(midM/midA*100):0;
    return{total:total,paint:paintPts,ft:ftPts,three:threePts,midOther:midPts,
      structural:structural,variance:variance,sPct:sPct,vPct:100-sPct,
      paintM:allPaintM,paintA:allPaintA,paintPct:paintPct,
      ftM:ftM,ftA:ftA,
      tpm:threeM,tpa:threeA,threePct:threePct,
      midM:midM,midA:midA,midPct:midPct};
  }
  var h=breakdown(pbp.home,hPts);var a=breakdown(pbp.away,aPts);
  h.team=hA;a.team=aA;
  var margin=hPts-aPts;var absMargin=Math.abs(margin);
  var sDelta=h.structural-a.structural;var vDelta=h.variance-a.variance;
  var leadTeam=margin>=0?hA:aA,trailTeam=margin>=0?aA:hA;
  var leadS=margin>=0?sDelta:-sDelta;var leadV=margin>=0?vDelta:-vDelta;
  // Lead source classification
  var classification='MIXED',durability='';
  if(absMargin<=2){classification='EVEN';durability='Margin too small to classify';}
  else if(leadS>=absMargin*0.6){classification='STRUCTURAL';durability=leadTeam+' lead is structural \u2014 paint/FT drives margin (+'+Math.abs(Math.round(leadS))+')';}
  else if(leadV>=absMargin*0.6){classification='VOLATILE';durability=leadTeam+' lead is variance-driven \u2014 3PT/mid drives margin with uncertain sustainability. Structural favors '+(leadS>=0?leadTeam:trailTeam)+' (+'+Math.abs(Math.round(leadS<0?leadS:leadS))+')';}
  else{classification='MIXED';durability='No single source dominates margin';}
  return{home:h,away:a,structuralDelta:sDelta,varianceDelta:vDelta,leadTeam:leadTeam,classification:classification,durability:durability};
}

// ── BUILD SCORING COMP FROM AVAILABLE DATA ──
function buildScoringCompForCard(gameId){
  var cs=cardState[gameId];if(!cs||!cs.pbpAudit)return;
  var g=games.find(function(x){return x.id===gameId;});if(!g)return;
  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var sc=computeScoringComp(cs.pbpAudit,hA,aA,g.homePoints||0,g.awayPoints||0);
  if(!sc)return;
  // Compute trend arrows from current quarter scoring events vs cumulative
  var sEvts=cs.pbpAudit?cs.pbpAudit.scoringEvents:null;
  if(sEvts&&sEvts.length>=4){
    var maxQ=0;sEvts.forEach(function(e){if(e.q>maxQ)maxQ=e.q;});
    if(maxQ>=2){
      var curQEvts=sEvts.filter(function(e){return e.q===maxQ;});
      if(curQEvts.length>=2){
        // Current quarter structural/variance per team
        var hStructQ=0,aStructQ=0,hVarQ=0,aVarQ=0;
        curQEvts.forEach(function(e){
          var isH=e.tm===sc.home.team;
          if(e.type==='3PT'){if(isH)hVarQ+=e.pts;else aVarQ+=e.pts;}
          else{if(isH)hStructQ+=e.pts;else aStructQ+=e.pts;}
        });
        var qSDelta=hStructQ-aStructQ;
        var qVDelta=hVarQ-aVarQ;
        // Per-quarter average from cumulative (normalize by quarters played)
        var avgS=sc.structuralDelta/maxQ;
        var avgV=sc.varianceDelta/maxQ;
        sc.structTrend=qSDelta>avgS+2?'up':qSDelta<avgS-2?'down':'flat';
        sc.varTrend=qVDelta>avgV+2?'up':qVDelta<avgV-2?'down':'flat';
        sc.trendQ='Q'+maxQ;
      }
    }
  }
  cs.scoringComp=sc;renderCard(gameId);
}

// ── FETCH PBP DATA FROM DB ──
async function fetchPBPFromDB(gameId,force){
  if(!dbReady)return;
  var cs=cardState[gameId];if(!cs)return;
  if(cs.pbpAudit&&cs.pbpAudit.raw&&cs.pbpAudit.raw.shots&&!force)return;
  try{
    var r=await fetch(FN+'db-api?action=get_pbp&game_id='+encodeURIComponent(gameId));
    if(!r.ok)return;var data=await r.json();
    if(data.pbp){
      // Hydrate box score from DB if not already loaded (for evidence panel)
      if(!cs._lastBoxScore&&data.box_score){
        var db=data.box_score;
        cs._lastBoxScore={
          home_team_score:db.home_pts||0,visitor_team_score:db.away_pts||0,
          home_team:{players:[{stl:db.home.stl||0,blk:db.home.blk||0,turnover:db.home.to||0,fta:db.home.fta||0,ftm:db.home.ftm||0,fgm:db.home.fgm||0,fga:db.home.fga||0,fg3m:db.home.fg3m||0,fg3a:db.home.fg3a||0,ast:db.home.ast||0,pts:db.home.pts||0,oreb:db.home.oreb||0,pf:db.home.pf||0}]},
          visitor_team:{players:[{stl:db.away.stl||0,blk:db.away.blk||0,turnover:db.away.to||0,fta:db.away.fta||0,ftm:db.away.ftm||0,fgm:db.away.fgm||0,fga:db.away.fga||0,fg3m:db.away.fg3m||0,fg3a:db.away.fg3a||0,ast:db.away.ast||0,pts:db.away.pts||0,oreb:db.away.oreb||0,pf:db.away.pf||0}]},
          _fromDB:true
        };
      }
      // Check if DB has full raw shot data (needed for shot zones + margin flow)
      if(data.pbp.raw&&data.pbp.raw.shots&&data.pbp.raw.shots.length>0){
        cs.pbpAudit=data.pbp;
        cs.pbpTime=new Date(data.saved_at||Date.now());
        cs.pbpWindow=computePBPWindow(data.pbp,data.pbp.homeAlias||'HOME',data.pbp.awayAlias||'AWAY');
        console.log('[PBP] Loaded from DB (with raw shots) for',gameId);
        buildScoringCompForCard(gameId);
        renderCard(gameId);
        return;
      }
      // DB has aggregated data but no raw shots — use aggregates temporarily
      if(data.pbp.scoringEvents||data.pbp.runs){
        cs.pbpAudit=data.pbp;
        cs.pbpTime=new Date(data.saved_at||Date.now());
        buildScoringCompForCard(gameId);
        renderCard(gameId);
      }
    }
  }catch(e){console.warn('[PBP] DB fetch failed:',e.message);}
  // Fallback: fetch BDL plays directly and re-parse (fills in raw shots for zones + margin flow)
  var bdlId=bdlGameMap[gameId];
  if(bdlId){
    try{
      var g=games.find(function(x){return x.id===gameId;});if(!g)return;
      var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
      var plData=await bdl('plays',{game_id:String(bdlId)});
      var plays=plData.data||[];
      if(plays.length>0){
        var pbp=parseBDLPBP(plays,hA,aA);
        if(pbp&&pbp.totalShots>0){
          cs.pbpAudit=pbp;
          cs.pbpTime=new Date();
          cs.pbpWindow=computePBPWindow(pbp,hA,aA);
          console.log('[PBP] Fetched BDL plays directly for',gameId,pbp.totalShots,'shots');
          buildScoringCompForCard(gameId);
          renderCard(gameId);
        }
      }
    }catch(e){console.warn('[PBP] BDL plays fallback failed:',e.message);}
  }
}

// ── RENDER SCORING COMPOSITION ──

  var sTeam=sD>=0?sc.home.team:sc.away.team;

  var sAbs=Math.abs(Math.round(sD)),vAbs=Math.abs(Math.round(vD));
  // Trend arrows for summary
  var sTrA='',vTrA='';
  if(sc.structTrend)sTrA=sc.structTrend==='up'?' \u25b2':sc.structTrend==='down'?' \u25bc':' \u25ac';

  html+='</div>';
  html+='<div class="coll-body'+(isOpen?' open':'')+'">';
  html+='<div class="coll-inner">';

  html+=scoringBar(h);
  html+=scoringBar(a);

  // Legend
  html+='<div class="sc-legend">';

  html+='<span><span class="sc-legend-dot" style="background:var(--green-soft)"></span>FT</span>';

  html+='<span><span class="sc-legend-dot" style="background:var(--fg-dim)"></span>Mid</span>';
  html+='</div>';

  // Structural + Variance deltas with trend arrows
  var sArrow='',vArrow='';
  if(sc.structTrend){
    var sAc=sc.structTrend==='up'?'var(--green)':sc.structTrend==='down'?'var(--coral)':'var(--fg-dim)';
    var sAs=sc.structTrend==='up'?'\u25b2':sc.structTrend==='down'?'\u25bc':'\u25ac';

    var vAs=sc.varTrend==='up'?'\u25b2':sc.varTrend==='down'?'\u25bc':'\u25ac';
    vArrow=' <span style="color:'+vAc+';font-size:10px;margin-left:4px" title="'+esc(sc.trendQ||'')+' trend">'+vAs+'</span>';
  }
  html+='<div class="sc-delta"><span class="sc-delta-label">Structural</span>';
  html+='<span class="sc-delta-val" style="color:var(--green)">'+esc(sTeam)+' +'+Math.abs(Math.round(sD))+sArrow+'</span></div>';

function renderMarginFlowSection(id,cs,hA,aA){
  var pbp=cs.pbpAudit;if(!pbp)return'';

  if(sEvts.length<4&&runs.length===0)return'';

  var bigRun=runs.length>0?runs.reduce(function(a,b){return b.pts>a.pts?b:a;},runs[0]):null;
  var summary=runs.length+' runs'+(bigRun?' <span style="color:var(--fg-dim)">\u00b7</span> <span style="color:'+tc(bigRun.team)+'">'+esc(bigRun.team)+'</span> '+bigRun.pts+'-'+(bigRun.oppPts||0):'');

  var html='<div class="collapsible">';

  html+='<span class="coll-title">Margin Flow</span>';
  html+='<span class="coll-summary">'+summary+'</span>';
  html+='</div>';
  html+='<div class="coll-body'+(isOpen?' open':'')+'">';
  html+='<div class="coll-inner">';

  // SVG margin chart
  if(sEvts.length>=4){
    var W=600,H=220,PL=28,PR=10,PT=20,PB=20;
    var mid=PT+(H-PT-PB)/2;
    var maxAbs=Math.max.apply(null,sEvts.map(function(e){return Math.abs(e.m);}));
    if(maxAbs<4)maxAbs=4;
    var xs=(W-PL-PR)/Math.max(sEvts.length-1,1);
    var ys=((H-PT-PB)/2)/maxAbs;
    var pathD=sEvts.map(function(e,i){return(i===0?'M':'L')+(PL+i*xs).toFixed(1)+','+(mid+e.m*ys).toFixed(1);}).join(' ');

    // Quarter dividers
    var qDivs=[];
    for(var qi=1;qi<sEvts.length;qi++){if(sEvts[qi].q!==sEvts[qi-1].q)qDivs.push({x:PL+(qi-0.5)*xs,label:'Q'+sEvts[qi].q});}

    // Run regions
    var runRegions=runs.map(function(run,ri){
      var fi=run.si!=null?run.si:0;var li=run.ei!=null?run.ei:fi;
      if(fi>=sEvts.length)fi=sEvts.length-1;if(li>=sEvts.length)li=sEvts.length-1;
      var x1=PL+Math.max(0,fi-0.5)*xs;var x2=PL+Math.min(sEvts.length-1,li+0.5)*xs;
      var isA=run.team===aA;var active=selRun===ri;
      return{x1:x1,x2:x2,ri:ri,isA:isA,active:active,tm:run.team,pts:run.pts,opp:run.oppPts||0};
    });

    var svg='<div class="mf-canvas"><svg class="mf-svg" viewBox="0 0 '+W+' '+H+'" style="aspect-ratio:'+W+'/'+H+'">';
    // Run regions (behind everything)
    runRegions.forEach(function(r){
      var bg=r.active?(r.isA?'rgba(248,113,113,0.15)':'rgba(52,211,153,0.15)'):(r.isA?'rgba(248,113,113,0.05)':'rgba(52,211,153,0.05)');
      var brd=r.active?(r.isA?'var(--coral)':'var(--green)'):'transparent';
      svg+='<rect x="'+r.x1.toFixed(1)+'" y="'+(PT-2)+'" width="'+Math.max(r.x2-r.x1,4).toFixed(1)+'" height="'+(H-PT-PB+4)+'" fill="'+bg+'" rx="2" onclick="selectRun(\''+id+'\','+r.ri+')" style="cursor:pointer"/>';
    });
    // Quarter dividers
    qDivs.forEach(function(q){
      svg+='<line x1="'+q.x.toFixed(1)+'" y1="'+(PT-2)+'" x2="'+q.x.toFixed(1)+'" y2="'+(H-PB+2)+'" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,4"/>';
      svg+='<text x="'+q.x.toFixed(1)+'" y="'+(PT-6)+'" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="11" font-family="var(--mono)">'+q.label+'</text>';
    });
    // Zero line
    svg+='<line x1="'+PL+'" y1="'+mid+'" x2="'+(W-PR)+'" y2="'+mid+'" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3,4"/>';
    // Team labels
    svg+='<text x="4" y="'+(PT+8)+'" fill="rgba(52,211,153,0.5)" font-size="11" font-weight="600" font-family="var(--mono)">'+esc(hA)+'</text>';
    svg+='<text x="4" y="'+(H-PB+14)+'" fill="rgba(248,113,113,0.5)" font-size="11" font-weight="600" font-family="var(--mono)">'+esc(aA)+'</text>';
    // Margin path
    svg+='<path d="'+pathD+'" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linejoin="round"/>';
    // Shot markers
    sEvts.forEach(function(ev,i){
      var x=PL+i*xs,y=mid+ev.m*ys;
      var isA=ev.tm===aA;
      var c=isA?'var(--coral)':'var(--green)';
      if(ev.type==='3PT'){
        svg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="none" stroke="'+c+'" stroke-width="1.6" opacity="0.85"/>';
        svg+='<line x1="'+(x-9).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+(x+9).toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+c+'" stroke-width="0.8" opacity="0.65"/>';
        svg+='<line x1="'+x.toFixed(1)+'" y1="'+(y-9).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+(y+9).toFixed(1)+'" stroke="'+c+'" stroke-width="0.8" opacity="0.65"/>';
      } else if(ev.type==='FT'){
        svg+='<rect x="'+(x-4).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" width="8" height="8" rx="1.5" fill="'+c+'" opacity="0.6"/>';
      } else {
        svg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5.5" fill="'+c+'" opacity="0.75"/>';
      }
    });
    // Current margin label
    if(sEvts.length>0){
      var last=sEvts[sEvts.length-1];
      var lx=PL+(sEvts.length-1)*xs;var ly=mid+last.m*ys;
      svg+='<text x="'+(lx-10).toFixed(1)+'" y="'+(ly+(last.m>0?16:-10)).toFixed(1)+'" text-anchor="middle" fill="var(--fg-primary)" font-size="13" font-weight="700" font-family="var(--mono)">'+(last.m>0?'+':'')+last.m+'</text>';
    }
    svg+='</svg></div>';
    html+=svg;

    // Legend
    html+='<div class="mf-legend">';
    html+='<span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="var(--fg-dim)"/></svg> 2PT</span>';
    html+='<span><svg width="18" height="18"><circle cx="9" cy="9" r="6" fill="none" stroke="var(--fg-dim)" stroke-width="1.2"/><line x1="2" y1="9" x2="16" y2="9" stroke="var(--fg-dim)" stroke-width="0.6"/><line x1="9" y1="2" x2="9" y2="16" stroke="var(--fg-dim)" stroke-width="0.6"/></svg> 3PT</span>';
    html+='<span><svg width="12" height="12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="var(--fg-dim)" opacity="0.6"/></svg> FT</span>';
    html+='</div>';
  }

  // Scoring runs list
  if(runs.length>0){
    html+='<div class="run-list">';
    var sorted=runs.slice().sort(function(a,b){return b.pts-a.pts;});
    var maxRP=sorted[0].pts||1;
    sorted.forEach(function(run,i){
      var ri=runs.indexOf(run);
      var isA=run.team===aA;
      var tc=isA?'var(--coral)':'var(--green)';
      var active=selRun===ri;
      // Mechanism bar segments
      var mc={};(run.mechanism||[]).forEach(function(m){mc[m]=(mc[m]||0)+1;});
      var tot=(run.mechanism||[]).length||1;
      html+='<div class="run-row'+(active?' active':'')+'" onclick="selectRun(\''+id+'\','+ri+')">';
      html+='<span class="run-team" style="color:'+tc+'">'+esc(run.team)+'</span>';
      html+='<span class="run-score">'+run.pts+'-'+(run.oppPts||0)+'</span>';
      html+='<div class="run-bar">';
      ['2PT','FT','3PT'].forEach(function(m){
        var ct=mc[m]||0;if(ct===0)return;
        var w=ct/tot*100;
        var col=m==='2PT'?'var(--green)':m==='FT'?'var(--green-soft)':'var(--amber)';
        html+='<div style="width:'+w+'%;height:100%;background:'+col+'"></div>';
      });
      html+='</div>';
      html+='<span class="run-qtr">Q'+(run.q||'?')+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  html+='</div></div></div>';
  return html;
}
