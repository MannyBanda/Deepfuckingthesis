<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0D0E11"/>
<title>DFT · v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#0D0E11;--bg-surface:#16181D;--bg-surface-2:#1C1F26;--bg-surface-3:#22262F;
  --hairline:rgba(255,255,255,0.06);--hairline-strong:rgba(255,255,255,0.10);
  --fg-primary:#F7F7F5;--fg-secondary:#9A9DA6;--fg-tertiary:#6B6E78;--fg-dim:#494D57;
  --green:#34D399;--green-soft:#6EE7B7;--green-dim:rgba(52,211,153,0.14);--green-border:rgba(52,211,153,0.22);
  --amber:#F5B544;--amber-dim:rgba(245,181,68,0.14);--amber-border:rgba(245,181,68,0.22);
  --coral:#F87171;--coral-dim:rgba(248,113,113,0.14);--coral-border:rgba(248,113,113,0.22);
  --blue:#7FA8E0;--blue-dim:rgba(127,168,224,0.14);
  --sans:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-card:16px;--r-inner:12px;--r-button:10px;--r-pill:999px;
  --ease:cubic-bezier(0.2,0.8,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg-base);color:var(--fg-primary);}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.45;letter-spacing:-0.003em;min-height:100vh;padding:0 0 120px 0;background:radial-gradient(1200px 600px at 50% -100px,rgba(52,211,153,0.045),transparent 60%),var(--bg-base);}
input,textarea,select{font-size:16px!important;}

/* ═══ CHROME ═══ */
.chrome{position:sticky;top:0;z-index:20;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--bg-base) 75%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.wordmark{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:0.02em;color:var(--fg-primary);display:flex;align-items:center;gap:10px;}
.wordmark .dot{width:6px;height:6px;border-radius:999px;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.55;transform:scale(0.85);}}
.chrome-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-button);background:var(--bg-surface);border:1px solid var(--hairline);color:var(--fg-secondary);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .15s ease;}
.icon-btn:hover{background:var(--bg-surface-2);color:var(--fg-primary);}

/* ═══ DATE NAV ═══ */
.date-nav{display:flex;gap:6px;padding:4px 16px 8px;}
.date-tab{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--fg-tertiary);background:none;border:1px solid var(--hairline);padding:5px 14px;border-radius:var(--r-pill);cursor:pointer;transition:all .15s ease;}
.date-tab.active{color:var(--green);border-color:var(--green-border);background:var(--green-dim);}

/* ═══ PILLS ═══ */
.pill-strip{display:flex;gap:8px;padding:6px 16px 14px;overflow-x:auto;scrollbar-width:none;}
.pill-strip::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-pill);font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:0.01em;white-space:nowrap;background:var(--bg-surface);border:1px solid var(--hairline);color:var(--fg-secondary);cursor:pointer;transition:all .15s ease;}
.chip:hover{background:var(--bg-surface-2);color:var(--fg-primary);}
.chip.sel{background:rgba(52,211,153,0.08);border-color:var(--green-border);color:var(--green);}
.chip.live{background:rgba(52,211,153,0.10);border-color:var(--green-border);color:var(--green);}
.chip.live::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.8s ease-in-out infinite;}
.chip.done{color:var(--fg-dim);}

.container{padding:0 16px;max-width:720px;margin:0 auto;}
.schedule-meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-tertiary);letter-spacing:0.03em;margin-bottom:14px;padding:0 4px;}
.schedule-meta .accent{color:var(--fg-secondary);}

/* ═══ SWIPE CONTAINER ═══ */
.swipe-container{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0;padding-bottom:4px;width:100%;}
.swipe-container::-webkit-scrollbar{display:none;}
.swipe-card{flex:0 0 100%;scroll-snap-align:center;overflow:hidden;}
.swipe-dots{display:flex;justify-content:center;gap:8px;padding:12px 0 4px;}
.swipe-dot{width:6px;height:6px;border-radius:999px;background:var(--fg-dim);transition:all .2s ease;}
.swipe-dot.active{width:8px;height:8px;background:var(--green);}

/* ═══ GAME CARD ═══ */
.game-card{background:var(--bg-surface);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03),0 1px 2px rgba(0,0,0,0.4),0 8px 24px -12px rgba(0,0,0,0.5);overflow:hidden;max-width:100%;}

/* HERO */
.hero{padding:18px 16px 16px;background:radial-gradient(500px 220px at 50% -40%,rgba(52,211,153,0.06),transparent 70%);}
.hero-meta{display:flex;align-items:center;justify-content:space-between;font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-tertiary);margin-bottom:14px;gap:8px;overflow:hidden;}
.hero-meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.hero-meta .status{color:var(--fg-secondary);font-family:var(--mono);letter-spacing:0.04em;white-space:nowrap;}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;}
.team{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden;}
.team.is-right{text-align:right;align-items:flex-end;}
.team-abbr{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:0.03em;white-space:nowrap;display:flex;align-items:baseline;gap:4px;}
.team.is-right .team-abbr{justify-content:flex-end;}
.team-rank{font-size:10px;font-weight:500;color:var(--fg-tertiary);letter-spacing:0.02em;}
.team-sub{font-family:var(--sans);font-size:10px;color:var(--fg-tertiary);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.score{font-family:var(--mono);font-weight:500;font-size:28px;font-feature-settings:"tnum";letter-spacing:-0.02em;color:var(--fg-primary);white-space:nowrap;padding:0 2px;}
.score .em-dash{color:var(--fg-dim);margin:0 3px;font-weight:400;}
.pre-countdown{padding:20px 22px;text-align:center;}
.pre-countdown .label{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-tertiary);margin-bottom:6px;}
.pre-countdown .time{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--fg-secondary);}
.pre-countdown .sub{font-family:var(--sans);font-size:11px;color:var(--fg-dim);margin-top:8px;}

/* ═══ ESPN WP ═══ */
.wp-chart{padding:12px 16px 8px;border-top:1px solid var(--hairline);}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
.wp-head-left{display:flex;align-items:baseline;gap:8px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-tertiary);}
.wp-head-left .wp-val{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:-0.01em;color:var(--fg-primary);text-transform:none;font-feature-settings:"tnum";}
.wp-head-left .wp-trend{color:var(--green);font-family:var(--mono);font-size:11px;}
.wp-head-right{font-family:var(--mono);font-size:10.5px;color:var(--fg-tertiary);}
.wp-canvas{position:relative;width:100%;height:80px;margin-top:4px;}
.wp-svg{width:100%;height:100%;display:block;overflow:visible;}
.wp-qlabels{display:grid;grid-template-columns:repeat(4,1fr);font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-dim);padding:4px 0 0;}
.wp-qlabels span{text-align:center;}

/* ═══ SECTION ═══ */
.section{padding:16px;border-top:1px solid var(--hairline);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
.section-title{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-secondary);}
.section-aside{font-family:var(--mono);font-size:11px;color:var(--fg-tertiary);}

/* Value table */
.value-table{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:14px;font-feature-settings:"tnum";}
.value-table th{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-dim);text-align:right;padding:0 0 12px;}
.value-table th:first-child{text-align:left;}
.value-table td{padding:12px 0;text-align:right;color:var(--fg-secondary);border-top:1px solid var(--hairline);}
.value-table td:first-child{text-align:left;font-family:var(--sans);font-weight:500;color:var(--fg-primary);letter-spacing:0.04em;}

/* Placeholder sections */
.placeholder{padding:16px;border-top:1px solid var(--hairline);text-align:center;}
.placeholder .ph-label{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px;}
.placeholder .ph-text{font-family:var(--sans);font-size:12px;color:var(--fg-tertiary);}

/* ═══ VALUE READ ═══ */
.value-read{padding:14px 16px 12px;border-top:1px solid var(--hairline);}
.vr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.vr-title{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-secondary);}
.vr-aside{font-family:var(--mono);font-size:10.5px;color:var(--fg-tertiary);}
.vr-table{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:13px;font-feature-settings:"tnum";}
.vr-table th{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-dim);text-align:right;padding:0 0 8px;}
.vr-table th:first-child{text-align:left;}
.vr-table td{padding:8px 6px;text-align:right;color:var(--fg-secondary);border-top:1px solid var(--hairline);}
.vr-table td:first-child{text-align:left;font-family:var(--sans);font-weight:500;letter-spacing:0.04em;}
.vr-table tr.winner td{color:var(--fg-primary);background:rgba(52,211,153,0.08);}
.vr-table tr.winner td:first-child{color:var(--green);font-weight:600;}
.vr-arrow{color:var(--green);font-size:10px;margin-right:2px;}
.conviction-bar{margin-top:10px;padding:8px 12px;background:var(--green-dim);border:1px solid var(--green-border);border-radius:var(--r-inner);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.conv-pill{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--green);white-space:nowrap;}
.conv-detail{font-family:var(--mono);font-size:10.5px;color:var(--fg-tertiary);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ═══ SONNET SIGNAL ═══ */
.sonnet-signal{padding:14px 16px 12px;border-top:1px solid var(--hairline);}
.ss-collapsed{position:relative;padding:12px 14px;background:rgba(52,211,153,0.04);border-left:2px solid var(--green);border-radius:0 var(--r-inner) var(--r-inner) 0;cursor:pointer;transition:background .15s ease;}
.ss-collapsed:active{background:rgba(52,211,153,0.08);}
.ss-text{font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--fg-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:20px;}
.ss-text.expanded{-webkit-line-clamp:unset;overflow:visible;display:none;}
.ss-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.ss-badge{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-pill);}
.ss-badge.risk{color:var(--amber);background:var(--amber-dim);border:1px solid var(--amber-border);}
.ss-badge.disagree{color:var(--coral);background:var(--coral-dim);border:1px solid var(--coral-border);}
.ss-chevron{position:absolute;top:12px;right:10px;font-size:10px;color:var(--fg-dim);transition:transform .2s ease;}
.ss-chevron.open{transform:rotate(90deg);}
.ss-expanded{overflow:hidden;transition:grid-template-rows .25s ease;display:grid;grid-template-rows:0fr;}
.ss-expanded.open{grid-template-rows:1fr;}
.ss-expanded-inner{overflow:hidden;}
.signal-card{padding:10px 14px;margin-top:8px;border-radius:0 var(--r-inner) var(--r-inner) 0;}
.signal-card .sc-label{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px;}
.signal-card .sc-body{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--fg-primary);}
.signal-card.closing{border-left:2px solid var(--green);background:rgba(52,211,153,0.04);}
.signal-card.closing .sc-label{color:var(--green);}
.signal-card.risk{border-left:2px solid var(--amber);background:rgba(245,181,68,0.04);}
.signal-card.risk .sc-label{color:var(--amber);}
.signal-card.disagree{border-left:2px solid var(--coral);background:rgba(248,113,113,0.04);}
.signal-card.disagree .sc-label{color:var(--coral);}
.signal-card.narrative{border-left:2px solid var(--green);background:rgba(52,211,153,0.04);}
.signal-card.narrative .sc-label{color:var(--green);}
.ss-fallback{padding:12px 14px;background:rgba(52,211,153,0.04);border-left:2px solid var(--green-border);border-radius:0 var(--r-inner) var(--r-inner) 0;text-align:center;}
.ss-fallback-text{font-family:var(--sans);font-size:12px;color:var(--fg-tertiary);margin-bottom:8px;}
.analyze-btn{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);padding:8px 16px;border-radius:var(--r-button);cursor:pointer;transition:all .15s ease;}
.analyze-btn:active{background:rgba(52,211,153,0.2);}

/* ═══ STRUCTURAL READ ═══ */
.struct-read{padding:14px 16px 12px;border-top:1px solid var(--hairline);}
.sr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sr-title{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-secondary);}
.sr-pill{font-family:var(--sans);font-size:10px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);}
.sr-pill.green{color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);}
.sr-pill.amber{color:var(--amber);background:var(--amber-dim);border:1px solid var(--amber-border);}
.sr-pill.coral{color:var(--coral);background:var(--coral-dim);border:1px solid var(--coral-border);}
.sr-pill.dim{color:var(--fg-dim);background:var(--bg-surface-2);border:1px solid var(--hairline);}
.floor-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.floor-team{font-family:var(--sans);font-size:11px;font-weight:500;text-transform:uppercase;color:var(--fg-tertiary);min-width:32px;}
.floor-score{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--fg-primary);font-feature-settings:"tnum";min-width:44px;}
.floor-meter{flex:1;height:4px;background:var(--bg-surface-3);border-radius:2px;overflow:hidden;}
.floor-fill{height:100%;border-radius:2px;transition:width .4s ease;}
.floor-verdict{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.04em;white-space:nowrap;}
.ind-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.ind-pill{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:5px 8px;border-radius:6px;background:var(--bg-surface-2);border:1px solid var(--hairline);color:var(--fg-tertiary);white-space:nowrap;}
.ind-pill.won{background:var(--green-dim);border-color:var(--green-border);color:var(--green);}
.ind-pill.even{color:var(--fg-dim);}
.sust-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-family:var(--sans);font-size:11px;}
.sust-label{font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-dim);min-width:60px;font-size:9.5px;}
.sust-team{font-weight:500;color:var(--fg-tertiary);min-width:28px;}
.sust-tier{font-weight:600;padding:2px 8px;border-radius:var(--r-pill);font-size:10px;}
.sust-tier.locked{color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);}
.sust-tier.durable{color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);}
.sust-tier.mixed{color:var(--amber);background:var(--amber-dim);border:1px solid var(--amber-border);}
.sust-tier.fragile{color:var(--coral);background:var(--coral-dim);border:1px solid var(--coral-border);}
.sust-tier.unsustainable{color:var(--coral);background:var(--coral-dim);border:1px solid var(--coral-border);}
.sust-tier.cold{color:var(--blue);background:var(--blue-dim);border:1px solid rgba(127,168,224,0.22);}
.sust-detail{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-left:auto;}
.window-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.window-cell{padding:8px 10px;background:var(--bg-surface-2);border:1px solid var(--hairline);border-radius:var(--r-inner);}
.window-cell-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.window-cell-label{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-dim);}
.window-cell-span{font-family:var(--mono);font-size:9.5px;color:var(--fg-dim);}
.window-cell-val{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--fg-primary);font-feature-settings:"tnum";}
.window-cell-delta{font-family:var(--mono);font-size:10.5px;font-weight:500;margin-left:6px;}
.window-cell-delta.pos{color:var(--green);}
.window-cell-delta.neg{color:var(--coral);}

/* ═══ COLLAPSIBLES ═══ */
.collapsible{border-top:1px solid var(--hairline);}
.coll-header{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;transition:background .12s ease;}
.coll-header:active{background:var(--bg-surface-2);}
.coll-chevron{font-size:9px;color:var(--fg-dim);transition:transform .2s ease;flex:0 0 auto;}
.coll-chevron.open{transform:rotate(90deg);}
.coll-title{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-secondary);}
.coll-summary{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.coll-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;overflow:hidden;}
.coll-body.open{grid-template-rows:1fr;}
.coll-inner{overflow:hidden;padding:0 16px;}
.coll-body.open .coll-inner{padding-bottom:14px;}

/* Scoring comp bars */
.sc-team-row{margin-bottom:10px;}
.sc-team-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.sc-team-name{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--fg-primary);}
.sc-team-sv{font-family:var(--mono);font-size:10px;color:var(--fg-tertiary);}
.sc-bar{height:20px;border-radius:4px;overflow:hidden;display:flex;background:var(--bg-surface-3);}
.sc-seg{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;color:#000;min-width:2px;}
.sc-seg.paint{background:var(--green);}
.sc-seg.ft{background:var(--green-soft);}
.sc-seg.three{background:var(--amber);}
.sc-seg.mid{background:#7a7d85;}
.sc-detail{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-family:var(--mono);font-size:9.5px;margin-bottom:4px;}
.sc-d{display:flex;align-items:center;gap:2px;}
.sc-d.paint{color:var(--green);}
.sc-d.ft{color:var(--green-soft);}
.sc-d.three{color:var(--amber);}
.sc-d.mid{color:#7a7d85;}
.sc-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-family:var(--mono);font-size:9.5px;color:var(--fg-tertiary);}
.sc-legend span{display:flex;align-items:center;gap:3px;}
.sc-legend-dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}
.sc-delta{margin-top:10px;padding:8px 10px;background:var(--bg-surface-2);border:1px solid var(--hairline);border-radius:var(--r-inner);display:flex;align-items:center;justify-content:space-between;}
.sc-delta-label{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--fg-secondary);}
.sc-delta-val{font-family:var(--mono);font-size:12px;font-weight:600;font-feature-settings:"tnum";}

/* Margin flow */
.mf-canvas{position:relative;width:100%;margin:4px 0 6px;}
.mf-svg{width:100%;display:block;}
.mf-legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-family:var(--mono);font-size:9px;color:var(--fg-dim);margin-top:4px;}
.mf-legend span{display:flex;align-items:center;gap:3px;}
.run-list{margin-top:8px;}
.run-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:all .12s ease;margin-bottom:4px;border:1px solid transparent;}
.run-row:active{background:var(--bg-surface-3);}
.run-row.active{background:var(--green-dim);border-color:var(--green-border);}
.run-team{font-family:var(--sans);font-size:11px;font-weight:700;min-width:28px;}
.run-score{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--fg-primary);min-width:36px;}
.run-bar{flex:1;height:12px;border-radius:3px;overflow:hidden;display:flex;background:var(--bg-surface-3);}
.run-qtr{font-family:var(--mono);font-size:10px;color:var(--fg-dim);min-width:20px;text-align:right;}

/* ═══ DRAWER ═══ */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.drawer-scrim.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--bg-surface);border-top:1px solid var(--hairline-strong);border-radius:20px 20px 0 0;z-index:50;transform:translateY(100%);transition:transform .3s var(--ease);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.drawer.open{transform:translateY(0);}
.drawer-handle{display:flex;justify-content:center;padding:10px 0 6px;position:sticky;top:0;background:var(--bg-surface);z-index:1;}
.drawer-handle-bar{width:36px;height:4px;border-radius:2px;background:var(--hairline-strong);}
.drawer-head{padding:4px 20px 14px;display:flex;align-items:center;justify-content:space-between;}
.drawer-title{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--fg-primary);}
.drawer-close{width:30px;height:30px;display:grid;place-items:center;background:var(--bg-surface-2);border:1px solid var(--hairline);border-radius:999px;color:var(--fg-tertiary);font-size:16px;cursor:pointer;}
.drawer-section{padding:0 20px 20px;}
.drawer-section-title{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-secondary);margin-bottom:10px;}

/* Deep dive button */
.deep-dive-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 16px 6px;padding:10px;background:var(--bg-surface-2);border:1px solid var(--hairline);border-radius:var(--r-inner);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--fg-secondary);transition:all .12s ease;}
.deep-dive-btn:active{background:var(--bg-surface-3);color:var(--fg-primary);}

/* Game log */
.gl-row{padding:8px 10px;background:var(--bg-surface-2);border:1px solid var(--hairline);border-radius:var(--r-inner);margin-bottom:6px;}
.gl-row.suppressed{opacity:0.5;}
.gl-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;}
.gl-type{font-family:var(--mono);font-size:11px;font-weight:600;}
.gl-type.send{color:var(--green);}
.gl-type.suppress{color:var(--coral);}
.gl-meta{font-family:var(--mono);font-size:10px;color:var(--fg-dim);}
.gl-reasoning{font-family:var(--sans);font-size:12px;line-height:1.45;color:var(--fg-secondary);}
.gl-badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;margin-right:4px;}
.gl-badge.correct{color:var(--green);background:var(--green-dim);}
.gl-badge.incorrect{color:var(--coral);background:var(--coral-dim);}

/* Narrative scroll */
.narr-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.narr-scroll::-webkit-scrollbar{display:none;}
.narr-card{flex:0 0 160px;padding:10px;background:var(--bg-surface-2);border:1px solid var(--hairline);border-radius:var(--r-inner);display:flex;flex-direction:column;gap:4px;}
.narr-card:last-child{border-color:var(--green-border);}
.narr-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.narr-time{font-family:var(--mono);font-size:10px;color:var(--fg-dim);}
.narr-score{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--fg-primary);font-feature-settings:"tnum";}
.narr-floor{font-family:var(--mono);font-size:12px;font-weight:600;}
.narr-detail{font-family:var(--mono);font-size:9px;color:var(--fg-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.narr-pill{font-family:var(--sans);font-size:9px;font-weight:600;padding:2px 7px;border-radius:var(--r-pill);white-space:nowrap;align-self:flex-start;}

/* Quarter dominance grid */
.qd-grid{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:12px;font-feature-settings:"tnum";}
.qd-grid th{font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-dim);text-align:center;padding:0 4px 8px;}
.qd-grid th:first-child{text-align:left;}
.qd-grid td{text-align:center;padding:6px 4px;border-top:1px solid var(--hairline);}
.qd-grid td:first-child{text-align:left;font-weight:600;color:var(--fg-secondary);}
.qd-cell.pos{color:var(--green);}
.qd-cell.neg{color:var(--coral);}
.qd-cell.even{color:var(--fg-dim);}
.qd-trend{border-top:2px solid var(--hairline-strong)!important;font-size:10px;}

/* ═══ LOADING / ERROR ═══ */
.loading{display:none;padding:40px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--fg-tertiary);}
.loading.show{display:block;}
.err-msg{display:none;padding:12px 16px;margin:0 16px 12px;background:var(--coral-dim);border:1px solid var(--coral-border);border-radius:var(--r-inner);font-family:var(--mono);font-size:11px;color:var(--coral);}
.empty{display:none;padding:60px 20px;text-align:center;font-family:var(--sans);font-size:13px;color:var(--fg-dim);letter-spacing:0.04em;}

/* ═══ TOAST ═══ */
.toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:480px;margin:0 auto;background:var(--bg-surface-2);border:1px solid var(--green-border);border-radius:16px;display:none;flex-direction:column;box-shadow:0 0 0 1px rgba(52,211,153,0.08),0 8px 32px -8px rgba(0,0,0,0.6),0 0 24px -8px rgba(52,211,153,0.35);z-index:60;animation:toastIn 0.5s var(--ease);}
.toast.show{display:flex;}
@keyframes toastIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.toast-handle{display:flex;justify-content:center;padding:8px 0 2px;}
.toast-handle-bar{width:32px;height:3px;border-radius:2px;background:var(--hairline-strong);}
.toast-head{display:flex;align-items:flex-start;gap:10px;padding:4px 14px 6px;}
.toast-dot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 12px var(--green);flex:0 0 auto;margin-top:4px;animation:pulse 1.8s ease-in-out infinite;}
.toast-head-text{flex:1;min-width:0;}
.toast-label{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--green);}
.toast-alert-info{font-family:var(--mono);font-size:11px;color:var(--fg-secondary);margin-top:1px;}
.toast-close{width:28px;height:28px;display:grid;place-items:center;background:transparent;border:1px solid var(--hairline);color:var(--fg-tertiary);border-radius:999px;cursor:pointer;font-size:16px;flex:0 0 auto;}
.toast-game{padding:0 14px 8px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--fg-primary);cursor:pointer;line-height:1.4;}
.toast-game:active{color:var(--green);}
.toast-team-ml{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green);}
.toast-odds-grid{border-top:1px solid var(--hairline);padding:6px 10px 10px;}
.toast-odds-row{display:flex;align-items:center;padding:7px 8px;border-radius:var(--r-inner);transition:background .1s ease;cursor:pointer;}
.toast-odds-row:active{background:rgba(52,211,153,0.08);}
.toast-odds-row.best{background:rgba(52,211,153,0.05);}
.toast-book{flex:1;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--fg-secondary);}
.toast-ml-val{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--fg-primary);min-width:65px;text-align:right;}
.toast-odds-row.best .toast-ml-val{color:var(--green);}
.toast-best-tag{font-family:var(--mono);font-size:8px;font-weight:600;color:var(--green);margin-left:6px;}
.toast-open{font-family:var(--sans);font-size:10px;font-weight:600;color:var(--green);margin-left:10px;white-space:nowrap;}
.toast-no-odds{padding:10px 14px;font-family:var(--sans);font-size:12px;color:var(--fg-dim);text-align:center;}
.chrome-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:999px;background:var(--green);color:var(--bg-surface);font-family:var(--mono);font-size:9px;font-weight:700;place-items:center;display:none;}
.chrome-badge.show{display:grid;}
.icon-btn{position:relative;}

body.is-locked{overflow:hidden;}
</style>
</head>
<body>

<div id="err" class="err-msg"></div>

<div class="chrome">
  <div class="wordmark"><span class="dot"></span><span>DFT</span></div>
  <div class="chrome-actions">
    <button class="icon-btn" title="WP Profiles">WP</button>
    <button class="icon-btn" id="toast-btn" title="Alerts" onclick="showToast()">&#9889;<span class="chrome-badge" id="toast-badge"></span></button>
    <button class="icon-btn" title="Menu">&#9776;</button>
  </div>
</div>

<div class="date-nav" id="date-nav">
  <button class="date-tab" onclick="switchDate(-1)">Yesterday</button>
  <button class="date-tab active" onclick="switchDate(0)">Today</button>
  <button class="date-tab" onclick="switchDate(1)">Upcoming</button>
</div>

<div id="pills" class="pill-strip"></div>

<div class="container">
  <div id="schedule-meta" class="schedule-meta"></div>
  <div id="loading" class="loading">Loading schedule...</div>
  <div id="empty" class="empty">SELECT GAMES ABOVE TO BEGIN</div>
  <div id="swipe" class="swipe-container"></div>
  <div id="dots" class="swipe-dots"></div>
</div>

<div class="toast" id="toast">
  <div class="toast-handle"><div class="toast-handle-bar"></div></div>
  <div class="toast-head">
    <div class="toast-dot"></div>
    <div class="toast-head-text">
      <div class="toast-label" id="toast-label">Entry Signal</div>
      <div class="toast-alert-info" id="toast-alert-info"></div>
    </div>
    <button class="toast-close" onclick="dismissToast()">&times;</button>
  </div>
  <div class="toast-game" id="toast-game" onclick="toastScrollToGame()"></div>
  <div id="toast-odds"></div>
</div>

<div class="drawer-scrim" id="drawer-scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"><div class="drawer-handle-bar"></div></div>
  <div class="drawer-head">
    <span class="drawer-title" id="drawer-title">Deep Dive</span>
    <button class="drawer-close" onclick="closeDrawer()">&times;</button>
  </div>
  <div id="drawer-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// DFT v3 — Phase 1: Shell + Navigation + Hero Rendering
// ══════════════════════════════════════════════════════════════════════════════
window.__nbaVersion = 'v3.0-phase2';
window.__nbaBooted = false;

const FN = '/.netlify/functions/';
const W = {I1:.10, I2:.15, I3:.20, I4:.30, I5:.25};

// ── STATE ──
var games = [], activeGameId = null, pollTimer = null, dateOffset = 0;
var pollInterval = 10000;
const cardState = {};
const theses = JSON.parse(localStorage.getItem('nba4:theses')||'{}');
const standingsCache = {};
var espnGameMap = {};
var dbReady = false;
const bdlGameMap = {};
var dbAnalysisCache = {};
var autoAnalysisCache = {};
var dbSnapshotCache = {};
var _ssExpanded = {}; // track expanded sonnet signal per game

// ── UTILS ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/`/g,'&#96;').replace(/\$\{/g,'&#36;{');}
function ordinal(n){if(!n)return '';return n+(['st','nd','rd'][((n+90)%100-10)%10-1]||'th');}
function getState(g){var s=(g.status||'').toLowerCase();if(s==='closed'||s==='complete'||s==='final')return'FINAL';if(s==='inprogress'||s==='halftime'||s==='in progress'||s.includes('qtr')||s.includes('quarter')||s.includes('half')||s.includes('overtime')||s.includes(' ot')||s==='ot'||/^\d*\s*ot/i.test(s))return'LIVE';return'PRE';}
function getVerdict(s){
  if(s>=.90)return{label:'DOMINANT',color:'var(--green)',lvl:'entry'};
  if(s>=.75)return{label:'STRONG',color:'var(--green)',lvl:'entry'};
  if(s>=.60)return{label:'EARNED',color:'var(--amber)',lvl:'watch'};
  if(s>=.45)return{label:'NO EDGE',color:'var(--coral)',lvl:null};
  return{label:'WAIT',color:'var(--fg-dim)',lvl:null};
}
function sustTierClass(tier){
  if(!tier)return'';var t=tier.toUpperCase();
  if(t==='LOCKED IN'||t==='LOCKED')return'locked';if(t==='DURABLE')return'durable';
  if(t==='MIXED'||t==='STALLED')return'mixed';if(t==='FRAGILE')return'fragile';
  if(t==='UNSUSTAINABLE')return'unsustainable';if(t==='COLD')return'cold';return'';
}
function showLoading(v){document.getElementById('loading').classList.toggle('show',v);}
function showErr(msg){var el=document.getElementById('err');if(msg){el.textContent=msg;el.style.display='block';}else{el.style.display='none';}}
function showToast(label,body){var t=document.getElementById('toast');document.getElementById('toast-label').textContent=label;document.getElementById('toast-body').textContent=body;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(hideToast,8000);}
function hideToast(){document.getElementById('toast').classList.remove('show');}

const ESPN_ALIAS_MAP = {NOP:'NO',GSW:'GS',NYK:'NY',SAS:'SA',PHX:'PHO',BKN:'BKN'};

// ── API HELPERS ──
async function sr(type,params={}){var qs=new URLSearchParams({type,...params}).toString();var r=await fetch(FN+'sr-data?'+qs);if(r.status===429)throw new Error('SR rate limited');if(!r.ok){var d=await r.json().catch(()=>({error:r.statusText}));throw new Error(d.error||'SR error '+r.status);}return r.json();}
async function bdl(type,params={}){var qs=new URLSearchParams({type,...params}).toString();var r=await fetch(FN+'bdl-data?'+qs);if(!r.ok){var d=await r.json().catch(()=>({error:r.statusText}));throw new Error(d.error||'BDL error '+r.status);}return r.json();}

// ── TEAM MAPPINGS ──
const BDL_TEAM_MATCH = {ATL:'Hawks',BOS:'Celtics',BKN:'Nets',CHA:'Hornets',CHI:'Bulls',CLE:'Cavaliers',DAL:'Mavericks',DEN:'Nuggets',DET:'Pistons',GSW:'Warriors',HOU:'Rockets',IND:'Pacers',LAC:'Clippers',LAL:'Lakers',MEM:'Grizzlies',MIA:'Heat',MIL:'Bucks',MIN:'Timberwolves',NOP:'Pelicans',NYK:'Knicks',OKC:'Thunder',ORL:'Magic',PHI:'76ers',PHX:'Suns',POR:'Trail Blazers',SAC:'Kings',SAS:'Spurs',TOR:'Raptors',UTA:'Jazz',WAS:'Wizards'};

// ── BDL NORMALIZATION ──
function normalizeBdlStatus(s,boxScore){
  if(!s)return'scheduled';var sl=s.toLowerCase();
  if(sl==='final')return'closed';
  if(sl==='in progress'||sl.includes('qtr')||sl.includes('quarter')||sl.includes('overtime')||sl.includes(' ot')||sl==='ot'||/^\d*\s*ot/i.test(sl))return'inprogress';
  if(sl==='halftime'||sl.includes('half'))return'halftime';
  if(s.includes('T')&&s.includes(':')){
    if(boxScore){var hasScore=((boxScore.home_team_score||0)+(boxScore.visitor_team_score||0))>0;var hasPeriod=(boxScore.period||0)>0;var hasTime=boxScore.time&&boxScore.time!==''&&!boxScore.time.includes('T');if(hasScore||hasPeriod||hasTime)return'inprogress';}
    try{var _t=new Date(s).getTime();if(!isNaN(_t)&&Date.now()>_t+120000)return'inprogress';}catch(e){}
    return'scheduled';
  }
  return s;
}
function normalizeBdlClock(time,status){
  if(!time)return'';if(time==='Final'||time==='final')return'00:00';
  if(/^END\s|^Half/i.test(time))return'0:00';
  var qMatch=time.match(/^(?:Q\d+|OT\d?)\s+(.+)$/i);if(qMatch)return normalizeBdlClock(qMatch[1],status);
  if(/^:\d/.test(time)){var secs=parseFloat(time.substring(1));if(!isNaN(secs))return'0:'+String(Math.floor(secs)).padStart(2,'0');}
  if(/^\d{1,2}:\d{2}(\.\d)?$/.test(time))return time;
  var iso=time.match(/PT(\d+)M(\d+)(?:\.(\d+))?S/);if(iso)return iso[1]+':'+iso[2].padStart(2,'0');
  if(/^\d+(\.\d+)?$/.test(time)){var sec=parseFloat(time);return Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');}
  return time;
}

// ── SCHEDULE ──
function getSlateDate(offset){
  offset=offset||0;
  var now=new Date();var mst=new Date(now.toLocaleString('en-US',{timeZone:'America/Phoenix'}));
  mst.setDate(mst.getDate()+offset);
  return{year:String(mst.getFullYear()),month:String(mst.getMonth()+1).padStart(2,'0'),day:String(mst.getDate()).padStart(2,'0'),str:mst.getFullYear()+'-'+String(mst.getMonth()+1).padStart(2,'0')+'-'+String(mst.getDate()).padStart(2,'0')};
}

function switchDate(offset){
  dateOffset=offset;
  document.querySelectorAll('.date-tab').forEach(function(tab,i){tab.classList.toggle('active',(i===0&&offset===-1)||(i===1&&offset===0)||(i===2&&offset===1));});
  activeGameId=null;
  document.getElementById('swipe').innerHTML='';
  document.getElementById('dots').innerHTML='';
  clearInterval(pollTimer);loadSchedule();
}

async function buildBdlGameMap(dateStr){
  try{
    var data=await bdl('games',{date:dateStr});var bg=data.data||[];
    for(var g of games){
      var hA=g.home?.alias,aA=g.away?.alias;if(!hA||!aA)continue;
      var hM=BDL_TEAM_MATCH[hA],aM=BDL_TEAM_MATCH[aA];
      var match=bg.find(function(b){return b.home_team?.full_name?.includes(hM)&&b.visitor_team?.full_name?.includes(aM);});
      if(match)bdlGameMap[g.id]=match.id;
    }
    console.log('[BDL] Game map:',Object.keys(bdlGameMap).length,'mapped');
  }catch(e){console.warn('[BDL] Map failed:',e.message);}
}

async function fetchStandings(){
  try{
    var data=await bdl('standings',{season:'2025'});var arr=data.data||[];
    arr.forEach(function(s){var abbr=s.team?.abbreviation||'';if(!abbr)return;standingsCache[abbr]={confRank:s.conference_rank||null,w:s.wins||0,l:s.losses||0,conf:s.team?.conference||''};});
    console.log('[STANDINGS]',Object.keys(standingsCache).length,'teams');
  }catch(e){console.warn('[STANDINGS]',e.message);}
}

async function fetchEspnScoreboard(){
  try{
    var d=getSlateDate(dateOffset);var dateStr=d.year+d.month+d.day;
    var r=await fetch(FN+'espn-data?type=scoreboard&league=nba&date='+dateStr);if(!r.ok)return;
    var data=await r.json();var eg=data.games||[];
    games.forEach(function(g){
      var hA=g.home?.alias||'',aA=g.away?.alias||'';
      var hE=ESPN_ALIAS_MAP[hA]||hA,aE=ESPN_ALIAS_MAP[aA]||aA;
      var match=eg.find(function(e){return(e.homeAbbr===hA||e.homeAbbr===hE)&&(e.awayAbbr===aA||e.awayAbbr===aE);});
      if(match)espnGameMap[g.id]=match.espnId;
    });
    console.log('[ESPN] Mapped',Object.keys(espnGameMap).length+'/'+games.length);
  }catch(e){console.warn('[ESPN]',e.message);}
}

async function loadSchedule(){
  showLoading(true);showErr(null);
  try{
    var lookbackOffset=dateOffset,d,data;
    for(var attempt=0;attempt<(dateOffset<0?5:1);attempt++){
      d=getSlateDate(lookbackOffset);
      var cacheKey='nba4:schedule:'+d.str,cached=null;
      try{cached=JSON.parse(localStorage.getItem(cacheKey));}catch(e){}
      if(cached&&cached.games&&cached.games.length>0){data=cached;}
      else{data=await sr('schedule',{year:d.year,month:d.month,day:d.day});try{localStorage.setItem(cacheKey,JSON.stringify(data));}catch(e){}}
      if((data.games||[]).length>0)break;
      if(dateOffset<0)lookbackOffset--;
    }
    games=(data.games||[]).map(function(g){return{id:g.id,status:g.status,scheduled:g.scheduled,venue:g.venue?.name||'',home:g.home,away:g.away,homePoints:null,awayPoints:null,period:0,clock:'',summary:null,bdlData:null,dataSource:'BDL'};});
    var order={inprogress:0,halftime:0,scheduled:1,closed:2,complete:2,created:1};
    games.sort(function(a,b){var oa=order[a.status]??1,ob=order[b.status]??1;if(oa!==ob)return oa-ob;return new Date(a.scheduled)-new Date(b.scheduled);});
    document.getElementById('schedule-meta').innerHTML='<span class="accent">'+esc(d.str)+'</span><span>&middot;</span><span>'+games.length+' NBA games</span><span>&middot;</span><span>MST</span>';

    await buildBdlGameMap(d.str);

    // BDL status correction
    try{
      var box=await bdl('box_scores',{date:d.str}).catch(function(){return{data:[]};});
      var arr=box.data||[];
      arr.forEach(function(b){
        var gid=Object.keys(bdlGameMap).find(function(k){return bdlGameMap[k]===b.id;});
        if(!gid)return;var g=games.find(function(x){return x.id===gid;});if(!g)return;
        var ns=normalizeBdlStatus(b.status,b);
        g.status=ns;g.homePoints=b.home_team_score||g.homePoints;g.awayPoints=b.visitor_team_score||g.awayPoints;
        g.period=b.period||g.period;g.clock=normalizeBdlClock(b.time,b.status)||g.clock;
      });
      games.sort(function(a,b){var oa=order[a.status]??1,ob=order[b.status]??1;if(oa!==ob)return oa-ob;return new Date(a.scheduled)-new Date(b.scheduled);});
    }catch(e){console.warn('[BDL] Status update failed:',e.message);}

    renderPills();
    mountAllCards();
    if(Object.keys(standingsCache).length===0)fetchStandings();
    fetchEspnScoreboard();

    // ── Phase 2: DB hydration pipeline ──
    if(!dbReady)await initDB();
    if(dbReady){
      // Restore persisted analyses from localStorage
      games.forEach(function(g){
        var cs=cardState[g.id];if(!cs)return;
        var saved=restoreAnalysis(g.id);
        if(saved){
          if(saved.prediction)cs.prediction=saved.prediction;
          if(saved.sonnetIndicators)cs.sonnetIndicators=saved.sonnetIndicators;
          if(saved.analysisTime)cs.analysisTime=new Date(saved.analysisTime);
          if(saved.analysis)cs.analysis=saved.analysis;
          if(saved.sustainabilityAudit)cs.sustainabilityAudit=saved.sustainabilityAudit;
          if(saved.clientSustainability)cs.clientSustainability=saved.clientSustainability;
        }
      });
      // Hydrate from server (staggered to avoid overwhelming)
      games.forEach(function(g,i){
        setTimeout(function(){hydrateFromServerSnapshots(g.id);},i*150);
      });
      // Batch hydration from DB
      syncAnalysesFromDB();
      syncCalibrationAnalyses();
      syncLatestSnapshotsFromDB();
      syncThesesFromDB();
      // PBP for margin flow + scoring comp (staggered)
      games.forEach(function(g,i){
        var gs=getState(g);
        if(gs!=='PRE'){
          setTimeout(function(){fetchPBPFromDB(g.id);},800+i*200);
        }
      });
      // Initial alert poll for toast (fires after hydration)
      setTimeout(function(){pollAlerts();},1500);
    }

    // Start polling for today
    clearInterval(pollTimer);
    if(dateOffset===0){
      pollTimer=setInterval(function(){refreshLiveCards();},pollInterval);
    }
  }catch(e){showErr(e.message);}
  finally{showLoading(false);}
}

// ── BASIC POLL (Phase 1 — score updates only) ──
async function refreshLiveCards(){
  var d=getSlateDate(dateOffset);
  try{
    var box=await bdl('box_scores',{date:d.str});var arr=box.data||[];
    var updated=false;
    games.forEach(function(g){
      var bdlId=bdlGameMap[g.id];if(!bdlId)return;
      var b=arr.find(function(x){return x.id===bdlId;});if(!b)return;
      g.status=normalizeBdlStatus(b.status,b);
      g.homePoints=b.home_team_score||g.homePoints;
      g.awayPoints=b.visitor_team_score||g.awayPoints;
      g.period=b.period||g.period;
      g.clock=normalizeBdlClock(b.time,b.status)||g.clock;
      updated=true;
    });
    if(updated){renderPills();games.forEach(function(g){renderCard(g.id);});}
  }catch(e){console.warn('[POLL]',e.message);}
  // Poll alerts for toast
  pollAlerts();
}

function renderPills(){
  var html='';
  games.forEach(function(g){
    var gs=getState(g);
    var isActive=activeGameId===g.id;
    var cls='chip'+(isActive?' sel':'')+(gs==='LIVE'?' live':'')+(gs==='FINAL'?' done':'');
    var label=(g.away?.alias||'?')+'@'+(g.home?.alias||'?');
    if(gs==='LIVE')label+=' Q'+(g.period||'?');
    else if(gs==='FINAL')label+=' F';
    else try{label+=' '+new Date(g.scheduled).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Phoenix'});}catch(e){}
    html+='<button class="'+cls+'" onclick="scrollToGame(\''+g.id+'\')">'+esc(label)+'</button>';
  });
  document.getElementById('pills').innerHTML=html;
}

function scrollToGame(id){
  var target=document.querySelector('.swipe-card[data-game-id="'+id+'"]');
  if(target){
    target.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    activeGameId=id;
    renderPills();
    renderSwipeDots();
  }
}

function mountAllCards(){
  var swipe=document.getElementById('swipe');
  swipe.innerHTML='';
  games.forEach(function(g){
    if(!cardState[g.id])cardState[g.id]={logs:[],espnWP:null,espnWPHistory:null};
    var div=document.createElement('div');
    div.className='swipe-card';div.dataset.gameId=g.id;
    div.innerHTML='<article class="game-card" id="card-'+g.id+'"></article>';
    swipe.appendChild(div);
    renderCard(g.id);
  });
  // Set first game as active
  if(games.length>0){activeGameId=games[0].id;}
  renderSwipeDots();
  document.getElementById('empty').style.display=games.length?'none':'block';
  // Fetch ESPN WP for all games (staggered to avoid rate limits)
  games.forEach(function(g,i){
    setTimeout(function(){fetchEspnWP(g.id);},i*200);
  });
}

function renderSwipeDots(){
  var html='';
  games.forEach(function(g){
    html+='<span class="swipe-dot'+(g.id===activeGameId?' active':'')+'"></span>';
  });
  document.getElementById('dots').innerHTML=html;
}

// Track which card is centered via scroll
var _scrollDebounce=null;
document.getElementById('swipe').addEventListener('scroll',function(){
  clearTimeout(_scrollDebounce);
  _scrollDebounce=setTimeout(function(){
    var container=document.getElementById('swipe');
    var cards=container.querySelectorAll('.swipe-card');
    var scrollLeft=container.scrollLeft;
    var closestIdx=0,closestDist=Infinity;
    cards.forEach(function(card,i){
      var dist=Math.abs(card.offsetLeft-scrollLeft);
      if(dist<closestDist){closestDist=dist;closestIdx=i;}
    });
    if(cards[closestIdx]){
      var newActive=cards[closestIdx].dataset.gameId;
      if(newActive!==activeGameId){
        activeGameId=newActive;
        renderPills();
        renderSwipeDots();
        // Scroll the active pill into view in the pill strip
        var activePill=document.querySelector('.chip.sel');
        if(activePill)activePill.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
      }
    }
  },80);
});

function renderCard(id){
  var el=document.getElementById('card-'+id);if(!el)return;
  var g=games.find(function(x){return x.id===id;});if(!g)return;
  var cs=cardState[id];if(!cs)return;

  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var hRank=standingsCache[hA],aRank=standingsCache[aA];
  var periodLabel=state==='PRE'?'PRE':state==='FINAL'?'FINAL':({1:'Q1',2:'Q2',3:'Q3',4:'Q4',5:'OT',6:'2OT'}[g.period]||'Q'+g.period);
  var statusText=state==='PRE'?'PRE':'';
  if(state==='LIVE')statusText='LIVE \u00b7 '+periodLabel+(g.clock?' '+g.clock:'');
  else if(state==='FINAL')statusText='FINAL \u00b7 00:00';

  var html='';

  // ═══ HERO ═══
  html+='<div class="hero">';
  html+='<div class="hero-meta"><span>'+esc(g.venue||'')+'</span><span class="status">'+esc(statusText)+'</span></div>';

  if(state==='PRE'){
    var ms=new Date(g.scheduled)-new Date();
    var h=Math.max(0,Math.floor(ms/3600000)),m=Math.max(0,Math.floor((ms%3600000)/60000));
    html+='<div class="score-row"><div class="team"><span class="team-abbr">'+esc(aA)+(aRank?'<span class="team-rank">'+ordinal(aRank.confRank)+'</span>':'')+'</span><span class="team-sub">'+esc(g.away?.name||'')+'</span></div>';
    html+='<div class="score" style="font-size:20px;color:var(--fg-dim)">'+esc((h>0?h+'h ':'')+ m+'m')+'</div>';
    html+='<div class="team is-right"><span class="team-abbr">'+esc(hA)+(hRank?'<span class="team-rank">'+ordinal(hRank.confRank)+'</span>':'')+'</span><span class="team-sub">'+esc(g.home?.name||'')+'</span></div></div>';
  } else {
    html+='<div class="score-row"><div class="team"><span class="team-abbr">'+esc(aA)+(aRank?'<span class="team-rank">'+ordinal(aRank.confRank)+'</span>':'')+'</span><span class="team-sub">'+esc(g.away?.name||'')+'</span></div>';
    html+='<div class="score">'+(g.awayPoints??'\u2014')+'<span class="em-dash">\u2014</span>'+(g.homePoints??'\u2014')+'</div>';
    html+='<div class="team is-right"><span class="team-abbr">'+esc(hA)+(hRank?'<span class="team-rank">'+ordinal(hRank.confRank)+'</span>':'')+'</span><span class="team-sub">'+esc(g.home?.name||'')+'</span></div></div>';
  }
  html+='</div>';

  // ═══ ESPN WP CHART ═══
  if(state!=='PRE' && cs.espnWP){
    var wpLead=cs.espnWP.home>=cs.espnWP.away?hA:aA;
    var wpPct=Math.max(cs.espnWP.home,cs.espnWP.away);
    var wpOpen=cs.espnWP.opening!=null?(cs.espnWP.home>=cs.espnWP.away?cs.espnWP.opening:100-cs.espnWP.opening):null;
    var wpDelta=wpOpen!=null?wpPct-wpOpen:null;
    var wpTrend=wpDelta!=null?(wpDelta>5?'\u25b2 +'+Math.round(wpDelta):wpDelta<-5?'\u25bc '+Math.round(wpDelta):'\u25ac'):'';
    html+='<div class="wp-chart"><div class="wp-head"><div class="wp-head-left"><span>ESPN WP</span><span class="wp-val">'+esc(wpLead)+' '+wpPct+'%</span>';
    if(wpTrend)html+='<span class="wp-trend">'+wpTrend+'</span>';
    html+='</div><div class="wp-head-right">';
    if(wpOpen!=null)html+='<span>open '+Math.round(wpOpen)+'%</span>';
    html+='</div></div>';
    // Render WP history chart if available
    html+=renderWPChart(cs,hA,aA);
    html+='<div class="wp-qlabels"><span>1st</span><span>2nd</span><span>3rd</span><span>4th</span></div></div>';
  }

  // ═══ VALUE READ ═══
  if(state!=='PRE'){
    var pred=cs.prediction;
    if(pred&&(pred.fwp||pred.homeValue||pred.closing)){
      html+='<div class="value-read"><div class="vr-head"><span class="vr-title">Value Read</span>';
      var g2=g;var periodLbl2=({1:'Q1',2:'Q2',3:'Q3',4:'Q4',5:'OT'}[g2.period]||'');
      if(g2.clock&&state==='LIVE')html+='<span class="vr-aside">'+esc(g2.clock)+' '+esc(periodLbl2)+'</span>';
      html+='</div>';

      // Two-row value table
      var hFwp='--',aFwp='--',hEdge='--',aEdge='--',hML='--',aML='--',hSprd='--',aSprd='--';
      var winnerTeam=null;
      if(pred.fwpLabeled&&pred.fwpTeam1&&pred.fwpVal1!=null){
        if(pred.fwpTeam1===hA){hFwp=pred.fwpVal1+'%';aFwp=(pred.fwpVal2||'--')+'%';winnerTeam=pred.fwpVal1>=pred.fwpVal2?hA:aA;}
        else{aFwp=pred.fwpVal1+'%';hFwp=(pred.fwpVal2||'--')+'%';winnerTeam=pred.fwpVal1>=pred.fwpVal2?aA:hA;}
      } else if(pred.fwp){hFwp=esc(pred.fwp);winnerTeam=hA;}
      if(pred.homeValue){var _hf=pred.homeValue.fwp;hFwp=_hf!=null?(String(_hf).includes('%')?_hf:_hf+'%'):hFwp;hEdge=pred.homeValue.edge!=null?(pred.homeValue.edge>0?'+':'')+pred.homeValue.edge+'%':'--';hML=pred.homeValue.ml||'--';hSprd=pred.homeValue.spread||'--';}
      if(pred.awayValue){var _af=pred.awayValue.fwp;aFwp=_af!=null?(String(_af).includes('%')?_af:_af+'%'):aFwp;aEdge=pred.awayValue.edge!=null?(pred.awayValue.edge>0?'+':'')+pred.awayValue.edge+'%':'--';aML=pred.awayValue.ml||'--';aSprd=pred.awayValue.spread||'--';}
      if(pred.edge&&hEdge==='--'){hEdge=esc(pred.edge);}
      // Odds from cs.oddsData fallback
      var od=cs.oddsData;
      if(od){
        if(hSprd==='--'&&od.homeSpread)hSprd=esc(od.homeSpread);
        if(aSprd==='--'&&od.homeSpread){var hs=parseFloat(od.homeSpread);if(!isNaN(hs))aSprd=(hs>0?'-':'+')+Math.abs(hs);}
        if(hML==='--'&&od.homeML)hML=esc(od.homeML);
        if(aML==='--'&&od.awayML)aML=esc(od.awayML);
      }
      if(!winnerTeam&&pred.edgeNum!=null)winnerTeam=pred.edgeNum>=0?hA:aA;

      // Edge color helper
      function edgeHtml(val){
        if(val==='--')return'--';
        var n=parseFloat(String(val).replace(/[+%]/g,''));
        if(isNaN(n))return esc(val);
        var col=n>0?'var(--green)':n<0?'var(--coral)':'var(--fg-secondary)';
        return'<span style="color:'+col+'">'+esc(val)+'</span>';
      }

      html+='<table class="vr-table"><thead><tr><th></th><th>FWP</th><th>Edge</th><th>ML</th><th>Spread</th></tr></thead><tbody>';
      var aWin=winnerTeam===aA,hWin=winnerTeam===hA;
      html+='<tr class="'+(aWin?'winner':'')+'"><td>'+(aWin?'<span class="vr-arrow">\u25b6</span>':'')+esc(aA)+'</td><td>'+aFwp+'</td><td>'+edgeHtml(aEdge)+'</td><td>'+aML+'</td><td>'+aSprd+'</td></tr>';
      html+='<tr class="'+(hWin?'winner':'')+'"><td>'+(hWin?'<span class="vr-arrow">\u25b6</span>':'')+esc(hA)+'</td><td>'+hFwp+'</td><td>'+edgeHtml(hEdge)+'</td><td>'+hML+'</td><td>'+hSprd+'</td></tr>';
      html+='</tbody></table>';

      // Conviction bar
      if(pred.conviction||pred.convictionTier){
        var cvLabel=pred.convictionTier||pred.conviction||'';
        var cvCombo=pred.convictionCombo||pred.signalType||'';
        html+='<div class="conviction-bar"><span class="conv-pill">'+esc(cvLabel)+(cvCombo?' \u00b7 '+esc(cvCombo):'')+'</span>';
        if(pred.prediction)html+='<span class="conv-detail">'+esc(pred.prediction)+'</span>';
        html+='</div>';
      }
      html+='</div>';
    } else {
      html+='<div class="placeholder"><div class="ph-label">Value Read</div><div class="ph-text">Predictive layer activates Q2+</div></div>';
    }
  }

  // ═══ SONNET SIGNAL ═══
  if(state==='PRE'){
    html+='<div class="placeholder"><div class="ph-label">Analysis</div><div class="ph-text">Sonnet analysis activates at tip</div></div>';
  } else {
    var pred=cs.prediction;
    var hasClosing=pred&&pred.closing;
    var hasNarrative=pred&&pred.narrative;
    var hasRisk=pred&&pred.risk;
    var hasDisagree=pred&&pred.disagreement;
    var isOpen=_ssExpanded[id]||false;
    var collapsedText=hasNarrative?pred.narrative:(hasClosing?pred.closing:null);
    if(collapsedText){
      html+='<div class="sonnet-signal">';
      html+='<div class="ss-collapsed" onclick="toggleSonnetSignal(\''+id+'\')">';
      html+='<span class="ss-chevron'+(isOpen?' open':'')+'">\u25b8</span>';
      html+='<div class="ss-text'+(isOpen?' expanded':'')+'">'+esc(collapsedText)+'</div>';
      if(hasRisk||hasDisagree){
        html+='<div class="ss-badges">';
        if(hasRisk)html+='<span class="ss-badge risk">\u26a0 Risk</span>';
        if(hasDisagree)html+='<span class="ss-badge disagree">\u2298 Disagree</span>';
        html+='</div>';
      }
      html+='</div>';
      // Expanded signal cards — order: narrative > risk > disagreement > closing
      html+='<div class="ss-expanded'+(isOpen?' open':'')+'">';
      html+='<div class="ss-expanded-inner">';
      if(hasNarrative)html+='<div class="signal-card narrative"><div class="sc-label">Narrative</div><div class="sc-body">'+esc(pred.narrative)+'</div></div>';
      if(hasRisk)html+='<div class="signal-card risk"><div class="sc-label">Risk</div><div class="sc-body">'+esc(pred.risk)+'</div></div>';
      if(hasDisagree)html+='<div class="signal-card disagree"><div class="sc-label">Disagreement</div><div class="sc-body">'+esc(pred.disagreement)+'</div></div>';
      if(hasClosing)html+='<div class="signal-card closing"><div class="sc-label">Closing</div><div class="sc-body">'+esc(pred.closing)+'</div></div>';
      html+='</div></div>';
      // Analyze / Re-analyze button
      if(state==='LIVE'||state==='HALF'||state==='FINAL'){
        if(cs.analyzing)html+='<div style="margin-top:8px;text-align:center"><button class="analyze-btn" disabled style="opacity:0.6;color:var(--amber);border-color:var(--amber);background:rgba(251,191,36,0.08)">\u23f3 Analyzing\u2026</button></div>';
        else html+='<div style="margin-top:8px;text-align:center"><button class="analyze-btn" onclick="triggerAnalysis(\''+id+'\')" style="color:var(--amber);border-color:var(--amber);background:rgba(251,191,36,0.08)">\u26a1 Re-Analyze</button></div>';
      }
      html+='</div>';
    } else {
      // Fallback — no analysis yet
      html+='<div class="sonnet-signal"><div class="ss-fallback">';
      if(cs.analyzing)html+='<div class="ss-fallback-text">\u23f3 Running Sonnet analysis\u2026</div>';
      else{
        html+='<div class="ss-fallback-text">No analysis yet</div>';
        if(state==='LIVE'||state==='HALF'||state==='FINAL')html+='<button class="analyze-btn" onclick="triggerAnalysis(\''+id+'\')" style="margin-top:8px">\u26a1 Analyze</button>';
      }
      html+='</div></div>';
    }
  }

  // ═══ STRUCTURAL READ ═══
  if(state!=='PRE'){
    var floor=getFloor(cs);
    if(floor&&floor.score!=null){
      var vrd=getVerdict(floor.score);
      var floorPct=Math.round(floor.score*100);
      // Combined read pill
      var crRead=cs.combinedRead?cs.combinedRead.read:null;
      var crPillCls='dim';
      if(crRead){
        if(['DOMINANT','STRONG','EMERGING'].indexOf(crRead)>=0)crPillCls='green';
        else if(['EARNED','ERODING','SHIFT','FLIPPED'].indexOf(crRead)>=0)crPillCls='amber';
        else if(['FADING','COLLAPSING'].indexOf(crRead)>=0)crPillCls='coral';
      }

      html+='<div class="struct-read">';
      html+='<div class="sr-head"><span class="sr-title">Structural Read</span>';
      if(crRead)html+='<span class="sr-pill '+crPillCls+'">'+esc(crRead)+'</span>';
      html+='</div>';

      // Floor row
      var fillColor=vrd.color;
      html+='<div class="floor-row">';
      html+='<span class="floor-team">'+esc(floor.controlTeam||'?')+'</span>';
      html+='<span class="floor-score">'+floor.score.toFixed(2)+'</span>';
      html+='<div class="floor-meter"><div class="floor-fill" style="width:'+floorPct+'%;background:'+fillColor+';"></div></div>';
      html+='<span class="floor-verdict" style="color:'+vrd.color+'">'+esc(vrd.label)+'</span>';
      html+='</div>';

      // Windows (QTR + PBP if available)
      var hasQtr=cs.rollingWindow&&cs.rollingWindow.available;
      var hasPbp=cs.pbpWindow&&cs.pbpWindow.available;
      if(hasQtr||hasPbp){
        html+='<div class="window-grid">';
        if(hasQtr){
          var w=cs.rollingWindow;var wDelta=w.score-floor.score;
          var wSign=wDelta>=0?'+':'';var dCls=wDelta>=0?'pos':'neg';
          html+='<div class="window-cell"><div class="window-cell-head"><span class="window-cell-label">QTR</span><span class="window-cell-span">'+(w.windowQuarters?w.windowQuarters.join(','):'')+'</span></div>';
          html+='<span class="window-cell-val">'+esc(w.controlTeam||'')+' '+w.score.toFixed(2)+'<span class="window-cell-delta '+dCls+'">'+wSign+wDelta.toFixed(2)+'</span></span></div>';
        }
        if(hasPbp){
          var p=cs.pbpWindow;var pDelta=p.score-floor.score;
          var pSign=pDelta>=0?'+':'';var pCls=pDelta>=0?'pos':'neg';
          html+='<div class="window-cell"><div class="window-cell-head"><span class="window-cell-label">PBP</span><span class="window-cell-span">'+(p.possessions||'?')+' pos</span></div>';
          html+='<span class="window-cell-val">'+esc(p.controlTeam||'')+' '+p.score.toFixed(2)+'<span class="window-cell-delta '+pCls+'">'+pSign+pDelta.toFixed(2)+'</span></span></div>';
        }
        html+='</div>';
      }

      // Indicator strip (I1-I5)
      html+='<div class="ind-strip">';
      var indLabels=['I1','I2','I3','I4','I5'];
      for(var ii=0;ii<5;ii++){
        var indKey=indLabels[ii];
        var ind=floor[indKey];
        if(ind){
          var ldr=ind.leader||'?';
          var isWon=ind.score!=null?(ind.score>=0.6):false;
          var isEven=ind.score!=null?(ind.score>=0.4&&ind.score<0.6):false;
          var cls='ind-pill'+(isWon?' won':'')+(isEven?' even':'');
          html+='<span class="'+cls+'">'+indKey+' '+esc(isEven?'Even':ldr)+'</span>';
        } else {
          html+='<span class="ind-pill even">'+indKey+' --</span>';
        }
      }
      html+='</div>';

      // Sustainability rows
      var sust=cs.sustainabilityAudit||cs.clientSustainability;
      if(sust){
        var margin=(g.homePoints||0)-(g.awayPoints||0);
        var leadTeam=margin>=0?hA:aA,trailTeam=margin>=0?aA:hA;
        var leadSide=margin>=0?sust.home:sust.away;
        var trailSide=margin>=0?sust.away:sust.home;
        if(leadSide&&leadSide.tier){
          var stCls=sustTierClass(leadSide.tier);
          html+='<div class="sust-row"><span class="sust-label">Leading</span><span class="sust-team">'+esc(leadTeam)+'</span><span class="sust-tier '+stCls+'">'+esc(leadSide.tier)+'</span></div>';
        }
        if(trailSide&&trailSide.tier){
          var stCls2=sustTierClass(trailSide.tier);
          html+='<div class="sust-row"><span class="sust-label">Trailing</span><span class="sust-team">'+esc(trailTeam)+'</span><span class="sust-tier '+stCls2+'">'+esc(trailSide.tier)+'</span></div>';
        }
      }
      html+='</div>';
    } else {
      html+='<div class="placeholder"><div class="ph-label">Structural Read</div><div class="ph-text">Awaiting server data</div></div>';
    }
  }

  // ═══ COLLAPSIBLE SECTIONS ═══
  if(state!=='PRE'){
    // Scoring Composition
    html+=renderScoringCompSection(id,cs,hA,aA);
    // Margin Flow + Scoring Runs
    html+=renderMarginFlowSection(id,cs,hA,aA);
    // Deep Dive button
    html+='<div class="deep-dive-btn" onclick="openDrawer(\''+id+'\')">Deep Dive \u2192</div>';
  }

  // ═══ THESIS (every card) ═══
  var thesis=theses[id];
  if(thesis){
    var thesisOpen=state==='PRE'||(_collOpen[id+'_thesis']!=null?_collOpen[id+'_thesis']:false);
    // Default open for PRE on first render
    if(state==='PRE'&&_collOpen[id+'_thesis']==null)_collOpen[id+'_thesis']=true;
    html+='<div class="collapsible">';
    html+='<div class="coll-header" onclick="toggleColl(\''+id+'\',\'thesis\')">';
    html+='<span class="coll-chevron'+(thesisOpen?' open':'')+'">\u25b8</span>';
    html+='<span class="coll-title">Pre-Game Thesis</span>';
    html+='</div>';
    html+='<div class="coll-body'+(thesisOpen?' open':'')+'">';
    html+='<div class="coll-inner" style="font-family:var(--sans);font-size:12px;line-height:1.55;color:var(--fg-secondary);white-space:pre-wrap">'+esc(thesis)+'</div>';
    html+='</div></div>';
  }

  el.innerHTML=html;
}

// ── ESPN WP CHART SVG ──
function renderWPChart(cs,hA,aA){
  var hist=cs.espnWPHistory;
  if(!hist||hist.length<5)return'<div class="wp-canvas" style="height:40px"></div>';
  var W=600,H=80;
  var pts=hist.filter(function(p){return p.homeWP!=null;});
  if(pts.length<3)return'<div class="wp-canvas" style="height:40px"></div>';
  var pathD='',fillD='M0,'+H/2;
  for(var i=0;i<pts.length;i++){
    var px=(i/(pts.length-1))*W;
    var py=(1-pts[i].homeWP)*H;
    if(i===0)pathD+='M'+px.toFixed(1)+','+py.toFixed(1);
    else pathD+='L'+px.toFixed(1)+','+py.toFixed(1);
    fillD+='L'+px.toFixed(1)+','+Math.min(py,H/2).toFixed(1);
  }
  fillD+='L'+W+','+H/2+'Z';
  var lastPt=pts[pts.length-1];
  var lastX=W,lastY=(1-lastPt.homeWP)*H;
  var html='<div class="wp-canvas"><svg class="wp-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  html+='<defs><linearGradient id="wpFill-'+esc(hA)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></linearGradient></defs>';
  html+='<line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 4"/>';
  for(var q=1;q<=3;q++)html+='<line x1="'+(q/4*W)+'" y1="0" x2="'+(q/4*W)+'" y2="'+H+'" stroke="rgba(255,255,255,0.04)"/>';
  html+='<path d="'+fillD+'" fill="url(#wpFill-'+esc(hA)+')"/>';
  html+='<path d="'+pathD+'" fill="none" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.5" stroke-linejoin="round"/>';
  html+='<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="3.5" fill="#34D399" opacity="0.3"/>';
  html+='<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="2" fill="#34D399"/>';
  html+='<text x="6" y="12" font-size="8" fill="rgba(255,255,255,0.25)" font-family="var(--mono)">'+esc(hA)+'</text>';
  html+='<text x="6" y="'+(H-4)+'" font-size="8" fill="rgba(255,255,255,0.25)" font-family="var(--mono)">'+esc(aA)+'</text>';
  html+='</svg></div>';
  return html;
}

// ── HYDRATE FROM SERVER SNAPSHOTS ──
async function hydrateFromServerSnapshots(gameId){
  if(!dbReady)return;
  var cs=cardState[gameId];if(!cs)return;

  // Quarter data
  try{
    var qdResp=await fetch(FN+'db-api?action=get_quarter_data&game_id='+encodeURIComponent(gameId));
    if(qdResp.ok){
      var qdData=await qdResp.json();
      var qd=qdData.quarter_data;
      if(qd&&qd.diffs){cs._serverQuarterDiffs=qd.diffs;}
      if(qd&&qd.window&&qd.window.available){
        cs.rollingWindow=qd.window;cs.rollingWindow.source='server-qd';
      }
    }
  }catch(e){}

  // Snapshots
  try{
    var resp=await fetch(FN+'db-api?action=history&game_id='+gameId);
    if(!resp.ok)return;var data=await resp.json();
    var snaps=data.snapshots||[];if(snaps.length===0)return;
    var usable=snaps.filter(function(s){return s.floor_score!=null;});
    if(usable.length===0)return;
    cs._allSnapshots=usable; // store full array for drawer history
    var latest=usable[usable.length-1];

    // Server floor
    if(!cs.clientInd&&!cs.sonnetIndicators&&latest.floor_score!=null){
      cs._serverFloor={
        score:latest.floor_score,controlTeam:latest.floor_team,
        I1:{score:latest.i1,leader:latest.floor_team},I2:{score:latest.i2,leader:latest.floor_team},
        I3:{score:latest.i3,leader:latest.floor_team},I4:{score:latest.i4,leader:latest.floor_team},
        I5:{score:latest.i5,leader:latest.floor_team},source:'server'
      };
    }

    // ESPN WP
    if(!cs.espnWP&&latest.espn_wp_home!=null){
      cs.espnWP={home:latest.espn_wp_home,away:latest.espn_wp_away||(100-latest.espn_wp_home),opening:null};
    }

    // Odds
    if(!cs.oddsData&&latest.spread!=null){
      cs.oddsData={homeSpread:String(latest.spread),homeML:null,awayML:null,total:null,source:'server'};
    }

    // Sustainability
    if(!cs.clientSustainability&&!cs.sustainabilityAudit){
      var _sustJson=latest.sust_json;
      if(_sustJson){
        try{
          var parsed=typeof _sustJson==='string'?JSON.parse(_sustJson):_sustJson;
          if(parsed&&(parsed.home||parsed.away)){
            if(parsed.home?.personnelGrade||parsed.away?.personnelGrade)cs.sustainabilityAudit=parsed;
            cs.clientSustainability=parsed;
          }
        }catch(e){}
      }
    }

    console.log('[DB] Snapshots hydrated for',gameId,':',usable.length,'entries');
    renderCard(gameId);
  }catch(e){console.warn('[DB] Snapshot hydration failed:',e.message);}
}

async function syncAnalysesFromDB(){

    rows.forEach(function(row){
      var pred=null,ind=null;
      if(row.prediction_json){try{pred=typeof row.prediction_json==='string'?JSON.parse(row.prediction_json):row.prediction_json;}catch(e){}}
      if(row.indicators_json){try{ind=typeof row.indicators_json==='string'?JSON.parse(row.indicators_json):row.indicators_json;}catch(e){}}
      dbAnalysisCache[row.game_id]={prediction:pred,sonnetIndicators:ind,analysisTime:row.ts?new Date(row.ts).getTime():0,analysis:row.raw_text||'',control_team:row.control_team,control_score:row.control_score,fwp:row.fwp,edge:row.edge,signal:row.signal,sustainability:row.sustainability};
    });

    // Apply to mounted cards
    Object.keys(dbAnalysisCache).forEach(function(gid){
      var cs=cardState[gid];if(!cs)return;
      var cached=dbAnalysisCache[gid];
      var localTime=cs.analysisTime?cs.analysisTime.getTime():0;

      if(cached.prediction)cs.prediction=cached.prediction;
      if(cached.sonnetIndicators)cs.sonnetIndicators=cached.sonnetIndicators;
      if(dbTime)cs.analysisTime=new Date(dbTime);
      cs.analysis=cached.analysis||cs.analysis;
      persistAnalysis(gid,cs);
    });
    games.forEach(function(g){renderCard(g.id);});

// ── APPLY AUTO ANALYSES TO CARDS ──
function applyAutoAnalysesToCards(){
  var applied=0;
  Object.keys(autoAnalysisCache).forEach(function(gid){
    var cs=cardState[gid];if(!cs)return;
    var autos=autoAnalysisCache[gid];if(!autos||autos.length===0)return;
    autos.sort(function(a,b){return new Date(a.ts)-new Date(b.ts);});
    var latest=autos[autos.length-1];
    var latestTime=new Date(latest.ts).getTime();
    var localTime=cs.analysisTime?cs.analysisTime.getTime():0;

    // Always build analysisHistory from auto analyses (even if prediction is up to date)
    if(!cs.analysisHistory)cs.analysisHistory=[];
    var existingTriggers={};cs.analysisHistory.forEach(function(h){if(h.source)existingTriggers[h.source]=true;});
    var newEntries=0;
    autos.forEach(function(a){
      var src='auto_'+(a.trigger||'q?');
      if(existingTriggers[src])return;
      var scoreStr='';
      if(a.home_pts!=null&&a.away_pts!=null)scoreStr=a.away_pts+'-'+a.home_pts;
      else if(a.raw_text){var sm=a.raw_text.match(/(\d+)\s*[-\u2013]\s*(\d+)/);if(sm)scoreStr=sm[0];}
      cs.analysisHistory.push({
        time:a.ts?new Date(a.ts).toLocaleTimeString():'?',
        period:a.period||'?',clock:a.clock||'',
        controlTeam:a.control_team||'?',controlScore:a.control_score||null,
        conviction:a.conviction||null,convictionTier:a.conviction_tier||null,
        convictionCombo:a.conviction_combo||null,entry:a.entry||null,
        signal:a.signal||null,score:scoreStr,source:src,
        sustainability:a.sustainability||null
      });
      newEntries++;
    });
    if(newEntries>0)cs.analysisHistory.sort(function(a,b){return(a.time||'').localeCompare(b.time||'');});

    if(latestTime<=localTime&&cs.prediction){if(newEntries>0)applied++;return;}

    var pred=null,ind=null;
    if(latest.prediction_json){try{pred=typeof latest.prediction_json==='string'?JSON.parse(latest.prediction_json):latest.prediction_json;}catch(e){}}
    if(latest.indicators_json){try{ind=typeof latest.indicators_json==='string'?JSON.parse(latest.indicators_json):latest.indicators_json;}catch(e){}}

    var d={
      entry:latest.entry||null,conviction:latest.conviction||null,
      convictionTier:latest.conviction_tier||null,convictionCombo:latest.conviction_combo||null,
      signal:latest.signal||null,signalType:latest.signal||null,
      sustainability:latest.sustainability||null,leadSource:latest.lead_source||null,
      fwp:latest.fwp||null,edge:latest.edge||null,edgeNum:null,
      narrative:null,risk:null,closing:null,disagreement:null,
      homeValue:pred?pred.homeValue:null,awayValue:pred?pred.awayValue:null,
      source:'auto'
    };
    if(latest.edge){var _enM=String(latest.edge).match(/([+-]?\d+\.?\d*)/);if(_enM)d.edgeNum=parseFloat(_enM[1]);}

    // Extract v2 fields from raw text
    if(latest.raw_text){
      var t=latest.raw_text;
      var predLine=t.match(/Prediction:\s*(.+)/i);if(predLine)d.prediction=predLine[1].trim();
      var sigLine=t.match(/SIGNAL:\s*(BUY\s+\w+|NO VALUE|PASS)\s*(?:[---]\s*(.+))?/i);
      if(sigLine){d.signalType=sigLine[1].trim().toUpperCase();d.signalNote=sigLine[2]?sigLine[2].trim():'';}
      var riskLine=t.match(/RISK:\s*(.+?)(?:\n|$)/);if(riskLine){d.risk=riskLine[1].trim();if(d.risk.toUpperCase().startsWith('NONE'))d.risk=null;}
      var closLine=t.match(/CLOSING:\s*(.+?)(?:\n|$)/);if(closLine)d.closing=closLine[1].trim();
      var disLine=t.match(/DISAGREEMENT:\s*(.+?)(?:\n|$)/);
      if(disLine){d.disagreement=disLine[1].trim();if(d.disagreement.toUpperCase()==='NONE')d.disagreement=null;}
      var narLine=t.match(/NARRATIVE:\s*([\s\S]*?)(?:\n(?:Sustainability|Lead Source|DISAGREEMENT|RISK|CLOSING|FWP|EDGE):|$)/);
      if(narLine)d.narrative=narLine[1].trim();
    }

    if(d.conviction||d.prediction||d.fwp||(d.homeValue&&d.awayValue)){
      cs.prediction=d;cs.analysisTime=new Date(latestTime);
      if(latest.raw_text&&latest.raw_text.length>20)cs.analysis=latest.raw_text;
      if(ind)cs.sonnetIndicators=ind;

      // Sustainability from auto analysis
      if(latest.sustainability){
        var _sp=latest.sustainability.split('|').map(function(s){return s.trim();});
        var _g=games.find(function(x){return x.id===gid;});
        var _hA=_g?.home?.alias||'',_aA=_g?.away?.alias||'';
        var _as={home:{tier:null},away:{tier:null}};
        var _vt=['LOCKED IN','LOCKED','STALLED','DURABLE','MIXED','FRAGILE','UNSUSTAINABLE','COLD','TOO EARLY'];
        _sp.forEach(function(part){var m=part.match(/^(\w+)\s*:\s*(.+)/);if(!m)return;var team=m[1].trim().toUpperCase();var tier=m[2].trim().toUpperCase();var matched=_vt.find(function(t){return tier.includes(t);});if(!matched)return;if(team===_hA)_as.home.tier=matched;else if(team===_aA)_as.away.tier=matched;});
        if(_as.home.tier||_as.away.tier)cs.clientSustainability=_as;
      }
      persistAnalysis(gid,cs);applied++;
    }
  });
  if(applied>0){games.forEach(function(g){renderCard(g.id);});}
}

// ── PARSE SONNET DECISION ──
function parseSonnetDecision(text){
  if(!text)return null;
  try{
    var d={};
    var fwpLine=(text.match(/^FWP:\s*(.+)/im)||[])[1]||'';
    if(fwpLine)d.fwpRaw=fwpLine.trim().replace(/\|.*$/,'').trim();
    var edgeLine=(text.match(/EDGE:\s*(.+)/i)||[])[1]||'';
    if(edgeLine){
      if(!d.fwpRaw){var fwpM=edgeLine.match(/FWP:\s*([^|]+)/i);if(fwpM)d.fwpRaw=fwpM[1].trim().replace(/\|.*$/,'').trim();}
      var edgeVal=edgeLine.replace(/\|?\s*(FWP|MIP):.*/i,'').replace(/\|.*$/,'').trim();
      if(edgeVal){d.edge=edgeVal;var en=parseFloat(edgeVal.replace(/[+%]/g,''));d.edgeNum=isNaN(en)?null:en;}
    }
    if(d.fwpRaw){
      var tsm=d.fwpRaw.match(/([A-Z]{2,4})\s+([\d.]+)%?\s*\/\s*([A-Z]{2,4})\s+([\d.]+)%?/i);
      if(tsm){d.fwpTeam1=tsm[1].toUpperCase();d.fwpVal1=parseFloat(tsm[2]);d.fwpTeam2=tsm[3].toUpperCase();d.fwpVal2=parseFloat(tsm[4]);d.fwp=d.fwpRaw;d.fwpLabeled=true;}
      else{d.fwp=d.fwpRaw;d.fwpLabeled=false;}
    }
    var entryM=text.match(/ENTRY:\s*(OPTIMAL WINDOW|WINDOW OPEN|WINDOW CLOSING|NO WINDOW|FADE)/i);d.entry=entryM?entryM[1]:null;
    var convM=text.match(/CONVICTION:\s*(DOMINANT|STRONG|EARNED|CONDITIONAL|NO ENTRY)/i);d.conviction=convM?convM[1]:null;
    var sustM=text.match(/Sustainability:\s*(.+)/i);d.sustainability=sustM?sustM[1].trim():null;
    var sigM=text.match(/SIGNAL:\s*(BUY\s+\w+|NO VALUE|PASS)\s*(?:[---]\s*(.+))?/i);
    if(sigM){d.signalType=sigM[1].trim().toUpperCase();d.signalNote=sigM[2]?sigM[2].trim():'';}
    var riskM=text.match(/RISK:\s*(.+?)(?:\n|$)/);d.risk=riskM?riskM[1].trim():null;
    if(d.risk&&d.risk.toUpperCase().startsWith('NONE'))d.risk=null;
    var closM=text.match(/CLOSING:\s*(.+?)(?:\n|$)/);d.closing=closM?closM[1].trim():null;
    var narM=text.match(/NARRATIVE:\s*([\s\S]*?)(?:\n(?:Sustainability|Lead Source|DISAGREEMENT|RISK|CLOSING|FWP|EDGE):|$)/);d.narrative=narM?narM[1].trim():null;
    var disM=text.match(/DISAGREEMENT:\s*(.+?)(?:\n|$)/);d.disagreement=disM?disM[1].trim():null;
    if(d.disagreement&&d.disagreement.toUpperCase()==='NONE')d.disagreement=null;
    var predM=text.match(/Prediction:\s*(.+)/i);d.prediction=predM?predM[1].trim():null;
    if(!d.prediction&&!d.conviction&&!d.fwp&&!d.closing)return null;
    return d;
  }catch(e){return null;}
}
