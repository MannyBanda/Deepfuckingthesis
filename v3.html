var _seenAlertIds=new Set();
var _toastAlert=null;
var _toastGameId=null;
var _latestSendAlert=null;
var _toastVisible=false;
var _toastOddsTimer=null;
var _dismissedAlertIds=new Set();

async function pollAlerts(){
  if(!dbReady)return;
  var d=getSlateDate(dateOffset);
  try{
    var r=await fetch(FN+'db-api?action=get_alerts&date='+d.str+'&limit=200');
    if(!r.ok)return;var data=await r.json();
    var alerts=data.alerts||data||[];
    if(!Array.isArray(alerts))return;
    _alertCache={};
    alerts.forEach(function(a){
      if(!a.game_id)return;
      if(!_alertCache[a.game_id])_alertCache[a.game_id]=[];
      _alertCache[a.game_id].push(a);
    });
    _alertsFetched=true;
    var newSend=null;
    alerts.forEach(function(a){
      if(a.agent_decision==='SEND'&&!_seenAlertIds.has(a.id)){
        _seenAlertIds.add(a.id);
        _latestSendAlert=a;
        // Only auto-toast for: entry types, not dismissed, active game, not FINAL
        if(ENTRY_TYPES[a.alert_type]&&!_dismissedAlertIds.has(a.id)&&a.game_id===activeGameId){
          var ag=games.find(function(x){return x.id===a.game_id;});
          if(!ag||getState(ag)!=='FINAL')newSend=a;
        }
      }
    });
    if(!_latestSendAlert){
      for(var i=alerts.length-1;i>=0;i--){
        if(alerts[i].agent_decision==='SEND'){_latestSendAlert=alerts[i];break;}
      }
    }
    var badge=document.getElementById('toast-badge');
    if(_latestSendAlert&&badge){badge.textContent='';badge.classList.add('show');}
    if(newSend)fireToast(newSend);
    // Refresh visible toast with latest SEND alert for its game (catches EXIT, POSITION_SAFE, team flips)
    else if(_toastVisible&&_toastGameId&&_alertCache[_toastGameId]){
      var gameAlerts=_alertCache[_toastGameId];
      var latestForGame=null;
      for(var li=gameAlerts.length-1;li>=0;li--){
        if(gameAlerts[li].agent_decision==='SEND'){latestForGame=gameAlerts[li];break;}
      }
      if(latestForGame&&_toastAlert&&latestForGame.id!==_toastAlert.id){
        fireToast(latestForGame);
      }
    }
  }catch(e){console.warn('[TOAST] Alert poll failed:',e.message);}
}

function renderToastHeader(alert){
  var g=games.find(function(x){return x.id===alert.game_id;});
  var hA=g?.home?.alias||'HOME',aA=g?.away?.alias||'AWAY';
  var betTeam=alert.floor_team||alert.control_team||'?';
  var isExit=(alert.alert_type||'').startsWith('EXIT');
  var isPosition=/^(POSITION_SAFE|POSITION_OPEN|STRENGTHENING|HOLDING|SECOND_CHANCE)$/.test(alert.alert_type||'');

  // Label based on alert type
  var label=isExit?'Exit Signal':isPosition?'Position Update':'Entry Signal';
  document.getElementById('toast-label').textContent=label;

  // Style the toast border based on alert type
  var toast=document.getElementById('toast');
  if(isExit){toast.style.borderColor='var(--amber)';document.getElementById('toast-label').style.color='var(--amber)';document.getElementById('toast-dot').style.background='var(--amber)';document.getElementById('toast-dot').style.boxShadow='0 0 12px var(--amber)';}
  else{toast.style.borderColor='var(--green-border)';document.getElementById('toast-label').style.color='var(--green)';document.getElementById('toast-dot').style.background='var(--green)';document.getElementById('toast-dot').style.boxShadow='0 0 12px var(--green)';}

  var typeLabel=(alert.alert_type||'').replace(/_/g,' ');
  if(alert.alert_tier)typeLabel+=' \u00b7 '+alert.alert_tier;
  var time='';if(alert.period)time+='Q'+alert.period;if(alert.clock)time+=' '+alert.clock;
  if(time)typeLabel+=' \u00b7 '+time;
  document.getElementById('toast-alert-info').textContent=typeLabel;

  var margin=alert.margin!=null?Math.abs(alert.margin):'?';
  var trailing=alert.margin!=null&&alert.margin<0;
  var gameText='';
  if(isExit){
    // EXIT: make it clear who lost control and who to bet
    var exitTeam=betTeam;
    var oppTeam=(exitTeam.toUpperCase()===hA.toUpperCase())?aA:hA;
    gameText='Exit '+exitTeam+' \u00b7 '+aA+'@'+hA+' \u00b7 Bet '+oppTeam;
  } else {
    gameText=betTeam+(trailing?' trailing '+margin:' leading '+margin);
    gameText+=' \u00b7 '+aA+'@'+hA;
    if(alert.floor_score!=null)gameText+=' \u00b7 Floor '+Number(alert.floor_score).toFixed(2);
  }
  document.getElementById('toast-game').textContent=gameText;
}

function fireToast(alert){
  _toastAlert=alert;_toastGameId=alert.game_id;
  renderToastHeader(alert);
  var oddsEl=document.getElementById('toast-odds');
  oddsEl.innerHTML='<div class="toast-no-odds">Loading odds\u2026</div>';
  showToastEl();
  fetchLineShop(alert);
  // Only poll live odds for non-FINAL games
  var g=games.find(function(x){return x.id===alert.game_id;});
  if(g&&getState(g)!=='FINAL')startToastOddsPoll();
  else stopToastOddsPoll();
}

async function fetchLineShop(alert){
  var oddsEl=document.getElementById('toast-odds');
  var g=games.find(function(x){return x.id===alert.game_id;});
  if(!g){oddsEl.innerHTML='<div class="toast-no-odds">Game not found</div>';return;}

  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var hName=g.home?.name||'',aName=g.away?.name||'';
  var betTeam=alert.floor_team||alert.control_team||'?';
  // EXIT = the control team LOST structural control — bet the opposite team
  var isExit=(alert.alert_type||'').startsWith('EXIT');
  if(isExit){
    betTeam=(betTeam.toUpperCase()===hA.toUpperCase())?aA:hA;
  }
  var isHome=betTeam.toUpperCase()===hA.toUpperCase();
  // The team name to match in Odds API outcomes
  var betFullName=isHome?(g.home?.market||'')+' '+hName:(g.away?.market||'')+' '+aName;

  try{
    // For completed games, use historical endpoint with game's scheduled time
    var gs=getState(g);
    var oddsUrl=FN+'odds-api';
    if(gs==='FINAL'&&g.scheduled){
      // Normalize to ISO Z format without milliseconds (Odds API requires YYYY-MM-DDTHH:MM:SSZ)
      var histDate=new Date(g.scheduled).toISOString().replace(/\.\d{3}Z$/,'Z');
      oddsUrl+=('?date='+encodeURIComponent(histDate));
    }
    var r=await fetch(oddsUrl);
    if(!r.ok){var errD=await r.json().catch(function(){return{};});console.warn('[ODDS API] Error detail:',errD.detail||errD.error);throw new Error(errD.error||'HTTP '+r.status);}
    var data=await r.json();
    var oddsGames=data.games||[];
    if(data.credits)console.log('[ODDS API]'+(data.historical?' (historical)':'')+' Credits remaining:',data.credits.remaining,'used:',data.credits.used);

    // Match our game in The Odds API response — exact match on "Market Name" (e.g., "Boston Celtics")
    var homeFullName=((g.home?.market||'')+' '+hName).trim().toLowerCase();
    var awayFullName=((g.away?.market||'')+' '+aName).trim().toLowerCase();
    var match=null;
    oddsGames.forEach(function(og){
      if((og.home_team||'').toLowerCase()===homeFullName&&(og.away_team||'').toLowerCase()===awayFullName){
        match=og;
      }
    });

    if(!match){
      oddsEl.innerHTML='<div class="toast-no-odds">Game not found in odds feed'+(gs==='FINAL'?' (historical)':'')+'</div>';
      return;
    }

    // Extract bet team's ML from each bookmaker
    var rows=[];
    (match.bookmakers||[]).forEach(function(bk){
      var mkt=(bk.markets||[]).find(function(m){return m.key==='h2h';});
      if(!mkt)return;
      // Find the outcome for our bet team
      var outcome=null;
      (mkt.outcomes||[]).forEach(function(o){
        var oName=o.name.toLowerCase();
        if(isHome&&oName===match.home_team.toLowerCase())outcome=o;
        else if(!isHome&&oName===match.away_team.toLowerCase())outcome=o;
      });
      if(!outcome||outcome.price==null)return;
      var bkInfo=BOOK_LINKS[bk.key]||{name:bk.title||bk.key,app:'',web:''};
      rows.push({key:bk.key,name:bkInfo.name,app:bkInfo.app,web:bkInfo.web,ml:Number(outcome.price)});
    });

    if(rows.length===0){oddsEl.innerHTML='<div class="toast-no-odds">No ML odds for '+esc(betTeam)+'</div>';return;}

    rows.sort(function(a,b){return b.ml-a.ml;});
    var totalBooks=rows.length;
    var bestML=rows[0].ml;

    var html='<div class="toast-odds-grid">';
    html+='<div style="padding:2px 8px 8px;display:flex;align-items:baseline;gap:6px">';
    html+='<span style="font-family:var(--mono);font-size:16px;font-weight:700;color:'+tc(betTeam)+'">'+esc(betTeam)+' ML</span>';
    html+='<span style="font-family:var(--mono);font-size:10px;color:var(--fg-dim)">'+totalBooks+' books</span>';
    html+='</div>';
    function oddsRow(r){
      var isBest=r.ml===bestML&&totalBooks>1;
      var mlStr=r.ml>0?'+'+r.ml:String(r.ml);
      var hasLink=r.web;
      var h='<div class="toast-odds-row'+(isBest?' best':'')+'"'+(hasLink?' onclick="openBook(\'\',\''+esc(r.web)+'\')"':'')+'>';
      h+='<span class="toast-book">'+esc(r.name)+'</span>';
      h+='<span class="toast-ml-val">'+esc(mlStr)+'</span>';
      if(isBest)h+='<span class="toast-best-tag">BEST</span>';
      if(hasLink)h+='<span class="toast-open">Open \u2192</span>';
      h+='</div>';
      return h;
    }
    rows.slice(0,7).forEach(function(r){html+=oddsRow(r);});
    if(totalBooks>7){
      html+='<div id="toast-more-rows" style="display:none">';
      rows.slice(7).forEach(function(r){html+=oddsRow(r);});
      html+='</div>';
      html+='<div id="toast-more-btn" style="text-align:center;padding:6px 0 2px;cursor:pointer;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--green)" onclick="toggleToastMore()">Show all '+totalBooks+' \u25bc</div>';
    }
    html+='</div>';
    oddsEl.innerHTML=html;
  }catch(e){
    oddsEl.innerHTML='<div class="toast-no-odds">Odds fetch failed: '+esc(e.message)+'</div>';
    console.warn('[TOAST] Odds API error:',e.message);
  }
}

function showToastEl(){
  var t=document.getElementById('toast');
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  _toastVisible=true;
}

function showToast(){
  if(_latestSendAlert){fireToast(_latestSendAlert);}
  else{
    document.getElementById('toast-label').textContent='No Alerts';
    document.getElementById('toast-alert-info').textContent='No SEND alerts today';
    document.getElementById('toast-game').textContent='Alerts will appear here when signals fire';
    document.getElementById('toast-odds').innerHTML='';
    showToastEl();
  }
}

function dismissToast(){
  document.getElementById('toast').classList.remove('show');
  _toastVisible=false;
  stopToastOddsPoll();
  // Remember this alert was dismissed — don't auto-show it again
  if(_toastAlert&&_toastAlert.id)_dismissedAlertIds.add(_toastAlert.id);
}

function updateToastForGame(gameId){
  // Find latest SEND alert for this game
  var gameAlerts=_alertCache[gameId]||[];
  var latest=null;
  for(var i=gameAlerts.length-1;i>=0;i--){
    if(gameAlerts[i].agent_decision==='SEND'){latest=gameAlerts[i];break;}
  }
  if(latest){
    fireToast(latest);
  } else {
    // No alerts for this game — dismiss toast
    document.getElementById('toast').classList.remove('show');
    _toastVisible=false;
    stopToastOddsPoll();
  }
}

function startToastOddsPoll(){
  stopToastOddsPoll();
  _toastOddsTimer=setInterval(function(){
    if(_toastAlert&&_toastVisible)fetchLineShop(_toastAlert);
    else stopToastOddsPoll();
  },10000);
}

function stopToastOddsPoll(){
  if(_toastOddsTimer){clearInterval(_toastOddsTimer);_toastOddsTimer=null;}
}

function openBook(appUrl,webUrl){
  // Use web URL directly — iOS Universal Links will open the app if installed
  if(webUrl)window.open(webUrl,'_blank');
}

function toggleToastMore(){
  var rows=document.getElementById('toast-more-rows');
  var btn=document.getElementById('toast-more-btn');
  if(!rows||!btn)return;
  var showing=rows.style.display!=='none';
  rows.style.display=showing?'none':'block';
  btn.textContent=showing?'Show all \u25bc':'Show less \u25b2';
}

function toastScrollToGame(){
  if(_toastGameId){
    dismissToast();
    scrollToGame(_toastGameId);
  }
}

// Toast swipe-down-to-dismiss
(function(){
  var toast,tStartY,tDy,tDragging;
  document.addEventListener('DOMContentLoaded',function(){
    toast=document.getElementById('toast');
    toast.addEventListener('touchstart',function(e){
      tStartY=e.touches[0].clientY;tDy=0;tDragging=false;
    },{passive:true});
    toast.addEventListener('touchmove',function(e){
      tDy=e.touches[0].clientY-tStartY;
      if(tDy>0){
        if(!tDragging){tDragging=true;toast.style.transition='none';}
        toast.style.transform='translateY('+tDy+'px)';
        e.preventDefault();
      }
    },{passive:false});
    toast.addEventListener('touchend',function(){
      if(!tDragging)return;
      if(tDy>80){
        toast.style.transition='transform .2s ease';
        toast.style.transform='translateY(100%)';
        setTimeout(function(){toast.style.transition='';toast.style.transform='';dismissToast();},210);
      } else {
        toast.style.transition='transform .2s ease';
        toast.style.transform='translateY(0)';
        setTimeout(function(){toast.style.transition='';toast.style.transform='';},210);
      }
      tDragging=false;tDy=0;
    },{passive:true});
  });
})();

// LOCALSTORAGE CLEANUP — purge stale per-game data on boot
// ══════════════════════════════════════════════════════════════════════════════
(function cleanupStorage(){
  try{
    var now=Date.now(),keysToRemove=[],totalSize=0,allKeys=[];
    for(var i=0;i<localStorage.length;i++){
      var key=localStorage.key(i);
      if(!key||!key.startsWith('nba4:'))continue;
      var size=(localStorage.getItem(key)||'').length;
      allKeys.push({key:key,size:size});totalSize+=size;
    }
    // Remove old schedule caches (keep today + yesterday)
    var today=new Date(),yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
    var keepDates=[today.toISOString().slice(0,10),yesterday.toISOString().slice(0,10)];
    allKeys.forEach(function(k){
      if(k.key.startsWith('nba4:schedule:')&&!keepDates.some(function(d){return k.key.includes(d);}))keysToRemove.push(k.key);
    });
    // Remove per-game data older than 48h
    var maxAge=48*60*60*1000;
    var perGamePrefixes=['nba4:analysis:','nba4:wpHist:'];
    allKeys.forEach(function(k){
      var isGameKey=perGamePrefixes.some(function(p){return k.key.startsWith(p);});
      if(!isGameKey)return;
      try{
        var raw=localStorage.getItem(k.key);
        if(!raw||raw.length<5){keysToRemove.push(k.key);return;}
        var val=JSON.parse(raw);
        var ts=val.analysisTime||0;
        // wpHist has no timestamp — check if game ID is stale via deferred cleanup
        if(ts>0&&(now-ts)>maxAge)keysToRemove.push(k.key);
        // Aggressive: if storage > 3MB, shorten to 24h
        if(totalSize>3*1024*1024&&ts>0&&(now-ts)>24*60*60*1000)keysToRemove.push(k.key);
      }catch(e){keysToRemove.push(k.key);}
    });
    // Deferred: prune per-game keys for games not on today/yesterday slate
    setTimeout(function(){
      try{
        var currentGameIds=new Set(games.map(function(g){return g.id;}));
        if(currentGameIds.size===0)return;
        var extraRemoved=0;
        perGamePrefixes.forEach(function(pfx){
          for(var j=localStorage.length-1;j>=0;j--){
            var pk=localStorage.key(j);
            if(!pk||!pk.startsWith(pfx))continue;
            var gid=pk.substring(pfx.length);
            if(!currentGameIds.has(gid)){
              try{localStorage.removeItem(pk);extraRemoved++;}catch(e){}
            }
          }
        });
        if(extraRemoved>0)console.log('[CLEANUP] Removed '+extraRemoved+' stale per-game keys');
      }catch(e){}
    },15000);
    keysToRemove.forEach(function(k){try{localStorage.removeItem(k);}catch(e){};});
    if(keysToRemove.length>0)console.log('[CLEANUP] Removed '+keysToRemove.length+' stale entries');
    console.log('[STORAGE] ~'+(totalSize/1024).toFixed(0)+'KB across '+allKeys.length+' nba4 keys');
  }catch(e){console.warn('[CLEANUP]',e.message);}
})();
