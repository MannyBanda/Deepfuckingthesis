// Build minimal SR-shaped summary from BDL box score for analyze.js
function buildV3Summary(boxScore){
  var hTeam=boxScore.home_team?.team||boxScore.home_team||{};
  var aTeam=boxScore.visitor_team?.team||boxScore.visitor_team||{};
  var hA=hTeam.abbreviation||'HOME',aA=aTeam.abbreviation||'AWAY';
  var hPlayers=boxScore.home_team?.players||[];
  var aPlayers=boxScore.visitor_team?.players||[];

  function rollup(players){
    var s={field_goals_made:0,field_goals_att:0,three_points_made:0,three_points_att:0,two_points_made:0,two_points_att:0,free_throws_made:0,free_throws_att:0,assists:0,steals:0,blocks:0,offensive_rebounds:0,defensive_rebounds:0,rebounds:0,turnovers:0,total_turnovers:0,personal_fouls:0,points:0,bench_points:0};
    players.forEach(function(p){s.field_goals_made+=p.fgm||0;s.field_goals_att+=p.fga||0;s.three_points_made+=p.fg3m||0;s.three_points_att+=p.fg3a||0;s.free_throws_made+=p.ftm||0;s.free_throws_att+=p.fta||0;s.assists+=p.ast||0;s.steals+=p.stl||0;s.blocks+=p.blk||0;s.offensive_rebounds+=p.oreb||0;s.defensive_rebounds+=p.dreb||0;s.rebounds+=p.reb||0;s.turnovers+=p.turnover||0;s.personal_fouls+=p.pf||0;s.points+=p.pts||0;});
    s.total_turnovers=s.turnovers;s.two_points_made=s.field_goals_made-s.three_points_made;s.two_points_att=s.field_goals_att-s.three_points_att;
    var fga=s.field_goals_att||1;
    s.field_goals_pct=+(s.field_goals_made/fga*100).toFixed(1);
    s.three_points_pct=s.three_points_att>0?+(s.three_points_made/s.three_points_att*100).toFixed(1):0;
    s.two_points_pct=s.two_points_att>0?+(s.two_points_made/s.two_points_att*100).toFixed(1):0;
    s.free_throws_pct=s.free_throws_att>0?+(s.free_throws_made/s.free_throws_att*100).toFixed(1):0;
    s.effective_fg_pct=+((s.field_goals_made+0.5*s.three_points_made)/fga*100).toFixed(1);
    s.possessions=+(fga-s.offensive_rebounds+s.turnovers+0.4*s.free_throws_att).toFixed(1);
    s.offensive_points_per_possession=s.possessions>0?+(s.points/s.possessions).toFixed(2):0;
    s.points_in_paint=0;s.points_in_the_paint=0;s.points_off_turnovers=0;s.second_chance_pts=0;s.fast_break_pts=0;s.biggest_lead=0;
    return s;
  }
  function mapPlayers(pArr){return pArr.map(function(p){var pl=p.player||{};return{full_name:((pl.first_name||'')+' '+(pl.last_name||'')).trim(),position:pl.position||'',played:(p.min&&p.min!=='0')||(p.pts>0),active:true,starter:p.starter||false,statistics:{minutes:p.min||'0',field_goals_made:p.fgm||0,field_goals_att:p.fga||0,three_points_made:p.fg3m||0,three_points_att:p.fg3a||0,three_points_pct:p.fg3_pct||0,free_throws_made:p.ftm||0,free_throws_att:p.fta||0,assists:p.ast||0,steals:p.stl||0,blocks:p.blk||0,turnovers:p.turnover||0,personal_fouls:p.pf||0,points:p.pts||0}};});}
  var hStats=rollup(hPlayers),aStats=rollup(aPlayers);
  hStats.defensive_points_per_possession=hStats.possessions>0?+(aStats.points/hStats.possessions).toFixed(2):0;
  aStats.defensive_points_per_possession=aStats.possessions>0?+(hStats.points/aStats.possessions).toFixed(2):0;
  return{
    _dataSource:'BDL',status:'inprogress',quarter:boxScore.period||0,clock:normalizeBdlClock(boxScore.time,boxScore.status),
    home:{name:hTeam.name||'',alias:hA,points:boxScore.home_team_score||hStats.points,statistics:hStats,players:mapPlayers(hPlayers),bonus:boxScore.home_in_bonus||false},
    away:{name:aTeam.name||'',alias:aA,points:boxScore.visitor_team_score||aStats.points,statistics:aStats,players:mapPlayers(aPlayers),bonus:boxScore.visitor_in_bonus||false}
  };
}

async function triggerAnalysis(gameId){
  var cs=cardState[gameId];if(!cs)return;
  if(cs.analyzing&&cs._analyzeStart&&(Date.now()-cs._analyzeStart>60000))cs.analyzing=false;
  if(cs.analyzing)return;
  cs.analyzing=true;cs._analyzeStart=Date.now();
  renderCard(gameId);

  var g=games.find(function(x){return x.id===gameId;});
  var hA=g?.home?.alias||'HOME',aA=g?.away?.alias||'AWAY';

  try{
    // 1. Fetch BDL box score for summaryData
    var bdlId=bdlGameMap[gameId];
    var summaryData=null;
    if(bdlId){
      try{
        var d=getSlateDate(dateOffset);
        var boxRes=await bdl('box_scores',{date:d.str});
        var boxArr=boxRes.data||[];
        var match=boxArr.find(function(b){return b.id===bdlId;});
        if(match)summaryData=buildV3Summary(match);
      }catch(e){console.warn('[ANALYZE] BDL box score fetch failed:',e.message);}
    }
    if(!summaryData){cs.analyzing=false;renderCard(gameId);console.error('[ANALYZE] No summary data available');return;}

    // 2. Build payload from cardState
    var period=g?.period?'Q'+g.period:'';
    var score=aA+' '+(g?.awayPoints||0)+' - '+hA+' '+(g?.homePoints||0);
    var payload={
      summaryData:summaryData,
      thesis:theses[gameId]||'',
      homeTeam:hA,awayTeam:aA,
      period:period,score:score,
      gameClock:g?.clock||null,gamePeriod:g?.period||0,
      bonusStatus:{home:summaryData.home.bonus||false,away:summaryData.away.bonus||false,homeDouble:false,awayDouble:false},
      oddsData:cs.oddsData||null,
      analysisHistory:cs.analysisHistory&&cs.analysisHistory.length>0?cs.analysisHistory:null,
      trackingData:cs.trackingData||null,
      pbpAudit:cs.pbpAudit?{home:cs.pbpAudit.home,away:cs.pbpAudit.away,homeAlias:cs.pbpAudit.homeAlias,awayAlias:cs.pbpAudit.awayAlias,runs:cs.pbpAudit.runs}:null,
      rollingWindow:cs.rollingWindow||null,
      quarterDiffs:cs._serverQuarterDiffs||null,
      combinedRead:cs.combinedRead||null,
      throughput:cs.throughput?{classification:cs.throughput.classification,deficit:cs.throughput.deficit,remainingPoss:cs.throughput.remainingPoss,fTeam:cs.throughput.fTeam}:null,
      leadSafety:cs.leadSafety?{classification:cs.leadSafety.classification,lead:cs.leadSafety.lead,fTeam:cs.leadSafety.fTeam}:null,
      volumeThreat:cs.volumeThreat||null,
      espnWP:cs.espnWP?{home:cs.espnWP.home,away:cs.espnWP.away,homeAlias:cs.espnWP.homeAlias,awayAlias:cs.espnWP.awayAlias}:null,
    };

    // 3. Call analyze.js
    var ac=new AbortController();var acTimer=setTimeout(function(){ac.abort();},40000);
    var resp=await fetch(FN+'analyze',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    clearTimeout(acTimer);
    if(!resp.ok){var errD=await resp.json().catch(function(){return{error:'HTTP '+resp.status};});throw new Error(errD.error||'Analysis failed');}
    var data=await resp.json();

    // 4. Parse response
    var decision=parseSonnetDecision(data.analysis);
    if(decision){
      cs.prediction=cs.prediction||{};
      if(decision.fwpLabeled&&decision.fwpTeam1&&decision.fwpTeam2){
        var hUp=hA.toUpperCase(),aUp=aA.toUpperCase();
        cs.prediction.fwpLabeled=true;cs.prediction.fwpTeam1=decision.fwpTeam1;cs.prediction.fwpVal1=decision.fwpVal1;cs.prediction.fwpTeam2=decision.fwpTeam2;cs.prediction.fwpVal2=decision.fwpVal2;
        if(decision.fwpTeam1===hUp){cs.prediction.homeFWP=decision.fwpVal1;cs.prediction.awayFWP=decision.fwpVal2;}
        else if(decision.fwpTeam1===aUp){cs.prediction.awayFWP=decision.fwpVal1;cs.prediction.homeFWP=decision.fwpVal2;}
        cs.prediction.homeValue=cs.prediction.homeValue||{};cs.prediction.awayValue=cs.prediction.awayValue||{};
        cs.prediction.homeValue.fwp=cs.prediction.homeFWP;cs.prediction.awayValue.fwp=cs.prediction.awayFWP;
        if(decision.edgeNum!=null){
          var winTeam=cs.prediction.homeFWP>cs.prediction.awayFWP?'home':'away';
          var loseTeam=winTeam==='home'?'away':'home';
          cs.prediction[winTeam+'Value'].edge=decision.edgeNum;
          cs.prediction[loseTeam+'Value']=cs.prediction[loseTeam+'Value']||{};
          cs.prediction[loseTeam+'Value'].edge=-decision.edgeNum;
        }
      }
      if(decision.narrative)cs.prediction.narrative=decision.narrative;
      if(decision.risk)cs.prediction.risk=decision.risk;
      if(decision.closing)cs.prediction.closing=decision.closing;
      if(decision.disagreement)cs.prediction.disagreement=decision.disagreement;
      if(decision.conviction)cs.prediction.convictionTier=decision.conviction;
      if(decision.edgeNum!=null)cs.prediction.edgeNum=decision.edgeNum;
      if(decision.edge)cs.prediction.edge=decision.edge;
      cs.prediction.fwpRaw=decision.fwp||cs.prediction.fwpRaw;
    }
    cs.analysis=data.analysis;
    cs.sustainabilityAudit=data.sustainabilityAudit||null;
    console.log('[ANALYZE] Complete for',hA,'@',aA);
  }catch(e){
    console.error('[ANALYZE] Failed:',e.message);
  }finally{
    cs.analyzing=false;
    renderCard(gameId);
  }
}

// ── SWIPE-DOWN-TO-DISMISS ──
(function(){
  var drawer,startY,dy,dragging;
  document.addEventListener('DOMContentLoaded',function(){
    drawer=document.getElementById('drawer');
    drawer.addEventListener('touchstart',function(e){
      startY=e.touches[0].clientY;dy=0;dragging=false;
    },{passive:true});
    drawer.addEventListener('touchmove',function(e){
      var curY=e.touches[0].clientY;dy=curY-startY;
      if(drawer.scrollTop<=0&&dy>0){
        if(!dragging){dragging=true;drawer.style.transition='none';}
        drawer.style.transform='translateY('+dy+'px)';
        e.preventDefault();
      } else if(dragging&&dy<=0){
        // scrolled back up — cancel drag
        dragging=false;drawer.style.transition='';drawer.style.transform='';
      }
    },{passive:false});
    drawer.addEventListener('touchend',function(){
      if(!dragging){return;}
      if(dy>120){
        // Animate to bottom then clean up
        drawer.style.transition='transform .25s ease';
        drawer.style.transform='translateY(100%)';
        setTimeout(function(){
          drawer.style.transition='';drawer.style.transform='';
          drawer.classList.remove('open');
          document.getElementById('drawer-scrim').classList.remove('open');
          document.body.classList.remove('is-locked');
          _drawerGameId=null;
        },260);
      } else {
        // Snap back
        drawer.style.transition='transform .2s ease';
        drawer.style.transform='translateY(0)';
        setTimeout(function(){drawer.style.transition='';drawer.style.transform='';},210);
      }
      dragging=false;dy=0;
    },{passive:true});
  });
})();

function renderDrawer(gameId){

  var cs=cardState[gameId]||{};
  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var floor=getFloor(cs);var ctrlTeam=floor?floor.controlTeam:hA;
  var html='';

  // ═══ 1. GAME NARRATIVE (horizontal scroll) ═══
  var history=cs.analysisHistory||[];
  if(history.length>0){
    html+='<div class="drawer-section">';
    html+='<div style="display:flex;align-items:center;justify-content:space-between"><div class="drawer-section-title">Game Narrative \u00b7 '+history.length+' reads</div>';
    html+='<span style="font-family:var(--mono);font-size:10px;color:var(--fg-dim)">Q'+(history[0].period||'?')+' \u2192 Q'+(history[history.length-1].period||'?')+'</span></div>';
    html+='<div class="narr-scroll">';
    history.forEach(function(h,i){
      var isLatest=i===history.length-1;
      html+='<div class="narr-card" style="'+(isLatest?'border-color:var(--green-border)':'')+'">';
      html+='<div class="narr-top"><span class="narr-time">Q'+(h.period||'?')+' '+(h.clock||'')+'</span></div>';
      if(h.score)html+='<span class="narr-score">'+esc(h.score)+'</span>';
      if(h.controlTeam&&h.controlScore!=null)html+='<span class="narr-floor" style="color:var(--green)">'+esc(h.controlTeam)+' '+Number(h.controlScore).toFixed(2)+'</span>';
      var detail='';
      if(h.conviction)detail+=h.conviction;
      if(h.convictionCombo)detail+=' \u00b7 '+h.convictionCombo;
      if(h.entry)detail+=(detail?' \u00b7 ':'')+h.entry;
      if(detail)html+='<span class="narr-detail">'+esc(detail)+'</span>';
      if(h.conviction){
        var pCol=h.conviction==='DOMINANT'?'var(--green)':h.conviction==='STRONG'?'var(--green)':h.conviction==='EARNED'?'var(--amber)':'var(--fg-dim)';
        html+='<span class="narr-pill" style="color:'+pCol+';background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2)">'+esc(h.conviction)+'</span>';
      }
      // Sustainability badges
      if(h.sustainability){
        var sp=h.sustainability.split('|').map(function(s){return s.trim();});
        html+='<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:1px">';
        sp.forEach(function(part){
          var m=part.match(/^(\w+)\s*:\s*(.+)/);if(!m)return;
          var tm=m[1].trim(),tier=m[2].trim().toUpperCase();
          var sc=tier.includes('LOCKED')||tier.includes('DURABLE')?'locked':tier.includes('MIXED')||tier.includes('STALLED')?'mixed':tier.includes('FRAGILE')||tier.includes('UNSUSTAINABLE')?'fragile':'mixed';
          html+='<span class="sust-tier '+sc+'" style="font-size:8px;padding:1px 5px">'+esc(tm)+' '+esc(tier.substring(0,4))+'</span>';
        });
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div></div>';
  }

  // ═══ 2. QUARTER DOMINANCE GRID ═══
  html+='<div class="drawer-section">';
  html+='<div class="drawer-section-title">Quarter Dominance</div>';
  var diffs=cs._serverQuarterDiffs;
  if(diffs){
    var ctrlIsHome=ctrlTeam===hA;
    html+='<div style="font-family:var(--mono);font-size:9px;color:var(--fg-dim);margin-bottom:6px">\u2190 from '+esc(ctrlTeam)+' perspective</div>';
    var statDefs=[
      {label:'PNT',get:function(d){return d.points_in_the_paint||d.points_in_paint||0;}},
      {label:'FTA',get:function(d){return d.free_throws_att||0;}},
      {label:'3PM',get:function(d){return d.three_points_made||0;}},
      {label:'TO',get:function(d){return d.turnovers||d.total_turnovers||0;},invert:true},
      {label:'STL',get:function(d){return d.steals||0;}},
      {label:'AST',get:function(d){return d.assists||0;}}
    ];
    var keys=Object.keys(diffs).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b;});
    html+='<table class="qd-grid"><thead><tr><th></th>';
    statDefs.forEach(function(s){html+='<th>'+s.label+'</th>';});
    html+='</tr></thead><tbody>';
    var deltas={};statDefs.forEach(function(s){deltas[s.label]=[];});
    keys.forEach(function(qk){
      var d=diffs[qk];if(!d||!d.home||!d.away)return;
      var rw=cs.rollingWindow;var isPartial=(rw&&rw.partial_quarter===qk);
      html+='<tr><td>Q'+qk+(isPartial?'*':'')+'</td>';
      statDefs.forEach(function(s){
        var hVal=s.get(d.home);var aVal=s.get(d.away);
        // Delta from control team perspective
        var rawDelta=ctrlIsHome?hVal-aVal:aVal-hVal;
        // For TO: invert so positive = fewer TOs = good
        var delta=s.invert?-rawDelta:rawDelta;
        deltas[s.label].push(delta);
        var cls=delta>0?'pos':delta<0?'neg':'even';
        var txt=delta>0?'+'+delta:delta===0?'\u00b7':''+delta;
        html+='<td class="qd-cell '+cls+'">'+txt+'</td>';
      });
      html+='</tr>';
    });
    if(keys.length>=2){
      html+='<tr><td class="qd-trend" style="color:var(--fg-dim)">TREND</td>';
      statDefs.forEach(function(s){
        var arr=deltas[s.label];if(arr.length<2){html+='<td class="qd-trend qd-cell even">\u25ac</td>';return;}
        var latest=arr[arr.length-1];var avg=arr.reduce(function(a,b){return a+b;},0)/arr.length;
        var trend=latest>avg+0.5?'up':latest<avg-0.5?'down':'flat';
        var sym=trend==='up'?'\u25b2':trend==='down'?'\u25bc':'\u25ac';
        var col=trend==='up'?'pos':trend==='down'?'neg':'even';
        html+='<td class="qd-trend qd-cell '+col+'">'+sym+'</td>';
      });
      html+='</tr>';
    }
    html+='</tbody></table>';
  } else {
    html+='<div style="text-align:center;font-family:var(--sans);font-size:12px;color:var(--fg-dim);padding:16px 0">Quarter data not available</div>';
  }
  html+='</div>';

  // ═══ 3. SNAPSHOT HISTORY (from DB snapshots) ═══
  html+='<div class="drawer-section">';
  html+='<div class="drawer-section-title">Snapshot History</div>';
  var allSnaps=cs._allSnapshots;
  if(allSnaps&&allSnaps.length>0){
    // Sample every 3rd + first + last, then REVERSE (most recent first)
    var sampled=[];
    allSnaps.forEach(function(s,i){
      if(i===0||i===allSnaps.length-1||i%3===0)sampled.push(s);
    });
    // Precompute cumulative MF and peak for each sampled snapshot
    var mfMap={},pkMap={},fSum=0,fPk=0;
    allSnaps.forEach(function(s,i){
      fSum+=(s.floor_score||0);fPk=Math.max(fPk,s.floor_score||0);
      var idx=sampled.indexOf(s);if(idx>=0){mfMap[idx]=(fSum/(i+1));pkMap[idx]=fPk;}
    });
    sampled.reverse(); // most recent first
    // Build alert lookup by period+clock for cross-reference
    var alertLookup={};((_alertCache[gameId]||[])).forEach(function(a){
      var key='Q'+(a.period||'')+'_'+(a.clock||'');
      if(!alertLookup[key])alertLookup[key]=a;
    });

    // Column toggle state

// ── SCORING COMPOSITION (from PBP audit zone data) ──
function computeScoringComp(pbp,hA,aA,hPts,aPts){
  if(!pbp||!pbp.home||!pbp.away)return null;
  function breakdown(side,total){
    var rimM=side.rim?side.rim.made||0:0,rimA=side.rim?side.rim.att||0:0;
    var pntM=side.paint?side.paint.made||0:0,pntA=side.paint?side.paint.att||0:0;
    var midM=side.mid?side.mid.made||0:0,midA=side.mid?side.mid.att||0:0;
    var threeM=side.threes?side.threes.made||0:0,threeA=side.threes?side.threes.att||0:0;
    // Combine rim+paint into "paint" category
    var allPaintM=rimM+pntM,allPaintA=rimA+pntA;
    var paintPts=allPaintM*2;
    var threePts=threeM*3;
    var midPts=midM*2;
    var ftPts=Math.max(0,total-paintPts-threePts-midPts);
    // FT made/att not available from PBP zones — estimate made from pts
    var ftM=ftPts,ftA=ftPts>0?Math.round(ftPts/0.78):ftPts; // rough estimate
    var structural=paintPts+ftPts;
    var variance=threePts+midPts;
    var sPct=total>0?Math.round(structural/total*100):0;
    var paintPct=allPaintA>0?Math.round(allPaintM/allPaintA*100):0;
    var threePct=threeA>0?Math.round(threeM/threeA*100):0;
    var midPct=midA>0?Math.round(midM/midA*100):0;
    return{total:total,paint:paintPts,ft:ftPts,three:threePts,midOther:midPts,
      structural:structural,variance:variance,sPct:sPct,vPct:100-sPct,
      paintM:allPaintM,paintA:allPaintA,paintPct:paintPct,
      ftM:ftM,ftA:ftA,
      tpm:threeM,tpa:threeA,threePct:threePct,
      midM:midM,midA:midA,midPct:midPct};
  }
  var h=breakdown(pbp.home,hPts);var a=breakdown(pbp.away,aPts);
  h.team=hA;a.team=aA;
  var margin=hPts-aPts;var absMargin=Math.abs(margin);
  var sDelta=h.structural-a.structural;var vDelta=h.variance-a.variance;
  var leadTeam=margin>=0?hA:aA,trailTeam=margin>=0?aA:hA;
  var leadS=margin>=0?sDelta:-sDelta;var leadV=margin>=0?vDelta:-vDelta;
  // Lead source classification
  var classification='MIXED',durability='';
  if(absMargin<=2){classification='EVEN';durability='Margin too small to classify';}
  else if(leadS>=absMargin*0.6){classification='STRUCTURAL';durability=leadTeam+' lead is structural \u2014 paint/FT drives margin (+'+Math.abs(Math.round(leadS))+')';}
  else if(leadV>=absMargin*0.6){classification='VOLATILE';durability=leadTeam+' lead is variance-driven \u2014 3PT/mid drives margin with uncertain sustainability. Structural favors '+(leadS>=0?leadTeam:trailTeam)+' (+'+Math.abs(Math.round(leadS<0?leadS:leadS))+')';}
  else{classification='MIXED';durability='No single source dominates margin';}
  return{home:h,away:a,structuralDelta:sDelta,varianceDelta:vDelta,leadTeam:leadTeam,classification:classification,durability:durability};
}

// ── BUILD SCORING COMP FROM AVAILABLE DATA ──
function buildScoringCompForCard(gameId){
  var cs=cardState[gameId];if(!cs||!cs.pbpAudit)return;
  var g=games.find(function(x){return x.id===gameId;});if(!g)return;
  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var sc=computeScoringComp(cs.pbpAudit,hA,aA,g.homePoints||0,g.awayPoints||0);
  if(!sc)return;
  // Compute trend arrows from current quarter scoring events vs cumulative
  var sEvts=cs.pbpAudit?cs.pbpAudit.scoringEvents:null;
  if(sEvts&&sEvts.length>=4){
    var maxQ=0;sEvts.forEach(function(e){if(e.q>maxQ)maxQ=e.q;});
    if(maxQ>=2){
      var curQEvts=sEvts.filter(function(e){return e.q===maxQ;});
      if(curQEvts.length>=2){
        // Current quarter structural/variance per team
        var hStructQ=0,aStructQ=0,hVarQ=0,aVarQ=0;
        curQEvts.forEach(function(e){
          var isH=e.tm===sc.home.team;
          if(e.type==='3PT'){if(isH)hVarQ+=e.pts;else aVarQ+=e.pts;}
          else{if(isH)hStructQ+=e.pts;else aStructQ+=e.pts;}
        });
        var qSDelta=hStructQ-aStructQ;
        var qVDelta=hVarQ-aVarQ;
        // Per-quarter average from cumulative (normalize by quarters played)
        var avgS=sc.structuralDelta/maxQ;
        var avgV=sc.varianceDelta/maxQ;
        sc.structTrend=qSDelta>avgS+2?'up':qSDelta<avgS-2?'down':'flat';
        sc.varTrend=qVDelta>avgV+2?'up':qVDelta<avgV-2?'down':'flat';
        sc.trendQ='Q'+maxQ;
      }
    }
  }
  cs.scoringComp=sc;renderCard(gameId);
}

// ── FETCH PBP DATA FROM DB ──
async function fetchPBPFromDB(gameId){
  if(!dbReady)return;
  var cs=cardState[gameId];if(!cs)return;
  if(cs.pbpAudit)return; // already have it
  try{
    var r=await fetch(FN+'db-api?action=get_pbp&game_id='+encodeURIComponent(gameId));
    if(!r.ok)return;var data=await r.json();
    if(data.pbp&&(data.pbp.scoringEvents||data.pbp.runs)){
      cs.pbpAudit=data.pbp;
      cs.pbpTime=new Date(data.saved_at||Date.now());
      console.log('[PBP] Loaded from DB for',gameId);
      buildScoringCompForCard(gameId);
      renderCard(gameId);
    }
  }catch(e){console.warn('[PBP] DB fetch failed:',e.message);}
}

// ── RENDER MARGIN FLOW + SCORING RUNS ──
function renderMarginFlowSection(id,cs,hA,aA){
  var pbp=cs.pbpAudit;if(!pbp)return'';
  var sEvts=pbp.scoringEvents||[];var runs=pbp.runs||[];
  if(sEvts.length<4&&runs.length===0)return'';

  var bigRun=runs.length>0?runs.reduce(function(a,b){return b.pts>a.pts?b:a;},runs[0]):null;
  var summary=runs.length+' runs'+(bigRun?' \u00b7 '+bigRun.team+' '+bigRun.pts+'-'+(bigRun.oppPts||0):'');
  var isOpen=_collOpen[id+'_mf']||false;
  var selRun=_selectedRun[id];

  var html='<div class="collapsible">';
  html+='<div class="coll-header" onclick="toggleColl(\''+id+'\',\'mf\')">';
  html+='<span class="coll-chevron'+(isOpen?' open':'')+'">\u25b8</span>';
  html+='<span class="coll-title">Margin Flow</span>';
  html+='<span class="coll-summary">'+esc(summary)+'</span>';
  html+='</div>';
  html+='<div class="coll-body'+(isOpen?' open':'')+'">';
  html+='<div class="coll-inner">';

  // SVG margin chart
  if(sEvts.length>=4){
    var W=600,H=220,PL=28,PR=10,PT=20,PB=20;
    var mid=PT+(H-PT-PB)/2;
    var maxAbs=Math.max.apply(null,sEvts.map(function(e){return Math.abs(e.m);}));
    if(maxAbs<4)maxAbs=4;
    var xs=(W-PL-PR)/Math.max(sEvts.length-1,1);
    var ys=((H-PT-PB)/2)/maxAbs;
    var pathD=sEvts.map(function(e,i){return(i===0?'M':'L')+(PL+i*xs).toFixed(1)+','+(mid+e.m*ys).toFixed(1);}).join(' ');

    // Quarter dividers
    var qDivs=[];
    for(var qi=1;qi<sEvts.length;qi++){if(sEvts[qi].q!==sEvts[qi-1].q)qDivs.push({x:PL+(qi-0.5)*xs,label:'Q'+sEvts[qi].q});}

    // Run regions
    var runRegions=runs.map(function(run,ri){
      var fi=run.si!=null?run.si:0;var li=run.ei!=null?run.ei:fi;
      if(fi>=sEvts.length)fi=sEvts.length-1;if(li>=sEvts.length)li=sEvts.length-1;
      var x1=PL+Math.max(0,fi-0.5)*xs;var x2=PL+Math.min(sEvts.length-1,li+0.5)*xs;
      var isA=run.team===aA;var active=selRun===ri;
      return{x1:x1,x2:x2,ri:ri,isA:isA,active:active,tm:run.team,pts:run.pts,opp:run.oppPts||0};
    });

    var svg='<div class="mf-canvas"><svg class="mf-svg" viewBox="0 0 '+W+' '+H+'" style="aspect-ratio:'+W+'/'+H+'">';
    // Run regions (behind everything)
    runRegions.forEach(function(r){
      var bg=r.active?(r.isA?'rgba(248,113,113,0.15)':'rgba(52,211,153,0.15)'):(r.isA?'rgba(248,113,113,0.05)':'rgba(52,211,153,0.05)');
      var brd=r.active?(r.isA?'var(--coral)':'var(--green)'):'transparent';
      svg+='<rect x="'+r.x1.toFixed(1)+'" y="'+(PT-2)+'" width="'+Math.max(r.x2-r.x1,4).toFixed(1)+'" height="'+(H-PT-PB+4)+'" fill="'+bg+'" rx="2" onclick="selectRun(\''+id+'\','+r.ri+')" style="cursor:pointer"/>';
    });
    // Quarter dividers
    qDivs.forEach(function(q){
      svg+='<line x1="'+q.x.toFixed(1)+'" y1="'+(PT-2)+'" x2="'+q.x.toFixed(1)+'" y2="'+(H-PB+2)+'" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,4"/>';
      svg+='<text x="'+q.x.toFixed(1)+'" y="'+(PT-6)+'" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="11" font-family="var(--mono)">'+q.label+'</text>';
    });
    // Zero line
    svg+='<line x1="'+PL+'" y1="'+mid+'" x2="'+(W-PR)+'" y2="'+mid+'" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3,4"/>';
    // Team labels
    svg+='<text x="4" y="'+(PT+8)+'" fill="rgba(52,211,153,0.5)" font-size="11" font-weight="600" font-family="var(--mono)">'+esc(hA)+'</text>';
    svg+='<text x="4" y="'+(H-PB+14)+'" fill="rgba(248,113,113,0.5)" font-size="11" font-weight="600" font-family="var(--mono)">'+esc(aA)+'</text>';
    // Margin path
    svg+='<path d="'+pathD+'" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linejoin="round"/>';
    // Shot markers
    sEvts.forEach(function(ev,i){
      var x=PL+i*xs,y=mid+ev.m*ys;
      var isA=ev.tm===aA;
      var c=isA?'var(--coral)':'var(--green)';
      if(ev.type==='3PT'){
        svg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5.5" fill="none" stroke="'+c+'" stroke-width="1.4" opacity="0.8"/>';
        svg+='<line x1="'+(x-7).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+(x+7).toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+c+'" stroke-width="0.7" opacity="0.6"/>';
        svg+='<line x1="'+x.toFixed(1)+'" y1="'+(y-7).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+(y+7).toFixed(1)+'" stroke="'+c+'" stroke-width="0.7" opacity="0.6"/>';
      } else if(ev.type==='FT'){
        svg+='<rect x="'+(x-3).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" width="6" height="6" rx="1" fill="'+c+'" opacity="0.55"/>';
      } else {
        svg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.5" fill="'+c+'" opacity="0.7"/>';
      }
    });
    // Current margin label
    if(sEvts.length>0){
      var last=sEvts[sEvts.length-1];
      var lx=PL+(sEvts.length-1)*xs;var ly=mid+last.m*ys;
      svg+='<text x="'+(lx-10).toFixed(1)+'" y="'+(ly+(last.m>0?16:-10)).toFixed(1)+'" text-anchor="middle" fill="var(--fg-primary)" font-size="13" font-weight="700" font-family="var(--mono)">'+(last.m>0?'+':'')+last.m+'</text>';
    }
    svg+='</svg></div>';
    html+=svg;

    // Legend
    html+='<div class="mf-legend">';
    html+='<span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--fg-dim)"/></svg> 2PT</span>';
    html+='<span><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="var(--fg-dim)" stroke-width="1"/><line x1="2" y1="7" x2="12" y2="7" stroke="var(--fg-dim)" stroke-width="0.5"/><line x1="7" y1="2" x2="7" y2="12" stroke="var(--fg-dim)" stroke-width="0.5"/></svg> 3PT</span>';
    html+='<span><svg width="10" height="10"><rect x="2" y="2" width="6" height="6" rx="1" fill="var(--fg-dim)" opacity="0.55"/></svg> FT</span>';
    html+='</div>';
  }

  // Scoring runs list
  if(runs.length>0){
    html+='<div class="run-list">';
    var sorted=runs.slice().sort(function(a,b){return b.pts-a.pts;});
    var maxRP=sorted[0].pts||1;
    sorted.forEach(function(run,i){
      var ri=runs.indexOf(run);
      var isA=run.team===aA;
      var tc=isA?'var(--coral)':'var(--green)';
      var active=selRun===ri;
      // Mechanism bar segments
      var mc={};(run.mechanism||[]).forEach(function(m){mc[m]=(mc[m]||0)+1;});
      var tot=(run.mechanism||[]).length||1;
      html+='<div class="run-row'+(active?' active':'')+'" onclick="selectRun(\''+id+'\','+ri+')">';
      html+='<span class="run-team" style="color:'+tc+'">'+esc(run.team)+'</span>';
      html+='<span class="run-score">'+run.pts+'-'+(run.oppPts||0)+'</span>';
      html+='<div class="run-bar">';
      ['2PT','FT','3PT'].forEach(function(m){
        var ct=mc[m]||0;if(ct===0)return;
        var w=ct/tot*100;
        var col=m==='2PT'?'var(--green)':m==='FT'?'var(--green-soft)':'var(--amber)';
        html+='<div style="width:'+w+'%;height:100%;background:'+col+'"></div>';
      });
      html+='</div>';
      html+='<span class="run-qtr">Q'+(run.q||'?')+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  html+='</div></div></div>';
  return html;
}

// TOAST — Entry Signal + Line Shopping
// ══════════════════════════════════════════════════════════════════════════════

  draftkings:{name:'DraftKings',app:'draftkings://',web:'https://sportsbook.draftkings.com'},

  fliff:{name:'Fliff',app:'',web:'https://www.getfliff.com'},
  hardrockbet:{name:'Hard Rock',app:'',web:'https://www.hardrockbet.com'}
};
var ENTRY_TYPES={'BUY':1,'WINDOW_BUY':1,'BWC_EDGE':1,'POSITION_OPEN':1,'RE_ENTRY_VALUE':1};
var _seenAlertIds=new Set();
var _toastAlert=null;
var _toastGameId=null;
var _latestSendAlert=null;
var _toastVisible=false;
var _toastOddsTimer=null;

async function pollAlerts(){
  if(!dbReady)return;
  var d=getSlateDate(dateOffset);
  try{
    var r=await fetch(FN+'db-api?action=get_alerts&date='+d.str+'&limit=200');
    if(!r.ok)return;var data=await r.json();
    var alerts=data.alerts||data||[];
    if(!Array.isArray(alerts))return;
    _alertCache={};
    alerts.forEach(function(a){
      if(!a.game_id)return;
      if(!_alertCache[a.game_id])_alertCache[a.game_id]=[];
      _alertCache[a.game_id].push(a);
    });
    _alertsFetched=true;
    var newSend=null;
    alerts.forEach(function(a){
      if(a.agent_decision==='SEND'&&!_seenAlertIds.has(a.id)){
        _seenAlertIds.add(a.id);
        _latestSendAlert=a;
        if(ENTRY_TYPES[a.alert_type])newSend=a;
      }
    });
    if(!_latestSendAlert){
      for(var i=alerts.length-1;i>=0;i--){
        if(alerts[i].agent_decision==='SEND'){_latestSendAlert=alerts[i];break;}
      }
    }
    var badge=document.getElementById('toast-badge');
    if(_latestSendAlert&&badge){badge.textContent='';badge.classList.add('show');}
    if(newSend)fireToast(newSend);
  }catch(e){console.warn('[TOAST] Alert poll failed:',e.message);}
}

function renderToastHeader(alert){
  var g=games.find(function(x){return x.id===alert.game_id;});
  var hA=g?.home?.alias||'HOME',aA=g?.away?.alias||'AWAY';
  var betTeam=alert.floor_team||alert.control_team||'?';

  document.getElementById('toast-label').textContent='Entry Signal';
  var typeLabel=(alert.alert_type||'').replace(/_/g,' ');
  if(alert.alert_tier)typeLabel+=' \u00b7 '+alert.alert_tier;
  var time='';if(alert.period)time+='Q'+alert.period;if(alert.clock)time+=' '+alert.clock;
  if(time)typeLabel+=' \u00b7 '+time;
  document.getElementById('toast-alert-info').textContent=typeLabel;

  var margin=alert.margin!=null?Math.abs(alert.margin):'?';
  var trailing=alert.margin!=null&&alert.margin<0;
  var gameText=betTeam+(trailing?' trailing '+margin:' leading '+margin);
  gameText+=' \u00b7 '+aA+'@'+hA;
  if(alert.floor_score!=null)gameText+=' \u00b7 Floor '+Number(alert.floor_score).toFixed(2);
  document.getElementById('toast-game').textContent=gameText;
}

function fireToast(alert){
  _toastAlert=alert;_toastGameId=alert.game_id;
  renderToastHeader(alert);
  var oddsEl=document.getElementById('toast-odds');
  oddsEl.innerHTML='<div class="toast-no-odds">Loading odds\u2026</div>';
  showToastEl();
  fetchLineShop(alert);
  // Only poll live odds for non-FINAL games
  var g=games.find(function(x){return x.id===alert.game_id;});
  if(g&&getState(g)!=='FINAL')startToastOddsPoll();
  else stopToastOddsPoll();
}

async function fetchLineShop(alert){
  var oddsEl=document.getElementById('toast-odds');
  var g=games.find(function(x){return x.id===alert.game_id;});
  if(!g){oddsEl.innerHTML='<div class="toast-no-odds">Game not found</div>';return;}

  var hA=g.home?.alias||'HOME',aA=g.away?.alias||'AWAY';
  var hName=g.home?.name||'',aName=g.away?.name||'';
  var betTeam=alert.floor_team||alert.control_team||'?';
  var isHome=betTeam.toUpperCase()===hA.toUpperCase();
  // The team name to match in Odds API outcomes
  var betFullName=isHome?(g.home?.market||'')+' '+hName:(g.away?.market||'')+' '+aName;

  try{
    // For completed games, use historical endpoint with game's scheduled time
    var gs=getState(g);
    var oddsUrl=FN+'odds-api';
    if(gs==='FINAL'&&g.scheduled){
      // Normalize to ISO Z format (The Odds API requires this)
      var histDate=new Date(g.scheduled).toISOString();
      oddsUrl+=('?date='+encodeURIComponent(histDate));
    }
    var r=await fetch(oddsUrl);
    if(!r.ok){var errD=await r.json().catch(function(){return{};});console.warn('[ODDS API] Error detail:',errD.detail||errD.error);throw new Error(errD.error||'HTTP '+r.status);}
    var data=await r.json();
    var oddsGames=data.games||[];
    if(data.credits)console.log('[ODDS API]'+(data.historical?' (historical)':'')+' Credits remaining:',data.credits.remaining,'used:',data.credits.used);

    // Match our game in The Odds API response — exact match on "Market Name" (e.g., "Boston Celtics")
    var homeFullName=((g.home?.market||'')+' '+hName).trim().toLowerCase();
    var awayFullName=((g.away?.market||'')+' '+aName).trim().toLowerCase();
    var match=null;
    oddsGames.forEach(function(og){
      if((og.home_team||'').toLowerCase()===homeFullName&&(og.away_team||'').toLowerCase()===awayFullName){
        match=og;
      }
    });

    if(!match){
      oddsEl.innerHTML='<div class="toast-no-odds">Game not found in odds feed'+(gs==='FINAL'?' (historical)':'')+'</div>';
      return;
    }

    // Extract bet team's ML from each bookmaker
    var rows=[];
    (match.bookmakers||[]).forEach(function(bk){
      var mkt=(bk.markets||[]).find(function(m){return m.key==='h2h';});
      if(!mkt)return;
      // Find the outcome for our bet team
      var outcome=null;
      (mkt.outcomes||[]).forEach(function(o){
        var oName=o.name.toLowerCase();
        if(isHome&&oName===match.home_team.toLowerCase())outcome=o;
        else if(!isHome&&oName===match.away_team.toLowerCase())outcome=o;
      });
      if(!outcome||outcome.price==null)return;
      var bkInfo=BOOK_LINKS[bk.key]||{name:bk.title||bk.key,app:'',web:''};
      rows.push({key:bk.key,name:bkInfo.name,app:bkInfo.app,web:bkInfo.web,ml:Number(outcome.price)});
    });

    if(rows.length===0){oddsEl.innerHTML='<div class="toast-no-odds">No ML odds for '+esc(betTeam)+'</div>';return;}

    rows.sort(function(a,b){return b.ml-a.ml;});
    var bestML=rows[0].ml;

    var html='<div class="toast-odds-grid">';
    html+='<div style="padding:0 8px 6px;font-family:var(--mono);font-size:10px;color:var(--fg-dim)">'+esc(betTeam)+' ML \u00b7 '+rows.length+' books</div>';
    rows.forEach(function(r){
      var isBest=r.ml===bestML&&rows.length>1;
      var mlStr=r.ml>0?'+'+r.ml:String(r.ml);
      var hasLink=r.app||r.web;
      html+='<div class="toast-odds-row'+(isBest?' best':'')+'"'+(hasLink?' onclick="openBook(\''+esc(r.app||'')+'\',\''+esc(r.web)+'\')"':'')+'>';
      html+='<span class="toast-book">'+esc(r.name)+'</span>';
      html+='<span class="toast-ml-val">'+esc(mlStr)+'</span>';
      if(isBest)html+='<span class="toast-best-tag">BEST</span>';
      if(hasLink)html+='<span class="toast-open">Open \u2192</span>';
      html+='</div>';
    });
    html+='</div>';
    oddsEl.innerHTML=html;
  }catch(e){
    oddsEl.innerHTML='<div class="toast-no-odds">Odds fetch failed: '+esc(e.message)+'</div>';
    console.warn('[TOAST] Odds API error:',e.message);
  }
}

function showToastEl(){
  var t=document.getElementById('toast');
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  _toastVisible=true;
}

function showToast(){
  if(_latestSendAlert){fireToast(_latestSendAlert);}
  else{
    document.getElementById('toast-label').textContent='No Alerts';
    document.getElementById('toast-alert-info').textContent='No SEND alerts today';
    document.getElementById('toast-game').textContent='Alerts will appear here when signals fire';
    document.getElementById('toast-odds').innerHTML='';
    showToastEl();
  }
}

function dismissToast(){
  document.getElementById('toast').classList.remove('show');
  _toastVisible=false;
  stopToastOddsPoll();
}

function startToastOddsPoll(){
  stopToastOddsPoll();
  _toastOddsTimer=setInterval(function(){
    if(_toastAlert&&_toastVisible)fetchLineShop(_toastAlert);
    else stopToastOddsPoll();
  },10000);
}

function stopToastOddsPoll(){
  if(_toastOddsTimer){clearInterval(_toastOddsTimer);_toastOddsTimer=null;}
}

function openBook(appUrl,webUrl){
  // Try app scheme first, fall back to web after 1.5s if app didn't open
  var t=Date.now();
  window.location=appUrl;
  setTimeout(function(){
    // If less than 2s elapsed and page is still visible, app didn't open
    if(!document.hidden&&Date.now()-t<3000){
      window.open(webUrl,'_blank');
    }
  },1500);
}

function toastScrollToGame(){
  if(_toastGameId){
    dismissToast();
    scrollToGame(_toastGameId);
  }
}

// Toast swipe-down-to-dismiss
(function(){
  var toast,tStartY,tDy,tDragging;
  document.addEventListener('DOMContentLoaded',function(){
    toast=document.getElementById('toast');
    toast.addEventListener('touchstart',function(e){
      tStartY=e.touches[0].clientY;tDy=0;tDragging=false;
    },{passive:true});
    toast.addEventListener('touchmove',function(e){
      tDy=e.touches[0].clientY-tStartY;
      if(tDy>0){
        if(!tDragging){tDragging=true;toast.style.transition='none';}
        toast.style.transform='translateY('+tDy+'px)';
        e.preventDefault();
      }
    },{passive:false});
    toast.addEventListener('touchend',function(){
      if(!tDragging)return;
      if(tDy>80){
        toast.style.transition='transform .2s ease';
        toast.style.transform='translateY(100%)';
        setTimeout(function(){toast.style.transition='';toast.style.transform='';dismissToast();},210);
      } else {
        toast.style.transition='transform .2s ease';
        toast.style.transform='translateY(0)';
        setTimeout(function(){toast.style.transition='';toast.style.transform='';},210);
      }
      tDragging=false;tDy=0;
    },{passive:true});
  });
})();
