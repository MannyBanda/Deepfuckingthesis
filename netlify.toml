[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = []

[functions."generate-thesis"]
  timeout = 120

[functions."analyze"]
  timeout = 60

[functions."clutch-ocr"]
  timeout = 60

[functions."test-bdl"]
  timeout = 60

[functions."post-game-agent"]
  timeout = 120

[functions."test-agent"]
  timeout = 60

[functions."poll-live-bdl"]
  timeout = 120

[functions."test-monitor"]
  timeout = 120

[functions."backtest-wnba"]
  timeout = 120

[functions."validate-wnba"]
  timeout = 120

[functions."backtest-nba-playoffs"]
  timeout = 120

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
