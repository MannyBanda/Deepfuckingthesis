function clearTheses(){if(!confirm('Clear all theses?'))return;Object.keys(theses).forEach(k=>delete theses[k]);Object.keys(confCache).forEach(k=>delete confCache[k]);localStorage.removeItem('ncaamb:theses');localStorage.removeItem('ncaamb:confTable');games.filter(g=>selIds.includes(g.id)).forEach(g=>renderCard(g));renderConfidenceTable();}
function clearMarketCache(){if(!confirm('Clear all cached clutch + odds data?'))return;Object.keys(cachedClutch).forEach(k=>delete cachedClutch[k]);Object.keys(cachedOdds).forEach(k=>delete cachedOdds[k]);Object.keys(cachedOddsHistory).forEach(k=>delete cachedOddsHistory[k]);globalClutchData=null;localStorage.removeItem('ncaamb:clutch');localStorage.removeItem('ncaamb:odds');localStorage.removeItem('ncaamb:oddsHist');localStorage.removeItem('ncaamb:globalClutch');for(const id of selIds){const cs=cardState[id];if(cs){cs.clutchData=null;cs.clutchTier=3;cs.oddsData=null;cs.oddsHistory=[];}}games.filter(g=>selIds.includes(g.id)).forEach(g=>renderCard(g));}
function parseThesis(t){
  if(!t)return{lean:null,entry:null,pass:null,mlThreshold:null,watches:[],flags:[],shotDiet:null,heaterWatch:null,clutchGate:null};
  const r={lean:null,entry:null,pass:null,mlThreshold:null,watches:[],flags:[],shotDiet:null,heaterWatch:null,clutchGate:null};
  t.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const l=line.toLowerCase();
    if(l.startsWith('lean:'))r.lean=line.replace(/^lean:?\s*/i,'').trim();
    else if(l.startsWith('entry'))r.entry=line.replace(/^entry(?: trigger)?:?\s*/i,'').trim();
    else if(l.startsWith('pass'))r.pass=line.replace(/^pass(?: if)?:?\s*/i,'').trim();
    else if(l.startsWith('ml threshold'))r.mlThreshold=line.replace(/^ml\s*threshold:?\s*/i,'').trim();
    else if(l.startsWith('shot diet'))r.shotDiet=line.replace(/^shot\s*diet:?\s*/i,'').trim();
    else if(l.startsWith('3pt heater'))r.heaterWatch=line.replace(/^3pt\s*heater\s*watchlist:?\s*/i,'').trim();
    else if(l.startsWith('clutch gate'))r.clutchGate=line.replace(/^clutch\s*gate:?\s*/i,'').trim();
    else if(l.startsWith('watch:'))r.watches.push(line.replace(/^-?\s*watch:?\s*/i,'').trim());
    else if(l.startsWith('flag:')||l.startsWith('⚠')||l.startsWith('!'))r.flags.push(line.replace(/^[⚠!]\s*|^flag:?\s*/i,'').trim());
    else if(/^\d+\.\s+/.test(line))r.watches.push(line.replace(/^\d+\.\s+/,''));
  });
  // Try to extract ML value from threshold line (e.g., "CLE below -250 ML")
  if(r.mlThreshold){
    const mlMatch = r.mlThreshold.match(/below\s+([+-]?\d+)/i);
    if(mlMatch) r.mlValue = parseInt(mlMatch[1]);
  }
  return r;
}
// ── CONFIDENCE TABLE — live-updating command center ──
function renderConfidenceTable(){
  const el = document.getElementById('conf-table');
  if(!el) return;
  const entryPriority = {'OPTIMAL WINDOW':0,'WINDOW OPEN':1,'WINDOW CLOSING':2,'NO WINDOW':3,'FADE':4};
  const rows = [];
  for(const g of games){
    const t = theses[g.id];
    const hA = g.home?.alias||'HOME', aA = g.away?.alias||'AWAY';
    const matchup = aA + ' @ ' + hA;
    const state = getState(g);
    // Parse thesis baseline
    let team='', score=0, verdict='';
    const csMatch = t ? t.match(/CONTROL\s+SCORE:\s*(\w+)\s+([\d.]+)\s*[—–-]\s*(\w+)/i) : null;
    if(csMatch){ team=csMatch[1]; score=parseFloat(csMatch[2]); verdict=csMatch[3]; }
    const p = parseThesis(t);
    // ── THESIS SCORE RECOMPUTE — parse I1-I5 from thesis text, recompute weighted sum (score authority) ──
    const cs = cardState[g.id];
    if(!cs?.sonnetIndicators && t){
      const thesisParsed = parseSonnetScores(t, hA, aA);
      if(thesisParsed){
        const Wt = {I1:0.10, I2:0.15, I3:0.20, I4:0.30, I5:0.25};
        const tRaw = thesisParsed.I1.score*Wt.I1 + thesisParsed.I2.score*Wt.I2 + thesisParsed.I3.score*Wt.I3 + thesisParsed.I4.score*Wt.I4 + thesisParsed.I5.score*Wt.I5;
        const tHome = tRaw >= 0.5;
        const tScore = tHome ? tRaw : 1 - tRaw;
        const tTeam = tHome ? hA : aA;
        // Use Sonnet's team call but client-computed weighted sum
        if(Math.abs(tScore - score) >= 0.03){
          if(cs && !cs._thesisRecomputeLogged && Date.now() - _lastThesisRecomputeLog > 30000){ cs._thesisRecomputeLogged=true; _lastThesisRecomputeLog = Date.now(); console.log('THESIS RECOMPUTE: Sonnet stated ' + team + ' ' + score.toFixed(2) + ' | Client computed ' + tTeam + ' ' + tScore.toFixed(3)); }
          team = tTeam; score = tScore; verdict = getVerdict(score)?.label || verdict;
        }
      }
    }
    // Pull live data from cardState
    const si = cs?.sonnetIndicators;
    if(si && si.score){
      var siTeam = si.controlTeam;
      // If Sonnet said "Neither"/"EVEN", derive team from indicator leaders
      if(!siTeam || siTeam==='Neither' || siTeam==='EVEN'){
        var hVotes=0, aVotes=0;
        [si.I1,si.I2,si.I3,si.I4,si.I5].forEach(function(d){
          if(!d||d.leader==='EVEN') return;
          var lUp = (d.leader||'').toUpperCase().substring(0,3);
          if(lUp===hA.toUpperCase().substring(0,3)) hVotes++;
          else aVotes++;
        });
        siTeam = hVotes>=aVotes ? hA : aA;
      }
      team=siTeam; score=si.score; verdict=getVerdict(si.score)?.label||verdict;
    }
    // ── FLOOR ENFORCEMENT — SIA guarantees minimum score for healthy team ──
    if(cs?.floorScores && team){
      const teamUp = team.toUpperCase();
      const isHome = teamUp === hA.toUpperCase() || teamUp.includes(hA.toUpperCase().substring(0,3));
      const floor = isHome ? cs.floorScores.home : cs.floorScores.away;
      if(floor && score < floor.floor){
        console.log('FLOOR OVERRIDE: ' + team + ' score ' + score.toFixed(3) + ' below floor ' + floor.floor.toFixed(3) + ' → enforcing floor');
        score = floor.floor;
        verdict = getVerdict(score)?.label || verdict;
      }
    }
    const pred = cs?.prediction;
    const fwp = pred?.fwp || null;
    const edge = pred?.edgeNum ?? null;
    const entry = pred?.entry || null;
    const conviction = pred?.conviction || null;
    const thesisStatus = pred?.thesisStatus || null;
    // Sustainability from audit (server-side)
    let sustHome = null, sustAway = null;
    const sa = cs?.sustainabilityAudit;
    if(sa){ sustHome = sa.homeTier || sa.home?.tier || null; sustAway = sa.awayTier || sa.away?.tier || null; }
    else if(pred?.sustainability){ sustHome = pred.sustainability; sustAway = null; }
    // Prefer fresh client-computed sustainability for any state
    if(cs?.clientSustainability){
      const cS = cs.clientSustainability;
      if(cS.home?.tier) sustHome = cS.home.tier;
      if(cS.away?.tier) sustAway = cS.away.tier;
    }
    // Live score
    const homeScore = g.homePoints, awayScore = g.awayPoints;
    const period = g.period||0, clock = g.clock||'';
    // Highest FWP team edge (replaces best edge)
    let fwpTeamAlias = null, fwpTeamEdge = null, fwpTeamFwp = null, fwpTeamEntry = null;
    const csPred = cs?.prediction;
    if(csPred?.homeValue && csPred?.awayValue){
      const hv = csPred.homeValue, av = csPred.awayValue;
      if(hv.fwp >= av.fwp){ fwpTeamAlias = hv.team; fwpTeamEdge = hv.edge; fwpTeamFwp = hv.fwp; }
      else { fwpTeamAlias = av.team; fwpTeamEdge = av.edge; fwpTeamFwp = av.fwp; }
    }
    fwpTeamEntry = csPred?.entry || null;
    const signal = csPred?.signalType || null;
    // Rolling window + gap for confidence table
    const rwData = cs?.rollingWindow;
    const accelData = cs?.acceleration;
    const crData = cs?.combinedRead;
    const windowScore = (rwData && rwData.available) ? rwData.score : null;
    const windowTeam = (rwData && rwData.available) ? rwData.controlTeam : null;
    const gapVal = (accelData && accelData.entries && accelData.entries.length>0) ? accelData.entries[accelData.entries.length-1].gap : null;
    const accelLabel = accelData?.accel || null;
    const combinedReadLabel = crData?.read || null;
    const tpData = cs?.throughput;
    const tpClass = tpData?.classification || null;
    const tpConSwing = tpData?.conservative?.totalSwing || null;
    const tpDeficit = tpData?.deficit || null;
    const lsData = cs?.leadSafety;
    const lsClass = lsData?.classification || null;
    const lsConSwing = lsData?.conservative?.totalSwing || null;
    const lsLead = lsData?.lead || null;
    const row = {matchup, team, score, verdict, gameId:g.id, state, fwp, edge, entry, conviction, thesisStatus, sustHome, sustAway, homeScore, awayScore, period, clock, hA, aA, entryIf:p.entry||null, passIf:p.pass||null, fwpTeamAlias, fwpTeamEdge, fwpTeamFwp, fwpTeamEntry, signal, windowScore, windowTeam, gapVal, accelLabel, combinedReadLabel, tpClass, tpConSwing, tpDeficit, lsClass, lsConSwing, lsLead};
    // Persist live data to cache whenever we have analysis results or fresh live sustainability
    if(pred || si || (state==='LIVE' && (sustHome || sustAway))){
      persistConfRow(g.id, {team, score, verdict, fwp, edge, entry, conviction, thesisStatus, sustHome, sustAway, homeScore, awayScore, period, clock, state, fwpTeamAlias, fwpTeamEdge, fwpTeamFwp, fwpTeamEntry, signal:csPred?.signalType||null, ts:Date.now()});
    } else {
      // Fall back to cached data if no live cardState (e.g. page refresh, card not mounted)
      const cached = confCache[g.id];
      if(cached){
        if(!row.entry && cached.entry) row.entry = cached.entry;
        if(!row.conviction && cached.conviction) row.conviction = cached.conviction;
        if(!row.thesisStatus && cached.thesisStatus) row.thesisStatus = cached.thesisStatus;
        if(!row.fwp && cached.fwp) row.fwp = cached.fwp;
        if(row.edge===null && cached.edge!==null) row.edge = cached.edge;
        if(!row.sustHome && cached.sustHome) row.sustHome = cached.sustHome;
        if(!row.sustAway && cached.sustAway) row.sustAway = cached.sustAway;
        if(!row.fwpTeamAlias && cached.fwpTeamAlias){ row.fwpTeamAlias=cached.fwpTeamAlias; row.fwpTeamEdge=cached.fwpTeamEdge; row.fwpTeamFwp=cached.fwpTeamFwp; row.fwpTeamEntry=cached.fwpTeamEntry; }
        if(!row.signal && cached.signal) row.signal = cached.signal;
        if(row.homeScore===null && cached.homeScore!==null){ row.homeScore=cached.homeScore; row.awayScore=cached.awayScore; row.period=cached.period; row.clock=cached.clock; }
        if(cached.state==='FINAL' && row.state==='PRE') row.state = cached.state;
        if(cached.team && !si) { row.team=cached.team; row.score=cached.score; row.verdict=cached.verdict; }
      }
      // DB analysis cache — cross-device fallback (fills gaps confCache didn't cover)
      const dbCached = dbAnalysisCache[g.id];
      if(dbCached){
        if(!row.entry && dbCached.entry) row.entry = dbCached.entry;
        if(!row.conviction && dbCached.conviction) row.conviction = dbCached.conviction;
        if(!row.fwp && dbCached.fwp) row.fwp = dbCached.fwp;
        if(!row.signal && dbCached.signal) row.signal = dbCached.signal;
        if(!row.sustHome && dbCached.sustainability) row.sustHome = dbCached.sustainability;
        if(row.score===0 && dbCached.control_score){ row.score = dbCached.control_score; row.team = dbCached.control_team; row.verdict = getVerdict(dbCached.control_score)?.label||''; }
        // Restore FWP team from prediction_json
        if(!row.fwpTeamAlias && dbCached.prediction){
          var dp = dbCached.prediction;
          if(dp.homeValue && dp.awayValue){
            if(dp.homeValue.fwp >= dp.awayValue.fwp){ row.fwpTeamAlias=dp.homeValue.team; row.fwpTeamFwp=dp.homeValue.fwp; row.fwpTeamEdge=dp.homeValue.edge; row.fwpTeamEntry=dp.entry||null; }
            else { row.fwpTeamAlias=dp.awayValue.team; row.fwpTeamFwp=dp.awayValue.fwp; row.fwpTeamEdge=dp.awayValue.edge; row.fwpTeamEntry=dp.entry||null; }
          }
        }
      }
    }
    rows.push(row);
  }
  if(!rows.length){ el.style.display='none'; return; }
  // Sort: LIVE first (by entry priority), then PRE (by score), then FINAL (by score)
  const stateOrder = {LIVE:0, PRE:1, FINAL:2};
  rows.sort((a,b)=>{
    const sa = stateOrder[a.state]??1, sb = stateOrder[b.state]??1;
    if(sa!==sb) return sa-sb;
    if(a.state==='LIVE'){
      const ea = entryPriority[a.entry]??5, eb = entryPriority[b.entry]??5;
      if(ea!==eb) return ea-eb;
    }
    return b.score-a.score;
  });
  const vColor = (v) => {
    const lv = (v||'').toLowerCase();
    return lv.includes('dominant')?'var(--green)':lv.includes('strong')?'var(--g2)':lv.includes('earned')?'var(--yellow)':lv.includes('no edge')||lv.includes('wait')?'var(--red)':'var(--t2)';
  };
  const edgeStr = (e) => e===null||e===undefined?'':'<span style="color:'+(e>=5?'var(--green)':e>=1?'var(--yellow)':e>=0?'var(--t3)':'var(--red)')+'">'+(e>=0?'+':'')+e.toFixed(1)+'%</span>';
  const entryColor = (e) => e==='OPTIMAL WINDOW'?'var(--green)':e==='WINDOW OPEN'?'var(--g2)':e==='WINDOW CLOSING'?'var(--yellow)':e==='FADE'?'var(--red)':'var(--t3)';
  const convColor = (c) => ({DOMINANT:'var(--green)',STRONG:'var(--g2)',EARNED:'var(--yellow)',CONDITIONAL:'var(--amber)'})[c]||'var(--t3)';
  const tsColor = (s) => s==='CONFIRMED'?'var(--green)':s==='DEVELOPING'?'var(--g2)':s==='CONTESTED'?'var(--amber)':s==='DENIED'?'var(--red)':s==='FLIPPED'?'#a78bfa':'var(--t3)';
  const entryClass = (e) => e==='OPTIMAL WINDOW'?'ct-optimal':e==='WINDOW OPEN'?'ct-window':e==='WINDOW CLOSING'?'ct-closing':e==='FADE'?'ct-counter':'';
  const liveCount = rows.filter(r=>r.state==='LIVE').length;
  const preCount = rows.filter(r=>r.state==='PRE').length;
  const finalCount = rows.filter(r=>r.state==='FINAL').length;
  const statsSummary = [liveCount?liveCount+' live':'', preCount?preCount+' pre':'', finalCount?finalCount+' final':''].filter(Boolean).join(' / ');
  let html = '<div class="ct-hdr" onclick="confCollapsed=!confCollapsed;renderConfidenceTable()" style="cursor:pointer">CONFIDENCE TABLE <span class="arr" style="display:inline-block;transition:transform .2s;transform:rotate('+(confCollapsed?'0':'90')+'deg);margin-left:2px">&#9656;</span><span style="font-size:5px;color:var(--t3);margin-left:auto">'+rows.length+' '+(rows.length===1?'game':'games')+' &#183; '+statsSummary+'</span>';
  if(!confCollapsed && liveCount>0){
    html += '<span style="margin-left:8px;flex-shrink:0" onclick="event.stopPropagation();ctRefreshAll()" title="Force refresh all live games"><span style="font-size:6px;padding:2px 5px;border:1px solid var(--b1);border-radius:3px;color:var(--t2);cursor:pointer;letter-spacing:.5px;white-space:nowrap">&#8635; REFRESH</span></span>';
    html += '<span style="margin-left:4px;flex-shrink:0" onclick="event.stopPropagation();ctAnalyzeAll()" title="Analyze all live games with thesis"><span style="font-size:6px;padding:2px 5px;border:1px solid var(--amber);border-radius:3px;color:var(--amber);cursor:pointer;letter-spacing:.5px;white-space:nowrap">&#9889; ANALYZE ALL</span></span>';
  }
  html += '</div>';
  if(!confCollapsed){
  html += '<div class="ct-scroll"><table><tr><th style="text-align:center;position:sticky;left:0;z-index:2;background:var(--c1);border-right:1px solid var(--b1)">SCORE</th><th style="text-align:center">SUST</th><th style="text-align:center">FWP</th><th style="text-align:center">EDGE</th><th style="text-align:center">ENTRY</th><th style="text-align:center">FLOOR</th><th style="text-align:center">RECOVERY</th><th style="text-align:center">WINDOW</th><th style="text-align:center">GAP</th><th style="text-align:center">THESIS</th></tr>';
  for(const r of rows){
    const isFinal = r.state==='FINAL';
    const rowClass = 'ct-row'+(isFinal?' ct-final':' '+entryClass(r.entry));
    // State badge (own line above score)

    } else {
      scoreStr = '<div style="font-weight:600;font-size:7px;color:var(--t2)">'+esc(r.aA)+' <span style="color:var(--t3)">@</span> '+esc(r.hA)+'</div>';
    }
    // Sustainability — already resolved (server audit or client-computed for LIVE games)
    let sustStr = '';
    let effSustHome = r.sustHome, effSustAway = r.sustAway;
    // Fallback to client sustainability for any state if row has none
    if(!effSustHome){

        effSustAway = csForSust.clientSustainability.away?.tier||null;
      } else if(csForSust?.sustainabilityAudit){

    if(effSustHome || effSustAway){

        if(u.includes('FRAGILE')) return 'FRG';
        if(u.includes('UNSUST')) return 'UNS';
        return s.substring(0,4).toUpperCase();
      };
      const sustColor = (s) => {
        if(!s) return 'var(--t3)';

        if(u.includes('LOCKED')) return 'var(--green)';
        if(u.includes('DURABLE')) return 'var(--g2)';
        if(u.includes('MIXED')) return 'var(--yellow)';
        if(u.includes('FRAGILE')) return 'var(--amber)';

      edgeDispStr = '<span style="color:'+ec+';font-weight:700">'+esc(r.fwpTeamAlias)+' '+(r.fwpTeamEdge>=0?'+':'')+r.fwpTeamEdge.toFixed(1)+'%</span>';
    }
    // FWP labeled with highest FWP team
    let fwpStr = '<span style="color:var(--t3)">&#8212;</span>';
    if(r.fwpTeamAlias && r.fwpTeamFwp){
      fwpStr = '<span style="color:var(--t1);font-weight:600">'+esc(r.fwpTeamAlias)+' '+r.fwpTeamFwp.toFixed(0)+'%</span>';
    } else if(r.fwp){
      fwpStr = '<span style="color:var(--t1);font-weight:600">'+esc(r.team||'')+' '+esc(r.fwp)+'</span>';

    html += '<tr class="'+rowClass+'" style="cursor:pointer" onclick="document.getElementById(\'card-'+r.gameId+'\')?.scrollIntoView({behavior:\'smooth\',block:\'start\'})">'
      + '<td style="text-align:center;white-space:nowrap;font-size:7px;position:sticky;left:0;z-index:1;background:var(--c1);border-right:1px solid var(--b1)">'+scoreStr+'</td>'

      + '<td style="text-align:center;font-size:7px;white-space:nowrap">'+(r.tpConSwing!=null?'<span style="font-weight:600;color:'+(r.tpConSwing>=r.tpDeficit?'var(--green)':r.tpConSwing>=r.tpDeficit*0.6?'var(--yellow)':'var(--red)')+'">'+fmtSwing(r.tpConSwing)+'</span><span style="color:var(--t3);font-size:5.5px"> vs '+r.tpDeficit+'</span>':r.lsClass!=null?'<span style="font-weight:600;font-size:5.5px;color:'+(r.lsClass==='SAFE'?'var(--green)':r.lsClass==='CUSHIONED'?'var(--g2)':r.lsClass==='AT RISK'?'var(--amber)':'var(--red)')+'">'+r.lsClass+'</span><span style="color:var(--t3);font-size:5px"> '+fmtSwing(r.lsConSwing)+' vs '+r.lsLead+'</span>':'<span style="color:var(--t3)">&#8212;</span>')+'</td>'

      + '<td style="font-size:6px;text-align:center">'+tsStr+'</td>'
      + '</tr>';
  }
  html += '</table></div>';
  } // end if(!confCollapsed)
  el.innerHTML = html;
  el.style.display = 'block';
}

// ── CONFIDENCE TABLE BATCH ACTIONS ──
function ctRefreshAll(){
  let count = 0;
  for(const g of games){
    if(selIds.has(g.id) && getState(g)==='LIVE'){
      fetchSummary(g);
      count++;
    }
  }
  if(count) console.log('CT REFRESH: triggered '+count+' live games');
}

async function ctAnalyzeAll(){
  const targets = [];
  for(const g of games){
    if(selIds.has(g.id) && getState(g)==='LIVE' && theses[g.id]){
      const cs = cardState[g.id];
      if(cs && !cs.analyzing) targets.push(g);
    }
  }
  if(!targets.length) return;
  console.log('CT ANALYZE ALL: queuing '+targets.length+' games');
  // Stagger calls to avoid API flooding — 2s between each
  for(let i=0; i<targets.length; i++){
    triggerAnalysis(targets[i]);
    if(i < targets.length-1) await new Promise(r=>setTimeout(r,2000));
  }
}

function crossRef(parsed,ind){
  if(!parsed||!ind||!parsed.watches.length)return[];
  const a=[],txt=parsed.watches.join(' ').toLowerCase();
  if((txt.includes('turnover')||txt.includes('to rate'))&&ind.I1)
    a.push(ind.I1.score===0?{msg:'⚠ Turnover concern confirmed — I1 flagged',level:'warn'}:{msg:'✓ Turnover rate holding — I1 intact',level:'ok'});
  if((txt.includes('paint')||txt.includes('interior')||txt.includes('rim'))&&ind.I2)
    a.push(ind.I2.score===1?{msg:'✓ Interior edge confirmed — I2 developing',level:'ok'}:ind.I2.score===0?{msg:'⚠ Interior edge denied',level:'warn'}:{msg:'I2 contested',level:'info'});
  if((txt.includes('assist')||txt.includes('creation'))&&ind.I3)
    a.push(ind.I3.score===1?{msg:'✓ Ball movement confirmed — I3 developing',level:'ok'}:{msg:'⚠ Creation edge not materializing',level:'warn'});
  if((txt.includes('bonus')||txt.includes('foul'))&&ind.I2)
    a.push({msg:'Foul/bonus: '+ind.I2.detail,level:'info'});
  return a;
}

function mountCard(game){
  const id=game.id;

  const _analysisTime = prev?.analysisTime||null;

  const _prediction = prev?.prediction||null;

  const _subMetricArrows = prev?.subMetricArrows||null;
  const _adjustment = prev?.adjustment||null;
  const _combinedRead = prev?.combinedRead||null;
  const _leadComposition = prev?.leadComposition||null;
  const _clientLeadComposition = prev?.clientLeadComposition||null;
  cardState[id]={logs:[],lastUp:null,editing:false,generating:false,analyzing:false,
    prevLvl:null,_countdown:null,lastFingerprint:'',analysis:_analysis,analysisTime:_analysisTime,genSteps:null,genError:null,
    lastScoreFP:'',lastStatsFP:'',staleCount:0,dataFreshness:'FRESH',sonnetIndicators:_sonnetIndicators,
    prediction:_prediction, sustainabilityAudit:_sustainabilityAudit, clutchData:null, clutchTier:3, oddsData:null, oddsAll:null, oddsHistory:[], openingOdds:null, trackingData:null, enriching:false, enrichDone:false, enrichTime:null, preFlightStep:null, evCollapsed:false, mktCollapsed:_mktCollapsed, edgeHistory:_edgeHistory, analysisHistory:_analysisHistory, pbpAudit:_pbpAudit, pbpTime:_pbpTime, pbpPeriod:_pbpPeriod, pbpLoading:false,
    quarterSnapshots:_quarterSnapshots, gapLog:_gapLog, rollingWindow:_rollingWindow,
    acceleration:_acceleration, subMetricArrows:_subMetricArrows, adjustment:_adjustment,
    combinedRead:_combinedRead, leadComposition:_leadComposition, clientLeadComposition:_clientLeadComposition};
  // Restore cached clutch data from localStorage
  if(cachedClutch[id]){
    const cs = cardState[id];
    cs.clutchData = cachedClutch[id].data;
    cs.clutchTier = cachedClutch[id].tier || 2;
    addLog(id, '📋 Clutch restored from cache', true);
  }
  // Restore cached odds from localStorage
  if(cachedOdds[id]){
    cardState[id].oddsData = cachedOdds[id];
    cardState[id].oddsHistory = cachedOddsHistory[id] || [];
    addLog(id, '📋 Odds restored from cache', true);
  }
  // Restore structural context from localStorage
  try{
    const savedStructural = localStorage.getItem('ncaamb:structural:'+id);
    if(savedStructural){ cardState[id].structural = JSON.parse(savedStructural); addLog(id, '📋 Structural context restored', true); }
  }catch(e){}
  // Restore tracking data from localStorage
  try{
    const savedTracking = localStorage.getItem('ncaamb:tracking:'+id);
    if(savedTracking){ cardState[id].trackingData = JSON.parse(savedTracking); addLog(id, '📋 Tracking baselines restored', true); }
  }catch(e){}
  // Restore quarter snapshots from localStorage
  if(!cardState[id].quarterSnapshots){
    try{
      const savedSnap = localStorage.getItem('ncaamb:snap:'+id);
      if(savedSnap){ cardState[id].quarterSnapshots = JSON.parse(savedSnap); addLog(id, '📸 Snapshots restored (H'+Object.keys(cardState[id].quarterSnapshots.quarters||{}).join(',')+')', true); }
    }catch(e){}
  }
  // Restore gap log from localStorage
  if(!cardState[id].gapLog){
    try{
      const savedGap = localStorage.getItem('ncaamb:gap:'+id);
      if(savedGap){ cardState[id].gapLog = JSON.parse(savedGap); }
    }catch(e){}
  }
  // Restore analysis data from localStorage (fallback when in-memory prev was deleted on deselect or browser refresh)
  if(!cardState[id].analysis){
    try{
      const savedAnalysis = localStorage.getItem('ncaamb:analysis:'+id);
      if(savedAnalysis){
        const sa = JSON.parse(savedAnalysis);
        cardState[id].analysis = sa.analysis;
        cardState[id].analysisTime = sa.analysisTime ? new Date(sa.analysisTime) : null;
        cardState[id].sonnetIndicators = sa.sonnetIndicators;
        cardState[id].prediction = sa.prediction;
        cardState[id].sustainabilityAudit = sa.sustainabilityAudit;
        cardState[id].clientSustainability = sa.clientSustainability || null;
        cardState[id].leadComposition = sa.leadComposition || null;
        cardState[id].clientLeadComposition = sa.clientLeadComposition || null;
        cardState[id].analysisHistory = sa.analysisHistory || [];
        cardState[id].edgeHistory = sa.edgeHistory || [];
        cardState[id].clientIndAtAnalysis = sa.clientIndAtAnalysis || null;
        addLog(id, '📋 Analysis restored from cache ('+((sa.analysisHistory||[]).length)+' reads)', true);
      }
    }catch(e){ console.warn('Analysis restore failed:', e.message); }
  }
  // Restore from DB analysis cache (cross-device — overrides localStorage if DB is newer)
  if(dbAnalysisCache[id]){
    var dbData = dbAnalysisCache[id];
    var dbTime = dbData.analysisTime || 0;
    var localTime = cardState[id].analysisTime ? cardState[id].analysisTime.getTime() : 0;
    if(dbTime > localTime || !cardState[id].prediction){
      if(dbData.prediction) cardState[id].prediction = dbData.prediction;
      if(dbData.sonnetIndicators) cardState[id].sonnetIndicators = dbData.sonnetIndicators;
      if(dbTime) cardState[id].analysisTime = new Date(dbTime);
      if(dbData.analysis && dbData.analysis !== '(synced from DB)') cardState[id].analysis = dbData.analysis;
      else if(!cardState[id].analysis) cardState[id].analysis = '(synced from DB)';
      if(dbData.analysisHistory && dbData.analysisHistory.length > 0 && (!cardState[id].analysisHistory || cardState[id].analysisHistory.length === 0)) cardState[id].analysisHistory = dbData.analysisHistory;
      if(dbData.edgeHistory && dbData.edgeHistory.length > 0 && (!cardState[id].edgeHistory || cardState[id].edgeHistory.length === 0)) cardState[id].edgeHistory = dbData.edgeHistory;
      // Persist to localStorage so next same-device refresh is instant
      persistAnalysis(id, cardState[id]);
      addLog(id, '📡 Analysis restored from DB'+(dbTime > localTime ? ' (newer than local)' : ' (no local cache)'), true);
    }
  }
  // Restore depth audit from localStorage
  if(!cardState[id].pbpAudit){
    try{
      const savedDepth = localStorage.getItem('ncaamb:depth:'+id);
      if(savedDepth){
        const sd = JSON.parse(savedDepth);
        cardState[id].pbpAudit = sd.pbpAudit;
        cardState[id].pbpTime = sd.pbpTime ? new Date(sd.pbpTime) : null;
        cardState[id].pbpPeriod = sd.pbpPeriod;
        addLog(id, '📋 Depth audit restored from cache (H'+(sd.pbpPeriod||'?')+')', true);
      }
    }catch(e){ console.warn('Depth restore failed:', e.message); }
  }
  // DB fallback — for FINAL games or when localStorage is empty
  if(!cardState[id].pbpAudit && dbReady){
    (async function(gid){
      try{
        var r = await fetch(FN+'db-api?action=get_pbp&game_id='+encodeURIComponent(gid));
        if(!r.ok) return;
        var data = await r.json();
        if(data.pbp && data.pbp.home && data.pbp.away){
          cardState[gid].pbpAudit = data.pbp;
          cardState[gid].pbpTime = new Date(data.saved_at || Date.now());
          cardState[gid].pbpPeriod = 2;
          persistDepth(gid, cardState[gid]);
          addLog(gid, '📡 Depth audit loaded from DB — '+data.pbp.totalShots+' shots (no SR call)', true);
          var g = games.find(function(x){return x.id===gid;});
          if(g) renderCard(g);
        }
      }catch(e){}
    })(id);
  }
  // Initialize new fields
  cardState[id].baselines = null;
  cardState[id].clientSustainability = null;
  cardState[id].divergences = [];
  cardState[id].clientInd = null;
  cardState[id].clientIndAtAnalysis = _clientIndAtAnalysis;
  cardState[id]._baselineLogged = false;
  if(_analysis) addLog(id, '📋 Analysis preserved from previous mount', true);
  // Auto-distribute global clutch data if available (uploaded before game selected — overrides cache)
  if(globalClutchData?.teams){
    const hA = game.home?.alias||'', aA = game.away?.alias||'';
    const hC = globalClutchData.teams[hA], aC = globalClutchData.teams[aA];
    if(hC || aC){
      const cs = cardState[id];
      cs.clutchData = {
        tier:1,
        home: hC ? { netRtg:hC.netRtg, offRtg:hC.offRtg, defRtg:hC.defRtg, gp:hC.gp, w:hC.w, l:hC.l, wl:hC.wl, efg:hC.efg, ts:hC.ts, pace:hC.pace, pie:hC.pie, tovPct:hC.tovPct, orebPct:hC.orebPct, drebPct:hC.drebPct, astRatio:hC.astRatio } : {},
        away: aC ? { netRtg:aC.netRtg, offRtg:aC.offRtg, defRtg:aC.defRtg, gp:aC.gp, w:aC.w, l:aC.l, wl:aC.wl, efg:aC.efg, ts:aC.ts, pace:aC.pace, pie:aC.pie, tovPct:aC.tovPct, orebPct:aC.orebPct, drebPct:aC.drebPct, astRatio:aC.astRatio } : {},
      };
      cs.clutchTier = 1;
      persistClutch(id, cs);
      addLog(id, `📋 L15 clutch auto-loaded from OCR`, true);
    }
  }
  const div=document.createElement('div');
  div.id='card-'+id;
  document.getElementById('grid').appendChild(div);
  renderCard(game);
  if(getState(game)==='LIVE'||getState(game)==='FINAL') fetchSummary(game);
  // Hydrate from server snapshots (fills gap log when device was sleeping, or for FINAL games never opened)
  if(getState(game)==='LIVE'||getState(game)==='FINAL') hydrateFromServerSnapshots(id);
  // Hydrate server-computed context (PBP, arrows, combined read, etc.)
  if(getState(game)==='LIVE'||getState(game)==='FINAL') hydrateFromServerContext(id);
  // Auto-enrich from BDL if not already done
  if(!cardState[id].enrichDone && !cardState[id].enriching) enrichFromBDL(id);
}

// ── PER-QUARTER STAT BREAKDOWN (from server quarter_data) ──
function renderQuarterBreakdown(id, cs, hA, aA){
  var diffs = cs._serverQuarterDiffs;
  if(!diffs || Object.keys(diffs).length === 0) return '';
  var keys = Object.keys(diffs).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b;});
  if(keys.length === 0) return '';

  var rw = cs.rollingWindow;
  var partialQ = rw ? rw.partial_quarter : null;

  var stats = [
    {label:'PNT', get:function(d){return d.points_in_the_paint||d.points_in_paint||0;}},
    {label:'FTA', get:function(d){return d.free_throws_att||0;}},
    {label:'3PM', get:function(d){return d.three_points_made||0;}},
    {label:'3PA', get:function(d){return d.three_points_att||0;}},
    {label:'AST', get:function(d){return d.assists||0;}},
    {label:'TO',  get:function(d){return d.turnovers||d.total_turnovers||0;}, invert:true},
    {label:'STL', get:function(d){return d.steals||0;}},
    {label:'BLK', get:function(d){return d.blocks||0;}},
  ];

  var html = '<div style="margin:6px 0 4px;padding:4px 6px;background:rgba(30,30,40,.5);border-radius:4px;border:1px solid var(--b2)">';
  html += '<div style="font-size:7px;color:var(--t2);letter-spacing:1px;margin-bottom:4px;font-weight:600">PER-QUARTER BREAKDOWN</div>';

  html += '<div style="display:flex;font-size:5px;color:var(--t3);letter-spacing:.5px;padding:0 0 2px;border-bottom:1px solid var(--b2);margin-bottom:2px">';
  html += '<span style="width:28px"></span>';
  stats.forEach(function(s){ html += '<span style="width:28px;text-align:center">'+s.label+'</span>'; });

          pred.homeValue.mip=null; pred.homeValue.edge=null;

          pred.edge='Line dead'; pred.edgeNum=null; pred.mip='N/A'; pred.garbageLine=true;
        } else {
        const rH=_mlP(od.homeML), rA=_mlP(od.awayML);
        if(rH!==null && rA!==null){
          const vs=rH+rA, hMIP=rH/vs*100, aMIP=rA/vs*100;
          pred.homeValue={team:hA,fwp:hFWP,mip:hMIP,edge:parseFloat((hFWP-hMIP).toFixed(1)),ml:od.homeML||'—',spread:od.homeSpread||'—'};
          var awaySpr = od.homeSpread ? parseFloat(od.homeSpread)*-1 : null;
          var awaySprStr = awaySpr!==null&&!isNaN(awaySpr) ? (awaySpr>0?'+':'')+awaySpr : '—';
          pred.awayValue={team:aA,fwp:aFWP,mip:aMIP,edge:parseFloat((aFWP-aMIP).toFixed(1)),ml:od.awayML||'—',spread:awaySprStr};
          const wMIP=Math.max(hFWP,aFWP)===hFWP?hMIP:aMIP;
          const edge=Math.max(hFWP,aFWP)-wMIP;
          pred.edge=(edge>=0?'+':'')+edge.toFixed(1)+'%';
          pred.edgeNum=parseFloat(edge.toFixed(1));
          pred.mip=wMIP.toFixed(1)+'%';
          pred.garbageLine=false;
        }
        }
      }
    }

    // ─── CONTROL BAR (compact — pure mechanical, no FWP) ───
    const trajTeam = ind.traj&&!ind.traj.tooEarly&&ind.traj.lean!=='NEUTRAL' ? ind.traj.lean : null;
    const trajBadgeColor = trajTeam ? 'var(--amber)' : 'var(--t3)';
    const _tragKeys2 = ['T1','T2','T4','T7'];
    const _filtSigs2 = (ind.traj&&ind.traj.signals||[]).filter(s=>_tragKeys2.includes(s.key));
    const _tragActive2 = _filtSigs2.filter(s=>s.w>0).length;
    const trajBadgeText = ind.traj&&!ind.traj.tooEarly ? (trajTeam||'EVEN')+' '+_tragActive2+'/'+_filtSigs2.length : '';
    const _vtInfo = cs.volumeThreat;
    const _vtOppActive = _vtInfo && ind.controlTeam ? (ind.controlTeam === hA ? _vtInfo.away?.active : _vtInfo.home?.active) : false;
    const _vtDiscPct = _vtOppActive ? (ind.controlTeam === hA ? _vtInfo.away?.discount : _vtInfo.home?.discount) : 0;
    const _vtBadge = _vtOppActive ? `<span style="font-size:5px;font-weight:700;color:var(--amber);background:rgba(255,209,102,.12);padding:1px 4px;border-radius:3px;margin-left:3px;letter-spacing:.4px">VT↓${Math.round(_vtDiscPct*100)}%</span>` : '';
    html+=`
    <div class="ctrl-bar">
      <div class="vrd" style="color:${v.color};border-color:${v.color};background:${v.bg}">${v.label} (${ind.score.toFixed(2)})${_vtBadge}</div>
      <div><div class="cl">CONTROL</div><div class="ct">${esc(ind.controlTeam)}</div></div>
      <div class="bw"><div class="bt2"><div class="bf" style="width:${ind.score*100}%;background:${v.color}"></div></div></div>
      <div class="cn" style="color:${v.color}">${ind.score.toFixed(2)}</div>
      <span style="font-size:5px;color:var(--t3);margin-left:-2px;letter-spacing:.3px">FLAGS</span>
      ${trajBadgeText?`<span class="dq" style="color:${trajBadgeColor};border-color:${trajBadgeColor}">${trajBadgeText}</span>`:''}
    </div>`;

    // ─── DIVERGENCE DETECTION ───
    const baseInd = cs.clientIndAtAnalysis;
    if(cs.sonnetIndicators && rawInd && baseInd){
      const divergences = [];
      const iKeys = ['I1','I2','I3','I4','I5'];
      for(const k of iKeys){
        const bL = baseInd[k]?.leader?.toUpperCase().substring(0,3)||'';
        const cL = rawInd[k]?.leader?.toUpperCase().substring(0,3)||'';
        if(bL && cL && bL!=='EVE' && cL!=='EVE' && bL!==cL){
          divergences.push(k+' flipped: '+baseInd[k].leader+' → '+rawInd[k].leader);
        }
      }
      const scoreDelta = Math.abs((rawInd.score||0)-(baseInd.score||0));
      if(scoreDelta>=0.15){
        divergences.push('Control shifted '+(baseInd.score||0).toFixed(2)+' → '+(rawInd.score||0).toFixed(2)+' (Δ'+scoreDelta.toFixed(2)+')');
      }
      if(rawInd.controlTeam && baseInd.controlTeam && rawInd.controlTeam.toUpperCase().substring(0,3)!==baseInd.controlTeam.toUpperCase().substring(0,3)){
        divergences.push('Control team flipped: '+baseInd.controlTeam+' → '+rawInd.controlTeam);
      }
      cs.divergences = divergences;
    } else {
      cs.divergences = [];
    }
    // Always set clientInd so control layers + arrows render without analysis
    if(rawInd) cs.clientInd = rawInd;

    if(cs.divergences && cs.divergences.length>0){
      var minsAgo = cs.analysisTime ? Math.round((Date.now()-cs.analysisTime.getTime())/60000) : '?';
      html+='<div style="padding:5px 10px;background:rgba(255,170,0,.08);border-top:1px solid rgba(255,170,0,.25)">';
      html+='<div style="font-size:6.5px;color:#ffaa00;font-weight:600;letter-spacing:.5px">⚠ STALE READ — '+cs.divergences.length+' divergence'+(cs.divergences.length>1?'s':'')+' since last analysis ('+minsAgo+'m ago)</div>';
      html+='<div style="font-size:6px;color:var(--t2);margin-top:2px">'+cs.divergences.map(function(d){return esc(d);}).join(' | ')+'</div>';
      html+='<div style="margin-top:3px"><button class="tgen" style="font-size:6px;padding:1px 6px;background:rgba(255,170,0,.12);border-color:#ffaa00;color:#ffaa00" onclick="triggerAnalysis(games.find(g=>g.id===\''+id+'\'))">⚡ RE-ANALYZE</button></div>';
      html+='</div>';
    }

    // ─── 1. SUSTAINABILITY ───
    var sa = cs.sustainabilityAudit;
    var cSust = cs.clientSustainability;
    var leadTeam = (game.homePoints||0)>=(game.awayPoints||0) ? hA : aA;
    var trailTeam = leadTeam===hA ? aA : hA;
    var leadSA = sa ? (leadTeam===hA ? sa.home : sa.away) : null;
    var trailSA = sa ? (trailTeam===hA ? sa.home : sa.away) : null;
    // Client-side sustainability fallback
    var leadCSust = cSust ? (leadTeam===hA ? cSust.home : cSust.away) : null;
    var trailCSust = cSust ? (trailTeam===hA ? cSust.home : cSust.away) : null;
    function sustColor(tier){ if(!tier) return 'var(--t3)'; var t=(tier||'').toUpperCase(); return t==='COLD'?'#60a5fa':t.includes('LOCKED')?'var(--green)':t.includes('DURABLE')?'var(--g2)':t.includes('MIXED')?'var(--yellow)':t.includes('FRAGILE')?'var(--amber)':t.includes('UNSUST')?'var(--red)':'var(--t3)'; }
    function sustDetail(t){ if(!t||!t.personnelGrade) return ''; return 'P:'+t.personnelGrade.substring(0,3)+' R:'+t.regressionGrade.substring(0,3)+' S:'+t.shotTypeGrade.substring(0,3); }
    // Use Sonnet audit when available, fall back to client audit
    var showSonnetSust = leadSA;
    var showClientSust = !showSonnetSust && leadCSust;
    if(showSonnetSust || showClientSust || (pred && pred.sustainability)){
      html+='<div style="padding:6px 10px;border-top:1px solid var(--b1)">';
      html+=_secHdr(id,'sust',cs,'SUSTAINABILITY &#8212; IS THE LEAD STRUCTURAL?',(showClientSust?' <span style="color:var(--t3);letter-spacing:0">(client-side)</span>':''));
      if(_secOpen(cs,'sust')){
      if(showSonnetSust){
        html+='<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px"><span style="font-size:7px;color:var(--t3);width:48px">LEADING</span><span class="dv-tag" style="color:'+sustColor(leadSA.tier)+';border-color:'+sustColor(leadSA.tier)+';font-size:6px;padding:0 4px">'+esc(leadSA.teamAlias||leadTeam)+' '+(leadSA.tier||'?')+'</span><span style="font-size:5.5px;color:var(--t3)">('+sustDetail(leadSA)+')</span></div>';
        if(leadSA.shotTypeNote) html+='<div style="font-size:6px;color:var(--t2);margin-left:52px;margin-bottom:3px">'+esc(leadSA.shotTypeNote)+'</div>';
        html+='<div style="display:flex;align-items:center;gap:4px"><span style="font-size:7px;color:var(--t3);width:48px">TRAILING</span><span class="dv-tag" style="color:'+sustColor(trailSA.tier)+';border-color:'+sustColor(trailSA.tier)+';font-size:6px;padding:0 4px">'+esc(trailSA.teamAlias||trailTeam)+' '+(trailSA.tier||'?')+'</span><span style="font-size:5.5px;color:var(--t3)">('+sustDetail(trailSA)+')</span></div>';
        if(trailSA.shotTypeNote) html+='<div style="font-size:6px;color:var(--t2);margin-left:52px">'+esc(trailSA.shotTypeNote)+'</div>';
      } else if(showClientSust){
        html+='<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px"><span style="font-size:7px;color:var(--t3);width:48px">LEADING</span><span class="dv-tag" style="color:'+sustColor(leadCSust.tier)+';border-color:'+sustColor(leadCSust.tier)+';font-size:6px;padding:0 4px">'+esc(leadTeam)+' '+esc(leadCSust.tier)+'</span><span style="font-size:5.5px;color:var(--t2)">'+esc(leadCSust.reason)+'</span></div>';
        html+='<div style="display:flex;align-items:center;gap:4px"><span style="font-size:7px;color:var(--t3);width:48px">TRAILING</span><span class="dv-tag" style="color:'+sustColor(trailCSust.tier)+';border-color:'+sustColor(trailCSust.tier)+';font-size:6px;padding:0 4px">'+esc(trailTeam)+' '+esc(trailCSust.tier)+'</span><span style="font-size:5.5px;color:var(--t2)">'+esc(trailCSust.reason)+'</span></div>';
      } else if(pred && pred.sustainability){
        html+='<div style="font-size:6px;color:var(--t2)">'+esc(pred.sustainability)+'</div>';
      }
      } // end _secOpen sust
      html+='</div>';
    }

    // ─── 2. VALUE READ (two-sided — primary decision interface) ───
    if(pred){
      var hv = pred.homeValue, av = pred.awayValue;
      var hasValues = hv && av;
      // Determine highest FWP team for green highlight
      var fwpTeam = null;
      if(hasValues){
        if(hv.fwp > av.fwp){ fwpTeam = hA; }
        else if(av.fwp > hv.fwp){ fwpTeam = aA; }
      }
      // Best edge team (for signal bar)
      var bestTeam = null, bestEdge = null;
      if(hasValues){
        if(hv.edge > av.edge && hv.edge >= 5){ bestTeam = hA; bestEdge = hv; }
        else if(av.edge > hv.edge && av.edge >= 5){ bestTeam = aA; bestEdge = av; }
      }
      var entryColor = pred.entry==='OPTIMAL WINDOW'?'var(--green)':pred.entry==='WINDOW OPEN'?'var(--g2)':pred.entry==='WINDOW CLOSING'?'var(--yellow)':pred.entry==='FADE'?'var(--red)':'var(--t3)';
      var convColor = ({DOMINANT:'var(--green)',STRONG:'var(--g2)',EARNED:'var(--yellow)',CONDITIONAL:'var(--amber)'})[pred.conviction]||'var(--t3)';
      // Edge history
      var eh = cs.edgeHistory.filter(function(e){return e.edgeNum!==null&&e.edgeNum!==undefined;});
      var peakEdge = null, edgeTrend = '';
      if(eh.length >= 2){
        peakEdge = eh.reduce(function(max,e){return e.edgeNum>max.edgeNum?e:max;}, eh[0]);
        var recent = eh.slice(-2);
        var diff = recent[1].edgeNum - recent[0].edgeNum;
        edgeTrend = diff > 1.5 ? '&#9650;' : diff < -1.5 ? '&#9660;' : '&#9472;';
      }
      // Thesis status
      var tsCol = pred.thesisStatus==='CONFIRMED'?'var(--green)':pred.thesisStatus==='DEVELOPING'?'var(--g2)':pred.thesisStatus==='CONTESTED'?'var(--amber)':pred.thesisStatus==='DENIED'?'var(--red)':pred.thesisStatus==='FLIPPED'?'#a78bfa':'var(--t3)';
      // Parse thesis team from thesis text
      var thesisTeamMatch = (theses[id]||'').match(/CONTROL\s+SCORE:\s*(\w+)/i);
      var thesisTeam = thesisTeamMatch ? thesisTeamMatch[1] : '';

      html+='<div class="dv" style="'+(fwpTeam?'border-left:2px solid var(--green);background:rgba(0,200,83,.02)':'')+'">';
      // Header
      html+='<div class="dv-hdr">VALUE READ<span style="display:flex;align-items:center;gap:6px;margin-left:auto">';
      if(thesisTeam && pred.thesisStatus) html+='<span style="font-size:5.5px;color:var(--t3);letter-spacing:.3px">THESIS '+esc(thesisTeam)+': <span style="color:'+tsCol+'">'+esc(pred.thesisStatus)+'</span></span>';
      html+=analyzeBtn+'<span class="analysis-cost">'+(cs.analysisTime?fmtTs(cs.analysisTime)+'('+fmtAge(cs.analysisTime)+')':'')+'</span></span></div>';

      if(hasValues){
        // Table header
        html+='<div style="display:grid;grid-template-columns:42px 1fr 1fr 1fr 52px 52px;gap:2px;padding:0 2px;margin-bottom:2px">';
        var hdrs = ['','FWP','MIP','EDGE','ML','SPREAD'];
        for(var hi=0;hi<hdrs.length;hi++) html+='<span style="font-size:5px;color:var(--t3);letter-spacing:.5px;text-align:'+(hi?'center':'left')+'">'+hdrs[hi]+'</span>';
        html+='</div>';
        // Rows
        var rows = [av, hv];
        for(var ri=0;ri<rows.length;ri++){
          var rv = rows[ri];
          var isBest = fwpTeam && rv.team===fwpTeam;
          var isHigherFwp = rv.fwp >= 50;
          var tColor = isHigherFwp ? 'var(--t1)' : 'var(--t3)';
          var eColor = isHigherFwp ? (rv.edge!=null&&rv.edge>=10?'var(--green)':rv.edge!=null&&rv.edge>=5?'var(--g2)':rv.edge!=null&&rv.edge>=1?'var(--yellow)':rv.edge!=null&&rv.edge>=0?'var(--t3)':'var(--red)') : 'var(--t3)';
          html+='<div style="display:grid;grid-template-columns:42px 1fr 1fr 1fr 52px 52px;gap:2px;padding:3px 2px;border-radius:3px;margin-bottom:1px;'+(isHigherFwp?'background:rgba(0,200,83,.08);border-left:2px solid var(--green)':'border-left:2px solid transparent')+'">';
          html+='<span style="font-size:9px;font-weight:700;color:'+(isHigherFwp?'var(--t1)':'var(--t3)')+'">'+esc(rv.team)+'</span>';
          html+='<span style="font-size:10px;font-weight:600;color:'+tColor+';text-align:center">'+(rv.fwp!=null?rv.fwp.toFixed(0)+'%':'—')+'</span>';
          html+='<span style="font-size:10px;color:'+(isHigherFwp?'var(--t2)':'var(--t3)')+';text-align:center">'+(rv.mip!=null?rv.mip.toFixed(1)+'%':'N/A')+'</span>';
          html+='<span style="font-size:10px;font-weight:700;color:'+eColor+';text-align:center">'+(rv.edge!=null?(rv.edge>=0?'+':'')+rv.edge.toFixed(1)+'%':'—')+'</span>';
          html+='<span style="font-size:9px;color:'+(isHigherFwp?'var(--t2)':'var(--t3)')+';text-align:center">'+esc(String(rv.ml||'—'))+'</span>';
          html+='<span style="font-size:9px;color:'+(isHigherFwp?'var(--t2)':'var(--t3)')+';text-align:center">'+esc(String(rv.spread||'—'))+'</span>';
          html+='</div>';
        }
      } else {
        // Fallback: single-line legacy edge display
        var legEdgeNum = pred.edgeNum;
        var legEdgeColor = legEdgeNum===null?'var(--t3)':legEdgeNum>=10?'var(--green)':legEdgeNum>=5?'var(--g2)':legEdgeNum>=1?'var(--yellow)':legEdgeNum>=0?'var(--t3)':'var(--red)';
        html+='<div class="dv-row"><span class="dv-label">EDGE</span><span class="dv-val" style="color:'+legEdgeColor+'">'+esc(pred.edge||'—')+'</span><span class="dv-sub">FWP '+esc(pred.fwp||'—')+'</span><span class="dv-sub">MIP '+esc(pred.mip||'N/A')+'</span></div>';
      }

      // Signal bar (entry + conviction + buy team)
      var sigType = pred.signalType || (pred.entry==='OPTIMAL WINDOW'||pred.entry==='WINDOW OPEN'?(bestTeam?'BUY '+bestTeam:'WINDOW'):pred.entry==='FADE'?'FADE':pred.entry==='NO WINDOW'?'NO VALUE':'PASS');
      var sigNote = pred.signalNote || pred.prediction || '';
      var sigIcon = sigType.startsWith('BUY')?'&#9889; ':sigType==='NO VALUE'?'&#9675; ':sigType==='COUNTER'?'&#10005; ':'&#9675; ';
      var sigCol = sigType.startsWith('BUY')?'var(--green)':sigType==='COUNTER'?'var(--red)':'var(--t3)';
      html+='<div style="margin-top:6px;padding:5px 7px;border-radius:4px;border:1px solid '+(bestTeam?'var(--green)':'var(--b1)')+';background:'+(bestTeam?'rgba(0,200,83,.06)':'rgba(255,255,255,.02)')+';display:flex;align-items:center;gap:6px">';
      html+='<span style="font-size:6.5px;font-weight:700;letter-spacing:.8px;color:'+sigCol+';white-space:nowrap">'+sigIcon+esc(sigType)+'</span>';
      html+='<span style="font-size:6.5px;color:var(--t2)">'+esc(sigNote)+'</span>';
      html+='</div>';

      // Entry + Conviction tags
      html+='<div class="dv-row" style="margin-top:5px"><span class="dv-label">ENTRY</span><span class="dv-tag" style="color:'+entryColor+';border-color:'+entryColor+'">'+esc(pred.entry||'—')+'</span><span class="dv-tag" style="color:'+convColor+';border-color:'+convColor+';margin-left:4px">'+esc(pred.conviction||'—')+'</span></div>';

      // Spread analysis (from Sonnet)
      if(pred.spreadAnalysis){
        html+='<div style="font-size:6px;color:var(--t2);margin-top:3px;padding:2px 0"><span style="color:var(--amber);font-size:5.5px;letter-spacing:.5px">SPREAD: </span>'+esc(pred.spreadAnalysis)+'</div>';
      }

      // Spread conviction engine (client-side)
      var spConv = cs.spreadConviction;
      if(spConv){
        var _scColor = function(conv){ return conv==='STRONG COVER'?'var(--green)':conv==='LEAN COVER'?'var(--g2)':conv==='NO EDGE'?'var(--t3)':conv==='LEAN FADE'?'var(--amber)':'var(--red)'; };
        var recSide = spConv.recommendation;
        var recResult = recSide==='home'?spConv.home:spConv.away;
        // Show away team first (convention: away @ home)
        var sides = [spConv.away, spConv.home];
        html+='<div style="margin-top:4px;padding:4px 6px;background:rgba(255,255,255,.03);border-radius:4px;border:1px solid var(--b1)">';
        html+='<div style="font-size:5.5px;color:var(--amber);letter-spacing:1px;margin-bottom:3px">SPREAD CONVICTION</div>';
        sides.forEach(function(s){
          html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">';
          html+='<span style="font-size:6px;font-weight:700;color:var(--t1);min-width:28px">'+esc(s.team)+'</span>';
          html+='<span style="font-size:6px;color:var(--t2)">'+esc(s.spread)+'</span>';
          html+='<span class="dv-tag" style="font-size:5.5px;padding:1px 5px;color:'+_scColor(s.conviction)+';border-color:'+_scColor(s.conviction)+'">'+esc(s.conviction)+'</span>';
          html+='<span style="font-size:6px;font-weight:600;color:'+_scColor(s.conviction)+'">'+s.coverProb+'%</span>';
          if(s.coverMargin > 0) html+='<span style="font-size:5px;color:var(--green)">covering</span>';
          html+='</div>';
        });
        // Reason for recommended side
        html+='<div style="font-size:5px;color:var(--t3);margin-top:1px">'+esc(recResult.reason)+'</div>';
        html+='</div>';
      }

      // Clutch
      html+='<div class="dv-row" style="margin-top:2px"><span class="dv-label">CLUTCH</span><span class="dv-sub">'+esc(pred.clutch||'No data')+'</span></div>';

      // Prediction
      html+='<div class="dv-pred">'+esc(pred.prediction||'')+'</div>';

      // Peak edge + edge history
      if(peakEdge) html+='<div class="dv-row"><span class="dv-label">PEAK</span><span class="dv-sub" style="color:var(--t2)">+'+peakEdge.edgeNum.toFixed(1)+'% at '+peakEdge.time+' ('+peakEdge.score+')</span></div>';
      if(eh.length>=3) html+='<div style="font-size:5px;color:var(--t2);margin-top:2px;letter-spacing:.5px">EDGE: '+eh.slice(-6).map(function(e){return (e.edgeNum>=0?'+':'')+e.edgeNum.toFixed(0)+'%';}).join(' &#8594; ')+'</div>';
      html+='</div>';
    } else if(cs.analyzing){
      html+='<div class="dv"><div class="dv-hdr">VALUE READ</div><div class="analysis-loading"><div class="spin"></div> Sonnet analyzing&#8230;</div></div>';
    } else {
      html+='<div class="dv"><div class="dv-hdr">VALUE READ<span style="margin-left:auto">'+analyzeBtn+'</span></div><div style="font-size:6px;color:var(--t3);padding:2px 0">'+(cs.analysisError?'<span style="color:var(--red)">&#9888; '+esc(cs.analysisError)+'</span>':game.period<2?'Predictive layer activates Q2+ &#8212; press &#9889; to analyze':'Awaiting analysis &#8212; press &#9889; ANALYZE')+'</div></div>';
    }

    // ─── 3. SCORING COMPOSITION (how is each team scoring?) ───
    var _serverLC = cs.leadComposition;
    if(_serverLC && _serverLC.home && _serverLC.away && (_serverLC.home.total||0) + (_serverLC.away.total||0) === 0) _serverLC = null;
    var lc = cs.clientLeadComposition || _serverLC;
    var lcIsClient = !!cs.clientLeadComposition;
    if(lc){
      var lcStructColor = lc.structuralMargin > 0 ? 'var(--green)' : lc.structuralMargin < 0 ? 'var(--red)' : 'var(--t3)';
      var lcVarColor = lc.varianceMargin > 0 ? 'var(--amber)' : lc.varianceMargin < 0 ? 'var(--green)' : 'var(--t3)';
      var lcClass = lc.classification||'';
      var lcDurColor = lcClass==='STRUCTURAL'?'var(--green)':lcClass==='IDENTITY'?'var(--green)':lcClass==='HOT'?'var(--g2)':lcClass==='VOLATILE'?'var(--red)':lcClass==='EVEN'?'var(--t3)':'var(--t2)';
      html+='<div style="padding:6px 10px;border-top:1px solid var(--b1)">';
      html+=_secHdr(id,'sc',cs,'SCORING COMPOSITION',(lcIsClient?' <span style="color:var(--t3);letter-spacing:0">(client-side)</span>':''));
      if(_secOpen(cs,'sc')){
      // Team bars — dual shade: darker = made pts, lighter = missed potential pts
      [lc.away, lc.home].forEach(function(tm){
        if(!tm) return;
        var sPct = tm.structuralPct, vPct = tm.variancePct;

          <span style="font-size:6px;color:var(--t3);display:inline-block;transition:transform .2s;transform:rotate(${mktCollapsed?'0':'90'}deg)">&#9656;</span>
        </span>
      </div>`;
    if(!mktCollapsed){
      // Odds row (read-only)
      if(od){
        const mv = oddsMovement(cs);
        html+=`<div style="display:flex;gap:8px;align-items:baseline;margin-bottom:2px;flex-wrap:wrap">
          <span style="font-size:5px;color:var(--amber);width:28px">ODDS</span>
          <span style="font-size:6px"><span style="color:var(--t1);font-weight:600">${esc(hA)}</span> <span style="color:var(--t1)">${od.homeSpread||'—'}</span> <span style="color:var(--t3)">ML</span> <span style="color:var(--t1)">${od.homeML||'—'}</span></span>
          <span style="font-size:6px"><span style="color:var(--t1);font-weight:600">${esc(aA)}</span> <span style="color:var(--t3)">ML</span> <span style="color:var(--t1)">${od.awayML||'—'}</span></span>
          <span style="font-size:6px"><span style="color:var(--t3)">O/U</span> <span style="color:var(--t1)">${od.total||'—'}</span></span>
        </div>`;
        if(mv){
          const mvCell = (d) => d ? `<span style="color:${d.color}">${d.val}</span>` : '—';
          html+=`<div style="font-size:4.5px;color:var(--t3);margin-bottom:2px;margin-left:28px">MOVE: sprd ${mvCell(mv.spread)} · ${esc(hA)} ${mvCell(mv.homeML)} · ${esc(aA)} ${mvCell(mv.awayML)} · O/U ${mv.total?mvCell(mv.total):'—'} (${mv.pulls} pulls)</div>`;
        }
      } else {
        html+=`<div style="font-size:5px;color:var(--t3);margin-bottom:2px">No odds — tap ⚡ ODDS to pull</div>`;
      }
      // Clutch row (read-only) — compact grid
      if(cl){
        html+='<div style="border-top:1px solid var(--b1);padding-top:3px;margin-top:2px">';
        html+=`<div style="font-size:4.5px;color:var(--amber);letter-spacing:1px;margin-bottom:3px">CLUTCH (Tier ${cs.clutchTier||'?'})</div>`;
        // Grid header
        html+=`<div style="display:grid;grid-template-columns:28px 48px 36px 36px 36px 36px 36px 36px;gap:1px 4px;align-items:baseline;font-size:5px">`;
        html+=`<span style="color:var(--t3)"></span><span style="color:var(--t3)">Net</span><span style="color:var(--t3)">Off</span><span style="color:var(--t3)">Def</span><span style="color:var(--t3)">W-L</span>`;
        const hasAdv = cl.home?.efg || cl.away?.efg;
        if(hasAdv) html+=`<span style="color:var(--t3)">eFG</span><span style="color:var(--t3)">Pace</span><span style="color:var(--t3)">PIE</span>`;
        html+=`</div>`;
        // Team rows
        [['home',hA,cl.home],['away',aA,cl.away]].forEach(([side,alias,d])=>{
          if(!d) return;
          const nrCol = d.netRtg!=null?(parseFloat(d.netRtg)>=0?'var(--green)':parseFloat(d.netRtg)>=-2?'var(--yellow)':'var(--red)'):'var(--t3)';
          html+=`<div style="display:grid;grid-template-columns:28px 48px 36px 36px 36px 36px 36px 36px;gap:1px 4px;align-items:baseline;font-size:5.5px;margin-bottom:1px">`;
          html+=`<span style="color:var(--t1);font-weight:600">${esc(alias)}</span>`;
          html+=`<span style="color:${nrCol};font-weight:700">${d.netRtg??'—'}</span>`;
          html+=`<span style="color:var(--t2)">${d.offRtg??'—'}</span>`;
          html+=`<span style="color:var(--t2)">${d.defRtg??'—'}</span>`;
          html+=`<span style="color:var(--t1)">${d.wl??'—'}</span>`;
          if(hasAdv){
            html+=`<span style="color:var(--t2)">${d.efg!=null?(d.efg*100).toFixed(1):'—'}</span>`;
            html+=`<span style="color:var(--t2)">${d.pace??'—'}</span>`;
            html+=`<span style="color:var(--t2)">${d.pie??'—'}</span>`;
          }
          html+=`</div>`;
        });
        html+='</div>';
      } else {
        html+=`<div style="font-size:5px;color:var(--t3);border-top:1px solid var(--b1);padding-top:2px;margin-top:2px">No clutch — upload L15 via OCR</div>`;
      }
      // Tracking baselines
      if(cs.trackingData){
        const ht=cs.trackingData.home||{}, at=cs.trackingData.away||{};
        html+=`<div style="font-size:5px;color:var(--t2);border-top:1px solid var(--b1);padding-top:2px;margin-top:2px">`;
        if(ht.catchAndShoot||at.catchAndShoot) html+=`C&S: <span style="color:var(--t1);font-weight:600">${esc(aA)}</span> ${at.catchAndShoot?.efg||'?'}% · <span style="color:var(--t1);font-weight:600">${esc(hA)}</span> ${ht.catchAndShoot?.efg||'?'}% `;
        if(ht.pullUp||at.pullUp) html+=`Pull-up: <span style="color:var(--t1);font-weight:600">${esc(aA)}</span> ${at.pullUp?.efg||'?'}% · <span style="color:var(--t1);font-weight:600">${esc(hA)}</span> ${ht.pullUp?.efg||'?'}%`;
        html+=`</div>`;
      }
    }
    html+=`</div>`;

    // ─── EVIDENCE VIEW TOGGLE ───
    const pbpTs = cs.pbpTime ? 'H'+(cs.pbpPeriod||'?')+' '+fmtTs(cs.pbpTime)+' ('+fmtAge(cs.pbpTime)+')' : '';
    const depthBtn = `<button class="di-btn" style="background:${cs.pbpLoading?'var(--b2)':cs.pbpAudit?'rgba(0,255,136,.15)':'rgba(147,130,220,.15)'};color:${cs.pbpLoading?'var(--t3)':cs.pbpAudit?'var(--green)':'#9382dc'};font-size:6px;padding:1px 5px;margin-left:4px" onclick="event.stopPropagation();fetchPBP('${id}')" ${cs.pbpLoading?'disabled':''}>${cs.pbpLoading?'⏳ DEPTH…':cs.pbpAudit?'✓ DEPTH':'⚡ DEPTH'}</button>${pbpTs?`<span style="font-size:4px;color:var(--t3);margin-left:2px">${pbpTs}</span>`:''}`;
    html+=`<div class="ev-toggle ${cs.evCollapsed?'':'open'}" id="ev-toggle-${id}" onclick="toggleEV('${id}')">
      EVIDENCE<span style="font-size:5px;color:var(--t3);margin-left:1px">▾</span> <span class="arr">▸</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:6px">
        <span style="font-size:7px;color:${v.color};letter-spacing:.5px">CONTROL <span style="font-size:9px;font-weight:600">${esc(ind.controlTeam)}</span> <span style="font-size:9px">${ind.score.toFixed(2)}</span></span>
        <span style="font-size:6px;color:var(--t3)">·</span>
        <span style="font-size:7px;color:${ind.traj&&ind.traj.lean!=='NEUTRAL'&&!ind.traj.tooEarly?'var(--amber)':'var(--t3)'}">FLAGS ${!ind.traj||ind.traj.tooEarly?'Q1':esc(ind.traj.lean)+' '+_tragActive2+'/'+_filtSigs2.length}</span>
        ${depthBtn}
      </span>
    </div>`;

    // ─── EVIDENCE BODY (collapsible) ───
    html+=`<div class="ev-body ${cs.evCollapsed?'collapsed':''}" id="ev-body-${id}" style="${cs.evCollapsed?'max-height:0':'max-height:2000px'}">`;

    // Indicators
    html+=`<div class="inds">
    ${[{id:'I1',nm:'DISRUPT/CONV',wt:10,d:ind.I1},{id:'I2',nm:'INTERIOR',wt:15,d:ind.I2},
       {id:'I3',nm:'SHOT QUALITY',wt:20,d:ind.I3},{id:'I4',nm:'GAME CONTROL',wt:30,d:ind.I4},
       {id:'I5',nm:'EXECUTION',wt:25,d:ind.I5}].map(({id:iid,nm,wt,d})=>{
      let displayScore;
      if(d.sonnet){
        const leaderIsControl = (ind.controlTeam && d.leader) ? d.leader.toUpperCase().substring(0,3) === ind.controlTeam.toUpperCase().substring(0,3) : true;
        displayScore = leaderIsControl ? d.rawScore : (1 - d.rawScore);
      } else {
        var _ctrlHome = !ind.controlTeam || hA.toUpperCase().substring(0,3) === ind.controlTeam.toUpperCase().substring(0,3);
        displayScore = _ctrlHome ? d.score : (1 - d.score);
      }
      const col = d.sonnet ? indColor(displayScore) : (displayScore===1?'var(--green)':displayScore===.5?'var(--yellow)':'var(--red)');
      const pc = d.sonnet ? pipClass(displayScore) : (displayScore===1?'pw':displayScore===.5?'pd':'pl');
      return `
      <div class="ind">
        <span class="ii">${iid}</span><span class="in">${nm}</span><span class="iw">${wt}%</span>
        <div class="pip ${pc}"></div>
        <span class="il" style="color:${col}">${esc(d.leader)}${d.sonnet?' <span style="opacity:0.6">'+d.rawScore.toFixed(2)+'</span>':''}</span>
        ${d.sonnet?'<span style="color:#a78bfa;font-size:5px;margin-left:2px">◈</span>':''}
        <span class="id">${esc(d.detail)}</span>
      </div>`;}).join('')}
    </div>`;

    // Trajectory (Event Flags — T1, T2, T4, T7 only)
    var tragMap = {'T1':'Trag1','T2':'Trag2','T4':'Trag3','T7':'Trag4'};
    var tragKeys = ['T1','T2','T4','T7'];
    var allSigs = (ind.traj&&ind.traj.signals) ? ind.traj.signals : (rawInd&&rawInd.traj ? rawInd.traj.signals : []);
    var filtSigs = allSigs.filter(function(s){ return tragKeys.indexOf(s.key)!==-1; });
    var tragCount = filtSigs.filter(function(s){ return s.w>0; }).length;
    var tragTeam = null;
    filtSigs.forEach(function(s){ if(s.team && s.w>0) tragTeam = s.team; });
    html+=`<div class="traj">
      <div class="th">EVENT FLAGS
        ${filtSigs.length>0&&ind.traj&&!ind.traj.tooEarly?`<span class="tl" style="color:${tragTeam?'var(--amber)':'var(--t3)'};border-color:${tragTeam?'var(--amber)':'var(--b2)'}">${esc(tragTeam||'EVEN')} ${tragCount}/${filtSigs.length}</span>`:''}
      </div>
      ${!ind.traj||ind.traj.tooEarly
        ?'<div style="font-size:6px;color:var(--t3)">Q1 — event flags activate Q2</div>'
        :filtSigs.length>0
          ?filtSigs.map(s=>`<div class="ts"><span class="tk" style="color:${s.color}">${tragMap[s.key]||s.key}</span><span class="tt" style="color:${s.color==='#3e3e48'?'var(--t3)':s.color}">${esc(s.text)}</span></div>`).join('')
          :'<div style="font-size:6px;color:var(--t3)">No event flags active</div>'}
    </div>`;

    // ─── DIRECTIONAL ARROWS (per-quarter trends) ───
    var arrows = cs.subMetricArrows;
    var adj = cs.adjustment;
    if(arrows && arrows.home && arrows.away){
      var _arrowColor = function(arrow, isVariance){
        if(!arrow||arrow==="FLAT") return "var(--t3)";
        if(arrow==="RISING") return isVariance?"var(--amber)":"var(--green)";
        return isVariance?"var(--green)":"var(--amber)";
      };
      var _arrowSym = function(arrow){ return arrow==="RISING"?"▲":arrow==="FALLING"?"▼":"▬"; };
      var _vals = function(m){ if(!m||!m.values) return "?"; var v=m.values; return v.length>1?(v[0]!=null?Math.round(v[0]):'?')+'→'+(v[v.length-1]!=null?Math.round(v[v.length-1]):'?'):'?'; };
      html+='<div style="padding:5px 6px;border-top:1px solid var(--b2)">';
      html+='<div style="font-size:7px;color:var(--t2);letter-spacing:1px;margin-bottom:4px;font-weight:600">DIRECTIONAL ARROWS</div>';
      var cols = [
        {key:"paint",hdr:"Paint",grp:"I2",isVar:false},
        {key:"atRim",hdr:"AtRim",grp:"I2",isVar:false},
        {key:"fta",hdr:"FTA",grp:"I2",isVar:false},
        {key:"steals",hdr:"Stl",grp:"I1",isVar:false},
        {key:"tos",hdr:"TOs",grp:"I1",isVar:true},
        {key:"fg3aShare",hdr:"3PA%",grp:"I3",isVar:true},
        {key:"astRatio",hdr:"Ast%",grp:"I3",isVar:false},
        {key:"poss",hdr:"Poss",grp:"I5",isVar:false},
      ];
      var grpSpans = [];
      var lastGrp = '';
      cols.forEach(function(c){
        if(c.grp !== lastGrp){ grpSpans.push({grp:c.grp, span:1}); lastGrp = c.grp; }
        else { grpSpans[grpSpans.length-1].span++; }
      });
      html+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">';
      html+='<table style="border-collapse:collapse;font-size:5.5px;min-width:340px">';
      html+='<tr><td style="padding:0 3px;min-width:28px"></td>';
      grpSpans.forEach(function(g){
        html+='<td colspan="'+g.span+'" style="text-align:center;padding:0 2px 1px;color:var(--t3);font-size:4.5px;letter-spacing:.5px;border-bottom:1px solid var(--b1)">'+g.grp+'</td>';
      });
      html+='</tr>';
      html+='<tr><td style="padding:1px 3px;color:var(--t3);font-size:4.5px"></td>';
      cols.forEach(function(c){
        html+='<td style="text-align:center;padding:1px 3px;color:var(--t3);font-size:5px;font-weight:400">'+c.hdr+'</td>';
      });
      html+='</tr>';
      [['away',aA,arrows.away],['home',hA,arrows.home]].forEach(function(t){
        var alias=t[1], data=t[2];
        html+='<tr><td style="padding:2px 3px;color:var(--t1);font-weight:600;font-size:6px">'+esc(alias)+'</td>';
        cols.forEach(function(c){
          var m = data[c.key];
          var arrow = m&&m.arrow ? _arrowSym(m.arrow) : "—";
          var col = _arrowColor(m&&m.arrow, c.isVar);
          var vals = m ? _vals(m) : "?";
          html+='<td style="text-align:center;padding:2px 3px;white-space:nowrap"><span style="color:'+col+';font-weight:600">'+arrow+'</span> <span style="font-size:4.5px;color:var(--t3)">'+esc(vals)+'</span></td>';
        });
        html+='</tr>';
      });
      html+='</table></div>';
      if(adj && adj.signal && adj.signal!=="NO ADJUSTMENT" && adj.signal!=="NO DATA"){
        var adjColor2 = adj.signal==="INTERIOR PIVOT"?"var(--green)":adj.signal==="STRUCTURAL ACCEL"?"var(--green)":adj.signal==="STRUCTURAL EROSION"?"var(--red)":adj.signal==="VARIANCE SHIFT"?"var(--amber)":"var(--t3)";
        html+='<div style="margin-top:4px;font-size:6px;color:'+adjColor2+';font-weight:500">'+esc(adj.signal)+' <span style="font-weight:400;color:var(--t2)">&#8212; '+esc(adj.note)+'</span></div>';
      }
      html+='</div>';
    }

    // ─── PER-QUARTER STAT BREAKDOWN ───
    html += renderQuarterBreakdown(id, cs, hA, aA);

    // ─── VISUAL DEPTH AUDIT ───
    html += renderDepthAuditVisual(id, cs, hA, aA);

    // Full Sonnet analysis text (in evidence view)
    html+=`<div class="analysis" id="analysis-${id}">`;
    if(cs.analysis){
      const usage=cs.analysisUsage;
      const cost=usage?((usage.input_tokens*3+usage.output_tokens*15)/1000000).toFixed(4):'?';
      html+=`<div class="analysis-hdr">FULL ANALYSIS<span class="analysis-cost">~$${cost} · ${cs.analysisTime?fmtTs(cs.analysisTime)+' ('+fmtAge(cs.analysisTime)+')':''}</span></div><div class="analysis-body">${esc(cs.analysis)}</div>`;
    } else if(cs.analyzing){
      html+=`<div class="analysis-loading"><div class="spin"></div> Analyzing…</div>`;
    } else {
      html+=`<div style="font-size:6px;color:var(--t3)">No analysis yet</div>`;
    }
    html+=`</div>`;

    // Close evidence body
    html+=`</div>`;
  }

  // Thesis xref
  if(xrefs.length){
    html+=`<div class="xref"><div class="xh">THESIS × LIVE</div>${xrefs.map(r=>`<div class="xr ${r.level}">${esc(r.msg)}</div>`).join('')}</div>`;
  }

  // Thesis block — auto-collapse once game tips off (user can still toggle open manually)
  if(state!=='PRE' && !cs._thesisUserToggled){
    if(!cs._sec) cs._sec = {};
    cs._sec.thesis = false;
  }
  html+=`<div class="thesis" id="thesis-block-${id}">
    <div class="thdr">
      <span style="cursor:pointer" onclick="toggleSec('${id}','thesis')"><span style="font-size:7px;color:var(--t3)">${_secOpen(cs,'thesis')?'▾':'▸'}</span> PRE-GAME THESIS</span>
      <div style="display:flex;gap:6px;align-items:center;">
        ${state==='PRE'&&!cs.generating?`<button class="tgen" onclick="generateThesis('${id}')">⚡ GENERATE</button>`:''}        <button class="tedit" onclick="startEdit('${id}')">EDIT</button>
      </div>
    </div>`;

  if(_secOpen(cs,'thesis')){
  if(cs.generating){
    html+=`<div class="gen-progress" id="gen-progress-${id}">${(cs.genSteps||[]).map(s=>{
      const icon=s.status==='done'?'✓':s.status==='active'?'⟳':s.status==='err'?'✗':'·';
      return `<span class="gen-step ${s.status}">${icon} ${s.label}${s.error?' — '+s.error:''}</span>`;
    }).join('<br>')}</div>`;
    // Show thesis text progressively as it streams in
    if(thesis){
      html+=`<div class="tbody" style="opacity:0.7;border-left:2px solid var(--green);padding-left:8px;margin-top:4px">${esc(thesis)}<span style="color:var(--green)">▌</span></div>`;
    }
  } else if(cs.genError && !thesis){
    html+=`<div style="font-size:7px;color:var(--red);padding:4px 0;">⚠ Thesis generation failed: ${esc(cs.genError)}</div>`;
  } else if(thesis){
    html+=`<div class="tbody">${esc(thesis)}</div>`;
    if(p.lean||p.entry||p.pass||p.watches.length){
      html+=`<div class="tpr">
        ${p.lean?`<div class="trow">LEAN: <span>${esc(p.lean)}</span></div>`:''}
        ${p.entry?`<div class="trow">ENTRY: <span>${esc(p.entry)}</span></div>`:''}
        ${p.pass?`<div class="trow">PASS IF: <span>${esc(p.pass)}</span></div>`:''}
        ${p.watches.map(w=>`<div class="trow">WATCH: <span>${esc(w)}</span></div>`).join('')}
        ${p.flags.map(f=>`<div class="trow" style="color:var(--yellow)">⚠ ${esc(f)}</div>`).join('')}
      </div>`;
    }
  } else {
    html+=`<div class="tempty">No thesis — click GENERATE or EDIT</div>`;
  }
  } // end _secOpen thesis
  html+=`</div>`;

  // Logs + footer
  if(cs.logs.length){
    const logOpen = cs._logOpen || false;
    const logCount = cs.logs.length;
    const lastLog = cs.logs[cs.logs.length-1];
    const lastErr = cs.logs.filter(l=>!l.ok).pop();
    html+=`<div style="border-top:1px solid var(--b1)">`;
    html+=`<div style="padding:3px 11px;cursor:pointer;display:flex;align-items:center;gap:6px" onclick="cardState['${id}']._logOpen=!cardState['${id}']._logOpen;renderCard(games.find(g=>g.id==='${id}'))">`;
    html+=`<span style="font-size:5px;color:var(--t3);letter-spacing:1px">DIAGNOSTICS</span>`;
    html+=`<span style="font-size:5px;color:var(--t3)">${logCount}</span>`;
    if(lastErr) html+=`<span style="font-size:5px;color:var(--red)">${esc(lastErr.msg).substring(0,50)}</span>`;
    html+=`<span style="margin-left:auto;font-size:6px;color:var(--t3);display:inline-block;transition:transform .2s;transform:rotate(${logOpen?'90':'0'}deg)">&#9656;</span>`;
    html+=`</div>`;
    if(logOpen){
      html+=`<div class="log">${cs.logs.map(l=>`<div class="${l.ok?'ok':'er'}">${l.t} ${esc(l.msg)}</div>`).join('')}</div>`;
    }
    html+=`</div>`;
  }
  if(cs.lastUp){
    const srcLabel = game.dataSource==='BDL'?'<span style="color:var(--yellow)">BDL</span>':'SR';
    const freshLabel = cs.dataFreshness==='STALE'?' · <span style="color:var(--red)">STALE</span>':cs.dataFreshness==='WATCH'?' · <span style="color:var(--yellow)">STATS LAG</span>':'';
    html+=`<div class="foot">↻ ${cs.lastUp.toLocaleTimeString()} · ${pollInterval/1000}s · ${srcLabel}${freshLabel}</div>`;
  }

  // Preserve log scroll position before re-render
  const logEl = el.querySelector('.log');
  const logScroll = logEl ? logEl.scrollTop : 0;
  const logWasAtBottom = logEl ? (logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 5) : true;
  el.innerHTML=html;
  // Restore log scroll — if user was at bottom, stay at bottom; otherwise preserve position
  const newLog = el.querySelector('.log');
  if(newLog){
    if(logWasAtBottom) newLog.scrollTop = newLog.scrollHeight;
    else newLog.scrollTop = logScroll;
  }

  // Countdown for PRE
  if(state==='PRE'&&game.scheduled){
    if(cs._countdown)clearInterval(cs._countdown);
    cs._countdown=setInterval(()=>{if(!cs.editing&&!cs.generating)renderCard(game);},1000);
  }else if(cs._countdown){clearInterval(cs._countdown);cs._countdown=null;}
}

// ── Thesis editing ────────────────────────────────────────────────────────
function startEdit(cardId){
  const cs=cardState[cardId];if(!cs)return;
  cs.editing=true;
  const tb=document.getElementById('thesis-block-'+cardId);
  if(!tb)return;
  const currentThesis=theses[cardId]||'';
  var h='<div class="thdr">PRE-GAME THESIS<span style="font-size:6px;color:var(--amber);letter-spacing:1px;">EDITING</span></div>';
  h+='<textarea class="ta" id="ta-'+cardId+'" autocomplete="off" autocorrect="on" spellcheck="true">'+esc(currentThesis)+'</textarea>';
  h+='<div class="thint">Lean: [team]\nEntry: [trigger]\nPass: [condition]\nWatch: [signal]\nFlag: [risk]</div>';
  h+='<div class="tbtn-row">';
  h+='<button class="tsave" onclick="saveThesisFromCard(\''+cardId+'\')">SAVE</button>';
  h+='<button class="tcancel" onclick="cancelEdit(\''+cardId+'\')">CANCEL</button>';
  h+='</div>';
  tb.innerHTML=h;
  setTimeout(function(){var ta=document.getElementById('ta-'+cardId);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}},50);
}
function cancelEdit(cardId){const cs=cardState[cardId];if(!cs)return;cs.editing=false;const g=games.find(x=>x.id===cardId);if(g)renderCard(g);}
function saveThesisFromCard(cardId){
  const ta=document.getElementById('ta-'+cardId);if(!ta)return;
  saveThesis(cardId,ta.value);
  const cs=cardState[cardId];if(cs)cs.editing=false;
  const g=games.find(x=>x.id===cardId);if(g)renderCard(g);
}
