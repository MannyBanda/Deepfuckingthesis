// Format swing value with correct sign — prevents "+-8" display bug
function fmtSwing(v){ var n = Math.round(v); return n >= 0 ? '+'+n : ''+n; }

// ══════════════════════════════════════════════════════════════════════════════
// VOLUME THREAT — detects opponent perimeter counter-engine at baseline
// ══════════════════════════════════════════════════════════════════════════════
function computeVolumeThreat(game){
  var cs = cardState[game.id]; if(!cs) return null;
  var s = game.summary || game.bdlData; if(!s || !s.home || !s.away) return null;
  var period = game.period || 1;
  var GAME_MINUTES = 40, PERIOD_MINUTES = 20;
  var sznDefault = 33;
  var clockParts = (game.clock||'').split(':');
  var clockMins = clockParts.length===2 ? (parseInt(clockParts[0])||0)+((parseInt(clockParts[1])||0)/60) : PERIOD_MINUTES;
  var halvesLeft = Math.max(0, 2 - period);
  var minsLeft = clockMins + (halvesLeft * PERIOD_MINUTES);
  var minsElapsed = Math.max(1, GAME_MINUTES - minsLeft);

  var pbpAudit = cs.pbpAudit;
  var sa = cs.sustainabilityAudit;
  var sust = cs.clientSustainability;

  function evalSide(stats, pbpSide, sustSide){
    var live3PA = Number(stats.three_points_att) || 0;
    var live3PM = Number(stats.three_points_made) || 0;
    var live3Pct = live3PA > 0 ? (live3PM / live3PA * 100) : 0;
    var baseline = parseFloat(sustSide?.seasonPrior || sustSide?.seasonBaseline || sznDefault);
    var cs3PM = pbpSide?.threes?.assisted || 0;
    var projected3PA = minsElapsed > 5 ? live3PA * (GAME_MINUTES / minsElapsed) : live3PA * 2;
    var deviation = live3Pct - baseline;
    var withinRange = deviation >= -5 && deviation <= 15;
    var active = projected3PA >= 34 && withinRange && live3PA >= 8;
    var discount = 0;
    if(active) discount = Math.min(0.50, Math.max(0, 0.25 + 0.15 * ((projected3PA - 34) / 15)));
    var vtBonus = 0;
    if(active && live3PM > 0){
      var poss = Number(stats.possessions) || 0;
      if(poss < 5) poss = (Number(stats.field_goals_att)||0) + 0.44*(Number(stats.free_throws_att)||0) - (Number(stats.offensive_rebounds)||0) + (Number(stats.turnovers||stats.total_turnovers)||0);
      if(poss > 10){
        var cs3PAEst = (cs3PM / live3PM) * live3PA;
        var cs3PAPerPoss = cs3PAEst / poss;
        vtBonus = cs3PAPerPoss * (baseline / 100) * 3 * 0.5;
      }
    }
    return {active:active, projected3PA:Math.round(projected3PA), live3PA:live3PA, live3PM:live3PM,
      live3Pct:Math.round(live3Pct*10)/10, cs3PM:cs3PM, baseline:baseline,
      deviation:Math.round(deviation*10)/10, discount:Math.round(discount*100)/100,
      vtBonus:Math.round(vtBonus*1000)/1000};
  }

  var hs = s.home?.statistics || s.home || {};
  var as = s.away?.statistics || s.away || {};
  var hSust = (sa && sa.home?.live3Pct != null) ? sa.home : sust ? sust.home : null;
  var aSust = (sa && sa.home?.live3Pct != null) ? sa.away : sust ? sust.away : null;
  var result = {
    home: evalSide(hs, pbpAudit?.home || null, hSust),
    away: evalSide(as, pbpAudit?.away || null, aSust),
  };
  function mitigate(vtSide, otherSide){
    if(!vtSide.active || vtSide.live3PA < 1) return;
    var ratio = otherSide.live3PA / vtSide.live3PA;
    var mitFactor = Math.max(0, Math.min(1, 1 - (ratio - 0.7) / 0.3));
    vtSide.discount = Math.round(vtSide.discount * mitFactor * 100) / 100;
    vtSide.vtBonus = Math.round(vtSide.vtBonus * mitFactor * 1000) / 1000;
    vtSide.mitigated = mitFactor < 1;
    vtSide.mitRatio = Math.round(ratio * 100) / 100;
    if(mitFactor === 0) vtSide.active = false;
  }
  mitigate(result.home, result.away);
  mitigate(result.away, result.home);
  return result;
}

// SWING CORE — shared 4-direction variance engine for throughput + lead safety
// ══════════════════════════════════════════════════════════════════════════════
function computeSwingCore(focalStats, targetStats, focalSustData, targetSustData, deficit, minsLeft, minsElapsed, gameFraction, sznDefault, focalVTBonus, targetVTBonus){
  var focalPoss = Number(focalStats.possessions) || 0;
  var targetPoss = Number(targetStats.possessions) || 0;
  if(focalPoss < 3) focalPoss = (Number(focalStats.field_goals_att)||0) + 0.44*(Number(focalStats.free_throws_att)||0) - (Number(focalStats.offensive_rebounds)||0) + (Number(focalStats.turnovers||focalStats.total_turnovers)||0);
  if(targetPoss < 3) targetPoss = (Number(targetStats.field_goals_att)||0) + 0.44*(Number(targetStats.free_throws_att)||0) - (Number(targetStats.offensive_rebounds)||0) + (Number(targetStats.turnovers||targetStats.total_turnovers)||0);
  if(focalPoss < 5 || targetPoss < 5 || isNaN(focalPoss) || isNaN(targetPoss)) return null;

  function structRate(st, poss){
    var paint = Number(st.points_in_the_paint || st.points_in_paint) || 0;
    var ft = Number(st.free_throws_made) || 0;
    var pot = Number(st.points_off_turnovers) || 0;
    var scp = Number(st.second_chance_points || st.second_chance_pts) || 0;
    return (paint + ft + pot + scp) / poss;
  }
  // 2PT quality factor: discount structRate when team converts poorly from 2
  var twoPointBaseline = sznDefault <= 34 ? 0.49 : 0.52;
  function qualityFactor(st) {
    var fgm = Number(st.field_goals_made) || 0;
    var fga = Number(st.field_goals_att) || 0;
    var fg3m = Number(st.three_points_made) || 0;
    var fg3a = Number(st.three_points_att) || 0;
    var fg2m = fgm - fg3m;
    var fg2a = fga - fg3a;
    if (fg2a < 6) return 1.0;
    return Math.max(0.75, Math.min(1.0, (fg2m / fg2a) / twoPointBaseline));
  }
  var focalStructRate = structRate(focalStats, focalPoss) * qualityFactor(focalStats) + (focalVTBonus || 0);
  var targetStructRate = structRate(targetStats, targetPoss) * qualityFactor(targetStats) + (targetVTBonus || 0);
  var structEdge = focalStructRate - targetStructRate;

  function getVarData(sustObj, stats, poss){
    if(!sustObj) return {deviation:0, threePARate:0, live3Pct:0, sznPct:sznDefault};
    var livePct = parseFloat(sustObj.live3Pct || 0);
    var sznPct = parseFloat(sustObj.seasonPrior || sustObj.seasonBaseline || sznDefault);
    var dev = livePct - sznPct;
    var tpaRate = poss > 0 ? (Number(stats.three_points_att)||0) / poss : 0;
    return {deviation:dev, threePARate:tpaRate, live3Pct:livePct, sznPct:sznPct};
  }
  var focalVar = getVarData(focalSustData, focalStats, focalPoss);
  var targetVar = getVarData(targetSustData, targetStats, targetPoss);

  var avgPoss = (focalPoss + targetPoss) / 2;
  var possPerMin = avgPoss / minsElapsed;
  var remainingPoss = possPerMin * minsLeft;
  if(isNaN(remainingPoss) || remainingPoss < 1) return null;

  var degradation = 1.0;
  if(deficit >= 24) degradation = 0.70;
  else if(deficit >= 18) degradation = 0.85;

  var bandDefs = [
    {label:'conservative', baseRate:0.40},
    {label:'expected',     baseRate:0.65},
    {label:'optimistic',   baseRate:0.90},
  ];

  var bands = bandDefs.map(function(band){
    var appliedRegression = band.baseRate * gameFraction;
    var targetCooling = 0;
    if(targetVar.deviation > 0){
      targetCooling = (targetVar.deviation / 100) * appliedRegression * targetVar.threePARate * 3;
    }
    var focalHeating = 0;
    if(focalVar.deviation < 0){
      focalHeating = (Math.abs(focalVar.deviation) / 100) * appliedRegression * focalVar.threePARate * 3;
    }
    var targetHeating = 0;
    if(targetVar.deviation < 0){
      targetHeating = (Math.abs(targetVar.deviation) / 100) * appliedRegression * targetVar.threePARate * 3;
    }
    var focalCooling = 0;
    if(focalVar.deviation > 0){
      focalCooling = (focalVar.deviation / 100) * appliedRegression * focalVar.threePARate * 3;
    }
    var netSwingPerPoss = (structEdge * degradation) + targetCooling + focalHeating - targetHeating - focalCooling;
    var totalSwing = netSwingPerPoss * remainingPoss;
    var ratio = deficit > 0 ? totalSwing / deficit : 0;
    return {label:band.label, ratio:Math.round(ratio*100)/100, totalSwing:Math.round(totalSwing*10)/10, netSwingPerPoss:Math.round(netSwingPerPoss*1000)/1000};
  });

  if(isNaN(bands[0].totalSwing) || isNaN(bands[1].totalSwing) || isNaN(remainingPoss)) return null;

  return {bands:bands, focalStructRate:Math.round(focalStructRate*1000)/1000, targetStructRate:Math.round(targetStructRate*1000)/1000,
    structEdge:Math.round(structEdge*1000)/1000, focalVar:focalVar, targetVar:targetVar,
    remainingPoss:Math.round(remainingPoss), degradation:degradation};
}

// ══════════════════════════════════════════════════════════════════════════════
// THROUGHPUT RECOVERY MODEL — trailing team's engine vs deficit
// NCAAMB: 40 min, 2×20 min halves. Elapsed-time gate (≥10 min = synthetic Q2)
// ══════════════════════════════════════════════════════════════════════════════
function computeThroughput(game){
  var cs = cardState[game.id]; if(!cs) return null;
  var s = game.summary || game.bdlData; if(!s || !s.home || !s.away) return null;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hPts = game.homePoints||0, aPts = game.awayPoints||0;
  var period = game.period||0;
  if(period < 1) return null;

  var floor = getFloor(cs);
  if(!floor || !floor.score) return null;
  var fTeam = floor.controlTeam;
  var ctrlIsHome = fTeam === hA;
  var ctrlPts = ctrlIsHome ? hPts : aPts;
  var oppPts = ctrlIsHome ? aPts : hPts;
  var deficit = oppPts - ctrlPts;
  if(deficit <= 0) return null;

  var GAME_MINUTES = 40, PERIOD_MINUTES = 20;
  var clockParts = (game.clock||'').split(':');
  var clockMins = clockParts.length===2 ? (parseInt(clockParts[0])||0)+(((parseInt(clockParts[1])||0))/60) : PERIOD_MINUTES;
  var periodsLeft = Math.max(0, 2 - period);
  var minsLeft = clockMins + (periodsLeft * PERIOD_MINUTES);
  var minsElapsed = Math.max(1, GAME_MINUTES - minsLeft);
  var gameFraction = Math.min(1, minsLeft / GAME_MINUTES);
  if(minsLeft < 0.3 || isNaN(minsLeft)) return null;
  if(minsElapsed < 10) return null; // need ~10 min of data (synthetic Q2)

  var hs = s.home?.statistics || s.home || {};
  var as = s.away?.statistics || s.away || {};
  var focalStats = ctrlIsHome ? hs : as;
  var targetStats = ctrlIsHome ? as : hs;

  var sa = cs.sustainabilityAudit;
  var sust = cs.clientSustainability;
  var focalSustData = (sa && sa.home?.live3Pct != null) ? (ctrlIsHome ? sa.home : sa.away) : sust ? (ctrlIsHome ? sust.home : sust.away) : null;
  var targetSustData = (sa && sa.home?.live3Pct != null) ? (ctrlIsHome ? sa.away : sa.home) : sust ? (ctrlIsHome ? sust.away : sust.home) : null;

  var vt = cs.volumeThreat;
  var focalVT = vt ? (ctrlIsHome ? vt.home?.vtBonus : vt.away?.vtBonus) : 0;
  var targetVT = vt ? (ctrlIsHome ? vt.away?.vtBonus : vt.home?.vtBonus) : 0;
  var core = computeSwingCore(focalStats, targetStats, focalSustData, targetSustData, deficit, minsLeft, minsElapsed, gameFraction, 33, focalVT, targetVT);
  if(!core) return null;

  var conservative = core.bands[0], expected = core.bands[1], optimistic = core.bands[2];
  var classification;
  if(conservative.ratio > 1.2) classification = 'STRONG RECOVERY';
  else if(conservative.ratio > 0.9) classification = 'PROBABLE';
  else if(conservative.ratio > 0.6) classification = 'CONTESTED';
  else if(conservative.ratio > 0.3) classification = 'UNLIKELY';
  else classification = 'NO PATH';

  return {
    classification: classification, deficit: deficit, remainingPoss: core.remainingPoss,
    conservative: conservative, expected: expected, optimistic: optimistic,
    ctrlStructRate: core.focalStructRate, oppStructRate: core.targetStructRate,
    structEdge: core.structEdge, ctrlVar: core.focalVar, oppVar: core.targetVar,
    degradation: core.degradation, minsLeft: Math.round(minsLeft * 10) / 10, fTeam: fTeam,
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// LEAD SAFETY MODEL — is the leading team's lead durable or at risk?
// Focal = opponent (trailing). High ratio = lead NOT safe.
// NCAAMB: 40 min, 2×20 min halves. Elapsed-time gate (≥10 min).
// ══════════════════════════════════════════════════════════════════════════════
function computeLeadSafety(game){
  var cs = cardState[game.id]; if(!cs) return null;
  var s = game.summary || game.bdlData; if(!s || !s.home || !s.away) return null;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hPts = game.homePoints||0, aPts = game.awayPoints||0;
  var period = game.period||0;
  if(period < 1) return null;

  var floor = getFloor(cs);
  if(!floor || !floor.score) return null;
  var fTeam = floor.controlTeam;
  var ctrlIsHome = fTeam === hA;
  var ctrlPts = ctrlIsHome ? hPts : aPts;
  var oppPts = ctrlIsHome ? aPts : hPts;
  var lead = ctrlPts - oppPts;
  if(lead < 2) return null;

  var GAME_MINUTES = 40, PERIOD_MINUTES = 20;
  var clockParts = (game.clock||'').split(':');
  var clockMins = clockParts.length===2 ? (parseInt(clockParts[0])||0)+(((parseInt(clockParts[1])||0))/60) : PERIOD_MINUTES;
  var periodsLeft = Math.max(0, 2 - period);
  var minsLeft = clockMins + (periodsLeft * PERIOD_MINUTES);
  var minsElapsed = Math.max(1, GAME_MINUTES - minsLeft);
  var gameFraction = Math.min(1, minsLeft / GAME_MINUTES);
  if(minsLeft < 0.3 || isNaN(minsLeft)) return null;
  if(minsElapsed < 10) return null; // need ~10 min of data (synthetic Q2)

  var hs = s.home?.statistics || s.home || {};
  var as = s.away?.statistics || s.away || {};
  var focalStats = ctrlIsHome ? as : hs;   // opponent (trailing)
  var targetStats = ctrlIsHome ? hs : as;   // control team (leading)

  var sa = cs.sustainabilityAudit;
  var sust = cs.clientSustainability;
  var focalSustData = (sa && sa.home?.live3Pct != null) ? (ctrlIsHome ? sa.away : sa.home) : sust ? (ctrlIsHome ? sust.away : sust.home) : null;
  var targetSustData = (sa && sa.home?.live3Pct != null) ? (ctrlIsHome ? sa.home : sa.away) : sust ? (ctrlIsHome ? sust.home : sust.away) : null;

  var vt = cs.volumeThreat;
  var focalVT = vt ? (ctrlIsHome ? vt.away?.vtBonus : vt.home?.vtBonus) : 0;
  var targetVT = vt ? (ctrlIsHome ? vt.home?.vtBonus : vt.away?.vtBonus) : 0;
  var core = computeSwingCore(focalStats, targetStats, focalSustData, targetSustData, lead, minsLeft, minsElapsed, gameFraction, 33, focalVT, targetVT);
  if(!core) return null;

  var conservative = core.bands[0], expected = core.bands[1], optimistic = core.bands[2];
  var classification;
  if(conservative.ratio > 0.8) classification = 'CRITICAL';
  else if(expected.ratio > 0.7) classification = 'AT RISK';
  else if(optimistic.ratio > 0.5 && expected.ratio >= 0.3) classification = 'CUSHIONED';
  else classification = 'SAFE';

  var oppTeam = ctrlIsHome ? aA : hA;

  return {
    classification: classification, lead: lead, remainingPoss: core.remainingPoss,
    conservative: conservative, expected: expected, optimistic: optimistic,
    oppStructRate: core.focalStructRate, ctrlStructRate: core.targetStructRate,
    structEdge: core.structEdge, oppVar: core.focalVar, ctrlVar: core.targetVar,
    degradation: core.degradation, minsLeft: Math.round(minsLeft * 10) / 10,
    fTeam: fTeam, oppTeam: oppTeam,
  };
}


// ══════════════════════════════════════════════════════════════════════════════
// MARGIN PROJECTION ENGINE — pace-adjusted forward-looking margin forecast
// Feeds: spread conviction + Sonnet FWP anchor
// ══════════════════════════════════════════════════════════════════════════════
function computeProjection(game){
  const cs = cardState[game.id]; if(!cs) return null;
  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const hPts = game.homePoints||0, aPts = game.awayPoints||0;
  const period = game.period||0;
  if(period < 1) return null;

  // Get stats source
  const isBDL = game.dataSource === 'BDL';
  const s = isBDL ? game.bdlData : game.summary;
  if(!s) return null;

  // ── TIME REMAINING (NCAAMB: 2×20 min halves) ──
  const GAME_MINUTES = 40;
  const PERIOD_MINUTES = 20;
  const clockParts = (game.clock||'').split(':');
  const clockMins = clockParts.length===2 ? parseInt(clockParts[0])+(parseInt(clockParts[1]||0)/60) : PERIOD_MINUTES;
  const periodsLeft = Math.max(0, 2 - period);
  const minsLeft = clockMins + (periodsLeft * PERIOD_MINUTES);
  const minsElapsed = Math.max(1, GAME_MINUTES - minsLeft);
  const pctRemaining = Math.min(1, minsLeft / GAME_MINUTES);

  if(minsElapsed < 4) return null; // need minimum sample

  // ── POSSESSIONS & EFFICIENCY ──
  const hs = isBDL ? (s.home||{}) : (s.home?.statistics||{});
  const as = isBDL ? (s.away||{}) : (s.away?.statistics||{});
  let hPoss = hs.possessions||0, aPoss = as.possessions||0;

  // Estimate possessions if unavailable (FGA + 0.44*FTA - OREB + TO)
  if(hPoss < 3){
    hPoss = (hs.field_goals_att||0) + 0.44*(hs.free_throws_att||0) - (hs.offensive_rebounds||0) + (hs.turnovers||0);
    aPoss = (as.field_goals_att||0) + 0.44*(as.free_throws_att||0) - (as.offensive_rebounds||0) + (as.turnovers||0);
  }
  const avgPoss = (hPoss + aPoss) / 2;
  if(avgPoss < 5) return null;

  // Points per possession
  const hPPP = hPoss > 0 ? hPts / hPoss : 1.0;
  const aPPP = aPoss > 0 ? aPts / aPoss : 1.0;
  const netEfficiency = hPPP - aPPP; // positive = home more efficient

  // Remaining possessions (per team)
  const possPerMin = avgPoss / minsElapsed;
  const remainingPoss = possPerMin * minsLeft;

  // ── RAW PROJECTED MARGIN ──
  const currentMargin = hPts - aPts; // positive = home leading
  const projectedShift = remainingPoss * netEfficiency;
  const rawProjectedMargin = currentMargin + projectedShift;

  // ── GARBAGE TIME DETECTION ──
  // When a team has a commanding lead late, they pull starters and the trailing
  // team scores easy points against bench. Compresses the final margin.
  let garbageTime = null;
  const absMargin = Math.abs(currentMargin);
  const GARBAGE_MARGIN = 15; // NCAAMB: 15+ points (NBA would use 18+)
  const GARBAGE_MINUTES = 5;

  if(absMargin >= GARBAGE_MARGIN && minsLeft <= GARBAGE_MINUTES){
    let startersPulled = false;

    // Check lineup data — are closers/starters still on the floor?
    const H = isBDL ? null : s.home;
    const A = isBDL ? null : s.away;
    const bl = cs.baselines;
    const struct = cs.structural;
    if(H?.players && A?.players){
      const leadSide = currentMargin > 0 ? 'home' : 'away';
      const leadPlayers = currentMargin > 0 ? H.players : A.players;
      const leadClosers = struct?.closers?.[leadSide] || bl?.starters?.[leadSide] || [];
      if(leadClosers.length >= 3){
        const onCourt = leadPlayers.filter(pl => pl.on_court);
        const closersOn = onCourt.filter(pl =>
          leadClosers.some(c => (pl.full_name||'').toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes((pl.full_name||'').toLowerCase()))
        ).length;
        if(closersOn <= 2) startersPulled = true;
      }
    }

    // Also trigger on extreme margin + very little time (even without lineup data)
    const isGarbage = startersPulled || (absMargin >= GARBAGE_MARGIN + 8 && minsLeft <= 3);

    if(isGarbage){
      // Margin compression model: leading team coasts, trailing team scores ~1.3 pts/min
      // against bench (vs ~0.8 pts/min normal scoring pace)
      const freePoints = Math.round(minsLeft * 1.3);
      const compressionPts = Math.min(freePoints, Math.round(absMargin * 0.30));
      garbageTime = {
        detected: true,
        startersPulled,
        compressionPts,
        reason: startersPulled ? 'starters pulled, bench lineup' : 'blowout coast ('+absMargin+' pts, '+minsLeft.toFixed(0)+'min)',
      };
    }
  }

  // Apply garbage time compression
  let projectedMargin = rawProjectedMargin;
  if(garbageTime?.detected){
    // Compression pushes margin toward zero (favors underdog spread, hurts favorite spread)
    const sign = currentMargin > 0 ? -1 : 1;
    projectedMargin = rawProjectedMargin + (garbageTime.compressionPts * sign);
  }

  // ── WIN PROBABILITY from projected margin ──
  // Normal CDF approximation: Φ(z) ≈ 1/(1 + e^(-1.7*z))
  // Std dev of remaining margin decreases as game progresses
  // Full game std dev ≈ 11 pts; remaining std dev = 11 * sqrt(pctRemaining)
  const fullStdDev = 11.0;
  const remainingStdDev = Math.max(2.0, fullStdDev * Math.sqrt(pctRemaining));
  const z = projectedMargin / remainingStdDev;
  const homeWinProb = 1 / (1 + Math.exp(-1.7 * z));
  const awayWinProb = 1 - homeWinProb;

  const projTeam = projectedMargin >= 0 ? hA : aA;
  const projWinProb = Math.max(homeWinProb, awayWinProb) * 100;

  return {
    currentMargin,
    projectedMargin: Math.round(projectedMargin * 10) / 10,
    rawProjectedMargin: Math.round(rawProjectedMargin * 10) / 10,
    projTeam,
    homeWinProb: Math.round(homeWinProb * 1000) / 10,
    awayWinProb: Math.round(awayWinProb * 1000) / 10,
    projWinProb: Math.round(projWinProb * 10) / 10,
    remainingPoss: Math.round(remainingPoss * 10) / 10,
    minsLeft: Math.round(minsLeft * 10) / 10,
    pctRemaining: Math.round(pctRemaining * 100),
    netEfficiency: Math.round(netEfficiency * 1000) / 1000,
    possPerMin: Math.round(possPerMin * 100) / 100,
    hPPP: Math.round(hPPP * 1000) / 1000,
    aPPP: Math.round(aPPP * 1000) / 1000,
    garbageTime,
    remainingStdDev: Math.round(remainingStdDev * 10) / 10,
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// SPREAD CONVICTION ENGINE v3 — projection primary + inflation dampener + rolling window health
// Guardrail 1: Inflation dampener caps conviction when spread moves far from opening
// Guardrail 2: Rolling window position × direction modifier
// ══════════════════════════════════════════════════════════════════════════════
function computeSpreadConviction(game){
  const cs = cardState[game.id]; if(!cs) return null;
  const pred = cs.prediction; if(!pred) return null;
  const od = cs.oddsData; if(!od || !od.homeSpread) return null;
  const proj = cs.projection;

  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const hPts = game.homePoints||0, aPts = game.awayPoints||0;
  const period = game.period||0;
  if(period < 1) return null;

  const homeSpreadNum = parseFloat(od.homeSpread);
  if(isNaN(homeSpreadNum)) return null;
  const awaySpreadNum = -homeSpreadNum;

  const hv = pred.homeValue, av = pred.awayValue;
  if(!hv || !av || hv.fwp==null || av.fwp==null) return null;

  // ── TIME (NCAAMB: 2×20 min halves) ──
  const clockParts = (game.clock||'').split(':');
  const clockMins = clockParts.length===2 ? parseInt(clockParts[0])+(parseInt(clockParts[1]||0)/60) : 20;
  const periodsLeft = Math.max(0, 2 - period);
  const minsLeft = clockMins + (periodsLeft * 20);

  // ── STRUCTURAL CONTEXT ──
  const floorInd = getFloor(cs);
  const floorScore = floorInd?.score || 0.5;
  const floorTeam = floorInd?.controlTeam || '';
  const lc = cs.clientLeadComposition;
  const scoringClass = lc?.classification || 'MIXED';
  const leadTeam = lc?.leadTeam || (hPts >= aPts ? hA : aA);

  // ── GUARDRAIL 1: INFLATION DAMPENER ──
  var openSpread = cs.openingOdds ? parseFloat(cs.openingOdds.homeSpread) : NaN;
  var spreadMovement = !isNaN(openSpread) ? Math.abs(homeSpreadNum - openSpread) : 0;
  var regimeChange = !isNaN(openSpread) && ((openSpread > 0 && homeSpreadNum < 0) || (openSpread < 0 && homeSpreadNum > 0));
  var openMag = !isNaN(openSpread) ? Math.abs(openSpread) : 10;
  var tierShift = openMag <= 3 ? -1 : openMag >= 15 ? 1 : 0;

  function getInflationCap(movement, isRegimeChange, tierAdj){
    if(isRegimeChange) return 95;
    var tiers = [{min:15,cap:65},{min:10,cap:72},{min:5,cap:82},{min:0,cap:95}];
    var adjMovement = movement - (tierAdj * 3);
    for(var t=0;t<tiers.length;t++){ if(adjMovement >= tiers[t].min) return tiers[t].cap; }
    return 95;
  }
  var inflationCap = getInflationCap(spreadMovement, regimeChange, tierShift);
  var inflationFloor = 100 - inflationCap;

  // ── GUARDRAIL 2: ROLLING WINDOW HEALTH ──
  var rw = cs.rollingWindow;
  var cRead = cs.combinedRead;
  var rwPositionMod = 0;
  var rwDirectionMod = 0;
  var rwLabel = '';
  var isGarbageTime = proj?.garbageTime?.detected || false;

  if(rw && rw.available && !isGarbageTime){
    var rwScoreFloorPerspective;
    if(rw.controlTeam === floorTeam){ rwScoreFloorPerspective = rw.score; }
    else { rwScoreFloorPerspective = 1 - rw.score; }

    if(rwScoreFloorPerspective > 0.75){ rwPositionMod = 5; rwLabel = 'STRONG'; }
    else if(rwScoreFloorPerspective >= 0.60){ rwPositionMod = 0; rwLabel = 'EARNED'; }
    else if(rwScoreFloorPerspective >= 0.45){ rwPositionMod = -7; rwLabel = 'CONTESTED'; }
    else if(rwScoreFloorPerspective >= 0.30){ rwPositionMod = -10; rwLabel = 'LOSING'; }
    else { rwPositionMod = -14; rwLabel = 'FLIPPED'; }

    var accel = cs.acceleration?.accel || 'STABLE';
    var cReadState = cRead?.read || '';
    if(accel === 'GROWING' || cReadState === 'DOMINANT' || cReadState === 'EMERGING'){ rwDirectionMod = 3; }
    else if(accel === 'DECLINING' || cReadState === 'ERODING' || cReadState === 'FADING'){ rwDirectionMod = -3; }
    else if(cReadState === 'COLLAPSING' || cReadState === 'FLIPPED'){ rwDirectionMod = -3; }
  }

  function evalTeamSpread(alias, spread, fwp, pts, oppPts){
    var actualMargin = pts - oppPts;
    var coverMargin = actualMargin + spread;
    var absSpread = Math.abs(spread);
    var isFavorite = spread < 0;
    var isUnderdog = spread > 0;

    var coverProb;
    var projBased = false;
    if(proj && proj.remainingStdDev > 0){
      var teamProjectedMargin = alias === hA ? proj.projectedMargin : -proj.projectedMargin;
      var coverZ = (teamProjectedMargin + spread) / proj.remainingStdDev;
      coverProb = (1 / (1 + Math.exp(-1.7 * coverZ))) * 100;
      projBased = true;
    } else {
      if(isUnderdog){ coverProb = fwp + Math.min(20, absSpread * 3.5); }
      else { coverProb = fwp - Math.min(25, absSpread * 3.0); }
    }

    var structMod = 0;
    var teamHasStructure = floorTeam === alias && floorScore >= 0.55;
    var oppHasStructure = floorTeam !== alias && floorTeam && floorScore >= 0.55;
    if(teamHasStructure) structMod = (floorScore - 0.5) * 20;
    else if(oppHasStructure) structMod = -(floorScore - 0.5) * 15;

    var scoringMod = 0;
    var teamIsLeadTeam = alias === leadTeam;
    if(teamIsLeadTeam){
      if(scoringClass === 'VOLATILE') scoringMod = -5;
      else if(scoringClass === 'STRUCTURAL' || scoringClass === 'IDENTITY') scoringMod = 3;
    } else {
      if(scoringClass === 'VOLATILE') scoringMod = 5;
      else if(scoringClass === 'STRUCTURAL' || scoringClass === 'IDENTITY') scoringMod = -3;
    }

    var rwMod = 0;
    if(rw && rw.available && !isGarbageTime){
      if(teamHasStructure || alias === floorTeam){ rwMod = rwPositionMod + rwDirectionMod; }
      else { rwMod = -(rwPositionMod + rwDirectionMod); }
    }

    var garbageMod = 0;
    if(proj?.garbageTime?.detected){
      if(isFavorite && actualMargin > 0){ garbageMod = -Math.min(20, proj.garbageTime.compressionPts * 2.5); }
      else if(isUnderdog && actualMargin < 0){ garbageMod = Math.min(15, proj.garbageTime.compressionPts * 2.0); }
    }

    coverProb = coverProb + structMod + scoringMod + rwMod + garbageMod;
    if(isFavorite && coverProb > inflationCap) coverProb = inflationCap;
    if(isUnderdog && coverProb < inflationFloor) coverProb = inflationFloor;

    // ── GUARDRAIL 3: THROUGHPUT RECOVERY CAP ──
    var tpCap = null;
    var _tp = cs.throughput;
    if(_tp && _tp.fTeam === alias && _tp.conservative){
      var conRatio = _tp.conservative.ratio;
      if(conRatio < 0.4){ tpCap = 45; }
      else if(conRatio < 0.7){ tpCap = 60; }
      if(tpCap !== null && coverProb > tpCap) coverProb = tpCap;
    }

    // ── GUARDRAIL 4: LEAD SAFETY CAP ──
    var lsCap = null;
    var _ls = cs.leadSafety;
    if(_ls && _ls.fTeam === alias && _ls.conservative){
      var lsClass = _ls.classification;
      if(lsClass === 'CRITICAL'){ lsCap = 50; }
      else if(lsClass === 'AT RISK'){ lsCap = 65; }
      if(lsCap !== null && coverProb > lsCap) coverProb = lsCap;
    }

    coverProb = Math.max(5, Math.min(95, coverProb));

    var parts = [];
    if(projBased){
      var teamProjMargin = alias === hA ? proj.projectedMargin : -proj.projectedMargin;
      parts.push('proj '+(teamProjMargin>=0?'+':'')+teamProjMargin.toFixed(1)+' margin');
      parts.push(proj.remainingPoss.toFixed(0)+' poss left');
    } else { parts.push('FWP '+fwp.toFixed(0)+'%'); }
    if(coverMargin > 0) parts.push('covering by '+coverMargin.toFixed(1));
    else if(coverMargin < 0) parts.push('need '+Math.abs(coverMargin).toFixed(1)+' pts');
    if(teamHasStructure) parts.push('structural ('+floorScore.toFixed(2)+')');
    if(rwMod !== 0) parts.push('RW:'+rwLabel+'('+(rwMod>=0?'+':'')+rwMod+')');
    if(spreadMovement >= 5 && !regimeChange) parts.push('inflated '+spreadMovement.toFixed(0)+'pts(cap'+inflationCap+')');
    if(regimeChange) parts.push('REGIME FLIP');
    if(scoringClass === 'VOLATILE' && teamIsLeadTeam) parts.push('VOLATILE lead');
    if(proj?.garbageTime?.detected) parts.push('GARBAGE('+proj.garbageTime.reason+')');
    if(tpCap !== null) parts.push('TP cap:'+tpCap+'(con:'+_tp.conservative.ratio.toFixed(2)+')');
    if(lsCap !== null) parts.push('LS cap:'+lsCap+'('+_ls.classification+')');
    if(minsLeft < 8) parts.push(minsLeft.toFixed(0)+'min left');

    return { team:alias, spread:(spread>0?'+':'')+spread.toFixed(1), coverProb:Math.round(coverProb), coverMargin:coverMargin, projBased:projBased, reason:parts.join(' + ') };
  }

  var homeResult = evalTeamSpread(hA, homeSpreadNum, hv.fwp, hPts, aPts);
  var awayResult = evalTeamSpread(aA, awaySpreadNum, av.fwp, aPts, hPts);

  function convictionTier(prob){
    if(prob >= 70) return 'STRONG COVER';
    if(prob >= 55) return 'LEAN COVER';
    if(prob >= 45) return 'NO EDGE';
    if(prob >= 30) return 'LEAN FADE';
    return 'STRONG FADE';
  }

  homeResult.conviction = convictionTier(homeResult.coverProb);
  awayResult.conviction = convictionTier(awayResult.coverProb);

  var recommendation = homeResult.coverProb > awayResult.coverProb ? 'home' : awayResult.coverProb > homeResult.coverProb ? 'away' : 'neither';

  return {
    home: homeResult, away: awayResult, recommendation,
    margin: Math.abs(hPts - aPts), minsLeft: minsLeft.toFixed(0), tied: hPts === aPts,
    projectionAvailable: !!proj, garbageTime: proj?.garbageTime || null,
    inflationCap: inflationCap, spreadMovement: spreadMovement.toFixed(1), regimeChange: regimeChange, rwLabel: rwLabel,
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// ROLLING WINDOW ARCHITECTURE — Snapshot, Window, Gap, Arrows
// ══════════════════════════════════════════════════════════════════════════════

// ── Snapshot Capture ─────────────────────────────────────────────────────────
// Called every poll from fetchSummary. Stores cumulative stats at quarter boundaries.
function captureSnapshot(game){
  const cs = cardState[game.id]; if(!cs) return;
  const s = game.summary; if(!s||!s.home||!s.away) return;
  const currentPeriod = game.period||0;
  if(currentPeriod < 1) return;

  if(!cs.quarterSnapshots){
    // First poll — initialize with current cumulative as baseline
    const snap = {
      ts: Date.now(),
      home: Object.assign({}, s.home.statistics||{}),
      away: Object.assign({}, s.away.statistics||{}),
    };
    cs.quarterSnapshots = {
      boundaries: { 0: snap },
      quarters: {},
      lastSnapshotPeriod: 0,
      backfillNeeded: [],
      backfillDone: false,
    };
    addLog(game.id, '📸 Snapshot baseline captured (H'+currentPeriod+')', true);
    return;
  }

  const qs = cs.quarterSnapshots;

  // Always store latest cumulative as rolling overwrite for current partial quarter
  qs._latestCumulative = {
    ts: Date.now(),
    home: Object.assign({}, s.home.statistics||{}),
    away: Object.assign({}, s.away.statistics||{}),
  };

  // Detect quarter boundary crossing
  if(currentPeriod > qs.lastSnapshotPeriod + 1){
    // Crossed 1+ boundaries
    const missed = [];
    for(let q = qs.lastSnapshotPeriod+1; q < currentPeriod; q++) missed.push(q);

    if(missed.length === 1 && !qs.boundaries[missed[0]]){
      // Normal: caught boundary (within poll drift)
      // Use the previous poll's latest cumulative as the boundary
      const prevCum = qs._prevCumulative || qs._latestCumulative;
      qs.boundaries[missed[0]] = {
        ts: Date.now(),
        home: Object.assign({}, prevCum.home),
        away: Object.assign({}, prevCum.away),
      };
      computeQuarterDelta(qs, missed[0]);
      qs.lastSnapshotPeriod = missed[0];
      addLog(game.id, '📸 H'+missed[0]+' boundary captured', true);
    } else if(missed.length > 1){
      // Missed boundaries — phone asleep etc.
      qs.backfillNeeded = missed.filter(q => !qs.boundaries[q]);
      qs.lastSnapshotPeriod = currentPeriod - 1;
      addLog(game.id, '⚠ Missed H'+missed.join(',')+' boundaries — BDL backfill queued', false);
      // Trigger async backfill
      if(qs.backfillNeeded.length > 0 && !qs._backfilling){
        backfillMissingQuarters(game);
      }
    }
  } else if(currentPeriod === qs.lastSnapshotPeriod + 1 && !qs.boundaries[qs.lastSnapshotPeriod+1]){
    // Just crossed into new quarter — capture boundary for previous quarter
    const q = qs.lastSnapshotPeriod + 1;
    // Boundary = previous poll's cumulative (closest to quarter end)
    if(qs._prevCumulative){
      qs.boundaries[q] = {
        ts: Date.now(),
        home: Object.assign({}, qs._prevCumulative.home),
        away: Object.assign({}, qs._prevCumulative.away),
      };
      computeQuarterDelta(qs, q);
      qs.lastSnapshotPeriod = q;
      addLog(game.id, '📸 H'+q+' boundary captured', true);
    }
  }

  // Compute current partial quarter delta
  const prevBoundary = qs.boundaries[currentPeriod - 1] || qs.boundaries[qs.lastSnapshotPeriod];
  if(prevBoundary && qs._latestCumulative){
    qs.quarters[currentPeriod] = {
      home: diffStats(qs._latestCumulative.home, prevBoundary.home),
      away: diffStats(qs._latestCumulative.away, prevBoundary.away),
      source: 'snapshot',
      partial: true,
    };
  }

  // Store prev for next poll's boundary detection
  qs._prevCumulative = {
    home: Object.assign({}, s.home.statistics||{}),
    away: Object.assign({}, s.away.statistics||{}),
  };

  // Persist snapshots (including latest cumulative for partial period recovery)
  try { localStorage.setItem('ncaamb:snap:'+game.id, JSON.stringify({
    boundaries: qs.boundaries, quarters: qs.quarters,
    lastSnapshotPeriod: qs.lastSnapshotPeriod,
    _latestCumulative: qs._latestCumulative||null,
    _prevCumulative: qs._prevCumulative||null,
    backfillNeeded: qs.backfillNeeded||[],
    backfillDone: qs.backfillDone||false,
  })); } catch(e){}
}

function diffStats(current, previous){
  const d = {};
  const keys = ['points_in_the_paint','fast_break_points','points_off_turnovers',
    'second_chance_points','possessions','field_goals_at_rim_made','field_goals_at_rim_att',
    'field_goals_made','field_goals_att','three_points_made','three_points_att',
    'free_throws_made','free_throws_att','assists','turnovers','total_turnovers','steals','blocks',
    'offensive_rebounds','personal_fouls','points','bench_points',
    'offensive_points_per_possession','defensive_points_per_possession'];
  keys.forEach(k => {
    const c = current[k], p = previous[k];
    if(c!=null && p!=null) d[k] = c - p;
    else if(c!=null) d[k] = c;
    else d[k] = null;
  });
  // Derived
  const fga = d.field_goals_att||1;
  d.efg = fga>0 ? ((d.field_goals_made||0)+0.5*(d.three_points_made||0))/fga : null;
  d.assist_ratio = (d.field_goals_made||0)>0 ? ((d.assists||0)/(d.field_goals_made||1))*100 : null;
  d.fg3a_share = fga>0 ? ((d.three_points_att||0)/fga)*100 : null;
  return d;
}

function computeQuarterDelta(qs, quarterNum){
  const curr = qs.boundaries[quarterNum];
  const prev = qs.boundaries[quarterNum-1];
  if(!curr||!prev) return;
  qs.quarters[quarterNum] = {
    home: diffStats(curr.home, prev.home),
    away: diffStats(curr.away, prev.away),
    source: 'snapshot',
    partial: false,
  };
}

// ── BDL Backfill ─────────────────────────────────────────────────────────────
async function backfillMissingQuarters(game){
  const cs = cardState[game.id]; if(!cs) return;
  const qs = cs.quarterSnapshots; if(!qs) return;
  const bdlId = bdlGameMap[game.id];
  if(!bdlId){ addLog(game.id,'BDL backfill skipped — no BDL game ID',false); return; }
  qs._backfilling = true;
  const needed = [...qs.backfillNeeded];
  addLog(game.id,'⚡ Backfilling Q'+needed.join(',')+' from BDL…',true);

  for(const q of needed){
    try{
      await new Promise(r=>setTimeout(r,200)); // stagger
      const adv = await bdl('advanced',{game_id:bdlId,period:String(q)});
      const basic = await bdl('stats',{game_id:bdlId,period:String(q)});
      const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
      const hId = game.home?.id, aId = game.away?.id;

      // Aggregate by team
      function aggTeam(data, teamId, teamAlias){
        const players = (data.data||[]).filter(p=>{
          const tid = p.team?.id || p.player?.team_id;
          return String(tid)===String(teamId);
        });
        const sum = (arr,key) => arr.reduce((a,p)=>a+(p[key]||0),0);
        return players.length>0 ? players : [];
      }

      function aggBasicTeam(basicData, teamAlias){
        const pl = (basicData.data||[]).filter(p=>(p.team?.abbreviation||'')=== teamAlias);
        const sum = (key) => pl.reduce((a,p)=>a+(p[key]||0),0);
        return {
          field_goals_made:sum('fgm'), field_goals_att:sum('fga'),
          three_points_made:sum('fg3m'), three_points_att:sum('fg3a'),
          free_throws_made:sum('ftm'), free_throws_att:sum('fta'),
          assists:sum('ast'), turnovers:sum('turnover'),
          steals:sum('stl'), blocks:sum('blk'),
          offensive_rebounds:sum('oreb'), personal_fouls:sum('pf'),
          points:sum('pts'),
        };
      }

      function aggAdvTeam(advData, teamAlias){
        const pl = (advData.data||[]).filter(p=>(p.team?.abbreviation||'')===teamAlias && (p.possessions||0)>0);
        const sum = (key) => pl.reduce((a,p)=>a+(p[key]||0),0);
        return {
          points_in_the_paint:sum('points_paint'),
          fast_break_points:sum('points_fast_break'),
          points_off_turnovers:sum('points_off_turnovers'),
          second_chance_points:sum('points_second_chance'),
          possessions:sum('possessions'),
        };
      }

      const hBasic = aggBasicTeam(basic, hA);
      const aBasic = aggBasicTeam(basic, aA);
      const hAdv = aggAdvTeam(adv, hA);
      const aAdv = aggAdvTeam(adv, aA);

      qs.quarters[q] = {
        home: Object.assign({}, hBasic, hAdv, {
          field_goals_at_rim_made:null, field_goals_at_rim_att:null,
          bench_points:null, // can't easily derive from BDL per-period
        }),
        away: Object.assign({}, aBasic, aAdv, {
          field_goals_at_rim_made:null, field_goals_at_rim_att:null,
          bench_points:null,
        }),
        source: 'bdl', partial: false,
      };
      // Derive ratios
      ['home','away'].forEach(side=>{
        const d = qs.quarters[q][side];
        const fga = d.field_goals_att||1;
        d.efg = fga>0?((d.field_goals_made||0)+0.5*(d.three_points_made||0))/fga:null;
        d.assist_ratio = (d.field_goals_made||0)>0?((d.assists||0)/(d.field_goals_made||1))*100:null;
        d.fg3a_share = fga>0?((d.three_points_att||0)/fga)*100:null;
      });

      qs.backfillNeeded = qs.backfillNeeded.filter(x=>x!==q);
      addLog(game.id,'✓ H'+q+' backfilled from BDL (at-rim N/A)',true);
    }catch(e){
      addLog(game.id,'⚠ H'+q+' backfill failed: '+e.message,false);
    }
  }
  qs._backfilling = false;
  qs.backfillDone = true;
  // Persist
  try { localStorage.setItem('ncaamb:snap:'+game.id, JSON.stringify({
    boundaries: qs.boundaries, quarters: qs.quarters,
    lastSnapshotPeriod: qs.lastSnapshotPeriod,
    _latestCumulative: qs._latestCumulative||null,
    _prevCumulative: qs._prevCumulative||null,
    backfillNeeded: qs.backfillNeeded||[],
    backfillDone: qs.backfillDone||false,
  })); } catch(e){}
}

// ── Restore snapshots from localStorage ──────────────────────────────────────
function restoreSnapshots(gameId){
  try{
    const raw = localStorage.getItem('ncaamb:snap:'+gameId);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

// ── Rolling Window ───────────────────────────────────────────────────────────
// ── Rolling Window (Cross-fade, NCAAMB halves) ──────────────────────────────
// H2: H1(fading as H2 builds) + H2(partial)
// OT: H2(fading) + OT(partial)
function computeRollingWindow(game){
  const cs = cardState[game.id]; if(!cs) return null;
  const qs = cs.quarterSnapshots; if(!qs) return null;
  const p = game.period||0;
  if(p < 2) return { available:false, reason:'TOO EARLY' };

  // Clock → completion fraction of current period (0.0 = just started, 1.0 = period over)
  const clockParts = (game.clock||'').split(':');
  const clockMins = clockParts.length===2 ? parseInt(clockParts[0])+(parseInt(clockParts[1]||0)/60) : 20;
  const periodLength = p <= 2 ? 20 : 5; // 20-min halves, 5-min OT
  const completion = Math.max(0, Math.min(1, (periodLength - clockMins) / periodLength));

  var weightedQs = {};
  var windowLabel = [];

  if(p === 2){
    // H2: H1(fading) + H2(partial, building)
    if(qs.quarters[1] && completion < 1) weightedQs[1] = Math.max(0, 1.0 - completion);
    if(qs.quarters[2]) weightedQs[2] = 1.0;
    windowLabel = completion > 0.95 ? ['H2*'] : ['H1('+Math.round((1-completion)*100)+'%)','H2*'];
  } else if(p >= 3){
    // OT: H2(fading) + OT(partial)
    if(qs.quarters[2] && completion < 1) weightedQs[2] = Math.max(0, 1.0 - completion);
    if(qs.quarters[p]) weightedQs[p] = 1.0;
    windowLabel = ['H2','OT*'];
  }

  const serverPeriods = cs._serverPeriodScores || {};
  const activeQs = Object.keys(weightedQs).filter(q => weightedQs[q] > 0 && (qs.quarters[q] || serverPeriods[q]));
  if(activeQs.length === 0){
    return { available:false, reason:'No half data yet', windowQuarters:windowLabel };
  }

  const clientQs = activeQs.filter(q => qs.quarters[q]);

  function aggWindow(side){
    const agg = {};
    const sumKeys = ['points_in_the_paint','fast_break_points','points_off_turnovers',
      'second_chance_points','possessions','field_goals_at_rim_made','field_goals_at_rim_att',
      'field_goals_made','field_goals_att','three_points_made','three_points_att',
      'free_throws_made','free_throws_att','assists','turnovers','total_turnovers','steals','blocks',
      'offensive_rebounds','personal_fouls','points','bench_points'];
    sumKeys.forEach(k=>{ agg[k]=0; let hasAny=false;
      clientQs.forEach(q=>{ const v=qs.quarters[q]?.[side]?.[k]; if(v!=null){agg[k]+=v*weightedQs[q];hasAny=true;} });
      if(!hasAny) agg[k]=null;
    });
    const fga=agg.field_goals_att||1;
    agg.efg=fga>0?((agg.field_goals_made||0)+0.5*(agg.three_points_made||0))/fga:null;
    agg.assist_ratio=(agg.field_goals_made||0)>0?((agg.assists||0)/(agg.field_goals_made||1))*100:null;
    agg.fg3a_share=fga>0?((agg.three_points_att||0)/fga)*100:null;
    return agg;
  }

  const hW = aggWindow('home'), aW = aggWindow('away');
  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const W = {I1:.10,I2:.15,I3:.20,I4:.30,I5:.25};

  const hWDisrupt=(hW.steals||0)+(hW.blocks||0);
  const aWDisrupt=(aW.steals||0)+(aW.blocks||0);
  const wDisruptDiff=hWDisrupt-aWDisrupt;
  const i1=wDisruptDiff>1?1:wDisruptDiff<-1?-1:0;
  const wI1 = {score:i1>0?1:i1===0?.5:0, detail:'Disrupt:'+hWDisrupt.toFixed(0)+'\u2013'+aWDisrupt.toFixed(0)+' (stl+blk, window)'};

  const hPaint=hW.points_in_the_paint||0, aPaint=aW.points_in_the_paint||0;
  const cfPaintDiff=hPaint-aPaint;
  let cfSubA=0; if(cfPaintDiff>3)cfSubA=1; else if(cfPaintDiff<-3)cfSubA=-1;
  const cfhRimM=hW.field_goals_at_rim_made, cfaRimM=aW.field_goals_at_rim_made;
  const cfhRimA=hW.field_goals_at_rim_att, cfaRimA=aW.field_goals_at_rim_att;
  const cfhRPct=(cfhRimA!=null&&cfhRimA>=6)?cfhRimM/cfhRimA:null;
  const cfaRPct=(cfaRimA!=null&&cfaRimA>=6)?cfaRimM/cfaRimA:null;
  let cfSubB=0; if(cfhRPct!=null&&cfaRPct!=null){if(cfhRPct-cfaRPct>0.10)cfSubB=1;else if(cfaRPct-cfhRPct>0.10)cfSubB=-1;}
  const cfI2raw=cfSubA+cfSubB;
  const wI2 = {score:cfI2raw>0?1:cfI2raw<0?0:.5, detail:'Paint:'+hPaint.toFixed(0)+'\u2013'+aPaint.toFixed(0)+'('+(cfPaintDiff>0?'+':'')+cfPaintDiff.toFixed(0)+') RimFG:'+(cfhRPct!=null?(cfhRPct*100).toFixed(0):'?')+'%\u2013'+(cfaRPct!=null?(cfaRPct*100).toFixed(0):'?')+'%'};

  const hEFG=hW.efg, aEFG=aW.efg;
  const hAR=hW.assist_ratio||0, aAR=aW.assist_ratio||0;
  let i3=0;
  if(hEFG!=null&&aEFG!=null) i3+=(hEFG>aEFG+.02?1:hEFG<aEFG-.02?-1:0);
  i3+=(hAR>aAR+5?1:hAR<aAR-5?-1:0);
  const wI3 = {score:i3>0?1:i3===0?.5:0, detail:'eFG:'+(hEFG!=null?(hEFG*100).toFixed(0):'?')+'\u2013'+(aEFG!=null?(aEFG*100).toFixed(0):'?')+' AR:'+hAR.toFixed(0)+'\u2013'+aAR.toFixed(0)};

  const hCumBigLead=game.summary?.home?.statistics?.biggest_lead||0;
  const aCumBigLead=game.summary?.away?.statistics?.biggest_lead||0;
  const wBLdiff=hCumBigLead-aCumBigLead;
  const wi4subA=wBLdiff>4?1:wBLdiff<-4?-1:0;
  const hPts=hW.points||0, aPts=aW.points||0;
  const pDiff=hPts-aPts;
  const wi4subB=pDiff>4?1:pDiff<-4?-1:0;
  let i4=wi4subA+wi4subB;
  const wI4 = {score:i4>0?1:i4===0?.5:0, detail:'BigLead:'+hCumBigLead+'\u2013'+aCumBigLead+' WinΔ:'+pDiff.toFixed(0)};

  const wI5 = {score:0.5, detail:'Runs not window-segmentable'};

  const raw_pre = wI1.score*W.I1 + wI2.score*W.I2 + wI3.score*W.I3 + wI4.score*W.I4 + wI5.score*W.I5;

  const serverOnlyQs = activeQs.filter(q => !qs.quarters[q] && serverPeriods[q]);
  var raw = raw_pre;
  if(serverOnlyQs.length > 0 && clientQs.length > 0){
    var cW = 0, sW = 0;
    clientQs.forEach(function(q){ cW += weightedQs[q]; });
    serverOnlyQs.forEach(function(q){ sW += weightedQs[q]; });
    var tW = cW + sW;
    if(tW > 0 && sW > 0){
      var sI1=0,sI2=0,sI3=0,sI4=0,sI5=0;
      serverOnlyQs.forEach(function(q){
        var sp = serverPeriods[q]; var w = weightedQs[q];
        sI1+=sp.i1*w; sI2+=sp.i2*w; sI3+=sp.i3*w; sI4+=sp.i4*w; sI5+=sp.i5*w;
      });
      sI1/=sW; sI2/=sW; sI3/=sW; sI4/=sW; sI5/=sW;
      var sRaw = sI1*W.I1 + sI2*W.I2 + sI3*W.I3 + sI4*W.I4 + sI5*W.I5;
      raw = (raw_pre * cW + sRaw * sW) / tW;
      wI1.score = (wI1.score * cW + sI1 * sW) / tW;
      wI2.score = (wI2.score * cW + sI2 * sW) / tW;
      wI3.score = (wI3.score * cW + sI3 * sW) / tW;
      wI4.score = (wI4.score * cW + sI4 * sW) / tW;
      wI5.score = (wI5.score * cW + sI5 * sW) / tW;
      windowLabel = activeQs.map(function(q){ return 'H'+q+(serverOnlyQs.indexOf(q)>=0?'s':'')+(q==p?'*':''); });
    }
  } else if(serverOnlyQs.length > 0 && clientQs.length === 0){
    var sI1=0,sI2=0,sI3=0,sI4=0,sI5=0,sWt=0;
    serverOnlyQs.forEach(function(q){
      var sp = serverPeriods[q]; var w = weightedQs[q];
      sI1+=sp.i1*w; sI2+=sp.i2*w; sI3+=sp.i3*w; sI4+=sp.i4*w; sI5+=sp.i5*w; sWt+=w;
    });
    if(sWt>0){ sI1/=sWt; sI2/=sWt; sI3/=sWt; sI4/=sWt; sI5/=sWt; }
    wI1.score=sI1; wI2.score=sI2; wI3.score=sI3; wI4.score=sI4; wI5.score=sI5;
    raw = sI1*W.I1 + sI2*W.I2 + sI3*W.I3 + sI4*W.I4 + sI5*W.I5;
    windowLabel = serverOnlyQs.map(function(q){ return 'H'+q+'s'+(q==p?'*':''); });
  }
  const controlHome = raw>=0.5;
  const score = controlHome?raw:1-raw;
  const controlTeam = controlHome?hA:aA;

  const missingFields = [];
  if(hW.points_in_the_paint===null) missingFields.push('paint');
  if(hW.field_goals_at_rim_att===null) missingFields.push('at_rim');
  if(hW.fast_break_points===null) missingFields.push('fbp');
  if(hW.possessions===null) missingFields.push('poss');

  return {
    available: true,
    windowQuarters: windowLabel,
    windowPossessions: (hPoss||0)+(aPoss||0),
    home: hW, away: aW,
    I1:wI1, I2:wI2, I3:wI3, I4:wI4, I5:wI5,
    score, controlTeam,
    dataQuality: missingFields.length>0?'PARTIAL':'FULL',
    missingFields,
    crossFade: true,
    completion: completion,
  };
}

// ── Gap Acceleration ─────────────────────────────────────────────────────────
function updateGapLog(gameId, floorScore, floorTeam, windowResult, game){
  const cs = cardState[gameId]; if(!cs) return;
  if(!cs.gapLog) cs.gapLog = [];
  if(!windowResult||!windowResult.available) return;

  const wScore = windowResult.score;
  const wTeam = windowResult.controlTeam;
  // Normalize: gap positive means window stronger for floor's control team
  let gap = 0;
  if(floorTeam === wTeam){ gap = wScore - floorScore; }
  else { gap = -(wScore + floorScore - 1); } // teams differ: divergence

  cs.gapLog.push({
    ts: Date.now(),
    period: game.period||0,
    clock: game.clock||'',
    floor: floorScore,
    floorTeam,
    window: wScore,
    windowTeam: wTeam,
    windowSize: windowResult.windowQuarters.length,
    gap: Math.round(gap*1000)/1000,
    score: (game.away?.alias||'?')+' '+(game.awayPoints||0)+'-'+(game.homePoints||0)+' '+(game.home?.alias||'?'),
  });

  // Cap log size
  if(cs.gapLog.length > 50) cs.gapLog = cs.gapLog.slice(-50);

  // Persist
  try{ localStorage.setItem('ncaamb:gap:'+gameId, JSON.stringify(cs.gapLog)); }catch(e){}
}

function computeAcceleration(gapLog){
  if(!gapLog||gapLog.length<1) return {accel:'TOO EARLY',entries:[],consecutive:0};

  // Filter to current window-size phase
  const currentSize = gapLog[gapLog.length-1].windowSize;
  const samePhase = gapLog.filter(e=>e.windowSize===currentSize);

  if(samePhase.length<2) return {accel:'TOO EARLY',entries:samePhase,consecutive:0};

  const recent = samePhase.slice(-4); // last 4 readings
  const deltas = [];
  for(let i=1;i<recent.length;i++) deltas.push(recent[i].gap - recent[i-1].gap);

  // Check if gap flipped sign
  const lastTwo = samePhase.slice(-2);
  if((lastTwo[0].gap>0.02 && lastTwo[1].gap<-0.02)||(lastTwo[0].gap<-0.02 && lastTwo[1].gap>0.02)){
    return {accel:'FLIPPED',entries:samePhase.slice(-5),consecutive:1};
  }

  // Count consecutive direction
  const threshold = 0.015;
  let growing=0, declining=0;
  for(let i=deltas.length-1;i>=0;i--){
    if(deltas[i]>threshold) growing++;
    else if(deltas[i]<-threshold) declining++;
    else break;
  }

  if(growing>=2) return {accel:'GROWING',entries:samePhase.slice(-5),consecutive:growing};
  if(declining>=2) return {accel:'DECLINING',entries:samePhase.slice(-5),consecutive:declining};

  // Check if phase just started (only 2-3 entries)
  if(samePhase.length<=3 && samePhase.length>=2 && gapLog.length>samePhase.length){
    return {accel:'NEW_PHASE',entries:samePhase,consecutive:0};
  }

  return {accel:'STABLE',entries:samePhase.slice(-5),consecutive:0};
}

// ── Sub-Metric Arrows ────────────────────────────────────────────────────────
function computeSubMetricArrows(gameId){
  const cs = cardState[gameId]; if(!cs) return null;
  const qs = cs.quarterSnapshots; if(!qs) return null;

  // Get ordered quarter numbers with data
  const qNums = Object.keys(qs.quarters).map(Number).sort((a,b)=>a-b);
  if(qNums.length<2) return null;

  const metrics = [
    {key:'paint', field:'points_in_the_paint', label:'Paint pts', indicator:'I2', threshold:3, structural:true},
    {key:'atRim', field:'field_goals_at_rim_att', label:'At-rim att', indicator:'I2', threshold:2, structural:true},
    {key:'fta', field:'free_throws_att', label:'FTA', indicator:'I2', threshold:2, structural:true},
    {key:'steals', field:'steals', label:'Steals', indicator:'I1', threshold:1, structural:true},
    {key:'tos', field:'turnovers', label:'TOs', indicator:'I1', threshold:1, structural:false}, // lower is better
    {key:'fg3aShare', field:'fg3a_share', label:'3PA%', indicator:'I3', threshold:5, structural:false}, // lower = less variance
    {key:'astRatio', field:'assist_ratio', label:'Ast ratio', indicator:'I3', threshold:8, structural:true},
    {key:'poss', field:'possessions', label:'Poss', indicator:'I5', threshold:2, structural:true},
  ];

  function computeArrow(values, threshold){
    const valid = values.filter(v=>v!=null);
    if(valid.length<2) return {arrow:null, values};
    const last3 = valid.slice(-3);
    if(last3.length<2) return {arrow:null, values:last3};
    const first=last3[0], last=last3[last3.length-1];
    const diff=last-first;
    // Monotonically rising
    let rising=true,falling=true;
    for(let i=1;i<last3.length;i++){
      if(last3[i]<last3[i-1]) rising=false;
      if(last3[i]>last3[i-1]) falling=false;
    }
    if(rising && diff>threshold) return {arrow:'RISING', values:last3};
    if(falling && Math.abs(diff)>threshold) return {arrow:'FALLING', values:last3};
    // Non-monotonic but directional
    if(last3.length>=3){
      if(last3[1]>first+threshold && last>first+threshold) return {arrow:'RISING', values:last3};
      if(last3[1]<first-threshold && last<first-threshold) return {arrow:'FALLING', values:last3};
    }
    return {arrow:'FLAT', values:last3};
  }

  const result = {home:{}, away:{}};
  ['home','away'].forEach(side=>{
    metrics.forEach(m=>{
      const vals = qNums.map(q=>qs.quarters[q]?.[side]?.[m.field]??null);
      const {arrow,values} = computeArrow(vals, m.threshold);
      const display = arrow ? (arrow==='RISING'?'▲':arrow==='FALLING'?'▼':'▬') : '—';
      const valStr = values.map(v=>v!=null?(m.field.includes('share')||m.field.includes('ratio')?v.toFixed(0)+'%':String(Math.round(v))):'?').join('→');
      result[side][m.key] = {arrow, values, display:display+' ('+valStr+')', label:m.label, indicator:m.indicator, structural:m.structural};
    });
  });

  return result;
}

function classifyAdjustment(arrows, controlTeam, hA, aA){
  if(!arrows) return {signal:'NO DATA',note:'Arrows unavailable'};
  const side = controlTeam===hA?'home':'away';
  const a = arrows[side];
  const risingStructural = ['paint','atRim','fta','steals'].filter(k=>a[k]?.arrow==='RISING').length;
  const fallingVariance = ['fg3aShare','tos'].filter(k=>a[k]?.arrow==='FALLING').length;
  const fallingStructural = ['paint','atRim','fta'].filter(k=>a[k]?.arrow==='FALLING').length;
  const risingVariance = ['fg3aShare','tos'].filter(k=>a[k]?.arrow==='RISING').length;

  if(risingStructural>=2 && fallingVariance>=1)
    return {signal:'INTERIOR PIVOT',note:'Progressive rim pressure replacing perimeter variance',risingStructural,fallingVariance,team:controlTeam};
  if(fallingStructural>=2)
    return {signal:'STRUCTURAL EROSION',note:'Interior game fading — structural edge at risk',fallingStructural,team:controlTeam};
  if(risingVariance>=1 && fallingStructural>=1)
    return {signal:'VARIANCE SHIFT',note:'Shifting to perimeter — production becoming less durable',risingVariance,fallingStructural,team:controlTeam};
  if(risingStructural>=2)
    return {signal:'STRUCTURAL ACCEL',note:'Multiple structural inputs compounding',risingStructural,team:controlTeam};
  return {signal:'NO ADJUSTMENT',note:'Shot diet stable',team:controlTeam};
}

// ── Combined Read Classification ─────────────────────────────────────────────
function classifyCombinedRead(floorScore, floorTeam, windowResult, accelResult){
  if(!windowResult||!windowResult.available) return {read:'TOO EARLY', note:'Window not yet available'};
  const wScore = windowResult.score;
  const wTeam = windowResult.controlTeam;
  const accel = accelResult?.accel||'STABLE';

  // If different teams control floor vs window
  if(floorTeam !== wTeam){
    if(accel==='FLIPPED') return {read:'FLIPPED', note:wTeam+' taking control from '+floorTeam};
    return {read:'SHIFT', note:'Floor: '+floorTeam+' / Window: '+wTeam+' — control contested'};
  }

  // Same team controls both
  if(floorScore>=0.75 && wScore>=0.80 && (accel==='GROWING'||accel==='STABLE'))
    return {read:'DOMINANT', note:'Structural edge compounding'};
  if(floorScore>=0.75 && wScore>=0.75)
    return {read:'STRONG', note:'Structural edge holding'};
  if(floorScore>=0.75 && wScore>=0.60 && wScore<0.75 && (accel==='DECLINING'||accel==='STABLE'))
    return {read:'ERODING', note:'Structure holds but momentum lost'};
  if(floorScore>=0.75 && wScore<0.60)
    return {read:'COLLAPSING', note:'Structural edge breaking down'};
  if(floorScore>=0.60 && floorScore<0.75 && wScore>=0.75 && accel==='GROWING')
    return {read:'EMERGING', note:'Edge strengthening toward confirmation'};
  if(floorScore>=0.60 && floorScore<0.75 && wScore>=0.60)
    return {read:'EARNED', note:'Modest edge, steady'};
  if(floorScore>=0.60 && floorScore<0.75 && wScore<0.60)
    return {read:'FADING', note:'Edge was real but dissipating'};
  if(floorScore<0.60 && wScore>=0.65 && accel==='GROWING')
    return {read:'SHIFT', note:'No cumulative edge but recent control emerging'};
  return {read:'NO EDGE', note:'Insufficient signal'};
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPUTE DISPATCH — routes to SR or BDL compute path
// ══════════════════════════════════════════════════════════════════════════════
function computeAny(game){
  // BDL builds SR-shaped summary via buildSummaryFromBDL — same compute() path works for both
  return compute(game);
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPUTE INDICATORS (BDL FORMAT) — Option B: separate path
// ══════════════════════════════════════════════════════════════════════════════
function computeBDL(game){
  const d = game.bdlData;
  if(!d || getState(game)==='PRE') return null;
  const hs = d.home, as = d.away;
  const hA = hs.alias||'HOME', aA = as.alias||'AWAY';
  const hS = d.homePoints||0, aS = d.awayPoints||0;

  // I1 — Possession & Transition (no chaos layer — forced/unforced TOs unavailable)
  const hGen = (hs.steals||0)+(hs.offensive_rebounds||0)-(hs.turnovers||hs.total_turnovers||0);
  const aGen = (as.steals||0)+(as.offensive_rebounds||0)-(as.turnovers||as.total_turnovers||0);
  const hConv = (hs.fast_break_points||0)+(hs.points_off_turnovers||0)+(hs.second_chance_points||0);
  const aConv = (as.fast_break_points||0)+(as.points_off_turnovers||0)+(as.second_chance_points||0);
  const i1 = (hGen>aGen?1:hGen<aGen?-1:0)+(hConv>aConv?1:hConv<aConv?-1:0);
  const I1={score:i1>0?1:i1===0?.5:0, leader:i1>0?hA:i1<0?aA:'EVEN',
    detail:`${hA} ${hs.steals||0}stl ${hs.offensive_rebounds||0}or ${hs.turnovers||hs.total_turnovers||0}to | ${aA} ${as.steals||0}stl ${as.offensive_rebounds||0}or ${as.turnovers||as.total_turnovers||0}to | Conv:${hConv}–${aConv} [no chaos layer]`};

  // I2 — Interior Control (Sub-A: paint volume, Sub-B: rim efficiency — fallback to paint-only when no at-rim)
  var hPaint = hs.points_in_the_paint||0, aPaint = as.points_in_the_paint||0;
  // PBP at-rim fallback when paint delayed
  var _pbpBdl = cardState[game.id]?.pbpAudit;
  if(_pbpBdl){
    if(!hPaint && _pbpBdl.home?.rim?.made) hPaint = _pbpBdl.home.rim.made * 2;
    if(!aPaint && _pbpBdl.away?.rim?.made) aPaint = _pbpBdl.away.rim.made * 2;
  }
  const i2paintDiff = hPaint - aPaint;
  let i2subA = 0;
  if (i2paintDiff > 6) i2subA = 1;
  else if (i2paintDiff < -6) i2subA = -1;
  // Rim efficiency from PBP if available, otherwise Sub-B = 0
  const hRimM = _pbpBdl?.home?.rim?.made||hs.field_goals_at_rim_made||0;
  const hRimA = _pbpBdl?.home?.rim?.att||hs.field_goals_at_rim_att||0;
  const aRimM = _pbpBdl?.away?.rim?.made||as.field_goals_at_rim_made||0;
  const aRimA = _pbpBdl?.away?.rim?.att||as.field_goals_at_rim_att||0;
  const hRimPct = hRimA >= 6 ? hRimM/hRimA : null;
  const aRimPct = aRimA >= 6 ? aRimM/aRimA : null;
  let i2subB = 0;
  if (hRimPct != null && aRimPct != null) {
    if (hRimPct - aRimPct > 0.10) i2subB = 1;
    else if (aRimPct - hRimPct > 0.10) i2subB = -1;
  }
  const i2raw = i2subA + i2subB;
  const I2={score:i2raw>0?1:i2raw<0?0:.5, leader:i2raw>0?hA:i2raw<0?aA:'EVEN',
    detail:`Paint:${hPaint}\u2013${aPaint}(${i2paintDiff>0?'+':''}${i2paintDiff}) RimFG:${hRimPct!=null?(hRimPct*100).toFixed(1):'?'}%\u2013${aRimPct!=null?(aRimPct*100).toFixed(1):'?'}%${d.homeBonus?' '+hA+'\u2B24':''}${d.awayBonus?' '+aA+'\u2B24':''} | A:${i2subA>0?'+':''}${i2subA} B:${i2subB>0?'+':''}${i2subB}${hRimA<6&&aRimA<6?' [low rim vol]':''}`};

  // I3 — Shot Quality & Creation (full-game assist ratio only, no per-quarter trend)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const hEFG=(((hs.field_goals_made||0)+.5*(hs.three_points_made||0))/hFGA);
  const aEFG=(((as.field_goals_made||0)+.5*(as.three_points_made||0))/aFGA);
  const hAst=hs.assists||0, aAst=as.assists||0;
  const hFGM=hs.field_goals_made||1, aFGM=as.field_goals_made||1;
  const hAR=(hAst/hFGM)*100, aAR=(aAst/aFGM)*100;
  const i3=(hEFG>aEFG+.02?1:hEFG<aEFG-.02?-1:0)+(hAR>aAR+5?1:hAR<aAR-5?-1:0);
  const I3={score:i3>0?1:i3===0?.5:0, leader:i3>0?hA:i3<0?aA:'EVEN',
    detail:`eFG%:${(hEFG*100).toFixed(1)}–${(aEFG*100).toFixed(1)} AR:${hAR.toFixed(0)}–${aAR.toFixed(0)} AST:${hAst}–${aAst}`};

  // I4 — Lineup Integrity (score delta + quarters — no on_court, no per-Q plus/minus)
  const qDs = (d.quarters||[]).map(q=>(q.home_points||0)-(q.away_points||0));
  const trend = qDs.length>=2 ? qDs[qDs.length-1]-qDs[0] : 0;
  // No biggest_lead from BDL — use score differential as proxy
  const scoreDiff = Math.abs(hS-aS);
  const i4 = (scoreDiff>8&&hS>aS?1:scoreDiff>8&&aS>hS?-1:0)+(trend>2?1:trend<-2?-1:0);
  const I4={score:i4>0?1:i4===0?.5:0, leader:i4>0?hA:i4<0?aA:'EVEN',
    detail:`Δ:${hS>aS?'+':''}${hS-aS} trend:${trend>0?'+':''}${trend} ${qDs.map((dd,i)=>'H'+(i+1)+':'+(dd>0?'+':'')+dd).join(' ')} [no lineup/bench split]`};

  // I5 — Tempo & Efficiency (derived from BDL offensive/defensive rating)
  const hOPPP = (hs.offensive_rating||0)/100, aOPPP = (as.offensive_rating||0)/100;
  const hDPPP = (hs.defensive_rating||0)/100, aDPPP = (as.defensive_rating||0)/100;
  const effD = (hOPPP-aDPPP)-(aOPPP-hDPPP);
  const hPoss = hs.possessions||0, aPoss = as.possessions||0;
  const I5={score:effD>0.08?1:effD<-0.08?0:.5, leader:effD>0.08?hA:effD<-0.08?aA:'EVEN',
    detail:`ORtg:${(hs.offensive_rating||0).toFixed(1)}–${(as.offensive_rating||0).toFixed(1)} DRtg:${(hs.defensive_rating||0).toFixed(1)}–${(as.defensive_rating||0).toFixed(1)} Poss:${hPoss}–${aPoss}`};

  const raw = I1.score*W.I1 + I2.score*W.I2 + I3.score*W.I3 + I4.score*W.I4 + I5.score*W.I5;
  const controlHome = raw>=.5, cTeam = controlHome?hA:aA, score = controlHome?raw:1-raw;

  // Trajectory — BDL partial (T4 and T7 unavailable)
  const traj = buildTrajectoryBDL(game, hA, aA, hs, as, hS, aS, qDs, d);

  return {I1,I2,I3,I4,I5, score, controlTeam:cTeam, dataQuality:'PARTIAL', traj};
}

function buildTrajectoryBDL(game, hA, aA, hs, as, hS, aS, qDs, d){
  const p = game.period||0;
  if(p<2) return {signals:[], lean:'NEUTRAL', count:0, total:0, tooEarly:true};
  const sigs = [], overall=hS-aS, currQ=qDs.length>0?qDs[qDs.length-1]:null;

  // T1 — BDL: no per-player live shooting available, use conversion fallback
  const bl = cardState[game.id]?.baselines;
  const hC=(hs.fast_break_points||0)+(hs.points_off_turnovers||0), aC=(as.fast_break_points||0)+(as.points_off_turnovers||0);
  if(Math.abs(hC-aC)>=10){const w=hC>aC?hA:aA;sigs.push({key:'T1*',w:1,team:w,color:'#ffd166',text:w+' conversion +'+(Math.abs(hC-aC))+' (FBP+POT) [BDL]'});}
  else sigs.push({key:'T1*',w:0,team:null,color:'#3e3e48',text:'Conversion flat ('+hC+'–'+aC+') [BDL]'});

  // T2 — BDL: no per-player live stats for star process check
  sigs.push({key:'T2*',w:0,team:null,color:'#555',text:'⊘ Unavailable (BDL — no per-player live stats)'});

  // T3 — Half Delta (NCAAMB halves, threshold scaled)
  if(currQ!=null&&Math.abs(currQ)>=10){const w=currQ>0?hA:aA,tr=(currQ>0&&overall<0)||(currQ<0&&overall>0);sigs.push({key:'T3',w:2,team:w,color:'#00ff88',text:w+' winning H'+p+' by '+Math.abs(currQ)+(tr?' (trailing—comeback)':'')});}
  else sigs.push({key:'T3',w:0,team:null,color:'#3e3e48',text:'H delta <10 — neutral'});

  // T4 — UNAVAILABLE in BDL (no per-player per-quarter fouls)
  sigs.push({key:'T4',w:0,team:null,color:'#555',text:'⊘ Unavailable (BDL — no per-player fouls)'});

  // T5 — Interior Trend (paint points available)
  const hPaint=hs.points_in_the_paint||0, aPaint=as.points_in_the_paint||0;
  if(Math.abs(hPaint-aPaint)>=8){const w=hPaint>aPaint?hA:aA;sigs.push({key:'T5',w:1,team:w,color:'#a8ff78',text:w+' paint +'+(Math.abs(hPaint-aPaint))+' ('+hPaint+'–'+aPaint+')'});}
  else sigs.push({key:'T5',w:0,team:null,color:'#3e3e48',text:'Paint even ('+hPaint+'–'+aPaint+')'});

  // T6 — Assist Ratio (full-game only, no per-quarter)
  const hFGM=hs.field_goals_made||1,aFGM=as.field_goals_made||1;
  const hAR=(hs.assists||0)/hFGM*100, aAR=(as.assists||0)/aFGM*100;
  if(Math.abs(hAR-aAR)>=15){const w=hAR>aAR?hA:aA;sigs.push({key:'T6',w:1,team:w,color:'#a8ff78',text:w+' AR '+Math.max(hAR,aAR).toFixed(0)+'% vs '+Math.min(hAR,aAR).toFixed(0)+'%'});}
  else sigs.push({key:'T6',w:0,team:null,color:'#3e3e48',text:'AR even ('+hAR.toFixed(0)+'% vs '+aAR.toFixed(0)+'%)'});

  // T7 — UNAVAILABLE in BDL (no on_court flags)
  sigs.push({key:'T7',w:0,team:null,color:'#555',text:'⊘ Unavailable (BDL — no lineup data)'});

  // T8 — Shot Diet (team-specific thresholds when baselines available)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const h3r=(hs.three_points_att||0)/hFGA*100, a3r=(as.three_points_att||0)/aFGA*100;
  const struct = cardState[game.id]?.structural;
  let hThr=40, aThr=40;
  if(bl && bl.built){
    hThr = (bl.teamSeason3PARate?.home||35) + (struct?.shotDiet?.home==='INTERIOR'?8:struct?.shotDiet?.home==='PERIMETER'?12:10);
    aThr = (bl.teamSeason3PARate?.away||35) + (struct?.shotDiet?.away==='INTERIOR'?8:struct?.shotDiet?.away==='PERIMETER'?12:10);
  }
  if(h3r>=hThr)sigs.push({key:'T8',w:1,team:aA,color:'#ff6b6b',text:hA+' 3PA/FGA '+h3r.toFixed(0)+'% vs '+hThr.toFixed(0)+'% threshold — MISALIGNED'});
  else if(a3r>=aThr)sigs.push({key:'T8',w:1,team:hA,color:'#ff6b6b',text:aA+' 3PA/FGA '+a3r.toFixed(0)+'% vs '+aThr.toFixed(0)+'% threshold — MISALIGNED'});
  else sigs.push({key:'T8',w:0,team:null,color:'#3e3e48',text:'Diet aligned ('+hA+' '+h3r.toFixed(0)+'% / '+aA+' '+a3r.toFixed(0)+'%)'});

  const lm={};sigs.forEach(s=>{if(s.team&&s.w>0)lm[s.team]=(lm[s.team]||0)+s.w;});
  const sorted=Object.entries(lm).sort((a,b)=>b[1]-a[1]),lean=sorted.length>0?sorted[0][0]:'NEUTRAL';
  const count=sigs.filter(s=>s.team===lean&&s.w>0).length,total=sigs.filter(s=>s.w>0).length;
  return {signals:sigs, lean, count, total, tooEarly:false};
}

// ══════════════════════════════════════════════════════════════════════════════
// STRUCTURAL ALERT — client-side, no Sonnet dependency
// Fires when structurally dominant team is trailing within a buyable range
// ══════════════════════════════════════════════════════════════════════════════
function checkStructuralAlert(game){
  var cs = cardState[game.id]; if(!cs) return;
  if(getState(game) !== 'LIVE') return;
  var p = game.period || 0;
  if(p < 2) return; // too early

  var floor = getFloor(cs);
  var win = cs.pbpWindow || cs.rollingWindow;
  if(!floor || !floor.score) return;

  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hS = game.homePoints || game.summary?.home?.points || 0;
  var aS = game.awayPoints || game.summary?.away?.points || 0;
  var fTeam = floor.controlTeam;
  var fScore = floor.score;

  // ── COMPOUND TRIGGER ──
  // 1. Floor must show real control
  if(fScore < 0.60) return;

  // 2. Control team must be trailing
  var ctrlIsHome = fTeam === hA;
  var ctrlPts = ctrlIsHome ? hS : aS;
  var oppPts = ctrlIsHome ? aS : hS;
  var deficit = oppPts - ctrlPts;
  if(deficit < 4) return;  // not meaningfully trailing
  if(deficit > 18) return; // garbage time

  // 3. Window agreement (if available)
  var wTeam = win && win.available ? win.controlTeam : null;
  var wScore = win && win.available ? win.score : null;
  var windowAgreement = wTeam === fTeam;
  var gap = (win && win.available && windowAgreement) ? (wScore - fScore) : 0;

  // 4. Determine alert level
  var level = null;
  if(windowAgreement && gap > 0.05 && fScore >= 0.70) level = 'STRONG';
  else if(windowAgreement && gap > 0 && fScore >= 0.65) level = 'MODERATE';
  else if(fScore >= 0.60 && (!win || !win.available || windowAgreement)) level = 'WATCH';
  else if(!windowAgreement && win && win.available) return; // floor/window disagree — skip

  if(!level) return;

  // 5. Hysteresis — 5 min cooldown per game per level
  if(!cs._structAlert) cs._structAlert = {};
  var cooldown = 5 * 60 * 1000; // 5 minutes
  var lastFire = cs._structAlert[level];
  if(lastFire && (Date.now() - lastFire) < cooldown) return;

  // ── BUILD ALERT ──
  var clock = game.clock || '';
  var qClock = 'H' + p + (clock ? ' ' + clock : '');
  var score = aA + ' ' + aS + '-' + hS + ' ' + hA;

  // Spread info
  var spreadStr = '';
  var od = cs.oddsData || cachedOdds?.[game.id];
  if(od){
    var sp = ctrlIsHome ? od.homeSpread : od.awaySpread;
    if(sp != null) spreadStr = fTeam + ' ' + (sp > 0 ? '+' : '') + sp;
  }

  // Sustainability of leading team
  var sustStr = '';
  var sust = cs.clientSustainability;
  var _sa = cs.sustainabilityAudit;
  var _sustSource = sust || _sa;
  if(_sustSource){
    var leadSide = ctrlIsHome ? 'away' : 'home';
    var leadSust = _sustSource[leadSide];
    if(leadSust && leadSust.tier) sustStr = 'Lead sust: ' + leadSust.tier;
  }

  // Gap acceleration
  var accelStr = '';
  var accel = cs.acceleration;
  if(accel && accel.accel) accelStr = 'Accel: ' + accel.accel;

  var title = 'STRUCTURAL ' + level + ' — ' + fTeam + ' trailing by ' + deficit;
  var body = score + ' ' + qClock
    + '\nFloor: ' + fTeam + ' ' + fScore.toFixed(2)
    + (wScore ? ' | Window: ' + (wTeam||'?') + ' ' + wScore.toFixed(2) + ' (gap ' + (gap>=0?'+':'') + gap.toFixed(2) + ')' : '')
    + (spreadStr ? '\nSpread: ' + spreadStr : '')
    + (sustStr ? ' | ' + sustStr : '')
    + (accelStr ? ' | ' + accelStr : '');

  var priority = level === 'STRONG' ? 5 : level === 'MODERATE' ? 4 : 3;

  // Fire
  cs._structAlert[level] = Date.now();
  showAlert('entry', fTeam + ' structural ' + level + ' — trailing ' + deficit + ' ' + qClock);
  sendNtfyRaw(title, body, priority);
  console.log('%c🔔 STRUCTURAL ALERT: ' + title, 'color:#f5a62a;font-weight:bold');
  console.log(body);
}

function renderPills(){
