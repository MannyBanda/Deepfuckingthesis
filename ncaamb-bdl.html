// FINGERPRINT (meaningful change detection)
// ══════════════════════════════════════════════════════════════════════════════
function fingerprint(summary){
  if(!summary) return '';
  const h = summary.home?.statistics||{}, a = summary.away?.statistics||{};
  return [
    summary.home?.points, summary.away?.points,
    summary.quarter || (summary.periods||[]).length,
    h.turnovers||h.total_turnovers, a.turnovers||a.total_turnovers,
    h.steals, a.steals,
    h.offensive_rebounds, a.offensive_rebounds,
    h.points_in_the_paint||h.points_in_paint, a.points_in_the_paint||a.points_in_paint,
    h.free_throws_att, a.free_throws_att,
    h.blocks, a.blocks,
    h.field_goals_made, a.field_goals_made,
    h.assists, a.assists,
    summary.home?.bonus?1:0, summary.away?.bonus?1:0,
    h.foulouts||0, a.foulouts||0,
    summary.lead_changes||0,
    h.most_unanswered?.points||0, a.most_unanswered?.points||0,
  ].join('|');
}

        } : null,
        clutchData: clutchPayload,
        oddsData: cs.oddsData || null,
        edgeHistory: cs.edgeHistory.length > 0 ? cs.edgeHistory : null,
        analysisHistory: cs.analysisHistory && cs.analysisHistory.length > 0 ? cs.analysisHistory : null,
        trackingData: cs.trackingData || null,
        pbpAudit: cs.pbpAudit ? {home:cs.pbpAudit.home, away:cs.pbpAudit.away, homeAlias:cs.pbpAudit.homeAlias, awayAlias:cs.pbpAudit.awayAlias, runs:cs.pbpAudit.runs, pbpPeriod:cs.pbpPeriod, pbpAge:cs.pbpTime?Math.round((Date.now()-cs.pbpTime.getTime())/60000):null} : null,
        rollingWindow: cs.rollingWindow ? (function(rw){
          var slim = {available:rw.available, score:rw.score, controlTeam:rw.controlTeam, windowQuarters:rw.windowQuarters, windowPossessions:rw.windowPossessions, dataQuality:rw.dataQuality, missingFields:rw.missingFields, possessionBased:rw.possessionBased, timeSpanMin:rw.timeSpanMin, pace:rw.pace, hPPP:rw.hPPP, aPPP:rw.aPPP};
          if(rw.I1) slim.I1=rw.I1; if(rw.I2) slim.I2=rw.I2; if(rw.I3) slim.I3=rw.I3; if(rw.I4) slim.I4=rw.I4; if(rw.I5) slim.I5=rw.I5;
          if(rw.enrichSummary) slim.enrichSummary=rw.enrichSummary;
          return slim;
        })(cs.rollingWindow) : null,
        quarterDiffs: cs._serverQuarterDiffs || null,
        acceleration: cs.acceleration || null,
        subMetricArrows: cs.subMetricArrows || null,
        adjustment: cs.adjustment || null,
        combinedRead: cs.combinedRead || null,
        throughput: cs.throughput ? {
          classification: cs.throughput.classification,
          deficit: cs.throughput.deficit,
          conservative: Math.round(cs.throughput.conservative.totalSwing),
          expected: Math.round(cs.throughput.expected.totalSwing),
          optimistic: Math.round(cs.throughput.optimistic.totalSwing),
          remainingPoss: cs.throughput.remainingPoss,
          structEdge: cs.throughput.structEdge,
          ctrlStructRate: cs.throughput.ctrlStructRate,
          oppStructRate: cs.throughput.oppStructRate,
          degradation: cs.throughput.degradation,
          fTeam: cs.throughput.fTeam,
        } : null,
        leadSafety: cs.leadSafety ? {
          classification: cs.leadSafety.classification,
          lead: cs.leadSafety.lead,
          conservative: Math.round(cs.leadSafety.conservative.totalSwing),
          expected: Math.round(cs.leadSafety.expected.totalSwing),
          optimistic: Math.round(cs.leadSafety.optimistic.totalSwing),
          remainingPoss: cs.leadSafety.remainingPoss,
          structEdge: cs.leadSafety.structEdge,
          fTeam: cs.leadSafety.fTeam,
          oppTeam: cs.leadSafety.oppTeam,
        } : null,
        projection: cs.projection ? {
          projectedMargin: cs.projection.projectedMargin,
          projTeam: cs.projection.projTeam,
          homeWinProb: cs.projection.homeWinProb,
          awayWinProb: cs.projection.awayWinProb,
          remainingPoss: cs.projection.remainingPoss,
          minsLeft: cs.projection.minsLeft,
          netEfficiency: cs.projection.netEfficiency,
          hPPP: cs.projection.hPPP,
          aPPP: cs.projection.aPPP,
          garbageTime: cs.projection.garbageTime,
        } : null,
        calibration: formatCalibrationForPrompt() || null,
        leagueContext: {
          league: 'ncaamb',
          periodType: 'half',
          periodCount: 2,
          periodMinutes: 20,
          foulLimit: 5,
          shotClock: 30,
          noClutchData: true,
          noDepthChart: true,
          noSplits: true,
          noDailyInjuries: true,
          noTrackingData: true,
          hasNetRankings: true,
        },
      })
    });
    clearTimeout(_acTimer);
    if(!resp.ok){
      const errData = await resp.json().catch(()=>({error:'HTTP '+resp.status}));
      throw new Error(errData.error || 'Analysis failed: '+resp.status);
    }
    const data = await resp.json();
    cs.analysis = data.analysis;
    cs.analysisUsage = data.usage;
    cs.sustainabilityAudit = data.sustainabilityAudit || null;
    cs.leadComposition = data.leadComposition || null;
    cs.analysisTime = new Date();

    // Parse structural indicators
    const hAlias = game.home?.alias||'HOME', aAlias = game.away?.alias||'AWAY';
    const parsed = parseSonnetScores(data.analysis, hAlias, aAlias);
    if(parsed){
      cs.sonnetIndicators = parsed;
      // Snapshot client indicators at analysis time — divergence compares future client reads against THIS baseline
      cs.clientIndAtAnalysis = computeAny(game);
      // ── FLOOR ENFORCEMENT — SIA guarantees minimum score ──
      if(cs.floorScores && parsed.controlTeam){
        const ctUp = parsed.controlTeam.toUpperCase();
        const isHome = ctUp === hAlias.toUpperCase() || ctUp.includes(hAlias.toUpperCase().substring(0,3));
        const floor = isHome ? cs.floorScores.home : cs.floorScores.away;
        if(floor && parsed.score < floor.floor){
          console.log('FLOOR OVERRIDE (live): ' + parsed.controlTeam + ' ' + parsed.score.toFixed(3) + ' → ' + floor.floor.toFixed(3) + ' (SIA floor)');
          parsed.score = floor.floor;
        }
      }
      console.log('Sonnet scores parsed:', parsed.controlTeam, parsed.score.toFixed(2));
    }

    // Parse decision/predictive layer
    const decision = parseSonnetDecision(data.analysis);
    if(decision){
      // ── SONNET FWP — game-state-aware win probability ──
      // Sonnet outputs labeled two-sided FWP: "MEM 72% / LAC 28%"
      let homeFWP = 50, awayFWP = 50;
      if(decision.fwpLabeled && decision.fwpTeam1 && decision.fwpTeam2){
        const hUp = hAlias.toUpperCase(), aUp = aAlias.toUpperCase();
        const t1Up = decision.fwpTeam1, t2Up = decision.fwpTeam2;
        var _v1 = decision.fwpVal1 ?? 50, _v2 = decision.fwpVal2 ?? 50;
        if(t1Up === hUp || t1Up.startsWith(hUp.substring(0,3)) || hUp.startsWith(t1Up.substring(0,3))){
          homeFWP = _v1; awayFWP = _v2;
        } else if(t2Up === hUp || t2Up.startsWith(hUp.substring(0,3)) || hUp.startsWith(t2Up.substring(0,3))){
          homeFWP = _v2; awayFWP = _v1;
        } else if(t1Up === aUp || t1Up.startsWith(aUp.substring(0,3)) || aUp.startsWith(t1Up.substring(0,3))){
          awayFWP = _v1; homeFWP = _v2;
        } else {
          awayFWP = _v1; homeFWP = _v2;
          console.warn('FWP: Could not match teams '+t1Up+'/'+t2Up+' to '+hUp+'/'+aUp+' — using positional');
        }
        console.log('FWP (labeled): '+hAlias+' '+homeFWP.toFixed(1)+'% / '+aAlias+' '+awayFWP.toFixed(1)+'%');
      } else if(decision.fwpSingleTeam){
        const fwpVal = decision.fwpSingleVal ?? 50;
        const fwpTeamUp = decision.fwpSingleTeam;
        const hUp = hAlias.toUpperCase(), aUp = aAlias.toUpperCase();
        if(fwpTeamUp === hUp || fwpTeamUp.startsWith(hUp.substring(0,3)) || hUp.startsWith(fwpTeamUp.substring(0,3))){
          homeFWP = fwpVal; awayFWP = 100 - fwpVal;
        } else {
          awayFWP = fwpVal; homeFWP = 100 - fwpVal;
        }
        console.log('FWP (single-labeled): '+hAlias+' '+homeFWP.toFixed(1)+'% / '+aAlias+' '+awayFWP.toFixed(1)+'%');
      } else {
        const ind = parsed || cs.clientIndicators || cs.sonnetIndicators;
        const ctrlTeam = ind?.controlTeam || '';
        const sonnetFwpRaw = (decision.fwp||'').replace(/[%\s]/g,'');
        const twoSided = deriveTwoSidedFWP(sonnetFwpRaw, ctrlTeam, hAlias);
        homeFWP = twoSided ? twoSided.homeFWP : 50;
        awayFWP = twoSided ? twoSided.awayFWP : 50;
        if(!twoSided) console.warn('FWP: Sonnet did not output parseable FWP — defaulting 50/50');
        else console.warn('FWP (UNLABELED FALLBACK): '+hAlias+' '+homeFWP.toFixed(1)+'% / '+aAlias+' '+awayFWP.toFixed(1)+'% — derived from control team '+ctrlTeam);
      }

      const od = cs.oddsData;
      if(od && (od.homeML || od.awayML)){
        const mlToProb = (ml) => { const n=parseFloat(ml); if(isNaN(n)||n===0) return null; return n<0?Math.abs(n)/(Math.abs(n)+100):100/(n+100); };
        // Garbage guard: dead lines produce meaningless MIP/edge
        const _absH = Math.abs(parseFloat(od.homeML) || 0), _absA = Math.abs(parseFloat(od.awayML) || 0);
        const _isGarbage = (_absH >= 50000 || _absA >= 50000) || (od.homeML === od.awayML && od.homeML != null);
        if(_isGarbage){
          var _aSprdG = od.homeSpread ? parseFloat(od.homeSpread)*-1 : null;
          var _aSprdGStr = _aSprdG!==null&&!isNaN(_aSprdG) ? (_aSprdG>0?'+':'')+_aSprdG : '—';
          decision.homeValue = {team:hAlias, fwp:homeFWP, mip:null, edge:null, ml:od.homeML||'—', spread:od.homeSpread||'—'};
          decision.awayValue = {team:aAlias, fwp:awayFWP, mip:null, edge:null, ml:od.awayML||'—', spread:_aSprdGStr};
          decision.edge = 'Line dead';
          decision.edgeNum = null;
          decision.mip = 'N/A';
          decision.garbageLine = true;
          console.log('FWP (Sonnet, line dead): '+hAlias+' '+homeFWP.toFixed(1)+'% '+aAlias+' '+awayFWP.toFixed(1)+'% — ML '+od.homeML+'/'+od.awayML);
        } else {
        const rawH = mlToProb(od.homeML), rawA = mlToProb(od.awayML);
        if(rawH!==null && rawA!==null){
          const vigSum = rawH + rawA;
          const homeMIP = rawH/vigSum*100, awayMIP = rawA/vigSum*100;
          decision.homeValue = {team:hAlias, fwp:homeFWP, mip:homeMIP, edge:parseFloat((homeFWP-homeMIP).toFixed(1)), ml:od.homeML||'—', spread:od.homeSpread||'—'};
          var _aSprd = od.homeSpread ? parseFloat(od.homeSpread)*-1 : null;
          var _aSprdStr = _aSprd!==null&&!isNaN(_aSprd) ? (_aSprd>0?'+':'')+_aSprd : '—';
          decision.awayValue = {team:aAlias, fwp:awayFWP, mip:awayMIP, edge:parseFloat((awayFWP-awayMIP).toFixed(1)), ml:od.awayML||'—', spread:_aSprdStr};
          const winnerMIP = homeFWP>=awayFWP ? homeMIP : awayMIP;
          const edge = Math.max(homeFWP,awayFWP) - winnerMIP;
          decision.edge = (edge>=0?'+':'')+edge.toFixed(1)+'%';
          decision.edgeNum = parseFloat(edge.toFixed(1));
          decision.mip = winnerMIP.toFixed(1)+'%';
          console.log('FWP (Sonnet): '+hAlias+' '+homeFWP.toFixed(1)+'%/'+homeMIP.toFixed(1)+'% '+aAlias+' '+awayFWP.toFixed(1)+'%/'+awayMIP.toFixed(1)+'%');
        }
        }
      } else {
        // No odds — set FWP values without edge
        decision.homeValue = {team:hAlias, fwp:homeFWP, mip:null, edge:null, ml:'—', spread:'—'};
        decision.awayValue = {team:aAlias, fwp:awayFWP, mip:null, edge:null, ml:'—', spread:'—'};
        decision.edge = 'No market data';
        decision.edgeNum = null;
        decision.mip = 'N/A';
        console.log('FWP (Sonnet, no odds): '+hAlias+' '+homeFWP.toFixed(1)+'% '+aAlias+' '+awayFWP.toFixed(1)+'%');
      }
      cs.prediction = decision;

      // ── PARSE SONNET SUSTAINABILITY INTO STRUCTURED FORMAT ──
      if(decision.sustainability && (!cs.clientSustainability || !cs.clientSustainability.home?.tier || !cs.clientSustainability.away?.tier)){
        var _sonnetSust = {home:{tier:null}, away:{tier:null}};
        var _sustStr = decision.sustainability;
        var _sustTiers = ['LOCKED IN','LOCKED','COLD','DURABLE','MIXED','FRAGILE','UNSUSTAINABLE','TOO EARLY'];
        _sustTiers.forEach(function(t){
          var hPat = new RegExp(hAlias+'[:\\s]+'+t,'i');
          var aPat = new RegExp(aAlias+'[:\\s]+'+t,'i');
          if(hPat.test(_sustStr)) _sonnetSust.home.tier = t;
          if(aPat.test(_sustStr)) _sonnetSust.away.tier = t;
        });
        if(_sonnetSust.home.tier || _sonnetSust.away.tier){
          cs.clientSustainability = _sonnetSust;
          console.log('[SUST] Parsed from Sonnet: '+hAlias+':'+(_sonnetSust.home.tier||'?')+' / '+aAlias+':'+(_sonnetSust.away.tier||'?'));
        }
      }

      // ── CONVICTION OVERRIDE — client score is authoritative, Sonnet can downgrade only ──
      if(parsed?.score && decision.conviction){
        const convictionRank = {'DOMINANT':4, 'STRONG':3, 'EARNED':2, 'CONDITIONAL':1, 'NO ENTRY':0};
        const scoreVerdict = getVerdict(parsed.score);
        // Map verdict labels to conviction labels (DOMINANT→DOMINANT, STRONG→STRONG, EARNED→EARNED, NO EDGE→CONDITIONAL, WAIT→NO ENTRY)
        const verdictToConviction = {'DOMINANT':'DOMINANT', 'STRONG':'STRONG', 'EARNED':'EARNED', 'NO EDGE':'CONDITIONAL', 'WAIT':'NO ENTRY'};
        const scoreConviction = verdictToConviction[scoreVerdict?.label] || 'CONDITIONAL';
        const scoreRank = convictionRank[scoreConviction] ?? 1;
        const sonnetRank = convictionRank[decision.conviction] ?? 1;
        // Sonnet can downgrade (qualitative caution) but not upgrade (arithmetic error)
        if(sonnetRank > scoreRank){
          console.log('CONVICTION OVERRIDE: Sonnet said ' + decision.conviction + ' but score ' + parsed.score.toFixed(2) + ' implies ' + scoreConviction + ' — using ' + scoreConviction);
          decision.conviction = scoreConviction;
          decision.convictionOverride = true;
        } else if(sonnetRank < scoreRank){
          console.log('CONVICTION DOWNGRADE (Sonnet caution): Score implies ' + scoreConviction + ' but Sonnet says ' + decision.conviction + ' — keeping Sonnet');
        }
      }
      console.log('Decision parsed:', decision.conviction, decision.entry, decision.prediction);
      // Track edge history for entry timing
      if(decision.edgeNum !== null || decision.fwp){
        cs.edgeHistory.push({
          time: new Date().toLocaleTimeString(),
          period: game.period||'?',
          edge: decision.edge||'?',
          edgeNum: decision.edgeNum,
          fwp: decision.fwp||'?',
          control: parsed?.controlTeam||'?',
          score: ((game.away?.alias||'AWAY')+' '+(game.awayPoints||0)+'-'+(game.home?.alias||'HOME')+' '+(game.homePoints||0)),
        });
        // Keep last 20 entries max
        if(cs.edgeHistory.length > 20) cs.edgeHistory = cs.edgeHistory.slice(-20);
      }

      // ── ANALYSIS HISTORY — structured narrative for Sonnet context ──
      const saSnap = cs.sustainabilityAudit;
      const cSustSnap = cs.clientSustainability;
      const hAliasFull = game.home?.alias||'HOME', aAliasFull = game.away?.alias||'AWAY';
      // Get sustainability tiers (prefer Sonnet audit, fall back to client)
      let leadAlias = (game.homePoints||0)>=(game.awayPoints||0)?hAliasFull:aAliasFull;
      let trailAlias = leadAlias===hAliasFull?aAliasFull:hAliasFull;
      let leadSustTier = saSnap?(leadAlias===hAliasFull?saSnap.home?.tier:saSnap.away?.tier):cSustSnap?(leadAlias===hAliasFull?cSustSnap.home?.tier:cSustSnap.away?.tier):null;
      let trailSustTier = saSnap?(trailAlias===hAliasFull?saSnap.home?.tier:saSnap.away?.tier):cSustSnap?(trailAlias===hAliasFull?cSustSnap.home?.tier:cSustSnap.away?.tier):null;
      if(!cs.analysisHistory) cs.analysisHistory = [];
      cs.analysisHistory.push({
        time: new Date().toLocaleTimeString(),
        period: game.period||'?',
        clock: game.clock||'',
        score: ((game.away?.alias||'AWAY')+' '+(game.awayPoints||0)+'-'+(game.home?.alias||'HOME')+' '+(game.homePoints||0)),
        controlTeam: parsed?.controlTeam||'?',
        controlScore: parsed?.score||0,
        verdict: getVerdict(parsed?.score)?.label||'?',
        entry: decision.entry||null,
        conviction: decision.conviction||null,
        signal: decision.signalType||null,
        buyTeam: decision.buyTeam||null,
        leadSust: leadSustTier||null,
        trailSust: trailSustTier||null,
        leadTeam: leadAlias,
        trailTeam: trailAlias,
        thesisStatus: decision.thesisStatus||null,
        keyRead: decision.prediction||'',
        fwp: decision.fwp||null,
        edge: decision.edge||null,
      });
      if(cs.analysisHistory.length > 15) cs.analysisHistory = cs.analysisHistory.slice(-15);
    }

    // ── PUSH NOTIFICATION — fire if entry conditions met ──
    if(decision) checkNtfyAlert(game, decision);

    // Save analysis snapshot to DB (includes full prediction + indicators for cross-device sync)
    if(dbReady && (parsed || decision)){
      var _predSafe = null;
      try{ _predSafe = decision ? JSON.stringify(decision) : null; }catch(e){}
      var _indSafe = null;
      try{ _indSafe = parsed ? JSON.stringify({I1:parsed.I1,I2:parsed.I2,I3:parsed.I3,I4:parsed.I4,I5:parsed.I5,score:parsed.score,controlTeam:parsed.controlTeam,traj:parsed.traj||null}) : null; }catch(e){}
      var _narrativeSafe = null;
      try{ _narrativeSafe = JSON.stringify({analysisHistory:cs.analysisHistory||[],edgeHistory:cs.edgeHistory||[]}); }catch(e){}
      var _aSnap = {
        game_id: game.id, period: game.period||0, clock: game.clock||'',
        control_team: parsed?.controlTeam||decision?.buyTeam||null, control_score: parsed?.score||null,
        fwp: decision?.fwp||null, edge: decision?.edge||null,
        entry: decision?.entry||null, conviction: decision?.conviction||null,
        signal: decision?.signalType||null,
        sustainability: (decision?.sustainability||'').substring(0,200),
        lead_source: decision?.leadSource||null,
        raw_text: (data.analysis||'').substring(0,8000),
        prediction_json: _predSafe,
        indicators_json: _indSafe,
        narrative_json: _narrativeSafe,
        trigger: 'manual',
        home_pts: game.home_points||game.home?.points||null,
        away_pts: game.away_points||game.away?.points||null,
      };
      fetch(FN+'db-api?action=save_analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(_aSnap)}).catch(function(){});
    }

    persistAnalysis(game.id, cs);
    renderCard(game);
    renderConfidenceTable();
  }catch(e){
    cs.analysisError = e.message;
    console.error('Analysis error:', e);
    renderCard(game);
  }finally{
    cs.analyzing = false;
  }
}

// Clutch data save handler
function saveClutch(gameId){
  const cs = cardState[gameId]; if(!cs) return;
  const g = id => document.getElementById(id)?.value?.trim();
  const hNet = parseFloat(g('cl-h-net-'+gameId));
  const hOff = parseFloat(g('cl-h-off-'+gameId));
  const hDef = parseFloat(g('cl-h-def-'+gameId));
  const hGP = g('cl-h-gp-'+gameId)||'';
  const hWL = g('cl-h-wl-'+gameId)||'';
  const aNet = parseFloat(g('cl-a-net-'+gameId));
  const aOff = parseFloat(g('cl-a-off-'+gameId));
  const aDef = parseFloat(g('cl-a-def-'+gameId));
  const aGP = g('cl-a-gp-'+gameId)||'';
  const aWL = g('cl-a-wl-'+gameId)||'';
  if(isNaN(hNet) && isNaN(aNet)){cs.clutchData=null; cs.clutchTier=3;} else {
    // Preserve enriched OCR fields if they exist
    const prevH = cs.clutchData?.home || {};
    const prevA = cs.clutchData?.away || {};
    cs.clutchData = {
      tier: 1,
      home: {netRtg:hNet||null, offRtg:hOff||null, defRtg:hDef||null, gp:hGP, wl:hWL,
        efg:prevH.efg, ts:prevH.ts, pace:prevH.pace, pie:prevH.pie, tovPct:prevH.tovPct, orebPct:prevH.orebPct, drebPct:prevH.drebPct, astRatio:prevH.astRatio},
      away: {netRtg:aNet||null, offRtg:aOff||null, defRtg:aDef||null, gp:aGP, wl:aWL,
        efg:prevA.efg, ts:prevA.ts, pace:prevA.pace, pie:prevA.pie, tovPct:prevA.tovPct, orebPct:prevA.orebPct, drebPct:prevA.drebPct, astRatio:prevA.astRatio},
    };
    cs.clutchTier = 1;
  }
  persistClutch(gameId, cs);
  const game = games.find(g=>g.id===gameId);
  if(game) renderCard(game);
}

// Odds data save handler
function oddsMovement(cs){
  if(!cs.oddsHistory || cs.oddsHistory.length===0 || !cs.oddsData) return null;
  const open = cs.oddsHistory[0], cur = cs.oddsData;
  function delta(curV, openV){
    const c=parseFloat(curV), o=parseFloat(openV);
    if(isNaN(c)||isNaN(o)) return null;
    const d = c - o;
    if(Math.abs(d)<0.1) return {val:'—',color:'var(--t2)',raw:0};
    const sign = d>0?'+':'';
    return {val:sign+d.toFixed(1), color:d>0?'var(--green)':'var(--red)', raw:d};
  }
  return {
    spread: delta(cur.homeSpread, open.homeSpread),
    homeML: delta(cur.homeML, open.homeML),
    awayML: delta(cur.awayML, open.awayML),
    total: delta(cur.total, open.total),
    pulls: cs.oddsHistory.length + 1,
    openTime: open.time || '?',
  };
}

function saveOdds(gameId){
  const cs = cardState[gameId]; if(!cs) return;
  const g = id => document.getElementById(id)?.value?.trim();
  const hSpread = g('od-hs-'+gameId)||'';
  const hML = g('od-hml-'+gameId)||'';
  const aML = g('od-aml-'+gameId)||'';
  const total = g('od-tot-'+gameId)||'';
  if(!hML && !hSpread){cs.oddsData=null;} else {
    cs.oddsData = {homeSpread:hSpread, homeML:hML, awayML:aML, total:total};
    if(!cs.openingOdds) cs.openingOdds = {...cs.oddsData};
  }
  persistOdds(gameId, cs);
  const game = games.find(g=>g.id===gameId);
  if(game) renderCard(game);
}

// Evidence View toggle
function toggleEV(gameId){
  const cs = cardState[gameId]; if(!cs) return;
  cs.evCollapsed = !cs.evCollapsed;
  const body = document.getElementById('ev-body-'+gameId);
  const toggle = document.getElementById('ev-toggle-'+gameId);
  if(body){ if(cs.evCollapsed){body.classList.add('collapsed');} else {body.classList.remove('collapsed');} }
  if(toggle){ if(cs.evCollapsed){toggle.classList.remove('open');} else {toggle.classList.add('open');} }
}

// Generic section collapse toggle
function toggleSec(gameId, key){
  const cs = cardState[gameId]; if(!cs) return;
  if(!cs._sec) cs._sec = {};
  cs._sec[key] = !_secOpen(cs, key);
  if(key === 'thesis') cs._thesisUserToggled = true;
  const game = games.find(g=>g.id===gameId);
  if(game) renderCard(game);
}
function _secOpen(cs, key){ return !(cs._sec && cs._sec[key] === false); }

// BDL Enrichment — auto-pull clutch + odds + tracking via bdl-enrich function
async function enrichFromBDL(gameId){
  const cs = cardState[gameId]; if(!cs) return;
  const game = games.find(g=>g.id===gameId); if(!game) return;
  const hA = game.home?.alias||'', aA = game.away?.alias||'';
  if(!hA||!aA) return;

  cs.enriching = true;
  renderCard(game);

  try{
    const bdlGid = bdlGameMap[gameId] || null;
    const resp = await fetch(FN+'bdl-enrich',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        homeTeam: hA,
        awayTeam: aA,
        bdlGameId: bdlGid,
        season: 2025,
        league: 'ncaamb',
        pulls: ['odds'], // NCAAMB: no clutch or tracking via BDL
      })
    });
    if(!resp.ok) throw new Error('BDL enrich failed: '+resp.status);
    const data = await resp.json();

    // Populate clutch (Tier 2 — season-wide). Only overwrite if user hasn't set L15 (Tier 1)
    if(data.clutch){
      if(!cs.clutchData || cs.clutchData.tier !== 1){
        cs.clutchData = data.clutch;
        cs.clutchTier = 2;
        persistClutch(gameId, cs);
      }
    }

    // Populate odds — always update and track movement
    if(data.odds){
      const newOdds = {
        homeSpread: String(data.odds.homeSpread||''),
        homeML: String(data.odds.homeML||''),
        awayML: String(data.odds.awayML||''),
        total: String(data.odds.total||''),
        vendor: data.odds.vendor,
        time: new Date().toLocaleTimeString(),
      };
      // Track movement if previous odds exist
      if(cs.oddsData && cs.oddsData.homeML){
        cs.oddsHistory.push({...cs.oddsData, time: cs.oddsData.time || cs.lastUp?.toLocaleTimeString() || '?'});
        if(cs.oddsHistory.length > 20) cs.oddsHistory = cs.oddsHistory.slice(-20);
      }
      cs.oddsData = newOdds;
      if(!cs.openingOdds) cs.openingOdds = {...newOdds};
      if(data.oddsAll) cs.oddsAll = data.oddsAll;
      persistOdds(gameId, cs);
    }

    // Store tracking data for sustainability scoring
    if(data.tracking){ cs.trackingData = data.tracking; persistTracking(gameId, cs); }

    const srcList = (data.sources||[]).join(', ');
    const errList = (data.errors||[]);
    addLog(gameId, '⚡ BDL enriched: '+srcList+(errList.length?' ⚠ '+errList.length+' errors':''), errList.length===0);
    if(errList.length) console.warn('BDL enrich partial errors:', errList);
    cs.enrichDone = true;
    cs.enrichTime = new Date();
    setTimeout(()=>{ cs.enrichDone = false; const g = games.find(x=>x.id===gameId); if(g) renderCard(g); }, 10000);

  }catch(e){
    console.error('BDL enrich error:', e);
    addLog(gameId, 'BDL enrich failed: '+e.message, false);
  }finally{
    cs.enriching = false;
    renderCard(game);
  }
}

// FWP SOURCE: SONNET ONLY
// ══════════════════════════════════════════════════════════════════════════════
// FWP (Framework Win Probability) is produced by Sonnet's game-state-aware analysis.
// Sonnet can synthesize control score + score differential + time remaining + roster
// quality asymmetry into a real win probability. No client-side model can replicate this.
// Sonnet outputs a single FWP for the control team; opponent FWP = 100 - controlFWP.

// Helper: derive two-sided FWP from Sonnet's single control-team FWP output
function deriveTwoSidedFWP(sonnetFWP, controlTeam, homeAlias){
  const ctrlFWP = parseFloat(sonnetFWP);
  if(isNaN(ctrlFWP)) return null;
  const isHomeCtrl = (controlTeam||'').toUpperCase() === (homeAlias||'').toUpperCase();
  const homeFWP = isHomeCtrl ? ctrlFWP : 100 - ctrlFWP;
  const awayFWP = 100 - homeFWP;
  return {homeFWP, awayFWP};
}

function parsePBP(pbpData, game){
  const hId = game.home?.id||'', aId = game.away?.id||'';
  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const allEvents = [];
  const periods = pbpData?.periods || [];
  periods.forEach(per => { const q = per.number || per.sequence || 0; (per.events || []).forEach(ev => { ev._quarter = q; allEvents.push(ev); }); });

  // ── HELPERS (identical to NBA) ──
  function resolveTeam(ev, stat){ const attrId = ev.attribution?.id || stat?.team?.id || ''; if(attrId===hId) return hA; if(attrId===aId) return aA; return ev.attribution?.market||'?'; }
  function resolvePlayer(ev, stat){ const player = stat?.player || ev.player || {}; return player.full_name || player.name || '?'; }
  function classifyZone(ev, stat, isThree){
    const loc = ev.location||{}; const actionArea = (loc.action_area||ev.action_area||stat.action_area||'').toLowerCase();
    const coordX = loc.coord_x ?? ev.coord_x ?? null; const coordY = loc.coord_y ?? ev.coord_y ?? null;
    const shotDist = stat.shot_distance ?? ev.shot_distance ?? null;
    if(isThree){ if(actionArea.includes('corner') || (coordY!==null && (coordY<8||coordY>42))) return 'corner3'; return 'above3'; }
    if(shotDist!==null && shotDist<=4) return 'rim';
    const shotTypeRaw = (stat.shot_type_desc||stat.shot_type||ev.shot_type_desc||ev.shot_type||'').toLowerCase();
    const descRaw = (ev.description||'').toLowerCase();
    const isRimShot = actionArea.includes('restricted')||actionArea.includes('rim')
      ||shotTypeRaw.includes('layup')||shotTypeRaw.includes('dunk')||shotTypeRaw.includes('tip')
      ||shotTypeRaw.includes('putback')||shotTypeRaw.includes('put-back')||shotTypeRaw.includes('alley')
      ||shotTypeRaw.includes('finger roll')||shotTypeRaw.includes('reverse')
      ||descRaw.includes('layup')||descRaw.includes('dunk')||descRaw.includes('tip shot')||descRaw.includes('alley oop')
      ||(coordX!==null&&Math.abs(coordX-25)<5&&coordY!==null&&Math.abs(coordY-5.25)<5);
    if(isRimShot) return 'rim'; if(actionArea.includes('paint')||actionArea.includes('lane')) return 'paint'; return 'mid';
  }
  function classifyContext(stat, ev, assisted, isThree){
    const shotType = (stat.shot_type_desc||stat.shot_type||ev.shot_type_desc||ev.shot_type||'').toLowerCase();
    if(shotType.includes('driving')||shotType.includes('drive')||shotType.includes('layup')||shotType.includes('dunk')) return 'drive';
    if(shotType.includes('pullup')||shotType.includes('pull-up')||shotType.includes('pull up')||shotType.includes('step back')||shotType.includes('stepback')||shotType.includes('fadeaway')) return 'pullup';
    if(shotType.includes('putback')||shotType.includes('tip')||shotType.includes('put-back')) return 'putback';
    if(shotType.includes('cutting')||shotType.includes('cut')||shotType.includes('alley')) return 'cut';
    if(shotType.includes('fast')||shotType.includes('transition')||shotType.includes('break')) return 'transition';
    if(shotType.includes('hook')||shotType.includes('float')||shotType.includes('runner')) return 'floater';
    if(assisted&&isThree) return 'catch-shoot'; return 'halfcourt';
  }
  function classifyTO(stat, ev){
    const toType = (stat.turnover_type||ev.turnover_type||'').toLowerCase(); const desc = (ev.description||'').toLowerCase();
    if(toType.includes('steal')||toType.includes('forced')||toType.includes('bad pass')||desc.includes('steal')) return true;
    if(toType.includes('lost ball')||toType.includes('out of bounds')||toType.includes('travel')||toType.includes('violation')||toType.includes('offensive foul')||toType.includes('backcourt')||toType.includes('3 sec')||toType.includes('5 sec')||toType.includes('shot clock')) return false;
    if(desc.includes('steal')||desc.includes('strip')) return true;
    if(desc.includes('lost ball')||desc.includes('out of bounds')||desc.includes('travel')||desc.includes('violation')) return false;
    return null;
  }

  // ── SINGLE ENRICHED PASS ──
  const shots = [], turnovers = [], scoreLog = [], scoringEvents = [], timeline = [];
  let hScore = 0, aScore = 0;

  allEvents.forEach((ev, idx) => {
    if(ev.rescinded) return;
    const et = (ev.event_type||'').toLowerCase().replace(/[\s_-]/g,'');
    const stat = (ev.statistics||[])[0]||{};
    const team = resolveTeam(ev,stat); const player = resolvePlayer(ev,stat);
    const clock = ev.clock||null; const quarter = ev._quarter;
    const homeScore = ev.home_points??null; const awayScore = ev.away_points??null;
    const possTeamId = ev.possession?.id||'';
    const possTeam = possTeamId===hId?hA:possTeamId===aId?aA:null;
    const onCourt = {home:(ev.on_court?.home?.players||[]).map(p=>p.full_name||p.name||'?'), away:(ev.on_court?.away?.players||[]).map(p=>p.full_name||p.name||'?')};
    const enriched = {idx, type:'other', team, player, clock, quarter, homeScore, awayScore, possTeam, onCourt, shot:null, turnover:null, rebound:null, foul:null, freeThrow:null, block:null, steal:null};

    const isThree = et.includes('threepoint')||et.includes('3pt');
    const isTwo = et.includes('twopoint')||et.includes('2pt');
    if(isThree||isTwo){
      const made = et.includes('made'); const zone = classifyZone(ev,stat,isThree);
      const shotDist = stat.shot_distance??ev.shot_distance??null;
      let assisted = false;
      if(made){ const d=(ev.description||'').toLowerCase(); if(d.includes('assist')) assisted=true; (ev.statistics||[]).forEach(s=>{if((s.type||'').toLowerCase().includes('assist')) assisted=true;}); }
      const context = classifyContext(stat,ev,assisted,isThree);
      const pts = made?(isThree?3:2):0;
      enriched.type = made?'shot_made':'shot_miss';
      enriched.shot = {zone, made, assisted, is3:isThree, context, shotDistance:shotDist, points:pts};
      // Check for block embedded in shot statistics (NCAAMB doesn't emit standalone block events)
      if(!made){ (ev.statistics||[]).forEach(s=>{ var st=(s.type||'').toLowerCase(); if(st.includes('block')&&!st.includes('attempt')){ enriched.block={blocker:s.player?.full_name||s.player?.name||'?'}; } }); }
      if(!made && !enriched.block){ var desc=(ev.description||'').toLowerCase(); if(desc.includes('block')) enriched.block={blocker:'?'}; }
      shots.push({p:player, tm:team, z:zone, m:made, a:assisted, q:quarter, ctx:context, is3:isThree, x:ev.location?.coord_x??ev.coord_x??null, y:ev.location?.coord_y??ev.coord_y??null, d:shotDist});
      if(made){ if(team===hA) hScore+=pts; else aScore+=pts; scoreLog.push({team,pts,hScore,aScore,q:quarter,lineup:team===hA?onCourt.home:onCourt.away}); scoringEvents.push({tm:team,p:player,pts:pts,type:isThree?'3PT':'2PT',ck:clock,q:quarter,m:aScore-hScore}); }
    } else if(et.includes('turnover')){
      const forced = classifyTO(stat,ev);
      const toType = (stat.turnover_type||ev.turnover_type||'').toLowerCase()||(ev.description||'').substring(0,40).toLowerCase();
      enriched.type='turnover'; enriched.turnover={forced,type:toType};
      turnovers.push({p:player, tm:team, q:quarter, forced, type:toType});
    } else if(et.includes('freethrow')||(et.includes('free')&&et.includes('throw'))){
      const made = et.includes('made'); const ftType = stat.free_throw_type||ev.free_throw_type||''; const pts=made?1:0;
      enriched.type=made?'ft_made':'ft_miss'; enriched.freeThrow={made,ftType,points:pts};
      if(made){ if(team===hA) hScore+=pts; else aScore+=pts; scoreLog.push({team,pts,hScore,aScore,q:quarter,lineup:team===hA?onCourt.home:onCourt.away}); scoringEvents.push({tm:team,p:player,pts:1,type:'FT',ck:clock,q:quarter,m:aScore-hScore}); }
    } else if(et.includes('rebound')){
      const rebType=(stat.rebound_type||ev.rebound_type||'').toLowerCase();
      enriched.type='rebound'; enriched.rebound={type:rebType.includes('offensive')||rebType.includes('off')?'offensive':'defensive'};
    } else if(et.includes('steal')&&!et.includes('turnover')){
      enriched.type='steal'; enriched.steal={stealer:player};
    } else if(et.includes('block')&&!et.includes('attempt')){
      enriched.type='block'; enriched.block={blocker:player};
    } else if(et.includes('foul')){
      let foulType='personal'; if(et.includes('offensive')) foulType='offensive'; else if(et.includes('flagrant')) foulType='flagrant'; else if(et.includes('technical')) foulType='technical';
      enriched.type='foul'; enriched.foul={type:foulType, player};
      (ev.statistics||[]).forEach(s=>{if((s.type||'').toLowerCase().includes('fouldrawn')) enriched.foul.drawnBy=s.player?.full_name||s.player?.name||null;});
    }
    timeline.push(enriched);
  });

  // ── SCORING RUNS — store scoreLog indices for precise margin flow alignment ──
  const runs = [];
  let runTeam=null, runPts=0, runStart=0, runCount=0, runLineup=[], runShotTypes=[];
  for(let i=0;i<scoreLog.length;i++){
    const s=scoreLog[i];
    if(s.team===runTeam){ runPts+=s.pts; runCount++; if(s.lineup.length>0) runLineup=s.lineup; runShotTypes.push(s.pts===3?'3PT':s.pts===1?'FT':'2PT'); }
    else { if(runPts>=8||runCount>=3) runs.push({team:runTeam,pts:runPts,count:runCount,q:scoreLog[runStart]?.q,lineup:runLineup,mechanism:runShotTypes.slice(),si:runStart,ei:i-1}); runTeam=s.team; runPts=s.pts; runStart=i; runCount=1; runLineup=s.lineup; runShotTypes=[s.pts===3?'3PT':s.pts===1?'FT':'2PT']; }
  }
  if(runPts>=8||runCount>=3) runs.push({team:runTeam,pts:runPts,count:runCount,q:scoreLog[runStart]?.q,lineup:runLineup,mechanism:runShotTypes.slice(),si:runStart,ei:scoreLog.length-1});
  runs.sort((a,b)=>b.ei-a.ei); // most recent first

  // I5 runs — 6+ pts threshold
  const runs6=[];
  {let r6Tm=null,r6Pts=0;for(let i=0;i<scoreLog.length;i++){const s=scoreLog[i];if(s.team===r6Tm){r6Pts+=s.pts;}else{if(r6Pts>=6&&r6Tm)runs6.push({team:r6Tm,pts:r6Pts});r6Tm=s.team;r6Pts=s.pts;}}if(r6Pts>=6&&r6Tm)runs6.push({team:r6Tm,pts:r6Pts});}

  // ── AGGREGATE SUMMARIES (unchanged) ──
  function teamShots(tm){ return shots.filter(s=>s.tm===tm); }
  function aggTeam(tm){
    const s=teamShots(tm); const threes=s.filter(x=>x.is3); const rim=s.filter(x=>x.z==='rim'); const paint=s.filter(x=>x.z==='paint'); const mid=s.filter(x=>x.z==='mid');
    const threeMade=threes.filter(x=>x.m); const rimMade=rim.filter(x=>x.m); const paintMade=paint.filter(x=>x.m); const midMade=mid.filter(x=>x.m);
    const assistedThrees=threeMade.filter(x=>x.a).length; const assistedRim=rimMade.filter(x=>x.m&&x.a).length;
    const playerThrees={}; threes.forEach(x=>{if(!playerThrees[x.p]) playerThrees[x.p]={name:x.p,made:0,att:0,assisted:0,zones:{corner3:0,above3:0},contexts:{}}; playerThrees[x.p].att++; if(x.m){playerThrees[x.p].made++;if(x.a) playerThrees[x.p].assisted++;playerThrees[x.p].zones[x.z]=(playerThrees[x.p].zones[x.z]||0)+1;} playerThrees[x.p].contexts[x.ctx]=(playerThrees[x.p].contexts[x.ctx]||0)+1;});
    const playerRim={}; rim.forEach(x=>{if(!playerRim[x.p]) playerRim[x.p]={name:x.p,made:0,att:0,contexts:{}}; playerRim[x.p].att++; if(x.m) playerRim[x.p].made++; playerRim[x.p].contexts[x.ctx]=(playerRim[x.p].contexts[x.ctx]||0)+1;});
    const playerMid={}; mid.forEach(x=>{if(!playerMid[x.p]) playerMid[x.p]={name:x.p,made:0,att:0,assisted:0}; playerMid[x.p].att++; if(x.m){playerMid[x.p].made++;if(x.a) playerMid[x.p].assisted++;}});
    const tms=turnovers.filter(t=>t.tm===tm); const forced=tms.filter(t=>t.forced===true).length; const unforced=tms.filter(t=>t.forced===false).length; const unknown=tms.filter(t=>t.forced===null).length;
    return {
      threes:{made:threeMade.length,att:threes.length,assisted:assistedThrees,pct:threes.length>0?(threeMade.length/threes.length*100).toFixed(1):'0',corner:{made:threeMade.filter(x=>x.z==='corner3').length,att:threes.filter(x=>x.z==='corner3').length},above:{made:threeMade.filter(x=>x.z==='above3').length,att:threes.filter(x=>x.z==='above3').length},byPlayer:Object.values(playerThrees).filter(x=>x.att>=1).sort((a,b)=>b.att-a.att)},
      rim:{made:rimMade.length,att:rim.length,assisted:assistedRim,pct:rim.length>0?(rimMade.length/rim.length*100).toFixed(1):'0',byPlayer:Object.values(playerRim).filter(x=>x.att>=1).sort((a,b)=>b.att-a.att)},
      paint:{made:paintMade.length,att:paint.length,pct:paint.length>0?(paintMade.length/paint.length*100).toFixed(1):'0'},
      mid:{made:midMade.length,att:mid.length,assisted:midMade.filter(x=>x.a).length,pct:mid.length>0?(midMade.length/mid.length*100).toFixed(1):'0',byPlayer:Object.values(playerMid).filter(x=>x.att>=1).sort((a,b)=>b.att-a.att)},
      tos:{total:tms.length,forced,unforced,unknown,byPlayer:tms},
      shotDiet:{total:s.length,threePct:s.length>0?(threes.length/s.length*100).toFixed(1):'0',rimPct:s.length>0?(rim.length/s.length*100).toFixed(1):'0',midPct:s.length>0?(mid.length/s.length*100).toFixed(1):'0'},
    };
  }
  const home = aggTeam(hA), away = aggTeam(aA);

  // ── SYNTHETIC QUARTERS (NCAAMB: split 20-min halves at 10:00 mark) ──
  const syntheticQuarters = [];
  try {
    const scored = []; let runH = 0, runA = 0;
    allEvents.forEach(ev => {
      const clockStr = ev.clock || ev.game_clock || '';
      const cParts = clockStr.split(':');
      const clockMin = (parseInt(cParts[0])||0) + (parseInt(cParts[1])||0)/60;
      const et = (ev.event_type||'').toLowerCase().replace(/[\s_-]/g,'');
      let pts = 0;
      if(et.includes('made')){
        if(et.includes('threepoint') || et.includes('3pt')) pts = 3;
        else if(et.includes('freethrow') || et.includes('ft')) pts = 1;
        else if(et.includes('twopoint') || et.includes('2pt')) pts = 2;
      }
      if(pts === 0) return;
      const attrId = ev.attribution?.id || (ev.statistics||[])[0]?.team?.id || '';
      const team = attrId === hId ? 'home' : attrId === aId ? 'away' : '?';
      if(team === 'home') runH += pts; else if(team === 'away') runA += pts;
      const hCum = ev.home_points != null ? ev.home_points : runH;
      const aCum = ev.away_points != null ? ev.away_points : runA;
      scored.push({period: ev._quarter || 0, clockMin, hCum, aCum});
    });
    if(scored.length > 0){
      function synQ(period, clockMin){ if(period === 1) return clockMin >= 10 ? 0 : 1; if(period === 2) return clockMin >= 10 ? 2 : 3; return 3; }
      const byBucket = [[],[],[],[]];
      scored.slice().sort((a,b) => { if(a.period !== b.period) return a.period - b.period; return b.clockMin - a.clockMin; })
        .forEach(ev => byBucket[synQ(ev.period, ev.clockMin)].push(ev));

    }
  } catch(e) { console.warn('[SYNQ] Synthetic quarter build failed:', e.message); }

  // ── BUILD POSSESSION LOG ──
  const possessionLog = buildPossessionLog(timeline, hA, aA);
  console.log('[PBP] Enriched parse: '+timeline.length+' events, '+shots.length+' shots, '+turnovers.length+' TOs, '+possessionLog.length+' possessions');

  return {
    home, away, homeAlias:hA, awayAlias:aA,
    totalShots: shots.length, totalTOs: turnovers.length,
    runs: runs,
    runs6: runs6,
    syntheticQuarters: syntheticQuarters.length >= 2 ? syntheticQuarters : null,
    scoringEvents: scoringEvents,
    raw: {shots, turnovers},
    possessionLog: possessionLog,
    timeline: timeline,
  };
}

// BDL STATUS / CLOCK NORMALIZERS (NCAAMB)
// ══════════════════════════════════════════════════════════════════════════════
function normalizeBdlStatus(s, gameInfo){
  if(!s) return 'scheduled';
  var sl = s.toLowerCase();
  if(sl==='post'||sl==='final') return 'closed';
  if(sl==='in'||sl==='in progress'||sl.includes('half')||sl.includes('overtime')||sl.includes(' ot')||sl==='ot'||/^\d*\s*ot/i.test(sl)) return 'inprogress';
  if(sl==='halftime') return 'halftime';
  if(sl==='pre') return 'scheduled';
  // Datetime string — check game info for live signals
  if(s.includes('T')&&s.includes(':')){
    if(gameInfo){
      var hasScore = ((gameInfo.home_team_score||gameInfo.home_score||0) + (gameInfo.visitor_team_score||gameInfo.away_score||0)) > 0;
      var hasPeriod = (gameInfo.period||0) > 0;
      var hasPeriodDetail = gameInfo.period_detail && gameInfo.period_detail !== '' && !gameInfo.period_detail.includes('T');
      var hasHalfScore = (gameInfo.home_score_h1||0) > 0 || (gameInfo.away_score_h1||0) > 0;
      if(hasScore || hasPeriod || hasPeriodDetail || hasHalfScore) return 'inprogress';
    }
    try{ var _tipMs = new Date(s).getTime(); if(!isNaN(_tipMs) && Date.now() > _tipMs + 120000) return 'inprogress'; }catch(e){}
    return 'scheduled';
  }
  return s;
}
// BDL NCAAMB: clock embedded in period_detail ("9:09 - 2nd Half" or "Halftime" or "Final")
function parseBdlPeriodDetail(pd){
  if(!pd) return {clock:'',period:0,label:''};
  var m = pd.match(/^(\d{1,2}:\d{2})\s*-\s*(.+)$/);
  if(m){
    var ck = m[1], label = m[2].trim().toLowerCase();
    var p = 0;
    if(label.includes('1st')) p = 1;
    else if(label.includes('2nd')) p = 2;
    else if(label.includes('ot')||label.includes('overtime')) p = 3;
    return {clock:ck, period:p, label:m[2].trim()};
  }
  if(pd.toLowerCase().includes('halftime')) return {clock:'00:00',period:1,label:'Halftime'};
  if(pd.toLowerCase().includes('final')) return {clock:'00:00',period:2,label:'Final'};
  return {clock:'',period:0,label:pd};
}

function _bdlExtractPlayer(t){if(!t)return'?';var c=t.replace(/\n/g,' ').trim();var m=c.match(/^([A-Z][a-zA-Z'.]+(?:[\s-][A-Z][a-zA-Z'.]+)*(?:\s+(?:Jr\.|Sr\.|III|II|IV))?)\s+(?:makes|misses|personal|shooting|loose|bad|offensive|defensive|lost|out|traveling|turnover|flagrant|double|blocks|steals|enters|steps|kicked)/i);if(m)return m[1].trim();var m2=c.match(/^(.+?)\s+(?:makes|misses|personal|shooting|offensive|defensive|bad|loose|lost|blocks|steals)/i);if(m2)return m2[1].trim();return c.split(/\s+/).slice(0,2).join(' ');}

function parseBDLPBP(plays,homeAbbr,awayAbbr,playerTeamMap){

        var ftM=type.match(/(\d+)\s*of\s*(\d+)/i);if(ftM&&ftM[1]===ftM[2]&&isMade){pendOREB=null;pendPOT=null;}

// ── buildSummaryFromBDL (NCAAMB) ──
// Builds SR-shaped summary from: gameInfo (from games list) + playerStats + teamStats + pbpResult
function buildSummaryFromBDL(gameInfo, playerStats, teamStatsArr, pbpResult){
  var bdl = pbpResult?._bdl || {};
  var hTeam = gameInfo.home_team || {}, aTeam = gameInfo.visitor_team || {};
  var hA = hTeam.abbreviation || 'HOME', aA = aTeam.abbreviation || 'AWAY';

  // Group players by team
  var homePlayers = [], awayPlayers = [];
  (playerStats || []).forEach(function(p){
    var ab = p.team?.abbreviation || '';
    if(ab === hA) homePlayers.push(p);
    else if(ab === aA) awayPlayers.push(p);
  });

  // Build team stats from team_stats endpoint (pre-aggregated) or sum from players
  function buildTeamStats(tStats, players, side){
    var s = {};
    if(tStats){
      s.field_goals_made=tStats.fgm||0; s.field_goals_att=tStats.fga||0;
      s.three_points_made=tStats.fg3m||0; s.three_points_att=tStats.fg3a||0;
      s.free_throws_made=tStats.ftm||0; s.free_throws_att=tStats.fta||0;
      s.offensive_rebounds=tStats.oreb||0; s.defensive_rebounds=tStats.dreb||0; s.rebounds=tStats.reb||0;
      s.assists=tStats.ast||0; s.steals=tStats.stl||0; s.blocks=tStats.blk||0;
      s.turnovers=tStats.turnovers||0; s.total_turnovers=tStats.turnovers||0;
      s.personal_fouls=tStats.fouls||0;
      s.field_goals_pct=tStats.fg_pct||0; s.three_points_pct=tStats.fg3_pct||0; s.free_throws_pct=tStats.ft_pct||0;
    } else {
      // Fallback: sum from player stats
      s.field_goals_made=0;s.field_goals_att=0;s.three_points_made=0;s.three_points_att=0;s.free_throws_made=0;s.free_throws_att=0;s.offensive_rebounds=0;s.defensive_rebounds=0;s.rebounds=0;s.assists=0;s.steals=0;s.blocks=0;s.turnovers=0;s.personal_fouls=0;
      players.forEach(function(p){s.field_goals_made+=p.fgm||0;s.field_goals_att+=p.fga||0;s.three_points_made+=p.fg3m||0;s.three_points_att+=p.fg3a||0;s.free_throws_made+=p.ftm||0;s.free_throws_att+=p.fta||0;s.offensive_rebounds+=p.oreb||0;s.defensive_rebounds+=p.dreb||0;s.rebounds+=p.reb||0;s.assists+=p.ast||0;s.steals+=p.stl||0;s.blocks+=p.blk||0;s.turnovers+=p.turnover||0;s.personal_fouls+=p.pf||0;});
      s.total_turnovers=s.turnovers;
      var fga=s.field_goals_att||1;
      s.field_goals_pct=+(s.field_goals_made/fga*100).toFixed(1);s.three_points_pct=s.three_points_att>0?+(s.three_points_made/s.three_points_att*100).toFixed(1):0;s.free_throws_pct=s.free_throws_att>0?+(s.free_throws_made/s.free_throws_att*100).toFixed(1):0;
    }
    // Computed fields
    s.points = side==='home' ? (gameInfo.home_score||0) : (gameInfo.away_score||0);
    s.two_points_made=s.field_goals_made-s.three_points_made; s.two_points_att=s.field_goals_att-s.three_points_att;

// POSSESSION LOG BUILDER — segments enriched timeline into possession objects
// ══════════════════════════════════════════════════════════════════════════════
function buildPossessionLog(timeline, hA, aA){

  var enrichSummary='Scoring rate: '+hA+' '+hSR+'% / '+aA+' '+aSR+'%\n';

  enrichSummary+='Results '+hA+': 2pt='+hResults.made_2pt+' 3pt='+hResults.made_3pt+' FT='+hResults.made_ft+' miss='+hResults.miss+' TO='+hResults.turnover+'\n';
  enrichSummary+='Results '+aA+': 2pt='+aResults.made_2pt+' 3pt='+aResults.made_3pt+' FT='+aResults.made_ft+' miss='+aResults.miss+' TO='+aResults.turnover+'\n';
  if(repeatedVictims.length>0){enrichSummary+='TO VICTIMS: ';repeatedVictims.forEach(function(v){enrichSummary+=v.player+'('+v.team+') '+v.count+'x ';});enrichSummary+='\n';}
  if(foulTrouble.length>0){enrichSummary+='FOUL TROUBLE: ';foulTrouble.forEach(function(f){enrichSummary+=f.player+'('+f.team+') '+f.count+'f ';});enrichSummary+='\n';}
  if(lineupRatings.length>0){enrichSummary+='LINEUP NET RTG: ';lineupRatings.slice(0,3).forEach(function(lu){enrichSummary+=lu.team+' ['+lu.players.join('/')+'] '+(lu.netRtg>=0?'+':'')+lu.netRtg.toFixed(0)+'/100('+lu.poss+'p) ';});enrichSummary+='\n';}

  return {
    available:true, windowQuarters:['P'+windowSize], windowPossessions:windowSize,
    home:{points:hPts,fga:hFGA,fgm:hFGM,three_att:h3PA,three_made:h3PM,fta:hFTA,assists:hAst,turnovers:hTO,steals:hStl,blocks:hBlk,oreb:hOreb,fouls:hFouls,paintTouch:hPaintT,possCount:hP.length},
    away:{points:aPts,fga:aFGA,fgm:aFGM,three_att:a3PA,three_made:a3PM,fta:aFTA,assists:aAst,turnovers:aTO,steals:aStl,blocks:aBlk,oreb:aOreb,fouls:aFouls,paintTouch:aPaintT,possCount:aP.length},
    I1:wI1, I2:wI2, I3:wI3, I4:wI4, I5:wI5,
    score:score, controlTeam:controlTeam,
    dataQuality:'PBP', missingFields:[], possessionBased:true,
    timeSpanMin:timeSpanMin, pace:pace, hPPP:hPPP, aPPP:aPPP,
    _raw:{hTO:hTO,aTO:aTO,hStl:hStl,aStl:aStl,hOreb:hOreb,aOreb:aOreb,hTrans:hTrans,aTrans:aTrans,
      hFTA:hFTA,aFTA:aFTA,hBlk:hBlk,aBlk:aBlk,hPaintT:hPaintT,aPaintT:aPaintT,hRimS:hRimS,aRimS:aRimS,hFouls:hFouls,aFouls:aFouls,
      hFGM:hFGM,aFGM:aFGM,hFGA:hFGA,aFGA:aFGA,h3PM:h3PM,a3PM:a3PM,h3PA:h3PA,a3PA:a3PA,hAst:hAst,aAst:aAst,
      hPts:hPts,aPts:aPts,hLineups:hLineups,aLineups:aLineups,hEFG:hEFG,aEFG:aEFG,hAR:hAR,aAR:aAR},
    possResults:{home:hResults,away:aResults}, scoringRate:{home:hSR,away:aSR},
    paintTouchRate:{home:hPaintRate,away:aPaintRate}, repeatedVictims:repeatedVictims,
    foulTrouble:foulTrouble, lineupRatings:lineupRatings.slice(0,5),
    shotContexts:shotCtx, enrichSummary:enrichSummary,
  };
}


// ══════════════════════════════════════════════════════════════════════════════
// ENRICHED POSSESSION WINDOW — PBP exact + pro-rated box score (NCAAMB)
// ══════════════════════════════════════════════════════════════════════════════
function computePossessionWindowEnriched(game, windowSize){
  var base = computePossessionWindow(game, windowSize);
  if(!base || !base.available) return base;
  var s = game.summary;
  if(!s || !s.home || !s.away){ base.dataQuality='PBP_ONLY'; return base; }
  var H = s.home, A = s.away;
  var hs = H?.statistics||H||{}, as = A?.statistics||A||{};
  var cs = cardState[game.id];
  var totalPoss = cs.pbpAudit?.possessionLog?.length || windowSize;
  var frac = Math.min(1, windowSize / totalPoss);
  var r = base._raw; if(!r) return base;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';

  var hFBP = (hs.fast_break_points||0)*frac, aFBP = (as.fast_break_points||0)*frac;
  var hPOT = (hs.points_off_turnovers||0)*frac, aPOT = (as.points_off_turnovers||0)*frac;
  var hSCP = (hs.second_chance_points||0)*frac, aSCP = (as.second_chance_points||0)*frac;
  var hPaintPts = (hs.points_in_the_paint||hs.points_in_paint||0)*frac;
  var aPaintPts = (as.points_in_the_paint||as.points_in_paint||0)*frac;
  var hAtRim = (hs.field_goals_at_rim_att||0)*frac, aAtRim = (as.field_goals_at_rim_att||0)*frac;
  var hBench = (hs.bench_points||0)*frac, aBench = (as.bench_points||0)*frac;
  var hFD = (hs.fouls_drawn||0)*frac, aFD = (as.fouls_drawn||0)*frac;

  // I1: PBP generation + box score conversion
  var hGen = r.hStl + r.hOreb - r.hTO, aGen = r.aStl + r.aOreb - r.aTO;
  var hConv = hFBP + hPOT + hSCP, aConv = aFBP + aPOT + aSCP;
  var convAvail = hConv > 0 || aConv > 0;
  var i1 = (hGen>aGen?1:hGen<aGen?-1:0);
  if(convAvail) i1 += (hConv>aConv?1:hConv<aConv?-1:0);
  if(r.hTrans>0||r.aTrans>0) i1 += (r.hTrans>r.aTrans?1:r.hTrans<r.aTrans?-1:0);
  var eI1 = {score:i1>0?1:i1===0?.5:0, detail:'Gen:'+hGen+'\u2013'+aGen+(convAvail?' Conv:'+hConv.toFixed(0)+'\u2013'+aConv.toFixed(0):'')+' Stl:'+r.hStl+'\u2013'+r.aStl+' TO:'+r.hTO+'\u2013'+r.aTO};

  // I2: box score paint + PBP FTA/blocks
  var rim = (hPaintPts+r.hFTA+r.hBlk+hAtRim+Math.round(hFD*.5))-(aPaintPts+r.aFTA+r.aBlk+aAtRim+Math.round(aFD*.5));
  var eI2 = {score:rim>8?1:rim<-8?0:.5, detail:'Paint:'+hPaintPts.toFixed(0)+'\u2013'+aPaintPts.toFixed(0)+' FTA:'+r.hFTA+'\u2013'+r.aFTA+' BLK:'+r.hBlk+'\u2013'+r.aBlk+' AtRim:'+hAtRim.toFixed(0)+'\u2013'+aAtRim.toFixed(0)};

  var eI3 = base.I3;

  // I4: PBP window delta + box score bench
  var pDiff = r.hPts - r.aPts;
  var benchD = hBench - aBench;
  var i4 = (Math.abs(pDiff)>3?(pDiff>0?1:-1):0);
  if(hBench>0||aBench>0) i4 += (benchD>4?1:benchD<-4?-1:0);
  var luLabel = (r.hLineups>0||r.aLineups>0) ? r.hLineups+'\u2013'+r.aLineups : 'N/A';
  var eI4 = {score:i4>0?1:i4===0?.5:0, detail:'Window \u0394:'+(pDiff>0?'+':'')+pDiff+' Bench:'+hBench.toFixed(0)+'\u2013'+aBench.toFixed(0)+' LU:'+luLabel};

  var eI5 = base.I5;

  var W = {I1:.10, I2:.15, I3:.20, I4:.30, I5:.25};
  var raw = eI1.score*W.I1 + eI2.score*W.I2 + eI3.score*W.I3 + eI4.score*W.I4 + eI5.score*W.I5;
  var controlHome = raw >= 0.5, eScore = controlHome ? raw : 1 - raw;
  var eControlTeam = controlHome ? hA : aA;

  return {
    available:true, windowQuarters:base.windowQuarters, windowPossessions:windowSize,
    home:base.home, away:base.away,
    I1:eI1, I2:eI2, I3:eI3, I4:eI4, I5:eI5,
    score:eScore, controlTeam:eControlTeam,
    dataQuality:'PBP_ENRICHED', missingFields:[], possessionBased:true,
    timeSpanMin:base.timeSpanMin, pace:base.pace, hPPP:base.hPPP, aPPP:base.aPPP,
    enrichFrac:frac,
    possResults:base.possResults, scoringRate:base.scoringRate,
    paintTouchRate:base.paintTouchRate, repeatedVictims:base.repeatedVictims,
    foulTrouble:base.foulTrouble, lineupRatings:base.lineupRatings,
    shotContexts:base.shotContexts, enrichSummary:base.enrichSummary,
  };
}

// Convert any image (including HEIC) to compressed JPEG for Sonnet vision
function compressImage(file, maxW, quality){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');

      // Iterative compression: shrink until base64 < 600KB
      let targetW = Math.min(w, maxW);
      let q = quality;
      let b64, attempts = 0;
      while(attempts < 4){
        let cw = targetW, ch = Math.round(h * targetW / w);
        c.width = cw; c.height = ch;
        ctx.drawImage(img, 0, 0, cw, ch);
        let dataUrl = c.toDataURL('image/jpeg', q);
        b64 = dataUrl.split(',')[1];
        let sizeKB = Math.round(b64.length * 3 / 4 / 1024);
        console.log('Compress pass '+(attempts+1)+': '+cw+'x'+ch+' q='+q.toFixed(2)+' → '+sizeKB+'KB (b64: '+Math.round(b64.length/1024)+'KB)');
        if(b64.length <= 600000) break; // under ~450KB image = safe for Netlify
        // Reduce more aggressively each pass
        targetW = Math.round(targetW * 0.75);
        q = Math.max(0.35, q - 0.15);
        attempts++;
      }
      res({ base64: b64, mediaType: 'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image load failed — unsupported format?')); };
    img.src = url;
  });
}

async function handleClutchUpload(input){
  const file = input.files?.[0];
  if(!file) return;
  const status = document.getElementById('cu-status');
  const btn = document.getElementById('cu-btn');
  const badge = document.getElementById('cu-badge');
  const segment = document.getElementById('cu-segment')?.value || 'L15';

  status.textContent = '⏳ Processing...';
  status.className = 'cu-status';
  btn.classList.add('active');
  btn.textContent = '⏳ EXTRACTING...';
  btn.disabled = true;

  try{
    // Compress image client-side to avoid Netlify function timeout
    // iPhone screenshots can be 3-5MB; resize to max 1600px wide JPEG
    status.textContent = '⏳ Compressing...';
    const {base64, mediaType} = await compressImage(file, 1400, 0.72);

    // Collect team abbreviations from selected games only (not full slate)
    const activeTeams = [];
    const targetGames = selIds.length > 0 ? games.filter(g => selIds.includes(g.id)) : games;
    for(const g of targetGames){
      if(g.home?.alias) activeTeams.push(g.home.alias);
      if(g.away?.alias) activeTeams.push(g.away.alias);
    }

    // Send to clutch-ocr function with team filter
    // Batch into groups of 8 to avoid Netlify 26s function timeout on large slates
    const BATCH_SIZE = 8;
    var allExtracted = {};
    var totalUsage = {input:0, output:0};
    var batches = [];
    for(var bi=0; bi<activeTeams.length; bi+=BATCH_SIZE){
      batches.push(activeTeams.slice(bi, bi+BATCH_SIZE));
    }

    for(var batchIdx=0; batchIdx<batches.length; batchIdx++){
      var batchTeams = batches[batchIdx];
      var batchLabel = batches.length > 1 ? ' (batch '+(batchIdx+1)+'/'+batches.length+')' : '';
      const payload = JSON.stringify({ image: base64, mediaType, segment, teams: batchTeams });
      const payloadMB = (payload.length / 1024 / 1024).toFixed(1);
      console.log('Clutch OCR payload'+batchLabel+':', payloadMB+'MB, teams:', batchTeams.join(','));
      if(payload.length > 5500000){
        throw new Error('Image still too large after compression ('+payloadMB+'MB). Try cropping the screenshot to just the table area.');
      }
      status.textContent = '⏳ Extracting ' + batchTeams.length + ' teams'+batchLabel+' (~15s, '+payloadMB+'MB)...';
      const resp = await fetch(FN+'clutch-ocr',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: payload
      });

      if(!resp.ok){
        if(resp.status === 502) throw new Error('Server crashed processing image'+batchLabel+' ('+payloadMB+'MB). Try cropping to just the table.');
        if(resp.status === 504) throw new Error('Server timed out'+batchLabel+'. Try cropping the screenshot.');
        if(resp.status === 413) throw new Error('Image too large for server. Try a smaller screenshot.');
        const err = await resp.json().catch(()=>({error:resp.statusText}));
        throw new Error(err.error || 'OCR failed: '+resp.status);
      }

      const batchData = await resp.json();

      if(batchData.error){
        throw new Error(batchData.error + batchLabel + (batchData.rawText ? ' — raw: '+batchData.rawText.substring(0,100) : ''));
      }

      if(batchData.teams){
        Object.assign(allExtracted, batchData.teams);
      }
      if(batchData.usage){
        totalUsage.input += batchData.usage.input||0;
        totalUsage.output += batchData.usage.output||0;
      }
    }

    var data = {teams: allExtracted, segment: segment, teamCount: Object.keys(allExtracted).length, usage: totalUsage};

    if(!data.teams || Object.keys(data.teams).length === 0){
      throw new Error('No teams extracted from screenshot');
    }

    // Store globally — MERGE new teams into existing data (don't overwrite previous uploads)
    if(globalClutchData && globalClutchData.teams){
      var merged = Object.assign({}, globalClutchData.teams, data.teams);
      globalClutchData = {segment: data.segment || globalClutchData.segment, teams: merged, teamCount: Object.keys(merged).length};
    } else {
      globalClutchData = data;
    }
    try{ localStorage.setItem('ncaamb:globalClutch', JSON.stringify(globalClutchData)); }catch(e){ console.warn('GlobalClutch persist failed:', e.message); }
    const count = Object.keys(data.teams).length;
    const totalCount = Object.keys(globalClutchData.teams).length;
    const extractedList = Object.keys(data.teams).join(', ');

    // Distribute to all active game cards
    distributeClutchToCards();

    status.textContent = `✓ ${count} teams extracted` + (totalCount > count ? ` (${totalCount} total)` : '');
    status.className = 'cu-status ok';
    badge.style.display = 'inline-flex';
    badge.className = 'cu-badge';
    badge.textContent = `✓ ${segment} CLUTCH · ${totalCount} teams`;

    const tokens = data.usage ? `${data.usage.input||0}+${data.usage.output||0} tokens` : '';
    console.log('Clutch OCR complete:', count, 'teams:', extractedList, tokens, data.teams);

  }catch(e){
    console.error('Clutch upload error:', e);
    status.textContent = '✗ '+e.message;
    status.className = 'cu-status err';
  }finally{
    btn.classList.remove('active');
    btn.textContent = '📋 UPLOAD L15 CLUTCH';
    btn.disabled = false;
    // Reset file input so same file can be re-uploaded
    input.value = '';
  }
}

function distributeClutchToCards(){
  if(!globalClutchData?.teams) return;
  const teams = globalClutchData.teams;
  const extractedKeys = Object.keys(teams);
  let distributed = 0;

  const neededAliases = [];
  for(const game of games){
    if(game.home?.alias) neededAliases.push(game.home.alias);
    if(game.away?.alias) neededAliases.push(game.away.alias);
  }
  console.log('Clutch distribute: extracted=', extractedKeys, 'needed=', neededAliases, 
    'missing=', neededAliases.filter(a => !teams[a]));

  // Save ALL extracted teams directly to DB in one batch call
  if(dbReady){
    var dbTeams = extractedKeys.map(function(alias){
      var t = teams[alias];
      return {alias:alias, tier:1, netRtg:t.netRtg, offRtg:t.offRtg, defRtg:t.defRtg, wl:t.wl, efg:t.efg, pace:t.pace, pie:t.pie, source:'ocr', data:t};
    });
    if(dbTeams.length > 0){
      fetch(FN+'db-api?action=save_clutch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({league:'ncaamb',teams:dbTeams})}).catch(function(){});
      console.log('Clutch batch saved to DB:', dbTeams.length, 'teams');
    }
  }

  for(const game of games){
    const hA = game.home?.alias||'';
    const aA = game.away?.alias||'';
    const hClutch = teams[hA];
    const aClutch = teams[aA];

    if(hClutch || aClutch){
      var clutchObj = {
        tier: 1,
        home: hClutch ? {
          netRtg: hClutch.netRtg, offRtg: hClutch.offRtg, defRtg: hClutch.defRtg,
          gp: hClutch.gp, w: hClutch.w, l: hClutch.l,
          wl: hClutch.wl || (hClutch.w!=null&&hClutch.l!=null ? hClutch.w+'-'+hClutch.l : null),
          efg: hClutch.efg, ts: hClutch.ts, pace: hClutch.pace, pie: hClutch.pie,
          tovPct: hClutch.tovPct, orebPct: hClutch.orebPct, drebPct: hClutch.drebPct, astRatio: hClutch.astRatio,
        } : null,
        away: aClutch ? {
          netRtg: aClutch.netRtg, offRtg: aClutch.offRtg, defRtg: aClutch.defRtg,
          gp: aClutch.gp, w: aClutch.w, l: aClutch.l,
          wl: aClutch.wl || (aClutch.w!=null&&aClutch.l!=null ? aClutch.w+'-'+aClutch.l : null),
          efg: aClutch.efg, ts: aClutch.ts, pace: aClutch.pace, pie: aClutch.pie,
          tovPct: aClutch.tovPct, orebPct: aClutch.orebPct, drebPct: aClutch.drebPct, astRatio: aClutch.astRatio,
        } : null,
      };

      cachedClutch[game.id] = {data:clutchObj, tier:1};

      const cs = cardState[game.id];
      if(cs){
        if(!clutchObj.home && cs.clutchData?.home) clutchObj.home = cs.clutchData.home;
        if(!clutchObj.away && cs.clutchData?.away) clutchObj.away = cs.clutchData.away;
        cs.clutchData = clutchObj;
        cs.clutchTier = 1;
        addLog(game.id, `📋 L15 clutch loaded: ${hClutch?hA+' NetRtg '+hClutch.netRtg:''}${hClutch&&aClutch?' / ':''}${aClutch?aA+' NetRtg '+aClutch.netRtg:''}`, true);
      }
      distributed++;
    }
  }

  try{ localStorage.setItem('ncaamb:clutch', JSON.stringify(cachedClutch)); }catch(e){}
  console.log('Clutch distributed to', distributed, 'games (' + Object.keys(cachedClutch).length + ' cached)');

  // Re-render all visible cards
  for(const game of games){
    if(selIds.includes(game.id)){
      renderCard(game);
    }
  }
}

// Parse clutch proxy from thesis text — extracts Comeback Score + Lead-Keep Score as Tier 2
function parseThesisClutchProxy(thesis, homeAlias, awayAlias){
  if(!thesis) return null;
  try{
    // Look for Comeback Score patterns: "Comeback Score: 6.2" or "Comeback: X.X/10"
    const comebackMatch = thesis.match(/comeback\s*(?:score)?[:\s]+(\d+\.?\d*)\s*(?:\/\s*10)?/i);
    const leadKeepMatch = thesis.match(/lead[- ]?keep\s*(?:score)?[:\s]+(\d+\.?\d*)\s*(?:\/\s*10)?/i);
    // Also try to find per-team comeback/lead-keep
    const hComebackMatch = thesis.match(new RegExp(homeAlias+'[^\\n]*comeback[:\\s]+(\\d+\\.?\\d*)', 'i')) ||
                           thesis.match(new RegExp('comeback[^\\n]*'+homeAlias+'[:\\s]+(\\d+\\.?\\d*)', 'i'));
    const aComebackMatch = thesis.match(new RegExp(awayAlias+'[^\\n]*comeback[:\\s]+(\\d+\\.?\\d*)', 'i')) ||
                           thesis.match(new RegExp('comeback[^\\n]*'+awayAlias+'[:\\s]+(\\d+\\.?\\d*)', 'i'));
    const hLeadKeepMatch = thesis.match(new RegExp(homeAlias+'[^\\n]*lead[- ]?keep[:\\s]+(\\d+\\.?\\d*)', 'i')) ||
                           thesis.match(new RegExp('lead[- ]?keep[^\\n]*'+homeAlias+'[:\\s]+(\\d+\\.?\\d*)', 'i'));
    const aLeadKeepMatch = thesis.match(new RegExp(awayAlias+'[^\\n]*lead[- ]?keep[:\\s]+(\\d+\\.?\\d*)', 'i')) ||
                           thesis.match(new RegExp('lead[- ]?keep[^\\n]*'+awayAlias+'[:\\s]+(\\d+\\.?\\d*)', 'i'));

    const hComeback = hComebackMatch ? parseFloat(hComebackMatch[1]) : (comebackMatch ? parseFloat(comebackMatch[1]) : null);
    const aComeback = aComebackMatch ? parseFloat(aComebackMatch[1]) : null;
    const hLeadKeep = hLeadKeepMatch ? parseFloat(hLeadKeepMatch[1]) : (leadKeepMatch ? parseFloat(leadKeepMatch[1]) : null);
    const aLeadKeep = aLeadKeepMatch ? parseFloat(aLeadKeepMatch[1]) : null;

    // Need at least one value to be useful
    if(hComeback===null && aComeback===null && hLeadKeep===null && aLeadKeep===null) return null;

    // Convert to NetRtg proxy: (Comeback+LeadKeep)/2 mapped to clutch-like range
    // Score 7+ → positive NetRtg proxy, Score 5 → ~0, Score 3 → negative
    const toProxy = (cb, lk) => {
      if(cb===null && lk===null) return null;
      const avg = cb!==null && lk!==null ? (cb+lk)/2 : (cb||lk);
      return ((avg - 5) * 2).toFixed(1); // Maps 5→0, 7→+4, 3→-4
    };

    return {
      tier: 2,
      home: { netRtg: toProxy(hComeback, hLeadKeep), comebackScore: hComeback, leadKeepScore: hLeadKeep },
      away: { netRtg: toProxy(aComeback, aLeadKeep), comebackScore: aComeback, leadKeepScore: aLeadKeep },
    };
  }catch(e){
    console.warn('Thesis clutch proxy parse failed:', e.message);
    return null;
  }
}


function parseSonnetScores(text, homeAlias, awayAlias){
  if(!text) return null;
  try{
    const ind = {};
    const iMap = {
      'I1':{weight:0.10, nm:'DISRUPT/CONV'},
      'I2':{weight:0.15, nm:'INTERIOR'},
      'I3':{weight:0.20, nm:'SHOT QUALITY'},
      'I4':{weight:0.30, nm:'GAME CONTROL'},
      'I5':{weight:0.25, nm:'EXECUTION'},
    };
    for(const [key, meta] of Object.entries(iMap)){
      // Match any decimal score: "I1 Possession... : CLE 0.75 — explanation"
      const rx = new RegExp(key+'[^:]*:\\s*(\\S+)\\s+(\\d\\.\\d{1,2})\\s*[—–-]\\s*(.+)', 'i');
      const m = text.match(rx);
      if(m){
        const team = m[1].replace(/[^A-Za-z]/g,'').toUpperCase();
        const score = parseFloat(m[2]);
        const isHome = team === homeAlias.toUpperCase() || team.includes(homeAlias.toUpperCase().substring(0,3));
        // Flip score perspective: if away team named, invert
        const homeScore = isHome ? score : (1 - score);
        ind[key] = {
          score: homeScore,
          leader: m[1],
          detail: m[3].trim(),
          sonnet: true,
          rawScore: score, // original score as stated by Sonnet
        };
      }
    }
    if(Object.keys(ind).length < 3) return null;

    for(const key of Object.keys(iMap)){
      if(!ind[key]) ind[key] = {score:0.5, leader:'EVEN', detail:'(not parsed from Sonnet)', sonnet:false, rawScore:0.5};
    }

    const W = {I1:0.10, I2:0.15, I3:0.20, I4:0.30, I5:0.25};
    const raw = ind.I1.score*W.I1 + ind.I2.score*W.I2 + ind.I3.score*W.I3 + ind.I4.score*W.I4 + ind.I5.score*W.I5;
    const controlHome = raw >= 0.5;
    let score = controlHome ? raw : 1 - raw;
    let controlTeam = controlHome ? homeAlias : awayAlias;

    // Parse Sonnet's stated team attribution (which team controls) — trust the team, not the score
    const controlMatch = text.match(/CONTROL:\s*(\S+)\s+([\d.]+)\s*[—–-]/i);
    let sonnetStatedScore = null;
    if(controlMatch){
      const statedTeam = controlMatch[1];
      sonnetStatedScore = parseFloat(controlMatch[2]);
      if(sonnetStatedScore >= 0.4 && sonnetStatedScore <= 1.0){
        // Use Sonnet's team call — it knows which team it's analyzing for
        controlTeam = statedTeam;
      }
    }
    // Client-computed weighted sum is AUTHORITATIVE — Sonnet's stated score is divergence check
    if(sonnetStatedScore !== null && Math.abs(score - sonnetStatedScore) >= 0.03){
      console.log('SCORE DIVERGENCE: Sonnet stated ' + (controlMatch?controlMatch[1]:'?') + ' ' + sonnetStatedScore.toFixed(2) +
        ' | Client computed ' + controlTeam + ' ' + score.toFixed(3) + ' (delta ' + Math.abs(score - sonnetStatedScore).toFixed(2) + ')');
    }

    const trajMatch = text.match(/(?:TRAJECTORY|EVENT FLAGS):\s*(\S+)\s*[—–-]\s*(\d+)\/(\d+)/i);
    // Parse individual Trag1-4 (or T1-T8 fallback) signal lines with team attribution
    const signalRegex = /(?:Trag([1-4])|T([1-8]))\s*[—–-]\s*([^:]+):\s*(.+)/g;
    const parsedSignals = [];
    let sm;
    const hUp = homeAlias.toUpperCase(), aUp = awayAlias.toUpperCase();
    const hSub = hUp.substring(0,3), aSub = aUp.substring(0,3);
    // Map Trag numbers to T keys for consistency
    const tragToT = {'1':'T1','2':'T2','3':'T4','4':'T7'};
    while((sm = signalRegex.exec(text)) !== null){
      const tragNum = sm[1]; // Trag match
      const tNum = sm[2]; // T match (fallback)
      const key = tragNum ? tragToT[tragNum] : ('T'+tNum);
      const label = sm[3].trim();
      const detail = sm[4].trim();
      const isClear = /^CLEAR/i.test(detail);
      const col = isClear ? '#3e3e48' : 'var(--amber)';
      // Extract team attribution from signal text
      let sigTeam = null;
      if(!isClear){
        const detUp = detail.toUpperCase();
        const hasHome = detUp.includes(hUp) || detUp.includes(hSub);
        const hasAway = detUp.includes(aUp) || detUp.includes(aSub);
        const bracketMatch = detail.match(/\[([A-Z]{2,4})\]/);
        const bracketTeam = bracketMatch ? bracketMatch[1].toUpperCase() : null;
        if(key==='T1'){
          // Heater on team X → benefits opponent
          if(bracketTeam){
            sigTeam = (bracketTeam===hUp||bracketTeam===hSub) ? awayAlias : homeAlias;
          } else if(hasHome && !hasAway) sigTeam = awayAlias;
          else if(hasAway && !hasHome) sigTeam = homeAlias;
        } else if(key==='T4'){
          // Foul trouble on team X → benefits opponent
          if(bracketTeam){
            sigTeam = (bracketTeam===hUp||bracketTeam===hSub) ? awayAlias : homeAlias;
          } else if(hasHome && !hasAway) sigTeam = awayAlias;
          else if(hasAway && !hasHome) sigTeam = homeAlias;
        } else if(key==='T2'){
          // Star cold: declining → benefits opponent; intact → benefits star's team
          const declining = /declin|collaps/i.test(detail);
          if(bracketTeam){
            sigTeam = declining ? ((bracketTeam===hUp||bracketTeam===hSub)?awayAlias:homeAlias) : ((bracketTeam===hUp||bracketTeam===hSub)?homeAlias:awayAlias);
          } else if(hasHome && !hasAway){
            sigTeam = declining ? awayAlias : homeAlias;
          } else if(hasAway && !hasHome){
            sigTeam = declining ? homeAlias : awayAlias;
          }
        } else {
          // T7: named team IS the beneficiary
          if(bracketTeam){
            sigTeam = (bracketTeam===hUp||bracketTeam===hSub) ? homeAlias : awayAlias;
          } else if(hasHome && !hasAway) sigTeam = homeAlias;
          else if(hasAway && !hasHome) sigTeam = awayAlias;
        }
      }
      parsedSignals.push({key, text: label + ': ' + detail, color: col, team: sigTeam, w: isClear ? 0 : 1});
    }
    // Recompute lean from per-signal attribution (more reliable than Sonnet's stated lean)
    const sigLeanMap = {};
    parsedSignals.forEach(s=>{ if(s.team && s.w>0) sigLeanMap[s.team] = (sigLeanMap[s.team]||0) + (s.key==='T3'?2:1); });
    const sigSorted = Object.entries(sigLeanMap).sort((a,b)=>b[1]-a[1]);
    const computedLean = sigSorted.length>0 ? sigSorted[0][0] : 'NEUTRAL';
    const trajLean = parsedSignals.length > 0 ? computedLean : (trajMatch ? trajMatch[1] : 'NEUTRAL');
    const trajCount = parsedSignals.length > 0 ? parsedSignals.filter(s => s.team===trajLean && s.w>0).length : (trajMatch ? parseInt(trajMatch[2]) : 0);
    const trajTotal = parsedSignals.length > 0 ? parsedSignals.filter(s=>s.w>0).length : (trajMatch ? parseInt(trajMatch[3]) : 8);

    return {
      I1:ind.I1, I2:ind.I2, I3:ind.I3, I4:ind.I4, I5:ind.I5,
      score, controlTeam,
      dataQuality: 'SONNET',
      traj: {signals:parsedSignals, lean:trajLean, count:trajCount, total:trajTotal, tooEarly:false},
      source: 'sonnet',
    };
  }catch(e){
    console.warn('Sonnet score parse failed:', e.message);
    return null;
  }
}

// 5-tier indicator color: green → yellow-green → yellow → orange → red
function indColor(score){
  if(score >= 0.875) return '#00ff88'; // clear edge — green
  if(score >= 0.625) return '#a8ff78'; // lean — yellow-green
  if(score >= 0.375) return '#ffd166'; // contested — yellow
  if(score >= 0.125) return '#ff8c42'; // opponent leans — orange
  return '#ff5252';                     // opponent controls — red
}

// 5-tier pip class (for background color via CSS)
function pipClass(score){
  if(score >= 0.875) return 'pw';  // win
  if(score >= 0.625) return 'plw'; // lean-win
  if(score >= 0.375) return 'pd';  // draw/contested
  if(score >= 0.125) return 'pll'; // lean-loss
  return 'pl';                      // loss
}

// Parse Decision View fields from Sonnet analysis text
function parseSonnetDecision(text){
  if(!text) return null;
  try{
    const d = {};
    // Parse EDGE line — extract fields independently (FWP and MIP can appear in any order)
    const edgeLine = (text.match(/EDGE:\s*(.+)/i)||[])[1]||'';
    if(edgeLine){
      const fwpMatch = edgeLine.match(/FWP:\s*([^|]+)/i);
      if(fwpMatch) d.fwpRaw = fwpMatch[1].trim().replace(/\|.*$/,'').trim();
      const mipMatch = edgeLine.match(/MIP:\s*([^|]+)/i);
      if(mipMatch) d.mip = mipMatch[1].trim().replace(/\|.*$/,'').trim();
      const edgeVal = edgeLine.replace(/\|?\s*(FWP|MIP):.*/i,'').replace(/\|.*$/,'').trim();
      if(edgeVal){ d.edge = edgeVal; const en = parseFloat(edgeVal.replace(/[+%]/g,'')); d.edgeNum = isNaN(en)?null:en; }
      if(d.fwpRaw){
        const twoSidedMatch = d.fwpRaw.match(/([A-Z]{2,4})\s+([\d.]+)%?\s*\/\s*([A-Z]{2,4})\s+([\d.]+)%?/i);
        if(twoSidedMatch){
          d.fwpTeam1 = twoSidedMatch[1].toUpperCase();
          d.fwpVal1 = parseFloat(twoSidedMatch[2]);
          d.fwpTeam2 = twoSidedMatch[3].toUpperCase();
          d.fwpVal2 = parseFloat(twoSidedMatch[4]);
          d.fwp = d.fwpRaw;
          d.fwpLabeled = true;
        } else {
          const singleMatch = d.fwpRaw.match(/([A-Z]{2,4})?\s*([\d.]+)%?/i);
          if(singleMatch){
            d.fwpSingleTeam = singleMatch[1] ? singleMatch[1].toUpperCase() : null;
            d.fwpSingleVal = parseFloat(singleMatch[2]);
          }
          d.fwp = d.fwpRaw;
          d.fwpLabeled = false;
        }
      }
    }
    // Parse ENTRY line
    const entryMatch = text.match(/ENTRY:\s*(OPTIMAL WINDOW|WINDOW OPEN|WINDOW CLOSING|NO WINDOW|FADE)/i);
    d.entry = entryMatch ? entryMatch[1] : null;
    // Parse CONVICTION line
    const convMatch = text.match(/CONVICTION:\s*(DOMINANT|STRONG|EARNED|CONDITIONAL|NO ENTRY)/i);
    d.conviction = convMatch ? convMatch[1] : null;
    // Parse Sustainability line
    const sustMatch = text.match(/Sustainability:\s*(.+)/i);
    d.sustainability = sustMatch ? sustMatch[1].trim() : null;
    // Parse Scoring / Lead Source line (new: STRUCTURAL|IDENTITY|HOT|MIXED|VOLATILE|EVEN, old: STRUCTURAL|VARIANCE|MIXED|EVEN)
    const scoringMatch = text.match(/(?:Scoring|Lead Source):\s*(STRUCTURAL|IDENTITY|HOT|MIXED|VOLATILE|VARIANCE|EVEN)\s*(?:[—–-]\s*(.+))?/i);
    d.leadSource = scoringMatch ? scoringMatch[1].toUpperCase() : null;
    d.leadSourceNote = scoringMatch && scoringMatch[2] ? scoringMatch[2].trim() : null;
    // Map old VARIANCE to VOLATILE for consistency
    if(d.leadSource === 'VARIANCE') d.leadSource = 'VOLATILE';
    // Parse Team Quality line
    const tqMatch = text.match(/Team Quality:\s*(.+)/i);
    d.teamQuality = tqMatch ? tqMatch[1].trim() : null;
    // Parse Clutch line
    const clutchMatch = text.match(/Clutch:\s*(.+)/i);
    d.clutch = clutchMatch ? clutchMatch[1].trim() : null;
    // Parse Prediction line
    const predMatch = text.match(/Prediction:\s*(.+)/i);
    d.prediction = predMatch ? predMatch[1].trim() : null;
    // Parse Thesis Status line
    const tsMatch = text.match(/THESIS\s*STATUS:\s*(CONFIRMED|DEVELOPING|CONTESTED|DENIED|FLIPPED)/i);
    d.thesisStatus = tsMatch ? tsMatch[1].toUpperCase() : null;
    // Parse Combined Read line
    const crMatch = text.match(/COMBINED\s*READ:\s*(DOMINANT|STRONG|EMERGING|EARNED|ERODING|FADING|COLLAPSING|SHIFT|FLIPPED|NO EDGE)\s*(?:[—–-]\s*(.+))?/i);
    d.combinedRead = crMatch ? crMatch[1].toUpperCase() : null;
    d.combinedReadNote = crMatch && crMatch[2] ? crMatch[2].trim() : null;
    // Parse Spread Analysis line
    const spreadMatch = text.match(/SPREAD\s*ANALYSIS:\s*(.+)/i);
    d.spreadAnalysis = spreadMatch ? spreadMatch[1].trim() : null;
    // Parse SIGNAL line: "SIGNAL: BUY DET — trailing on ORL variance"
    const sigMatch = text.match(/SIGNAL:\s*(BUY\s+\w+|NO VALUE|PASS)\s*(?:[—–-]\s*(.+))?/i);
    if(sigMatch){
      d.signalType = sigMatch[1].trim().toUpperCase();
      d.signalNote = sigMatch[2] ? sigMatch[2].trim() : '';
      const buyMatch = d.signalType.match(/BUY\s+(\w+)/i);
      d.buyTeam = buyMatch ? buyMatch[1].toUpperCase() : null;
    }
    // Need at least prediction or conviction to be valid
    if(!d.prediction && !d.conviction) return null;
    return d;
  }catch(e){
    console.warn('Decision parse failed:', e.message);
    return null;
  }
}
