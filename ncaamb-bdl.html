// THESIS GENERATION
// ══════════════════════════════════════════════════════════════════════════════
async function generateThesis(gameId){
  const game = games.find(g=>g.id===gameId);
  const cs = cardState[gameId];
  if(!game||!cs) return;
  cs.generating = true;
  cs.genError = null;
  const wasPaused = paused;
  paused = true; // Pause polling during generation to avoid SR rate limit conflicts
  const homeAlias = game.home?.alias||'';
  const awayAlias = game.away?.alias||'';
  // NCAAMB: try game object IDs first (SR schedule includes them), then hierarchy cache
  const homeId = game.home?.id || game.home?.sr_id || resolveTeamId(homeAlias);
  const awayId = game.away?.id || game.away?.sr_id || resolveTeamId(awayAlias);
  if(!homeId||!awayId){
    cs.genError = 'Unknown team ID: '+(homeId?'':homeAlias)+' '+(awayId?'':awayAlias)+' — try refreshing schedule';
    cs.generating=false; renderCard(game); return;
  }

  // NCAAMB thesis pipeline: no depth chart, no splits, no daily injuries
  cs.genSteps = [
    {label:'BDL Enrich',status:'pending'},
    {label:'Standings',status:'pending'},
    {label:homeAlias+' Profile',status:'pending'},
    {label:awayAlias+' Profile',status:'pending'},
    {label:homeAlias+' Stats',status:'pending'},
    {label:awayAlias+' Stats',status:'pending'},
    {label:'NET Rankings',status:'pending'},
    {label:'BDL Odds',status:'pending'},
    {label:'Sonnet Thesis',status:'pending'},
  ];
  renderGenProgress(gameId);

  // ── STEP 0: Ensure BDL enrichment is complete (odds only for NCAAMB) ──
  cs.genSteps[0].status = 'active';
  renderGenProgress(gameId);
  try{
    if(cs.enriching){
      addLog(gameId, 'Waiting for BDL enrichment to finish…', true);
      for(let w=0;w<24&&cs.enriching;w++) await new Promise(r=>setTimeout(r,500));
    } else if(!cs.enrichDone && !cs.oddsData){
      addLog(gameId, 'Triggering BDL enrichment for thesis…', true);
      await enrichFromBDL(gameId);
    }
    cs.genSteps[0].status = cs.oddsData?'done':'err';
    if(cs.genSteps[0].status==='err') cs.genSteps[0].error = 'No odds (optional)';
  }catch(e){
    cs.genSteps[0].status = 'err';
    cs.genSteps[0].error = 'optional';
  }
  renderGenProgress(gameId);

  // NCAAMB pipeline: standings + profiles + stats + NET rankings (no injuries, depth, splits)
  const calls = [
    {key:'standings', type:'standings', params:{}},
    {key:'homeProfile', type:'profile', params:{team_id:homeId}},
    {key:'awayProfile', type:'profile', params:{team_id:awayId}},
    {key:'homeStats', type:'statistics', params:{team_id:homeId}},
    {key:'awayStats', type:'statistics', params:{team_id:awayId}},
    {key:'netRankings', type:'net_rankings', params:{}},
  ];

  const cacheKey = 'ncaamb:srCache:'+gameId;
  let collected = {};

  // Always fetch fresh SR data — show every API call in progress UI
  for(let i=0; i<calls.length; i++){
    cs.genSteps[i+1].status = 'active';
    renderGenProgress(gameId);
    try{
      const data = await sr(calls[i].type, calls[i].params);
      collected[calls[i].key] = data;
      cs.genSteps[i+1].status = 'done';
    }catch(e){
      cs.genSteps[i+1].status = 'err';
      cs.genSteps[i+1].error = e.message;
    }
    renderGenProgress(gameId);
    if(i < calls.length-1) await new Promise(r=>setTimeout(r,1100));
  }
  // Cache for structural context extraction (used by extractStructuralContext)
  // Diagnostic: log stats response structure for debugging
  if(collected.homeStats) console.log('[NCAAMB STATS DEBUG] homeStats keys:', Object.keys(collected.homeStats), 'own_record?', !!collected.homeStats.own_record, 'statistics?', !!(collected.homeStats.own_record?.statistics || collected.homeStats.statistics), 'players?', !!(collected.homeStats.own_record?.players || collected.homeStats.players));
  if(collected.awayStats) console.log('[NCAAMB STATS DEBUG] awayStats keys:', Object.keys(collected.awayStats), 'own_record?', !!collected.awayStats.own_record, 'statistics?', !!(collected.awayStats.own_record?.statistics || collected.awayStats.statistics), 'players?', !!(collected.awayStats.own_record?.players || collected.awayStats.players));
  try{
    const cacheStr = JSON.stringify(collected);
    if(cacheStr.length < 3000000) localStorage.setItem(cacheKey, cacheStr);
    else console.warn('SR data too large to cache:', (cacheStr.length/1024).toFixed(0)+'KB');
  }catch(e){ console.warn('Cache write failed:', e.message); }

  // Extract structural context from cached SR data (closers, Pythagorean, opp profiles, shot diet)
  try{
    const structural = extractStructuralContext(gameId);
    if(structural && structural.built){
      cs.structural = structural;
      persistStructural(gameId, cs);
      addLog(gameId, '📊 Structural context extracted — '+structural.keyOuts.length+' key outs, diet: '+structural.shotDiet.home+'/'+structural.shotDiet.away, true);
    }
  }catch(e){ console.warn('Structural extract failed:', e.message); }

  // BDL Odds — skip if already populated by step 0 enrich
  if(cs.oddsData && cs.oddsData.homeML){
    cs.genSteps[7].status = 'done';
    renderGenProgress(gameId);
  } else {
  cs.genSteps[7].status = 'active';
  renderGenProgress(gameId);
  try{
    const bdlId = bdlGameMap[game.id];
    if(bdlId){
      try{
        const oddsResp = await bdl('odds',{game_id:bdlId});
        const oddsArr = oddsResp.data || oddsResp || [];
        if(Array.isArray(oddsArr) && oddsArr.length > 0){
          // Find consensus or first bookmaker
          const book = oddsArr[0];
          if(book){
            const hML = book.moneyline_home_odds || book.home_team_ml || book.home_moneyline || '';
            const aML = book.moneyline_away_odds || book.away_team_ml || book.away_moneyline || book.visitor_team_ml || '';
            const spread = book.spread_home_value || book.home_team_spread || book.home_spread || '';
            const total = book.total_value || book.over_under || book.total || '';
            if(hML || spread){
              if(cs.oddsData && cs.oddsData.homeML){
                cs.oddsHistory = cs.oddsHistory || [];
                cs.oddsHistory.push({...cs.oddsData, time: cs.oddsData.time || cs.lastUp?.toLocaleTimeString() || '?'});
                if(cs.oddsHistory.length > 20) cs.oddsHistory = cs.oddsHistory.slice(-20);
              }
              cs.oddsData = {homeSpread:String(spread), homeML:String(hML), awayML:String(aML), total:String(total), time:new Date().toLocaleTimeString()};
              if(!cs.openingOdds) cs.openingOdds = {...cs.oddsData};
              persistOdds(gameId, cs);
              console.log('BDL odds auto-populated:', cs.oddsData);
            }
          }
        }
      }catch(oe){ console.warn('BDL odds pull failed (non-fatal):', oe.message); }
    } else {
      console.log('No BDL game ID — odds not auto-populated');
    }
    cs.genSteps[7].status = 'done';
  }catch(e){
    cs.genSteps[7].status = 'err';
    cs.genSteps[7].error = 'optional';
  }
  } // end skip-if-already-populated
  renderGenProgress(gameId);

  // Now send to Sonnet via smart compute layer — server pre-computes SIA, redistribution, Pythagorean, BHV
  cs.genSteps[8].status = 'active';
  renderGenProgress(gameId);
  try{
    const tipTime = new Date(game.scheduled).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Phoenix'});

    // Trim functions to reduce prompt size (text sections for Sonnet context)
    const trimProfile = (p) => {
      if(!p) return '(unavailable)';
      const players = (p.players||[])
        .filter(pl => pl.status==='ACT'||pl.status==='SUS'||pl.status==='NWT')
        .map(pl => `${pl.full_name} [${pl.primary_position||pl.position||'?'}] ${pl.status}${pl.injuries?' — '+JSON.stringify(pl.injuries):''}`);
      return players.join('\n');
    };
    const trimStats = (s) => {
      if(!s) return '(unavailable)';
      const own = s.own_record||s;
      // SR statistics response may nest under averages/totals
      let teamStats = own.statistics||s.statistics||{};
      // Unwrap: if teamStats has averages/totals sub-objects, use averages for per-game numbers
      if(teamStats.averages && typeof teamStats.averages === 'object') teamStats = teamStats.averages;
      else if(teamStats.totals && typeof teamStats.totals === 'object') teamStats = teamStats.totals;
      let oppStats = (s.opponents||{}).statistics||{};
      if(oppStats.averages && typeof oppStats.averages === 'object') oppStats = oppStats.averages;
      else if(oppStats.totals && typeof oppStats.totals === 'object') oppStats = oppStats.totals;
      const players = (own.players||s.players||[])
        .sort((a,b)=>(b.average?.minutes||b.total?.minutes||0)-(a.average?.minutes||a.total?.minutes||0))
        .slice(0,10)
        .map(pl=>{
          const avg = pl.average||pl.averages||pl.total||pl.totals||{};
          return `${pl.full_name} [${pl.primary_position||'?'}] ${avg.minutes||0}mpg ${avg.points||0}ppg ${avg.assists||0}apg ${avg.rebounds||0}rpg ${avg.steals||0}spg ${avg.turnovers||0}to FG:${avg.field_goals_made||0}/${avg.field_goals_att||0} 3P:${avg.three_points_made||0}/${avg.three_points_att||0} FT:${avg.free_throws_made||0}/${avg.free_throws_att||0}`;
        });
      const t = teamStats;
      const teamLine = `Team: ${t.points||0}ppg ${t.assists||0}apg ${t.rebounds||0}rpg ${t.steals||0}spg ${t.blocks||0}bpg ${t.turnovers||t.total_turnovers||0}to FBP:${t.fast_break_points||0} POT:${t.points_off_turnovers||0} SCP:${t.second_chance_points||0} Paint:${t.points_in_the_paint||t.points_in_paint||0} OREB:${t.offensive_rebounds||0} FTA:${t.free_throws_att||0} eFG:${(((t.field_goals_made||0)+.5*(t.three_points_made||0))/(t.field_goals_att||1)*100).toFixed(1)}%`;
      const opp = oppStats;
      const oppLine = opp && Object.keys(opp).length > 0 ? `Opp allowed: ${opp.points||0}ppg Paint:${opp.points_in_the_paint||opp.points_in_paint||0} FTA:${opp.free_throws_att||0} OREB:${opp.offensive_rebounds||0} Stl:${opp.steals||0}` : '';
      // Debug: if all zeros, dump first-level keys so we can diagnose
      if((t.points||0)===0 && (t.assists||0)===0 && (t.rebounds||0)===0){
        const rawKeys = Object.keys(own.statistics||s.statistics||{}).join(',');
        return '(STATS PARSE WARNING: team stats all zero. Raw keys: '+rawKeys+')\n' + JSON.stringify(own.statistics||s.statistics||{}).substring(0,2000);
      }
      return teamLine + '\n' + oppLine + '\nTop players:\n' + players.join('\n');
    };
    const trimSplits = (s) => {
      if(!s) return '(unavailable)';
      const str = JSON.stringify(s);
      return str.length > 12000 ? str.substring(0, 12000) + '...(truncated)' : str;
    };
    const trimDepth = (d) => {
      if(!d) return '(unavailable)';
      // Resolve positions from various SR nesting structures
      let pos = [];
      if(d.positions){
        if(Array.isArray(d.positions)) pos = d.positions;
        else if(typeof d.positions === 'object'){
          Object.keys(d.positions).forEach(posName=>{
            const val = d.positions[posName];
            let players = [];
            if(Array.isArray(val)) players = val;
            else if(val?.players && Array.isArray(val.players)) players = val.players;
            else if(val && typeof val === 'object') players = Object.values(val).filter(v=>v&&typeof v==='object'&&(v.full_name||v.name));
            if(players.length>0) pos.push({name:posName, position:posName, players});
          });
        }
      }
      if(pos.length===0 && Array.isArray(d)) pos = d;
      if(pos.length===0 && d.depth_chart){
        if(Array.isArray(d.depth_chart)) pos = d.depth_chart;
        else if(d.depth_chart.positions) return trimDepth(d.depth_chart);
      }
      if(pos.length===0){
        const skip = ['id','name','market','alias','founded','sr_id','reference','venue','league','conference','division','coaches'];
        for(const k of Object.keys(d)){
          if(skip.includes(k)) continue;
          const v = d[k];
          if(Array.isArray(v) && v.length > 0 && v[0] && (Array.isArray(v[0].players) || v[0].name || v[0].position)){
            pos = v; break;
          }
        }
      }
      console.log('Depth chart resolved:', pos.length, 'positions from', Object.keys(d).slice(0,6));
      if(pos.length===0) return JSON.stringify(d).substring(0,2000);
      return pos.map(p =>
        (p.name||p.position||'?') + ': ' + (Array.isArray(p.players)?p.players:[]).map(pl=>`${pl.depth||'?'}. ${pl.full_name||pl.name||'?'}`).join(', ')
      ).join('\n');
    };
    const trimStandings = (s) => {
      if(!s) return '(unavailable)';
      const teams = [];
      (s.conferences||[]).forEach(conf=>{
        // NCAAMB: teams directly under conference (no division layer)
        // NBA: teams under conference > division
        const confTeams = conf.teams || [];
        confTeams.forEach(t=>{
          teams.push(`${t.name||t.market||'?'} ${t.wins||0}-${t.losses||0} (${(t.win_pct||0).toFixed(3)}) Conf:${conf.alias||conf.name||'?'}`);
        });
        // Also check for division layer (NBA compat)
        (conf.divisions||[]).forEach(div=>{
          (div.teams||[]).forEach(t=>{
            teams.push(`${t.name||t.market||'?'} ${t.wins||0}-${t.losses||0} (${(t.win_pct||0).toFixed(3)}) PF:${t.calc_points?.for||'?'} PA:${t.calc_points?.against||'?'}`);
          });
        });
      });
      return teams.join('\n');
    };
    const trimInjuries = (inj) => {
      if(!inj) return '(unavailable)';
      return (inj.teams||[]).filter(t=>(t.players||[]).length>0)
        .map(t=> (t.alias||t.market||'?') + ': ' + (t.players||[]).map(p=>{
          const injArr = Array.isArray(p.injuries)?p.injuries:[];
          const li = injArr.length>0?injArr[0]:{};
          return `${p.full_name} [${p.primary_position||p.position||'?'}] ${li.status||p.status||'?'} — ${li.desc||li.comment||p.desc||'?'}`;
        }).join('; '))
        .join('\n');
    };

    const c = collected;
    const safe = (fn, label) => { try{ return fn(); }catch(e){ console.error('TRIM CRASH in '+label+':', e.message, e.stack); return '(ERROR: '+label+' — '+e.message+')'; } };

    // Build text sections for Sonnet context
    // NCAAMB: no daily injuries endpoint, no depth chart, no splits
    // Injuries come from team profiles (embedded in roster data)
    const sections = {
      injuries: '(NCAAMB: no daily injuries endpoint — see team profiles for injury info)',
      homeRoster: safe(()=>trimProfile(c.homeProfile), 'homeProfile'),
      awayRoster: safe(()=>trimProfile(c.awayProfile), 'awayProfile'),
      homeDepth: '(NCAAMB: no depth chart endpoint — derive rotation from minutes distribution in stats)',
      awayDepth: '(NCAAMB: no depth chart endpoint — derive rotation from minutes distribution in stats)',
      homeStats: safe(()=>trimStats(c.homeStats), 'homeStats'),
      awayStats: safe(()=>trimStats(c.awayStats), 'awayStats'),
      homeSplitsGame: '(NCAAMB: no splits available — season averages only)',
      awaySplitsGame: '(NCAAMB: no splits available — season averages only)',
      homeSplitsSchedule: '(unavailable)',
      awaySplitsSchedule: '(unavailable)',
      standings: safe(()=>trimStandings(c.standings), 'standings'),
    };

    // NET Rankings section (NCAAMB-specific)
    if(c.netRankings){
      try{
        const rankings = c.netRankings.rankings || c.netRankings;
        let netSection = '\n=== NET RANKINGS ===\n';
        // Find both teams in the rankings
        const findTeam = (alias) => {
          const all = Array.isArray(rankings) ? rankings : (rankings.teams || rankings.entries || []);
          return all.find(t => {
            const a = (t.alias||t.abbreviation||t.team?.alias||'').toUpperCase();
            const n = (t.name||t.team?.name||t.market||'').toLowerCase();
            return a === alias.toUpperCase() || n.includes(alias.toLowerCase());
          });
        };
        [awayAlias, homeAlias].forEach(alias => {
          const t = findTeam(alias);
          if(t){
            netSection += alias + ': NET #' + (t.rank||t.net_rank||'?');
            if(t.record) netSection += ' (' + (t.record.wins||'?') + '-' + (t.record.losses||'?') + ')';
            // Quad records if available
            const quads = t.quad_records || t.quads || {};
            if(quads.q1 || quads.quad1) netSection += ' Q1:' + (quads.q1||quads.quad1||'?') + ' Q2:' + (quads.q2||quads.quad2||'?') + ' Q3:' + (quads.q3||quads.quad3||'?') + ' Q4:' + (quads.q4||quads.quad4||'?');
            if(t.sos_rank) netSection += ' SOS:#' + t.sos_rank;
            if(t.conf_record) netSection += ' Conf:' + t.conf_record;
            netSection += '\n';
          } else {
            netSection += alias + ': not found in NET rankings\n';
          }
        });
        sections.netRankings = netSection;
      }catch(e){
        sections.netRankings = '(NET rankings parse error: ' + e.message + ')';
      }
    } else {
      sections.netRankings = '(NET rankings unavailable)';
    }

    // ── RECENT FORM — skipped for NCAAMB (BDL team IDs not mapped for 362 teams) ──
    const _returningByTeam = {};
    const _recentForm = {home:null, away:null};
    sections.returning = '';
    sections.recentForm = '(NCAAMB: recent form detection not yet implemented for 362-team league)';

    // ── PRE-COMPUTED AVAILABILITY (team-by-team, cross-referenced) ──
    sections.availability = safe(()=>{
      const injMap = {};
      if(c.injuries && c.injuries.teams){
        c.injuries.teams.forEach(function(t){
          (t.players||[]).forEach(function(p){
            const injArr = Array.isArray(p.injuries)?p.injuries:[];
            const li = injArr.length>0?injArr[0]:{};
            const st = (li.status||p.status||'').toUpperCase();
            injMap[(p.full_name||'').toLowerCase().trim()] = {
              status: st, desc: li.desc||li.comment||p.desc||'', team: (t.alias||'').toUpperCase(),
            };
          });
        });
      }

      function buildTeamAvail(profile, alias){
        if(!profile||!profile.players) return alias+': (roster unavailable)';
        const inPlayers = [], outPlayers = [], gtdPlayers = [];
        profile.players.forEach(function(pl){
          if(pl.status!=='ACT'&&pl.status!=='SUS'&&pl.status!=='NWT') return;
          const name = pl.full_name||'?';
          const pos = pl.primary_position||pl.position||'?';
          const nameLower = name.toLowerCase().trim();
          const inj = injMap[nameLower];
          if(inj){
            const st = inj.status;
            if(st==='OUT'||st==='O'){
              outPlayers.push(name+' ['+pos+'] ❌ OUT'+(inj.desc?' — '+inj.desc:''));
            } else if(st==='DAY-TO-DAY'||st==='DAY TO DAY'||st==='GTD'||st==='QUESTIONABLE'||st==='DOUBTFUL'||st==='D'||st==='PROBABLE'){
              gtdPlayers.push(name+' ['+pos+'] ⚠️ '+st+(inj.desc?' — '+inj.desc:''));
            } else {
              inPlayers.push(name);
            }
          } else {
            inPlayers.push(name);
          }
        });
        // Build returning tag
        const ret = _returningByTeam[alias.toUpperCase()] || [];
        const retStr = ret.length > 0 ? ' | 🔄 NEW/RETURNING: '+ret.map(function(r){return r.name+' ['+r.position+']';}).join(', ') : '';
        let out = alias+': '+inPlayers.length+' players available'+retStr;
        if(outPlayers.length) out += '\n'+alias+' OUT: '+outPlayers.join(' | ');
        if(gtdPlayers.length) out += '\n'+alias+' GTD: '+gtdPlayers.join(' | ');
        if(!outPlayers.length && !gtdPlayers.length && !ret.length) out += ' (full strength)';
        return out+'\n';
      }

      return buildTeamAvail(c.awayProfile, awayAlias) + buildTeamAvail(c.homeProfile, homeAlias);
    }, 'availability');

    // Inject enrichment data into sections
    const od = cs.oddsData;
    if(od && (od.homeML || od.homeSpread)){
      sections.odds = '\n=== MARKET ODDS ===\nSpread: '+homeAlias+' '+(od.homeSpread||'N/A')+' | ML: '+awayAlias+' '+(od.awayML||'N/A')+' / '+homeAlias+' '+(od.homeML||'N/A')+' | O/U: '+(od.total||'N/A')+'\n';
    } else {
      sections.odds = '\n=== MARKET ODDS ===\nNot yet available — ML THRESHOLD will read "Awaiting odds"\n';
    }
    const td = cs.trackingData;
    if(td){
      const ht = td.home||{}, at = td.away||{};
      let trk = '\n=== SHOOTING BASELINES (BDL Tracking) ===\n';
      if(at.catchAndShoot || ht.catchAndShoot) trk += 'Catch & Shoot eFG%: '+awayAlias+' '+(at.catchAndShoot?at.catchAndShoot.efg||'?':'?')+'% | '+homeAlias+' '+(ht.catchAndShoot?ht.catchAndShoot.efg||'?':'?')+'%\n';
      if(at.pullUp || ht.pullUp) trk += 'Pull-up eFG%: '+awayAlias+' '+(at.pullUp?at.pullUp.efg||'?':'?')+'% | '+homeAlias+' '+(ht.pullUp?ht.pullUp.efg||'?':'?')+'%\n';
      sections.tracking = trk;
    } else { sections.tracking = ''; }
    // ESPN Win Probability context for Sonnet
    var ewp = cs.espnWP;
    if(ewp){
      var wpTeam = ewp.home >= ewp.away ? (ewp.homeAlias||homeAlias) : (ewp.awayAlias||awayAlias);
      var wpPct = Math.max(ewp.home, ewp.away);
      sections.espnWP = '\n=== ESPN WIN PROBABILITY ===\n'+wpTeam+' '+wpPct+'% (home:'+ewp.home+'% away:'+ewp.away+'%)'+(ewp.opening!=null?' | Opening: home '+ewp.opening+'%':'')+' | '+ewp.dataPoints+' data points\n';
    } else { sections.espnWP = ''; }
    const cd = cs.clutchData;
    if(cd){
      const tierLabel = cd.tier===1?'L15 NBA.com (Tier 1)':cd.tier===2?'Season BDL (Tier 2)':'Proxy (Tier 3)';
      let cl = '\n=== CLUTCH DATA ('+tierLabel+') ===\n';
      if(cd.away) cl += awayAlias+': NetRtg '+(cd.away.netRtg!=null?cd.away.netRtg:'N/A')+' OffRtg '+(cd.away.offRtg!=null?cd.away.offRtg:'N/A')+' DefRtg '+(cd.away.defRtg!=null?cd.away.defRtg:'N/A')+' '+(cd.away.wl||'')+'\n';
      if(cd.home) cl += homeAlias+': NetRtg '+(cd.home.netRtg!=null?cd.home.netRtg:'N/A')+' OffRtg '+(cd.home.offRtg!=null?cd.home.offRtg:'N/A')+' DefRtg '+(cd.home.defRtg!=null?cd.home.defRtg:'N/A')+' '+(cd.home.wl||'')+'\n';
      sections.clutch = cl;
    } else { sections.clutch = ''; }

    // Build analytical payload — raw structured data for server-side SIA computation
    // NCAAMB: no separate injuries endpoint, no depth chart. Injuries embedded in profiles.
    const analytical = {
      injuries: {}, // NCAAMB has no daily injuries endpoint — profile injuries used instead
      homeProfile: c.homeProfile || {},
      awayProfile: c.awayProfile || {},
      homeStats: c.homeStats || {},
      awayStats: c.awayStats || {},
      homeDepth: {}, // NCAAMB has no depth chart endpoint
      awayDepth: {}, // derive rotation from minutes in stats
      standings: c.standings || {},
      netRankings: c.netRankings || {}, // NCAAMB-specific
      league: 'ncaamb',
    };

    const payload = {
      matchup: { home: homeAlias, away: awayAlias, homeId: homeId, awayId: awayId, date: getSlateDate(0).str, time: tipTime, venue: game.venue||'TBD' },
      sections: sections,
      analytical: analytical,
    };

    console.log('Thesis payload size:', (JSON.stringify(payload).length/1024).toFixed(1)+'KB');
    // Pre-send diagnostic — what does the client think it's sending?
    const injCheck = payload.analytical.injuries;
    console.log('%c📋 CLIENT PRE-SEND: injuries', 'color:#f0c040;font-weight:bold', {
      type: typeof injCheck, isNull: injCheck===null, isUndef: injCheck===undefined,
      topKeys: injCheck ? Object.keys(injCheck) : 'N/A',
      hasTeams: injCheck ? Array.isArray(injCheck.teams) : false,
      teamsCount: injCheck && Array.isArray(injCheck.teams) ? injCheck.teams.length : 0,
      sampleTeam: injCheck && Array.isArray(injCheck.teams) && injCheck.teams.length > 0 ? {alias:injCheck.teams[0].alias, players:(injCheck.teams[0].players||[]).length} : 'N/A',
      jsonSize: injCheck ? JSON.stringify(injCheck).length : 0
    });
    console.log('%c📋 CLIENT PRE-SEND: all analytical', 'color:#f0c040', {
      injuries: injCheck ? Object.keys(injCheck).join(',') : 'EMPTY',
      homeProfile: payload.analytical.homeProfile ? (payload.analytical.homeProfile.players||[]).length + ' players' : 'EMPTY',
      awayProfile: payload.analytical.awayProfile ? (payload.analytical.awayProfile.players||[]).length + ' players' : 'EMPTY',
      homeStats: payload.analytical.homeStats ? Object.keys(payload.analytical.homeStats).join(',') : 'EMPTY',
      awayStats: payload.analytical.awayStats ? Object.keys(payload.analytical.awayStats).join(',') : 'EMPTY',
      homeDepth: payload.analytical.homeDepth ? Object.keys(payload.analytical.homeDepth).join(',') : 'EMPTY',
      awayDepth: payload.analytical.awayDepth ? Object.keys(payload.analytical.awayDepth).join(',') : 'EMPTY',
      standings: payload.analytical.standings ? Object.keys(payload.analytical.standings).join(',') : 'EMPTY',
    });

    // ── STREAMING THESIS GENERATION ──
    // Reads SSE stream from generate-thesis (Netlify v2 streaming function)
    // Events: preComputed → delta (×N) → done
    const resp = await fetch(FN+'generate-thesis',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });

    // Non-streaming fallback (legacy or error response)
    const contentType = resp.headers.get('content-type')||'';
    if(contentType.includes('application/json')){
      if(!resp.ok){
        const errData = await resp.json().catch(()=>({error:'Unknown error '+resp.status}));
        throw new Error(errData.error||'Thesis gen failed: '+resp.status);
      }
      const data = await resp.json();
      theses[gameId] = (data.thesis||'').replace(/\*\*/g,'').replace(/^#{1,3}\s/gm,'');
      try{ localStorage.setItem('ncaamb:theses', JSON.stringify(theses)); }catch(e){ console.warn('Thesis persist failed:', e.message); }
      if(dbReady) fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'ncaamb',text:theses[gameId]})}).catch(function(){});
      if(data.preComputed) processPreComputed(data.preComputed);
    } else {
      // SSE stream reader
      if(!resp.ok) throw new Error('Thesis gen failed: '+resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let sseBuffer = '';
      let streamedThesis = '';

      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        sseBuffer += decoder.decode(value, {stream:true});

        // Parse complete SSE events (separated by \n\n)
        const events = sseBuffer.split('\n\n');
        sseBuffer = events.pop()||''; // keep incomplete event in buffer

        for(const evt of events){
          const lines = evt.trim().split('\n');
          for(const line of lines){
            if(!line.startsWith('data: ')) continue;
            try{
              const parsed = JSON.parse(line.slice(6));
              if(parsed.type === 'preComputed'){
                processPreComputed(parsed.data);
                addLog(gameId, '📡 Streaming thesis...', true);
              } else if(parsed.type === 'delta' && parsed.text){
                streamedThesis += parsed.text;
                // Progressive UI update — show thesis as it streams
                theses[gameId] = streamedThesis.replace(/\*\*/g,'').replace(/^#{1,3}\s/gm,'');
                renderCard(game);
              } else if(parsed.type === 'done'){
                streamedThesis = parsed.thesis || streamedThesis;
                theses[gameId] = streamedThesis.replace(/\*\*/g,'').replace(/^#{1,3}\s/gm,'');
                try{ localStorage.setItem('ncaamb:theses', JSON.stringify(theses)); }catch(e){ console.warn('Thesis persist failed:', e.message); }
                if(dbReady) fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'ncaamb',text:theses[gameId]})}).catch(function(){});
                if(parsed.usage) addLog(gameId, '📊 Tokens: in='+((parsed.usage.input_tokens||0))+' out='+((parsed.usage.output_tokens||0)), true);
              } else if(parsed.type === 'error'){
                throw new Error(parsed.error||'Stream error');
              }
            }catch(parseErr){
              if(parseErr.message && !parseErr.message.includes('JSON')) throw parseErr;
              // Skip unparseable SSE lines
            }
          }
        }
      }
    }

    // Fallback: if SSE ended without a 'done' event, persist anyway
    if(theses[gameId] && theses[gameId].length > 50){
      try{ localStorage.setItem('ncaamb:theses', JSON.stringify(theses)); }catch(e){}
      if(dbReady) fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'ncaamb',text:theses[gameId]})}).catch(function(){});
      addLog(gameId, '✅ Thesis saved ('+theses[gameId].length+' chars)', true);
    }

    // Process preComputed data (shared by both streaming and fallback paths)
    function processPreComputed(pc){
      if(!pc) return;
      addLog(gameId, '🔬 SIA: '+homeAlias+' '+pc.rosterAudit.homeOut+' OUT ('+((pc.rosterAudit.homeOutNames||[]).join(', ')||'none')+'), '+awayAlias+' '+pc.rosterAudit.awayOut+' OUT ('+((pc.rosterAudit.awayOutNames||[]).join(', ')||'none')+')'+(pc.depletion.home?' | '+homeAlias+' '+pc.depletion.home.label:'')+(pc.depletion.away?' | '+awayAlias+' '+pc.depletion.away.label:''), true);
      cs.siaCaps = pc.siaCaps;
      cs.floorScores = pc.floorScores || null;
      if(cs.floorScores){
        ['home','away'].forEach(side=>{
          const f = cs.floorScores[side];
          if(f) addLog(gameId, '📊 FLOOR: '+(side==='home'?homeAlias:awayAlias)+' minimum '+f.floor.toFixed(3)+' ('+f.verdict+') — '+f.details.join(', '), true);
        });
      }
      if(pc.diagnostics){
        const dx = pc.diagnostics;
        console.log('%c📋 DATA INTEGRITY REPORT', 'color:#f0c040;font-weight:bold', dx);
        let dxLog = '📋 Data: '+dx.summary;
        if(dx.critical && dx.critical.length > 0) dxLog += ' ❌ '+dx.critical.join(', ');
        if(dx.warnings && dx.warnings.length > 0) dxLog += ' ⚠️ '+dx.warnings.join(', ');
        addLog(gameId, dxLog, true);
        const cr = dx.crossRef || {};
        if(cr.home && cr.home.length > 0) addLog(gameId, '🔗 '+homeAlias+' xref: '+cr.home.join(' | '), true);
        if(cr.away && cr.away.length > 0) addLog(gameId, '🔗 '+awayAlias+' xref: '+cr.away.join(' | '), true);
        const injDx = dx.endpoints && dx.endpoints.injuries;
        if(injDx){
          const matchedStr = (injDx.matchedTeams||[]).map(t=>(t.side||'?')+'='+t.market+' '+t.name+':'+t.players+'p').join(', ');
          addLog(gameId, '🩺 Injuries: '+(injDx.hasTeams?injDx.teamsCount+' teams':'NO .teams[]')+' | matched=['+matchedStr+'] | topKeys=['+((injDx.topKeys||[]).join(','))+']', true);
          if(injDx.sampleTeamKeys) addLog(gameId, '🩺 Team keys: '+injDx.sampleTeamKeys.join(', '), true);
          if(injDx.samplePlayerKeys) addLog(gameId, '🩺 Player keys: '+injDx.samplePlayerKeys.join(', '), true);
          if(injDx.samplePlayerDump) addLog(gameId, '🩺 Sample player: '+JSON.stringify(injDx.samplePlayerDump).substring(0,300), true);
          if(injDx.rawPlayerKeys) addLog(gameId, '🔑 MATCHED player keys: '+injDx.rawPlayerKeys.join(', '), true);
          if(injDx.rawPlayerJSON) addLog(gameId, '🔑 RAW PLAYER: '+injDx.rawPlayerJSON, true);
          if(injDx.matchedPlayerStatuses && injDx.matchedPlayerStatuses.length > 0) addLog(gameId, '🩺 Statuses: '+injDx.matchedPlayerStatuses.join(' | '), true);
          if(injDx.nestedPath) addLog(gameId, '🩺 ⚠️ Found nested path: '+injDx.nestedPath+' — compute may need patching', true);
        }
        ['home','away'].forEach(side=>{
          const depDx = dx.endpoints && dx.endpoints[side+'Depth'];
          if(depDx){
            addLog(gameId, '📐 '+(side==='home'?homeAlias:awayAlias)+' depth: '+(depDx.resolvedPositions||0)+' positions | hasPositions:'+depDx.hasPositions+' | allKeys=['+(depDx.allKeys||[]).join(',')+']', true);
            if(depDx.keyTypes) addLog(gameId, '📐 keyTypes: '+Object.entries(depDx.keyTypes).map(([k,v])=>k+':'+v).join(' | '), true);
          }
        });
      }
    }
    cs.genSteps[8].status = 'done';
  }catch(e){
    cs.genSteps[8].status = 'err';
    cs.genSteps[8].error = e.message;
    console.error('Thesis generation failed at step 14:', e.message, e.stack);
  }
  cs.generating = false;
  renderConfidenceTable();
  cs.genError = cs.genSteps[8]?.status==='err' ? cs.genSteps[8].error : null;
  paused = wasPaused; // Resume polling state
  renderCard(game);
}

function renderGenProgress(gameId){
  const el = document.getElementById('gen-progress-'+gameId);
  const cs = cardState[gameId];
  if(!el||!cs?.genSteps) return;
  el.innerHTML = cs.genSteps.map(s=>{
    const icon = s.status==='done'?'✓':s.status==='active'?'⟳':s.status==='err'?'✗':'·';
    return `<span class="gen-step ${s.status}">${icon} ${s.label}${s.error?' — '+s.error:''}</span>`;
  }).join('<br>');
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPUTE INDICATORS (SR FORMAT)
// ══════════════════════════════════════════════════════════════════════════════
function compute(game){
  if(!game?.summary || getState(game)==='PRE') return null;
  const s = game.summary;
  const H = s.home, A = s.away;
  const hs = H?.statistics||{}, as = A?.statistics||{};
  const hA = H?.alias||H?.name||'HOME', aA = A?.alias||A?.name||'AWAY';
  const hS = H?.points||0, aS = A?.points||0;

  // I1 — Disruption & Conversion
  const hDisrupt = (hs.steals||0) + (hs.blocks||0);
  const aDisrupt = (as.steals||0) + (as.blocks||0);
  const disruptDiff = hDisrupt - aDisrupt;
  const i1subA = disruptDiff > 1 ? 1 : disruptDiff < -1 ? -1 : 0;
  const hPOT = hs.points_off_turnovers||0, aPOT = as.points_off_turnovers||0;
  const potDiff = hPOT - aPOT;
  const i1subB = potDiff > 4 ? 1 : potDiff < -4 ? -1 : 0;
  let i1 = i1subA + i1subB;
  // Chaos layer from PBP — forced vs unforced TOs
  const pbp = cardState[game.id]?.pbpAudit;
  let chaosNote = '';
  if(pbp){
    const hForced = pbp.away.tos.forced||0;
    const aForced = pbp.home.tos.forced||0;
    const hUnforced = pbp.home.tos.unforced||0;
    const aUnforced = pbp.away.tos.unforced||0;
    if(hForced >= aForced+4) { i1 += 0.5; chaosNote = ` | CHAOS:${hA} +${hForced-aForced} forced`; }
    else if(aForced >= hForced+4) { i1 -= 0.5; chaosNote = ` | CHAOS:${aA} +${aForced-hForced} forced`; }
    else if(hUnforced >= aUnforced+4) { i1 -= 0.5; chaosNote = ` | CHAOS:${hA} ${hUnforced} unforced`; }
    else if(aUnforced >= hUnforced+4) { i1 += 0.5; chaosNote = ` | CHAOS:${aA} ${aUnforced} unforced`; }
    else { chaosNote = ` | chaos:even`; }
  }
  const I1={score:i1>0?1:i1===0?.5:0, leader:i1>0?hA:i1<0?aA:'EVEN',
    detail:`Disrupt:${hDisrupt}–${aDisrupt} (stl+blk) POT:${hPOT}–${aPOT}${chaosNote}`};

  // I2 — Interior Control (Sub-A: paint volume, Sub-B: rim efficiency)
  var hPaint = hs.points_in_the_paint||hs.points_in_paint||0, aPaint = as.points_in_the_paint||as.points_in_paint||0;
  // SR often delays points_in_the_paint — use PBP at-rim makes × 2 as floor proxy
  if(pbp){
    if(!hPaint && pbp.home?.rim?.made) hPaint = pbp.home.rim.made * 2;
    if(!aPaint && pbp.away?.rim?.made) aPaint = pbp.away.rim.made * 2;
  }
  const i2paintDiff = hPaint - aPaint;
  let i2subA = 0;
  if (i2paintDiff > 6) i2subA = 1;
  else if (i2paintDiff < -6) i2subA = -1;
  const hRimM = hs.field_goals_at_rim_made||0, hRimA = hs.field_goals_at_rim_att||0;
  const aRimM = as.field_goals_at_rim_made||0, aRimA = as.field_goals_at_rim_att||0;
  const hRimPct = hRimA >= 6 ? hRimM/hRimA : null;
  const aRimPct = aRimA >= 6 ? aRimM/aRimA : null;
  let i2subB = 0;
  if (hRimPct != null && aRimPct != null) {
    if (hRimPct - aRimPct > 0.10) i2subB = 1;
    else if (aRimPct - hRimPct > 0.10) i2subB = -1;
  }
  const i2raw = i2subA + i2subB;
  const hBonusTag = H?.double_bonus?'⬤⬤':H?.bonus?'⬤':'', aBonusTag = A?.double_bonus?'⬤⬤':A?.bonus?'⬤':'';
  const I2={score:i2raw>0?1:i2raw<0?0:.5, leader:i2raw>0?hA:i2raw<0?aA:'EVEN',
    detail:`Paint:${hPaint}–${aPaint}(${i2paintDiff>0?'+':''}${i2paintDiff}) RimFG:${hRimPct!=null?(hRimPct*100).toFixed(1):'?'}%–${aRimPct!=null?(aRimPct*100).toFixed(1):'?'}% Rim:${hRimM}/${hRimA}–${aRimM}/${aRimA} | A:${i2subA>0?'+':''}${i2subA} B:${i2subB>0?'+':''}${i2subB}${hBonusTag?' '+hA+hBonusTag:''}${aBonusTag?' '+aA+aBonusTag:''}`};

  // I3 — Shot Quality & Creation (enhanced with PBP zone data)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const hEFG=(((hs.field_goals_made||0)+.5*(hs.three_points_made||0))/hFGA);
  const aEFG=(((as.field_goals_made||0)+.5*(as.three_points_made||0))/aFGA);
  const hAst=hs.assists||0, aAst=as.assists||0;
  const hFGM=hs.field_goals_made||1, aFGM=as.field_goals_made||1;
  const hAR=(hAst/hFGM)*100, aAR=(aAst/aFGM)*100;
  const hCS3=pbp?.home?.threes?.assisted||0, aCS3=pbp?.away?.threes?.assisted||0;
  const i3=(hEFG>aEFG+.02?1:hEFG<aEFG-.02?-1:0)+(hAR>aAR+5?1:hAR<aAR-5?-1:0)+(hCS3>aCS3+2?1:hCS3<aCS3-2?-1:0);
  let i3detail=`eFG%:${(hEFG*100).toFixed(1)}–${(aEFG*100).toFixed(1)} AR:${hAR.toFixed(0)}–${aAR.toFixed(0)} C&S:${hCS3}–${aCS3} AST:${hAst}–${aAst}`;
  if(pbp){
    const hD=pbp.home?.shotDiet, aD=pbp.away?.shotDiet;
    if(hD&&aD) i3detail+=` | diet ${hA}:rim${hD.rimPct}%/mid${hD.midPct}%/3pt${hD.threePct}% ${aA}:rim${aD.rimPct}%/mid${aD.midPct}%/3pt${aD.threePct}%`;
  }
  const I3={score:i3>0?1:i3===0?.5:0, leader:i3>0?hA:i3<0?aA:'EVEN', detail:i3detail};

  // I4 — Game Control
  const periods = s.periods||[];
  const hBigLead = hs.biggest_lead||0, aBigLead = as.biggest_lead||0;
  const bigLeadDiff = hBigLead - aBigLead;
  const i4subA = bigLeadDiff > 4 ? 1 : bigLeadDiff < -4 ? -1 : 0;
  let i4subB = 0;
  // NCAAMB: use H2 diff when in second half (periods.length >= 2)
  if (periods.length >= 2) {
    const lastP = periods[periods.length - 1];
    const lastQDiff = (lastP?.home_points||0) - (lastP?.away_points||0);
    i4subB = lastQDiff > 2 ? 1 : lastQDiff < -2 ? -1 : 0;
  }
  const i4 = i4subA + i4subB;
  const qDs = periods.map(p=>(p.home_points||0)-(p.away_points||0));
  const lc = s.lead_changes||0, tt = s.times_tied||0;
  let i4detail = `BigLead:${hBigLead}–${aBigLead} ${qDs.map((d,i)=>'H'+(i+1)+':'+(d>0?'+':'')+d).join(' ')}`;
  if(lc||tt) i4detail += ` | LC:${lc} TT:${tt}`;
  const I4={score:i4>0?1:i4===0?.5:0, leader:i4>0?hA:i4<0?aA:'EVEN', detail:i4detail};

  // I5 — Sustained Execution (run share from PBP)
  let I5={score:0.5, leader:'EVEN', detail:'No PBP runs data'};
  const pbpRuns6 = pbp?.runs6 || cardState[game.id]?.pbpAudit?.runs6;
  if (pbpRuns6) {
    const hRuns = pbpRuns6.filter(r=>r.team===hA).length;
    const aRuns = pbpRuns6.filter(r=>r.team===aA).length;
    const totalRuns = hRuns + aRuns;
    if (totalRuns >= 4) {
      const runShare = hRuns / totalRuns;
      I5 = {score: runShare > 0.55 ? 1 : runShare < 0.45 ? 0 : 0.5,
            leader: runShare > 0.55 ? hA : runShare < 0.45 ? aA : 'EVEN',
            detail: `Runs(6+):${hA}${hRuns}–${aA}${aRuns} share:${(runShare*100).toFixed(0)}%`};
    } else {
      I5.detail = `Runs(6+):${hA}${hRuns}–${aA}${aRuns} (< 4 total, EVEN)`;
    }
  }

  const raw = I1.score*W.I1 + I2.score*W.I2 + I3.score*W.I3 + I4.score*W.I4 + I5.score*W.I5;
  const controlHome = raw>=.5, cTeam = controlHome?hA:aA;
  let score = controlHome?raw:1-raw;

  // Pythagorean cap (requires structural context from thesis gen)
  const struct = cardState[game.id]?.structural;
  let pythNote = null;
  if(struct?.built && struct.pythagorean){
    const cSide = controlHome?'home':'away';
    const pyth = struct.pythagorean[cSide];
    if(pyth && pyth.cap && score > pyth.cap){
      pythNote = cTeam+' PYTH CAP: actual '+pyth.actual+'-'+(pyth.gp-pyth.actual)+' vs expected '+pyth.expected.toFixed(0)+' ('+pyth.delta.toFixed(1)+') — capped at '+pyth.cap;
      score = pyth.cap;
    }
  }

  // Client-side sustainability audit
  const bl = cardState[game.id]?.baselines;
  let clientSust = null;
  if(bl && bl.built){
    const tracking = cardState[game.id]?.trackingData;
    const pbpA = cardState[game.id]?.pbpAudit;
    const hSust = computeSustainabilityClient(H, bl, hA, 'home', tracking, pbpA);
    const aSust = computeSustainabilityClient(A, bl, aA, 'away', tracking, pbpA);
    clientSust = {home:hSust, away:aSust};
    cardState[game.id].clientSustainability = clientSust;
  }
  // Fallback: use Sonnet audit or previously stored client sustainability when baselines unavailable
  if(!clientSust){
    clientSust = cardState[game.id]?.clientSustainability || cardState[game.id]?.sustainabilityAudit || null;
  }
  // Final fallback: parse tiers from prediction sustainability text
  if(!clientSust){
    var _pred = cardState[game.id]?.prediction;
    if(_pred && _pred.sustainability){
      var _sustText = _pred.sustainability;
      var _parsedSust = {home:{tier:null}, away:{tier:null}};
      var _tiers = ['LOCKED IN','LOCKED','COLD','DURABLE','MIXED','FRAGILE','UNSUSTAINABLE','TOO EARLY'];
      _tiers.forEach(function(t){
        var hPat = new RegExp(hA+'[:\\s]+'+t,'i');
        var aPat = new RegExp(aA+'[:\\s]+'+t,'i');
        if(hPat.test(_sustText)) _parsedSust.home.tier = t;
        if(aPat.test(_sustText)) _parsedSust.away.tier = t;
      });
      if(_parsedSust.home.tier || _parsedSust.away.tier) clientSust = _parsedSust;
    }
  }

  // Client-side lead composition (cross-references sustainability)
  const clientLC = computeLeadCompositionClient(game, clientSust);
  if(clientLC) cardState[game.id].clientLeadComposition = clientLC;
  // Persist updated sustainability + lead comp so they survive refresh
  if(cardState[game.id].analysis) persistAnalysis(game.id, cardState[game.id]);

  // Rolling window — quarter-based, merges server-seeded periods with client-captured ones
  var windowResult = computeRollingWindow(game);
  if(windowResult && windowResult.available){
    cardState[game.id].rollingWindow = windowResult;
  } else if(!cardState[game.id].rollingWindow || !cardState[game.id].rollingWindow.available){
    cardState[game.id].rollingWindow = windowResult;
  }

  // Possession windows — PBP pure + enriched (parallel comparison)
  var _pwSize = getPossWindowSize(game);
  var pbpWindow = computePossessionWindow(game, _pwSize);
  cardState[game.id].pbpWindow = pbpWindow;


  // Gap acceleration — uses PBP window (falls back to QTR)
  // Floor reference: prefer Sonnet's structural read when available (smarter), fall back to client compute
  var _cs = cardState[game.id];
  var _floorScore = (_cs.sonnetIndicators ? _cs.sonnetIndicators.score : score);
  var _floorTeam = (_cs.sonnetIndicators ? _cs.sonnetIndicators.controlTeam : cTeam);
  var _gapWindow = (pbpWindow && pbpWindow.available) ? pbpWindow : windowResult;
  if(_gapWindow && _gapWindow.available){
    updateGapLog(game.id, _floorScore, _floorTeam, _gapWindow, game);
  }
  const accelResult = computeAcceleration(cardState[game.id].gapLog);
  cardState[game.id].acceleration = accelResult;

  // Sub-metric arrows
  const arrows = computeSubMetricArrows(game.id);
  cardState[game.id].subMetricArrows = arrows;

  // Adjustment signal
  const adjustment = classifyAdjustment(arrows, _floorTeam, hA, aA);
  cardState[game.id].adjustment = adjustment;

  // Combined read
  const combinedRead = classifyCombinedRead(_floorScore, _floorTeam, _gapWindow, accelResult);
  cardState[game.id].combinedRead = combinedRead;

  // Margin projection (feeds spread conviction + Sonnet FWP anchor)
  const projection = computeProjection(game);
  if(projection) cardState[game.id].projection = projection;

  // Spread conviction (uses projection when available)
  const spreadConv = computeSpreadConviction(game);
  if(spreadConv) cardState[game.id].spreadConviction = spreadConv;

  // Trajectory
  const traj = buildTrajectory(game, hA, aA, hs, as, H, A, hS, aS, qDs, periods);

  const gameMeta = {
    leadChanges:s.lead_changes||0, timesTied:s.times_tied||0,
    hRun:hs.most_unanswered, aRun:as.most_unanswered,
    hTimeLead:hs.time_leading, aTimeLead:as.time_leading,
    hFoulouts:hs.foulouts||0, aFoulouts:as.foulouts||0,
    hTS:hs.true_shooting_pct||0, aTS:as.true_shooting_pct||0,
    hATO:hs.assists_turnover_ratio||0, aATO:as.assists_turnover_ratio||0,
    hEGS:hs.efficiency_game_score||0, aEGS:as.efficiency_game_score||0,
    hTimeouts:H?.remaining_timeouts, aTimeouts:A?.remaining_timeouts,
  };

  return {I1,I2,I3,I4,I5, score, controlTeam:cTeam, dataQuality:'FULL', traj, pythNote, clientSust, gameMeta};
}

function buildTrajectory(game, hA, aA, hs, as, H, A, hS, aS, qDs, periods){
  const p = game.period||0;
  // NCAAMB: use synthetic quarter count for resolution check
  // With synthetic quarters, we have up to 4 data points even with only 2 halves
  const synQ = cardState[game.id]?.pbpAudit?.syntheticQuarters;
  const effectivePeriods = synQ ? synQ.filter(q => q.events > 0).length : p;
  if(effectivePeriods<2) return {signals:[], lean:'NEUTRAL', count:0, total:0, tooEarly:true};
  const sigs = [], overall=hS-aS, currQ=qDs.length>0?qDs[qDs.length-1]:null;

  // T1 — Role Player Heater (real player-level detection when baselines available)
  const pbpD = cardState[game.id]?.pbpAudit;
  const bl = cardState[game.id]?.baselines;
  if(bl && bl.built){
    let bestHeater = null;
    (H.players||[]).concat(A.players||[]).forEach(pl=>{
      const live = pl.statistics||{};
      const live3a = live.three_points_att||0, live3m = live.three_points_made||0;
      if(live3a<3) return;
      const name = pl.full_name||pl.name||'?';
      const b = bl.players[name];
      if(!b || b.szn3Pct===null) return;
      const livePct = live3m/live3a*100;
      if(livePct > b.szn3Pct+15 && (b.tier==='NON'||b.tier==='AVG'||b.tier==='UNK')){
        const dev = livePct-b.szn3Pct;
        if(!bestHeater || dev>bestHeater.dev) bestHeater = {name,team:b.team,livePct,sznPct:b.szn3Pct,tier:b.tier,dev,live3m,live3a};
      }
    });
    if(bestHeater){
      const beneficiary = bestHeater.team===hA ? aA : hA;
      sigs.push({key:'T1',w:1,team:beneficiary,color:'#ffd166',
        text:bestHeater.name+' '+bestHeater.live3m+'/'+bestHeater.live3a+' 3PT ('+bestHeater.livePct.toFixed(0)+'% vs '+bestHeater.sznPct.toFixed(0)+'% szn) '+bestHeater.tier+' — '+bestHeater.team+' lead variance-sourced'});
    } else {
      sigs.push({key:'T1',w:0,team:null,color:'#3e3e48',text:'No role player heater detected'});
    }
  } else {
    // Fallback: conversion signal when baselines unavailable
    const hC=(hs.fast_break_points||0)+(hs.points_off_turnovers||0), aC=(as.fast_break_points||0)+(as.points_off_turnovers||0);
    if(Math.abs(hC-aC)>=10){const w=hC>aC?hA:aA;sigs.push({key:'T1*',w:1,team:w,color:'#ffd166',text:w+' conversion +'+(Math.abs(hC-aC))+' (FBP+POT) [no baseline]'});}
    else sigs.push({key:'T1*',w:0,team:null,color:'#3e3e48',text:'Conversion flat ('+hC+'–'+aC+') [no baseline]'});
  }

  // T2 — Star Process Integrity Check
  if(bl && bl.built){
    let starFlag = null;
    const allStars = [...(bl.stars.home||[]), ...(bl.stars.away||[])];
    for(const starName of allStars){
      const b = bl.players[starName]; if(!b || b.sznFGPct===null) continue;
      const plObj = (b.side==='home'?H:A)?.players?.find(x=>(x.full_name||x.name)===starName);
      if(!plObj) continue;
      const live = plObj.statistics||{};
      const liveFGA = live.field_goals_att||0, liveFGM = live.field_goals_made||0;
      if(liveFGA<6) continue;
      const livePct = liveFGM/liveFGA*100;
      if(livePct < b.sznFGPct-10){
        // Check process: Q-over-Q assists from periods
        let processLabel = 'intact';
        if(periods && periods.length>=2){
          const plPeriods = plObj.periods||[];
          if(plPeriods.length>=2){
            const lastQAst = plPeriods[plPeriods.length-1]?.statistics?.assists||0;
            const prevQAst = plPeriods[plPeriods.length-2]?.statistics?.assists||0;
            if(lastQAst>prevQAst+1) processLabel='accelerating';
            else if(lastQAst<prevQAst-1) processLabel='declining';
          }
        }
        const liveFGA2 = live.field_goals_att||0;
        const liveAst = live.assists||0, liveReb = live.rebounds||0;
        if(liveAst<=1 && liveReb<=2 && liveFGA2>=10) processLabel='collapsed';
        // Attribution: cold + accelerating/intact → benefits star's team; declining/collapsed → benefits opponent
        const starTeam = b.team;
        const beneficiary = (processLabel==='accelerating'||processLabel==='intact') ? starTeam : (starTeam===hA?aA:hA);
        const col = (processLabel==='declining'||processLabel==='collapsed') ? '#ff6b6b' : '#ffd166';
        starFlag = {name:starName,team:starTeam,livePct,sznPct:b.sznFGPct,process:processLabel,beneficiary,col};
        break; // Report most impactful star
      }
    }
    if(starFlag){
      sigs.push({key:'T2',w:1,team:starFlag.beneficiary,color:starFlag.col,
        text:starFlag.name+' '+starFlag.livePct.toFixed(0)+'% FG (vs '+starFlag.sznPct.toFixed(0)+'% szn) — process '+starFlag.process});
    } else {
      sigs.push({key:'T2',w:0,team:null,color:'#3e3e48',text:'Stars shooting within range'});
    }
  } else {
    sigs.push({key:'T2*',w:0,team:null,color:'#3e3e48',text:'No baseline data'});
  }

  // T3 — Possession Window Delta (highest weight)
  // PBP-powered: uses last N possessions point differential instead of period boundaries
  // Fallback to quarter/half delta if PBP window unavailable
  var _pw = cardState[game.id]?.pbpWindow;
  var _t3fired = false;
  if(_pw && _pw.available && _pw._raw){
    var _wDelta = _pw._raw.hPts - _pw._raw.aPts;
    var _wSize = _pw.windowPossessions || 25;
    var _t3thresh = Math.max(5, Math.round(_wSize * 0.16));
    if(Math.abs(_wDelta) >= _t3thresh){
      var _t3w = _wDelta>0 ? hA : aA;
      var _t3tr = (_wDelta>0 && overall<0) || (_wDelta<0 && overall>0);
      sigs.push({key:'T3',w:2,team:_t3w,color:'#00ff88',text:_t3w+' +'+Math.abs(_wDelta)+' in last '+_wSize+' poss'+(_t3tr?' (trailing\u2014comeback)':'')});
      _t3fired = true;
    }
  }
  if(!_t3fired){
    if(currQ!=null&&Math.abs(currQ)>=6){var _t3w2=currQ>0?hA:aA,_t3tr2=(currQ>0&&overall<0)||(currQ<0&&overall>0);sigs.push({key:'T3*',w:2,team:_t3w2,color:'#00ff88',text:_t3w2+' winning period by '+Math.abs(currQ)+(_t3tr2?' (trailing\u2014comeback)':'')+' [fallback]'});}
    else sigs.push({key:'T3',w:0,team:null,color:'#3e3e48',text:'Window delta <threshold \u2014 neutral'});
  }

  // T4 — Foul Gate (NCAAMB: 5 personal fouls = disqualification)
  let t4sig = {key:'T4',w:0,team:null,color:'#3e3e48',text:'No foul crisis detected'};
  if(H?.players && A?.players){
    const hFoulouts = (H.players||[]).filter(pl=>pl.fouled_out||pl.statistics?.personal_fouls>=5);
    const aFoulouts = (A.players||[]).filter(pl=>pl.fouled_out||pl.statistics?.personal_fouls>=5);
    if(hFoulouts.length>0){
      const names = hFoulouts.map(pl=>pl.full_name||'?').join(', ');
      t4sig={key:'T4',w:2,team:aA,color:'#ff6b6b',text:names+' FOULED OUT — '+hA+' lost rotation piece'+(hFoulouts.length>1?'s':'')};
    } else if(aFoulouts.length>0){
      const names = aFoulouts.map(pl=>pl.full_name||'?').join(', ');
      t4sig={key:'T4',w:2,team:hA,color:'#ff6b6b',text:names+' FOULED OUT — '+aA+' lost rotation piece'+(aFoulouts.length>1?'s':'')};
    } else {
      const allPlayers = [...(H.players||[]).map(pl=>({...pl,team:hA})),...(A.players||[]).map(pl=>({...pl,team:aA}))];
      for(const pl of allPlayers){
        const pf = pl.statistics?.personal_fouls||0;
        // NCAAMB: 5 fouls out. H1 with 2+ = watch, H1 with 3+ = constraint, H2 with 4 = crisis
        if((p===1&&pf>=2)||(p>=2&&pf>=4)){
          const level=p===1&&pf>=3?'CONSTRAINT':p===1?'WATCH':'CRISIS';
          t4sig={key:'T4',w:1,team:pl.team===hA?aA:hA,color:'#ff6b6b',text:(pl.full_name||'?')+' '+pf+' fouls H'+p+' — '+level+' (5 fouls out)'};
          break;
        }
      }
    }
  }
  sigs.push(t4sig);

  // T5 — Interior Trend (enhanced with PBP at-rim context)
  const hPaint=hs.points_in_the_paint||hs.points_in_paint||0, aPaint=as.points_in_the_paint||as.points_in_paint||0;
  if(Math.abs(hPaint-aPaint)>=8){
    const w=hPaint>aPaint?hA:aA;
    let t5detail=w+' paint +'+(Math.abs(hPaint-aPaint))+' ('+hPaint+'–'+aPaint+')';
    if(pbpD){
      const wRim = w===hA ? pbpD.home?.rim : pbpD.away?.rim;
      if(wRim && wRim.byPlayer && wRim.byPlayer.length>0){
        // Show top rim attacker's context breakdown
        const top = wRim.byPlayer[0];
        const ctxStr = Object.entries(top.contexts||{}).map(([k,v])=>k+':'+v).join('/');
        t5detail += ' | rim: '+wRim.made+'/'+wRim.att+' ('+top.name+' '+top.made+'/'+top.att+' '+ctxStr+')';
      }
    }
    sigs.push({key:'T5',w:1,team:w,color:'#a8ff78',text:t5detail});
  }
  else sigs.push({key:'T5',w:0,team:null,color:'#3e3e48',text:'Paint even ('+hPaint+'–'+aPaint+')'});

  // T6 — Assist Ratio
  const hFGM=hs.field_goals_made||1,aFGM=as.field_goals_made||1;
  const hAR=(hs.assists||0)/hFGM*100, aAR=(as.assists||0)/aFGM*100;
  if(Math.abs(hAR-aAR)>=15){const w=hAR>aAR?hA:aA;sigs.push({key:'T6',w:1,team:w,color:'#a8ff78',text:w+' AR '+Math.max(hAR,aAR).toFixed(0)+'% vs '+Math.min(hAR,aAR).toFixed(0)+'%'});}
  else sigs.push({key:'T6',w:0,team:null,color:'#3e3e48',text:'AR even ('+hAR.toFixed(0)+'% vs '+aAR.toFixed(0)+'%)'});

  // T7 — Closing Lineup (real closer identification)
  let t7sig = {key:'T7',w:0,team:null,color:'#3e3e48',text:'Lineup data pending'};
  if(p>=2 && H?.players && A?.players){
    const hOnCourt = (H.players||[]).filter(pl=>pl.on_court).map(pl=>pl.full_name||'?');
    const aOnCourt = (A.players||[]).filter(pl=>pl.on_court).map(pl=>pl.full_name||'?');
    // Use baselines starters OR structural closers for identification
    const knownClosers = cardState[game.id]?.structural?.closers;
    const knownStarters = bl?.starters;
    const hClosers = knownClosers?.home || knownStarters?.home || [];
    const aClosers = knownClosers?.away || knownStarters?.away || [];
    if(hClosers.length>0 || aClosers.length>0){
      const hCloserCount = hOnCourt.filter(n=>hClosers.some(c=>n.includes(c)||c.includes(n))).length;
      const aCloserCount = aOnCourt.filter(n=>aClosers.some(c=>n.includes(c)||c.includes(n))).length;
      // Get combined +/- of on-court players
      const hPM = (H.players||[]).filter(pl=>pl.on_court).reduce((s,pl)=>s+(pl.statistics?.pls_min||0),0);
      const aPM = (A.players||[]).filter(pl=>pl.on_court).reduce((s,pl)=>s+(pl.statistics?.pls_min||0),0);
      if(hCloserCount>=4 && hPM>0){
        t7sig = {key:'T7',w:1,team:hA,color:'#a8ff78',text:hA+' closing '+hCloserCount+'/5 on floor (+'+ hPM+' combined) — sustained'};
      } else if(aCloserCount>=4 && aPM>0){
        t7sig = {key:'T7',w:1,team:aA,color:'#a8ff78',text:aA+' closing '+aCloserCount+'/5 on floor (+'+aPM+' combined) — sustained'};
      } else if(hCloserCount<=2 && hPM>0){
        t7sig = {key:'T7',w:0,team:null,color:'#ffd166',text:hA+' bench-heavy generating (+'+hPM+') — CONDITIONAL'};
      } else if(aCloserCount<=2 && aPM>0){
        t7sig = {key:'T7',w:0,team:null,color:'#ffd166',text:aA+' bench-heavy generating (+'+aPM+') — CONDITIONAL'};
      } else {
        t7sig.text = hA+': '+hCloserCount+'/'+hClosers.length+' closers ('+hPM+') | '+aA+': '+aCloserCount+'/'+aClosers.length+' ('+aPM+')';
      }
    } else {
      t7sig.text = hA+': '+hOnCourt.length+' on court | '+aA+': '+aOnCourt.length+' on court';
    }
  }
  sigs.push(t7sig);

  // T8 — Shot Diet Misalignment (team-specific thresholds)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const h3r=(hs.three_points_att||0)/hFGA*100, a3r=(as.three_points_att||0)/aFGA*100;
  // Determine thresholds based on team identity
  const struct = cardState[game.id]?.structural;
  let hThreshold=40, aThreshold=40;
  if(bl && bl.built){
    hThreshold = (bl.teamSeason3PARate?.home||35) + (struct?.shotDiet?.home==='INTERIOR'?8:struct?.shotDiet?.home==='PERIMETER'?12:10);
    aThreshold = (bl.teamSeason3PARate?.away||35) + (struct?.shotDiet?.away==='INTERIOR'?8:struct?.shotDiet?.away==='PERIMETER'?12:10);
  }
  if(h3r>=hThreshold){
    let detail = hA+' 3PA/FGA '+h3r.toFixed(0)+'% vs '+hThreshold.toFixed(0)+'% threshold — MISALIGNED';
    if(pbpD){
      const h3 = pbpD.home.threes;
      const astPct = h3.made>0 ? (h3.assisted/h3.made*100).toFixed(0) : '0';
      detail += ' ('+astPct+'% ast)';
    }
    sigs.push({key:'T8',w:1,team:aA,color:'#ff6b6b',text:detail});
  } else if(a3r>=aThreshold){
    let detail = aA+' 3PA/FGA '+a3r.toFixed(0)+'% vs '+aThreshold.toFixed(0)+'% threshold — MISALIGNED';
    if(pbpD){
      const a3 = pbpD.away.threes;
      const astPct = a3.made>0 ? (a3.assisted/a3.made*100).toFixed(0) : '0';
      detail += ' ('+astPct+'% ast)';
    }
    sigs.push({key:'T8',w:1,team:hA,color:'#ff6b6b',text:detail});
  } else {
    let dietNote = hA+' '+h3r.toFixed(0)+'%'+(bl?.built?' (thr:'+hThreshold.toFixed(0)+'%)':'')+' / '+aA+' '+a3r.toFixed(0)+'%'+(bl?.built?' (thr:'+aThreshold.toFixed(0)+'%)':'');
    if(pbpD) dietNote += ' | rim:'+pbpD.home.shotDiet.rimPct+'%/'+pbpD.away.shotDiet.rimPct+'%';
    sigs.push({key:'T8',w:0,team:null,color:'#3e3e48',text:'Diet aligned ('+dietNote+')'});
  }

  const lm={};sigs.forEach(s=>{if(s.team&&s.w>0)lm[s.team]=(lm[s.team]||0)+s.w;});
  const sorted=Object.entries(lm).sort((a,b)=>b[1]-a[1]),lean=sorted.length>0?sorted[0][0]:'NEUTRAL';
  const count=sigs.filter(s=>s.team===lean&&s.w>0).length,total=sigs.filter(s=>s.w>0).length;
  return {signals:sigs, lean, count, total, tooEarly:false};
}
