// NTFY PUSH NOTIFICATIONS
// ══════════════════════════════════════════════════════════════════════════════
let ntfyTopic = localStorage.getItem('ncaamb:ntfy:topic') || '';
let ntfyEnabled = !!ntfyTopic;
let ntfyMinEdge = parseFloat(localStorage.getItem('ncaamb:ntfy:minEdge')) || 3.0;
// Restore UI state
if(ntfyEnabled){
  setTimeout(()=>{
    const btn = document.getElementById('btn-ntfy');
    if(btn){ btn.style.color='var(--green)'; btn.style.borderColor='var(--green)'; }
  }, 100);
}

function configNtfy(){
  const current = ntfyTopic || '(not set)';
  const topic = prompt('ntfy.sh topic name for push alerts:\n\nCurrent: ' + current + '\nMin edge: ' + ntfyMinEdge + '%\n\nEnter topic (or "off" to disable, "edge:X" to change min edge):', ntfyTopic);
  if(topic === null) return; // cancelled
  const trimmed = topic.trim();
  if(trimmed.toLowerCase() === 'off' || trimmed === ''){
    ntfyTopic = ''; ntfyEnabled = false;
    localStorage.removeItem('ncaamb:ntfy:topic');
    document.getElementById('btn-ntfy').style.color='var(--t3)';
    document.getElementById('btn-ntfy').style.borderColor='var(--t3)';
    alert('Alerts disabled.');
    return;
  }
  if(trimmed.toLowerCase().startsWith('edge:')){
    const val = parseFloat(trimmed.substring(5));
    if(!isNaN(val) && val >= 0){
      ntfyMinEdge = val;
      localStorage.setItem('ncaamb:ntfy:minEdge', String(val));
      alert('Min edge set to ' + val + '%');
    }
    return;
  }
  ntfyTopic = trimmed;
  ntfyEnabled = true;
  localStorage.setItem('ncaamb:ntfy:topic', trimmed);
  document.getElementById('btn-ntfy').style.color='var(--green)';
  document.getElementById('btn-ntfy').style.borderColor='var(--green)';
  // Send test notification
  sendNtfyRaw('NBA Control — alerts active', 'Topic: ' + trimmed + ' | Min edge: ' + ntfyMinEdge + '%', 2);
  alert('Alerts enabled! Check your ntfy app for a test notification.\n\nTopic: ' + trimmed + '\nMin edge: ' + ntfyMinEdge + '%');
}

function sendNtfyRaw(title, body, priority){
  if(!ntfyTopic) return;
  fetch('https://ntfy.sh', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      topic: ntfyTopic,
      title: title,
      message: body,
      priority: priority || 3,
      tags: ['basketball'],
    }),
  }).then(function(r){
    if(!r.ok) console.warn('ntfy response:', r.status);
    else console.log('ntfy sent OK');
  }).catch(function(e){ console.warn('ntfy send failed:', e.message); });
}

function checkNtfyAlert(game, decision){
  if(!ntfyEnabled || !decision) return;
  const entry = (decision.entry||'').toUpperCase();
  const signal = decision.signalType||'';
  const edge = decision.edgeNum;
  const isBuy = signal.startsWith('BUY');
  const isOptimal = entry === 'OPTIMAL WINDOW';
  const isOpen = entry === 'WINDOW OPEN';

  // Fire on: OPTIMAL WINDOW or WINDOW OPEN with a BUY signal and edge above threshold
  if(!isBuy || (!isOptimal && !isOpen)) return;
  if(edge !== null && edge < ntfyMinEdge) return;

  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const score = aA + ' ' + (game.awayPoints||0) + '-' + (game.homePoints||0) + ' ' + hA;
  const qClock = game.period ? 'H' + game.period + (game.clock ? ' ' + game.clock : '') : '';
  const edgeStr = edge !== null ? '+' + edge.toFixed(1) + '%' : '';
  const sust = decision.sustainability || '';
  const conviction = decision.conviction || '';

  const title = signal + ' — ' + entry;
  const body = score + ' ' + qClock
    + '\nEdge: ' + edgeStr + ' | ' + conviction
    + '\n' + sust
    + (decision.prediction ? '\n' + decision.prediction.substring(0, 100) : '');

  const priority = isOptimal ? 5 : 4; // 5=urgent, 4=high
  sendNtfyRaw(title, body, priority);
  console.log('NTFY sent:', title, body);
}



// ══════════════════════════════════════════════════════════════════════════════
// CLIENT QA — modal overlay for live card state validation
// NCAAMB: halves (H1/H2), elapsed-time gate (10 min), sznDefault 33%
// ══════════════════════════════════════════════════════════════════════════════
function runClientQA(gameId){
  if(!gameId){ if(selIds && selIds[0]) gameId=selIds[0]; else { alert('Select a game first'); return; } }
  var g = games.find(function(x){return x.id===gameId;});
  if(!g){ alert('Game not found: '+gameId); return; }
  var cs = cardState[gameId];
  if(!cs){ alert('No cardState for game'); return; }
  var hA = g.home?.alias||'HOME', aA = g.away?.alias||'AWAY';
  var results = [];
  var pass=0, fail=0, warn=0;

  function ok(label, detail){ results.push({s:'PASS',l:label,d:detail||''}); pass++; }
  function bad(label, detail){ results.push({s:'FAIL',l:label,d:detail||''}); fail++; }
  function meh(label, detail){ results.push({s:'WARN',l:label,d:detail||''}); warn++; }

  // Period label helper (NCAAMB: halves)
  var period = g.period || 0;
  var periodLabel = period===1?'H1':period===2?'H2':period>2?'OT':'PRE';

  // Elapsed time (for threshold checks)
  var GAME_MINUTES = 40, PERIOD_MINUTES = 20;
  var clockParts = (g.clock||'').split(':');
  var clockMins = clockParts.length===2 ? (parseInt(clockParts[0])||0)+((parseInt(clockParts[1])||0)/60) : PERIOD_MINUTES;
  var periodsLeft = Math.max(0, 2 - period);
  var minsLeft = clockMins + (periodsLeft * PERIOD_MINUTES);
  var minsElapsed = Math.max(0, GAME_MINUTES - minsLeft);

  // ── 1. FLOOR SCORE ──
  var ind = getFloor(cs);
  if(ind && ind.score != null){
    var src = cs.sonnetIndicators ? 'SONNET' : cs.clientInd ? 'CLIENT' : cs._serverFloor ? 'SERVER' : (cs.rollingWindow && cs.rollingWindow.available) ? 'WINDOW' : '?';
    ok('Floor score', ind.controlTeam + ' ' + ind.score.toFixed(2) + ' (' + src + ')');
  } else { bad('Floor score', 'No indicator data \u2014 no floor, PBP, or Sonnet analysis'); }

  // ── 2. QTR WINDOW (server-authoritative) ──
  var rw = cs.rollingWindow;
  if(rw && rw.available){
    var rwSrc = rw.source || rw.dataQuality || '?';
    ok('QTR window', rw.controlTeam + ' ' + rw.score.toFixed(2) + ' | source: ' + rwSrc);
  } else if(rw && rw.reason){
    meh('QTR window', 'Not available: ' + rw.reason);
  } else {
    meh('QTR window', 'Null \u2014 waiting for server hydration');
  }

  // ── 3. PBP WINDOW ──
  var pw = cs.pbpWindow;
  if(pw && pw.available){
    ok('PBP window', pw.controlTeam + ' ' + pw.score.toFixed(2) + ' | ' + (pw.windowPossessions||0) + ' poss');
  } else if(pw && pw.reason){
    meh('PBP window', 'Not available: ' + pw.reason);
  } else {
    meh('PBP window', 'Null \u2014 no PBP data fetched yet');
  }

  // ── 4. SONNET INDICATORS ──
  if(cs.sonnetIndicators && cs.sonnetIndicators.score != null){
    var si = cs.sonnetIndicators;
    ok('Sonnet indicators', si.controlTeam + ' ' + si.score.toFixed(2) + ' | I1:' + (si.I1?.score||'?') + ' I2:' + (si.I2?.score||'?') + ' I3:' + (si.I3?.score||'?') + ' I4:' + (si.I4?.score||'?') + ' I5:' + (si.I5?.score||'?'));
  } else {
    meh('Sonnet indicators', 'Not populated \u2014 press ANALYZE or wait for server auto-analysis');
  }

  // ── 5. PREDICTION + EDGE ──
  var pred = cs.prediction;
  if(pred){
    var edgeVal = pred.edgeNum;
    if(edgeVal != null && !isNaN(edgeVal)){
      ok('Edge', (edgeVal >= 0 ? '+' : '') + edgeVal.toFixed(1) + '% | FWP: ' + (pred.fwp||'?') + ' | MIP: ' + (pred.mip||'?'));
    } else {
      meh('Edge', 'edgeNum is null/NaN \u2014 prediction exists but edge not computed');
    }
    ok('Prediction', (pred.signalType||'?') + ' | entry: ' + (pred.entry||'?') + ' | conviction: ' + (pred.conviction||'?'));
  } else {
    meh('Prediction', 'Not hydrated \u2014 no Sonnet analysis yet');
  }

  // ── 6. SUSTAINABILITY ──
  var sust = cs.clientSustainability;
  var sa = cs.sustainabilityAudit;
  if(sust && (sust.home?.tier || sust.away?.tier)){
    ok('Sustainability', hA + ': ' + (sust.home?.tier||'?') + ' | ' + aA + ': ' + (sust.away?.tier||'?') + ' (clientSustainability)');
  } else if(sa && (sa.home?.tier || sa.away?.tier)){
    meh('Sustainability', hA + ': ' + (sa.home?.tier||'?') + ' | ' + aA + ': ' + (sa.away?.tier||'?') + ' (sustainabilityAudit fallback)');
  } else {
    bad('Sustainability', 'No sustainability data \u2014 neither clientSustainability nor sustainabilityAudit populated');
  }

  // ── 7. THROUGHPUT / LEAD SAFETY ──
  // NCAAMB uses elapsed-time gate (>=10 min) instead of period>=2
  var tp = cs.throughput;
  var ls = cs.leadSafety;
  if(tp){
    if(!isNaN(tp.conservative?.totalSwing) && !isNaN(tp.expected?.totalSwing)){
      ok('Throughput', tp.classification + ' | +' + Math.round(tp.conservative.totalSwing) + '/+' + Math.round(tp.expected.totalSwing) + '/+' + Math.round(tp.optimistic.totalSwing) + ' vs ' + tp.deficit + ' deficit | ' + tp.remainingPoss + ' poss');
    } else {
      bad('Throughput', 'Values are NaN \u2014 computeSwingCore returned garbage');
    }
  } else if(ls){
    if(!isNaN(ls.conservative?.totalSwing) && !isNaN(ls.expected?.totalSwing)){
      ok('Lead safety', ls.classification + ' | +' + Math.round(ls.conservative.totalSwing) + '/+' + Math.round(ls.expected.totalSwing) + '/+' + Math.round(ls.optimistic.totalSwing) + ' vs ' + ls.lead + ' lead | ' + ls.remainingPoss + ' poss');
    } else {
      bad('Lead safety', 'Values are NaN \u2014 computeSwingCore returned garbage');
    }
  } else {
    var margin = Math.abs((g.homePoints||0) - (g.awayPoints||0));
    if(minsElapsed >= 10 && margin >= 2){
      meh('Throughput/Lead safety', 'Null despite ' + Math.round(minsElapsed) + ' min elapsed, margin ' + margin + ' \u2014 check floor score exists');
    } else {
      ok('Throughput/Lead safety', 'N/A (' + Math.round(minsElapsed) + ' min elapsed, margin ' + margin + ')');
    }
  }

  // ── 8. COMBINED READ ──
  var cr = cs.combinedRead;
  if(cr && cr.read && cr.read !== 'TOO EARLY'){
    ok('Combined read', cr.read + (cr.note ? ' \u2014 ' + cr.note : ''));
  } else if(cr && cr.read === 'TOO EARLY'){
    meh('Combined read', 'TOO EARLY \u2014 window not yet available');
  } else {
    meh('Combined read', 'Null');
  }

  // ── 9. PBP AUDIT ──
  var pbpA = cs.pbpAudit;
  if(pbpA && pbpA.home && pbpA.away){
    var age = cs.pbpTime ? Math.round((Date.now() - cs.pbpTime.getTime()) / 60000) : '?';
    ok('PBP audit', pbpA.totalShots + ' shots, ' + pbpA.totalTOs + ' TOs, ' + (pbpA.runs||[]).length + ' runs | ' + periodLabel + ' | ' + age + 'm ago');
  } else {
    meh('PBP audit', 'Not populated \u2014 BDL plays not fetched');
  }

  // ── 10. ODDS ──
  if(cs.oddsData && cs.oddsData.homeSpread){
    ok('Odds', hA + ' ' + cs.oddsData.homeSpread + ' | ML ' + (cs.oddsData.homeML||'?') + '/' + (cs.oddsData.awayML||'?') + ' | O/U ' + (cs.oddsData.total||'?'));
  } else {
    meh('Odds', 'Not populated');
  }

  // ── 11. ARROWS ──
  var arrows = cs.subMetricArrows;
  if(arrows && arrows.home && arrows.away){
    var rising = 0, falling = 0;
    ['home','away'].forEach(function(side){
      Object.values(arrows[side]).forEach(function(a){ if(a.arrow==='RISING') rising++; if(a.arrow==='FALLING') falling++; });
    });
    ok('Sub-metric arrows', rising + ' rising, ' + falling + ' falling');
  } else {
    meh('Sub-metric arrows', 'Not populated');
  }

  // ── 12. SYNTHESIZER ──
  var synth = cs._lastSynth;
  if(!synth){
    var synthResult = synthesize(g);
    if(synthResult){
      ok('Synthesizer', synthResult.action + ' | ' + synthResult.fTeam + ' ' + synthResult.fScore.toFixed(2) + ' | conf: ' + synthResult.confidence);
    } else {
      meh('Synthesizer', 'Returns null \u2014 likely missing floor score');
    }
  } else {
    ok('Synthesizer', synth.action + ' | ' + synth.fTeam + ' ' + synth.fScore.toFixed(2));
  }

  // ── 13. LEAD COMPOSITION ──
  var lc = cs.clientLeadComposition || cs.leadComposition;
  if(lc && lc.classification){
    ok('Lead composition', lc.classification + ' | S:' + (lc.structuralPct||0) + '% V:' + (lc.variancePct||0) + '%');
  } else {
    meh('Lead composition', 'Not computed');
  }

  // ── 14. SERVER QUARTER DIFFS (per-quarter boundary data) ──
  var sqd = cs._serverQuarterDiffs;
  if(sqd && Object.keys(sqd).length > 0){
    var qdKeys = Object.keys(sqd).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b;});
    var hasHome = qdKeys.every(function(k){ return sqd[k] && sqd[k].home && Object.keys(sqd[k].home).length > 0; });
    var hasAway = qdKeys.every(function(k){ return sqd[k] && sqd[k].away && Object.keys(sqd[k].away).length > 0; });
    if(hasHome && hasAway){
      ok('Quarter diffs', qdKeys.length + ' quarters [' + qdKeys.join(',') + '] — home+away stats present');
    } else {
      bad('Quarter diffs', qdKeys.length + ' quarters but missing ' + (!hasHome ? 'home' : '') + (!hasAway ? 'away' : '') + ' stats');
    }
    var q1d = sqd[qdKeys[0]];
    if(q1d && q1d.home){
      var hasI1 = q1d.home.steals != null || q1d.home.turnovers != null;
      var hasI2 = q1d.home.points_in_the_paint != null || q1d.home.points_in_paint != null || q1d.home.free_throws_att != null;
      var hasI3 = q1d.home.three_points_made != null || q1d.home.assists != null;
      if(hasI1 && hasI2 && hasI3) ok('QD field coverage', 'I1/I2/I3 fields present in diffs');
      else meh('QD field coverage', 'Missing: ' + (!hasI1?'I1 ':'') + (!hasI2?'I2 ':'') + (!hasI3?'I3 ':''));
    }
  } else {
    meh('Quarter diffs', 'Not hydrated — cs._serverQuarterDiffs empty');
  }

  // ── 15. PER-QUARTER BREAKDOWN RENDER ──
  var qbHtml = renderQuarterBreakdown(gameId, cs, hA, aA);
  if(qbHtml && qbHtml.length > 50){
    ok('QD render', 'Per-quarter breakdown renders (' + qbHtml.length + ' chars)');
  } else if(sqd && Object.keys(sqd).length > 0){
    bad('QD render', 'Quarter diffs exist but renderQuarterBreakdown returned empty');
  } else {
    meh('QD render', 'No quarter diffs to render');
  }

  // ── RENDER MODAL ──
  var existing = document.getElementById('qa-modal');
  if(existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.id = 'qa-modal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.85);overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch';
  overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };

  var h = '<div style="max-width:500px;margin:0 auto;font-family:var(--mono)">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  h += '<div style="font-size:11px;font-weight:700;color:#818cf8;letter-spacing:2px">CLIENT QA</div>';
  h += '<div style="font-size:9px;color:var(--t2)">' + aA + ' @ ' + hA + ' | ' + periodLabel + ' ' + (g.clock||'') + ' | ' + Math.round(minsElapsed) + 'min</div>';
  h += '<button onclick="this.closest(\'#qa-modal\').remove()" style="background:none;border:1px solid var(--t3);color:var(--t2);font-size:10px;padding:3px 8px;cursor:pointer;border-radius:3px">CLOSE</button>';
  h += '</div>';

  var sumColor = fail > 0 ? '#ff5252' : warn > 0 ? '#ffab40' : '#00ff88';
  h += '<div style="padding:6px 10px;margin-bottom:8px;border-radius:4px;border:1px solid ' + sumColor + ';background:rgba(255,255,255,.03)">';
  h += '<span style="font-size:10px;font-weight:700;color:' + sumColor + '">' + pass + ' PASS</span>';
  if(fail > 0) h += ' <span style="font-size:10px;font-weight:700;color:#ff5252">' + fail + ' FAIL</span>';
  if(warn > 0) h += ' <span style="font-size:10px;font-weight:700;color:#ffab40">' + warn + ' WARN</span>';
  h += '</div>';

  results.forEach(function(r){
    var color = r.s === 'PASS' ? '#00ff88' : r.s === 'FAIL' ? '#ff5252' : '#ffab40';
    var bg = r.s === 'FAIL' ? 'rgba(255,82,82,.08)' : 'transparent';
    h += '<div style="padding:5px 8px;margin-bottom:2px;border-left:2px solid ' + color + ';background:' + bg + '">';
    h += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
    h += '<span style="font-size:8px;font-weight:600;color:' + color + '">' + r.s + '</span>';
    h += '<span style="font-size:8px;font-weight:600;color:var(--t1)">' + r.l + '</span>';
    h += '</div>';
    if(r.d) h += '<div style="font-size:7px;color:var(--t3);margin-top:1px;word-break:break-word">' + r.d + '</div>';
    h += '</div>';
  });

  h += '</div>';
  overlay.innerHTML = h;
  document.body.appendChild(overlay);
}
