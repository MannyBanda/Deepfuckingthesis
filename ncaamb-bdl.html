// ══════════════════════════════════════════════════════════════════════════════
// FLOOR HELPER — safe accessor for sonnetIndicators/clientInd/serverFloor
// Guards against truthy objects with score:undefined
// ══════════════════════════════════════════════════════════════════════════════
function getFloor(cs){if(!cs)return null;if(cs.clientInd&&cs.clientInd.score!=null)return cs.clientInd;if(cs._serverFloor&&cs._serverFloor.score!=null)return cs._serverFloor;if(cs.rollingWindow&&cs.rollingWindow.available&&cs.rollingWindow.score!=null)return{score:cs.rollingWindow.score,controlTeam:cs.rollingWindow.controlTeam,I1:cs.rollingWindow.I1,I2:cs.rollingWindow.I2,I3:cs.rollingWindow.I3,I4:cs.rollingWindow.I4,I5:cs.rollingWindow.I5,source:cs.rollingWindow.source||'window'};return null;}

function computeConviction(ind){
  if(!ind||ind.score==null)return{tier:'NO ENTRY',combo:'NONE',count:0,indicatorsWon:[],indicatorsLost:[],pairs:[],isDanger:false};
  var ctrlHome=ind.controlTeam===(ind.homeAlias||'HOME');
  var wins=[],loses=[],even=[];
  var keys=[['I1',ind.I1],['I2',ind.I2],['I3',ind.I3],['I4',ind.I4],['I5',ind.I5]];
  keys.forEach(function(kv){
    var k=kv[0],val=kv[1];
    if(!val||val.score==null){even.push(k);return;}
    var cs2=ctrlHome?val.score:1-val.score;
    if(cs2>0.5)wins.push(k);else if(cs2<0.5)loses.push(k);else even.push(k);
  });
  var count=wins.length;
  function has(a,b){return wins.indexOf(a)>=0&&wins.indexOf(b)>=0;}
  var combo=count>0?wins.join('+'):'NONE';
  var hasI4I5=has('I4','I5'),hasI3I4=has('I3','I4'),hasI3I5=has('I3','I5');
  var hasKillerPair=hasI4I5||hasI3I4||hasI3I5;
  var isDanger=(count===2&&wins.indexOf('I1')>=0&&wins.indexOf('I5')>=0&&wins.indexOf('I3')<0&&wins.indexOf('I4')<0)||(count===3&&wins.indexOf('I1')>=0&&wins.indexOf('I2')>=0&&wins.indexOf('I5')>=0&&wins.indexOf('I3')<0&&wins.indexOf('I4')<0)||(count===3&&wins.indexOf('I2')>=0&&wins.indexOf('I3')>=0&&wins.indexOf('I5')>=0&&wins.indexOf('I4')<0);
  var tier;
  if(count>=4||hasI4I5)tier='DOMINANT';
  else if(hasKillerPair&&!isDanger)tier='STRONG';
  else if(count>=2&&!isDanger)tier='MODEST';
  else if(count>=1)tier='CONDITIONAL';
  else tier='NO ENTRY';
  var pairs=[];if(hasI4I5)pairs.push('I4+I5');if(hasI3I4)pairs.push('I3+I4');if(hasI3I5)pairs.push('I3+I5');
  return{tier:tier,combo:combo,count:count,indicatorsWon:wins,indicatorsLost:loses,indicatorsEven:even,pairs:pairs,isDanger:isDanger};
}

// ══════════════════════════════════════════════════════════════════════════════
// DECISION SYNTHESIZER — resolves all signals into one actionable read
// ══════════════════════════════════════════════════════════════════════════════
function synthesize(game){
  var cs = cardState[game.id]; if(!cs) return null;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hPts = game.homePoints||0, aPts = game.awayPoints||0;
  var state = getState(game);
  if(state==='PRE') return null;

  // ── GATHER INPUTS ──
  var floor = getFloor(cs);
  var pbp = cs.pbpWindow;
  var ewp = cs.espnWP;
  var sust = cs.clientSustainability;
  var od = cs.oddsData;
  var accel = cs.acceleration;
  var period = game.period || 1;

  // Need at minimum a floor read
  if(!floor || !floor.score) return null;

  var fScore = floor.score;
  var fTeam = floor.controlTeam;

  // ── VOLUME THREAT — compute early, store on cs for TP/LS to read ──
  var vtResult = computeVolumeThreat(game);
  cs.volumeThreat = vtResult;
  var vtActive = false, vtDiscount = 0, vtTeam = null;
  if(vtResult){
    var ctrlIsHomeVT = fTeam === hA;
    var oppVT = ctrlIsHomeVT ? vtResult.away : vtResult.home;
    if(oppVT && oppVT.active && oppVT.discount > 0){
      vtActive = true;
      vtDiscount = oppVT.discount;
      vtTeam = ctrlIsHomeVT ? aA : hA;
      fScore = Math.round(fScore * (1 - vtDiscount) * 100) / 100;
    }
  }

  var fVerdict = fScore>=0.90?'DOMINANT':fScore>=0.75?'STRONG':fScore>=0.60?'EARNED':'WEAK';
  var oppTeam = fTeam === hA ? aA : hA;

  // Score state
  var ctrlIsHome = fTeam === hA;
  var ctrlPts = ctrlIsHome ? hPts : aPts;
  var oppPts = ctrlIsHome ? aPts : hPts;
  var margin = ctrlPts - oppPts; // positive = structural team leading
  var trailing = margin < 0;
  var deficit = Math.abs(margin);

  // ── PBP AGREEMENT ──
  var pbpAvail = pbp && pbp.available && pbp.score;
  var pbpAgrees = pbpAvail && pbp.controlTeam === fTeam;
  var pbpDisagrees = pbpAvail && pbp.controlTeam !== fTeam;
  var pbpScore = pbpAvail ? pbp.score : null;
  var pbpGap = pbpAvail && pbpAgrees ? (pbp.score - fScore) : pbpAvail ? -(pbp.score) : null;


  // ── SUSTAINABILITY ──
  // Check both client sustainability and Sonnet's sustainability audit
  var sa = cs.sustainabilityAudit;
  var leadSide = hPts >= aPts ? 'home' : 'away';
  var trailSide = leadSide === 'home' ? 'away' : 'home';
  var leadSust = sust?.[leadSide]?.tier || sa?.[leadSide]?.tier || null;
  var trailSust = sust?.[trailSide]?.tier || sa?.[trailSide]?.tier || null;
  var ctrlSust = (ctrlIsHome ? sust?.home?.tier : sust?.away?.tier) || (ctrlIsHome ? sa?.home?.tier : sa?.away?.tier) || null;
  var oppSust = (ctrlIsHome ? sust?.away?.tier : sust?.home?.tier) || (ctrlIsHome ? sa?.away?.tier : sa?.home?.tier) || null;

  // ── ESPN WP ──
  var espnPct = null, espnTeam = null;
  if(ewp){
    espnTeam = ewp.home >= ewp.away ? hA : aA;
    espnPct = Math.max(ewp.home, ewp.away);
  }

  // ── MISSING DATA ──
  var missing = [];
  if(!pbpAvail) missing.push('PBP');
  if(!ewp) missing.push('ESPN');
  if(!od) missing.push('ODDS');
  if(!sust && !sa) missing.push('SUST');

  // ── RESOLVE: Build the synthesis ──
  var control = fTeam + ' ' + fScore.toFixed(2) + ' ' + fVerdict;
  var lines = [];
  var action = null;
  var actionColor = 'var(--t3)';
  var triggers = [];

  // Confidence based on agreement
  var confidence = 'LOW';
  if(fScore >= 0.70 && pbpAgrees) confidence = 'HIGH';
  else if(fScore >= 0.70 && !pbpAvail) confidence = 'MODERATE';
  else if(fScore >= 0.60 && pbpAgrees) confidence = 'MODERATE';
  else if(fScore >= 0.60) confidence = 'LOW';

  // Lead quality
  var leadQuality = null;
  if(trailing){
    lines.push(fTeam + ' trailing by ' + deficit + (period >= 3 ? ' in ' + ({3:'Q3',4:'Q4',5:'OT'}[period]||'Q'+period) : '') + '.');
  } else if(deficit === 0){
    lines.push('Game tied.');
  } else {
    var sustNote = '';
    var lc = cs.clientLeadComposition || cs.leadComposition;
    if(lc && lc.classification){
      var cls = lc.classification;
      if(cls === 'STRUCTURAL') sustNote = 'Lead is STRUCTURAL — paint/FT driven.';
      else if(cls === 'IDENTITY') sustNote = 'Lead is IDENTITY scoring — sustainable perimeter.';
      else if(cls === 'HOT') sustNote = 'Lead is elevated but credible shooting.';
      else if(cls === 'VOLATILE') sustNote = 'Lead is VOLATILE — variance-driven, regression likely.';
      else if(cls === 'EVEN') sustNote = 'Margin too small to classify.';
      else sustNote = 'Lead is MIXED source.';
    } else if(leadSust === 'LOCKED' || leadSust === 'DURABLE') sustNote = 'Lead shooting is sustainable.';
    else if(leadSust === 'FRAGILE' || leadSust === 'UNSUSTAINABLE') sustNote = 'Lead is FRAGILE — variance-driven.';
    else if(leadSust === 'MIXED') sustNote = 'Lead is MIXED source.';
    else sustNote = 'Lead source unclear.';
    lines.push(fTeam + ' leads by ' + deficit + '. ' + sustNote);
  }

  // Window agreement narrative
  if(pbpAgrees && pbpScore >= 0.65){
    lines.push('PBP window confirms momentum (' + pbp.controlTeam + ' ' + pbpScore.toFixed(2) + ').');
  } else if(pbpDisagrees){
    lines.push('PBP window disagrees — ' + pbp.controlTeam + ' ' + pbpScore.toFixed(2) + ' in recent possessions.');
  } else if(!pbpAvail && period >= 2){
    lines.push('PBP window unavailable — waiting for data.');
  }

  // Opponent + trailing team profiles
  if(trailing){
    var oppProfile = oppSust ? (oppSust === 'FRAGILE' || oppSust === 'UNSUSTAINABLE' ? oppTeam + ' lead is ' + oppSust + ' — regression likely.' : oppSust === 'LOCKED' || oppSust === 'DURABLE' ? oppTeam + ' lead looks ' + oppSust + ' — caution.' : '') : '';
    if(oppProfile) lines.push(oppProfile);
    // Trailing team's own sustainability — can they actually come back?
    if(ctrlSust){
      if(ctrlSust === 'UNSUSTAINABLE' || ctrlSust === 'FRAGILE'){
        lines.push(fTeam + ' own shooting is ' + ctrlSust + ' — comeback capacity limited.');
      } else if(ctrlSust === 'COLD'){
        lines.push(fTeam + ' shooting COLD — can\'t convert from 2PT or 3PT. Regression unreliable.');
      } else if(ctrlSust === 'LOCKED' || ctrlSust === 'DURABLE'){
        lines.push(fTeam + ' shooting ' + ctrlSust + ' — has the fuel to close gap.');
      }
    }
  }

  // ESPN alignment
  if(ewp && espnPct){
    if(espnTeam === fTeam && espnPct >= 70){
      lines.push('ESPN model agrees (' + espnPct + '%).');
    } else if(espnTeam !== fTeam && espnPct >= 60){
      lines.push('ESPN model favors ' + espnTeam + ' (' + espnPct + '%) — our structural read diverges.');
    }
  }

  // ── DECISION TREE ──
  var sustFragile = oppSust === 'FRAGILE' || oppSust === 'UNSUSTAINABLE';
  var sustLocked = oppSust === 'LOCKED' || oppSust === 'DURABLE';
  var inBuyRange = deficit >= 4 && deficit <= 15;

  // Check if trailing (structural) team's own shooting is sustainable enough to mount comeback
  var ctrlFragile = ctrlSust === 'FRAGILE' || ctrlSust === 'UNSUSTAINABLE';
  var ctrlLocked = ctrlSust === 'LOCKED' || ctrlSust === 'DURABLE';
  var sustMissing = !oppSust && !ctrlSust; // neither side has sustainability data

  // ── NULL SUSTAINABILITY GATE ──
  // If we're in the entry zone but have no sustainability data, we can't make a real call.
  // Produce DEVELOPING instead of a premature weaker action.
  if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustMissing){
    action = 'DEVELOPING'; actionColor = 'var(--yellow)';
    lines.push('Entry conditions forming but sustainability data missing — cannot classify lead quality.');
    triggers.push('Press ⚡ ANALYZE for Sonnet sustainability read');
    triggers.push('Wait for season cache to load baselines');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustFragile && !ctrlFragile){
    action = 'BUY'; actionColor = 'var(--green)';
    lines.push(fTeam + ' structural edge + opponent variance = entry signal.' + (ctrlLocked ? ' ' + fTeam + ' shooting ' + ctrlSust + '.' : ''));
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustFragile && ctrlFragile){
    action = 'CAUTION'; actionColor = 'var(--amber)';
    lines.push('Both teams shooting unsustainably — ' + oppTeam + ' ' + (oppSust||'FRAGILE') + ', ' + fTeam + ' ' + (ctrlSust||'FRAGILE') + '. Mutual regression risk.');
    triggers.push(fTeam + ' sustainability upgrades');
    triggers.push('Deficit narrows below 4');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && !sustFragile && !sustLocked && !ctrlFragile){
    action = 'LEAN BUY'; actionColor = 'var(--g2)';
    triggers.push(oppTeam + ' sustainability degrades to FRAGILE');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && !sustFragile && !sustLocked && ctrlFragile){
    action = 'WATCH'; actionColor = 'var(--amber)';
    lines.push(fTeam + ' controls structurally but own shooting is ' + (ctrlSust||'FRAGILE') + ' — comeback fuel questionable.');
    triggers.push(fTeam + ' sustainability upgrades');
    triggers.push(oppTeam + ' sustainability degrades');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustLocked){
    action = 'CAUTION'; actionColor = 'var(--amber)';
    lines.push(oppTeam + ' lead is structurally sound — risky entry.');
    triggers.push(oppTeam + ' sustainability degrades');
    triggers.push('Deficit narrows below 4');
  } else if(fScore >= 0.70 && trailing && deficit > 15){
    action = 'TOO DEEP'; actionColor = 'var(--red)';
    lines.push('Deficit exceeds structural recovery range.');
    triggers.push('Deficit narrows to 10-15');
  } else if(fScore >= 0.70 && !trailing && deficit >= 2){
    // Edge-based: check if there's still betting value on the leading structural team
    var _pred = cs.prediction;
    var ctrlEdge = null;
    if(_pred && _pred.homeValue && _pred.awayValue){
      ctrlEdge = ctrlIsHome ? _pred.homeValue.edge : _pred.awayValue.edge;
    }
    if(ctrlEdge !== null && ctrlEdge > 0){
      action = 'BUY WINDOW CLOSING'; actionColor = 'var(--g2)';
      lines.push(fTeam + ' leads by ' + deficit + ' with +' + ctrlEdge.toFixed(1) + '% edge — value remains but window narrowing.');
    } else if(ctrlEdge !== null && ctrlEdge <= 0){
      action = 'NO VALUE'; actionColor = 'var(--t2)';
      lines.push(fTeam + ' leads by ' + deficit + '. Edge ' + (ctrlEdge >= 0 ? '+' : '') + ctrlEdge.toFixed(1) + '% — market already prices advantage.');
    } else if(_pred && _pred.garbageLine){
      action = 'NO VALUE'; actionColor = 'var(--t2)';
      lines.push(fTeam + ' leads by ' + deficit + '. Line dead — market not pricing actionable odds.');
    } else {
      // No edge data yet (no odds or no analysis)
      action = 'DEVELOPING'; actionColor = 'var(--yellow)';
      lines.push(fTeam + ' leads by ' + deficit + ' — awaiting edge data.');
      triggers.push('Press ANALYZE for Sonnet FWP + edge calculation');
    }
  } else if(fScore >= 0.70 && pbpDisagrees){
    action = 'WAIT'; actionColor = 'var(--yellow)';
    lines.push('Floor and window disagree — momentum shifting.');
    triggers.push('PBP flips to agree with floor');
    triggers.push('PBP sustains ' + pbp.controlTeam + ' control for 10+ possessions');
  } else if(fScore >= 0.70 && !pbpAvail){
    action = 'DEVELOPING'; actionColor = 'var(--yellow)';
    triggers.push('PBP data arrives and confirms floor');
  } else if(fScore >= 0.60 && pbpAgrees && trailing && inBuyRange){
    action = 'WATCH'; actionColor = 'var(--amber)';
    lines.push('Floor building but not yet decisive.');
    triggers.push('Floor reaches 0.70+');
    triggers.push(fTeam + ' wins I1 or I2');
  } else if(fScore >= 0.60){
    action = 'DEVELOPING'; actionColor = 'var(--yellow)';
    triggers.push('Floor strengthens past 0.70');
  } else {
    action = 'NO EDGE'; actionColor = 'var(--t3)';
    // Note favorable sustainability pattern even without floor edge
    if(trailing && oppSust && (oppSust === 'FRAGILE' || oppSust === 'UNSUSTAINABLE') && ctrlSust && (ctrlSust === 'LOCKED' || ctrlSust === 'DURABLE')){
      lines.push('Sustainability favors ' + fTeam + ' (' + oppTeam + ' ' + oppSust + ', ' + fTeam + ' ' + ctrlSust + ') but floor too low to act.');
      triggers.push('Floor reaches 0.60+');
    }
  }

  // ── THROUGHPUT RECOVERY GATE ──
  // After decision tree resolves action, compute whether the trailing team's
  // structural engine can actually close the deficit across remaining possessions.
  // Uses conservative (25th percentile) band to gate — does the math work even if regression is slow?
  var throughput = null;
  if(trailing && deficit > 0 && period >= 1){
    throughput = computeThroughput(game);
  }

  if(throughput && (action === 'BUY' || action === 'LEAN BUY' || action === 'WATCH')){
    var tpClass = throughput.classification;
    var conSwing = throughput.conservative.totalSwing;
    var expSwing = throughput.expected.totalSwing;
    var optSwing = throughput.optimistic.totalSwing;

    if(tpClass === 'STRONG RECOVERY' || tpClass === 'PROBABLE'){
      // Math works — add confirmation to narrative
      lines.push('Engine ' + fmtSwing(conSwing) + ' / ' + fmtSwing(expSwing) + ' / ' + fmtSwing(optSwing) + ' vs ' + deficit + ' deficit (' + throughput.remainingPoss + ' poss) — ' + tpClass + '.');
    } else if(tpClass === 'CONTESTED'){
      // Grey zone — downgrade BUY to WATCH, LEAN BUY to WATCH
      if(action === 'BUY'){ action = 'WATCH'; actionColor = 'var(--amber)'; }
      else if(action === 'LEAN BUY'){ action = 'WATCH'; actionColor = 'var(--amber)'; }
      lines.push('Engine ' + fmtSwing(conSwing) + ' / ' + fmtSwing(expSwing) + ' / ' + fmtSwing(optSwing) + ' vs ' + deficit + ' deficit — CONTESTED recovery, math uncertain.');
      triggers.push('Deficit narrows or structural rate increases');
    } else if(tpClass === 'UNLIKELY' || tpClass === 'NO PATH'){
      // Engine can't close — force TOO DEEP regardless of floor score
      action = 'TOO DEEP'; actionColor = 'var(--red)';
      lines.push('Engine ' + fmtSwing(conSwing) + ' / ' + fmtSwing(expSwing) + ' / ' + fmtSwing(optSwing) + ' vs ' + deficit + ' deficit — ' + tpClass + '. Structural ceiling below variance floor.');
      // Clear existing triggers (they're stale now)
      triggers.length = 0;
      triggers.push('Deficit compresses significantly');
      triggers.push('Opponent variance collapses further');
    }
  }

  // Persist throughput on cardState for spread conviction + confidence table
  // Trend arrow — only update when score changed (prevents flickering on stale data polls)
  // CTRL-FLIP GUARD: reset trend when control team changes (delta would be cross-team nonsense)
  var _scoreKey = (game.homePoints||0) + '-' + (game.awayPoints||0);
  var _tpTeamFlipped = throughput && cs.throughput && cs.throughput.fTeam && throughput.fTeam !== cs.throughput.fTeam;
  if(_tpTeamFlipped){
    cs._lastThroughputScoreKey = _scoreKey;
  } else if(throughput && cs.throughput && cs.throughput.expected && _scoreKey !== cs._lastThroughputScoreKey){
    var _tpDelta = Math.round((throughput.expected.totalSwing - cs.throughput.expected.totalSwing) * 10) / 10;
    throughput.trend = Math.abs(_tpDelta) < 0.5 ? '▬' : _tpDelta > 0 ? '▲' : '▼';
    throughput.trendDelta = _tpDelta;
    cs._lastThroughputScoreKey = _scoreKey;
  } else if(throughput && cs.throughput && cs.throughput.trend){
    throughput.trend = cs.throughput.trend;
    throughput.trendDelta = cs.throughput.trendDelta;
  }
  cs.throughput = throughput;

  // ── LEAD SAFETY GATE ──
  // When the structural team leads, compute whether the opponent's engine can erode the lead.
  var leadSafety = null;
  if(!trailing && deficit >= 2 && period >= 1){
    leadSafety = computeLeadSafety(game);
  }

  if(leadSafety){
    var lsClass = leadSafety.classification;
    var lsCon = Math.round(leadSafety.conservative.totalSwing);
    var lsExp = Math.round(leadSafety.expected.totalSwing);
    var lsOpt = Math.round(leadSafety.optimistic.totalSwing);
    var lsLead = leadSafety.lead;
    var lsOppTeam = leadSafety.oppTeam;

    if(action === 'BUY WINDOW CLOSING'){
      if(lsClass === 'AT RISK' || lsClass === 'CRITICAL'){
        action = 'WATCH'; actionColor = 'var(--amber)';
        lines.push('Lead ' + lsClass + ' — ' + lsOppTeam + ' engine projects ' + fmtSwing(lsCon) + ' / ' + fmtSwing(lsExp) + ' / ' + fmtSwing(lsOpt) + ' vs ' + lsLead + ' lead (' + leadSafety.remainingPoss + ' poss). Lead erosion threatens position.');
        triggers.push('Lead erosion — opponent engine projects recovery');
        triggers.push('Opponent may become the play if variance collapses');
      } else {
        lines.push('Lead ' + lsClass + ' — ' + lsOppTeam + ' recovery engine projects ' + fmtSwing(lsCon) + ' / ' + fmtSwing(lsExp) + ' / ' + fmtSwing(lsOpt) + ' vs ' + lsLead + ' lead. Position durable.');
      }
    } else if(action === 'NO VALUE'){
      if(lsClass === 'AT RISK' || lsClass === 'CRITICAL'){
        action = 'WATCH'; actionColor = 'var(--amber)';
        lines.push('No edge on ' + fTeam + ' but lead ' + lsClass + ' — ' + lsOppTeam + ' recovery engine projects ' + fmtSwing(lsCon) + ' / ' + fmtSwing(lsExp) + ' / ' + fmtSwing(lsOpt) + ' vs ' + lsLead + ' lead.');
        triggers.push('Opponent may become the play if variance collapses');
      }
    }
  }

  // Persist lead safety on cardState for spread conviction + confidence table
  // Trend arrow — only update when score changed (prevents flickering on stale data polls)
  // CTRL-FLIP GUARD: reset trend when control team changes (delta would be cross-team nonsense)
  var _lsScoreKey = (game.homePoints||0) + '-' + (game.awayPoints||0);
  var _lsTeamFlipped = leadSafety && cs.leadSafety && cs.leadSafety.fTeam && leadSafety.fTeam !== cs.leadSafety.fTeam;
  if(_lsTeamFlipped){
    cs._lastLeadSafetyScoreKey = _lsScoreKey;
  } else if(leadSafety && cs.leadSafety && cs.leadSafety.expected && _lsScoreKey !== cs._lastLeadSafetyScoreKey){
    var _lsDelta = Math.round((leadSafety.expected.totalSwing - cs.leadSafety.expected.totalSwing) * 10) / 10;
    leadSafety.trend = Math.abs(_lsDelta) < 0.5 ? '▬' : _lsDelta < 0 ? '▲' : '▼';
    leadSafety.trendDelta = _lsDelta;
    cs._lastLeadSafetyScoreKey = _lsScoreKey;
  } else if(leadSafety && cs.leadSafety && cs.leadSafety.trend){
    leadSafety.trend = cs.leadSafety.trend;
    leadSafety.trendDelta = cs.leadSafety.trendDelta;
  }
  cs.leadSafety = leadSafety;

  // ── BET TYPE RECOMMENDATION (ML vs Spread) ──
  var betType = null;
  var betDetail = null;
  if(od && (action === 'BUY' || action === 'LEAN BUY' || action === 'BUY WINDOW CLOSING')){
    var spConv = cs.spreadConviction;
    var spread = parseFloat(od.homeSpread);
    var ctrlSpread = (!isNaN(spread)) ? (ctrlIsHome ? spread : -spread) : null;

    // ML value: compare floor score (proxy for win prob) against ML implied prob
    var ctrlML = ctrlIsHome ? od.homeML : od.awayML;
    var mlNum = parseFloat(ctrlML);
    var mlImplied = null;
    if(!isNaN(mlNum) && mlNum !== 0){
      mlImplied = mlNum < 0 ? Math.abs(mlNum) / (Math.abs(mlNum) + 100) * 100 : 100 / (mlNum + 100) * 100;
    }
    var mlEdge = mlImplied != null ? (fScore * 100) - mlImplied : null;

    // Spread value: from spread conviction engine
    var ctrlCoverProb = null;
    if(spConv){
      var spTeam = ctrlIsHome ? spConv.home : spConv.away;
      if(spTeam) ctrlCoverProb = spTeam.coverProb;
    }

    // Decision
    var mlHasValue = mlEdge != null && mlEdge >= 10;
    var spreadHasValue = ctrlCoverProb != null && ctrlCoverProb >= 60;

    if(mlHasValue && spreadHasValue){
      // Both have value — recommend the stronger edge
      if(mlEdge > (ctrlCoverProb - 50)){
        betType = 'ML'; betDetail = fTeam + ' ML ' + ctrlML + ' (implied ' + mlImplied.toFixed(0) + '%, our read ' + (fScore*100).toFixed(0) + '% = +' + mlEdge.toFixed(0) + '% edge). Spread also viable at ' + ctrlCoverProb + '% cover.';
      } else {
        betType = 'SPREAD'; betDetail = fTeam + ' ' + (ctrlSpread>0?'+':'') + ctrlSpread.toFixed(1) + ' (' + ctrlCoverProb + '% cover prob). ML also has value at +' + mlEdge.toFixed(0) + '% edge.';
      }
    } else if(mlHasValue){
      betType = 'ML'; betDetail = fTeam + ' ML ' + ctrlML + ' (implied ' + mlImplied.toFixed(0) + '%, our read ' + (fScore*100).toFixed(0) + '% = +' + mlEdge.toFixed(0) + '% edge).';
    } else if(spreadHasValue){
      betType = 'SPREAD'; betDetail = fTeam + ' ' + (ctrlSpread!=null?(ctrlSpread>0?'+':'')+ctrlSpread.toFixed(1):'?') + ' (' + ctrlCoverProb + '% cover prob).';
    } else if(ctrlSpread != null && trailing){
      // No strong conviction either way — note the spread for context
      betDetail = 'Spread ' + fTeam + ' ' + (ctrlSpread>0?'+':'') + ctrlSpread.toFixed(1) + ' — waiting for conviction.';
    }

    if(betDetail) lines.push(betDetail);
  } else if(od && od.homeSpread && action !== 'NO EDGE'){
    // Non-buy actions — just note spread context
    var spread2 = parseFloat(od.homeSpread);
    if(!isNaN(spread2)){
      var ctrlSpread2 = ctrlIsHome ? spread2 : -spread2;
      if(trailing && ctrlSpread2 > 0){
        lines.push('Spread ' + fTeam + ' ' + (ctrlSpread2>0?'+':'') + ctrlSpread2.toFixed(1) + ' — getting points.');
      }
    }
  }

  return {
    action: action,
    actionColor: actionColor,
    control: control,
    narrative: lines.join(' '),
    triggers: triggers,
    confidence: confidence,
    missing: missing,
    fTeam: fTeam,
    fScore: fScore,
    trailing: trailing,
    deficit: deficit,
    betType: betType,
    throughput: throughput,
    leadSafety: leadSafety,
    vtActive: vtActive,
    vtDiscount: vtDiscount,
    vtTeam: vtTeam,
  };
}


function getVerdict(s){
  if(s>=.90) return {label:'DOMINANT',color:'#00ff88',bg:'rgba(0,255,136,.10)',lvl:'entry'};
  if(s>=.75) return {label:'STRONG',color:'#a8ff78',bg:'rgba(168,255,120,.08)',lvl:'entry'};
  if(s>=.60) return {label:'EARNED',color:'#ffd166',bg:'rgba(255,209,102,.08)',lvl:'watch'};
  if(s>=.45) return {label:'NO EDGE',color:'#ff5252',bg:'rgba(255,82,82,.06)',lvl:null};
  return {label:'WAIT',color:'#555',bg:'rgba(60,60,60,.06)',lvl:null};
}

// ══════════════════════════════════════════════════════════════════════════════
// PLAYER BASELINES — Built from p.average on every SR summary refresh
// ══════════════════════════════════════════════════════════════════════════════
function buildPlayerBaselines(game){
  const s = game.summary;
  if(!s || !s.home?.players || !s.away?.players) return null;
  const hA = s.home?.alias||s.home?.name||'HOME', aA = s.away?.alias||s.away?.name||'AWAY';
  const players = {};
  let hSzn3PM=0, hSzn3PA=0, hSznFGM=0, hSznFGA=0;
  let aSzn3PM=0, aSzn3PA=0, aSznFGM=0, aSznFGA=0;
  const hStarters=[], aStarters=[], hByUSG=[], aByUSG=[];

  function processPlayer(p, teamAlias, side){
    const avg = p.average||{};
    const name = p.full_name||p.name||'?';
    const szn3m = avg.three_points_made||0, szn3a = avg.three_points_att||0;
    const sznFGm = avg.field_goals_made||0, sznFGa = avg.field_goals_att||0;
    const szn3Pct = szn3a >= 1.0 ? (szn3m/szn3a*100) : null;
    const sznFGPct = sznFGa >= 1.0 ? (sznFGm/sznFGa*100) : null;
    const sznUSG = avg.usage_pct||0, sznMin = avg.minutes||0;
    // Tier classification (matches analyze.js logic)
    let tier = 'NON';
    if(szn3Pct===null) tier = 'UNK';
    else if(szn3Pct>=38.0 && szn3a>=2.0) tier = 'ELITE';
    else if(szn3Pct>=33.0 || (szn3Pct>=30.0 && szn3a>=3.0)) tier = 'AVG';
    else tier = 'NON';
    if(szn3a<1.5 && tier==='ELITE') tier = 'AVG';
    if(szn3a<0.8 && tier!=='NON' && tier!=='UNK') tier = 'NON';

    const entry = {team:teamAlias, side, szn3Pct, szn3Vol:szn3a, sznFGPct, sznUSG, sznMin,
      sznPts:avg.points||0, sznAst:avg.assists||0, sznReb:avg.rebounds||0, sznStl:avg.steals||0,
      tier, position:p.primary_position||'?', starter:!!p.starter, name};
    players[name] = entry;
    if(side==='home'){
      hSzn3PM+=szn3m; hSzn3PA+=szn3a; hSznFGM+=sznFGm; hSznFGA+=sznFGa;
      if(p.starter) hStarters.push(name);
      hByUSG.push({name, usg:sznUSG, min:sznMin});
    } else {
      aSzn3PM+=szn3m; aSzn3PA+=szn3a; aSznFGM+=sznFGm; aSznFGA+=sznFGa;
      if(p.starter) aStarters.push(name);
      aByUSG.push({name, usg:sznUSG, min:sznMin});
    }
  }

  (s.home.players||[]).forEach(p=>processPlayer(p, hA, 'home'));
  (s.away.players||[]).forEach(p=>processPlayer(p, aA, 'away'));

  // Verify we got real season data (not all zeros)
  const hasData = hSzn3PA>=3 || aSzn3PA>=3;
  if(!hasData) return {built:false, players:{}, reason:'No season averages in summary'};

  hByUSG.sort((a,b)=>b.usg-a.usg); aByUSG.sort((a,b)=>b.usg-a.usg);
  return {
    built: true,
    players,
    stars: {
      home: hByUSG.slice(0,2).map(x=>x.name),
      away: aByUSG.slice(0,2).map(x=>x.name),
    },
    starters: {
      home: hStarters.length>=4 ? hStarters : hByUSG.slice(0,5).map(x=>x.name),
      away: aStarters.length>=4 ? aStarters : aByUSG.slice(0,5).map(x=>x.name),
    },
    teamSeason3Pct: {
      home: hSzn3PA>=5 ? (hSzn3PM/hSzn3PA*100) : 36.0,
      away: aSzn3PA>=5 ? (aSzn3PM/aSzn3PA*100) : 36.0,
    },
    teamSeason3PARate: {
      home: hSznFGA>=10 ? (hSzn3PA/hSznFGA*100) : 35.0,
      away: aSznFGA>=10 ? (aSzn3PA/aSznFGA*100) : 35.0,
    },
  };
}

// STRUCTURAL CONTEXT — Extracted once from srCache after thesis generation
// ══════════════════════════════════════════════════════════════════════════════
function extractStructuralContext(gameId){
  try{
    const cached = localStorage.getItem('ncaamb:srCache:'+gameId);
    if(!cached) return null;
    const c = JSON.parse(cached);
    const game = games.find(g=>g.id===gameId);
    if(!game) return null;
    const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
    const hId = game.home?.id||game.home?.sr_id||'', aId = game.away?.id||game.away?.sr_id||'';

    // Multi-strategy team matching for injuries (same as server)
    function matchSide(t){
      if(hId && (t.id===hId || t.sr_id===hId)) return 'home';
      if(aId && (t.id===aId || t.sr_id===aId)) return 'away';
      const a = (t.alias||t.abbreviation||t.abbr||'').toUpperCase();
      if(a && a===hA.toUpperCase()) return 'home';
      if(a && a===aA.toUpperCase()) return 'away';
      const nm = (t.name||'').toLowerCase(), mk = (t.market||'').toLowerCase();
      if(nm.indexOf(hA.toLowerCase())>=0 || mk.indexOf(hA.toLowerCase())>=0) return 'home';
      if(nm.indexOf(aA.toLowerCase())>=0 || mk.indexOf(aA.toLowerCase())>=0) return 'away';
      return null;
    }

    // Closers from depth charts
    const closers = {home:[], away:[]};
    const foulBackups = {home:{}, away:{}};
    function resolvePos(d){
      if(!d) return [];
      // Check positions key first
      if(d.positions){
        if(Array.isArray(d.positions)) return d.positions;
        if(typeof d.positions === 'object'){
          const conv = [];
          Object.keys(d.positions).forEach(posName=>{
            const val = d.positions[posName];
            let players = [];
            if(Array.isArray(val)) players = val;
            else if(val?.players && Array.isArray(val.players)) players = val.players;
            else if(val && typeof val === 'object') players = Object.values(val).filter(v=>v&&typeof v==='object'&&(v.full_name||v.name));
            if(players.length>0) conv.push({name:posName, position:posName, players});
          });
          if(conv.length>0) return conv;
        }
      }
      if(Array.isArray(d)) return d;
      if(d.depth_chart) return resolvePos(d.depth_chart);
      const skip = ['id','name','market','alias','founded','sr_id','reference','venue','league','conference','division','coaches'];
      for(const k of Object.keys(d)){
        if(skip.includes(k)) continue;
        const v=d[k];
        if(Array.isArray(v)&&v.length>0&&v[0]&&(Array.isArray(v[0].players)||v[0].name||v[0].position)) return v;
      }
      return [];
    }
    function extractDepth(d, side){
      const pos = resolvePos(d);
      pos.forEach(p=>{
        const pls = Array.isArray(p.players)?p.players:[];
        const d1 = pls.find(x=>x.depth===1||x.depth==='1');
        const d2 = pls.find(x=>x.depth===2||x.depth==='2');
        if(d1) closers[side].push(d1.full_name||d1.name||'?');
        if(d1 && d2) foulBackups[side][d1.full_name||d1.name] = d2.full_name||d2.name||'?';
      });
    }
    extractDepth(c.homeDepth, 'home');
    extractDepth(c.awayDepth, 'away');

    // Pythagorean from standings
    const pyth = {home:{expected:0,actual:0,delta:0,cap:null}, away:{expected:0,actual:0,delta:0,cap:null}};
    if(c.standings){
      const allTeams = [];
      (c.standings.conferences||[]).forEach(conf=>{
        // NCAAMB: teams directly under conference
        (conf.teams||[]).forEach(t=>allTeams.push(t));
        // NBA: teams under divisions
        (conf.divisions||[]).forEach(div=>{
          (div.teams||[]).forEach(t=>allTeams.push(t));
        });
      });
      function calcPyth(alias){
        const t = allTeams.find(x=>(x.alias||x.abbr||'').toUpperCase()===alias.toUpperCase());
        if(!t) return {expected:0,actual:0,delta:0,cap:null};
        const pf = t.calc_points?.for || t.points_for || 0;
        const pa = t.calc_points?.against || t.points_against || 0;
        const gp = (t.wins||0)+(t.losses||0);
        if(!pf||!pa||!gp) return {expected:0,actual:0,delta:0,cap:null};
        const pythWin = Math.pow(pf,13.91)/(Math.pow(pf,13.91)+Math.pow(pa,13.91));
        const expW = Math.round(pythWin*gp*10)/10;
        const actW = t.wins||0;
        const delta = actW-expW;
        let cap = null;
        if(delta<=-5) cap = 0.70;
        else if(delta<=-3) cap = 0.75;
        else if(delta>=5) cap = 0.75;
        return {expected:expW, actual:actW, delta:Math.round(delta*10)/10, cap, gp, losses:t.losses||0};
      }
      pyth.home = calcPyth(hA);
      pyth.away = calcPyth(aA);
    }

    // Opponent profile from seasonal stats
    const oppProfile = {home:{steals:0,disruptionTier:'LOW'}, away:{steals:0,disruptionTier:'LOW'}};
    function extractOpp(stats, side){
      const opp = stats?.opponents?.statistics || (stats?.own_record?.opponents||{}).statistics || {};
      const stl = opp.steals||0;
      oppProfile[side] = {steals:stl, disruptionTier: stl>=8.5?'HIGH':stl>=7.0?'MODERATE':'LOW'};
    }
    extractOpp(c.homeStats, 'home');
    extractOpp(c.awayStats, 'away');

    // Key outs from injuries
    const keyOuts = [];
    if(c.injuries?.teams){
      c.injuries.teams.forEach(t=>{
        const side = matchSide(t);
        if(!side) return;
        (t.players||[]).forEach(p=>{
          const injArr = Array.isArray(p.injuries) ? p.injuries : [];
          const latestInj = injArr.length > 0 ? injArr[0] : {};
          let st = (latestInj.status || p.status || '').toUpperCase();
          if(!st){
            const desc = (latestInj.comment||latestInj.desc||p.desc||'').toUpperCase();
            if(desc.indexOf('OUT')>=0 || desc.indexOf('NOT WITH TEAM')>=0) st='OUT';
            else if(desc.indexOf('DOUBTFUL')>=0) st='DOUBTFUL';
            else if(desc.indexOf('QUESTIONABLE')>=0) st='QUESTIONABLE';
          }
          const injDesc = latestInj.desc || latestInj.comment || p.desc || '?';
          if(st==='OUT'||st==='O'||st==='IR'||st==='NOT WITH TEAM'){
            keyOuts.push({name:p.full_name||'?', team:t.alias||t.abbreviation||t.market||'?', position:p.primary_position||p.position||'?',
              injury:injDesc, status:'OUT', side: side});
          }
        });
      });
    }

    // Shot diet identity from seasonal stats
    const shotDiet = {home:'BALANCED', away:'BALANCED'};
    function classifyDiet(stats, side){
      const own = stats?.own_record||stats||{};
      const ts = own.statistics||stats?.statistics||{};
      const fga = ts.field_goals_att||1;
      const threeRate = (ts.three_points_att||0)/fga*100;
      const paintPts = ts.points_in_the_paint||0;
      const atRimRate = (ts.field_goals_at_rim_att||0)/fga*100;
      if(threeRate>=38 && (ts.assists||0)/(ts.field_goals_made||1)*100>=65) shotDiet[side] = 'PERIMETER';
      else if(paintPts>=48 || atRimRate>=35) shotDiet[side] = 'INTERIOR';
      else shotDiet[side] = 'BALANCED';
    }
    classifyDiet(c.homeStats, 'home');
    classifyDiet(c.awayStats, 'away');

    const result = {built:true, closers, foulBackups, pythagorean:pyth, oppProfile, keyOuts, shotDiet};
    return result;
  }catch(e){
    console.error('extractStructuralContext failed:', e.message);
    return {built:false};
  }
}

// CLIENT-SIDE SUSTAINABILITY AUDIT — Port of server-side analyze.js logic
// ══════════════════════════════════════════════════════════════════════════════
function computeSustainabilityClient(teamData, baselines, teamAlias, side, trackingData, pbpAudit){
  if(!teamData || !baselines?.built) return null;
  const stats = teamData.statistics||{};
  const players = teamData.players||[];
  const team3PM = stats.three_points_made||0, team3PA = stats.three_points_att||0;
  const teamFGA = stats.field_goals_att||1;
  const live3Pct = team3PA>0 ? (team3PM/team3PA*100) : 0;
  const seasonBaseline = baselines.teamSeason3Pct?.[side]||36.0;
  console.log('SUST['+teamAlias+']:', 'team3PA='+team3PA, 'team3PM='+team3PM, 'FGA='+teamFGA, 'live3Pct='+live3Pct.toFixed(1), 'baseline='+seasonBaseline.toFixed(1), 'statsKeys='+Object.keys(stats).slice(0,8).join(','));

  // Auto-override: shooting at or below baseline → LOCKED (or COLD if 2PT% also bad)
  if(live3Pct <= seasonBaseline+2) {
    var fg2m = (stats.field_goals_made||0) - team3PM;
    var fg2a = teamFGA - team3PA;
    var coldTier = (fg2a >= 6 && fg2m / fg2a < 0.49) ? 'COLD' : 'LOCKED';
    var coldReason = coldTier === 'COLD'
      ? 'COLD — at/below 3PT baseline ('+live3Pct.toFixed(0)+'% vs '+seasonBaseline.toFixed(0)+'% szn) AND poor 2PT conversion ('+(fg2m/fg2a*100).toFixed(0)+'%)'
      : 'Shooting at/below baseline ('+live3Pct.toFixed(0)+'% vs '+seasonBaseline.toFixed(0)+'% szn)';
    return {tier:coldTier, reason:coldReason, personnel:'N/A', regression:'N/A', shotType:'N/A', autoLocked:true};
  }

  // Personnel audit (40%)
  const makesByTier = {ELITE:0,AVG:0,NON:0,UNK:0};
  const hotPlayers = [];
  players.forEach(p=>{
    const live = p.statistics||{};
    const live3m = live.three_points_made||0, live3a = live.three_points_att||0;
    if(live3a<2) return;
    const name = p.full_name||p.name||'?';
    const bl = baselines.players?.[name];
    const tier = bl?.tier||'UNK';
    makesByTier[tier] = (makesByTier[tier]||0) + live3m;
    if(bl && bl.szn3Pct!==null){
      const livePct = live3m/live3a*100;
      if(livePct > bl.szn3Pct+12) hotPlayers.push({name, livePct:livePct.toFixed(0), sznPct:bl.szn3Pct.toFixed(0), tier, live3m, live3a});
    }
  });
  const totalMakes = team3PM||1;
  const elitePct = makesByTier.ELITE/totalMakes*100;
  const nonPct = (makesByTier.NON+makesByTier.UNK)/totalMakes*100;
  let personnelGrade;
  if(elitePct>=70) personnelGrade = 'LOCKED';
  else if(elitePct>=50 && nonPct<=20) personnelGrade = 'DURABLE';
  else if(nonPct>=50) personnelGrade = 'UNSUSTAINABLE';
  else if(nonPct>=35) personnelGrade = 'FRAGILE';
  else personnelGrade = 'MIXED';

  // Bayesian regression (35%)
  const priorStrength = 30;
  const priorAlpha = seasonBaseline/100*priorStrength;
  const priorBeta = (1-seasonBaseline/100)*priorStrength;
  const postAlpha = priorAlpha+team3PM;
  const postBeta = priorBeta+(team3PA-team3PM);
  const posteriorMean = postAlpha/(postAlpha+postBeta)*100;
  const deviation = live3Pct-seasonBaseline;
  let regressionProb;
  if(team3PA<=8) regressionProb=85;
  else if(team3PA<=14) regressionProb=70;
  else if(team3PA<=20) regressionProb=55;
  else if(team3PA<=28) regressionProb=40;
  else regressionProb=25;
  if(deviation>15) regressionProb=Math.min(95,regressionProb+15);
  else if(deviation>8) regressionProb=Math.min(95,regressionProb+8);
  else if(deviation>3) regressionProb=Math.min(95,regressionProb+3);
  else if(deviation<-3) regressionProb=Math.max(5,regressionProb-8);
  let regressionGrade;
  if(regressionProb>=75) regressionGrade='HIGH';
  else if(regressionProb>=55) regressionGrade='MODERATE';
  else if(regressionProb>=35) regressionGrade='LOW';
  else regressionGrade='MINIMAL';

  // Shot quality layer (25%) — uses PBP zone data when available, falls back to assist-ratio proxy
  const teamAst = stats.assists||0, teamFGM = stats.field_goals_made||1;
  const assistRatio = teamAst/teamFGM*100;
  let shotTypeGrade = 'MIXED';
  let shotTypeNote = '';
  const tracking = trackingData?.[side==='home'?'home':'away'] || trackingData;

  // Check for PBP zone data (auto-fetched every poll)
  const teamPbp = pbpAudit ? pbpAudit[side] : null;
  if(teamPbp && teamPbp.threes && teamPbp.threes.att >= 5){
    const cornerAtt = teamPbp.threes.corner?.att||0;
    const aboveAtt = teamPbp.threes.above?.att||0;
    const total3PA = teamPbp.threes.att||1;
    const cornerPct = cornerAtt/total3PA*100;
    const assisted = teamPbp.threes.assisted||0;
    const assistedPct = teamPbp.threes.made>0 ? assisted/teamPbp.threes.made*100 : 0;
    // Per-player unassisted above-break
    const unassistedAbove = (teamPbp.threes.byPlayer||[]).reduce(function(acc, p){
      return acc + ((p.att||0) - (p.assisted||0));
    }, 0);
    const unassistedAbovePct = total3PA > 0 ? unassistedAbove/total3PA*100 : 0;

    if(cornerPct >= 35 && assistedPct >= 60){
      shotTypeGrade = 'SCHEME'; // Most sustainable — high corner volume, scheme-driven
      shotTypeNote = 'Corner '+cornerPct.toFixed(0)+'% of 3PA, '+assistedPct.toFixed(0)+'% assisted — scheme-driven';
    } else if(assistedPct >= 60 && cornerPct >= 20){
      shotTypeGrade = 'DURABLE'; // Good process, mix of zones
      shotTypeNote = assistedPct.toFixed(0)+'% assisted, corner '+cornerPct.toFixed(0)+'% — structured creation';
    } else if(cornerPct < 15 && unassistedAbovePct >= 35){
      shotTypeGrade = 'FRAGILE'; // Pull-up heavy, above-break, unassisted
      shotTypeNote = 'Above-break dominant, '+unassistedAbovePct.toFixed(0)+'% unassisted — pull-up heavy';
    } else if(assistedPct >= 50){
      shotTypeGrade = 'MIXED';
      shotTypeNote = assistedPct.toFixed(0)+'% assisted, corner '+cornerPct.toFixed(0)+'% — moderate process';
    } else {
      shotTypeGrade = 'FRAGILE';
      shotTypeNote = 'Low assisted ('+assistedPct.toFixed(0)+'%), corner only '+cornerPct.toFixed(0)+'%';
    }
  } else if(tracking?.catchAndShoot){
    // Fallback: tracking baselines (pre-game data)
    const casEfg = tracking.catchAndShoot.efg||tracking.catchAndShoot.fg3pct||null;
    const puEfg = tracking.pullUp?.efg||tracking.pullUp?.fg3pct||null;
    if(casEfg!==null && puEfg!==null){
      if(assistRatio>=60 && casEfg>=38){ shotTypeGrade='DURABLE'; shotTypeNote='High ast% ('+assistRatio.toFixed(0)+'%) + C&S eFG '+casEfg+'%'; }
      else if(assistRatio<45 && puEfg<35){ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%) + weak pull-up ('+puEfg+'%)'; }
      else if(assistRatio>=50){ shotTypeGrade='MIXED'; shotTypeNote='Moderate ast% ('+assistRatio.toFixed(0)+'%)'; }
      else{ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%)'; }
    } else {
      if(assistRatio>=65){ shotTypeGrade='DURABLE'; shotTypeNote='High ast% ('+assistRatio.toFixed(0)+'%)'; }
      else if(assistRatio<45){ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%)'; }
      else{ shotTypeGrade='MIXED'; shotTypeNote='Moderate ast% ('+assistRatio.toFixed(0)+'%)'; }
    }
  } else {
    // Bare fallback: assist ratio only
    if(assistRatio>=65){ shotTypeGrade='DURABLE'; shotTypeNote='High ast% ('+assistRatio.toFixed(0)+'%)'; }
    else if(assistRatio<45){ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%)'; }
    else{ shotTypeGrade='MIXED'; shotTypeNote='Moderate ast% ('+assistRatio.toFixed(0)+'%)'; }
  }

  // Composite — 5 tiers
  const tierMap = {'LOCKED':5,'SCHEME':5,'DURABLE':4,'MIXED':3,'FRAGILE':2,'UNSUSTAINABLE':1,'HIGH':1,'MODERATE':2,'LOW':4,'MINIMAL':5};
  const pScore = tierMap[personnelGrade]||3;
  const rScore = tierMap[regressionGrade]||3;
  const sScore = tierMap[shotTypeGrade]||3;
  const composite = pScore*0.40 + rScore*0.35 + sScore*0.25;
  let tier;
  if(composite>=4.5) tier='LOCKED';
  else if(composite>=3.8) tier='DURABLE';
  else if(composite>=2.8) tier='MIXED';
  else if(composite>=1.8) tier='FRAGILE';
  else tier='UNSUSTAINABLE';
  // COLD: LOCKED but can't convert from 2 either
  if(tier === 'LOCKED') {
    var fg2m = (stats.field_goals_made||0) - team3PM;
    var fg2a = teamFGA - team3PA;
    if(fg2a >= 6 && fg2m / fg2a < 0.49) tier = 'COLD';
  }

  // Build reason line
  let reason = '';
  if(nonPct>=50) reason = Math.round(nonPct)+'% of 3PM from non-shooters';
  else if(elitePct>=70) reason = Math.round(elitePct)+'% of 3PM from elite shooters';
  else if(hotPlayers.length>0) reason = hotPlayers.map(h=>h.name+' '+h.livePct+'% vs '+h.sznPct+'% szn').join(', ');
  else if(regressionProb>=70) reason = 'High regression probability ('+regressionProb+'%) — small sample';
  else reason = 'P:'+personnelGrade+' R:'+regressionGrade+' S:'+shotTypeGrade;

  return {tier, reason, personnel:personnelGrade, regression:regressionGrade, shotType:shotTypeGrade, shotTypeNote:shotTypeNote||'',
    live3Pct:live3Pct.toFixed(1), seasonBaseline:seasonBaseline.toFixed(1), hotPlayers, autoLocked:false,
    _debug:{team3PA, team3PM, assistRatio:assistRatio.toFixed(0), composite:composite.toFixed(2), pScore, rScore, sScore}};
}

// ══════════════════════════════════════════════════════════════════════════════
// CLIENT-SIDE LEAD COMPOSITION — pure arithmetic on game summary fields
// ══════════════════════════════════════════════════════════════════════════════
function computeLeadCompositionClient(game, sustData){
  const s = game.summary;
  if(!s || !s.home || !s.away) return null;
  const hS = s.home.statistics||{}, aS = s.away.statistics||{};
  const hPts = s.home.points||0, aPts = s.away.points||0;
  if(hPts===0 && aPts===0) return null;

  function breakdown(stats, total, pbpRim, pbpPaint){
    var rawPaint = stats.points_in_the_paint||stats.points_in_paint||0;
    // Interior = rim + paint zones from PBP (both are structural — player got into the defense)
    var pbpRimMade = pbpRim ? (pbpRim.made||0) : 0;
    var pbpRimAtt = pbpRim ? (pbpRim.att||0) : 0;
    var pbpPaintMade = pbpPaint ? (pbpPaint.made||0) : 0;
    var pbpPaintAtt = pbpPaint ? (pbpPaint.att||0) : 0;
    var interiorMade = pbpRimMade + pbpPaintMade;
    var interiorAtt = pbpRimAtt + pbpPaintAtt;
    var atRimPts = (stats.field_goals_at_rim_made||0)*2;
    var pbpInteriorPts = interiorMade * 2;
    const paint = Math.max(rawPaint, atRimPts, pbpInteriorPts);
    const ft = stats.free_throws_made||0;
    const three = (stats.three_points_made||0)*3;
    const transition = stats.fast_break_points||0;
    const pot = stats.points_off_turnovers||0;
    const sc = stats.second_chance_points||0;
    const midOther = Math.max(0, total - paint - ft - three);
    const structural = paint + ft;
    const variance = three + midOther;
    const sPct = total>0 ? Math.round(structural/total*100) : 0;
    const vPct = total>0 ? Math.round(variance/total*100) : 0;
    // Use combined interior (rim+paint) for made/att display
    const rimMade = interiorAtt > 0 ? interiorMade : (stats.field_goals_at_rim_made||0);
    const rimAtt = interiorAtt > 0 ? interiorAtt : (stats.field_goals_at_rim_att||0);
    const ftMade = stats.free_throws_made||0;
    const ftAtt = stats.free_throws_att||0;
    const threeMade = stats.three_points_made||0;
    const threeAtt = stats.three_points_att||0;
    const fgMade = stats.field_goals_made||0;
    const fgAtt = stats.field_goals_att||0;
    const midMade = Math.max(0, fgMade - threeMade - rimMade);
    const midAtt = Math.max(0, fgAtt - threeAtt - rimAtt);
    return {total, paint, ft, three, midOther, transition, pot, secondChance:sc, structural, variance, structuralPct:sPct, variancePct:vPct,
      _rimMade:rimMade, _rimAtt:rimAtt, _ftMade:ftMade, _ftAtt:ftAtt, _threeMade:threeMade, _threeAtt:threeAtt, _midMade:midMade, _midAtt:midAtt};
  }

  const hA = s.home.alias || game.home?.alias || '?';
  const aA = s.away.alias || game.away?.alias || '?';
  const _pbpLC = cardState[game.id]?.pbpAudit;
  const hB = breakdown(hS, hPts, _pbpLC?.home?.rim, _pbpLC?.home?.paint);
  const aB = breakdown(aS, aPts, _pbpLC?.away?.rim, _pbpLC?.away?.paint);
  hB.team = hA; aB.team = aA;

  const margin = hPts - aPts;
  const absMargin = Math.abs(margin);
  const leadTeam = margin>=0 ? hA : aA;
  const trailTeam = margin>=0 ? aA : hA;
  const structuralMargin = hB.structural - aB.structural;
  const varianceMargin = hB.variance - aB.variance;
  const leadStructural = margin>=0 ? structuralMargin : -structuralMargin;
  const leadVariance = margin>=0 ? varianceMargin : -varianceMargin;

  // Get lead team's sustainability tier
  const leadIsHome = margin>=0;
  const leadSust = sustData ? (leadIsHome ? sustData.home : sustData.away) : null;
  const leadTier = (leadSust?.tier||'').toUpperCase();

  // New 6-tier classification using sustainability cross-reference
  let classification = 'MIXED';
  let durability = '';

  if(absMargin <= 2){
    classification = 'EVEN';
    durability = 'EVEN — margin too small to classify';
  } else if(leadStructural >= absMargin * 0.6){
    classification = 'STRUCTURAL';
    durability = leadTeam+' lead is STRUCTURAL — paint/FT drives margin (+'+Math.abs(leadStructural)+')';
  } else if(leadVariance >= absMargin * 0.6){
    // 3PT/mid drives the margin — classification depends on sustainability
    if(leadTier === 'LOCKED' || leadTier === 'LOCKED IN'){
      classification = 'IDENTITY';
      durability = leadTeam+' lead is IDENTITY — perimeter production at season baseline ('+leadTier+'). This is their offensive identity, not variance.';
    } else if(leadTier === 'DURABLE'){
      classification = 'HOT';
      durability = leadTeam+' lead is HOT — above baseline but credible shooters with good process ('+leadTier+'). Elevated but sustainable.';
    } else if(leadTier === 'MIXED'){
      classification = 'MIXED';
      durability = 'MIXED — 3PT/mid drives margin with uncertain sustainability. Structural favors '+(leadStructural<0?trailTeam:leadTeam)+' ('+(leadStructural<0?'+'+Math.abs(leadStructural):'+'+leadStructural)+')';
    } else if(leadTier === 'FRAGILE' || leadTier === 'UNSUSTAINABLE'){
      classification = 'VOLATILE';
      durability = leadTeam+' lead is VOLATILE — perimeter production is '+leadTier+'. Structural favors '+(leadStructural<0?trailTeam:leadTeam)+' ('+(leadStructural<0?'+'+Math.abs(leadStructural):'+'+leadStructural)+'). Entry signal for trailing team.';
    } else {
      // TOO EARLY, empty, null, or unknown tier — default to MIXED not VOLATILE
      classification = 'MIXED';
      durability = 'MIXED — 3PT/mid drives margin but sustainability data insufficient'+(leadTier?' ('+leadTier+')':'')+'.';
    }
  } else {
    classification = 'MIXED';
    durability = 'MIXED — no single source dominates margin';
  }

  return {
    home:hB, away:aB, margin, absMargin, leadTeam, trailTeam,
    structuralMargin:leadStructural, varianceMargin:leadVariance,
    durability, classification
  };
}
