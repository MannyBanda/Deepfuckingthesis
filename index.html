<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a14">
<title>NBA Control v5.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07070a;--s1:rgba(14,14,20,.65);--s2:rgba(20,20,28,.55);--c1:rgba(17,17,24,.75);--b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.09);
  --t1:#e2e2ee;--t2:#9a9aac;--t3:#5a5a6a;
  --amber:#f5a62a;--green:#00ff88;--g2:#a8ff78;--red:#ff5252;--yellow:#ffd166;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);--glass-hover:rgba(255,255,255,.07);
  --blur:blur(16px);--radius:10px;--radius-sm:7px;--radius-xs:5px;
}
html,body{background:var(--bg);color:var(--t1);font-family:var(--mono);min-height:100vh;min-height:100dvh;overscroll-behavior:none;}
body{background:linear-gradient(165deg, #0a0a14 0%, #070d12 30%, #0a1118 60%, #081210 100%);background-attachment:fixed;}
input,textarea,select{font-size:16px!important;}
@media(min-width:600px){input,textarea,select{font-size:inherit!important;}}
.app{padding:12px;max-width:1400px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,12px);}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 0 10px;border-bottom:1px solid var(--b1);margin-bottom:9px;gap:6px;}
.logo{font-size:8px;font-weight:600;letter-spacing:4px;color:var(--amber);text-transform:uppercase;white-space:nowrap;}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s ease-in-out infinite;margin:0 7px;flex-shrink:0;}
.pulse.off{background:var(--t3);box-shadow:none;animation:none;}
.hdr-sub{font-size:7px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-r{font-size:7px;color:var(--t3);white-space:nowrap;flex-shrink:0;}
.hdr-r span{color:var(--amber);}

/* Controls */
.ctrls{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:9px;}
.cbtn{font-size:7px;letter-spacing:1.5px;text-transform:uppercase;background:var(--glass);border:1px solid var(--glass-border);color:var(--t2);font-family:var(--mono);padding:7px 10px;cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-appearance:none;border-radius:var(--radius-sm);min-height:32px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
.cbtn:hover,.cbtn.on{border-color:var(--amber);color:var(--amber);background:rgba(245,166,42,.08);}
.cbtn:active{opacity:.7;}
.cbtn.freq{font-size:6px;padding:5px 7px;min-height:28px;}
.cbtn.freq.on{border-color:var(--green);color:var(--green);background:rgba(0,255,136,.08);}
.cbtn.freq.warn{border-color:var(--red);color:var(--red);}
.ci{background:var(--glass);border:1px solid var(--glass-border);color:var(--t1);font-family:var(--mono);padding:7px 8px;outline:none;width:120px;-webkit-appearance:none;border-radius:var(--radius-xs);min-height:32px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
.ci:focus{border-color:var(--amber);}
.ci::placeholder{color:var(--t3);}
.cml{margin-left:auto;font-size:7px;color:var(--t3);white-space:nowrap;}
.cml span{color:var(--amber);}
.freq-group{display:flex;align-items:center;gap:2px;margin-left:4px;}
.freq-lbl{font-size:6px;color:var(--t3);letter-spacing:1px;margin-right:2px;}

/* Pills */
.pills{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:9px;}
.pill{font-size:7px;letter-spacing:.8px;padding:6px 10px;border:1px solid var(--glass-border);cursor:pointer;font-family:var(--mono);color:var(--t2);background:var(--glass);transition:all .15s;-webkit-appearance:none;border-radius:var(--radius-sm);min-height:30px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
.pill:hover,.pill.sel{border-color:var(--green);color:var(--green);background:rgba(0,255,136,.06);}
.pill.live{border-color:var(--yellow);color:var(--yellow);background:rgba(255,209,102,.06);}
.pill.done{color:var(--t3);border-color:var(--glass-border);}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px;}

/* Card */
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes cg{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,.12)}50%{box-shadow:0 0 0 8px rgba(0,255,136,0)}}
.card{background:var(--s1);border:1px solid var(--glass-border);animation:fu .2s ease;overflow:hidden;position:relative;border-radius:var(--radius);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
.card.ce{border-color:rgba(0,255,136,.3);animation:fu .2s ease,cg 2.5s ease-in-out infinite;}
.card.cw{border-color:rgba(255,209,102,.3);}
.card.ce::before,.card.cw::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--radius) var(--radius) 0 0;}
.card.ce::before{background:var(--green);box-shadow:0 0 8px var(--green);}
.card.cw::before{background:var(--yellow);}

.ch{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--b1);border-radius:var(--radius) var(--radius) 0 0;}
.mup{font-size:12px;font-weight:500;}
.sub{font-size:6px;color:var(--t3);margin-top:1px;}
.chr{display:flex;align-items:center;gap:5px;}
.pb{font-size:7px;letter-spacing:1px;padding:2px 6px;border:1px solid var(--glass-border);color:var(--amber);border-radius:var(--radius-xs);background:rgba(245,166,42,.06);}
.ld{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:blink 1.5s ease-in-out infinite;flex-shrink:0;}

.sr{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;border-bottom:1px solid var(--b1);}
.srt{font-size:7px;color:var(--t2);letter-spacing:1px;margin-bottom:2px;}
.srs{font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1;}
.bonus-tag{font-size:6px;color:var(--red);border:1px solid var(--red);padding:1px 3px;margin-left:3px;vertical-align:middle;border-radius:3px;}
.sr-sep{font-size:13px;color:var(--t3);}

.pre{padding:16px 11px;text-align:center;}
.prelbl{font-size:7px;color:var(--t2);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.prediv{height:1px;background:var(--b1);margin:14px 0;}
.countdown{color:var(--amber);font-size:22px;font-weight:600;}

.ctrl-bar{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--b1);flex-wrap:wrap;}
.vrd{font-size:7px;font-weight:600;letter-spacing:2px;padding:2px 7px;border:1px solid;text-transform:uppercase;white-space:nowrap;flex-shrink:0;border-radius:var(--radius-xs);}
.cl{font-size:6px;color:var(--t3);letter-spacing:1px;}
.ct{font-size:12px;font-weight:600;}
.bw{flex:1;min-width:60px;padding:0 3px;}
.bt2{height:2px;background:var(--b2);border-radius:1px;}
.bf{height:100%;transition:width .6s ease;border-radius:1px;}
.cn{font-size:17px;font-weight:600;letter-spacing:-1px;flex-shrink:0;}
.dq{font-size:6px;letter-spacing:1px;padding:1px 4px;border:1px solid;color:var(--green);border-color:var(--green);border-radius:var(--radius-xs);}

.inds{padding:6px 11px;border-bottom:1px solid var(--b1);}
.ind{display:flex;align-items:center;gap:4px;padding:2px 0;border-bottom:1px solid var(--b1);}
.ind:last-child{border:none;}
.ii{font-size:6px;color:var(--t3);width:14px;flex-shrink:0;}
.in{font-size:6px;color:var(--t2);width:78px;flex-shrink:0;}
.iw{font-size:6px;color:var(--t3);width:18px;flex-shrink:0;}
.pip{width:5px;height:5px;border-radius:1px;flex-shrink:0;}
.pw{background:#00ff88;}.plw{background:#a8ff78;}.pd{background:var(--yellow);}.pll{background:#ff8c42;}.pl{background:var(--red);}
.il{font-size:7px;font-weight:600;width:26px;flex-shrink:0;}
.id{font-size:6px;color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.traj{padding:6px 11px;border-bottom:1px solid var(--b1);}
.th{font-size:6px;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;margin-bottom:3px;gap:4px;flex-wrap:wrap;}
.tl{font-size:6px;font-weight:600;letter-spacing:1px;padding:1px 5px;border:1px solid;margin-left:auto;}
.ts{display:flex;align-items:flex-start;gap:3px;padding:2px 0;}
.tk{font-size:6px;font-weight:600;width:16px;flex-shrink:0;padding-top:1px;}
.tt{font-size:6px;flex:1;line-height:1.5;}

/* Sonnet Analysis */
.analysis{padding:8px 11px;border-bottom:1px solid var(--b1);background:rgba(0,255,136,.03);}
.analysis-hdr{font-size:6px;color:var(--green);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.analysis-body{font-size:7px;color:var(--t2);line-height:1.7;font-family:var(--sans);white-space:pre-wrap;word-break:break-word;}
.analysis-loading{font-size:7px;color:var(--t3);display:flex;align-items:center;gap:6px;}
.analysis-cost{font-size:5px;color:var(--t2);}

/* Decision View */
.dv{padding:8px 11px;border-bottom:1px solid var(--b1);background:rgba(147,120,230,.04);}
.dv-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.dv-row:last-child{margin-bottom:0;}
.dv-label{font-size:5px;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;width:56px;flex-shrink:0;}
.dv-val{font-size:9px;font-weight:600;}
.dv-sub{font-size:6px;color:var(--t2);}
.dv-tag{font-size:6px;letter-spacing:1px;padding:1px 5px;border:1px solid;white-space:nowrap;border-radius:var(--radius-xs);}
.dv-pred{font-size:7px;color:var(--t1);font-family:var(--sans);line-height:1.5;padding:4px 0 0;}
.dv-hdr{font-size:6px;color:#a78bfa;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}

/* Evidence toggle */
.ev-toggle{font-size:6px;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;padding:7px 11px;border-bottom:1px solid var(--b1);border-top:1px solid var(--b1);cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;-webkit-user-select:none;background:rgba(255,255,255,.02);}
.ev-toggle:hover{color:var(--t2);background:rgba(255,255,255,.04);}
.ev-toggle .arr{transition:transform .2s;display:inline-block;}
.ev-toggle.open .arr{transform:rotate(90deg);}
.ev-body{overflow:hidden;transition:max-height .3s ease;}
.ev-body.collapsed{max-height:0!important;overflow:hidden;}

/* Data inputs (clutch + odds) */
.data-inputs{padding:4px 11px;border-bottom:1px solid var(--b1);background:rgba(245,166,42,.03);}
.di-hdr{font-size:5.5px;color:var(--amber);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;opacity:.8;}
.di-row{display:flex;align-items:center;gap:3px;margin-bottom:2px;flex-wrap:wrap;}
.di-lbl{font-size:5px;color:var(--t3);width:42px;flex-shrink:0;}
.di-input{background:rgba(255,255,255,.04);border:1px solid var(--glass-border);color:var(--t2);font-family:var(--mono);font-size:5px;padding:1px 2px;width:44px;outline:none;-webkit-appearance:none;border-radius:var(--radius-xs);text-align:center;}
.di-input:focus{border-color:var(--amber);}
.di-input.di-sm{font-size:5px;padding:1px 2px;}
.di-input::placeholder{color:var(--t3);font-size:4.5px;}
.di-btn{font-size:5px;letter-spacing:1px;background:var(--glass);border:1px solid var(--glass-border);color:var(--t2);font-family:var(--mono);padding:2px 6px;cursor:pointer;-webkit-appearance:none;border-radius:var(--radius-xs);}
.di-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(245,166,42,.08);}
.di-saved{font-size:5px;color:var(--green);margin-left:4px;}

/* Clutch Upload Zone */
.clutch-upload{display:flex;align-items:center;gap:6px;padding:6px 0;flex-wrap:wrap;}
.cu-btn{font-size:7px;letter-spacing:1px;text-transform:uppercase;background:rgba(147,130,220,.06);border:1px dashed rgba(147,130,220,.25);color:#9382dc;font-family:var(--mono);padding:7px 12px;cursor:pointer;-webkit-appearance:none;border-radius:var(--radius-sm);min-height:32px;transition:all .15s;}
.cu-btn:hover{border-color:#9382dc;background:rgba(147,130,220,.12);}
.cu-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(245,166,42,.06);border-style:solid;}
.cu-status{font-size:7px;color:var(--t3);font-family:var(--mono);}
.cu-status.ok{color:var(--green);}
.cu-status.err{color:var(--red);}
.cu-badge{display:inline-flex;align-items:center;gap:3px;font-size:6px;letter-spacing:.5px;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15);color:var(--green);padding:3px 8px;font-family:var(--mono);border-radius:var(--radius-xs);}

/* Thesis xref */
.xref{padding:6px 11px;border-bottom:1px solid var(--b1);background:rgba(245,166,42,.03);}
.xh{font-size:6px;color:var(--amber);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
.xr{font-size:6px;padding:1px 0;}
.xr.ok{color:var(--g2);}.xr.warn{color:var(--yellow);}.xr.info{color:var(--t2);}

/* Thesis */
.thesis{padding:7px 11px;}
.thdr{font-size:6px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:4px;}
.tedit,.tgen{font-size:7px;color:var(--amber);background:none;border:none;cursor:pointer;font-family:var(--mono);letter-spacing:1px;padding:6px 4px;min-height:28px;}
.tgen{color:var(--green);border:1px solid var(--green);padding:6px 10px;border-radius:var(--radius-sm);}
.tgen:active{background:rgba(0,255,136,.1);}
.tgen:disabled{opacity:.4;cursor:default;}
.tbody{font-size:7px;color:var(--t2);line-height:1.7;font-family:var(--sans);white-space:pre-wrap;word-break:break-word;}
.tpr{margin-top:5px;padding-top:5px;border-top:1px solid var(--b1);}
.trow{font-size:6px;color:var(--t3);padding:1px 0;}
.trow span{color:var(--t1);}
.tempty{font-size:7px;color:var(--t3);font-style:italic;}
.ta{width:100%;background:var(--glass);border:1px solid var(--glass-border);color:var(--t1);font-family:var(--sans);padding:10px;resize:vertical;min-height:120px;outline:none;line-height:1.6;border-radius:var(--radius-xs);-webkit-appearance:none;touch-action:manipulation;}
.ta:focus{border-color:var(--amber);}
.thint{font-size:6px;color:var(--t3);margin-top:3px;line-height:1.7;white-space:pre-line;}
.tbtn-row{display:flex;gap:6px;margin-top:6px;}
.tsave,.tcancel{font-size:7px;background:none;font-family:var(--mono);padding:7px 14px;cursor:pointer;letter-spacing:1px;-webkit-appearance:none;border-radius:var(--radius-sm);min-height:32px;}
.tsave{border:1px solid var(--amber);color:var(--amber);}
.tsave:active{background:rgba(245,166,42,.15);}
.tcancel{border:1px solid var(--glass-border);color:var(--t2);}

/* Gen progress */
.gen-progress{font-size:7px;color:var(--t2);padding:6px 0;line-height:1.7;}
.gen-step{color:var(--t3);}
.gen-step.done{color:var(--green);}
.gen-step.active{color:var(--amber);}
.gen-step.err{color:var(--red);}

.log{background:rgba(20,20,28,.5);border-top:1px solid var(--b1);padding:4px 11px;font-size:6px;color:var(--t3);max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.log .ok{color:#3d9970;}.log .er{color:var(--red);}
.foot{font-size:6px;color:var(--t3);padding:3px 11px 6px;}

.loading{display:flex;align-items:center;gap:6px;padding:11px;font-size:7px;color:var(--t3);}
.err-msg{font-size:7px;color:var(--red);padding:6px 11px;}
.empty{padding:44px;text-align:center;color:var(--t3);font-size:8px;letter-spacing:2px;}
.date-label{font-size:7px;color:var(--t2);letter-spacing:1px;margin-bottom:6px;padding:4px 0;}
.date-label span{color:var(--amber);}

/* Alert bar */
.abar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:8px;letter-spacing:1px;transform:translateY(-100%);transition:transform .3s ease;padding-top:max(10px,env(safe-area-inset-top));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:0 0 var(--radius) var(--radius);}
.abar.show{transform:translateY(0);}
.abar.entry{background:rgba(0,255,136,.1);border-bottom:1px solid rgba(0,255,136,.3);color:var(--green);}
.abar.watch{background:rgba(255,209,102,.08);border-bottom:1px solid rgba(255,209,102,.3);color:var(--yellow);}
.ax{margin-left:auto;cursor:pointer;opacity:.5;font-size:14px;padding:6px;min-width:28px;text-align:center;}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:8px;height:8px;border:1px solid var(--b2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}

@media(max-width:600px){
  .app{padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));}
  .grid{grid-template-columns:1fr;}
  .ctrls{gap:3px;}
  .cbtn{font-size:7px;padding:7px 8px;}
  .ci{width:100px;}
  .cml{display:none;}
  .mup{font-size:11px;}
  .srs{font-size:22px;}
  .cn{font-size:15px;}
  .in{width:68px;}
  .id{font-size:5px;}
}
#conf-table{margin:0 11px 8px;padding:8px 10px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
#conf-table .ct-hdr{font-size:7px;letter-spacing:1.5px;color:var(--t2);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:6px;}
#conf-table .ct-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
#conf-table table{border-collapse:collapse;font-size:7px;min-width:620px;white-space:nowrap;}
#conf-table th{color:var(--t3);font-weight:400;text-align:left;padding:2px 6px;border-bottom:1px solid var(--b1);font-size:5.5px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
#conf-table td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;white-space:nowrap;}
#conf-table tr:last-child td{border-bottom:none;}
#conf-table .ct-score{font-weight:600;font-size:8px;text-align:center;}
#conf-table .ct-verdict{font-size:5.5px;letter-spacing:.5px;text-align:center;}
#conf-table .ct-cond{color:var(--t2);font-size:6px;line-height:1.4;max-width:180px;}
#conf-table tr.ct-final td{color:var(--t3) !important;opacity:.5;}
#conf-table tr.ct-row{border-left:2px solid transparent;}
#conf-table tr.ct-optimal{border-left:2px solid var(--green);background:rgba(0,200,83,.04);}
#conf-table tr.ct-window{border-left:2px solid var(--amber);background:rgba(255,160,0,.03);}
#conf-table tr.ct-closing{border-left:2px solid var(--yellow);background:rgba(255,235,59,.02);}
#conf-table tr.ct-counter{border-left:2px solid var(--red);background:rgba(255,82,82,.03);}
#conf-table .ct-badge{font-size:5px;letter-spacing:.5px;padding:1px 4px;border-radius:var(--radius-xs);font-weight:600;display:inline-block;text-transform:uppercase;}
#conf-table .ct-live{background:rgba(0,200,83,.12);color:var(--green);}
#conf-table .ct-pre{background:rgba(255,255,255,.05);color:var(--t3);}
#conf-table .ct-done{background:rgba(255,255,255,.03);color:var(--t3);}

// ══════════════════════════════════════════════════════════════════════════════
// BOOT DIAGNOSTICS — catches parse/runtime failures in main script
// This runs in its own <script> tag so it survives main script parse errors
// ══════════════════════════════════════════════════════════════════════════════
window.__nbaBooted = false;
window.__nbaVersion = 'v5.1';
window.__bootErrors = [];

window.onerror = function(msg, src, line, col, err) {
  window.__bootErrors.push({msg:msg, line:line, col:col, src:src});
  var el = document.getElementById('err');
  if(el){
    el.style.display = 'block';
    el.style.whiteSpace = 'pre-wrap';
    el.innerHTML = '<span style="color:#ff6b6b;font-weight:600">⚠ JS ERROR</span> ' + window.__nbaVersion + '\n'
      + String(msg) + '\nLine ' + line + (col ? ':' + col : '') + '\n'
      + '<span style="color:#888;font-size:5px">Check console for full trace. This usually means a syntax error in index.html.</span>';
  }
  console.error('[NBA CONTROL BOOT ERROR]', msg, 'at line', line, col, err);
};

window.addEventListener('unhandledrejection', function(e) {
  var msg = e.reason ? (e.reason.message || String(e.reason)) : 'Unknown async error';
  window.__bootErrors.push({msg:msg, async:true});
  console.error('[NBA CONTROL ASYNC ERROR]', msg, e.reason);
});

// Boot canary — fires 4s after page load. If main script parsed and ran,
// window.__nbaBooted will be true. If not, something broke silently.
setTimeout(function(){
  if(!window.__nbaBooted){
    var el = document.getElementById('err');
    if(el){
      el.style.display = 'block';
      el.style.whiteSpace = 'pre-wrap';
      var detail = window.__bootErrors.length > 0
        ? '\nCaptured errors:\n' + window.__bootErrors.map(function(e){return '  ' + e.msg + (e.line ? ' (L'+e.line+')' : '');}).join('\n')
        : '\nNo errors captured — main script likely failed to parse entirely.';
      el.innerHTML = '<span style="color:#ff6b6b;font-weight:600">⚠ BOOT FAILURE</span> ' + window.__nbaVersion + '\n'
        + 'Dashboard JS did not initialize.' + detail + '\n'
        + '<span style="color:#888;font-size:5px">This usually means a syntax error was introduced in the last deployment.\n'
        + 'Open browser DevTools → Console to see the parse error.\n'
        + 'Redeploy the last known working version from GitHub.</span>';
    }
    // Also make it obvious in the header
    var hdr = document.getElementById('hdr-sub');
    if(hdr) hdr.textContent = 'BOOT FAILURE · JS did not initialize · ' + window.__nbaVersion;
  }
}, 4000);
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONSTANTS & STATE
// ══════════════════════════════════════════════════════════════════════════════
const W = {I1:.25, I2:.25, I3:.20, I4:.20, I5:.10};
const FN = '/.netlify/functions/';


// ── Netlify DB (Neon Postgres) — persistent calibration ──
var dbReady = false;
async function initDB(){
  try{
    var r = await fetch(FN+'db-api?action=init');
    if(r.ok){ dbReady=true; console.log('[DB] Schema initialized'); }
    else { console.warn('[DB] Init failed:', r.status); }
  }catch(e){ console.warn('[DB] Init error:', e.message); }
}

async function saveSnapshotDB(game){
  if(!dbReady) return;
  var cs = cardState[game.id]; if(!cs) return;
  var floor = cs.sonnetIndicators || cs.clientInd; if(!floor || !floor.score) return;
  var pbp = cs.pbpWindow;
  var qtr = cs.rollingWindow;
  var ewp = cs.espnWP;
  var od = cs.oddsData;
  var accel = cs.acceleration;
  var sust = cs.clientSustainability;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hS = game.homePoints||0, aS = game.awayPoints||0;
  var ctrlIsHome = floor.controlTeam === hA;
  var ctrlPts = ctrlIsHome ? hS : aS;
  var oppPts = ctrlIsHome ? aS : hS;
  var deficit = oppPts - ctrlPts; // positive = trailing
  var trailingTeam = deficit > 0 ? floor.controlTeam : (deficit < 0 ? (ctrlIsHome?aA:hA) : null);
  var leadSide = hS > aS ? 'home' : 'away';
  var leadSust = sust?.[leadSide]?.tier || null;
  var gapVal = (pbp && pbp.available && pbp.controlTeam === floor.controlTeam) ? (pbp.score - floor.score) : null;

  var snapshot = {
    game_id: game.id,
    date: new Date().toISOString().split('T')[0],
    league: 'nba',
    matchup: aA+'@'+hA,
    home_alias: hA, away_alias: aA,
    period: game.period||0,
    clock: game.clock||'',
    home_pts: hS, away_pts: aS,
    floor_score: floor.score, floor_team: floor.controlTeam,
    pbp_score: pbp&&pbp.available ? pbp.score : null,
    pbp_team: pbp&&pbp.available ? pbp.controlTeam : null,
    pbp_window_size: pbp&&pbp.available ? pbp.windowPossessions : null,
    qtr_score: qtr&&qtr.available ? qtr.score : null,
    qtr_team: qtr&&qtr.available ? qtr.controlTeam : null,
    espn_wp_home: ewp ? ewp.home : null,
    espn_wp_away: ewp ? ewp.away : null,
    spread: od ? parseFloat(od.homeSpread)||null : null,
    deficit: Math.max(0, deficit),
    trailing_team: trailingTeam,
    lead_sust: leadSust,
    gap: gapVal,
    accel: accel?.accel||null,
    i1: floor.I1?.score, i2: floor.I2?.score, i3: floor.I3?.score, i4: floor.I4?.score, i5: floor.I5?.score,
  };

  try{
    await fetch(FN+'db-api?action=snapshot', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(snapshot)
    });
  }catch(e){ /* silent */ }
}

async function finalizeGameDB(game){
  if(!dbReady) return;
  var cs = cardState[game.id]; if(!cs) return;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hPts = game.homePoints||0, aPts = game.awayPoints||0;
  var winner = hPts > aPts ? hA : (aPts > hPts ? aA : 'TIE');
  var margin = Math.abs(hPts - aPts);
  var thesis = theses[game.id]||'';
  var csMatch = thesis.match(/CONTROL SCORE:\s*(\w+)/i);
  var thesisTeam = csMatch ? csMatch[1].toUpperCase() : null;
  var pred = cs.prediction;
  var fwpTeam = null, fwpValue = null;
  if(pred && pred.homeValue && pred.awayValue){
    if(pred.homeValue.fwp >= pred.awayValue.fwp){ fwpTeam=hA; fwpValue=pred.homeValue.fwp; }
    else { fwpTeam=aA; fwpValue=pred.awayValue.fwp; }
  }
  var od = cs.oddsData;
  var homeSpread = od ? parseFloat(od.homeSpread) : null;
  var homeCovered = null, awayCovered = null;
  if(homeSpread != null && !isNaN(homeSpread)){
    var m = hPts - aPts;
    homeCovered = (m + homeSpread) > 0;
    awayCovered = (-m + (-homeSpread)) > 0;
  }
  var lc = cs.clientLeadComposition || cs.leadComposition;

  try{
    await fetch(FN+'db-api?action=finalize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        game_id: game.id,
        home_pts: hPts, away_pts: aPts,
        winner: winner, margin: margin,
        spread: homeSpread, home_covered: homeCovered, away_covered: awayCovered,
        thesis_team: thesisTeam, thesis_correct: thesisTeam ? thesisTeam===winner : null,
        fwp_team: fwpTeam, fwp_value: fwpValue, fwp_correct: fwpTeam ? fwpTeam===winner : null,
        conviction: pred?.conviction||null, entry_signal: pred?.entry||null,
        classification: lc?.classification||null,
      })
    });
    console.log('[DB] Game finalized:', game.id, winner, 'by', margin);
  }catch(e){ console.warn('[DB] Finalize failed:', e.message); }
}

async function fetchCalibrationFromDB(){
  if(!dbReady) return null;
  try{
    var r = await fetch(FN+'db-api?action=calibration&league=nba');
    if(!r.ok) return null;
    var data = await r.json();
    var gs = data.gameStats||{};
    if(!gs.total_games || gs.total_games < 3) return null;
    var lines = ['CALIBRATION CONTEXT ('+gs.total_games+' games from DB):'];
    if(gs.thesis_total > 0) lines.push('Thesis direction: '+gs.thesis_correct+'/'+gs.thesis_total+' correct ('+(gs.thesis_correct/gs.thesis_total*100).toFixed(0)+'%)');
    (data.fwpBuckets||[]).forEach(function(b){
      if(b.total >= 2) lines.push('FWP '+b.bucket+': '+b.correct+'/'+b.total+' ('+(b.correct/b.total*100).toFixed(0)+'% win rate)');
    });
    if(gs.spread_total > 0) lines.push('Spread: '+gs.spread_covered+'/'+gs.spread_total+' sides covered ('+(gs.spread_covered/gs.spread_total*100).toFixed(0)+'%)');
    var misses = (data.recentMisses||[]).map(function(m){ return m.matchup+' (FWP:'+m.fwp_value+'% '+m.fwp_team+' lost to '+m.winner+')'; });
    if(misses.length > 0) lines.push('Recent misses: '+misses.join(', '));
    return '\n'+lines.join('\n')+'\n';
  }catch(e){ return null; }
}

async function fetchCalibrationMatchFromDB(floorScore, period, trailing, deficit){
  if(!dbReady) return null;
  try{
    var params = 'action=match&league=nba&floor_min='+(floorScore-0.1).toFixed(2)+'&floor_max='+(floorScore+0.1).toFixed(2);
    if(period > 0) params += '&period='+period;
    if(trailing) params += '&trailing=true&deficit_min='+Math.max(0,deficit-4)+'&deficit_max='+(deficit+8);
    var r = await fetch(FN+'db-api?'+params);
    if(!r.ok) return null;
    var data = await r.json();
    if(!data.total || data.total < 3) return null;
    var lines = ['HISTORICAL MATCH ('+data.total+' similar snapshots):'];
    lines.push('Structural team win rate: '+data.winRate+'%');
    if(data.coverRate) lines.push('Cover rate: '+data.coverRate+'%');
    if(data.pbpAgreedCount >= 2) lines.push('When PBP agreed: '+data.pbpAgreedWinRate+'% win ('+data.pbpAgreedCount+' games)');
    if(data.pbpDisagreedCount >= 2) lines.push('When PBP disagreed: '+data.pbpDisagreedWinRate+'% win ('+data.pbpDisagreedCount+' games)');
    return '\n'+lines.join('\n')+'\n';
  }catch(e){ return null; }
}



// Sync analyses from DB on load — enables cross-device restore
// Fetches for ALL today's games (not just selected) and caches results.
// mountCard then reads from dbAnalysisCache as a cross-device fallback.
async function syncAnalysesFromDB(){
  if(!dbReady) return;
  try{
    // Fetch for ALL games on today's slate — one DB call covers everything
    var ids = games.map(function(g){return g.id;}).join(',');
    if(!ids) return;
    var r = await fetch(FN+'db-api?action=get_analyses&game_ids='+encodeURIComponent(ids));
    if(!r.ok) return;
    var data = await r.json();
    var rows = data.analyses || [];
    // Build cache keyed by game_id
    rows.forEach(function(row){
      var pred = null, ind = null;
      if(row.prediction_json){
        try{ pred = typeof row.prediction_json === 'string' ? JSON.parse(row.prediction_json) : row.prediction_json; }catch(e){}
      }
      if(row.indicators_json){
        try{ ind = typeof row.indicators_json === 'string' ? JSON.parse(row.indicators_json) : row.indicators_json; }catch(e){}
      }
      var narrative = null;
      if(row.narrative_json){
        try{ narrative = typeof row.narrative_json === 'string' ? JSON.parse(row.narrative_json) : row.narrative_json; }catch(e){}
      }
      dbAnalysisCache[row.game_id] = {
        prediction: pred,
        sonnetIndicators: ind,
        analysisTime: row.ts ? new Date(row.ts).getTime() : 0,
        analysis: row.raw_text || '(synced from DB)',
        analysisHistory: narrative?.analysisHistory || [],
        edgeHistory: narrative?.edgeHistory || [],
        control_team: row.control_team,
        control_score: row.control_score,
        entry: row.entry,
        conviction: row.conviction,
        fwp: row.fwp,
        edge: row.edge,
        signal: row.signal,
        sustainability: row.sustainability,
        lead_source: row.lead_source,
      };
    });
    if(rows.length > 0) console.log('[DB] Cached '+rows.length+' analyses from DB');

    // Apply to any already-mounted cards (cards selected before DB responded)
    var synced = 0;
    Object.keys(dbAnalysisCache).forEach(function(gid){
      var cs = cardState[gid];
      if(!cs) return;
      var cached = dbAnalysisCache[gid];
      var localTime = cs.analysisTime ? cs.analysisTime.getTime() : 0;
      var dbTime = cached.analysisTime || 0;
      // Skip if local is newer or same
      if(localTime >= dbTime && cs.prediction) return;
      if(cached.prediction) cs.prediction = cached.prediction;
      if(cached.sonnetIndicators) cs.sonnetIndicators = cached.sonnetIndicators;
      if(dbTime) cs.analysisTime = new Date(dbTime);
      cs.analysis = cached.analysis || cs.analysis;
      persistAnalysis(gid, cs);
      synced++;
    });
    if(synced > 0){
      console.log('[DB] Applied '+synced+' DB analyses to mounted cards');
      games.filter(function(g){return selIds.includes(g.id);}).forEach(function(g){renderCard(g);});
      renderConfidenceTable();
    }
  }catch(e){ console.warn('[DB] Analysis sync failed:', e.message); }
}

// Save clutch data to DB (keyed by team alias — persists across games)
function saveClutchDB(gameId){
  if(!dbReady) return;
  var cs = cardState[gameId]; if(!cs || !cs.clutchData) return;
  var g = games.find(function(x){return x.id===gameId;});
  if(!g) return;
  var hA = g.home?.alias||'', aA = g.away?.alias||'';
  var teams = [];
  if(cs.clutchData.home && hA){
    var h = cs.clutchData.home;
    teams.push({alias:hA, tier:cs.clutchTier||3, netRtg:h.netRtg, offRtg:h.offRtg, defRtg:h.defRtg, wl:h.wl, efg:h.efg, pace:h.pace, pie:h.pie, source:cs.clutchTier===1?'ocr':'bdl', data:h});
  }
  if(cs.clutchData.away && aA){
    var a = cs.clutchData.away;
    teams.push({alias:aA, tier:cs.clutchTier||3, netRtg:a.netRtg, offRtg:a.offRtg, defRtg:a.defRtg, wl:a.wl, efg:a.efg, pace:a.pace, pie:a.pie, source:cs.clutchTier===1?'ocr':'bdl', data:a});
  }
  if(teams.length===0) return;
  fetch(FN+'db-api?action=save_clutch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({league:'nba',teams:teams})}).catch(function(){});
}

// Save odds snapshot to DB
function saveOddsDB(gameId){

  var od = cs.oddsData;

// Sync clutch from DB — loads by team alias, applies to any game featuring that team
async function syncClutchFromDB(){
  if(!dbReady) return;
  try{
    var teamSet = {};
    games.forEach(function(g){
      if(g.home?.alias) teamSet[g.home.alias]=true;
      if(g.away?.alias) teamSet[g.away.alias]=true;
    });
    var teamList = Object.keys(teamSet).join(',');
    if(!teamList) return;
    var r = await fetch(FN+'db-api?action=get_clutch&league=nba&teams='+encodeURIComponent(teamList));
    if(!r.ok) return;
    var data = await r.json();
    var dbClutch = data.clutch || {};
    var synced = 0;
    games.forEach(function(g){
      var cs = cardState[g.id]; if(!cs) return;
      // Only sync if no local clutch data (don't overwrite fresher local OCR)
      if(cs.clutchData && cs.clutchTier === 1) return;
      var hA = g.home?.alias||'', aA = g.away?.alias||'';
      var hDB = dbClutch[hA], aDB = dbClutch[aA];
      if(!hDB && !aDB) return;
      // Only upgrade tier (DB tier 1 OCR > local tier 2 BDL)
      var dbTier = Math.min(hDB?.tier||99, aDB?.tier||99);
      if(cs.clutchData && cs.clutchTier <= dbTier) return;
      cs.clutchData = {
        tier: dbTier,
        home: hDB ? {netRtg:hDB.netRtg, offRtg:hDB.offRtg, defRtg:hDB.defRtg, wl:hDB.wl, efg:hDB.efg, pace:hDB.pace, pie:hDB.pie} : cs.clutchData?.home || null,
        away: aDB ? {netRtg:aDB.netRtg, offRtg:aDB.offRtg, defRtg:aDB.defRtg, wl:aDB.wl, efg:aDB.efg, pace:aDB.pace, pie:aDB.pie} : cs.clutchData?.away || null,
      };
      cs.clutchTier = dbTier;
      synced++;
    });
    if(synced > 0){
      console.log('[DB] Synced clutch for '+synced+' games from DB');
      games.filter(function(g){return selIds.includes(g.id);}).forEach(function(g){renderCard(g);});
    }
  }catch(e){ console.warn('[DB] Clutch sync failed:', e.message); }
}

// Sync theses from DB on load — enables cross-device access
async function syncThesesFromDB(){
  if(!dbReady) return;
  try{
    var ids = games.map(function(g){return g.id;}).join(',');
    if(!ids) return;
    var r = await fetch(FN+'db-api?action=get_theses&game_ids='+encodeURIComponent(ids));
    if(!r.ok) return;
    var data = await r.json();
    var dbTheses = data.theses || {};
    var synced = 0;
    Object.keys(dbTheses).forEach(function(gid){
      if(!theses[gid] || theses[gid] !== dbTheses[gid]){
        theses[gid] = dbTheses[gid];
        synced++;
      }
    });
    if(synced > 0){
      try{ localStorage.setItem('nba4:theses', JSON.stringify(theses)); }catch(e){}
      console.log('[DB] Synced '+synced+' theses from DB');
      games.filter(function(g){return selIds.includes(g.id);}).forEach(function(g){renderCard(g);});
      renderConfidenceTable();
    }
  }catch(e){ console.warn('[DB] Thesis sync failed:', e.message); }
}

// ── ESPN Win Probability Integration ──
const ESPN_ALIAS_MAP = {NOP:'NO',GSW:'GS',NYK:'NY',SAS:'SA',PHX:'PHO',BKN:'BKN'};
var espnGameMap = {}; // {srGameId: espnEventId}
async function fetchEspnScoreboard(){
  try{
    var d = getSlateDate(0);

async function fetchEspnWinProb(gameId){

  if(cs._espnLoading) return;
  cs._espnLoading = true;
  try{
    var r = await fetch(FN+'espn-data?type=winprob&league=nba&event_id='+espnId);
    if(!r.ok) return;
    var data = await r.json();
    if(data.current && data.current.homeWinPct != null){
      var g = games.find(function(x){return x.id===gameId;});
      var hA = g?.home?.alias||'HOME';
      var homeWP = Math.round(data.current.homeWinPct * 100);
      var awayWP = 100 - homeWP;
      var openHomeWP = data.opening ? Math.round(data.opening.homeWinPct * 100) : null;
      cs.espnWP = {
        home: homeWP, away: awayWP,
        homeAlias: data.homeAbbr || hA,
        awayAlias: data.awayAbbr || '',
        opening: openHomeWP,
        dataPoints: data.dataPoints || 0,
        time: new Date()
      };
      // Store WP history for chart
      if(data.wpHistory && data.wpHistory.length > 0){
        cs.espnWPHistory = data.wpHistory;
      }
      // Store predictor + officials (not wired to UI yet — future use)
      if(data.predictor) cs.espnPredictor = data.predictor;

      if(data.seasonseries) cs.espnSeasonSeries = data.seasonseries;
      // Re-render to show ESPN WP on card
      if(g) renderCard(g);

  }catch(e){ /* silent */ }
  finally{ cs._espnLoading = false; }
}

async function sr(type, params={}){
  const qs = new URLSearchParams({type, ...params}).toString();
  const r = await fetch(FN+'sr-data?'+qs);
  if(r.status===429) throw new Error('SR rate limited — retry in 1s');
  if(!r.ok){
    const d = await r.json().catch(()=>({error:r.statusText}));
    throw new Error(d.error||'SR error '+r.status);
  }
  return r.json();
}

// Rate-limited sequential fetch with delay
async function srSequential(calls, delayMs=1400){
  const results = [];
  for(const call of calls){
    try{
      const data = await sr(call.type, call.params);
      results.push({key:call.key, data, ok:true});
    }catch(e){
      results.push({key:call.key, data:null, ok:false, error:e.message});
    }
    if(calls.indexOf(call) < calls.length-1){
      await new Promise(r=>setTimeout(r, delayMs));
    }
  }
  return results;
}

// Fetch BDL data for a game — returns aggregated team stats
async function fetchBdlSummary(game){
  const bdlId = bdlGameMap[game.id];
  if(!bdlId) throw new Error('No BDL game ID mapped for '+game.id);

  // Fetch game info (scores, quarters, bonus) + basic stats + advanced stats in parallel
  const [gameInfo, statsData, advData] = await Promise.all([
    bdl('game',{game_id:bdlId}),
    bdl('stats',{game_id:bdlId}),
    bdl('advanced',{game_id:bdlId}),
  ]);

  const g = gameInfo; // or gameInfo.data depending on BDL response
  const gd = g.data || g;
  const stats = (statsData.data||[]).filter(s=>s.min && s.min!=='00'&&s.min!=='0:00');
  const adv = (advData.data||[]).filter(s=>s.possessions>0);

  // Determine home/away team IDs
  const homeTeamId = gd.home_team?.id;
  const awayTeamId = gd.visitor_team?.id;

  // Aggregate basic stats by team
  function aggBasic(teamId){
    const pl = stats.filter(s=>(s.team?.id||s.player?.team_id)===teamId);
    return {
      steals: pl.reduce((a,s)=>a+(s.stl||0),0),
      blocks: pl.reduce((a,s)=>a+(s.blk||0),0),
      offensive_rebounds: pl.reduce((a,s)=>a+(s.oreb||0),0),
      turnovers: pl.reduce((a,s)=>a+(s.turnover||0),0),
      assists: pl.reduce((a,s)=>a+(s.ast||0),0),
      field_goals_made: pl.reduce((a,s)=>a+(s.fgm||0),0),
      field_goals_att: pl.reduce((a,s)=>a+(s.fga||0),0),
      three_points_made: pl.reduce((a,s)=>a+(s.fg3m||0),0),
      three_points_att: pl.reduce((a,s)=>a+(s.fg3a||0),0),
      free_throws_att: pl.reduce((a,s)=>a+(s.fta||0),0),
      free_throws_made: pl.reduce((a,s)=>a+(s.ftm||0),0),
      personal_fouls: pl.reduce((a,s)=>a+(s.pf||0),0),
      players: pl, // keep individual player stats
    };
  }

  // Aggregate advanced stats by team
  function aggAdvanced(teamId){
    const pl = adv.filter(s=>(s.team?.id||s.player?.team_id)===teamId);
    const totalPoss = pl.reduce((a,s)=>a+(s.possessions||0),0);
    return {
      fast_break_points: pl.reduce((a,s)=>a+(s.points_fast_break||0),0),
      points_off_turnovers: pl.reduce((a,s)=>a+(s.points_off_turnovers||0),0),
      second_chance_points: pl.reduce((a,s)=>a+(s.points_second_chance||0),0),
      points_in_the_paint: pl.reduce((a,s)=>a+(s.points_paint||0),0),
      possessions: totalPoss,
      // Weighted average for ratings
      offensive_rating: totalPoss>0 ? pl.reduce((a,s)=>a+(s.offensive_rating||0)*(s.possessions||0),0)/totalPoss : 0,
      defensive_rating: totalPoss>0 ? pl.reduce((a,s)=>a+(s.defensive_rating||0)*(s.possessions||0),0)/totalPoss : 0,
      assist_ratio: totalPoss>0 ? pl.reduce((a,s)=>a+(s.assist_ratio||0)*(s.possessions||0),0)/totalPoss : 0,
    };
  }

  const hBasic = aggBasic(homeTeamId);
  const aBasic = aggBasic(awayTeamId);
  const hAdv = aggAdvanced(homeTeamId);
  const aAdv = aggAdvanced(awayTeamId);

  // Build quarter scores from game info
  const quarters = [];
  for(let q=1; q<=4; q++){
    const hq = gd['home_q'+q], aq = gd['visitor_q'+q];
    if(hq!=null) quarters.push({quarter:q, home_points:hq, away_points:aq});
  }
  // OT
  if(gd.home_ot1!=null) quarters.push({quarter:5, home_points:gd.home_ot1, away_points:gd.visitor_ot1});

  return {
    source: 'BDL',
    bdlGameId: bdlId,
    homePoints: gd.home_team_score || 0,
    awayPoints: gd.visitor_team_score || 0,
    status: gd.status,
    period: gd.period || quarters.length,
    time: gd.time || '',
    homeBonus: gd.home_in_bonus || false,
    awayBonus: gd.visitor_in_bonus || false,
    quarters,
    home: {...hBasic, ...hAdv, alias: game.home?.alias||'HOME', name: game.home?.name||'HOME'},
    away: {...aBasic, ...aAdv, alias: game.away?.alias||'AWAY', name: game.away?.name||'AWAY'},
  };
}

function getSlateDate(offset=0){
  // Use Arizona time (MST, no DST) so the dashboard doesn't flip to tomorrow's
  // games while late West Coast games are still playing
  const now = new Date();
  const mst = new Date(now.toLocaleString('en-US',{timeZone:'America/Phoenix'}));
  mst.setDate(mst.getDate()+offset);
  return {
    year: String(mst.getFullYear()),
    month: String(mst.getMonth()+1).padStart(2,'0'),
    day: String(mst.getDate()).padStart(2,'0'),
    str: `${mst.getFullYear()}-${String(mst.getMonth()+1).padStart(2,'0')}-${String(mst.getDate()).padStart(2,'0')}`
  };
}

// ── LOCALSTORAGE CLEANUP — purge stale per-game data on boot ──
(function cleanupStorage(){
  try{
    const now = Date.now();
    const maxAge = 24*60*60*1000; // 24 hours
    const prefixes = ['nba4:analysis:','nba4:depth:','nba4:tracking:','nba4:structural:','nba4:snap:','nba4:gap:','nba4:srCache:'];
    const keysToRemove = [];
    for(let i=0; i<localStorage.length; i++){
      const key = localStorage.key(i);
      if(!key) continue;
      const isGameKey = prefixes.some(p => key.startsWith(p));
      if(!isGameKey) continue;
      // Try to parse and check for staleness
      try{
        const raw = localStorage.getItem(key);
        if(!raw || raw.length < 5){ keysToRemove.push(key); continue; }
        const val = JSON.parse(raw);
        // Check for timestamp indicators
        const ts = val.analysisTime || val.pbpTime || val.time || 0;
        if(ts > 0 && (now - ts) > maxAge){ keysToRemove.push(key); continue; }
        // srCache entries older than 6 hours
        if(key.startsWith('nba4:srCache:') && raw.length > 100000){ keysToRemove.push(key); continue; }
      }catch(e){ keysToRemove.push(key); } // corrupt data — remove
    }
    // Also clean up bulk caches if they have old game IDs
    ['nba4:clutch','nba4:odds','nba4:oddsHist','nba4:confTable'].forEach(function(bulkKey){
      try{
        const raw = localStorage.getItem(bulkKey);
        if(raw && raw.length > 500000) localStorage.removeItem(bulkKey); // over 500KB = stale
      }catch(e){}
    });
    keysToRemove.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    if(keysToRemove.length > 0) console.log('[CLEANUP] Removed '+keysToRemove.length+' stale localStorage entries');
    // Log storage usage
    let totalSize = 0;
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k) totalSize += (localStorage.getItem(k)||'').length;
    }
    console.log('[STORAGE] ~'+(totalSize/1024).toFixed(0)+'KB used across '+localStorage.length+' keys');
  }catch(e){ console.warn('Storage cleanup failed:', e.message); }
})();

// CALIBRATION LOG — tracks prediction accuracy across games for Sonnet self-correction
// ══════════════════════════════════════════════════════════════════════════════
function captureCalibration(game){
  if(!game || getState(game) !== 'FINAL') return;
  const cs = cardState[game.id]; if(!cs) return;
  if(cs._calibrationCaptured) return; // only capture once per game
  cs._calibrationCaptured = true;

  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const hPts = game.homePoints||0, aPts = game.awayPoints||0;
  const winner = hPts > aPts ? hA : (aPts > hPts ? aA : 'TIE');
  const margin = hPts - aPts; // positive = home won

  // Get thesis direction
  const thesis = theses[game.id] || '';
  let thesisTeam = null;
  const csMatch = thesis.match(/CONTROL SCORE:\s*(\w+)/i);
  if(csMatch) thesisTeam = csMatch[1].toUpperCase();

  // Get last Sonnet prediction
  const pred = cs.prediction;
  let fwpTeam = null, fwpValue = null, entrySignal = null, conviction = null;
  if(pred){
    entrySignal = pred.entry || null;
    conviction = pred.conviction || null;
    if(pred.homeValue && pred.awayValue){
      if(pred.homeValue.fwp >= pred.awayValue.fwp){
        fwpTeam = hA; fwpValue = pred.homeValue.fwp;
      } else {
        fwpTeam = aA; fwpValue = pred.awayValue.fwp;
      }
    }
  }

  // Get spread data
  const od = cs.oddsData;
  let homeSpread = null, spreadCovered = null;
  if(od && od.homeSpread){
    homeSpread = parseFloat(od.homeSpread);
    if(!isNaN(homeSpread)){
      // Home covers when: margin + spread > 0
      spreadCovered = {
        home: (margin + homeSpread) > 0,
        away: (-margin + (-homeSpread)) > 0,
      };
    }
  }

  // Get sustainability and scoring classification from last analysis
  const lc = cs.clientLeadComposition || cs.leadComposition;
  const classification = lc?.classification || null;

  const entry = {
    gameId: game.id,
    date: new Date().toISOString().split('T')[0],
    matchup: aA + '@' + hA,
    homePoints: hPts, awayPoints: aPts,
    winner: winner, margin: Math.abs(margin),
    thesisTeam: thesisTeam, thesisCorrect: thesisTeam ? thesisTeam === winner : null,
    fwpTeam: fwpTeam, fwpValue: fwpValue, fwpCorrect: fwpTeam ? fwpTeam === winner : null,
    entry: entrySignal, conviction: conviction,
    homeSpread: homeSpread,
    homeCovered: spreadCovered?.home ?? null,
    awayCovered: spreadCovered?.away ?? null,
    classification: classification,
  };

  // Load, append, trim to 30, save
  let log = [];
  try{ log = JSON.parse(localStorage.getItem('nba4:calibration')||'[]'); }catch(e){}
  // Don't duplicate
  if(log.some(function(l){ return l.gameId === game.id; })) return;
  log.push(entry);
  if(log.length > 30) log = log.slice(-30);
  try{ localStorage.setItem('nba4:calibration', JSON.stringify(log)); }catch(e){ console.warn('Calibration persist failed:', e.message); }
  console.log('[CALIBRATION] Captured:', entry.matchup, winner, 'by', entry.margin, '| Thesis:', thesisTeam, thesisTeam===winner?'✓':'✗', '| FWP:', fwpTeam, fwpValue, fwpTeam===winner?'✓':'✗');
}

function computeCalibrationStats(){
  let log = [];
  try{ log = JSON.parse(localStorage.getItem('nba4:calibration')||'[]'); }catch(e){}
  if(log.length < 3) return null; // need minimum sample

  const stats = {
    games: log.length,
    thesisRecord: {correct:0, total:0},
    fwpBuckets: {'50-59':{correct:0,total:0}, '60-69':{correct:0,total:0}, '70-79':{correct:0,total:0}, '80+':{correct:0,total:0}},
    spreadRecord: {covered:0, total:0},
    avgMarginError: 0,
    commonMisses: [],
  };

  let marginErrors = [];
  log.forEach(function(g){
    // Thesis accuracy
    if(g.thesisCorrect !== null){
      stats.thesisRecord.total++;
      if(g.thesisCorrect) stats.thesisRecord.correct++;
    }
    // FWP bucket accuracy
    if(g.fwpValue !== null && g.fwpCorrect !== null){
      var bucket = g.fwpValue >= 80 ? '80+' : g.fwpValue >= 70 ? '70-79' : g.fwpValue >= 60 ? '60-69' : '50-59';
      stats.fwpBuckets[bucket].total++;
      if(g.fwpCorrect) stats.fwpBuckets[bucket].correct++;
    }
    // FWP margin error (predicted win prob vs binary outcome)
    if(g.fwpValue !== null && g.fwpCorrect !== null){
      var expected = g.fwpValue / 100;
      var actual = g.fwpCorrect ? 1 : 0;
      marginErrors.push(Math.abs(expected - actual));
    }
    // Spread accuracy
    if(g.homeCovered !== null){
      stats.spreadRecord.total += 2; // both sides evaluated
      if(g.homeCovered) stats.spreadRecord.covered++;
      if(g.awayCovered) stats.spreadRecord.covered++;
    }
    // Track misses for pattern detection
    if(g.fwpCorrect === false && g.fwpValue >= 55){
      stats.commonMisses.push(g.matchup + ' (FWP:' + g.fwpValue + '% → lost)');
    }
  });

  stats.avgMarginError = marginErrors.length > 0 ? (marginErrors.reduce(function(a,b){return a+b;},0) / marginErrors.length * 100).toFixed(1) : 0;

  return stats;
}

function formatCalibrationForPrompt(){
  var stats = computeCalibrationStats();
  if(!stats) return '';
  var lines = ['CALIBRATION CONTEXT (last ' + stats.games + ' games):'];
  // Thesis record
  if(stats.thesisRecord.total > 0){
    var pct = (stats.thesisRecord.correct / stats.thesisRecord.total * 100).toFixed(0);
    lines.push('Thesis direction: ' + stats.thesisRecord.correct + '/' + stats.thesisRecord.total + ' correct (' + pct + '%)');
  }
  // FWP buckets
  Object.keys(stats.fwpBuckets).forEach(function(bucket){
    var b = stats.fwpBuckets[bucket];
    if(b.total >= 2){
      var pct = (b.correct / b.total * 100).toFixed(0);
      lines.push('FWP ' + bucket + '%: ' + b.correct + '/' + b.total + ' correct (' + pct + '% actual win rate)');
    }
  });
  // Avg margin error
  if(stats.avgMarginError > 0){
    lines.push('Avg FWP error: ' + stats.avgMarginError + '% ' + (parseFloat(stats.avgMarginError) > 20 ? '(over-confident — pull toward 50%)' : parseFloat(stats.avgMarginError) < 12 ? '(well-calibrated)' : '(moderate — review edge cases)'));
  }
  // Recent misses
  if(stats.commonMisses.length > 0){
    lines.push('Recent misses: ' + stats.commonMisses.slice(-3).join(', '));
  }
  return '\n' + lines.join('\n') + '\n';
}

async function buildWPProfiles(){
  if(_wpBuildRunning){ alert('WP profile build already running'); return; }
  if(!confirm('Build WP profiles for all NBA teams (last 20 games each)?\nThis takes ~3-5 minutes and fetches from ESPN.')) return;
  _wpBuildRunning = true;
  var btn = document.getElementById('btn-wp');
  if(btn) btn.textContent = '⏳ WP…';
  var log = function(msg){ console.log('[WP] ' + msg); showAlert('info', msg); };
  try{
    // 1. Fetch all ESPN team IDs
    log('Fetching ESPN team list…');
    var teamsResp = await fetch(FN+'espn-data?type=teams&league=nba');
    if(!teamsResp.ok) throw new Error('ESPN teams fetch failed: ' + teamsResp.status);
    var teamsData = await teamsResp.json();
    var teams = teamsData.teams || [];
    if(teams.length === 0) throw new Error('No teams returned from ESPN');
    log('Found ' + teams.length + ' teams');

    // 2. For each team, fetch schedule → last 20 completed games
    var teamGameMap = {}; // {abbr: [{eventId, date, homeAbbr, awayAbbr, homeScore, awayScore, homeWon}]}
    var allEventIds = {}; // {eventId: true} for dedup
    var schedulesFetched = 0;
    for(var ti = 0; ti < teams.length; ti++){
      var t = teams[ti];
      await new Promise(function(r){ setTimeout(r, 400); }); // stagger
      try{
        var schResp = await fetch(FN+'espn-data?type=team_schedule&league=nba&team_id='+t.espnId+'&limit=20');
        if(!schResp.ok){ log('⚠ Schedule failed for ' + t.abbr); continue; }
        var schData = await schResp.json();
        teamGameMap[t.abbr] = schData.games || [];
        (schData.games || []).forEach(function(g){ allEventIds[g.eventId] = true; });
        schedulesFetched++;
        if(schedulesFetched % 5 === 0) log('Schedules: ' + schedulesFetched + '/' + teams.length);
      }catch(e){ log('⚠ Schedule error ' + t.abbr + ': ' + e.message); }
    }
    var uniqueEvents = Object.keys(allEventIds);
    log('Schedules done. ' + uniqueEvents.length + ' unique games to fetch WP for');

    // 3. Batch fetch WP histories for all unique games
    var wpCache = {}; // {eventId: [{homeWP, secondsLeft, seq}]}
    var wpFetched = 0;
    for(var ei = 0; ei < uniqueEvents.length; ei++){
      var eid = uniqueEvents[ei];
      await new Promise(function(r){ setTimeout(r, 500); }); // 500ms stagger
      try{
        var wpResp = await fetch(FN+'espn-data?type=winprob&league=nba&event_id='+eid);
        if(!wpResp.ok){ continue; }
        var wpData = await wpResp.json();
        if(wpData.wpHistory && wpData.wpHistory.length > 10){
          wpCache[eid] = {
            history: wpData.wpHistory,
            homeAbbr: wpData.homeAbbr,
            awayAbbr: wpData.awayAbbr,
          };
        }
        wpFetched++;
        if(wpFetched % 20 === 0) log('WP histories: ' + wpFetched + '/' + uniqueEvents.length);
      }catch(e){ /* silent — individual game failure OK */ }
    }
    log('WP fetch done. Got ' + Object.keys(wpCache).length + ' game histories');

    // 4. Compute profiles per team
    var profiles = [];
    var teamAbbrs = Object.keys(teamGameMap);
    for(var ai = 0; ai < teamAbbrs.length; ai++){
      var abbr = teamAbbrs[ai];
      var teamGames = teamGameMap[abbr];
      var profile = computeWPProfile(abbr, teamGames, wpCache);
      if(profile){
        profiles.push({ team_alias: abbr, games_analyzed: profile.gamesAnalyzed, profile: profile });
      }
    }
    log('Computed ' + profiles.length + ' team profiles');

    // 5. Save to DB
    if(profiles.length > 0 && dbReady){
      var saveResp = await fetch(FN+'db-api?action=save_wp_profile', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ profiles: profiles, league: 'nba', season: '2025-26' })
      });
      var saveData = await saveResp.json();
      log('Saved ' + (saveData.saved||0) + ' profiles to DB');
    } else if(!dbReady){
      log('⚠ DB not ready — profiles computed but not saved');
    }

    log('✅ WP profile build complete! ' + profiles.length + ' teams profiled');
  }catch(e){
    log('❌ WP build error: ' + e.message);
    console.error('[WP] Build failed:', e);
  }finally{
    _wpBuildRunning = false;
    if(btn) btn.textContent = '📈 WP';
  }
}

function computeWPProfile(teamAbbr, teamGames, wpCache){
  if(!teamGames || teamGames.length === 0) return null;

  var analyzed = 0;
  var wins = 0, losses = 0;
  var trailed10 = {games:0, won:0};
  var trailed15 = {games:0, won:0};
  var trailed20 = {games:0, won:0};
  var led10 = {games:0, lost:0};
  var qSurges = {1:{total:0,sum:0,surges:0}, 2:{total:0,sum:0,surges:0}, 3:{total:0,sum:0,surges:0}, 4:{total:0,sum:0,surges:0}};
  var closingChanges = []; // WP change in last ~10% of game
  var allVolatility = []; // WP standard deviations per game
  var blowouts = 0; // games where WP reached 95%+ for this team

  for(var gi = 0; gi < teamGames.length; gi++){
    var g = teamGames[gi];
    var wp = wpCache[g.eventId];
    if(!wp || !wp.history || wp.history.length < 10) continue;

    var isHome = wp.homeAbbr === teamAbbr;
    var teamWon = isHome ? g.homeWon : !g.homeWon;
    var history = wp.history.map(function(p){ return isHome ? p.homeWP : (1 - p.homeWP); });

    analyzed++;
    if(teamWon) wins++; else losses++;

    // Comeback analysis
    var minWP = Math.min.apply(null, history);
    var maxWP = Math.max.apply(null, history);
    if(minWP < 0.25){ trailed10.games++; if(teamWon) trailed10.won++; }
    if(minWP < 0.15){ trailed15.games++; if(teamWon) trailed15.won++; }
    if(minWP < 0.08){ trailed20.games++; if(teamWon) trailed20.won++; }

    // Collapse analysis
    if(maxWP > 0.85){ led10.games++; if(!teamWon) led10.lost++; }

    // Blowout check
    if(maxWP >= 0.95) blowouts++;

    // Quarter surge analysis (split history into 4 equal chunks)
    var chunkSize = Math.floor(history.length / 4);
    if(chunkSize >= 3){
      for(var qi = 0; qi < 4; qi++){
        var qStart = qi * chunkSize;
        var qEnd = qi === 3 ? history.length : (qi+1) * chunkSize;
        var wpStart = history[qStart];
        var wpEnd = history[Math.min(qEnd-1, history.length-1)];
        var change = (wpEnd - wpStart) * 100; // in percentage points
        qSurges[qi+1].total++;
        qSurges[qi+1].sum += change;
        if(change >= 15) qSurges[qi+1].surges++;
      }
    }

    // Closing profile (last 10% of data points)
    var closeStart = Math.floor(history.length * 0.9);
    if(closeStart > 0 && closeStart < history.length){
      var closeChange = (history[history.length-1] - history[closeStart]) * 100;
      closingChanges.push(closeChange);
    }

    // Volatility: standard deviation of WP changes between consecutive points
    var changes = [];
    for(var vi = 1; vi < history.length; vi++){
      changes.push(Math.abs(history[vi] - history[vi-1]));
    }
    if(changes.length > 0){
      var mean = changes.reduce(function(a,b){return a+b;},0) / changes.length;
      var variance = changes.reduce(function(a,b){return a+(b-mean)*(b-mean);},0) / changes.length;
      allVolatility.push(Math.sqrt(variance));
    }
  }

  if(analyzed < 5) return null;

  // Aggregate
  var avgVolatility = allVolatility.length > 0 ? allVolatility.reduce(function(a,b){return a+b;},0) / allVolatility.length : 0;
  var avgClosing = closingChanges.length > 0 ? closingChanges.reduce(function(a,b){return a+b;},0) / closingChanges.length : 0;
  var holdRate = closingChanges.length > 0 ? Math.round(closingChanges.filter(function(c){return c >= -2;}).length / closingChanges.length * 100) : 0;

  // Classify team identity
  var identity = 'STEADY';
  if(trailed15.games >= 3 && trailed15.won / Math.max(1, trailed15.games) >= 0.5) identity = 'COMEBACK';
  else if(led10.games >= 5 && led10.lost / Math.max(1, led10.games) <= 0.10) identity = 'FRONTRUNNER';
  else if(avgVolatility > 0.025) identity = 'VOLATILE';
  else if(avgClosing >= 3) identity = 'CLOSER';

  var bestSurgeQ = 1;
  var bestSurgeAvg = -999;
  for(var sq = 1; sq <= 4; sq++){
    var avg = qSurges[sq].total > 0 ? qSurges[sq].sum / qSurges[sq].total : 0;
    if(avg > bestSurgeAvg){ bestSurgeAvg = avg; bestSurgeQ = sq; }
  }

  return {
    gamesAnalyzed: analyzed,
    record: wins + '-' + losses,
    comebackIndex: {
      trailed10: {games:trailed10.games, won:trailed10.won, rate:trailed10.games>0?Math.round(trailed10.won/trailed10.games*100):0},
      trailed15: {games:trailed15.games, won:trailed15.won, rate:trailed15.games>0?Math.round(trailed15.won/trailed15.games*100):0},
      trailed20: {games:trailed20.games, won:trailed20.won, rate:trailed20.games>0?Math.round(trailed20.won/trailed20.games*100):0},
    },
    quarterSurges: {
      q1: {avgWPChange:qSurges[1].total>0?+(qSurges[1].sum/qSurges[1].total).toFixed(1):0, surgeRate:qSurges[1].total>0?Math.round(qSurges[1].surges/qSurges[1].total*100):0},
      q2: {avgWPChange:qSurges[2].total>0?+(qSurges[2].sum/qSurges[2].total).toFixed(1):0, surgeRate:qSurges[2].total>0?Math.round(qSurges[2].surges/qSurges[2].total*100):0},
      q3: {avgWPChange:qSurges[3].total>0?+(qSurges[3].sum/qSurges[3].total).toFixed(1):0, surgeRate:qSurges[3].total>0?Math.round(qSurges[3].surges/qSurges[3].total*100):0},
      q4: {avgWPChange:qSurges[4].total>0?+(qSurges[4].sum/qSurges[4].total).toFixed(1):0, surgeRate:qSurges[4].total>0?Math.round(qSurges[4].surges/qSurges[4].total*100):0},
    },
    collapseRate: {led10:led10.games, lost:led10.lost, rate:led10.games>0?Math.round(led10.lost/led10.games*100):0},
    closingProfile: {avgWPChange:+avgClosing.toFixed(1), holdRate:holdRate},
    volatility: +avgVolatility.toFixed(4),
    wpShapeCluster: identity,
    blowoutRate: analyzed>0?Math.round(blowouts/analyzed*100):0,
    bestSurgeQuarter: 'Q'+bestSurgeQ,
    bestSurgeAvg: +bestSurgeAvg.toFixed(1),
  };
}

function exportCalibrationCSV(){
  var log = [];
  try{ log = JSON.parse(localStorage.getItem('nba4:calibration')||'[]'); }catch(e){}
  if(log.length === 0){ alert('No calibration data yet. Games must reach FINAL with a card open to capture.'); return; }

  var headers = ['date','matchup','home_pts','away_pts','winner','margin','thesis_team','thesis_correct','fwp_team','fwp_value','fwp_correct','entry_signal','conviction','home_spread','home_covered','away_covered','classification'];
  var rows = [headers.join(',')];
  log.forEach(function(e){
    var row = [
      e.date||'', e.matchup||'', e.homePoints||'', e.awayPoints||'',
      e.winner||'', e.margin||'', e.thesisTeam||'', e.thesisCorrect===null?'':e.thesisCorrect,
      e.fwpTeam||'', e.fwpValue!=null?e.fwpValue.toFixed(1):'', e.fwpCorrect===null?'':e.fwpCorrect,
      e.entry||'', e.conviction||'', e.homeSpread!=null?e.homeSpread:'',
      e.homeCovered===null?'':e.homeCovered, e.awayCovered===null?'':e.awayCovered,
      e.classification||''
    ];
    rows.push(row.map(function(v){ var s=String(v); return s.includes(',')?'"'+s+'"':s; }).join(','));
  });

  var csv = rows.join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'calibration_'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function fetchSummary(game){
  if(game.id === DEMO_ID) return; // Demo game — no API calls
  const cs = cardState[game.id];
  if(!cs || cs.editing || cs.generating) return;

  // If SR daily limit exhausted, go straight to BDL
  if(srExhausted){
    return fetchBdlFallback(game, 'SR daily limit exhausted');
  }

  addLog(game.id,'Fetching SR summary…',true);
  try{
    const data = await sr('summary',{game_id:game.id});
    sr429Count = 0; // reset on success
    game.summary = data;
    game.bdlData = null; // clear any fallback data
    game.dataSource = 'SR';
    game.homePoints = data.home?.points ?? 0;
    game.awayPoints = data.away?.points ?? 0;
    game.status = data.status;
    game.period = data.quarter || (data.home?.periods||[]).length || 0;
    game.clock = data.clock || '';
    // Build merged periods array for indicator use (SR nests under home/away)
    if(!data.periods && data.home?.periods){
      data.periods = (data.home.periods||[]).map((hp,i)=>{
        const ap = (data.away?.periods||[])[i]||{};
        return {number:hp.number||i+1, home_points:hp.points||0, away_points:ap.points||0};
      });
    }
    cs.lastUp = new Date();

    // ── STALENESS DETECTION ──
    // Separate score fingerprint from stats fingerprint
    const scoreFP = [data.home?.points, data.away?.points, game.period, data.clock].join('|');
    const hs = data.home?.statistics||{}, as = data.away?.statistics||{};
    const statsFP = [
      hs.turnovers, as.turnovers, hs.steals, as.steals,
      hs.field_goals_made, as.field_goals_made, hs.field_goals_att, as.field_goals_att,
      hs.assists, as.assists, hs.offensive_rebounds, as.offensive_rebounds,
      hs.free_throws_att, as.free_throws_att, hs.blocks, as.blocks,
      hs.points_in_the_paint, as.points_in_the_paint,
    ].join('|');

    const scoreChanged = scoreFP !== cs.lastScoreFP;
    const statsChanged = statsFP !== cs.lastStatsFP;

    if(scoreChanged && !statsChanged && cs.lastStatsFP){
      cs.staleCount = (cs.staleCount||0) + 1;
      if(cs.staleCount >= 2){
        // Stats frozen for 2+ polls while score changed — SR data is stale
        cs.dataFreshness = 'STALE';
        addLog(game.id, '⚠ STALE: score updated but stats frozen for '+cs.staleCount+' polls — trying BDL', false);
        return fetchBdlFallback(game, 'SR data stale (stats frozen '+cs.staleCount+' polls)');
      } else {
        cs.dataFreshness = 'WATCH';
        addLog(game.id, '⚠ Stats unchanged despite score change (poll '+cs.staleCount+')', false);
      }
    } else if(statsChanged){
      cs.staleCount = 0;
      cs.dataFreshness = 'FRESH';
    }
    cs.lastScoreFP = scoreFP;
    cs.lastStatsFP = statsFP;
    // ── END STALENESS DETECTION ──

    addLog(game.id,'OK — SR summary loaded'+(cs.dataFreshness==='WATCH'?' [stats lag]':''),true);

    // Build player baselines from p.average (season data in every summary)
    const bl = buildPlayerBaselines(game);
    if(bl){
      cs.baselines = bl;
      if(bl.built && !cs._baselineLogged){ addLog(game.id,'📊 Baselines built — '+Object.keys(bl.players).length+' players, stars: '+[...bl.stars.home,...bl.stars.away].join(', '),true); cs._baselineLogged=true; }
    }

    // Capture quarter snapshot (rolling window infrastructure)
    captureSnapshot(game);

    // Auto-fetch PBP silently on every poll (feeds shot zone data to sustainability)
    // Stagger per game to avoid SR 1 req/sec rate limit (summary + PBP = 2 calls per game)
    if(getState(game)==='LIVE' && !cs.pbpLoading){
      const gameIdx = games.filter(g=>getState(g)==='LIVE').findIndex(g=>g.id===game.id);
      const pbpDelay = 2000 + (gameIdx * 3000); // 2s base + 3s per game
      setTimeout(function(){ fetchPBPQuiet(game.id); }, pbpDelay);
    }

    // Auto-fetch ESPN win probability (every 2nd poll, staggered after PBP)
    var _espnSt = getState(game);
    if((_espnSt==='LIVE'||(_espnSt==='FINAL'&&!cs.espnWP)) && espnGameMap[game.id] && (!cs.espnWP || (Date.now() - (cs.espnWP.time?.getTime()||0)) > pollInterval * 1.5)){
      const espnDelay = 4000 + (games.filter(g=>getState(g)==='LIVE').findIndex(g=>g.id===game.id) * 2000);
      setTimeout(function(){ fetchEspnWinProb(game.id); }, espnDelay);
    }

    // Check if data changed meaningfully
    const fp = fingerprint(data);
    const changed = fp !== cs.lastFingerprint;
    cs.lastFingerprint = fp;

    renderCard(game);
    renderConfidenceTable();
    checkAlert(game);
    checkStructuralAlert(game);
    captureCalibration(game);
    // Save snapshot to DB (throttled: every 3rd poll when period >= 2)
    if(getState(game)==='LIVE' && game.period >= 2){
      if(!cs._dbPollCount) cs._dbPollCount = 0;
      cs._dbPollCount++;
      if(cs._dbPollCount % 3 === 0) saveSnapshotDB(game);
    }
    // Finalize to DB when game ends
    if(getState(game)==='FINAL' && !cs._dbFinalized){
      cs._dbFinalized = true;
      finalizeGameDB(game);
    }

    // Auto-analyze disabled — use manual ⚡ ANALYZE button to control token spend
    // if(changed && getState(game)==='LIVE' && game.period >= 2){
    //   triggerAnalysis(game);
    // }
  }catch(e){
    // Check if this is a rate limit — trigger BDL fallback
    if(e.message.includes('rate limit') || e.message.includes('429')){
      sr429Count++;
      // 3+ consecutive 429s across any games = daily limit suspected
      if(sr429Count >= 3){
        srExhausted = true;
        addLog(game.id,'⚠ SR DAILY LIMIT — switching to BDL for session',false);
        document.getElementById('hdr-sub').textContent = 'LIVE · BDL FALLBACK · v5.1 · PARTIAL';
      }
      return fetchBdlFallback(game, e.message);
    }
    addLog(game.id, e.message, false);
    renderCard(game);
  }
}

async function fetchBdlFallback(game, reason){
  const cs = cardState[game.id];
  if(!cs) return;
  addLog(game.id,'BDL fallback ('+reason+')',true);
  try{
    const data = await fetchBdlSummary(game);
    game.bdlData = data;
    game.summary = null; // clear SR data
    game.dataSource = 'BDL';
    game.homePoints = data.homePoints;
    game.awayPoints = data.awayPoints;
    game.period = data.period;
    game.clock = data.time || '';
    // Map BDL status to our format
    const bst = (data.status||'').toLowerCase();
    if(bst.includes('final')) game.status = 'closed';
    else if(bst.includes('progress')||data.period>0&&!bst.includes('final')) game.status = 'inprogress';
    cs.lastUp = new Date();
    addLog(game.id,'OK — BDL data loaded (PARTIAL)',true);

    const fp = fingerprintBDL(data);
    const changed = fp !== cs.lastFingerprint;
    cs.lastFingerprint = fp;

    renderCard(game);
    renderConfidenceTable();
    checkAlert(game);
    checkStructuralAlert(game);
    captureCalibration(game);
    if(getState(game)==='LIVE' && game.period >= 2){
      if(!cs._dbPollCount) cs._dbPollCount = 0;
      cs._dbPollCount++;
      if(cs._dbPollCount % 3 === 0) saveSnapshotDB(game);
    }
    if(getState(game)==='FINAL' && !cs._dbFinalized){
      cs._dbFinalized = true;
      finalizeGameDB(game);
    }

    // Auto-analyze disabled — use manual ⚡ ANALYZE button
    // if(changed && getState(game)==='LIVE' && game.period >= 2){
    //   triggerAnalysis(game);
    // }
  }catch(e){
    addLog(game.id, 'BDL fallback failed: '+e.message, false);
    renderCard(game);
  }
}

function fingerprintBDL(data){
  if(!data) return '';
  return [
    data.homePoints, data.awayPoints, data.period,
    data.home?.turnovers||data.home?.total_turnovers, data.away?.turnovers||data.away?.total_turnovers,
    data.home?.steals, data.away?.steals,
    data.home?.offensive_rebounds, data.away?.offensive_rebounds,
    data.home?.points_in_the_paint, data.away?.points_in_the_paint,
    data.home?.free_throws_att, data.away?.free_throws_att,
    data.home?.blocks, data.away?.blocks,
    data.home?.field_goals_made, data.away?.field_goals_made,
    data.home?.assists, data.away?.assists,
    data.homeBonus?1:0, data.awayBonus?1:0,
  ].join('|');
}

// FINGERPRINT (meaningful change detection)
// ══════════════════════════════════════════════════════════════════════════════
function fingerprint(summary){
  if(!summary) return '';
  const h = summary.home?.statistics||{}, a = summary.away?.statistics||{};
  return [
    summary.home?.points, summary.away?.points,
    summary.quarter || (summary.periods||[]).length,
    h.turnovers||h.total_turnovers, a.turnovers||a.total_turnovers,
    h.steals, a.steals,
    h.offensive_rebounds, a.offensive_rebounds,
    h.points_in_the_paint||h.points_in_paint, a.points_in_the_paint||a.points_in_paint,
    h.free_throws_att, a.free_throws_att,
    h.blocks, a.blocks,
    h.field_goals_made, a.field_goals_made,
    h.assists, a.assists,
    summary.home?.bonus?1:0, summary.away?.bonus?1:0,
    h.foulouts||0, a.foulouts||0,
    summary.lead_changes||0,
    h.most_unanswered?.points||0, a.most_unanswered?.points||0,
  ].join('|');
}
