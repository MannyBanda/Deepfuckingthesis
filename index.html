  renderGenProgress(gameId);

  const calls = [
    {key:'injuries', type:'injuries', params:{}},
    {key:'standings', type:'standings', params:{}},
    {key:'homeProfile', type:'profile', params:{team_id:homeId}},
    {key:'awayProfile', type:'profile', params:{team_id:awayId}},
    {key:'homeDepth', type:'depth_chart', params:{team_id:homeId}},
    {key:'awayDepth', type:'depth_chart', params:{team_id:awayId}},
    {key:'homeStats', type:'statistics', params:{team_id:homeId}},
    {key:'awayStats', type:'statistics', params:{team_id:awayId}},
    {key:'homeSplitsGame', type:'splits_game', params:{team_id:homeId}},
    {key:'awaySplitsGame', type:'splits_game', params:{team_id:awayId}},
    {key:'homeSplitsSchedule', type:'splits_schedule', params:{team_id:homeId}},
    {key:'awaySplitsSchedule', type:'splits_schedule', params:{team_id:awayId}},
  ];

  const cacheKey = 'nba4:srCache:'+gameId;
  let collected = {};

  // Always fetch fresh SR data — show every API call in progress UI
  for(let i=0; i<calls.length; i++){
    cs.genSteps[i+1].status = 'active';
    renderGenProgress(gameId);
    try{
      const data = await sr(calls[i].type, calls[i].params);
      collected[calls[i].key] = data;
      cs.genSteps[i+1].status = 'done';
    }catch(e){
      cs.genSteps[i+1].status = 'err';
      cs.genSteps[i+1].error = e.message;
    }
    renderGenProgress(gameId);
    if(i < calls.length-1) await new Promise(r=>setTimeout(r,1400));
  }
  // Cache for structural context extraction (used by extractStructuralContext)
  try{
    const cacheStr = JSON.stringify(collected);
    if(cacheStr.length < 3000000) localStorage.setItem(cacheKey, cacheStr);
    else console.warn('SR data too large to cache:', (cacheStr.length/1024).toFixed(0)+'KB');
  }catch(e){ console.warn('Cache write failed:', e.message); }

  // Extract structural context from cached SR data (closers, Pythagorean, opp profiles, shot diet)
  try{
    const structural = extractStructuralContext(gameId);
    if(structural && structural.built){
      cs.structural = structural;
      persistStructural(gameId, cs);
      addLog(gameId, '📊 Structural context extracted — '+structural.keyOuts.length+' key outs, diet: '+structural.shotDiet.home+'/'+structural.shotDiet.away, true);
    }
  }catch(e){ console.warn('Structural extract failed:', e.message); }

  // BDL Odds — skip if already populated by step 0 enrich
  if(cs.oddsData && cs.oddsData.homeML){
    cs.genSteps[13].status = 'done';
    renderGenProgress(gameId);
  } else {
  cs.genSteps[13].status = 'active';
  renderGenProgress(gameId);
  try{
    const bdlId = bdlGameMap[game.id];
    if(bdlId){
      try{
        const oddsResp = await bdl('odds',{game_id:bdlId});
        const oddsArr = oddsResp.data || oddsResp || [];
        if(Array.isArray(oddsArr) && oddsArr.length > 0){
          // Find consensus or first bookmaker
          const book = oddsArr[0];
          if(book){
            const hML = book.moneyline_home_odds || book.home_team_ml || book.home_moneyline || '';
            const aML = book.moneyline_away_odds || book.away_team_ml || book.away_moneyline || book.visitor_team_ml || '';
            const spread = book.spread_home_value || book.home_team_spread || book.home_spread || '';
            const total = book.total_value || book.over_under || book.total || '';
            if(hML || spread){
              if(cs.oddsData && cs.oddsData.homeML){
                cs.oddsHistory = cs.oddsHistory || [];
                cs.oddsHistory.push({...cs.oddsData, time: cs.oddsData.time || cs.lastUp?.toLocaleTimeString() || '?'});
                if(cs.oddsHistory.length > 20) cs.oddsHistory = cs.oddsHistory.slice(-20);
              }
              cs.oddsData = {homeSpread:String(spread), homeML:String(hML), awayML:String(aML), total:String(total), time:new Date().toLocaleTimeString()};
              if(!cs.openingOdds) cs.openingOdds = {...cs.oddsData};
              persistOdds(gameId, cs);
              console.log('BDL odds auto-populated:', cs.oddsData);
            }
          }
        }
      }catch(oe){ console.warn('BDL odds pull failed (non-fatal):', oe.message); }
    } else {
      console.log('No BDL game ID — odds not auto-populated');
    }
    cs.genSteps[13].status = 'done';
  }catch(e){
    cs.genSteps[13].status = 'err';
    cs.genSteps[13].error = 'optional';
  }
  } // end skip-if-already-populated
  renderGenProgress(gameId);

  // Now send to Sonnet via smart compute layer — server pre-computes SIA, redistribution, Pythagorean, BHV
  cs.genSteps[14].status = 'active';
  renderGenProgress(gameId);
  try{
    const tipTime = new Date(game.scheduled).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Phoenix'});

    // Trim functions to reduce prompt size (text sections for Sonnet context)
    const trimProfile = (p) => {
      if(!p) return '(unavailable)';
      const players = (p.players||[])
        .filter(pl => pl.status==='ACT'||pl.status==='SUS'||pl.status==='NWT')
        .map(pl => `${pl.full_name} [${pl.primary_position||pl.position||'?'}] ${pl.status}${pl.injuries?' — '+JSON.stringify(pl.injuries):''}`);
      return players.join('\n');
    };
    const trimStats = (s) => {
      if(!s) return '(unavailable)';
      const own = s.own_record||s;
      const teamStats = own.statistics||s.statistics||{};
      const oppStats = (s.opponents||{}).statistics||{};
      const players = (own.players||s.players||[])
        .sort((a,b)=>(b.average?.minutes||0)-(a.average?.minutes||0))
        .slice(0,10)
        .map(pl=>`${pl.full_name} [${pl.primary_position||'?'}] ${pl.average?.minutes||0}mpg ${pl.average?.points||0}ppg ${pl.average?.assists||0}apg ${pl.average?.rebounds||0}rpg ${pl.average?.steals||0}spg ${pl.average?.turnovers||0}to FG:${pl.average?.field_goals_made||0}/${pl.average?.field_goals_att||0} 3P:${pl.average?.three_points_made||0}/${pl.average?.three_points_att||0} FT:${pl.average?.free_throws_made||0}/${pl.average?.free_throws_att||0} USG:${(pl.average?.usage_pct||0).toFixed(1)}%`);
      const t = teamStats;
      const teamLine = `Team: ${t.points||0}ppg ${t.assists||0}apg ${t.rebounds||0}rpg ${t.steals||0}spg ${t.blocks||0}bpg ${t.turnovers||t.total_turnovers||0}to FBP:${t.fast_break_points||0} POT:${t.points_off_turnovers||0} SCP:${t.second_chance_points||0} Paint:${t.points_in_the_paint||0} OREB:${t.offensive_rebounds||0} FTA:${t.free_throws_att||0} eFG:${(((t.field_goals_made||0)+.5*(t.three_points_made||0))/(t.field_goals_att||1)*100).toFixed(1)}%`;
      const opp = oppStats;
      const oppLine = opp ? `Opp allowed: ${opp.points||0}ppg Paint:${opp.points_in_the_paint||0} FTA:${opp.free_throws_att||0} OREB:${opp.offensive_rebounds||0} Stl:${opp.steals||0}` : '';
      return teamLine + '\n' + oppLine + '\nTop players:\n' + players.join('\n');
    };
    const trimSplits = (s) => {
      if(!s) return '(unavailable)';
      const str = JSON.stringify(s);
      return str.length > 12000 ? str.substring(0, 12000) + '...(truncated)' : str;
    };
    const trimDepth = (d) => {
      if(!d) return '(unavailable)';
      // Resolve positions from various SR nesting structures
      let pos = [];
      if(d.positions){
        if(Array.isArray(d.positions)) pos = d.positions;
        else if(typeof d.positions === 'object'){
          Object.keys(d.positions).forEach(posName=>{
            const val = d.positions[posName];
            let players = [];
            if(Array.isArray(val)) players = val;
            else if(val?.players && Array.isArray(val.players)) players = val.players;
            else if(val && typeof val === 'object') players = Object.values(val).filter(v=>v&&typeof v==='object'&&(v.full_name||v.name));
            if(players.length>0) pos.push({name:posName, position:posName, players});
          });
        }
      }
      if(pos.length===0 && Array.isArray(d)) pos = d;
      if(pos.length===0 && d.depth_chart){
        if(Array.isArray(d.depth_chart)) pos = d.depth_chart;
        else if(d.depth_chart.positions) return trimDepth(d.depth_chart);
      }
      if(pos.length===0){
        const skip = ['id','name','market','alias','founded','sr_id','reference','venue','league','conference','division','coaches'];
        for(const k of Object.keys(d)){
          if(skip.includes(k)) continue;
          const v = d[k];
          if(Array.isArray(v) && v.length > 0 && v[0] && (Array.isArray(v[0].players) || v[0].name || v[0].position)){
            pos = v; break;
          }
        }
      }
      console.log('Depth chart resolved:', pos.length, 'positions from', Object.keys(d).slice(0,6));
      if(pos.length===0) return JSON.stringify(d).substring(0,2000);
      return pos.map(p =>
        (p.name||p.position||'?') + ': ' + (Array.isArray(p.players)?p.players:[]).map(pl=>`${pl.depth||'?'}. ${pl.full_name||pl.name||'?'}`).join(', ')
      ).join('\n');
    };
    const trimStandings = (s) => {
      if(!s) return '(unavailable)';
      const teams = [];
      (s.conferences||[]).forEach(conf=>{
        (conf.divisions||[]).forEach(div=>{
          (div.teams||[]).forEach(t=>{
            teams.push(`${t.name} ${t.wins}-${t.losses} (${(t.win_pct||0).toFixed(3)}) PF:${t.calc_points?.for||'?'} PA:${t.calc_points?.against||'?'}`);
          });
        });
      });
      return teams.join('\n');
    };
    const trimInjuries = (inj) => {
      if(!inj) return '(unavailable)';
      return (inj.teams||[]).filter(t=>(t.players||[]).length>0)
        .map(t=> (t.alias||t.market||'?') + ': ' + (t.players||[]).map(p=>{
          const injArr = Array.isArray(p.injuries)?p.injuries:[];
          const li = injArr.length>0?injArr[0]:{};
          return `${p.full_name} [${p.primary_position||p.position||'?'}] ${li.status||p.status||'?'} — ${li.desc||li.comment||p.desc||'?'}`;
        }).join('; '))
        .join('\n');
    };

    const c = collected;
    const safe = (fn, label) => { try{ return fn(); }catch(e){ console.error('TRIM CRASH in '+label+':', e.message, e.stack); return '(ERROR: '+label+' — '+e.message+')'; } };

    // Build text sections for Sonnet context
    const sections = {
      injuries: safe(()=>trimInjuries(c.injuries), 'injuries'),
      homeRoster: safe(()=>trimProfile(c.homeProfile), 'homeProfile'),
      awayRoster: safe(()=>trimProfile(c.awayProfile), 'awayProfile'),
      homeDepth: safe(()=>trimDepth(c.homeDepth), 'homeDepth'),
      awayDepth: safe(()=>trimDepth(c.awayDepth), 'awayDepth'),
      homeStats: safe(()=>trimStats(c.homeStats), 'homeStats'),
      awayStats: safe(()=>trimStats(c.awayStats), 'awayStats'),
      homeSplitsGame: safe(()=>trimSplits(c.homeSplitsGame), 'homeSplitsGame'),
      awaySplitsGame: safe(()=>trimSplits(c.awaySplitsGame), 'awaySplitsGame'),
      homeSplitsSchedule: safe(()=>trimSplits(c.homeSplitsSchedule), 'homeSplitsSchedule'),
      awaySplitsSchedule: safe(()=>trimSplits(c.awaySplitsSchedule), 'awaySplitsSchedule'),
      standings: safe(()=>trimStandings(c.standings), 'standings'),
    };

    // ── RECENT FORM + RETURNING DETECTION (BDL recent game box scores) ──
    const _returningByTeam = {}; // alias → [{name, position}]
    const _recentForm = {home:null, away:null};
    sections.returning = '';
    sections.recentForm = '';
    try{
      const hBdlId = BDL_TEAM_IDS[homeAlias], aBdlId = BDL_TEAM_IDS[awayAlias];
      if(hBdlId && aBdlId){
        // Get yesterday's date as end_date, 10 days back as start_date
        const today = new Date();
        const yesterday = new Date(today.getTime() - 24*60*60*1000);
        const tenDaysAgo = new Date(today.getTime() - 10*24*60*60*1000);
        const fmtDate = (d) => d.toISOString().split('T')[0];

        // Pull last 5 games per team (2 BDL calls)
        await new Promise(r=>setTimeout(r,200));
        const [hGamesResp, aGamesResp] = await Promise.all([
          bdl('team_games',{team_id:String(hBdlId), per_page:'5', end_date:fmtDate(yesterday), start_date:fmtDate(tenDaysAgo)}),
          bdl('team_games',{team_id:String(aBdlId), per_page:'5', end_date:fmtDate(yesterday), start_date:fmtDate(tenDaysAgo)}),
        ]);
        // Sort by date descending (most recent first) then take last 3
        const sortByDateDesc = (arr) => (arr||[]).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
        const hGames = sortByDateDesc(hGamesResp.data).slice(0,3);
        const aGames = sortByDateDesc(aGamesResp.data).slice(0,3);
        const hGameIds = hGames.map(g=>g.id).filter(Boolean);
        const aGameIds = aGames.map(g=>g.id).filter(Boolean);
        addLog(gameId, '📊 Recent games: '+homeAlias+' '+hGameIds.length+' ('+hGames.map(g=>g.date||'?').join(',')+') | '+awayAlias+' '+aGameIds.length+' ('+aGames.map(g=>g.date||'?').join(',')+')', false);

        // Build set of injured player names to exclude from NEW/RETURNING
        const _injuredNames = new Set();
        if(c.injuries && c.injuries.teams){
          c.injuries.teams.forEach(function(t){
            (t.players||[]).forEach(function(p){
              const injArr = Array.isArray(p.injuries)?p.injuries:[];
              const li = injArr.length>0?injArr[0]:{};
              const st = (li.status||p.status||'').toUpperCase();
              if(st==='OUT'||st==='O'||st.includes('OUT FOR SEASON')) _injuredNames.add((p.full_name||'').toLowerCase().trim());
            });
          });
        }

        // Pull box scores for those games (2 BDL calls)
        let hStats = [], aStats = [];
        if(hGameIds.length > 0 || aGameIds.length > 0){
          await new Promise(r=>setTimeout(r,200));
          const [hStatsResp, aStatsResp] = await Promise.all([
            hGameIds.length>0 ? bdl('multi_stats',{game_ids:hGameIds.join(',')}) : {data:[]},
            aGameIds.length>0 ? bdl('multi_stats',{game_ids:aGameIds.join(',')}) : {data:[]},
          ]);
          hStats = hStatsResp.data||[];
          aStats = aStatsResp.data||[];
        }

        // Process each team's recent form
        function processTeamForm(stats, games, bdlTeamId, alias, profile, injuredNames){
          if(!games.length) return null;
          // Filter stats to this team's players
          const teamStats = stats.filter(s => (s.team?.id||s.player?.team_id) == bdlTeamId);
          // Group by game
          const byGame = {};
          teamStats.forEach(s => {
            const gid = s.game?.id || s.game_id;
            if(!gid) return;
            if(!byGame[gid]) byGame[gid] = [];
            byGame[gid].push(s);
          });

          // Players who appeared in recent games (had minutes)
          const recentPlayerNames = new Set();
          const playerGameStats = {}; // name → [{pts, min, fgm, fga, fg3m, fg3a, ...}]
          Object.values(byGame).forEach(gamePlayers => {
            gamePlayers.forEach(s => {
              const mins = s.min ? parseInt(s.min) : 0;
              if(mins < 1) return;
              const name = ((s.player?.first_name||'')+' '+(s.player?.last_name||'')).trim();
              const nameLower = name.toLowerCase();
              recentPlayerNames.add(nameLower);
              if(!playerGameStats[nameLower]) playerGameStats[nameLower] = {name, games:[]};
              playerGameStats[nameLower].games.push({
                pts:s.pts||0, min:mins, fgm:s.fgm||0, fga:s.fga||0,
                fg3m:s.fg3m||0, fg3a:s.fg3a||0, ftm:s.ftm||0, fta:s.fta||0,
                reb:s.reb||0, ast:s.ast||0, stl:s.stl||0, blk:s.blk||0, turnover:s.turnover||0,
              });
            });
          });

          // Detect NEW/RETURNING — on active roster but not in recent box scores
          // Could be returning from injury OR new acquisition making debut
          const returning = [];
          if(profile && profile.players){
            profile.players.forEach(pl => {
              if(pl.status!=='ACT') return;
              const name = pl.full_name||'';
              const nameLower = name.toLowerCase().trim();
              if(nameLower && !recentPlayerNames.has(nameLower)){
                // Skip players already listed as OUT on injury report
                if(injuredNames && injuredNames.has(nameLower)) return;
                returning.push({name, position:pl.primary_position||pl.position||'?'});
                console.log('NEW/RETURNING detected:', name, alias, '| not in recent box scores');
              }
            });
          }

          // Compute per-player averages for hot/cold detection
          const hot = [], cold = [], minsShift = [];
          Object.values(playerGameStats).forEach(p => {
            const gp = p.games.length;
            if(gp < 2) return;
            const avgPts = p.games.reduce((a,g)=>a+g.pts,0)/gp;
            const avgMin = p.games.reduce((a,g)=>a+g.min,0)/gp;
            const avgFga = p.games.reduce((a,g)=>a+g.fga,0)/gp;
            const avgFgPct = avgFga>0 ? (p.games.reduce((a,g)=>a+g.fgm,0)/gp) / avgFga * 100 : 0;
            // Look up season averages from SR profile
            let sznPts = 0, sznMin = 0;
            if(profile && profile.players){
              const match = profile.players.find(pl => (pl.full_name||'').toLowerCase().trim() === p.name.toLowerCase().trim());
              if(match && match.average){
                sznPts = match.average.points||0;
                sznMin = match.average.minutes ? parseFloat(match.average.minutes) : 0;
              }
            }
            if(sznPts > 8 && avgPts > sznPts * 1.3) hot.push({name:p.name, avg:avgPts.toFixed(1), szn:sznPts.toFixed(1), fgPct:avgFgPct.toFixed(0)});
            else if(sznPts > 8 && avgPts < sznPts * 0.7) cold.push({name:p.name, avg:avgPts.toFixed(1), szn:sznPts.toFixed(1), fgPct:avgFgPct.toFixed(0)});
            if(sznMin > 12 && avgMin > sznMin + 6) minsShift.push({name:p.name, avg:avgMin.toFixed(1), szn:sznMin.toFixed(1)});
          });

          // Team record in recent games
          const record = {w:0, l:0, avgPts:0};
          games.forEach(g => {
            const isHome = g.home_team?.id == bdlTeamId;
            const tPts = isHome ? (g.home_team_score||0) : (g.visitor_team_score||0);
            const oPts = isHome ? (g.visitor_team_score||0) : (g.home_team_score||0);
            if(tPts > oPts) record.w++; else record.l++;
            record.avgPts += tPts;
          });
          record.avgPts = games.length>0 ? (record.avgPts/games.length).toFixed(1) : 0;

          return {returning, hot, cold, minsShift, record, gamesPlayed:games.length};
        }

        _recentForm.home = processTeamForm(hStats, hGames, hBdlId, homeAlias, c.homeProfile, _injuredNames);
        _recentForm.away = processTeamForm(aStats, aGames, aBdlId, awayAlias, c.awayProfile, _injuredNames);

        // Build sections
        function formatTeamForm(form, alias){
          if(!form) return '';
          let out = alias+' RECENT (last '+form.gamesPlayed+' games: '+form.record.w+'-'+form.record.l+', avg '+form.record.avgPts+' pts):\n';
          if(form.returning.length) out += '  RETURNING: '+form.returning.map(r=>r.name+' ['+r.position+']').join(', ')+'\n';
          if(form.hot.length) out += '  HOT: '+form.hot.map(h=>h.name+' '+h.avg+' PPG (szn '+h.szn+')').join(', ')+'\n';
          if(form.cold.length) out += '  COLD: '+form.cold.map(h=>h.name+' '+h.avg+' PPG on '+h.fgPct+'% FG (szn '+h.szn+')').join(', ')+'\n';
          if(form.minsShift.length) out += '  MINUTES SHIFT: '+form.minsShift.map(m=>m.name+' '+m.avg+' mpg (szn '+m.szn+')').join(', ')+'\n';
          return out;
        }
        sections.recentForm = '\n=== RECENT FORM (last 3 games) ===\n' + formatTeamForm(_recentForm.away, awayAlias) + formatTeamForm(_recentForm.home, homeAlias);

        // Populate _returningByTeam for availability builder
        if(_recentForm.home && _recentForm.home.returning.length){
          _returningByTeam[homeAlias.toUpperCase()] = _recentForm.home.returning;
        }
        if(_recentForm.away && _recentForm.away.returning.length){
          _returningByTeam[awayAlias.toUpperCase()] = _recentForm.away.returning;
        }
        const allRet = [...(_recentForm.home?.returning||[]), ...(_recentForm.away?.returning||[])];
        if(allRet.length > 0){
          sections.returning = '\nNEW/RETURNING PLAYERS NOTE: Players listed as NEW/RETURNING are on the active roster but did NOT play in the team\'s last 3 games. This includes players returning from injury AND new acquisitions making their debut. Evaluate as structural upgrades — the team\'s recent performance was WITHOUT them.\n';
          addLog(gameId, '🔄 '+allRet.length+' returning player(s): '+allRet.map(r=>r.name).join(', '), true);
        }
        addLog(gameId, '📊 Recent form computed ('+hGames.length+'H/'+aGames.length+'A games)', true);
      }
    }catch(e){
      console.warn('Recent form pull failed (optional):', e.message);
      addLog(gameId, '⚠ Recent form: '+e.message, false);
    }

    // ── PRE-COMPUTED AVAILABILITY (team-by-team, cross-referenced) ──
    sections.availability = safe(()=>{
      const injMap = {};
      if(c.injuries && c.injuries.teams){
        c.injuries.teams.forEach(function(t){
          (t.players||[]).forEach(function(p){
            const injArr = Array.isArray(p.injuries)?p.injuries:[];
            const li = injArr.length>0?injArr[0]:{};
            const st = (li.status||p.status||'').toUpperCase();
            injMap[(p.full_name||'').toLowerCase().trim()] = {
              status: st, desc: li.desc||li.comment||p.desc||'', team: (t.alias||'').toUpperCase(),
            };
          });
        });
      }

      function buildTeamAvail(profile, alias){
        if(!profile||!profile.players) return alias+': (roster unavailable)';
        const inPlayers = [], outPlayers = [], gtdPlayers = [];
        profile.players.forEach(function(pl){
          if(pl.status!=='ACT'&&pl.status!=='SUS'&&pl.status!=='NWT') return;
          const name = pl.full_name||'?';
          const pos = pl.primary_position||pl.position||'?';
          const nameLower = name.toLowerCase().trim();
          const inj = injMap[nameLower];
          if(inj){
            const st = inj.status;
            if(st==='OUT'||st==='O'){
              outPlayers.push(name+' ['+pos+'] ❌ OUT'+(inj.desc?' — '+inj.desc:''));
            } else if(st==='DAY-TO-DAY'||st==='DAY TO DAY'||st==='GTD'||st==='QUESTIONABLE'||st==='DOUBTFUL'||st==='D'||st==='PROBABLE'){
              gtdPlayers.push(name+' ['+pos+'] ⚠️ '+st+(inj.desc?' — '+inj.desc:''));
            } else {
              inPlayers.push(name);
            }
          } else {
            inPlayers.push(name);
          }
        });
        // Build returning tag
        const ret = _returningByTeam[alias.toUpperCase()] || [];
        const retStr = ret.length > 0 ? ' | 🔄 NEW/RETURNING: '+ret.map(function(r){return r.name+' ['+r.position+']';}).join(', ') : '';
        let out = alias+': '+inPlayers.length+' players available'+retStr;
        if(outPlayers.length) out += '\n'+alias+' OUT: '+outPlayers.join(' | ');
        if(gtdPlayers.length) out += '\n'+alias+' GTD: '+gtdPlayers.join(' | ');
        if(!outPlayers.length && !gtdPlayers.length && !ret.length) out += ' (full strength)';
        return out+'\n';
      }

      return buildTeamAvail(c.awayProfile, awayAlias) + buildTeamAvail(c.homeProfile, homeAlias);
    }, 'availability');

    // Inject enrichment data into sections
    const od = cs.oddsData;
    if(od && (od.homeML || od.homeSpread)){
      sections.odds = '\n=== MARKET ODDS ===\nSpread: '+homeAlias+' '+(od.homeSpread||'N/A')+' | ML: '+awayAlias+' '+(od.awayML||'N/A')+' / '+homeAlias+' '+(od.homeML||'N/A')+' | O/U: '+(od.total||'N/A')+'\n';
    } else {
      sections.odds = '\n=== MARKET ODDS ===\nNot yet available — ML THRESHOLD will read "Awaiting odds"\n';
    }
    const td = cs.trackingData;
    if(td){
      const ht = td.home||{}, at = td.away||{};
      let trk = '\n=== SHOOTING BASELINES (BDL Tracking) ===\n';
      if(at.catchAndShoot || ht.catchAndShoot) trk += 'Catch & Shoot eFG%: '+awayAlias+' '+(at.catchAndShoot?at.catchAndShoot.efg||'?':'?')+'% | '+homeAlias+' '+(ht.catchAndShoot?ht.catchAndShoot.efg||'?':'?')+'%\n';
      if(at.pullUp || ht.pullUp) trk += 'Pull-up eFG%: '+awayAlias+' '+(at.pullUp?at.pullUp.efg||'?':'?')+'% | '+homeAlias+' '+(ht.pullUp?ht.pullUp.efg||'?':'?')+'%\n';
      sections.tracking = trk;
    } else { sections.tracking = ''; }
    // ESPN Win Probability context for Sonnet
    var ewp = cs.espnWP;
    if(ewp){
      var wpTeam = ewp.home >= ewp.away ? (ewp.homeAlias||homeAlias) : (ewp.awayAlias||awayAlias);
      var wpPct = Math.max(ewp.home, ewp.away);
      sections.espnWP = '\n=== ESPN WIN PROBABILITY ===\n'+wpTeam+' '+wpPct+'% (home:'+ewp.home+'% away:'+ewp.away+'%)'+(ewp.opening!=null?' | Opening: home '+ewp.opening+'%':'')+' | '+ewp.dataPoints+' data points\n';
    } else { sections.espnWP = ''; }
    const cd = cs.clutchData;
    if(cd){
      const tierLabel = cd.tier===1?'L15 NBA.com (Tier 1)':cd.tier===2?'Season BDL (Tier 2)':'Proxy (Tier 3)';
      let cl = '\n=== CLUTCH DATA ('+tierLabel+') ===\n';
      if(cd.away) cl += awayAlias+': NetRtg '+(cd.away.netRtg!=null?cd.away.netRtg:'N/A')+' OffRtg '+(cd.away.offRtg!=null?cd.away.offRtg:'N/A')+' DefRtg '+(cd.away.defRtg!=null?cd.away.defRtg:'N/A')+' '+(cd.away.wl||'')+'\n';
      if(cd.home) cl += homeAlias+': NetRtg '+(cd.home.netRtg!=null?cd.home.netRtg:'N/A')+' OffRtg '+(cd.home.offRtg!=null?cd.home.offRtg:'N/A')+' DefRtg '+(cd.home.defRtg!=null?cd.home.defRtg:'N/A')+' '+(cd.home.wl||'')+'\n';
      sections.clutch = cl;
    } else { sections.clutch = ''; }

    // Build analytical payload — raw structured data for server-side SIA computation
    const analytical = {
      injuries: c.injuries || {},
      homeProfile: c.homeProfile || {},
      awayProfile: c.awayProfile || {},
      homeStats: c.homeStats || {},
      awayStats: c.awayStats || {},
      homeDepth: c.homeDepth || {},
      awayDepth: c.awayDepth || {},
      standings: c.standings || {},
    };

    const payload = {
      matchup: { home: homeAlias, away: awayAlias, homeId: homeId, awayId: awayId, date: getSlateDate(0).str, time: tipTime, venue: game.venue||'TBD' },
      sections: sections,
      analytical: analytical,
    };

    console.log('Thesis payload size:', (JSON.stringify(payload).length/1024).toFixed(1)+'KB');
    // Pre-send diagnostic — what does the client think it's sending?
    const injCheck = payload.analytical.injuries;
    console.log('%c📋 CLIENT PRE-SEND: injuries', 'color:#f0c040;font-weight:bold', {
      type: typeof injCheck, isNull: injCheck===null, isUndef: injCheck===undefined,
      topKeys: injCheck ? Object.keys(injCheck) : 'N/A',
      hasTeams: injCheck ? Array.isArray(injCheck.teams) : false,
      teamsCount: injCheck && Array.isArray(injCheck.teams) ? injCheck.teams.length : 0,
      sampleTeam: injCheck && Array.isArray(injCheck.teams) && injCheck.teams.length > 0 ? {alias:injCheck.teams[0].alias, players:(injCheck.teams[0].players||[]).length} : 'N/A',
      jsonSize: injCheck ? JSON.stringify(injCheck).length : 0
    });
    console.log('%c📋 CLIENT PRE-SEND: all analytical', 'color:#f0c040', {
      injuries: injCheck ? Object.keys(injCheck).join(',') : 'EMPTY',
      homeProfile: payload.analytical.homeProfile ? (payload.analytical.homeProfile.players||[]).length + ' players' : 'EMPTY',
      awayProfile: payload.analytical.awayProfile ? (payload.analytical.awayProfile.players||[]).length + ' players' : 'EMPTY',
      homeStats: payload.analytical.homeStats ? Object.keys(payload.analytical.homeStats).join(',') : 'EMPTY',
      awayStats: payload.analytical.awayStats ? Object.keys(payload.analytical.awayStats).join(',') : 'EMPTY',
      homeDepth: payload.analytical.homeDepth ? Object.keys(payload.analytical.homeDepth).join(',') : 'EMPTY',
      awayDepth: payload.analytical.awayDepth ? Object.keys(payload.analytical.awayDepth).join(',') : 'EMPTY',
      standings: payload.analytical.standings ? Object.keys(payload.analytical.standings).join(',') : 'EMPTY',
    });

    // ── STREAMING THESIS GENERATION ──
    // Reads SSE stream from generate-thesis (Netlify v2 streaming function)
    // Events: preComputed → delta (×N) → done
    const resp = await fetch(FN+'generate-thesis',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });

    // Non-streaming fallback (legacy or error response)
    const contentType = resp.headers.get('content-type')||'';
    if(contentType.includes('application/json')){
      if(!resp.ok){
        const errData = await resp.json().catch(()=>({error:'Unknown error '+resp.status}));
        throw new Error(errData.error||'Thesis gen failed: '+resp.status);
      }
      const data = await resp.json();
      theses[gameId] = (data.thesis||'').replace(/\*\*/g,'').replace(/^#{1,3}\s/gm,'');
      try{ localStorage.setItem('nba4:theses', JSON.stringify(theses)); }catch(e){ console.warn('Thesis persist failed:', e.message); }
      if(dbReady) fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'nba',text:theses[gameId]})}).catch(function(){});
      if(data.preComputed) processPreComputed(data.preComputed);
    } else {
      // SSE stream reader
      if(!resp.ok) throw new Error('Thesis gen failed: '+resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let sseBuffer = '';
      let streamedThesis = '';

      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        sseBuffer += decoder.decode(value, {stream:true});

        // Parse complete SSE events (separated by \n\n)
        const events = sseBuffer.split('\n\n');
        sseBuffer = events.pop()||''; // keep incomplete event in buffer

        for(const evt of events){
          const lines = evt.trim().split('\n');
          for(const line of lines){
            if(!line.startsWith('data: ')) continue;
            try{
              const parsed = JSON.parse(line.slice(6));
              if(parsed.type === 'preComputed'){
                processPreComputed(parsed.data);
                addLog(gameId, '📡 Streaming thesis...', true);
              } else if(parsed.type === 'delta' && parsed.text){
                streamedThesis += parsed.text;
                // Progressive UI update — show thesis as it streams
                theses[gameId] = streamedThesis.replace(/\*\*/g,'').replace(/^#{1,3}\s/gm,'');
                renderCard(game);
              } else if(parsed.type === 'done'){
                streamedThesis = parsed.thesis || streamedThesis;
                theses[gameId] = streamedThesis.replace(/\*\*/g,'').replace(/^#{1,3}\s/gm,'');
                try{ localStorage.setItem('nba4:theses', JSON.stringify(theses)); }catch(e){ console.warn('Thesis persist failed:', e.message); }
                if(dbReady) fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'nba',text:theses[gameId]})}).catch(function(){});
                if(parsed.usage) addLog(gameId, '📊 Tokens: in='+((parsed.usage.input_tokens||0))+' out='+((parsed.usage.output_tokens||0)), true);
              } else if(parsed.type === 'error'){
                throw new Error(parsed.error||'Stream error');
              }
            }catch(parseErr){
              if(parseErr.message && !parseErr.message.includes('JSON')) throw parseErr;
              // Skip unparseable SSE lines
            }
          }
        }
      }
    }

    // Fallback: if SSE ended without a 'done' event, persist anyway
    if(theses[gameId] && theses[gameId].length > 50){
      try{ localStorage.setItem('nba4:theses', JSON.stringify(theses)); }catch(e){}
      if(dbReady) fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'nba',text:theses[gameId]})}).catch(function(){});
      addLog(gameId, '✅ Thesis saved ('+theses[gameId].length+' chars)', true);
    }

    // Process preComputed data (shared by both streaming and fallback paths)
    function processPreComputed(pc){
      if(!pc) return;
      addLog(gameId, '🔬 SIA: '+homeAlias+' '+pc.rosterAudit.homeOut+' OUT ('+((pc.rosterAudit.homeOutNames||[]).join(', ')||'none')+'), '+awayAlias+' '+pc.rosterAudit.awayOut+' OUT ('+((pc.rosterAudit.awayOutNames||[]).join(', ')||'none')+')'+(pc.depletion.home?' | '+homeAlias+' '+pc.depletion.home.label:'')+(pc.depletion.away?' | '+awayAlias+' '+pc.depletion.away.label:''), true);
      cs.siaCaps = pc.siaCaps;
      cs.floorScores = pc.floorScores || null;
      if(cs.floorScores){
        ['home','away'].forEach(side=>{
          const f = cs.floorScores[side];
          if(f) addLog(gameId, '📊 FLOOR: '+(side==='home'?homeAlias:awayAlias)+' minimum '+f.floor.toFixed(3)+' ('+f.verdict+') — '+f.details.join(', '), true);
        });
      }
      if(pc.diagnostics){
        const dx = pc.diagnostics;
        console.log('%c📋 DATA INTEGRITY REPORT', 'color:#f0c040;font-weight:bold', dx);
        let dxLog = '📋 Data: '+dx.summary;
        if(dx.critical && dx.critical.length > 0) dxLog += ' ❌ '+dx.critical.join(', ');
        if(dx.warnings && dx.warnings.length > 0) dxLog += ' ⚠️ '+dx.warnings.join(', ');
        addLog(gameId, dxLog, true);
        const cr = dx.crossRef || {};
        if(cr.home && cr.home.length > 0) addLog(gameId, '🔗 '+homeAlias+' xref: '+cr.home.join(' | '), true);
        if(cr.away && cr.away.length > 0) addLog(gameId, '🔗 '+awayAlias+' xref: '+cr.away.join(' | '), true);
        const injDx = dx.endpoints && dx.endpoints.injuries;
        if(injDx){
          const matchedStr = (injDx.matchedTeams||[]).map(t=>(t.side||'?')+'='+t.market+' '+t.name+':'+t.players+'p').join(', ');
          addLog(gameId, '🩺 Injuries: '+(injDx.hasTeams?injDx.teamsCount+' teams':'NO .teams[]')+' | matched=['+matchedStr+'] | topKeys=['+((injDx.topKeys||[]).join(','))+']', true);
          if(injDx.sampleTeamKeys) addLog(gameId, '🩺 Team keys: '+injDx.sampleTeamKeys.join(', '), true);
          if(injDx.samplePlayerKeys) addLog(gameId, '🩺 Player keys: '+injDx.samplePlayerKeys.join(', '), true);
          if(injDx.samplePlayerDump) addLog(gameId, '🩺 Sample player: '+JSON.stringify(injDx.samplePlayerDump).substring(0,300), true);
          if(injDx.rawPlayerKeys) addLog(gameId, '🔑 MATCHED player keys: '+injDx.rawPlayerKeys.join(', '), true);
          if(injDx.rawPlayerJSON) addLog(gameId, '🔑 RAW PLAYER: '+injDx.rawPlayerJSON, true);
          if(injDx.matchedPlayerStatuses && injDx.matchedPlayerStatuses.length > 0) addLog(gameId, '🩺 Statuses: '+injDx.matchedPlayerStatuses.join(' | '), true);
          if(injDx.nestedPath) addLog(gameId, '🩺 ⚠️ Found nested path: '+injDx.nestedPath+' — compute may need patching', true);
        }
        ['home','away'].forEach(side=>{
          const depDx = dx.endpoints && dx.endpoints[side+'Depth'];
          if(depDx){
            addLog(gameId, '📐 '+(side==='home'?homeAlias:awayAlias)+' depth: '+(depDx.resolvedPositions||0)+' positions | hasPositions:'+depDx.hasPositions+' | allKeys=['+(depDx.allKeys||[]).join(',')+']', true);
            if(depDx.keyTypes) addLog(gameId, '📐 keyTypes: '+Object.entries(depDx.keyTypes).map(([k,v])=>k+':'+v).join(' | '), true);
          }
        });
      }
    }
    cs.genSteps[14].status = 'done';
  }catch(e){
    cs.genSteps[14].status = 'err';
    cs.genSteps[14].error = e.message;
    console.error('Thesis generation failed at step 14:', e.message, e.stack);
  }
  cs.generating = false;
  renderConfidenceTable();
  cs.genError = cs.genSteps[14]?.status==='err' ? cs.genSteps[14].error : null;
  paused = wasPaused; // Resume polling state
  renderCard(game);
}

function renderGenProgress(gameId){
  const el = document.getElementById('gen-progress-'+gameId);
  const cs = cardState[gameId];
  if(!el||!cs?.genSteps) return;
  el.innerHTML = cs.genSteps.map(s=>{
    const icon = s.status==='done'?'✓':s.status==='active'?'⟳':s.status==='err'?'✗':'·';
    return `<span class="gen-step ${s.status}">${icon} ${s.label}${s.error?' — '+s.error:''}</span>`;
  }).join('<br>');
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPUTE INDICATORS (SR FORMAT)
// ══════════════════════════════════════════════════════════════════════════════
function compute(game){
  if(!game?.summary || getState(game)==='PRE') return null;
  const s = game.summary;
  const H = s.home, A = s.away;
  const hs = H?.statistics||{}, as = A?.statistics||{};
  const hA = H?.alias||H?.name||'HOME', aA = A?.alias||A?.name||'AWAY';
  const hS = H?.points||0, aS = A?.points||0;

  // I1 — Possession & Transition
  const hGen = (hs.steals||0)+(hs.offensive_rebounds||0)-(hs.turnovers||hs.total_turnovers||0);
  const aGen = (as.steals||0)+(as.offensive_rebounds||0)-(as.turnovers||as.total_turnovers||0);
  const hConv = (hs.fast_break_points||0)+(hs.points_off_turnovers||0)+(hs.second_chance_points||0);
  const aConv = (as.fast_break_points||0)+(as.points_off_turnovers||0)+(as.second_chance_points||0);
  let i1 = (hGen>aGen?1:hGen<aGen?-1:0)+(hConv>aConv?1:hConv<aConv?-1:0);
  // Chaos layer from PBP — forced vs unforced TOs
  const pbp = cardState[game.id]?.pbpAudit;
  let chaosNote = '';
  if(pbp){
    const hForced = pbp.away.tos.forced||0; // home team FORCES opponent (away) TOs
    const aForced = pbp.home.tos.forced||0; // away team FORCES opponent (home) TOs
    const hUnforced = pbp.home.tos.unforced||0; // home team's own unforced
    const aUnforced = pbp.away.tos.unforced||0; // away team's own unforced
    if(hForced >= aForced+3) { i1 += 1; chaosNote = ` | CHAOS:${hA} +${hForced-aForced} forced`; }
    else if(aForced >= hForced+3) { i1 -= 1; chaosNote = ` | CHAOS:${aA} +${aForced-hForced} forced`; }
    else if(hUnforced >= aUnforced+3) { i1 -= 1; chaosNote = ` | CHAOS:${hA} ${hUnforced} unforced`; }
    else if(aUnforced >= hUnforced+3) { i1 += 1; chaosNote = ` | CHAOS:${aA} ${aUnforced} unforced`; }
    else { chaosNote = ` | chaos:even`; }
  }
  const I1={score:i1>0?1:i1===0?.5:0, leader:i1>0?hA:i1<0?aA:'EVEN',
    detail:`${hA} ${hs.steals||0}stl ${hs.offensive_rebounds||0}or ${hs.turnovers||hs.total_turnovers||0}to | ${aA} ${as.steals||0}stl ${as.offensive_rebounds||0}or ${as.turnovers||as.total_turnovers||0}to | Conv:${hConv}–${aConv}${chaosNote}`};

  // I2 — Rim Pressure & Foul
  var hPaint = hs.points_in_the_paint||hs.points_in_paint||0, aPaint = as.points_in_the_paint||as.points_in_paint||0;
  // SR often delays points_in_the_paint — use PBP at-rim makes × 2 as floor proxy
  if(pbp){
    if(!hPaint && pbp.home?.rim?.made) hPaint = pbp.home.rim.made * 2;
    if(!aPaint && pbp.away?.rim?.made) aPaint = pbp.away.rim.made * 2;
  }
  const hAtRim = hs.field_goals_at_rim_att||0, aAtRim = as.field_goals_at_rim_att||0;
  const hFTA = hs.free_throws_att||0, aFTA = as.free_throws_att||0;
  const hBlk = hs.blocks||0, aBlk = as.blocks||0;
  const hFD = hs.fouls_drawn||0, aFD = as.fouls_drawn||0;
  const rimScore = (hPaint+hAtRim+hFTA+hBlk+Math.round(hFD*.5))-(aPaint+aAtRim+aFTA+aBlk+Math.round(aFD*.5));
  const hBonusTag = H?.double_bonus?'⬤⬤':H?.bonus?'⬤':'', aBonusTag = A?.double_bonus?'⬤⬤':A?.bonus?'⬤':'';
  const I2={score:rimScore>10?1:rimScore<-10?0:.5, leader:rimScore>10?hA:rimScore<-10?aA:'EVEN',
    detail:`Paint:${hPaint}–${aPaint} AtRim:${hs.field_goals_at_rim_made||0}/${hAtRim}–${as.field_goals_at_rim_made||0}/${aAtRim} FTA:${hFTA}–${aFTA} FD:${hFD}–${aFD} BLK:${hBlk}–${aBlk}${hBonusTag?' '+hA+hBonusTag:''}${aBonusTag?' '+aA+aBonusTag:''}`};

  // I3 — Shot Quality & Creation (enhanced with PBP zone data)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const hEFG=(((hs.field_goals_made||0)+.5*(hs.three_points_made||0))/hFGA);
  const aEFG=(((as.field_goals_made||0)+.5*(as.three_points_made||0))/aFGA);
  const hAst=hs.assists||0, aAst=as.assists||0;
  const hFGM=hs.field_goals_made||1, aFGM=as.field_goals_made||1;
  const hAR=(hAst/hFGM)*100, aAR=(aAst/aFGM)*100;
  const i3=(hEFG>aEFG+.02?1:hEFG<aEFG-.02?-1:0)+(hAR>aAR+5?1:hAR<aAR-5?-1:0);
  let i3detail=`eFG%:${(hEFG*100).toFixed(1)}–${(aEFG*100).toFixed(1)} AR:${hAR.toFixed(0)}–${aAR.toFixed(0)} AST:${hAst}–${aAst}`;
  if(pbp){
    const hD=pbp.home?.shotDiet, aD=pbp.away?.shotDiet;
    if(hD&&aD) i3detail+=` | diet ${hA}:rim${hD.rimPct}%/mid${hD.midPct}%/3pt${hD.threePct}% ${aA}:rim${aD.rimPct}%/mid${aD.midPct}%/3pt${aD.threePct}%`;
  }
  const I3={score:i3>0?1:i3===0?.5:0, leader:i3>0?hA:i3<0?aA:'EVEN', detail:i3detail};

  // I4 — Lineup Integrity
  const periods = s.periods||[];
  const qDs = periods.map(p=>(p.home_points||0)-(p.away_points||0));
  const trend = qDs.length>=2 ? qDs[qDs.length-1]-qDs[0] : 0;
  const hBigLead = hs.biggest_lead||0, aBigLead = as.biggest_lead||0;
  const hBench = hs.bench_points||0, aBench = as.bench_points||0;
  const hRun = hs.most_unanswered?.points||0, aRun = as.most_unanswered?.points||0;
  const hTimeLead = hs.time_leading||'', aTimeLead = as.time_leading||'';
  const lc = s.lead_changes||0, tt = s.times_tied||0;
  const hTO_rem = H?.remaining_timeouts, aTO_rem = A?.remaining_timeouts;
  const benchD = hBench - aBench;
  const i4 = (hBigLead>aBigLead+4?1:hBigLead<aBigLead-4?-1:0)+(trend>2?1:trend<-2?-1:0)+(benchD>10?1:benchD<-10?-1:0);
  let i4detail = `BigLead:${hBigLead}–${aBigLead} Bench:${hBench}–${aBench} Δ:${hS>aS?'+':''}${hS-aS} trend:${trend>0?'+':''}${trend} ${qDs.map((d,i)=>'Q'+(i+1)+':'+(d>0?'+':'')+d).join(' ')}`;
  if(hRun||aRun) i4detail += ` | runs:${hA}${hRun} ${aA}${aRun}`;
  if(hTimeLead||aTimeLead) i4detail += ` | lead:${hA}${hTimeLead} ${aA}${aTimeLead}`;
  if(lc||tt) i4detail += ` | LC:${lc} TT:${tt}`;
  if(hTO_rem!=null||aTO_rem!=null) i4detail += ` | TO:${hTO_rem!=null?hA+hTO_rem:'?'}/${aTO_rem!=null?aA+aTO_rem:'?'}`;
  const I4={score:i4>0?1:i4===0?.5:0, leader:i4>0?hA:i4<0?aA:'EVEN', detail:i4detail};

  // I5 — Tempo & Efficiency
  const hOPPP = hs.offensive_points_per_possession||0, aOPPP = as.offensive_points_per_possession||0;
  const hDPPP = hs.defensive_points_per_possession||0, aDPPP = as.defensive_points_per_possession||0;
  const effD = (hOPPP-aDPPP)-(aOPPP-hDPPP);
  const hPoss = hs.possessions||0, aPoss = as.possessions||0;
  const hTS = hs.true_shooting_pct||0, aTS = as.true_shooting_pct||0;
  const hATO = hs.assists_turnover_ratio||0, aATO = as.assists_turnover_ratio||0;
  const hTransO = hs.transition_offense, aTransO = as.transition_offense;
  const hTransD = hs.transition_defense, aTransD = as.transition_defense;
  const hEGS = hs.efficiency_game_score||0, aEGS = as.efficiency_game_score||0;
  let i5detail = `OPPP:${hOPPP.toFixed(2)}–${aOPPP.toFixed(2)} DPPP:${hDPPP.toFixed(2)}–${aDPPP.toFixed(2)} NetΔ:${effD>0?'+':''}${effD.toFixed(3)} Poss:${hPoss}–${aPoss}`;
  i5detail += ` TS:${hTS.toFixed?hTS.toFixed(1):hTS}–${aTS.toFixed?aTS.toFixed(1):aTS} A/TO:${hATO.toFixed?hATO.toFixed(1):hATO}–${aATO.toFixed?aATO.toFixed(1):aATO}`;
  if(hEGS||aEGS) i5detail += ` EGS:${hEGS.toFixed?hEGS.toFixed(1):hEGS}–${aEGS.toFixed?aEGS.toFixed(1):aEGS}`;
  if(hTransO!=null&&aTransO!=null) i5detail += ` TransO:${hTransO}–${aTransO} TransD:${hTransD||'?'}–${aTransD||'?'}`;
  const I5={score:effD>0.08?1:effD<-0.08?0:.5, leader:effD>0.08?hA:effD<-0.08?aA:'EVEN', detail:i5detail};

  const raw = I1.score*W.I1 + I2.score*W.I2 + I3.score*W.I3 + I4.score*W.I4 + I5.score*W.I5;
  const controlHome = raw>=.5, cTeam = controlHome?hA:aA;
  let score = controlHome?raw:1-raw;

  // Pythagorean cap (requires structural context from thesis gen)
  const struct = cardState[game.id]?.structural;
  let pythNote = null;
  if(struct?.built && struct.pythagorean){
    const cSide = controlHome?'home':'away';
    const pyth = struct.pythagorean[cSide];
    if(pyth && pyth.cap && score > pyth.cap){
      pythNote = cTeam+' PYTH CAP: actual '+pyth.actual+'-'+(pyth.gp-pyth.actual)+' vs expected '+pyth.expected.toFixed(0)+' ('+pyth.delta.toFixed(1)+') — capped at '+pyth.cap;
      score = pyth.cap;
    }
  }

  // Client-side sustainability audit
  const bl = cardState[game.id]?.baselines;
  let clientSust = null;
  if(bl && bl.built){
    const tracking = cardState[game.id]?.trackingData;
    const pbpA = cardState[game.id]?.pbpAudit;
    const hSust = computeSustainabilityClient(H, bl, hA, 'home', tracking, pbpA);
    const aSust = computeSustainabilityClient(A, bl, aA, 'away', tracking, pbpA);
    clientSust = {home:hSust, away:aSust};
    cardState[game.id].clientSustainability = clientSust;
  }

  // Client-side lead composition (cross-references sustainability)
  const clientLC = computeLeadCompositionClient(game, clientSust);
  if(clientLC) cardState[game.id].clientLeadComposition = clientLC;
  // Persist updated sustainability + lead comp so they survive refresh
  if(cardState[game.id].analysis) persistAnalysis(game.id, cardState[game.id]);

  // Rolling window — quarter-based
  var windowResult = computeRollingWindow(game);
  cardState[game.id].rollingWindow = windowResult;
  var _pwSize = getPossWindowSize(game);
  var pbpWindow = computePossessionWindow(game, _pwSize);
  cardState[game.id].pbpWindow = pbpWindow;


  // Gap acceleration — uses PBP window (falls back to QTR)
  // Floor reference: prefer Sonnet's structural read when available (smarter), fall back to client compute
  var _cs = cardState[game.id];
  var _floorScore = (_cs.sonnetIndicators ? _cs.sonnetIndicators.score : score);
  var _floorTeam = (_cs.sonnetIndicators ? _cs.sonnetIndicators.controlTeam : cTeam);
  var _gapWindow = (pbpWindow && pbpWindow.available) ? pbpWindow : windowResult;
  if(_gapWindow && _gapWindow.available){
    updateGapLog(game.id, _floorScore, _floorTeam, _gapWindow, game);
  }
  const accelResult = computeAcceleration(cardState[game.id].gapLog);
  cardState[game.id].acceleration = accelResult;

  // Sub-metric arrows
  const arrows = computeSubMetricArrows(game.id);
  cardState[game.id].subMetricArrows = arrows;

  // Adjustment signal
  const adjustment = classifyAdjustment(arrows, _floorTeam, hA, aA);
  cardState[game.id].adjustment = adjustment;

  // Combined read
  const combinedRead = classifyCombinedRead(_floorScore, _floorTeam, _gapWindow, accelResult);
  cardState[game.id].combinedRead = combinedRead;

  // Margin projection (feeds spread conviction)
  const projection = computeProjection(game);
  if(projection) cardState[game.id].projection = projection;

  // Spread conviction (uses projection when available)
  const spreadConv = computeSpreadConviction(game);
  if(spreadConv) cardState[game.id].spreadConviction = spreadConv;

  // Trajectory
  const traj = buildTrajectory(game, hA, aA, hs, as, H, A, hS, aS, qDs, periods);

  const gameMeta = {
    leadChanges:s.lead_changes||0, timesTied:s.times_tied||0,
    hRun:hs.most_unanswered, aRun:as.most_unanswered,
    hTimeLead:hs.time_leading, aTimeLead:as.time_leading,
    hFoulouts:hs.foulouts||0, aFoulouts:as.foulouts||0,
    hTS:hs.true_shooting_pct||0, aTS:as.true_shooting_pct||0,
    hATO:hs.assists_turnover_ratio||0, aATO:as.assists_turnover_ratio||0,
    hEGS:hs.efficiency_game_score||0, aEGS:as.efficiency_game_score||0,
    hTimeouts:H?.remaining_timeouts, aTimeouts:A?.remaining_timeouts,
  };

  return {I1,I2,I3,I4,I5, score, controlTeam:cTeam, dataQuality:'FULL', traj, pythNote, clientSust, gameMeta};
}

function buildTrajectory(game, hA, aA, hs, as, H, A, hS, aS, qDs, periods){
  const p = game.period||0;
  if(p<2) return {signals:[], lean:'NEUTRAL', count:0, total:0, tooEarly:true};
  const sigs = [], overall=hS-aS, currQ=qDs.length>0?qDs[qDs.length-1]:null;

  // T1 — Role Player Heater (real player-level detection when baselines available)
  const pbpD = cardState[game.id]?.pbpAudit;
  const bl = cardState[game.id]?.baselines;
  if(bl && bl.built){
    let bestHeater = null;
    (H.players||[]).concat(A.players||[]).forEach(pl=>{
      const live = pl.statistics||{};
      const live3a = live.three_points_att||0, live3m = live.three_points_made||0;
      if(live3a<3) return;
      const name = pl.full_name||pl.name||'?';
      const b = bl.players[name];
      if(!b || b.szn3Pct===null) return;
      const livePct = live3m/live3a*100;
      if(livePct > b.szn3Pct+15 && (b.tier==='NON'||b.tier==='AVG'||b.tier==='UNK')){
        const dev = livePct-b.szn3Pct;
        if(!bestHeater || dev>bestHeater.dev) bestHeater = {name,team:b.team,livePct,sznPct:b.szn3Pct,tier:b.tier,dev,live3m,live3a};
      }
    });
    if(bestHeater){
      const beneficiary = bestHeater.team===hA ? aA : hA;
      sigs.push({key:'T1',w:1,team:beneficiary,color:'#ffd166',
        text:bestHeater.name+' '+bestHeater.live3m+'/'+bestHeater.live3a+' 3PT ('+bestHeater.livePct.toFixed(0)+'% vs '+bestHeater.sznPct.toFixed(0)+'% szn) '+bestHeater.tier+' — '+bestHeater.team+' lead variance-sourced'});
    } else {
      sigs.push({key:'T1',w:0,team:null,color:'#3e3e48',text:'No role player heater detected'});
    }
  } else {
    // Fallback: conversion signal when baselines unavailable
    const hC=(hs.fast_break_points||0)+(hs.points_off_turnovers||0), aC=(as.fast_break_points||0)+(as.points_off_turnovers||0);
    if(Math.abs(hC-aC)>=10){const w=hC>aC?hA:aA;sigs.push({key:'T1*',w:1,team:w,color:'#ffd166',text:w+' conversion +'+(Math.abs(hC-aC))+' (FBP+POT) [no baseline]'});}
    else sigs.push({key:'T1*',w:0,team:null,color:'#3e3e48',text:'Conversion flat ('+hC+'–'+aC+') [no baseline]'});
  }

  // T2 — Star Process Integrity Check
  if(bl && bl.built){
    let starFlag = null;
    const allStars = [...(bl.stars.home||[]), ...(bl.stars.away||[])];
    for(const starName of allStars){
      const b = bl.players[starName]; if(!b || b.sznFGPct===null) continue;
      const plObj = (b.side==='home'?H:A)?.players?.find(x=>(x.full_name||x.name)===starName);
      if(!plObj) continue;
      const live = plObj.statistics||{};
      const liveFGA = live.field_goals_att||0, liveFGM = live.field_goals_made||0;
      if(liveFGA<6) continue;
      const livePct = liveFGM/liveFGA*100;
      if(livePct < b.sznFGPct-10){
        // Check process: Q-over-Q assists from periods
        let processLabel = 'intact';
        if(periods && periods.length>=2){
          const plPeriods = plObj.periods||[];
          if(plPeriods.length>=2){
            const lastQAst = plPeriods[plPeriods.length-1]?.statistics?.assists||0;
            const prevQAst = plPeriods[plPeriods.length-2]?.statistics?.assists||0;
            if(lastQAst>prevQAst+1) processLabel='accelerating';
            else if(lastQAst<prevQAst-1) processLabel='declining';
          }
        }
        const liveFGA2 = live.field_goals_att||0;
        const liveAst = live.assists||0, liveReb = live.rebounds||0;
        if(liveAst<=1 && liveReb<=2 && liveFGA2>=10) processLabel='collapsed';
        // Attribution: cold + accelerating/intact → benefits star's team; declining/collapsed → benefits opponent
        const starTeam = b.team;
        const beneficiary = (processLabel==='accelerating'||processLabel==='intact') ? starTeam : (starTeam===hA?aA:hA);
        const col = (processLabel==='declining'||processLabel==='collapsed') ? '#ff6b6b' : '#ffd166';
        starFlag = {name:starName,team:starTeam,livePct,sznPct:b.sznFGPct,process:processLabel,beneficiary,col};
        break; // Report most impactful star
      }
    }
    if(starFlag){
      sigs.push({key:'T2',w:1,team:starFlag.beneficiary,color:starFlag.col,
        text:starFlag.name+' '+starFlag.livePct.toFixed(0)+'% FG (vs '+starFlag.sznPct.toFixed(0)+'% szn) — process '+starFlag.process});
    } else {
      sigs.push({key:'T2',w:0,team:null,color:'#3e3e48',text:'Stars shooting within range'});
    }
  } else {
    sigs.push({key:'T2*',w:0,team:null,color:'#3e3e48',text:'No baseline data'});
  }

  // T3 — Possession Window Delta (highest weight)
  // PBP-powered: uses last N possessions point differential instead of period boundaries
  // Fallback to quarter/half delta if PBP window unavailable
  var _pw = cardState[game.id]?.pbpWindow;
  var _t3fired = false;
  if(_pw && _pw.available && _pw._raw){
    var _wDelta = _pw._raw.hPts - _pw._raw.aPts;
    var _wSize = _pw.windowPossessions || 25;
    var _t3thresh = Math.max(5, Math.round(_wSize * 0.16));
    if(Math.abs(_wDelta) >= _t3thresh){
      var _t3w = _wDelta>0 ? hA : aA;
      var _t3tr = (_wDelta>0 && overall<0) || (_wDelta<0 && overall>0);
      sigs.push({key:'T3',w:2,team:_t3w,color:'#00ff88',text:_t3w+' +'+Math.abs(_wDelta)+' in last '+_wSize+' poss'+(_t3tr?' (trailing\u2014comeback)':'')});
      _t3fired = true;
    }
  }
  if(!_t3fired){
    if(currQ!=null&&Math.abs(currQ)>=6){var _t3w2=currQ>0?hA:aA,_t3tr2=(currQ>0&&overall<0)||(currQ<0&&overall>0);sigs.push({key:'T3*',w:2,team:_t3w2,color:'#00ff88',text:_t3w2+' winning period by '+Math.abs(currQ)+(_t3tr2?' (trailing\u2014comeback)':'')+' [fallback]'});}
    else sigs.push({key:'T3',w:0,team:null,color:'#3e3e48',text:'Window delta <threshold \u2014 neutral'});
  }

  // T4 — Foul Gate (now available via SR per-player data)
  let t4sig = {key:'T4',w:0,team:null,color:'#3e3e48',text:'No foul crisis detected'};
  if(H?.players && A?.players){
    const hFoulouts = (H.players||[]).filter(pl=>pl.fouled_out||pl.statistics?.personal_fouls>=6);
    const aFoulouts = (A.players||[]).filter(pl=>pl.fouled_out||pl.statistics?.personal_fouls>=6);
    if(hFoulouts.length>0){
      const names = hFoulouts.map(pl=>pl.full_name||'?').join(', ');
      t4sig={key:'T4',w:2,team:aA,color:'#ff6b6b',text:names+' FOULED OUT — '+hA+' lost rotation piece'+(hFoulouts.length>1?'s':'')};
    } else if(aFoulouts.length>0){
      const names = aFoulouts.map(pl=>pl.full_name||'?').join(', ');
      t4sig={key:'T4',w:2,team:hA,color:'#ff6b6b',text:names+' FOULED OUT — '+aA+' lost rotation piece'+(aFoulouts.length>1?'s':'')};
    } else {
      const allPlayers = [...(H.players||[]).map(pl=>({...pl,team:hA})),...(A.players||[]).map(pl=>({...pl,team:aA}))];
      for(const pl of allPlayers){
        const pf = pl.statistics?.personal_fouls||0;
        if((p<=1&&pf>=2)||(p===2&&pf>=3)||(p===3&&pf>=4)){
          const level=p<=1?'WATCH':p===2?'CONSTRAINT':'CRISIS';
          t4sig={key:'T4',w:1,team:pl.team===hA?aA:hA,color:'#ff6b6b',text:(pl.full_name||'?')+' '+pf+' fouls Q'+p+' — '+level};
          break;
        }
      }
    }
  }
  sigs.push(t4sig);

  // T5 — Interior Trend (enhanced with PBP at-rim context)
  const hPaint=hs.points_in_the_paint||hs.points_in_paint||0, aPaint=as.points_in_the_paint||as.points_in_paint||0;
  if(Math.abs(hPaint-aPaint)>=8){
    const w=hPaint>aPaint?hA:aA;
    let t5detail=w+' paint +'+(Math.abs(hPaint-aPaint))+' ('+hPaint+'–'+aPaint+')';
    if(pbpD){
      const wRim = w===hA ? pbpD.home?.rim : pbpD.away?.rim;
      if(wRim && wRim.byPlayer && wRim.byPlayer.length>0){
        // Show top rim attacker's context breakdown
        const top = wRim.byPlayer[0];
        const ctxStr = Object.entries(top.contexts||{}).map(([k,v])=>k+':'+v).join('/');
        t5detail += ' | rim: '+wRim.made+'/'+wRim.att+' ('+top.name+' '+top.made+'/'+top.att+' '+ctxStr+')';
      }
    }
    sigs.push({key:'T5',w:1,team:w,color:'#a8ff78',text:t5detail});
  }
  else sigs.push({key:'T5',w:0,team:null,color:'#3e3e48',text:'Paint even ('+hPaint+'–'+aPaint+')'});

  // T6 — Assist Ratio
  const hFGM=hs.field_goals_made||1,aFGM=as.field_goals_made||1;
  const hAR=(hs.assists||0)/hFGM*100, aAR=(as.assists||0)/aFGM*100;
  if(Math.abs(hAR-aAR)>=15){const w=hAR>aAR?hA:aA;sigs.push({key:'T6',w:1,team:w,color:'#a8ff78',text:w+' AR '+Math.max(hAR,aAR).toFixed(0)+'% vs '+Math.min(hAR,aAR).toFixed(0)+'%'});}
  else sigs.push({key:'T6',w:0,team:null,color:'#3e3e48',text:'AR even ('+hAR.toFixed(0)+'% vs '+aAR.toFixed(0)+'%)'});

  // T7 — Closing Lineup (real closer identification)
  let t7sig = {key:'T7',w:0,team:null,color:'#3e3e48',text:'Lineup data pending'};
  if(p>=2 && H?.players && A?.players){
    const hOnCourt = (H.players||[]).filter(pl=>pl.on_court).map(pl=>pl.full_name||'?');
    const aOnCourt = (A.players||[]).filter(pl=>pl.on_court).map(pl=>pl.full_name||'?');
    // Use baselines starters OR structural closers for identification
    const knownClosers = cardState[game.id]?.structural?.closers;
    const knownStarters = bl?.starters;
    const hClosers = knownClosers?.home || knownStarters?.home || [];
    const aClosers = knownClosers?.away || knownStarters?.away || [];
    if(hClosers.length>0 || aClosers.length>0){
      const hCloserCount = hOnCourt.filter(n=>hClosers.some(c=>n.includes(c)||c.includes(n))).length;
      const aCloserCount = aOnCourt.filter(n=>aClosers.some(c=>n.includes(c)||c.includes(n))).length;
      // Get combined +/- of on-court players
      const hPM = (H.players||[]).filter(pl=>pl.on_court).reduce((s,pl)=>s+(pl.statistics?.pls_min||0),0);
      const aPM = (A.players||[]).filter(pl=>pl.on_court).reduce((s,pl)=>s+(pl.statistics?.pls_min||0),0);
      if(hCloserCount>=4 && hPM>0){
        t7sig = {key:'T7',w:1,team:hA,color:'#a8ff78',text:hA+' closing '+hCloserCount+'/5 on floor (+'+ hPM+' combined) — sustained'};
      } else if(aCloserCount>=4 && aPM>0){
        t7sig = {key:'T7',w:1,team:aA,color:'#a8ff78',text:aA+' closing '+aCloserCount+'/5 on floor (+'+aPM+' combined) — sustained'};
      } else if(hCloserCount<=2 && hPM>0){
        t7sig = {key:'T7',w:0,team:null,color:'#ffd166',text:hA+' bench-heavy generating (+'+hPM+') — CONDITIONAL'};
      } else if(aCloserCount<=2 && aPM>0){
        t7sig = {key:'T7',w:0,team:null,color:'#ffd166',text:aA+' bench-heavy generating (+'+aPM+') — CONDITIONAL'};
      } else {
        t7sig.text = hA+': '+hCloserCount+'/'+hClosers.length+' closers ('+hPM+') | '+aA+': '+aCloserCount+'/'+aClosers.length+' ('+aPM+')';
      }
    } else {
      t7sig.text = hA+': '+hOnCourt.length+' on court | '+aA+': '+aOnCourt.length+' on court';
    }
  }
  sigs.push(t7sig);

  // T8 — Shot Diet Misalignment (team-specific thresholds)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const h3r=(hs.three_points_att||0)/hFGA*100, a3r=(as.three_points_att||0)/aFGA*100;
  // Determine thresholds based on team identity
  const struct = cardState[game.id]?.structural;
  let hThreshold=40, aThreshold=40;
  if(bl && bl.built){
    hThreshold = (bl.teamSeason3PARate?.home||35) + (struct?.shotDiet?.home==='INTERIOR'?8:struct?.shotDiet?.home==='PERIMETER'?12:10);
    aThreshold = (bl.teamSeason3PARate?.away||35) + (struct?.shotDiet?.away==='INTERIOR'?8:struct?.shotDiet?.away==='PERIMETER'?12:10);
  }
  if(h3r>=hThreshold){
    let detail = hA+' 3PA/FGA '+h3r.toFixed(0)+'% vs '+hThreshold.toFixed(0)+'% threshold — MISALIGNED';
    if(pbpD){
      const h3 = pbpD.home.threes;
      const astPct = h3.made>0 ? (h3.assisted/h3.made*100).toFixed(0) : '0';
      detail += ' ('+astPct+'% ast)';
    }
    sigs.push({key:'T8',w:1,team:aA,color:'#ff6b6b',text:detail});
  } else if(a3r>=aThreshold){
    let detail = aA+' 3PA/FGA '+a3r.toFixed(0)+'% vs '+aThreshold.toFixed(0)+'% threshold — MISALIGNED';
    if(pbpD){
      const a3 = pbpD.away.threes;
      const astPct = a3.made>0 ? (a3.assisted/a3.made*100).toFixed(0) : '0';
      detail += ' ('+astPct+'% ast)';
    }
    sigs.push({key:'T8',w:1,team:hA,color:'#ff6b6b',text:detail});
  } else {
    let dietNote = hA+' '+h3r.toFixed(0)+'%'+(bl?.built?' (thr:'+hThreshold.toFixed(0)+'%)':'')+' / '+aA+' '+a3r.toFixed(0)+'%'+(bl?.built?' (thr:'+aThreshold.toFixed(0)+'%)':'');
    if(pbpD) dietNote += ' | rim:'+pbpD.home.shotDiet.rimPct+'%/'+pbpD.away.shotDiet.rimPct+'%';
    sigs.push({key:'T8',w:0,team:null,color:'#3e3e48',text:'Diet aligned ('+dietNote+')'});
  }

  const lm={};sigs.forEach(s=>{if(s.team&&s.w>0)lm[s.team]=(lm[s.team]||0)+s.w;});
  const sorted=Object.entries(lm).sort((a,b)=>b[1]-a[1]),lean=sorted.length>0?sorted[0][0]:'NEUTRAL';
  const count=sigs.filter(s=>s.team===lean&&s.w>0).length,total=sigs.filter(s=>s.w>0).length;
  return {signals:sigs, lean, count, total, tooEarly:false};
}

// ══════════════════════════════════════════════════════════════════════════════
// DECISION SYNTHESIZER — resolves all signals into one actionable read
// ══════════════════════════════════════════════════════════════════════════════
function synthesize(game){
  var cs = cardState[game.id]; if(!cs) return null;
  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hPts = game.homePoints||0, aPts = game.awayPoints||0;
  var state = getState(game);
  if(state==='PRE') return null;

  // ── GATHER INPUTS ──
  var floor = cs.sonnetIndicators || cs.clientInd;
  var pbp = cs.pbpWindow;
  var qtr = cs.rollingWindow;
  var ewp = cs.espnWP;
  var sust = cs.clientSustainability;
  var od = cs.oddsData;
  var accel = cs.acceleration;
  var period = game.period || 1;

  // Need at minimum a floor read
  if(!floor || !floor.score) return null;

  var fScore = floor.score;
  var fTeam = floor.controlTeam;
  var fVerdict = fScore>=0.90?'DOMINANT':fScore>=0.75?'STRONG':fScore>=0.60?'EARNED':'WEAK';
  var oppTeam = fTeam === hA ? aA : hA;

  // Score state
  var ctrlIsHome = fTeam === hA;
  var ctrlPts = ctrlIsHome ? hPts : aPts;
  var oppPts = ctrlIsHome ? aPts : hPts;
  var margin = ctrlPts - oppPts; // positive = structural team leading
  var trailing = margin < 0;
  var deficit = Math.abs(margin);

  // ── PBP AGREEMENT ──
  var pbpAvail = pbp && pbp.available && pbp.score;
  var pbpAgrees = pbpAvail && pbp.controlTeam === fTeam;
  var pbpDisagrees = pbpAvail && pbp.controlTeam !== fTeam;
  var pbpScore = pbpAvail ? pbp.score : null;
  var pbpGap = pbpAvail && pbpAgrees ? (pbp.score - fScore) : pbpAvail ? -(pbp.score) : null;

  // ── QTR CONTEXT ──
  var qtrAvail = qtr && qtr.available && qtr.score;
  var qtrAgrees = qtrAvail && qtr.controlTeam === fTeam;

  // ── SUSTAINABILITY ──
  // Check both client sustainability and Sonnet's sustainability audit
  var sa = cs.sustainabilityAudit;
  var leadSide = hPts >= aPts ? 'home' : 'away';
  var trailSide = leadSide === 'home' ? 'away' : 'home';
  var leadSust = sust?.[leadSide]?.tier || sa?.[leadSide]?.tier || null;
  var trailSust = sust?.[trailSide]?.tier || sa?.[trailSide]?.tier || null;
  var ctrlSust = (ctrlIsHome ? sust?.home?.tier : sust?.away?.tier) || (ctrlIsHome ? sa?.home?.tier : sa?.away?.tier) || null;
  var oppSust = (ctrlIsHome ? sust?.away?.tier : sust?.home?.tier) || (ctrlIsHome ? sa?.away?.tier : sa?.home?.tier) || null;

  // ── ESPN WP ──
  var espnPct = null, espnTeam = null;
  if(ewp){
    espnTeam = ewp.home >= ewp.away ? hA : aA;
    espnPct = Math.max(ewp.home, ewp.away);
  }

  // ── MISSING DATA ──
  var missing = [];
  if(!pbpAvail) missing.push('PBP');
  if(!ewp) missing.push('ESPN');
  if(!od) missing.push('ODDS');
  if(!sust && !sa) missing.push('SUST');

  // ── RESOLVE: Build the synthesis ──
  var control = fTeam + ' ' + fScore.toFixed(2) + ' ' + fVerdict;
  var lines = [];
  var action = null;
  var actionColor = 'var(--t3)';
  var triggers = [];

  // Confidence based on agreement
  var confidence = 'LOW';
  if(fScore >= 0.70 && pbpAgrees) confidence = 'HIGH';
  else if(fScore >= 0.70 && !pbpAvail) confidence = 'MODERATE';
  else if(fScore >= 0.60 && pbpAgrees) confidence = 'MODERATE';
  else if(fScore >= 0.60) confidence = 'LOW';

  // Lead quality
  var leadQuality = null;
  if(trailing){
    lines.push(fTeam + ' trailing by ' + deficit + (period >= 3 ? ' in ' + ({3:'Q3',4:'Q4',5:'OT'}[period]||'Q'+period) : '') + '.');
  } else if(deficit === 0){
    lines.push('Game tied.');
  } else {
    var sustNote = '';
    var lc = cs.clientLeadComposition || cs.leadComposition;
    if(lc && lc.classification){
      var cls = lc.classification;
      if(cls === 'STRUCTURAL') sustNote = 'Lead is STRUCTURAL — paint/FT driven.';
      else if(cls === 'IDENTITY') sustNote = 'Lead is IDENTITY scoring — sustainable perimeter.';
      else if(cls === 'HOT') sustNote = 'Lead is elevated but credible shooting.';
      else if(cls === 'VOLATILE') sustNote = 'Lead is VOLATILE — variance-driven, regression likely.';
      else if(cls === 'EVEN') sustNote = 'Margin too small to classify.';
      else sustNote = 'Lead is MIXED source.';
    } else if(leadSust === 'LOCKED' || leadSust === 'DURABLE') sustNote = 'Lead shooting is sustainable.';
    else if(leadSust === 'FRAGILE' || leadSust === 'UNSUSTAINABLE') sustNote = 'Lead is FRAGILE — variance-driven.';
    else if(leadSust === 'MIXED') sustNote = 'Lead is MIXED source.';
    else sustNote = 'Lead source unclear.';
    lines.push(fTeam + ' leads by ' + deficit + '. ' + sustNote);
  }

  // Window agreement narrative
  if(pbpAgrees && pbpScore >= 0.65){
    lines.push('PBP window confirms momentum (' + pbp.controlTeam + ' ' + pbpScore.toFixed(2) + ').');
  } else if(pbpDisagrees){
    lines.push('PBP window disagrees — ' + pbp.controlTeam + ' ' + pbpScore.toFixed(2) + ' in recent possessions.');
  } else if(!pbpAvail && period >= 2){
    lines.push('PBP window unavailable — waiting for data.');
  }

  // Opponent + trailing team profiles
  if(trailing){
    var oppProfile = oppSust ? (oppSust === 'FRAGILE' || oppSust === 'UNSUSTAINABLE' ? oppTeam + ' lead is ' + oppSust + ' — regression likely.' : oppSust === 'LOCKED' || oppSust === 'DURABLE' ? oppTeam + ' lead looks ' + oppSust + ' — caution.' : '') : '';
    if(oppProfile) lines.push(oppProfile);
    // Trailing team's own sustainability — can they actually come back?
    if(ctrlSust){
      if(ctrlSust === 'UNSUSTAINABLE' || ctrlSust === 'FRAGILE'){
        lines.push(fTeam + ' own shooting is ' + ctrlSust + ' — comeback capacity limited.');
      } else if(ctrlSust === 'LOCKED' || ctrlSust === 'DURABLE'){
        lines.push(fTeam + ' shooting ' + ctrlSust + ' — has the fuel to close gap.');
      }
    }
  }

  // ESPN alignment
  if(ewp && espnPct){
    if(espnTeam === fTeam && espnPct >= 70){
      lines.push('ESPN model agrees (' + espnPct + '%).');
    } else if(espnTeam !== fTeam && espnPct >= 60){
      lines.push('ESPN model favors ' + espnTeam + ' (' + espnPct + '%) — our structural read diverges.');
    }
  }

  // ── DECISION TREE ──
  var sustFragile = oppSust === 'FRAGILE' || oppSust === 'UNSUSTAINABLE';
  var sustLocked = oppSust === 'LOCKED' || oppSust === 'DURABLE';
  var inBuyRange = deficit >= 4 && deficit <= 15;

  // Check if trailing (structural) team's own shooting is sustainable enough to mount comeback
  var ctrlFragile = ctrlSust === 'FRAGILE' || ctrlSust === 'UNSUSTAINABLE';
  var ctrlLocked = ctrlSust === 'LOCKED' || ctrlSust === 'DURABLE';

  if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustFragile && !ctrlFragile){
    action = 'BUY'; actionColor = 'var(--green)';
    lines.push(fTeam + ' structural edge + opponent variance = entry signal.' + (ctrlLocked ? ' ' + fTeam + ' shooting ' + ctrlSust + '.' : ''));
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustFragile && ctrlFragile){
    action = 'CAUTION'; actionColor = 'var(--amber)';
    lines.push('Both teams shooting unsustainably — ' + oppTeam + ' ' + (oppSust||'FRAGILE') + ', ' + fTeam + ' ' + (ctrlSust||'FRAGILE') + '. Mutual regression risk.');
    triggers.push(fTeam + ' sustainability upgrades');
    triggers.push('Deficit narrows below 4');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && !sustFragile && !sustLocked && !ctrlFragile){
    action = 'LEAN BUY'; actionColor = 'var(--g2)';
    triggers.push(oppTeam + ' sustainability degrades to FRAGILE');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && !sustFragile && !sustLocked && ctrlFragile){
    action = 'WATCH'; actionColor = 'var(--amber)';
    lines.push(fTeam + ' controls structurally but own shooting is ' + (ctrlSust||'FRAGILE') + ' — comeback fuel questionable.');
    triggers.push(fTeam + ' sustainability upgrades');
    triggers.push(oppTeam + ' sustainability degrades');
  } else if(fScore >= 0.70 && pbpAgrees && trailing && inBuyRange && sustLocked){
    action = 'CAUTION'; actionColor = 'var(--amber)';
    lines.push(oppTeam + ' lead is structurally sound — risky entry.');
    triggers.push(oppTeam + ' sustainability degrades');
    triggers.push('Deficit narrows below 4');
  } else if(fScore >= 0.70 && trailing && deficit > 15){
    action = 'TOO DEEP'; actionColor = 'var(--red)';
    lines.push('Deficit exceeds structural recovery range.');
    triggers.push('Deficit narrows to 10-15');
  } else if(fScore >= 0.70 && !trailing && deficit > 3){
    action = 'NO VALUE'; actionColor = 'var(--t2)';
    lines.push('Market already prices ' + fTeam + ' advantage.');
  } else if(fScore >= 0.70 && pbpDisagrees){
    action = 'WAIT'; actionColor = 'var(--yellow)';
    lines.push('Floor and window disagree — momentum shifting.');
    triggers.push('PBP flips to agree with floor');
    triggers.push('PBP sustains ' + pbp.controlTeam + ' control for 10+ possessions');
  } else if(fScore >= 0.70 && !pbpAvail){
    action = 'DEVELOPING'; actionColor = 'var(--yellow)';
    triggers.push('PBP data arrives and confirms floor');
  } else if(fScore >= 0.60 && pbpAgrees && trailing && inBuyRange){
    action = 'WATCH'; actionColor = 'var(--amber)';
    lines.push('Floor building but not yet decisive.');
    triggers.push('Floor reaches 0.70+');
    triggers.push(fTeam + ' wins I1 or I2');
  } else if(fScore >= 0.60){
    action = 'DEVELOPING'; actionColor = 'var(--yellow)';
    triggers.push('Floor strengthens past 0.70');
  } else {
    action = 'NO EDGE'; actionColor = 'var(--t3)';
    // Note favorable sustainability pattern even without floor edge
    if(trailing && oppSust && (oppSust === 'FRAGILE' || oppSust === 'UNSUSTAINABLE') && ctrlSust && (ctrlSust === 'LOCKED' || ctrlSust === 'DURABLE')){
      lines.push('Sustainability favors ' + fTeam + ' (' + oppTeam + ' ' + oppSust + ', ' + fTeam + ' ' + ctrlSust + ') but floor too low to act.');
      triggers.push('Floor reaches 0.60+');
    }
  }

  // ── BET TYPE RECOMMENDATION (ML vs Spread) ──
  var betType = null;
  var betDetail = null;
  if(od && (action === 'BUY' || action === 'LEAN BUY')){
    var spConv = cs.spreadConviction;
    var spread = parseFloat(od.homeSpread);
    var ctrlSpread = (!isNaN(spread)) ? (ctrlIsHome ? spread : -spread) : null;

    // ML value: compare floor score (proxy for win prob) against ML implied prob
    var ctrlML = ctrlIsHome ? od.homeML : od.awayML;
    var mlNum = parseFloat(ctrlML);
    var mlImplied = null;
    if(!isNaN(mlNum) && mlNum !== 0){
      mlImplied = mlNum < 0 ? Math.abs(mlNum) / (Math.abs(mlNum) + 100) * 100 : 100 / (mlNum + 100) * 100;
    }
    var mlEdge = mlImplied != null ? (fScore * 100) - mlImplied : null;

    // Spread value: from spread conviction engine
    var ctrlCoverProb = null;
    if(spConv){
      var spTeam = ctrlIsHome ? spConv.home : spConv.away;
      if(spTeam) ctrlCoverProb = spTeam.coverProb;
    }

    // Decision
    var mlHasValue = mlEdge != null && mlEdge >= 10;
    var spreadHasValue = ctrlCoverProb != null && ctrlCoverProb >= 60;

    if(mlHasValue && spreadHasValue){
      // Both have value — recommend the stronger edge
      if(mlEdge > (ctrlCoverProb - 50)){
        betType = 'ML'; betDetail = fTeam + ' ML ' + ctrlML + ' (implied ' + mlImplied.toFixed(0) + '%, our read ' + (fScore*100).toFixed(0) + '% = +' + mlEdge.toFixed(0) + '% edge). Spread also viable at ' + ctrlCoverProb + '% cover.';
      } else {
        betType = 'SPREAD'; betDetail = fTeam + ' ' + (ctrlSpread>0?'+':'') + ctrlSpread.toFixed(1) + ' (' + ctrlCoverProb + '% cover prob). ML also has value at +' + mlEdge.toFixed(0) + '% edge.';
      }
    } else if(mlHasValue){
      betType = 'ML'; betDetail = fTeam + ' ML ' + ctrlML + ' (implied ' + mlImplied.toFixed(0) + '%, our read ' + (fScore*100).toFixed(0) + '% = +' + mlEdge.toFixed(0) + '% edge).';
    } else if(spreadHasValue){
      betType = 'SPREAD'; betDetail = fTeam + ' ' + (ctrlSpread!=null?(ctrlSpread>0?'+':'')+ctrlSpread.toFixed(1):'?') + ' (' + ctrlCoverProb + '% cover prob).';
    } else if(ctrlSpread != null && trailing){
      // No strong conviction either way — note the spread for context
      betDetail = 'Spread ' + fTeam + ' ' + (ctrlSpread>0?'+':'') + ctrlSpread.toFixed(1) + ' — waiting for conviction.';
    }

    if(betDetail) lines.push(betDetail);
  } else if(od && od.homeSpread && action !== 'NO EDGE'){
    // Non-buy actions — just note spread context
    var spread2 = parseFloat(od.homeSpread);
    if(!isNaN(spread2)){
      var ctrlSpread2 = ctrlIsHome ? spread2 : -spread2;
      if(trailing && ctrlSpread2 > 0){
        lines.push('Spread ' + fTeam + ' ' + (ctrlSpread2>0?'+':'') + ctrlSpread2.toFixed(1) + ' — getting points.');
      }
    }
  }

  return {
    action: action,
    actionColor: actionColor,
    control: control,
    narrative: lines.join(' '),
    triggers: triggers,
    confidence: confidence,
    missing: missing,
    fTeam: fTeam,
    fScore: fScore,
    trailing: trailing,
    deficit: deficit,
    betType: betType,
  };
}

function getVerdict(s){
  if(s>=.90) return {label:'DOMINANT',color:'#00ff88',bg:'rgba(0,255,136,.10)',lvl:'entry'};
  if(s>=.75) return {label:'STRONG',color:'#a8ff78',bg:'rgba(168,255,120,.08)',lvl:'entry'};
  if(s>=.60) return {label:'EARNED',color:'#ffd166',bg:'rgba(255,209,102,.08)',lvl:'watch'};
  if(s>=.45) return {label:'NO EDGE',color:'#ff5252',bg:'rgba(255,82,82,.06)',lvl:null};
  return {label:'WAIT',color:'#555',bg:'rgba(60,60,60,.06)',lvl:null};
}

// ══════════════════════════════════════════════════════════════════════════════
// PLAYER BASELINES — Built from p.average on every SR summary refresh
// ══════════════════════════════════════════════════════════════════════════════
function buildPlayerBaselines(game){
  const s = game.summary;
  if(!s || !s.home?.players || !s.away?.players) return null;
  const hA = s.home?.alias||s.home?.name||'HOME', aA = s.away?.alias||s.away?.name||'AWAY';
  const players = {};
  let hSzn3PM=0, hSzn3PA=0, hSznFGM=0, hSznFGA=0;
  let aSzn3PM=0, aSzn3PA=0, aSznFGM=0, aSznFGA=0;
  const hStarters=[], aStarters=[], hByUSG=[], aByUSG=[];

  function processPlayer(p, teamAlias, side){
    const avg = p.average||{};
    const name = p.full_name||p.name||'?';
    const szn3m = avg.three_points_made||0, szn3a = avg.three_points_att||0;
    const sznFGm = avg.field_goals_made||0, sznFGa = avg.field_goals_att||0;
    const szn3Pct = szn3a >= 1.0 ? (szn3m/szn3a*100) : null;
    const sznFGPct = sznFGa >= 1.0 ? (sznFGm/sznFGa*100) : null;
    const sznUSG = avg.usage_pct||0, sznMin = avg.minutes||0;
    // Tier classification (matches analyze.js logic)
    let tier = 'NON';
    if(szn3Pct===null) tier = 'UNK';
    else if(szn3Pct>=38.0 && szn3a>=2.0) tier = 'ELITE';
    else if(szn3Pct>=33.0 || (szn3Pct>=30.0 && szn3a>=3.0)) tier = 'AVG';
    else tier = 'NON';
    if(szn3a<1.5 && tier==='ELITE') tier = 'AVG';
    if(szn3a<0.8 && tier!=='NON' && tier!=='UNK') tier = 'NON';

    const entry = {team:teamAlias, side, szn3Pct, szn3Vol:szn3a, sznFGPct, sznUSG, sznMin,
      sznPts:avg.points||0, sznAst:avg.assists||0, sznReb:avg.rebounds||0, sznStl:avg.steals||0,
      tier, position:p.primary_position||'?', starter:!!p.starter, name};
    players[name] = entry;
    if(side==='home'){
      hSzn3PM+=szn3m; hSzn3PA+=szn3a; hSznFGM+=sznFGm; hSznFGA+=sznFGa;
      if(p.starter) hStarters.push(name);
      hByUSG.push({name, usg:sznUSG, min:sznMin});
    } else {
      aSzn3PM+=szn3m; aSzn3PA+=szn3a; aSznFGM+=sznFGm; aSznFGA+=sznFGa;
      if(p.starter) aStarters.push(name);
      aByUSG.push({name, usg:sznUSG, min:sznMin});
    }
  }

  (s.home.players||[]).forEach(p=>processPlayer(p, hA, 'home'));
  (s.away.players||[]).forEach(p=>processPlayer(p, aA, 'away'));

  // Verify we got real season data (not all zeros)
  const hasData = hSzn3PA>=3 || aSzn3PA>=3;
  if(!hasData) return {built:false, players:{}, reason:'No season averages in summary'};

  hByUSG.sort((a,b)=>b.usg-a.usg); aByUSG.sort((a,b)=>b.usg-a.usg);
  return {
    built: true,
    players,
    stars: {
      home: hByUSG.slice(0,2).map(x=>x.name),
      away: aByUSG.slice(0,2).map(x=>x.name),
    },
    starters: {
      home: hStarters.length>=4 ? hStarters : hByUSG.slice(0,5).map(x=>x.name),
      away: aStarters.length>=4 ? aStarters : aByUSG.slice(0,5).map(x=>x.name),
    },
    teamSeason3Pct: {
      home: hSzn3PA>=5 ? (hSzn3PM/hSzn3PA*100) : 36.0,
      away: aSzn3PA>=5 ? (aSzn3PM/aSzn3PA*100) : 36.0,
    },
    teamSeason3PARate: {
      home: hSznFGA>=10 ? (hSzn3PA/hSznFGA*100) : 35.0,
      away: aSznFGA>=10 ? (aSzn3PA/aSznFGA*100) : 35.0,
    },
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// STRUCTURAL CONTEXT — Extracted once from srCache after thesis generation
// ══════════════════════════════════════════════════════════════════════════════
function extractStructuralContext(gameId){
  try{
    const cached = localStorage.getItem('nba4:srCache:'+gameId);
    if(!cached) return null;
    const c = JSON.parse(cached);
    const game = games.find(g=>g.id===gameId);
    if(!game) return null;
    const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
    const hId = game.home?.id||game.home?.sr_id||'', aId = game.away?.id||game.away?.sr_id||'';

    // Multi-strategy team matching for injuries (same as server)
    function matchSide(t){
      if(hId && (t.id===hId || t.sr_id===hId)) return 'home';
      if(aId && (t.id===aId || t.sr_id===aId)) return 'away';
      const a = (t.alias||t.abbreviation||t.abbr||'').toUpperCase();
      if(a && a===hA.toUpperCase()) return 'home';
      if(a && a===aA.toUpperCase()) return 'away';
      const nm = (t.name||'').toLowerCase(), mk = (t.market||'').toLowerCase();
      if(nm.indexOf(hA.toLowerCase())>=0 || mk.indexOf(hA.toLowerCase())>=0) return 'home';
      if(nm.indexOf(aA.toLowerCase())>=0 || mk.indexOf(aA.toLowerCase())>=0) return 'away';
      return null;
    }

    // Closers from depth charts
    const closers = {home:[], away:[]};
    const foulBackups = {home:{}, away:{}};
    function resolvePos(d){
      if(!d) return [];
      // Check positions key first
      if(d.positions){
        if(Array.isArray(d.positions)) return d.positions;
        if(typeof d.positions === 'object'){
          const conv = [];
          Object.keys(d.positions).forEach(posName=>{
            const val = d.positions[posName];
            let players = [];
            if(Array.isArray(val)) players = val;
            else if(val?.players && Array.isArray(val.players)) players = val.players;
            else if(val && typeof val === 'object') players = Object.values(val).filter(v=>v&&typeof v==='object'&&(v.full_name||v.name));
            if(players.length>0) conv.push({name:posName, position:posName, players});
          });
          if(conv.length>0) return conv;
        }
      }
      if(Array.isArray(d)) return d;
      if(d.depth_chart) return resolvePos(d.depth_chart);
      const skip = ['id','name','market','alias','founded','sr_id','reference','venue','league','conference','division','coaches'];
      for(const k of Object.keys(d)){
        if(skip.includes(k)) continue;
        const v=d[k];
        if(Array.isArray(v)&&v.length>0&&v[0]&&(Array.isArray(v[0].players)||v[0].name||v[0].position)) return v;
      }
      return [];
    }
    function extractDepth(d, side){
      const pos = resolvePos(d);
      pos.forEach(p=>{
        const pls = Array.isArray(p.players)?p.players:[];
