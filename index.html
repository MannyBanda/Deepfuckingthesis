        const d1 = pls.find(x=>x.depth===1||x.depth==='1');
        const d2 = pls.find(x=>x.depth===2||x.depth==='2');
        if(d1) closers[side].push(d1.full_name||d1.name||'?');
        if(d1 && d2) foulBackups[side][d1.full_name||d1.name] = d2.full_name||d2.name||'?';
      });
    }
    extractDepth(c.homeDepth, 'home');
    extractDepth(c.awayDepth, 'away');

    // Pythagorean from standings
    const pyth = {home:{expected:0,actual:0,delta:0,cap:null}, away:{expected:0,actual:0,delta:0,cap:null}};
    if(c.standings){
      const allTeams = [];
      (c.standings.conferences||[]).forEach(conf=>{
        (conf.divisions||[]).forEach(div=>{
          (div.teams||[]).forEach(t=>allTeams.push(t));
        });
      });
      function calcPyth(alias){
        const t = allTeams.find(x=>(x.alias||x.abbr||'').toUpperCase()===alias.toUpperCase());
        if(!t) return {expected:0,actual:0,delta:0,cap:null};
        const pf = t.calc_points?.for || t.points_for || 0;
        const pa = t.calc_points?.against || t.points_against || 0;
        const gp = (t.wins||0)+(t.losses||0);
        if(!pf||!pa||!gp) return {expected:0,actual:0,delta:0,cap:null};
        const pythWin = Math.pow(pf,13.91)/(Math.pow(pf,13.91)+Math.pow(pa,13.91));
        const expW = Math.round(pythWin*gp*10)/10;
        const actW = t.wins||0;
        const delta = actW-expW;
        let cap = null;
        if(delta<=-5) cap = 0.70;
        else if(delta<=-3) cap = 0.75;
        else if(delta>=5) cap = 0.75;
        return {expected:expW, actual:actW, delta:Math.round(delta*10)/10, cap, gp, losses:t.losses||0};
      }
      pyth.home = calcPyth(hA);
      pyth.away = calcPyth(aA);
    }

    // Opponent profile from seasonal stats
    const oppProfile = {home:{steals:0,disruptionTier:'LOW'}, away:{steals:0,disruptionTier:'LOW'}};
    function extractOpp(stats, side){
      const opp = stats?.opponents?.statistics || (stats?.own_record?.opponents||{}).statistics || {};
      const stl = opp.steals||0;
      oppProfile[side] = {steals:stl, disruptionTier: stl>=8.5?'HIGH':stl>=7.0?'MODERATE':'LOW'};
    }
    extractOpp(c.homeStats, 'home');
    extractOpp(c.awayStats, 'away');

    // Key outs from injuries
    const keyOuts = [];
    if(c.injuries?.teams){
      c.injuries.teams.forEach(t=>{
        const side = matchSide(t);
        if(!side) return;
        (t.players||[]).forEach(p=>{
          const injArr = Array.isArray(p.injuries) ? p.injuries : [];
          const latestInj = injArr.length > 0 ? injArr[0] : {};
          let st = (latestInj.status || p.status || '').toUpperCase();
          if(!st){
            const desc = (latestInj.comment||latestInj.desc||p.desc||'').toUpperCase();
            if(desc.indexOf('OUT')>=0 || desc.indexOf('NOT WITH TEAM')>=0) st='OUT';
            else if(desc.indexOf('DOUBTFUL')>=0) st='DOUBTFUL';
            else if(desc.indexOf('QUESTIONABLE')>=0) st='QUESTIONABLE';
          }
          const injDesc = latestInj.desc || latestInj.comment || p.desc || '?';
          if(st==='OUT'||st==='O'||st==='IR'||st==='NOT WITH TEAM'){
            keyOuts.push({name:p.full_name||'?', team:t.alias||t.abbreviation||t.market||'?', position:p.primary_position||p.position||'?',
              injury:injDesc, status:'OUT', side: side});
          }
        });
      });
    }

    // Shot diet identity from seasonal stats
    const shotDiet = {home:'BALANCED', away:'BALANCED'};
    function classifyDiet(stats, side){
      const own = stats?.own_record||stats||{};
      const ts = own.statistics||stats?.statistics||{};
      const fga = ts.field_goals_att||1;
      const threeRate = (ts.three_points_att||0)/fga*100;
      const paintPts = ts.points_in_the_paint||0;
      const atRimRate = (ts.field_goals_at_rim_att||0)/fga*100;
      if(threeRate>=38 && (ts.assists||0)/(ts.field_goals_made||1)*100>=65) shotDiet[side] = 'PERIMETER';
      else if(paintPts>=48 || atRimRate>=35) shotDiet[side] = 'INTERIOR';
      else shotDiet[side] = 'BALANCED';
    }
    classifyDiet(c.homeStats, 'home');
    classifyDiet(c.awayStats, 'away');

    const result = {built:true, closers, foulBackups, pythagorean:pyth, oppProfile, keyOuts, shotDiet};
    return result;
  }catch(e){
    console.error('extractStructuralContext failed:', e.message);
    return {built:false};
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// CLIENT-SIDE SUSTAINABILITY AUDIT — Port of server-side analyze.js logic
// ══════════════════════════════════════════════════════════════════════════════
function computeSustainabilityClient(teamData, baselines, teamAlias, side, trackingData, pbpAudit){
  if(!teamData || !baselines?.built) return null;
  const stats = teamData.statistics||{};
  const players = teamData.players||[];
  const team3PM = stats.three_points_made||0, team3PA = stats.three_points_att||0;
  const teamFGA = stats.field_goals_att||1;
  const live3Pct = team3PA>0 ? (team3PM/team3PA*100) : 0;
  const seasonBaseline = baselines.teamSeason3Pct?.[side]||36.0;
  console.log('SUST['+teamAlias+']:', 'team3PA='+team3PA, 'team3PM='+team3PM, 'FGA='+teamFGA, 'live3Pct='+live3Pct.toFixed(1), 'baseline='+seasonBaseline.toFixed(1), 'statsKeys='+Object.keys(stats).slice(0,8).join(','));

  // Auto-override: shooting at or below baseline → LOCKED
  if(live3Pct <= seasonBaseline+2) return {tier:'LOCKED', reason:'Shooting at/below baseline ('+live3Pct.toFixed(0)+'% vs '+seasonBaseline.toFixed(0)+'% szn)', personnel:'N/A', regression:'N/A', shotType:'N/A', autoLocked:true};

  // Personnel audit (40%)
  const makesByTier = {ELITE:0,AVG:0,NON:0,UNK:0};
  const hotPlayers = [];
  players.forEach(p=>{
    const live = p.statistics||{};
    const live3m = live.three_points_made||0, live3a = live.three_points_att||0;
    if(live3a<2) return;
    const name = p.full_name||p.name||'?';
    const bl = baselines.players?.[name];
    const tier = bl?.tier||'UNK';
    makesByTier[tier] = (makesByTier[tier]||0) + live3m;
    if(bl && bl.szn3Pct!==null){
      const livePct = live3m/live3a*100;
      if(livePct > bl.szn3Pct+12) hotPlayers.push({name, livePct:livePct.toFixed(0), sznPct:bl.szn3Pct.toFixed(0), tier, live3m, live3a});
    }
  });
  const totalMakes = team3PM||1;
  const elitePct = makesByTier.ELITE/totalMakes*100;
  const nonPct = (makesByTier.NON+makesByTier.UNK)/totalMakes*100;
  let personnelGrade;
  if(elitePct>=70) personnelGrade = 'LOCKED';
  else if(elitePct>=50 && nonPct<=20) personnelGrade = 'DURABLE';
  else if(nonPct>=50) personnelGrade = 'UNSUSTAINABLE';
  else if(nonPct>=35) personnelGrade = 'FRAGILE';
  else personnelGrade = 'MIXED';

  // Bayesian regression (35%)
  const priorStrength = 30;
  const priorAlpha = seasonBaseline/100*priorStrength;
  const priorBeta = (1-seasonBaseline/100)*priorStrength;
  const postAlpha = priorAlpha+team3PM;
  const postBeta = priorBeta+(team3PA-team3PM);
  const posteriorMean = postAlpha/(postAlpha+postBeta)*100;
  const deviation = live3Pct-seasonBaseline;
  let regressionProb;
  if(team3PA<=8) regressionProb=85;
  else if(team3PA<=14) regressionProb=70;
  else if(team3PA<=20) regressionProb=55;
  else if(team3PA<=28) regressionProb=40;
  else regressionProb=25;
  if(deviation>15) regressionProb=Math.min(95,regressionProb+15);
  else if(deviation>8) regressionProb=Math.min(95,regressionProb+8);
  else if(deviation>3) regressionProb=Math.min(95,regressionProb+3);
  else if(deviation<-3) regressionProb=Math.max(5,regressionProb-8);
  let regressionGrade;
  if(regressionProb>=75) regressionGrade='HIGH';
  else if(regressionProb>=55) regressionGrade='MODERATE';
  else if(regressionProb>=35) regressionGrade='LOW';
  else regressionGrade='MINIMAL';

  // Shot quality layer (25%) — uses PBP zone data when available, falls back to assist-ratio proxy
  const teamAst = stats.assists||0, teamFGM = stats.field_goals_made||1;
  const assistRatio = teamAst/teamFGM*100;
  let shotTypeGrade = 'MIXED';
  let shotTypeNote = '';
  const tracking = trackingData?.[side==='home'?'home':'away'] || trackingData;

  // Check for PBP zone data (auto-fetched every poll)
  const teamPbp = pbpAudit ? pbpAudit[side] : null;
  if(teamPbp && teamPbp.threes && teamPbp.threes.att >= 5){
    const cornerAtt = teamPbp.threes.corner?.att||0;
    const aboveAtt = teamPbp.threes.above?.att||0;
    const total3PA = teamPbp.threes.att||1;
    const cornerPct = cornerAtt/total3PA*100;
    const assisted = teamPbp.threes.assisted||0;
    const assistedPct = teamPbp.threes.made>0 ? assisted/teamPbp.threes.made*100 : 0;
    // Per-player unassisted above-break
    const unassistedAbove = (teamPbp.threes.byPlayer||[]).reduce(function(acc, p){
      return acc + ((p.att||0) - (p.assisted||0));
    }, 0);
    const unassistedAbovePct = total3PA > 0 ? unassistedAbove/total3PA*100 : 0;

    if(cornerPct >= 35 && assistedPct >= 60){
      shotTypeGrade = 'SCHEME'; // Most sustainable — high corner volume, scheme-driven
      shotTypeNote = 'Corner '+cornerPct.toFixed(0)+'% of 3PA, '+assistedPct.toFixed(0)+'% assisted — scheme-driven';
    } else if(assistedPct >= 60 && cornerPct >= 20){
      shotTypeGrade = 'DURABLE'; // Good process, mix of zones
      shotTypeNote = assistedPct.toFixed(0)+'% assisted, corner '+cornerPct.toFixed(0)+'% — structured creation';
    } else if(cornerPct < 15 && unassistedAbovePct >= 35){
      shotTypeGrade = 'FRAGILE'; // Pull-up heavy, above-break, unassisted
      shotTypeNote = 'Above-break dominant, '+unassistedAbovePct.toFixed(0)+'% unassisted — pull-up heavy';
    } else if(assistedPct >= 50){
      shotTypeGrade = 'MIXED';
      shotTypeNote = assistedPct.toFixed(0)+'% assisted, corner '+cornerPct.toFixed(0)+'% — moderate process';
    } else {
      shotTypeGrade = 'FRAGILE';
      shotTypeNote = 'Low assisted ('+assistedPct.toFixed(0)+'%), corner only '+cornerPct.toFixed(0)+'%';
    }
  } else if(tracking?.catchAndShoot){
    // Fallback: tracking baselines (pre-game data)
    const casEfg = tracking.catchAndShoot.efg||tracking.catchAndShoot.fg3pct||null;
    const puEfg = tracking.pullUp?.efg||tracking.pullUp?.fg3pct||null;
    if(casEfg!==null && puEfg!==null){
      if(assistRatio>=60 && casEfg>=38){ shotTypeGrade='DURABLE'; shotTypeNote='High ast% ('+assistRatio.toFixed(0)+'%) + C&S eFG '+casEfg+'%'; }
      else if(assistRatio<45 && puEfg<35){ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%) + weak pull-up ('+puEfg+'%)'; }
      else if(assistRatio>=50){ shotTypeGrade='MIXED'; shotTypeNote='Moderate ast% ('+assistRatio.toFixed(0)+'%)'; }
      else{ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%)'; }
    } else {
      if(assistRatio>=65){ shotTypeGrade='DURABLE'; shotTypeNote='High ast% ('+assistRatio.toFixed(0)+'%)'; }
      else if(assistRatio<45){ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%)'; }
      else{ shotTypeGrade='MIXED'; shotTypeNote='Moderate ast% ('+assistRatio.toFixed(0)+'%)'; }
    }
  } else {
    // Bare fallback: assist ratio only
    if(assistRatio>=65){ shotTypeGrade='DURABLE'; shotTypeNote='High ast% ('+assistRatio.toFixed(0)+'%)'; }
    else if(assistRatio<45){ shotTypeGrade='FRAGILE'; shotTypeNote='Low ast% ('+assistRatio.toFixed(0)+'%)'; }
    else{ shotTypeGrade='MIXED'; shotTypeNote='Moderate ast% ('+assistRatio.toFixed(0)+'%)'; }
  }

  // Composite — 5 tiers
  const tierMap = {'LOCKED':5,'SCHEME':5,'DURABLE':4,'MIXED':3,'FRAGILE':2,'UNSUSTAINABLE':1,'HIGH':1,'MODERATE':2,'LOW':4,'MINIMAL':5};
  const pScore = tierMap[personnelGrade]||3;
  const rScore = tierMap[regressionGrade]||3;
  const sScore = tierMap[shotTypeGrade]||3;
  const composite = pScore*0.40 + rScore*0.35 + sScore*0.25;
  let tier;
  if(composite>=4.5) tier='LOCKED';
  else if(composite>=3.8) tier='DURABLE';
  else if(composite>=2.8) tier='MIXED';
  else if(composite>=1.8) tier='FRAGILE';
  else tier='UNSUSTAINABLE';

  // Build reason line
  let reason = '';
  if(nonPct>=50) reason = Math.round(nonPct)+'% of 3PM from non-shooters';
  else if(elitePct>=70) reason = Math.round(elitePct)+'% of 3PM from elite shooters';
  else if(hotPlayers.length>0) reason = hotPlayers.map(h=>h.name+' '+h.livePct+'% vs '+h.sznPct+'% szn').join(', ');
  else if(regressionProb>=70) reason = 'High regression probability ('+regressionProb+'%) — small sample';
  else reason = 'P:'+personnelGrade+' R:'+regressionGrade+' S:'+shotTypeGrade;

  return {tier, reason, personnel:personnelGrade, regression:regressionGrade, shotType:shotTypeGrade, shotTypeNote:shotTypeNote||'',
    live3Pct:live3Pct.toFixed(1), seasonBaseline:seasonBaseline.toFixed(1), hotPlayers, autoLocked:false,
    _debug:{team3PA, team3PM, assistRatio:assistRatio.toFixed(0), composite:composite.toFixed(2), pScore, rScore, sScore}};
}

// ══════════════════════════════════════════════════════════════════════════════
// CLIENT-SIDE LEAD COMPOSITION — pure arithmetic on game summary fields
// ══════════════════════════════════════════════════════════════════════════════
function computeLeadCompositionClient(game, sustData){
  const s = game.summary;
  if(!s || !s.home || !s.away) return null;
  const hS = s.home.statistics||{}, aS = s.away.statistics||{};
  const hPts = s.home.points||0, aPts = s.away.points||0;
  if(hPts===0 && aPts===0) return null;

  function breakdown(stats, total, pbpRim){
    var rawPaint = stats.points_in_the_paint||0;
    var atRimPts = (stats.field_goals_at_rim_made||0)*2;
    var pbpRimPts = pbpRim ? (pbpRim.made||0) * 2 : 0;
    const paint = Math.max(rawPaint, atRimPts, pbpRimPts);
    const ft = stats.free_throws_made||0;
    const three = (stats.three_points_made||0)*3;
    const transition = stats.fast_break_points||0;
    const pot = stats.points_off_turnovers||0;
    const sc = stats.second_chance_points||0;
    const midOther = Math.max(0, total - paint - ft - three);
    const structural = paint + ft;
    const variance = three + midOther;
    const sPct = total>0 ? Math.round(structural/total*100) : 0;
    const vPct = total>0 ? Math.round(variance/total*100) : 0;
    return {total, paint, ft, three, midOther, transition, pot, secondChance:sc, structural, variance, structuralPct:sPct, variancePct:vPct};
  }

  const hA = s.home.alias || game.home?.alias || '?';
  const aA = s.away.alias || game.away?.alias || '?';
  const _pbpLC = cardState[game.id]?.pbpAudit;
  const hB = breakdown(hS, hPts, _pbpLC?.home?.rim);
  const aB = breakdown(aS, aPts, _pbpLC?.away?.rim);
  hB.team = hA; aB.team = aA;

  const margin = hPts - aPts;
  const absMargin = Math.abs(margin);
  const leadTeam = margin>=0 ? hA : aA;
  const trailTeam = margin>=0 ? aA : hA;
  const structuralMargin = hB.structural - aB.structural;
  const varianceMargin = hB.variance - aB.variance;
  const leadStructural = margin>=0 ? structuralMargin : -structuralMargin;
  const leadVariance = margin>=0 ? varianceMargin : -varianceMargin;

  // Get lead team's sustainability tier
  const leadIsHome = margin>=0;
  const leadSust = sustData ? (leadIsHome ? sustData.home : sustData.away) : null;
  const leadTier = (leadSust?.tier||'').toUpperCase();

  // New 6-tier classification using sustainability cross-reference
  let classification = 'MIXED';
  let durability = '';

  if(absMargin <= 2){
    classification = 'EVEN';
    durability = 'EVEN — margin too small to classify';
  } else if(leadStructural >= absMargin * 0.6){
    classification = 'STRUCTURAL';
    durability = leadTeam+' lead is STRUCTURAL — paint/FT drives margin (+'+Math.abs(leadStructural)+')';
  } else if(leadVariance >= absMargin * 0.6){
    // 3PT/mid drives the margin — classification depends on sustainability
    if(leadTier === 'LOCKED' || leadTier === 'LOCKED IN'){
      classification = 'IDENTITY';
      durability = leadTeam+' lead is IDENTITY — perimeter production at season baseline ('+leadTier+'). This is their offensive identity, not variance.';
    } else if(leadTier === 'DURABLE'){
      classification = 'HOT';
      durability = leadTeam+' lead is HOT — above baseline but credible shooters with good process ('+leadTier+'). Elevated but sustainable.';
    } else if(leadTier === 'MIXED'){
      classification = 'MIXED';
      durability = 'MIXED — 3PT/mid drives margin with uncertain sustainability. Structural favors '+(leadStructural<0?trailTeam:leadTeam)+' ('+(leadStructural<0?'+'+Math.abs(leadStructural):'+'+leadStructural)+')';
    } else if(leadTier === 'FRAGILE' || leadTier === 'UNSUSTAINABLE'){
      classification = 'VOLATILE';
      durability = leadTeam+' lead is VOLATILE — perimeter production is '+leadTier+'. Structural favors '+(leadStructural<0?trailTeam:leadTeam)+' ('+(leadStructural<0?'+'+Math.abs(leadStructural):'+'+leadStructural)+'). Entry signal for trailing team.';
    } else {
      // TOO EARLY, empty, null, or unknown tier — default to MIXED not VOLATILE
      classification = 'MIXED';
      durability = 'MIXED — 3PT/mid drives margin but sustainability data insufficient'+(leadTier?' ('+leadTier+')':'')+'.';
    }
  } else {
    classification = 'MIXED';
    durability = 'MIXED — no single source dominates margin';
  }

  return {
    home:hB, away:aB, margin, absMargin, leadTeam, trailTeam,
    structuralMargin:leadStructural, varianceMargin:leadVariance,
    durability, classification
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// MARGIN PROJECTION ENGINE — pace-adjusted forward-looking margin forecast
// ══════════════════════════════════════════════════════════════════════════════
function computeProjection(game){
  const cs = cardState[game.id]; if(!cs) return null;
  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const hPts = game.homePoints||0, aPts = game.awayPoints||0;
  const period = game.period||0;
  if(period < 1) return null;

  const isBDL = game.dataSource === 'BDL';
  const s = isBDL ? game.bdlData : game.summary;
  if(!s) return null;

  // ── TIME REMAINING (NBA: 4×12 min) ──
  const GAME_MINUTES = 48;
  const PERIOD_MINUTES = 12;
  const clockParts = (game.clock||'').split(':');
  const clockMins = clockParts.length===2 ? parseInt(clockParts[0])+(parseInt(clockParts[1]||0)/60) : PERIOD_MINUTES;
  const quartersLeft = Math.max(0, 4 - period);
  const minsLeft = clockMins + (quartersLeft * PERIOD_MINUTES);
  const minsElapsed = Math.max(1, GAME_MINUTES - minsLeft);
  const pctRemaining = Math.min(1, minsLeft / GAME_MINUTES);

  if(minsElapsed < 4) return null; // need minimum sample

  // ── POSSESSIONS & EFFICIENCY ──
  const hs = isBDL ? (s.home||{}) : (s.home?.statistics||{});
  const as = isBDL ? (s.away||{}) : (s.away?.statistics||{});
  let hPoss = hs.possessions||0, aPoss = as.possessions||0;

  // Estimate possessions if unavailable (FGA + 0.44*FTA - OREB + TO)
  if(hPoss < 3){
    hPoss = (hs.field_goals_att||0) + 0.44*(hs.free_throws_att||0) - (hs.offensive_rebounds||0) + (hs.turnovers||0);
    aPoss = (as.field_goals_att||0) + 0.44*(as.free_throws_att||0) - (as.offensive_rebounds||0) + (as.turnovers||0);
  }
  const avgPoss = (hPoss + aPoss) / 2;
  if(avgPoss < 5) return null;

  const hPPP = hPoss > 0 ? hPts / hPoss : 1.0;
  const aPPP = aPoss > 0 ? aPts / aPoss : 1.0;
  const netEfficiency = hPPP - aPPP;

  const possPerMin = avgPoss / minsElapsed;
  const remainingPoss = possPerMin * minsLeft;

  // ── RAW PROJECTED MARGIN ──
  const currentMargin = hPts - aPts;
  const projectedShift = remainingPoss * netEfficiency;
  const rawProjectedMargin = currentMargin + projectedShift;

  // ── GARBAGE TIME DETECTION ──
  let garbageTime = null;
  const absMargin = Math.abs(currentMargin);
  const GARBAGE_MARGIN = 18; // NBA: 18+ points
  const GARBAGE_MINUTES = 5;

  if(absMargin >= GARBAGE_MARGIN && minsLeft <= GARBAGE_MINUTES){
    let startersPulled = false;

    const H = isBDL ? null : s.home;
    const A = isBDL ? null : s.away;
    const bl = cs.baselines;
    const struct = cs.structural;
    if(H?.players && A?.players){
      const leadSide = currentMargin > 0 ? 'home' : 'away';
      const leadPlayers = currentMargin > 0 ? H.players : A.players;
      const leadClosers = struct?.closers?.[leadSide] || bl?.starters?.[leadSide] || [];
      if(leadClosers.length >= 3){
        const onCourt = leadPlayers.filter(pl => pl.on_court);
        const closersOn = onCourt.filter(pl =>
          leadClosers.some(c => (pl.full_name||'').toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes((pl.full_name||'').toLowerCase()))
        ).length;
        if(closersOn <= 2) startersPulled = true;
      }
    }

    const isGarbage = startersPulled || (absMargin >= GARBAGE_MARGIN + 8 && minsLeft <= 3);

    if(isGarbage){
      const freePoints = Math.round(minsLeft * 1.3);
      const compressionPts = Math.min(freePoints, Math.round(absMargin * 0.30));
      garbageTime = {
        detected: true,
        startersPulled,
        compressionPts,
        reason: startersPulled ? 'starters pulled, bench lineup' : 'blowout coast ('+absMargin+' pts, '+minsLeft.toFixed(0)+'min)',
      };
    }
  }

  // Apply garbage time compression
  let projectedMargin = rawProjectedMargin;
  if(garbageTime?.detected){
    const sign = currentMargin > 0 ? -1 : 1;
    projectedMargin = rawProjectedMargin + (garbageTime.compressionPts * sign);
  }

  // ── WIN PROBABILITY from projected margin ──
  // Φ(z) ≈ 1/(1 + e^(-1.7*z)), std dev shrinks as game progresses
  const fullStdDev = 11.0;
  const remainingStdDev = Math.max(2.0, fullStdDev * Math.sqrt(pctRemaining));
  const z = projectedMargin / remainingStdDev;
  const homeWinProb = 1 / (1 + Math.exp(-1.7 * z));

  const projTeam = projectedMargin >= 0 ? hA : aA;

  return {
    currentMargin,
    projectedMargin: Math.round(projectedMargin * 10) / 10,
    rawProjectedMargin: Math.round(rawProjectedMargin * 10) / 10,
    projTeam,
    homeWinProb: Math.round(homeWinProb * 1000) / 10,
    awayWinProb: Math.round((1-homeWinProb) * 1000) / 10,
    remainingPoss: Math.round(remainingPoss * 10) / 10,
    minsLeft: Math.round(minsLeft * 10) / 10,
    pctRemaining: Math.round(pctRemaining * 100),
    netEfficiency: Math.round(netEfficiency * 1000) / 1000,
    possPerMin: Math.round(possPerMin * 100) / 100,
    hPPP: Math.round(hPPP * 1000) / 1000,
    aPPP: Math.round(aPPP * 1000) / 1000,
    garbageTime,
    remainingStdDev: Math.round(remainingStdDev * 10) / 10,
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// SPREAD CONVICTION ENGINE v2 — projection-backed cover probability
// ══════════════════════════════════════════════════════════════════════════════
function computeSpreadConviction(game){
  const cs = cardState[game.id]; if(!cs) return null;
  const pred = cs.prediction; if(!pred) return null;
  const od = cs.oddsData; if(!od || !od.homeSpread) return null;
  const proj = cs.projection;

  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  const hPts = game.homePoints||0, aPts = game.awayPoints||0;
  const period = game.period||0;
  if(period < 1) return null;

  const homeSpreadNum = parseFloat(od.homeSpread);
  if(isNaN(homeSpreadNum)) return null;
  const awaySpreadNum = -homeSpreadNum;

  const hv = pred.homeValue, av = pred.awayValue;
  if(!hv || !av || hv.fwp==null || av.fwp==null) return null;

  // ── TIME ──
  const clockParts = (game.clock||'').split(':');
  const clockMins = clockParts.length===2 ? parseInt(clockParts[0])+(parseInt(clockParts[1]||0)/60) : 12;
  const quartersLeft = Math.max(0, 4 - period);
  const minsLeft = clockMins + (quartersLeft * 12);

  // ── STRUCTURAL CONTEXT ──
  const floorInd = cs.sonnetIndicators || cs.clientInd;
  const floorScore = floorInd?.score || 0.5;
  const floorTeam = floorInd?.controlTeam || '';
  const lc = cs.clientLeadComposition;
  const scoringClass = lc?.classification || 'MIXED';
  const leadTeam = lc?.leadTeam || (hPts >= aPts ? hA : aA);

  // ── GUARDRAIL 1: INFLATION DAMPENER ──
  // Compare current spread to opening spread. Larger moves = less conviction on inflated side.
  var openSpread = cs.openingOdds ? parseFloat(cs.openingOdds.homeSpread) : NaN;
  var spreadMovement = !isNaN(openSpread) ? Math.abs(homeSpreadNum - openSpread) : 0;
  // Detect regime change: did the favorite flip?
  var regimeChange = !isNaN(openSpread) && ((openSpread > 0 && homeSpreadNum < 0) || (openSpread < 0 && homeSpreadNum > 0));
  // Scale thresholds tighter if opening was small (pick'em)
  var openMag = !isNaN(openSpread) ? Math.abs(openSpread) : 10;
  var tierShift = openMag <= 3 ? -1 : openMag >= 15 ? 1 : 0; // -1 = tighter caps, +1 = looser

  function getInflationCap(movement, isRegimeChange, tierAdj){
    if(isRegimeChange) return 95; // regime changes bypass dampener
    var tiers = [
      {min:15, cap:65}, {min:10, cap:72}, {min:5, cap:82}, {min:0, cap:95}
    ];
    // Apply tier shift
    var adjMovement = movement - (tierAdj * 3); // shift by ~3 pts per tier
    for(var t=0;t<tiers.length;t++){
      if(adjMovement >= tiers[t].min) return tiers[t].cap;
    }
    return 95;
  }
  var inflationCap = getInflationCap(spreadMovement, regimeChange, tierShift);
  var inflationFloor = 100 - inflationCap; // underdog floor mirrors cap

  // ── GUARDRAIL 2: ROLLING WINDOW HEALTH (Position × Direction) ──
  // Position = where rolling window IS (from floor team's perspective)
  // Direction = is it getting better or worse
  var rw = cs.rollingWindow;
  var cRead = cs.combinedRead;
  var rwPositionMod = 0; // applied to favorite of the floor team
  var rwDirectionMod = 0;
  var rwLabel = '';
  var isGarbageTime = proj?.garbageTime?.detected || false;

  if(rw && rw.available && !isGarbageTime){
    // Normalize rolling window to floor team's perspective
    var rwScoreFloorPerspective;
    if(rw.controlTeam === floorTeam){
      rwScoreFloorPerspective = rw.score;
    } else {
      rwScoreFloorPerspective = 1 - rw.score;
    }

    // Position modifier (where the floor team stands NOW)
    if(rwScoreFloorPerspective > 0.75){ rwPositionMod = 5; rwLabel = 'STRONG'; }
    else if(rwScoreFloorPerspective >= 0.60){ rwPositionMod = 0; rwLabel = 'EARNED'; }
    else if(rwScoreFloorPerspective >= 0.45){ rwPositionMod = -7; rwLabel = 'CONTESTED'; }
    else if(rwScoreFloorPerspective >= 0.30){ rwPositionMod = -10; rwLabel = 'LOSING'; }
    else { rwPositionMod = -14; rwLabel = 'FLIPPED'; }

    // Direction modifier from combined read acceleration
    var accel = cs.acceleration?.accel || 'STABLE';
    var cReadState = cRead?.read || '';
    if(accel === 'GROWING' || cReadState === 'DOMINANT' || cReadState === 'EMERGING'){
      rwDirectionMod = 3; // floor team gaining
    } else if(accel === 'DECLINING' || cReadState === 'ERODING' || cReadState === 'FADING'){
      rwDirectionMod = -3; // floor team fading
    } else if(cReadState === 'COLLAPSING' || cReadState === 'FLIPPED'){
      rwDirectionMod = -3; // already captured in position, but reinforce direction
    }
  }

  function evalTeamSpread(alias, spread, fwp, pts, oppPts){
    var actualMargin = pts - oppPts;
    var coverMargin = actualMargin + spread;
    var absSpread = Math.abs(spread);
    var isFavorite = spread < 0;
    var isUnderdog = spread > 0;

    // ── PRIMARY: Projection-based cover probability (unchanged) ──
    var coverProb;
    var projBased = false;
    if(proj && proj.remainingStdDev > 0){
      var teamProjectedMargin = alias === hA ? proj.projectedMargin : -proj.projectedMargin;
      var coverZ = (teamProjectedMargin + spread) / proj.remainingStdDev;
      coverProb = (1 / (1 + Math.exp(-1.7 * coverZ))) * 100;
      projBased = true;
    } else {
      if(isUnderdog){
        var closeLossBand = Math.min(20, absSpread * 3.5);
        coverProb = fwp + closeLossBand;
      } else {
        var closeWinErosion = Math.min(25, absSpread * 3.0);
        coverProb = fwp - closeWinErosion;
      }
    }

    // ── STRUCTURAL MODIFIER (kept, full weight) ──
    var structMod = 0;
    var teamHasStructure = floorTeam === alias && floorScore >= 0.55;
    var oppHasStructure = floorTeam !== alias && floorTeam && floorScore >= 0.55;
    if(teamHasStructure) structMod = (floorScore - 0.5) * 20;
    else if(oppHasStructure) structMod = -(floorScore - 0.5) * 15;

    // ── SCORING CLASSIFICATION MODIFIER ──
    var scoringMod = 0;
    var teamIsLeadTeam = alias === leadTeam;
    if(teamIsLeadTeam){
      if(scoringClass === 'VOLATILE') scoringMod = -5;
      else if(scoringClass === 'STRUCTURAL' || scoringClass === 'IDENTITY') scoringMod = 3;
    } else {
      if(scoringClass === 'VOLATILE') scoringMod = 5;
      else if(scoringClass === 'STRUCTURAL' || scoringClass === 'IDENTITY') scoringMod = -3;
    }

    // ── GUARDRAIL 2: ROLLING WINDOW HEALTH ──
    var rwMod = 0;
    if(rw && rw.available && !isGarbageTime){
      // Apply from floor team's perspective
      if(teamHasStructure || alias === floorTeam){
        rwMod = rwPositionMod + rwDirectionMod; // positive helps floor team
      } else {
        rwMod = -(rwPositionMod + rwDirectionMod); // inverted for opponent
      }
    }

    // ── GARBAGE TIME OVERRIDE (unchanged) ──
    var garbageMod = 0;
    if(proj?.garbageTime?.detected){
      if(isFavorite && actualMargin > 0){
        garbageMod = -Math.min(20, proj.garbageTime.compressionPts * 2.5);
      } else if(isUnderdog && actualMargin < 0){
        garbageMod = Math.min(15, proj.garbageTime.compressionPts * 2.0);
      }
    }

    coverProb = coverProb + structMod + scoringMod + rwMod + garbageMod;

    // ── GUARDRAIL 1: INFLATION DAMPENER (apply cap/floor) ──
    if(isFavorite && coverProb > inflationCap) coverProb = inflationCap;
    if(isUnderdog && coverProb < inflationFloor) coverProb = inflationFloor;

    coverProb = Math.max(5, Math.min(95, coverProb));

    // ── REASON STRING ──
    var parts = [];
    if(projBased){
      var teamProjMargin = alias === hA ? proj.projectedMargin : -proj.projectedMargin;
      parts.push('proj '+(teamProjMargin>=0?'+':'')+teamProjMargin.toFixed(1)+' margin');
      parts.push(proj.remainingPoss.toFixed(0)+' poss left');
    } else {
      parts.push('FWP '+fwp.toFixed(0)+'%');
    }
    if(coverMargin > 0) parts.push('covering by '+coverMargin.toFixed(1));
    else if(coverMargin < 0) parts.push('need '+Math.abs(coverMargin).toFixed(1)+' pts');
    if(teamHasStructure) parts.push('structural ('+floorScore.toFixed(2)+')');
    if(rwMod !== 0) parts.push('RW:'+rwLabel+'('+(rwMod>=0?'+':'')+rwMod+')');
    if(spreadMovement >= 5 && !regimeChange) parts.push('inflated '+spreadMovement.toFixed(0)+'pts(cap'+inflationCap+')');
    if(regimeChange) parts.push('REGIME FLIP');
    if(scoringClass === 'VOLATILE' && teamIsLeadTeam) parts.push('VOLATILE lead');
    if(proj?.garbageTime?.detected) parts.push('GARBAGE('+proj.garbageTime.reason+')');
    if(minsLeft < 10) parts.push(minsLeft.toFixed(0)+'min left');

    return {
      team: alias,
      spread: (spread > 0 ? '+' : '') + spread.toFixed(1),
      coverProb: Math.round(coverProb),
      coverMargin: coverMargin,
      projBased: projBased,
      reason: parts.join(' + '),
    };
  }

  var homeResult = evalTeamSpread(hA, homeSpreadNum, hv.fwp, hPts, aPts);
  var awayResult = evalTeamSpread(aA, awaySpreadNum, av.fwp, aPts, hPts);

  function convictionTier(prob){
    if(prob >= 70) return 'STRONG COVER';
    if(prob >= 55) return 'LEAN COVER';
    if(prob >= 45) return 'NO EDGE';
    if(prob >= 30) return 'LEAN FADE';
    return 'STRONG FADE';
  }

  homeResult.conviction = convictionTier(homeResult.coverProb);
  awayResult.conviction = convictionTier(awayResult.coverProb);

  var recommendation = homeResult.coverProb > awayResult.coverProb ? 'home' : awayResult.coverProb > homeResult.coverProb ? 'away' : 'neither';

  return {
    home: homeResult,
    away: awayResult,
    recommendation,
    margin: Math.abs(hPts - aPts),
    minsLeft: minsLeft.toFixed(0),
    tied: hPts === aPts,
    projectionAvailable: !!proj,
    garbageTime: proj?.garbageTime || null,
    inflationCap: inflationCap,
    spreadMovement: spreadMovement.toFixed(1),
    regimeChange: regimeChange,
    rwLabel: rwLabel,
  };
}

// ══════════════════════════════════════════════════════════════════════════════
// ROLLING WINDOW ARCHITECTURE — Snapshot, Window, Gap, Arrows
// ══════════════════════════════════════════════════════════════════════════════

// ── Snapshot Capture ─────────────────────────────────────────────────────────
// Called every poll from fetchSummary. Stores cumulative stats at quarter boundaries.
function captureSnapshot(game){
  const cs = cardState[game.id]; if(!cs) return;
  const s = game.summary; if(!s||!s.home||!s.away) return;
  const currentPeriod = game.period||0;
  if(currentPeriod < 1) return;

  if(!cs.quarterSnapshots){
    // First poll — initialize with current cumulative as baseline
    const snap = {
      ts: Date.now(),
      home: Object.assign({}, s.home.statistics||{}),
      away: Object.assign({}, s.away.statistics||{}),
    };
    cs.quarterSnapshots = {
      boundaries: { 0: snap },
      quarters: {},
      lastSnapshotPeriod: 0,
      backfillNeeded: [],
      backfillDone: false,
    };
    addLog(game.id, '📸 Snapshot baseline captured (Q'+currentPeriod+')', true);
    return;
  }

  const qs = cs.quarterSnapshots;

  // Always store latest cumulative as rolling overwrite for current partial quarter
  qs._latestCumulative = {
    ts: Date.now(),
    home: Object.assign({}, s.home.statistics||{}),
    away: Object.assign({}, s.away.statistics||{}),
  };

  // Detect quarter boundary crossing
  if(currentPeriod > qs.lastSnapshotPeriod + 1){
    // Crossed 1+ boundaries
    const missed = [];
    for(let q = qs.lastSnapshotPeriod+1; q < currentPeriod; q++) missed.push(q);

    if(missed.length === 1 && !qs.boundaries[missed[0]]){
      // Normal: caught boundary (within poll drift)
      // Use the previous poll's latest cumulative as the boundary
      const prevCum = qs._prevCumulative || qs._latestCumulative;
      qs.boundaries[missed[0]] = {
        ts: Date.now(),
        home: Object.assign({}, prevCum.home),
        away: Object.assign({}, prevCum.away),
      };
      computeQuarterDelta(qs, missed[0]);
      qs.lastSnapshotPeriod = missed[0];
      addLog(game.id, '📸 Q'+missed[0]+' boundary captured', true);
    } else if(missed.length > 1){
      // Missed boundaries — phone asleep etc.
      qs.backfillNeeded = missed.filter(q => !qs.boundaries[q]);
      qs.lastSnapshotPeriod = currentPeriod - 1;
      addLog(game.id, '⚠ Missed Q'+missed.join(',')+' boundaries — BDL backfill queued', false);
      // Trigger async backfill
      if(qs.backfillNeeded.length > 0 && !qs._backfilling){
        backfillMissingQuarters(game);
      }
    }
  } else if(currentPeriod === qs.lastSnapshotPeriod + 1 && !qs.boundaries[qs.lastSnapshotPeriod+1]){
    // Just crossed into new quarter — capture boundary for previous quarter
    const q = qs.lastSnapshotPeriod + 1;
    // Boundary = previous poll's cumulative (closest to quarter end)
    if(qs._prevCumulative){
      qs.boundaries[q] = {
        ts: Date.now(),
        home: Object.assign({}, qs._prevCumulative.home),
        away: Object.assign({}, qs._prevCumulative.away),
      };
      computeQuarterDelta(qs, q);
      qs.lastSnapshotPeriod = q;
      addLog(game.id, '📸 Q'+q+' boundary captured', true);
    }
  }

  // Compute current partial quarter delta
  const prevBoundary = qs.boundaries[currentPeriod - 1] || qs.boundaries[qs.lastSnapshotPeriod];
  if(prevBoundary && qs._latestCumulative){
    qs.quarters[currentPeriod] = {
      home: diffStats(qs._latestCumulative.home, prevBoundary.home),
      away: diffStats(qs._latestCumulative.away, prevBoundary.away),
      source: 'snapshot',
      partial: true,
    };
  }

  // Store prev for next poll's boundary detection
  qs._prevCumulative = {
    home: Object.assign({}, s.home.statistics||{}),
    away: Object.assign({}, s.away.statistics||{}),
  };

  // Persist snapshots (including latest cumulative for partial quarter recovery)
  try { localStorage.setItem('nba4:snap:'+game.id, JSON.stringify({
    boundaries: qs.boundaries, quarters: qs.quarters,
    lastSnapshotPeriod: qs.lastSnapshotPeriod,
    _latestCumulative: qs._latestCumulative||null,
    _prevCumulative: qs._prevCumulative||null,
    backfillNeeded: qs.backfillNeeded||[],
    backfillDone: qs.backfillDone||false,
  })); } catch(e){}
}

function diffStats(current, previous){
  const d = {};
  const keys = ['points_in_the_paint','fast_break_points','points_off_turnovers',
    'second_chance_points','possessions','field_goals_at_rim_made','field_goals_at_rim_att',
    'field_goals_made','field_goals_att','three_points_made','three_points_att',
    'free_throws_made','free_throws_att','assists','turnovers','steals','blocks',
    'offensive_rebounds','personal_fouls','points','bench_points',
    'offensive_points_per_possession','defensive_points_per_possession'];
  keys.forEach(k => {
    const c = current[k], p = previous[k];
    if(c!=null && p!=null) d[k] = c - p;
    else if(c!=null) d[k] = c;
    else d[k] = null;
  });
  // Derived
  const fga = d.field_goals_att||1;
  d.efg = fga>0 ? ((d.field_goals_made||0)+0.5*(d.three_points_made||0))/fga : null;
  d.assist_ratio = (d.field_goals_made||0)>0 ? ((d.assists||0)/(d.field_goals_made||1))*100 : null;
  d.fg3a_share = fga>0 ? ((d.three_points_att||0)/fga)*100 : null;
  return d;
}

function computeQuarterDelta(qs, quarterNum){
  const curr = qs.boundaries[quarterNum];
  const prev = qs.boundaries[quarterNum-1];
  if(!curr||!prev) return;
  qs.quarters[quarterNum] = {
    home: diffStats(curr.home, prev.home),
    away: diffStats(curr.away, prev.away),
    source: 'snapshot',
    partial: false,
  };
}

// ── BDL Backfill ─────────────────────────────────────────────────────────────
async function backfillMissingQuarters(game){
  const cs = cardState[game.id]; if(!cs) return;
  const qs = cs.quarterSnapshots; if(!qs) return;
  const bdlId = bdlGameMap[game.id];
  if(!bdlId){ addLog(game.id,'BDL backfill skipped — no BDL game ID',false); return; }
  qs._backfilling = true;
  const needed = [...qs.backfillNeeded];
  addLog(game.id,'⚡ Backfilling Q'+needed.join(',')+' from BDL…',true);

  for(const q of needed){
    try{
      await new Promise(r=>setTimeout(r,200)); // stagger
      const adv = await bdl('advanced',{game_id:bdlId,period:String(q)});
      const basic = await bdl('stats',{game_id:bdlId,period:String(q)});
      const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
      const hId = game.home?.id, aId = game.away?.id;

      // Aggregate by team
      function aggTeam(data, teamId, teamAlias){
        const players = (data.data||[]).filter(p=>{
          const tid = p.team?.id || p.player?.team_id;
          return String(tid)===String(teamId);
        });
        const sum = (arr,key) => arr.reduce((a,p)=>a+(p[key]||0),0);
        return players.length>0 ? players : [];
      }

      function aggBasicTeam(basicData, teamAlias){
        const pl = (basicData.data||[]).filter(p=>(p.team?.abbreviation||'')=== teamAlias);
        const sum = (key) => pl.reduce((a,p)=>a+(p[key]||0),0);
        return {
          field_goals_made:sum('fgm'), field_goals_att:sum('fga'),
          three_points_made:sum('fg3m'), three_points_att:sum('fg3a'),
          free_throws_made:sum('ftm'), free_throws_att:sum('fta'),
          assists:sum('ast'), turnovers:sum('turnover'),
          steals:sum('stl'), blocks:sum('blk'),
          offensive_rebounds:sum('oreb'), personal_fouls:sum('pf'),
          points:sum('pts'),
        };
      }

      function aggAdvTeam(advData, teamAlias){
        const pl = (advData.data||[]).filter(p=>(p.team?.abbreviation||'')===teamAlias && (p.possessions||0)>0);
        const sum = (key) => pl.reduce((a,p)=>a+(p[key]||0),0);
        return {
          points_in_the_paint:sum('points_paint'),
          fast_break_points:sum('points_fast_break'),
          points_off_turnovers:sum('points_off_turnovers'),
          second_chance_points:sum('points_second_chance'),
          possessions:sum('possessions'),
        };
      }

      const hBasic = aggBasicTeam(basic, hA);
      const aBasic = aggBasicTeam(basic, aA);
      const hAdv = aggAdvTeam(adv, hA);
      const aAdv = aggAdvTeam(adv, aA);

      qs.quarters[q] = {
        home: Object.assign({}, hBasic, hAdv, {
          field_goals_at_rim_made:null, field_goals_at_rim_att:null,
          bench_points:null, // can't easily derive from BDL per-period
        }),
        away: Object.assign({}, aBasic, aAdv, {
          field_goals_at_rim_made:null, field_goals_at_rim_att:null,
          bench_points:null,
        }),
        source: 'bdl', partial: false,
      };
      // Derive ratios
      ['home','away'].forEach(side=>{
        const d = qs.quarters[q][side];
        const fga = d.field_goals_att||1;
        d.efg = fga>0?((d.field_goals_made||0)+0.5*(d.three_points_made||0))/fga:null;
        d.assist_ratio = (d.field_goals_made||0)>0?((d.assists||0)/(d.field_goals_made||1))*100:null;
        d.fg3a_share = fga>0?((d.three_points_att||0)/fga)*100:null;
      });

      qs.backfillNeeded = qs.backfillNeeded.filter(x=>x!==q);
      addLog(game.id,'✓ Q'+q+' backfilled from BDL (at-rim N/A)',true);
    }catch(e){
      addLog(game.id,'⚠ Q'+q+' backfill failed: '+e.message,false);
    }
  }
  qs._backfilling = false;
  qs.backfillDone = true;
  // Persist
  try { localStorage.setItem('nba4:snap:'+game.id, JSON.stringify({
    boundaries: qs.boundaries, quarters: qs.quarters,
    lastSnapshotPeriod: qs.lastSnapshotPeriod,
    _latestCumulative: qs._latestCumulative||null,
    _prevCumulative: qs._prevCumulative||null,
    backfillNeeded: qs.backfillNeeded||[],
    backfillDone: qs.backfillDone||false,
  })); } catch(e){}
}

// ── Restore snapshots from localStorage ──────────────────────────────────────
function restoreSnapshots(gameId){
  try{
    const raw = localStorage.getItem('nba4:snap:'+gameId);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

// ── Rolling Window (Cross-fade) ─────────────────────────────────────────────
// Sliding ~2-quarter window with cross-fade. Activates Q2.
// Q2: Q1(fading as Q2 builds) + Q2(partial)
// Q3: Q2(anchor) + Q3(partial, building)
// Q4: Q2(fading as Q4 builds) + Q3(anchor) + Q4(partial)
// OT: Q3(fading) + Q4(anchor) + OT(partial)
function computeRollingWindow(game){
  const cs = cardState[game.id]; if(!cs) return null;
  const qs = cs.quarterSnapshots; if(!qs) return null;
  const p = game.period||0;
  if(p < 2) return { available:false, reason:'TOO EARLY' };

  // Clock → completion fraction of current period (0.0 = just started, 1.0 = period over)
  const clockParts = (game.clock||'').split(':');
  const clockMins = clockParts.length===2 ? parseInt(clockParts[0])+(parseInt(clockParts[1]||0)/60) : 12;
  const periodLength = 12; // NBA quarter
  const completion = Math.max(0, Math.min(1, (periodLength - clockMins) / periodLength));

  // Build weighted quarter map: {quarterNum: weight}
  var weightedQs = {};
  var windowLabel = [];

  if(p === 2){
    // Q2: Q1(fading) + Q2(partial, building)
    if(qs.quarters[1] && completion < 1) weightedQs[1] = Math.max(0, 1.0 - completion);
    if(qs.quarters[2]) weightedQs[2] = 1.0;
    windowLabel = completion > 0.95 ? ['Q2*'] : ['Q1('+Math.round((1-completion)*100)+'%)','Q2*'];
  } else if(p === 3){
    // Q3: Q2(anchor) + Q3(partial, building)
    if(qs.quarters[2]) weightedQs[2] = 1.0;
    if(qs.quarters[3]) weightedQs[3] = 1.0;
    windowLabel = ['Q2','Q3*'];
  } else if(p === 4){
    // Q4: Q2(fading) + Q3(anchor) + Q4(partial, building)
    if(qs.quarters[2] && completion < 1) weightedQs[2] = Math.max(0, 1.0 - completion);
    if(qs.quarters[3]) weightedQs[3] = 1.0;
    if(qs.quarters[4]) weightedQs[4] = 1.0;
    windowLabel = completion > 0.95 ? ['Q3','Q4*'] : ['Q2('+Math.round((1-completion)*100)+'%)','Q3','Q4*'];
  } else if(p >= 5){
    // OT: Q3(fading) + Q4(anchor) + OT(partial)
    if(qs.quarters[3] && completion < 1) weightedQs[3] = Math.max(0, 1.0 - completion);
    if(qs.quarters[4]) weightedQs[4] = 1.0;
    if(qs.quarters[p]) weightedQs[p] = 1.0;
    windowLabel = ['Q4','OT*'];
  }

  // Check we have at least one quarter of data
  const activeQs = Object.keys(weightedQs).filter(q => weightedQs[q] > 0);
  if(activeQs.length === 0){
    return { available:false, reason:'No quarter data yet', windowQuarters:windowLabel };
  }

  // Aggregate stats with cross-fade weights
  function aggWindow(side){
    const agg = {};
    const sumKeys = ['points_in_the_paint','fast_break_points','points_off_turnovers',
      'second_chance_points','possessions','field_goals_at_rim_made','field_goals_at_rim_att',
      'field_goals_made','field_goals_att','three_points_made','three_points_att',
      'free_throws_made','free_throws_att','assists','turnovers','steals','blocks',
      'offensive_rebounds','personal_fouls','points','bench_points'];
    sumKeys.forEach(k=>{ agg[k]=0; let hasAny=false;
      activeQs.forEach(q=>{ const v=qs.quarters[q]?.[side]?.[k]; if(v!=null){agg[k]+=v*weightedQs[q];hasAny=true;} });
      if(!hasAny) agg[k]=null;
    });
    const fga=agg.field_goals_att||1;
    agg.efg=fga>0?((agg.field_goals_made||0)+0.5*(agg.three_points_made||0))/fga:null;
    agg.assist_ratio=(agg.field_goals_made||0)>0?((agg.assists||0)/(agg.field_goals_made||1))*100:null;
    agg.fg3a_share=fga>0?((agg.three_points_att||0)/fga)*100:null;
    return agg;
  }

  const hW = aggWindow('home'), aW = aggWindow('away');
  const hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';

  // Score indicators on window data (unchanged)
  const W = {I1:.25,I2:.25,I3:.20,I4:.20,I5:.10};

  const hGen=(hW.steals||0)+(hW.offensive_rebounds||0)-(hW.turnovers||hW.total_turnovers||0);
  const aGen=(aW.steals||0)+(aW.offensive_rebounds||0)-(aW.turnovers||aW.total_turnovers||0);
  const hConv=(hW.fast_break_points||0)+(hW.points_off_turnovers||0)+(hW.second_chance_points||0);
  const aConv=(aW.fast_break_points||0)+(aW.points_off_turnovers||0)+(aW.second_chance_points||0);
  const convAvail = hConv>0||aConv>0;
  let i1 = (hGen>aGen?1:hGen<aGen?-1:0);
  if(convAvail) i1 += (hConv>aConv?1:hConv<aConv?-1:0);
  const wI1 = {score:i1>0?1:i1===0?.5:0, detail:'Gen:'+hGen.toFixed(0)+'–'+aGen.toFixed(0)+(convAvail?' Conv:'+hConv.toFixed(0)+'–'+aConv.toFixed(0):' (conv N/A)')};

  const hPaint=hW.points_in_the_paint||0, aPaint=aW.points_in_the_paint||0;
  const hFTA=hW.free_throws_att||0, aFTA=aW.free_throws_att||0;
  const hBlk=hW.blocks||0, aBlk=aW.blocks||0;
  const hAtRim=hW.field_goals_at_rim_att, aAtRim=aW.field_goals_at_rim_att;
  let rim = (hPaint+hFTA+hBlk)-(aPaint+aFTA+aBlk);
  if(hAtRim!=null&&aAtRim!=null) rim += (hAtRim-aAtRim);
  const rimThresh = (hAtRim!=null)?10:6;
  const wI2 = {score:rim>rimThresh?1:rim<-rimThresh?0:.5, detail:'Paint:'+hPaint.toFixed(0)+'–'+aPaint.toFixed(0)+' FTA:'+hFTA.toFixed(0)+'–'+aFTA.toFixed(0)+(hAtRim!=null?' Rim:'+hAtRim.toFixed(0)+'–'+aAtRim.toFixed(0):'')};

  const hEFG=hW.efg, aEFG=aW.efg;
  const hAR=hW.assist_ratio||0, aAR=aW.assist_ratio||0;
  let i3=0;
  if(hEFG!=null&&aEFG!=null) i3+=(hEFG>aEFG+.02?1:hEFG<aEFG-.02?-1:0);
  i3+=(hAR>aAR+5?1:hAR<aAR-5?-1:0);
  const wI3 = {score:i3>0?1:i3===0?.5:0, detail:'eFG:'+(hEFG!=null?(hEFG*100).toFixed(0):'?')+'–'+(aEFG!=null?(aEFG*100).toFixed(0):'?')+' AR:'+hAR.toFixed(0)+'–'+aAR.toFixed(0)};

  const hPts=hW.points||0, aPts=aW.points||0;
  const pDiff=hPts-aPts;
  const hBench=hW.bench_points||0, aBench=aW.bench_points||0;
  let i4=(Math.abs(pDiff)>4?(pDiff>0?1:-1):0);
  if(hBench>0||aBench>0) i4+=(hBench>aBench+4?1:hBench<aBench-4?-1:0);
  const wI4 = {score:i4>0?1:i4===0?.5:0, detail:'Window Δ:'+pDiff.toFixed(0)+' Bench:'+hBench.toFixed(0)+'–'+aBench.toFixed(0)};

  const hPoss=hW.possessions||0, aPoss=aW.possessions||0;
  let hEff=0,aEff=0;
  if(hPoss>0&&aPoss>0){ hEff=hPts/hPoss; aEff=aPts/aPoss; }
  const effD=hEff-aEff;
  const wI5 = {score:effD>0.06?1:effD<-0.06?0:.5, detail:'Eff:'+hEff.toFixed(2)+'–'+aEff.toFixed(2)+' Poss:'+hPoss.toFixed(0)+'–'+aPoss.toFixed(0)};

  const raw = wI1.score*W.I1 + wI2.score*W.I2 + wI3.score*W.I3 + wI4.score*W.I4 + wI5.score*W.I5;
  const controlHome = raw>=0.5;
  const score = controlHome?raw:1-raw;
  const controlTeam = controlHome?hA:aA;

  const missingFields = [];
  if(hW.points_in_the_paint===null) missingFields.push('paint');
  if(hW.field_goals_at_rim_att===null) missingFields.push('at_rim');
  if(hW.fast_break_points===null) missingFields.push('fbp');
  if(hW.possessions===null) missingFields.push('poss');

  return {
    available: true,
    windowQuarters: windowLabel,
    windowPossessions: (hPoss||0)+(aPoss||0),
    home: hW, away: aW,
    I1:wI1, I2:wI2, I3:wI3, I4:wI4, I5:wI5,
    score, controlTeam,
    dataQuality: missingFields.length>0?'PARTIAL':'FULL',
    missingFields,
    crossFade: true,
    completion: completion,
  };
}

// ── Gap Acceleration ─────────────────────────────────────────────────────────
function updateGapLog(gameId, floorScore, floorTeam, windowResult, game){
  const cs = cardState[gameId]; if(!cs) return;
  if(!cs.gapLog) cs.gapLog = [];
  if(!windowResult||!windowResult.available) return;

  const wScore = windowResult.score;
  const wTeam = windowResult.controlTeam;
  // Normalize: gap positive means window stronger for floor's control team
  let gap = 0;
  if(floorTeam === wTeam){ gap = wScore - floorScore; }
  else { gap = -(wScore + floorScore - 1); } // teams differ: divergence

  cs.gapLog.push({
    ts: Date.now(),
    period: game.period||0,
    clock: game.clock||'',
    floor: floorScore,
    floorTeam,
    window: wScore,
    windowTeam: wTeam,
    windowSize: windowResult.windowQuarters.length,
    gap: Math.round(gap*1000)/1000,
    score: (game.away?.alias||'?')+' '+(game.awayPoints||0)+'-'+(game.homePoints||0)+' '+(game.home?.alias||'?'),
  });

  // Cap log size
  if(cs.gapLog.length > 50) cs.gapLog = cs.gapLog.slice(-50);

  // Persist
  try{ localStorage.setItem('nba4:gap:'+gameId, JSON.stringify(cs.gapLog)); }catch(e){}
}

function computeAcceleration(gapLog){
  if(!gapLog||gapLog.length<1) return {accel:'TOO EARLY',entries:[],consecutive:0};

  // Filter to current window-size phase
  const currentSize = gapLog[gapLog.length-1].windowSize;
  const samePhase = gapLog.filter(e=>e.windowSize===currentSize);

  if(samePhase.length<2) return {accel:'TOO EARLY',entries:samePhase,consecutive:0};

  const recent = samePhase.slice(-4); // last 4 readings
  const deltas = [];
  for(let i=1;i<recent.length;i++) deltas.push(recent[i].gap - recent[i-1].gap);

  // Check if gap flipped sign
  const lastTwo = samePhase.slice(-2);
  if((lastTwo[0].gap>0.02 && lastTwo[1].gap<-0.02)||(lastTwo[0].gap<-0.02 && lastTwo[1].gap>0.02)){
    return {accel:'FLIPPED',entries:samePhase.slice(-5),consecutive:1};
  }

  // Count consecutive direction
  const threshold = 0.015;
  let growing=0, declining=0;
  for(let i=deltas.length-1;i>=0;i--){
    if(deltas[i]>threshold) growing++;
    else if(deltas[i]<-threshold) declining++;
    else break;
  }

  if(growing>=2) return {accel:'GROWING',entries:samePhase.slice(-5),consecutive:growing};
  if(declining>=2) return {accel:'DECLINING',entries:samePhase.slice(-5),consecutive:declining};

  // Check if phase just started (only 2-3 entries)
  if(samePhase.length<=3 && samePhase.length>=2 && gapLog.length>samePhase.length){
    return {accel:'NEW_PHASE',entries:samePhase,consecutive:0};
  }

  return {accel:'STABLE',entries:samePhase.slice(-5),consecutive:0};
}

// ── Sub-Metric Arrows ────────────────────────────────────────────────────────
function computeSubMetricArrows(gameId){
  const cs = cardState[gameId]; if(!cs) return null;
  const qs = cs.quarterSnapshots; if(!qs) return null;

  // Get ordered quarter numbers with data
  const qNums = Object.keys(qs.quarters).map(Number).sort((a,b)=>a-b);
  if(qNums.length<2) return null;

  const metrics = [
    {key:'paint', field:'points_in_the_paint', label:'Paint pts', indicator:'I2', threshold:3, structural:true},
    {key:'atRim', field:'field_goals_at_rim_att', label:'At-rim att', indicator:'I2', threshold:2, structural:true},
    {key:'fta', field:'free_throws_att', label:'FTA', indicator:'I2', threshold:2, structural:true},
    {key:'steals', field:'steals', label:'Steals', indicator:'I1', threshold:1, structural:true},
    {key:'tos', field:'turnovers', label:'TOs', indicator:'I1', threshold:1, structural:false}, // lower is better
    {key:'fg3aShare', field:'fg3a_share', label:'3PA%', indicator:'I3', threshold:5, structural:false}, // lower = less variance
    {key:'astRatio', field:'assist_ratio', label:'Ast ratio', indicator:'I3', threshold:8, structural:true},
    {key:'poss', field:'possessions', label:'Poss', indicator:'I5', threshold:2, structural:true},
  ];

  function computeArrow(values, threshold){
    const valid = values.filter(v=>v!=null);
    if(valid.length<2) return {arrow:null, values};
    const last3 = valid.slice(-3);
    if(last3.length<2) return {arrow:null, values:last3};
    const first=last3[0], last=last3[last3.length-1];
    const diff=last-first;
    // Monotonically rising
    let rising=true,falling=true;
    for(let i=1;i<last3.length;i++){
      if(last3[i]<last3[i-1]) rising=false;
      if(last3[i]>last3[i-1]) falling=false;
    }
    if(rising && diff>threshold) return {arrow:'RISING', values:last3};
    if(falling && Math.abs(diff)>threshold) return {arrow:'FALLING', values:last3};
    // Non-monotonic but directional
    if(last3.length>=3){
      if(last3[1]>first+threshold && last>first+threshold) return {arrow:'RISING', values:last3};
      if(last3[1]<first-threshold && last<first-threshold) return {arrow:'FALLING', values:last3};
    }
    return {arrow:'FLAT', values:last3};
  }

  const result = {home:{}, away:{}};
  ['home','away'].forEach(side=>{
    metrics.forEach(m=>{
      const vals = qNums.map(q=>qs.quarters[q]?.[side]?.[m.field]??null);
      const {arrow,values} = computeArrow(vals, m.threshold);
      const display = arrow ? (arrow==='RISING'?'▲':arrow==='FALLING'?'▼':'▬') : '—';
      const valStr = values.map(v=>v!=null?(m.field.includes('share')||m.field.includes('ratio')?v.toFixed(0)+'%':String(Math.round(v))):'?').join('→');
      result[side][m.key] = {arrow, values, display:display+' ('+valStr+')', label:m.label, indicator:m.indicator, structural:m.structural};
    });
  });

  return result;
}

function classifyAdjustment(arrows, controlTeam, hA, aA){
  if(!arrows) return {signal:'NO DATA',note:'Arrows unavailable'};
  const side = controlTeam===hA?'home':'away';
  const a = arrows[side];
  const risingStructural = ['paint','atRim','fta','steals'].filter(k=>a[k]?.arrow==='RISING').length;
  const fallingVariance = ['fg3aShare','tos'].filter(k=>a[k]?.arrow==='FALLING').length;
  const fallingStructural = ['paint','atRim','fta'].filter(k=>a[k]?.arrow==='FALLING').length;
  const risingVariance = ['fg3aShare','tos'].filter(k=>a[k]?.arrow==='RISING').length;

  if(risingStructural>=2 && fallingVariance>=1)
    return {signal:'INTERIOR PIVOT',note:'Progressive rim pressure replacing perimeter variance',risingStructural,fallingVariance,team:controlTeam};
  if(fallingStructural>=2)
    return {signal:'STRUCTURAL EROSION',note:'Interior game fading — structural edge at risk',fallingStructural,team:controlTeam};
  if(risingVariance>=1 && fallingStructural>=1)
    return {signal:'VARIANCE SHIFT',note:'Shifting to perimeter — production becoming less durable',risingVariance,fallingStructural,team:controlTeam};
  if(risingStructural>=2)
    return {signal:'STRUCTURAL ACCEL',note:'Multiple structural inputs compounding',risingStructural,team:controlTeam};
  return {signal:'NO ADJUSTMENT',note:'Shot diet stable',team:controlTeam};
}

// ── Combined Read Classification ─────────────────────────────────────────────
function classifyCombinedRead(floorScore, floorTeam, windowResult, accelResult){
  if(!windowResult||!windowResult.available) return {read:'TOO EARLY', note:'Window not yet available'};
  const wScore = windowResult.score;
  const wTeam = windowResult.controlTeam;
  const accel = accelResult?.accel||'STABLE';

  // If different teams control floor vs window
  if(floorTeam !== wTeam){
    if(accel==='FLIPPED') return {read:'FLIPPED', note:wTeam+' taking control from '+floorTeam};
    return {read:'SHIFT', note:'Floor: '+floorTeam+' / Window: '+wTeam+' — control contested'};
  }

  // Same team controls both
  if(floorScore>=0.75 && wScore>=0.80 && (accel==='GROWING'||accel==='STABLE'))
    return {read:'DOMINANT', note:'Structural edge compounding'};
  if(floorScore>=0.75 && wScore>=0.75)
    return {read:'STRONG', note:'Structural edge holding'};
  if(floorScore>=0.75 && wScore>=0.60 && wScore<0.75 && (accel==='DECLINING'||accel==='STABLE'))
    return {read:'ERODING', note:'Structure holds but momentum lost'};
  if(floorScore>=0.75 && wScore<0.60)
    return {read:'COLLAPSING', note:'Structural edge breaking down'};
  if(floorScore>=0.60 && floorScore<0.75 && wScore>=0.75 && accel==='GROWING')
    return {read:'EMERGING', note:'Edge strengthening toward confirmation'};
  if(floorScore>=0.60 && floorScore<0.75 && wScore>=0.60)
    return {read:'EARNED', note:'Modest edge, steady'};
  if(floorScore>=0.60 && floorScore<0.75 && wScore<0.60)
    return {read:'FADING', note:'Edge was real but dissipating'};
  if(floorScore<0.60 && wScore>=0.65 && accel==='GROWING')
    return {read:'SHIFT', note:'No cumulative edge but recent control emerging'};
  return {read:'NO EDGE', note:'Insufficient signal'};
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPUTE DISPATCH — routes to SR or BDL compute path
// ══════════════════════════════════════════════════════════════════════════════
function computeAny(game){
  if(game.dataSource==='BDL' && game.bdlData) return computeBDL(game);
  return compute(game);
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPUTE INDICATORS (BDL FORMAT) — Option B: separate path
// ══════════════════════════════════════════════════════════════════════════════
function computeBDL(game){
  const d = game.bdlData;
  if(!d || getState(game)==='PRE') return null;
  const hs = d.home, as = d.away;
  const hA = hs.alias||'HOME', aA = as.alias||'AWAY';
  const hS = d.homePoints||0, aS = d.awayPoints||0;

  // I1 — Possession & Transition (no chaos layer — forced/unforced TOs unavailable)
  const hGen = (hs.steals||0)+(hs.offensive_rebounds||0)-(hs.turnovers||hs.total_turnovers||0);
  const aGen = (as.steals||0)+(as.offensive_rebounds||0)-(as.turnovers||as.total_turnovers||0);
  const hConv = (hs.fast_break_points||0)+(hs.points_off_turnovers||0)+(hs.second_chance_points||0);
  const aConv = (as.fast_break_points||0)+(as.points_off_turnovers||0)+(as.second_chance_points||0);
  const i1 = (hGen>aGen?1:hGen<aGen?-1:0)+(hConv>aConv?1:hConv<aConv?-1:0);
  const I1={score:i1>0?1:i1===0?.5:0, leader:i1>0?hA:i1<0?aA:'EVEN',
    detail:`${hA} ${hs.steals||0}stl ${hs.offensive_rebounds||0}or ${hs.turnovers||hs.total_turnovers||0}to | ${aA} ${as.steals||0}stl ${as.offensive_rebounds||0}or ${as.turnovers||as.total_turnovers||0}to | Conv:${hConv}–${aConv} [no chaos layer]`};

  // I2 — Rim Pressure & Foul (paint + FTA + bonus from BDL — no at-rim splits)
  var hPaint = hs.points_in_the_paint||0, aPaint = as.points_in_the_paint||0;
  // PBP at-rim fallback when paint delayed
  var _pbpBdl = cardState[game.id]?.pbpAudit;
  if(_pbpBdl){
    if(!hPaint && _pbpBdl.home?.rim?.made) hPaint = _pbpBdl.home.rim.made * 2;
    if(!aPaint && _pbpBdl.away?.rim?.made) aPaint = _pbpBdl.away.rim.made * 2;
  }
  const hFTA = hs.free_throws_att||0, aFTA = as.free_throws_att||0;
  const hBlk = hs.blocks||0, aBlk = as.blocks||0;
  const rimScore = (hPaint+hFTA+hBlk)-(aPaint+aFTA+aBlk);
  const I2={score:rimScore>8?1:rimScore<-8?0:.5, leader:rimScore>8?hA:rimScore<-8?aA:'EVEN',
    detail:`Paint:${hPaint}–${aPaint} FTA:${hFTA}–${aFTA} BLK:${hBlk}–${aBlk}${d.homeBonus?' '+hA+'⬤':''}${d.awayBonus?' '+aA+'⬤':''} [no at-rim]`};

  // I3 — Shot Quality & Creation (full-game assist ratio only, no per-quarter trend)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const hEFG=(((hs.field_goals_made||0)+.5*(hs.three_points_made||0))/hFGA);
  const aEFG=(((as.field_goals_made||0)+.5*(as.three_points_made||0))/aFGA);
  const hAst=hs.assists||0, aAst=as.assists||0;
  const hFGM=hs.field_goals_made||1, aFGM=as.field_goals_made||1;
  const hAR=(hAst/hFGM)*100, aAR=(aAst/aFGM)*100;
  const i3=(hEFG>aEFG+.02?1:hEFG<aEFG-.02?-1:0)+(hAR>aAR+5?1:hAR<aAR-5?-1:0);
  const I3={score:i3>0?1:i3===0?.5:0, leader:i3>0?hA:i3<0?aA:'EVEN',
    detail:`eFG%:${(hEFG*100).toFixed(1)}–${(aEFG*100).toFixed(1)} AR:${hAR.toFixed(0)}–${aAR.toFixed(0)} AST:${hAst}–${aAst}`};

  // I4 — Lineup Integrity (score delta + quarters — no on_court, no per-Q plus/minus)
  const qDs = (d.quarters||[]).map(q=>(q.home_points||0)-(q.away_points||0));
  const trend = qDs.length>=2 ? qDs[qDs.length-1]-qDs[0] : 0;
  // No biggest_lead from BDL — use score differential as proxy
  const scoreDiff = Math.abs(hS-aS);
  const i4 = (scoreDiff>8&&hS>aS?1:scoreDiff>8&&aS>hS?-1:0)+(trend>2?1:trend<-2?-1:0);
  const I4={score:i4>0?1:i4===0?.5:0, leader:i4>0?hA:i4<0?aA:'EVEN',
    detail:`Δ:${hS>aS?'+':''}${hS-aS} trend:${trend>0?'+':''}${trend} ${qDs.map((dd,i)=>'Q'+(i+1)+':'+(dd>0?'+':'')+dd).join(' ')} [no lineup/bench split]`};

  // I5 — Tempo & Efficiency (derived from BDL offensive/defensive rating)
  const hOPPP = (hs.offensive_rating||0)/100, aOPPP = (as.offensive_rating||0)/100;
  const hDPPP = (hs.defensive_rating||0)/100, aDPPP = (as.defensive_rating||0)/100;
  const effD = (hOPPP-aDPPP)-(aOPPP-hDPPP);
  const hPoss = hs.possessions||0, aPoss = as.possessions||0;
  const I5={score:effD>0.08?1:effD<-0.08?0:.5, leader:effD>0.08?hA:effD<-0.08?aA:'EVEN',
    detail:`ORtg:${(hs.offensive_rating||0).toFixed(1)}–${(as.offensive_rating||0).toFixed(1)} DRtg:${(hs.defensive_rating||0).toFixed(1)}–${(as.defensive_rating||0).toFixed(1)} Poss:${hPoss}–${aPoss}`};

  const raw = I1.score*W.I1 + I2.score*W.I2 + I3.score*W.I3 + I4.score*W.I4 + I5.score*W.I5;
  const controlHome = raw>=.5, cTeam = controlHome?hA:aA, score = controlHome?raw:1-raw;

  // Trajectory — BDL partial (T4 and T7 unavailable)
  const traj = buildTrajectoryBDL(game, hA, aA, hs, as, hS, aS, qDs, d);

  return {I1,I2,I3,I4,I5, score, controlTeam:cTeam, dataQuality:'PARTIAL', traj};
}

function buildTrajectoryBDL(game, hA, aA, hs, as, hS, aS, qDs, d){
  const p = game.period||0;
  if(p<2) return {signals:[], lean:'NEUTRAL', count:0, total:0, tooEarly:true};
  const sigs = [], overall=hS-aS, currQ=qDs.length>0?qDs[qDs.length-1]:null;

  // T1 — BDL: no per-player live shooting available, use conversion fallback
  const bl = cardState[game.id]?.baselines;
  const hC=(hs.fast_break_points||0)+(hs.points_off_turnovers||0), aC=(as.fast_break_points||0)+(as.points_off_turnovers||0);
  if(Math.abs(hC-aC)>=10){const w=hC>aC?hA:aA;sigs.push({key:'T1*',w:1,team:w,color:'#ffd166',text:w+' conversion +'+(Math.abs(hC-aC))+' (FBP+POT) [BDL]'});}
  else sigs.push({key:'T1*',w:0,team:null,color:'#3e3e48',text:'Conversion flat ('+hC+'–'+aC+') [BDL]'});

  // T2 — BDL: no per-player live stats for star process check
  sigs.push({key:'T2*',w:0,team:null,color:'#555',text:'⊘ Unavailable (BDL — no per-player live stats)'});

  // T3 — Quarter Delta (available from BDL quarter scores)
  if(currQ!=null&&Math.abs(currQ)>=6){const w=currQ>0?hA:aA,tr=(currQ>0&&overall<0)||(currQ<0&&overall>0);sigs.push({key:'T3',w:2,team:w,color:'#00ff88',text:w+' winning Q'+p+' by '+Math.abs(currQ)+(tr?' (trailing—comeback)':'')});}
  else sigs.push({key:'T3',w:0,team:null,color:'#3e3e48',text:'Q delta <6 — neutral'});

  // T4 — UNAVAILABLE in BDL (no per-player per-quarter fouls)
  sigs.push({key:'T4',w:0,team:null,color:'#555',text:'⊘ Unavailable (BDL — no per-player fouls)'});

  // T5 — Interior Trend (paint points available)
  const hPaint=hs.points_in_the_paint||0, aPaint=as.points_in_the_paint||0;
  if(Math.abs(hPaint-aPaint)>=8){const w=hPaint>aPaint?hA:aA;sigs.push({key:'T5',w:1,team:w,color:'#a8ff78',text:w+' paint +'+(Math.abs(hPaint-aPaint))+' ('+hPaint+'–'+aPaint+')'});}
  else sigs.push({key:'T5',w:0,team:null,color:'#3e3e48',text:'Paint even ('+hPaint+'–'+aPaint+')'});

  // T6 — Assist Ratio (full-game only, no per-quarter)
  const hFGM=hs.field_goals_made||1,aFGM=as.field_goals_made||1;
  const hAR=(hs.assists||0)/hFGM*100, aAR=(as.assists||0)/aFGM*100;
  if(Math.abs(hAR-aAR)>=15){const w=hAR>aAR?hA:aA;sigs.push({key:'T6',w:1,team:w,color:'#a8ff78',text:w+' AR '+Math.max(hAR,aAR).toFixed(0)+'% vs '+Math.min(hAR,aAR).toFixed(0)+'%'});}
  else sigs.push({key:'T6',w:0,team:null,color:'#3e3e48',text:'AR even ('+hAR.toFixed(0)+'% vs '+aAR.toFixed(0)+'%)'});

  // T7 — UNAVAILABLE in BDL (no on_court flags)
  sigs.push({key:'T7',w:0,team:null,color:'#555',text:'⊘ Unavailable (BDL — no lineup data)'});

  // T8 — Shot Diet (team-specific thresholds when baselines available)
  const hFGA=hs.field_goals_att||1, aFGA=as.field_goals_att||1;
  const h3r=(hs.three_points_att||0)/hFGA*100, a3r=(as.three_points_att||0)/aFGA*100;
  const struct = cardState[game.id]?.structural;
  let hThr=40, aThr=40;
  if(bl && bl.built){
    hThr = (bl.teamSeason3PARate?.home||35) + (struct?.shotDiet?.home==='INTERIOR'?8:struct?.shotDiet?.home==='PERIMETER'?12:10);
    aThr = (bl.teamSeason3PARate?.away||35) + (struct?.shotDiet?.away==='INTERIOR'?8:struct?.shotDiet?.away==='PERIMETER'?12:10);
  }
  if(h3r>=hThr)sigs.push({key:'T8',w:1,team:aA,color:'#ff6b6b',text:hA+' 3PA/FGA '+h3r.toFixed(0)+'% vs '+hThr.toFixed(0)+'% threshold — MISALIGNED'});
  else if(a3r>=aThr)sigs.push({key:'T8',w:1,team:hA,color:'#ff6b6b',text:aA+' 3PA/FGA '+a3r.toFixed(0)+'% vs '+aThr.toFixed(0)+'% threshold — MISALIGNED'});
  else sigs.push({key:'T8',w:0,team:null,color:'#3e3e48',text:'Diet aligned ('+hA+' '+h3r.toFixed(0)+'% / '+aA+' '+a3r.toFixed(0)+'%)'});

  const lm={};sigs.forEach(s=>{if(s.team&&s.w>0)lm[s.team]=(lm[s.team]||0)+s.w;});
  const sorted=Object.entries(lm).sort((a,b)=>b[1]-a[1]),lean=sorted.length>0?sorted[0][0]:'NEUTRAL';
  const count=sigs.filter(s=>s.team===lean&&s.w>0).length,total=sigs.filter(s=>s.w>0).length;
  return {signals:sigs, lean, count, total, tooEarly:false};
}

// ══════════════════════════════════════════════════════════════════════════════
// STRUCTURAL ALERT — client-side, no Sonnet dependency
// Fires when structurally dominant team is trailing within a buyable range
// ══════════════════════════════════════════════════════════════════════════════
function checkStructuralAlert(game){
  var cs = cardState[game.id]; if(!cs) return;
  if(getState(game) !== 'LIVE') return;
  var p = game.period || 0;
  if(p < 2) return; // too early

  var floor = cs.sonnetIndicators || cs.clientInd;
  var win = cs.pbpWindow || cs.rollingWindow;
  if(!floor || !floor.score) return;

  var hA = game.home?.alias||'HOME', aA = game.away?.alias||'AWAY';
  var hS = game.homePoints || game.summary?.home?.points || 0;
  var aS = game.awayPoints || game.summary?.away?.points || 0;
  var fTeam = floor.controlTeam;
  var fScore = floor.score;

  // ── COMPOUND TRIGGER ──
  // 1. Floor must show real control
  if(fScore < 0.60) return;

  // 2. Control team must be trailing
  var ctrlIsHome = fTeam === hA;
  var ctrlPts = ctrlIsHome ? hS : aS;
  var oppPts = ctrlIsHome ? aS : hS;
  var deficit = oppPts - ctrlPts;
  if(deficit < 4) return;  // not meaningfully trailing
  if(deficit > 20) return; // garbage time

  // 3. Window agreement (if available)
  var wTeam = win && win.available ? win.controlTeam : null;
  var wScore = win && win.available ? win.score : null;
  var windowAgreement = wTeam === fTeam;
  var gap = (win && win.available && windowAgreement) ? (wScore - fScore) : 0;

  // 4. Determine alert level
  var level = null;
  if(windowAgreement && gap > 0.05 && fScore >= 0.70) level = 'STRONG';
  else if(windowAgreement && gap > 0 && fScore >= 0.65) level = 'MODERATE';
  else if(fScore >= 0.60 && (!win || !win.available || windowAgreement)) level = 'WATCH';
  else if(!windowAgreement && win && win.available) return; // floor/window disagree — skip

  if(!level) return;

  // 5. Hysteresis — 5 min cooldown per game per level
  if(!cs._structAlert) cs._structAlert = {};
  var cooldown = 5 * 60 * 1000; // 5 minutes
  var lastFire = cs._structAlert[level];
  if(lastFire && (Date.now() - lastFire) < cooldown) return;

  // ── BUILD ALERT ──
  var clock = game.clock || '';
  var qClock = 'Q' + p + (clock ? ' ' + clock : '');
  var score = aA + ' ' + aS + '-' + hS + ' ' + hA;

  // Spread info
  var spreadStr = '';
  var od = cs.oddsData || cachedOdds?.[game.id];
  if(od){
    var sp = ctrlIsHome ? od.homeSpread : od.awaySpread;
    if(sp != null) spreadStr = fTeam + ' ' + (sp > 0 ? '+' : '') + sp;
  }

  // Sustainability of leading team
  var sustStr = '';
  var sust = cs.clientSustainability;
  var _sa = cs.sustainabilityAudit;
  var _sustSource = sust || _sa;
  if(_sustSource){
    var leadSide = ctrlIsHome ? 'away' : 'home';
    var leadSust = _sustSource[leadSide];
    if(leadSust && leadSust.tier) sustStr = 'Lead sust: ' + leadSust.tier;
  }

  // Gap acceleration
  var accelStr = '';
  var accel = cs.acceleration;
  if(accel && accel.accel) accelStr = 'Accel: ' + accel.accel;

  var title = 'STRUCTURAL ' + level + ' — ' + fTeam + ' trailing by ' + deficit;
  var body = score + ' ' + qClock
    + '\nFloor: ' + fTeam + ' ' + fScore.toFixed(2)
    + (wScore ? ' | Window: ' + (wTeam||'?') + ' ' + wScore.toFixed(2) + ' (gap ' + (gap>=0?'+':'') + gap.toFixed(2) + ')' : '')
    + (spreadStr ? '\nSpread: ' + spreadStr : '')
    + (sustStr ? ' | ' + sustStr : '')
    + (accelStr ? ' | ' + accelStr : '');

  var priority = level === 'STRONG' ? 5 : level === 'MODERATE' ? 4 : 3;

  // Fire
  cs._structAlert[level] = Date.now();
  showAlert('entry', fTeam + ' structural ' + level + ' — trailing ' + deficit + ' ' + qClock);
  sendNtfyRaw(title, body, priority);
  console.log('%c🔔 STRUCTURAL ALERT: ' + title, 'color:#f5a62a;font-weight:bold');
  console.log(body);
}



// ── Pills ─────────────────────────────────────────────────────────────────
function renderPills(){
  const q=(document.getElementById('search').value||'').toUpperCase();
  const filtered=games.filter(g=>{
    if(!q)return true;
    return[g.home?.alias,g.away?.alias,g.home?.name,g.away?.name].some(s=>s?.toUpperCase().includes(q));
  });
  document.getElementById('pills').innerHTML=filtered.map(g=>{
    const gs=getState(g),sel=selIds.includes(g.id);
    const cls='pill'+(sel?' sel':gs==='LIVE'?' live':gs==='FINAL'?' done':'');
    let label=(g.away?.alias||'?')+'@'+(g.home?.alias||'?');
    if(gs==='LIVE') label+=' Q'+(g.period||'?');
    else if(gs==='FINAL') label+=' F';
    else try{label+=' '+new Date(g.scheduled).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Phoenix'});}catch(e){}
    return`<button class="${cls}" onclick="toggleGame('${g.id}')">${label}</button>`;
  }).join('');
  renderGrid();
}

function toggleGame(id){
  if(selIds.includes(id)) selIds=selIds.filter(x=>x!==id);
  else if(selIds.length<5) selIds.push(id);
  renderPills(); updateCounts();
}

function renderGrid(){
  const sel=games.filter(g=>selIds.includes(g.id));
  document.getElementById('empty').style.display=sel.length?'none':'block';
  document.getElementById('grid').style.display=sel.length?'grid':'none';
  sel.forEach(g=>{if(!document.getElementById('card-'+g.id))mountCard(g);});
  document.querySelectorAll('[id^="card-"]').forEach(el=>{
    const id=el.id.replace('card-','');
    if(!selIds.includes(id)){
      if(cardState[id]?._countdown)clearInterval(cardState[id]._countdown);
      // Preserve cardState in memory — mountCard will pick it up via prev
      el.remove();
    }
  });
}

function saveThesis(gameId,text){theses[gameId]=text;if(dbReady)fetch(FN+'db-api?action=save_thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:gameId,league:'nba',text:text})}).catch(function(){});try{localStorage.setItem('nba4:theses',JSON.stringify(theses));}catch(e){console.warn('Thesis persist failed:',e.message);}renderConfidenceTable();}
function clearTheses(){if(!confirm('Clear all theses?'))return;Object.keys(theses).forEach(k=>delete theses[k]);Object.keys(confCache).forEach(k=>delete confCache[k]);localStorage.removeItem('nba4:theses');localStorage.removeItem('nba4:confTable');games.filter(g=>selIds.includes(g.id)).forEach(g=>renderCard(g));renderConfidenceTable();}
function clearMarketCache(){if(!confirm('Clear all cached clutch + odds data?'))return;Object.keys(cachedClutch).forEach(k=>delete cachedClutch[k]);Object.keys(cachedOdds).forEach(k=>delete cachedOdds[k]);Object.keys(cachedOddsHistory).forEach(k=>delete cachedOddsHistory[k]);globalClutchData=null;localStorage.removeItem('nba4:clutch');localStorage.removeItem('nba4:odds');localStorage.removeItem('nba4:oddsHist');localStorage.removeItem('nba4:globalClutch');for(const id of selIds){const cs=cardState[id];if(cs){cs.clutchData=null;cs.clutchTier=3;cs.oddsData=null;cs.oddsHistory=[];}}games.filter(g=>selIds.includes(g.id)).forEach(g=>renderCard(g));}
function parseThesis(t){
  if(!t)return{lean:null,entry:null,pass:null,mlThreshold:null,watches:[],flags:[],shotDiet:null,heaterWatch:null,clutchGate:null};
  const r={lean:null,entry:null,pass:null,mlThreshold:null,watches:[],flags:[],shotDiet:null,heaterWatch:null,clutchGate:null};
  t.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const l=line.toLowerCase();
    if(l.startsWith('lean:'))r.lean=line.replace(/^lean:?\s*/i,'').trim();
    else if(l.startsWith('entry'))r.entry=line.replace(/^entry(?: trigger)?:?\s*/i,'').trim();
    else if(l.startsWith('pass'))r.pass=line.replace(/^pass(?: if)?:?\s*/i,'').trim();
    else if(l.startsWith('ml threshold'))r.mlThreshold=line.replace(/^ml\s*threshold:?\s*/i,'').trim();
    else if(l.startsWith('shot diet'))r.shotDiet=line.replace(/^shot\s*diet:?\s*/i,'').trim();
    else if(l.startsWith('3pt heater'))r.heaterWatch=line.replace(/^3pt\s*heater\s*watchlist:?\s*/i,'').trim();
    else if(l.startsWith('clutch gate'))r.clutchGate=line.replace(/^clutch\s*gate:?\s*/i,'').trim();
    else if(l.startsWith('watch:'))r.watches.push(line.replace(/^-?\s*watch:?\s*/i,'').trim());
    else if(l.startsWith('flag:')||l.startsWith('⚠')||l.startsWith('!'))r.flags.push(line.replace(/^[⚠!]\s*|^flag:?\s*/i,'').trim());
    else if(/^\d+\.\s+/.test(line))r.watches.push(line.replace(/^\d+\.\s+/,''));
  });
  // Try to extract ML value from threshold line (e.g., "CLE below -250 ML")
  if(r.mlThreshold){
    const mlMatch = r.mlThreshold.match(/below\s+([+-]?\d+)/i);
    if(mlMatch) r.mlValue = parseInt(mlMatch[1]);
  }
  return r;
}

    const hA = g.home?.alias||'HOME', aA = g.away?.alias||'AWAY';
    const matchup = aA + ' @ ' + hA;
    const state = getState(g);
    // Parse thesis baseline
    let team='', score=0, verdict='';
    const csMatch = t ? t.match(/CONTROL\s+SCORE:\s*(\w+)\s+([\d.]+)\s*[—–-]\s*(\w+)/i) : null;
    if(csMatch){ team=csMatch[1]; score=parseFloat(csMatch[2]); verdict=csMatch[3]; }
    const p = parseThesis(t);

    const cs = cardState[g.id];
    if(!cs?.sonnetIndicators && t){
      const thesisParsed = parseSonnetScores(t, hA, aA);
      if(thesisParsed){
        const Wt = {I1:0.25, I2:0.25, I3:0.20, I4:0.20, I5:0.10};
        const tRaw = thesisParsed.I1.score*Wt.I1 + thesisParsed.I2.score*Wt.I2 + thesisParsed.I3.score*Wt.I3 + thesisParsed.I4.score*Wt.I4 + thesisParsed.I5.score*Wt.I5;
        const tHome = tRaw >= 0.5;
        const tScore = tHome ? tRaw : 1 - tRaw;
        const tTeam = tHome ? hA : aA;
        // Use Sonnet's team call but client-computed weighted sum
        if(Math.abs(tScore - score) >= 0.03){
          if(cs && !cs._thesisRecomputeLogged && Date.now() - _lastThesisRecomputeLog > 30000){ console.log('THESIS RECOMPUTE: Sonnet stated ' + team + ' ' + score.toFixed(2) + ' | Client computed ' + tTeam + ' ' + tScore.toFixed(3)); cs._thesisRecomputeLogged = true; _lastThesisRecomputeLog = Date.now(); }
          team = tTeam; score = tScore; verdict = getVerdict(score)?.label || verdict;

      if(!siTeam || siTeam==='Neither' || siTeam==='EVEN'){
        var hVotes=0, aVotes=0;
        [si.I1,si.I2,si.I3,si.I4,si.I5].forEach(function(d){
          if(!d||d.leader==='EVEN') return;
          var lUp = (d.leader||'').toUpperCase().substring(0,3);

        });
        siTeam = hVotes>=aVotes ? hA : aA;

    }
    // ── FLOOR ENFORCEMENT — SIA guarantees minimum score for healthy team ──
    if(cs?.floorScores && team){
      const teamUp = team.toUpperCase();
      const isHome = teamUp === hA.toUpperCase() || teamUp.includes(hA.toUpperCase().substring(0,3));
      const floor = isHome ? cs.floorScores.home : cs.floorScores.away;
      if(floor && score < floor.floor){

        score = floor.floor;

      }
    }
    const pred = cs?.prediction;

      + '<td style="font-size:6px;text-align:center">'+tsStr+'</td>'

  }

  } // end if(!confCollapsed)

// ── CONFIDENCE TABLE BATCH ACTIONS ──
function ctRefreshAll(){
  let count = 0;
  for(const g of games){
    if(selIds.has(g.id) && getState(g)==='LIVE'){
      fetchSummary(g);
      count++;
    }
  }
  if(count) console.log('CT REFRESH: triggered '+count+' live games');
}

async function ctAnalyzeAll(){
  const targets = [];
  for(const g of games){
    if(selIds.has(g.id) && getState(g)==='LIVE' && theses[g.id]){
      const cs = cardState[g.id];
      if(cs && !cs.analyzing) targets.push(g);
    }
  }
  if(!targets.length) return;
  console.log('CT ANALYZE ALL: queuing '+targets.length+' games');
  // Stagger calls to avoid API flooding — 2s between each
  for(let i=0; i<targets.length; i++){
    triggerAnalysis(targets[i]);
    if(i < targets.length-1) await new Promise(r=>setTimeout(r,2000));
  }
}

function crossRef(parsed,ind){
  if(!parsed||!ind||!parsed.watches.length)return[];
  const a=[],txt=parsed.watches.join(' ').toLowerCase();
  if((txt.includes('turnover')||txt.includes('to rate'))&&ind.I1)
    a.push(ind.I1.score===0?{msg:'⚠ Turnover concern confirmed — I1 flagged',level:'warn'}:{msg:'✓ Turnover rate holding — I1 intact',level:'ok'});
  if((txt.includes('paint')||txt.includes('interior')||txt.includes('rim'))&&ind.I2)
    a.push(ind.I2.score===1?{msg:'✓ Interior edge confirmed — I2 developing',level:'ok'}:ind.I2.score===0?{msg:'⚠ Interior edge denied',level:'warn'}:{msg:'I2 contested',level:'info'});
  if((txt.includes('assist')||txt.includes('creation'))&&ind.I3)
    a.push(ind.I3.score===1?{msg:'✓ Ball movement confirmed — I3 developing',level:'ok'}:{msg:'⚠ Creation edge not materializing',level:'warn'});
  if((txt.includes('bonus')||txt.includes('foul'))&&ind.I2)
    a.push({msg:'Foul/bonus: '+ind.I2.detail,level:'info'});
  return a;
}

      html+='</div>';
      // Narrative
      html+='<div style="font-size:6.5px;color:var(--t1);line-height:1.5;margin-bottom:4px">'+esc(synth.narrative)+'</div>';
      // Triggers
      if(synth.triggers.length > 0){
        html+='<div style="font-size:5.5px;color:var(--t3)">';
